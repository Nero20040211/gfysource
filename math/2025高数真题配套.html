  <script type="application/json" id="course-data">{"meta":{"title":"重庆专升本高数 · 真题配套学习","date":"2026-10-09","scope":"真题主线＋关联拓展","content_hash":"73a601534472ba7b800ccbeb4030b44393cdb7ffbac5e2b1a78049b9be85f703"},"sources":[{"id":"exam","title":"2025年重庆市专升本高数真题","path":"2025年重庆市专升本高数真题.pdf","pages":2},{"id":"answers","title":"2025年重庆专升本高数真题答案解析","path":"2025年重庆专升本高数真题答案解析.pdf","pages":6},{"id":"s1","title":"第一章：函数，极限和连续","path":"第一章：函数，极限和连续.pdf","pages":27},{"id":"s2","title":"第二章：导数与微分","path":"第二章：导数与微分.pdf","pages":24},{"id":"s3","title":"第三章：微分中值定理与导数的应用","path":"第三章：微分中值定理与导数的应用.pdf","pages":25},{"id":"s4","title":"第四章：不定积分","path":"第四章：不定积分.pdf","pages":16},{"id":"s5","title":"第五章：定积分","path":"第五章：定积分.pdf","pages":19},{"id":"s6","title":"第六章：微分方程","path":"第六章：微分方程.pdf","pages":14}],"modules":[{"id":"m01","title":"函数、极限与连续","topic_ids":["t01","t02","t03","t04"]},{"id":"m02","title":"导数与微分","topic_ids":["t05","t06"]},{"id":"m03","title":"中值定理与导数应用","topic_ids":["t07","t08","t09"]},{"id":"m04","title":"不定积分","topic_ids":["t10","t11"]},{"id":"m05","title":"定积分","topic_ids":["t12","t13","t14"]},{"id":"m06","title":"微分方程","topic_ids":["t15","t16","t17"]},{"id":"m07","title":"空间解析几何","topic_ids":["t18","t19"]},{"id":"m08","title":"多元函数微分","topic_ids":["t20","t21"]},{"id":"m09","title":"二重积分","topic_ids":["t22","t23"]},{"id":"m10","title":"无穷级数","topic_ids":["t24","t25"]},{"id":"m11","title":"线性代数","topic_ids":["t26","t27","t28"]},{"id":"m12","title":"概率基础","topic_ids":["t29","t30"]}],"topics":[{"id":"t01","module":"m01","title":"定义域与函数性质","prerequisites":"会解不等式；理解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>；知道 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","intuition":"函数性质是对整个定义域作出的判断。检查一个点只能提供反例，不能证明全局性质；判奇偶性之前必须先检查定义域是否关于原点对称。","sections":[{"title":"定义域先于化简","body":"函数给每个允许的自变量指定唯一函数值。分母不能为零，实数范围内偶次根号内非负，对数真数为正。化简后表达式相同，也必须保留原式的限制。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 只在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，不能因此把原函数的定义域补成全体实数。"},{"title":"奇偶、有界、周期分别怎样证明","body":"在对称定义域上，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为偶函数，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为奇函数；恒零函数可同时是奇、偶函数。有界要求存在同一个常数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><\/mrow><\/math> 使所有允许的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 都满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><\/mrow><\/math>。周期要求存在固定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，使定义域在平移下适用且恒有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>T<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。三种性质不能相互替代。"},{"title":"考试中的检验顺序","body":"先看定义域，再代 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>，随后根据所问性质找全局恒等式或反例。乘积的奇偶性来自符号相乘：奇乘奇为偶，奇乘偶为奇。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 使振幅增长，不能因为出现正弦就判为周期或有界。"}],"examples":[{"title":"标准题型1：乘积的奇偶性","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math> 上的性质。","steps":["定义域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>，关于原点对称。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故为偶函数。","取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>n<\/mi><mi>&#x003C0;<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，故无界。连续周期函数必有界，因此本函数也不是周期函数。"],"answer":"偶函数；无界且非周期。","pitfall":"正弦的有界性不等于与它相乘的任意函数仍有界。","level":"标准例题"},{"title":"定义域限制会改变奇偶判断","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 是否为偶函数？","steps":["由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 得定义域 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0222A;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","该定义域关于原点对称，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","虽然定义域不是一个完整区间，奇偶性定义仍然适用。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 是偶函数。","pitfall":"不要误认为偶函数必须在原点有定义。","level":"拔高与边界变式"}],"boundaries":["只在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 上给出的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，按该定义域不能判为偶函数。","“取几个点成立”不足以证明恒等式；证明无界可构造趋于无穷的函数值序列。"],"citations":[{"source":"s1","locator":"PDF第3—6页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"偶函数关于纵轴对称\"><title>偶函数关于纵轴对称<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M30 140H590 M310 25V255\" stroke=\"#82938e\"/><polyline points=\"50.00,167.94 52.17,172.43 54.33,176.76 56.50,180.93 58.67,184.91 60.83,188.71 63.00,192.32 65.17,195.72 67.33,198.92 69.50,201.90 71.67,204.67 73.83,207.22 76.00,209.55 78.17,211.65 80.33,213.52 82.50,215.16 84.67,216.57 86.83,217.74 89.00,218.69 91.17,219.42 93.33,219.91 95.50,220.18 97.67,220.23 99.83,220.07 102.00,219.69 104.17,219.11 106.33,218.33 108.50,217.35 110.67,216.18 11 mn>1<\/mn><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>e<\/mi><\/mrow><\/math>，要求在实数范围内底数在附近为正。等价写法为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mi>e<\/mi><\/mrow><\/math>。"},{"title":"指数型的通用入口","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mi>L<\/mi><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>v<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><mo>&#x02192;<\/mo><msup><mi>e<\/mi><mi>L<\/mi><\/msup><\/mrow><\/math>。理由是取对数后，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>v<\/mi><mi>u<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><mo>&#x02192;<\/mo><mi>L<\/mi><\/mrow><\/math>，再由指数函数连续性还原。不能只把括号内看成趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 就得出极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。"},{"title":"怎样减少代换错误","body":"先标出小量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math>，再写清 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mi>u<\/mi><\/mrow><\/math> 的极限。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>b<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mi>x<\/mi><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math>。对于分母同时趋零的三角比，要先拆成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 与常数系数，而不是漏掉 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>。"}],"examples":[{"title":"真题第1题：无穷远处的振荡小量","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mi>x<\/mi><mi>sin<\/mi><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","原式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mfrac><mrow><mi>sin<\/mi><mi>u<\/mi><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，由重要极限得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"把趋零与趋无穷因子合并成重要极限。"},{"title":"真题第9题：有界量除以无穷大量","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mfrac><mrow><mi>cos<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mfrac><mrow><mi>cos<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mfrac><mrow><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，两端均趋于零。","由夹逼定理，极限为零。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","pitfall":"振荡因子自身没有极限。"}],"boundaries":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>u<\/mi><mi>&#x0007E;<\/mi><mi>u<\/mi><\/mrow><\/math> 要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，不能用于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>。","实数幂取对数前必须确认底数为正。"],"citations":[{"source":"s1","locator":"PDF第10页"},{"source":"exam","locator":"第1题，试卷PDF第1页"},{"source":"answers","locator":"第1题，解析PDF第1页"},{"source":"exam","locator":"第9题，试卷PDF第2页"},{"source":"answers","locator":"第9题，解析PDF第2页"},{"source":"exam","locator":"第13题，试卷PDF第2页"},{"source":"answers","locator":"第13题，解析PDF第3页"}],"figure":null},{"id":"t03","module":"m01","title":"等价无穷小与泰勒展开","prerequisites":"能识别 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 型；理解幂次大小：当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 比 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 更小。","intuition":"高阶抵消题要找“抵消后第一个没有消失的项”。只保留最先一项，可能把真正决定答案的项一起丢掉。","sections":[{"title":"等价替换的含义与位置","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mi>&#x0007E;<\/mi><mi>g<\/mi><\/mrow><\/math> 表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>f<\/mi><\/mrow><mrow><mi>g<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，不是两函数处处相等。常见模型为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>tan<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。在乘除结构中可按条件替换；在减法中若主项抵消，逐项替换会丢失高阶信息。"},{"title":"保留到所需阶数","body":"在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>u<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo>&#x0002B;<\/mo 唯一。"},{"title":"拉格朗日定理","body":"去掉端点值相等条件，保留前两项，则存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 使 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BE;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。几何上有一条切线平行于端点连成的割线。罗尔定理是割线斜率为零的特殊情形。"},{"title":"如何用于唯一性与不等式","body":"若假设函数有两个不同零点，罗尔定理会推出两点之间有导数为零的点；若已知导数处处正或处处负，就产生矛盾。证明函数严格单调也可由拉格朗日定理：对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>，中值点处导数的符号决定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的符号。"}],"examples":[{"title":"找出中值点","prompt":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>1<\/mn>< <mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 端点相等，是否必有内部点导数为零？","steps":["端点值同为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，并且函数连续。","但在内部点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 不可导，罗尔定理条件不全。","其余内部点的导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，确实没有导数为零的点。"],"answer":"不能使用罗尔定理，也没有这样的点。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["定理结论不能代替对条件的核对。","证明至多一个根仍需另外证明至少一个根。"],"citations":[{"source":"s3","locator":"PDF第1—2页"}],"figure":null},{"id":"t08","module":"m03","title":"单调性、极值与唯一根","prerequisites":"会求导、解导数零点、判断符号；会用零点定理建立存在性。","intuition":"导数符号告诉函数朝哪个方向走。极值关心某点两侧方向是否改变；唯一根关心整个指定定义域是否始终同向。","sections":[{"title":"单调性的判定","body":"在区间内若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，函数严格递增；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，严格递减。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 只直接保证不减；要进一步断言严格递增，应排除非退化区间上恒为零等情况。函数定义域若分成互不相连的区间，不能只分别判导数就自动宣称整个定义域严格递增。"},{"title":"极值与最值","body":"可导内点取得极值时必有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，但驻点不一定是极值点。导数由正变负为极大，由负变正为极小；不变号则不是极值。闭区间最值要比较内部候选点和两个端点，不能只找驻点。"},{"title":"唯一根的完整模板","body":"令方程左边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math>。先在某个闭区间检查连续和异号，得到至少一个根；再在题设整个定义域证明严格单调，得到至多一个根。两部分合并才能得出有且仅有一个。对于指数加正系数一次项，导数常直接处处为正。"}],"examples":[{"title":"导数符号与方程根的唯一性","prompt":"继续证明 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的实根唯一。","steps":["前面已经由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 和连续性证明至少有一根。","对任意实数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 在整个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math> 严格递增，至多有一个零点。结合存在性得恰有一个实根。"],"answer":"有且仅有一个实根，且位于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"驻点不必是极值点","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 在零点是否有极值。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，故零点是驻点。","零点两侧导数均为正，函数由负值经过零继续增至正值。","零点不满足局部最大或最小的定义。"],"answer":"零点是驻点，但不是极值点。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["导数等于零只是可导内点取得极值的必要条件。","只证明在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 递增不能排除该区间外的其他根。"],"citations":[{"source":"s3","locator":"PDF第5—6、8—10页"},{"source":"exam","locator":"第10题，试卷PDF第2页"},{"source":"answers","locator":"第10题，解析PDF第2页"},{"source":"exam","locator":"第16题，试卷PDF第2页"},{"source":"answers","locator":"第16题，解析PDF第4页"}],"figure":null},{"id":"t09","module":"m03","title":"凹凸性与拐点","prerequisites":"会求二阶导数并作符号表；知道拐点要用平面坐标表示。","intuition":"拐点是弯曲方向改变的地方。二阶导数为零仅提供候选位置，真正决定拐点的是两侧弯曲方向是否改变。","sections":[{"title":"用明确的弯曲方向理解符号","body":"本资料把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 称为开口向上（通常中文教材称凹），<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 称为开口向下（凸）。不同资料的术语习惯可能不同，作答优先写二阶导数符号和图像方向，避免只记一个汉字。"},{"title":"拐点的检查流程","body":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><\/mrow><\/math>，找二阶导数为零或不存在的候选点；检查函数在候选点连续，比较两侧二阶导数符号或直接确认凹凸改变；最后代回 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 求纵坐标。并不是所有拐点都满足二阶导数为零，例如某些二阶导数不存在但图像连续且凹凸改变的点。"},{"title":"与极值分开","body":"极值由一阶导数在两侧的符号变化判断，拐点由凹凸变化判断。一个点可以是水平切线拐点，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 的原点；也可能有极值但不是拐点，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 的原点。"}],"examples":[{"title":"二阶导数变号与拐点判断","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math> 的拐点。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><mi>x<\/mi><\/mrow><\/math>，候选点为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，二阶导数负；当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，二阶导数正，且函数连续。","凹凸改变，代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 得拐点坐标。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/m <\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。公式应在相应的实数区间内使用。"},{"title":"已知积分反求函数","body":"若题目给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，两边对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求导，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。常数的导数为零，不能把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 留在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 中。线性性质允许拆和与提出常数，但通常不能把乘积的积分拆成两个积分的乘积。"}],"examples":[{"title":"由原函数求被积函数","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["原式要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。由原函数定义，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>。","使用乘积法则，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","积分常数的导数为零。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"幂公式的例外","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["分开为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0222B;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0222B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","第一项不能套 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 分母公式，因为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>；用对数公式。","结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，在不跨过零的区间上求导可复核。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["不定积分要写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>；定积分的最终数值不写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 的绝对值来自兼容正、负区间，不能无条件删去。"],"citations":[{"source":"s4","locator":"PDF第1—4页"}],"figure":null},{"id":"t11","module":"m04","title":"换元积分与分部积分","prerequisites":"会用链式法则和乘积求导；能识别表达式内层及其导数。","intuition":"换元法把复合结构改写成简单变量；分部积分把较难的乘积积分换成另一项更容易的积分。方法应让剩余计算变简单。","sections":[{"title":"换元法来自链式法则","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x0222B;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。实际计算先找内层及其导数；差一个常数因子可以补偿。换元后不要在同一个积分里混留 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math>。不定积分算完需换回原变量。"},{"title":"分部积分来自乘积微分","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mi>v<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math> 移项积分，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>v<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。选择 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math> 时考虑它求导后能否更简单；对数常作为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math>，多项式求导会降次。选择 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>v<\/mi><\/mrow><\/math> 时必须能求出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math>。只背顺序口诀而不看剩余积分是否容易，可能越算越复杂。"},{"title":"两种方法可以配合","body":"遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 优先凑 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 优先分部。先作结构判断，再计算；最终对结果求导复核。当题目是定积分，换元要同时改上下限，分部的边界项要在上下端点分别代值。"}],"examples":[{"title":"凑微分","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["内层为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，其导数正好是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>。令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","原积分变成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>cos<\/mi><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mi>u<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","换回原变量并检查求导。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"对数乘幂","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","steps":["取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","原积分 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","继续积分并补上常数，求导后两项附加的一次项相消。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["换元需要连同 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 一起变换，不能只替换函数的一部分。","分部积分第二项前的负号不能漏。"],"citations":[{"source":"s4","locator":"PDF第4—6页"},{"source":"exam","locator":"第5题，试卷PDF第1页"},{"source":"answers","locator":"第5题，解析PDF第1,2页"},{"source":"exam","locator":"第14题，试卷PDF第2页"},{"source":"answers","locator":"第14题，解析PDF第3页"}],"figure":null},{"id":"t12","module":"m05","title":"定积分性质与微积分基本定理","prerequisites":"会求原函数；理解带方向的积分区间；知道连续函数在闭区间有界。","intuition":"定积分累积带符号的微小贡献。原函数把这种累积转化为两个端点函数值的差。","sections":[{"title":"定积分与面积的区别","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 是带符号的累积；横轴上方贡献为正，下方为负。图形面积则应对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 积分，或在交点处分段取正。区间反向有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>b<\/mi><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>，同端点积分为零，区间可加。"},{"title":"牛顿—莱布尼茨公式","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 连续且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mi>f<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。先求原函数，再代上限减下限。原函数中的常数会相消，因此定积分结果不写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。连续是常用的充分条件，不是所有可积函数都必须连续。"},{"title":"对称性与比较","body":"在对称区间 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 上，可积奇函数积分为零；可积偶函数积分是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>。判断奇偶性要看整个被积函数。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>，积分非负；这能检查答案符号。积分中的哑变量名称不改变结果。"},{"title":"旋转体体积的圆盘法","body":"区域绕坐标轴旋转时，垂直于旋转轴的截面是圆盘或圆环。若绕 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴，截面半径为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x0003D;<\/mo><mi>&#x003C0;<\/mi><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>；绕 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 轴时使用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x0003D;<\/mo><mi>&#x003C0;<\/mi><msubsup><mo>&#x0222B;<\/mo><mi>c<\/mi><mi>d<\/mi><\/msubsup><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。椭圆 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math> 绕 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴旋转，取上半椭圆 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，积分范围为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。若半径平方是偶函数，可用对称性把积分化为两倍半区间积分。"}],"examples":[{"title":"用对称性减少计算","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>1<\/mn><\/mrow><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 为奇函数，在对称区间上的积分为零。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 为偶函数，其积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","代原函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\ 2<\/mn><\/msup><\/mrow><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>a<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>4<\/mn><mi>a<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mi>&#x003C0;<\/mi><mfrac><mrow><mi>a<\/mi><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>&#x003C0;<\/mi><mfrac><mrow><mi>a<\/mi><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"绕轴后用截面半径的平方；椭圆纵半轴 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 在体积中平方。"}],"boundaries":["上限减下限，不是大数减小数；区间方向决定符号。","奇偶性简化要求区间关于零对称。"],"citations":[{"source":"s5","locator":"PDF第1—5页"},{"source":"exam","locator":"第18题，试卷PDF第2页"},{"source":"answers","locator":"第18题，解析PDF第4,5页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"椭圆区域绕 x 轴旋转形成椭球体；垂直截面为半径 y(x) 的圆盘\"><title>椭圆区域绕 x 轴旋转形成椭球体；垂直截面为半径 y(x) 的圆盘<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M64 142H560\" stroke=\"#82938e\" stroke-width=\"2\"/><path d=\"M105 142 C160 74 228 54 310 54 C392 54 460 74 515 142 C460 210 392 230 310 230 C228 230 160 210 105 142Z\" fill=\"#d5e9dd\" stroke=\"#17675b\" stroke-width=\"3\"/><ellipse cx=\"310\" cy=\"142\" rx=\"10\" ry=\"88\" fill=\"#add7c3\" stroke=\"#17675b\" stroke-width=\"2\"/><path d=\"M310 142V54\" stroke=\"#b06e44\" stroke-width=\"3\"/ 8;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000B7;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>。","下限贡献为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mo>&#x000B7;<\/mo><mn>1<\/mn><\/mrow><\/math>。","合并即可；也可先积分成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 再求导复核。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>H<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 换成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 后，指数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>6<\/mn><\/msup><\/mrow><\/math>。","上下限相同时函数值可能为零，但在该点的导数仍需按完整公式求。"],"citations":[{"source":"s5","locator":"PDF第4—5页"}],"figure":null},{"id":"t14","module":"m05","title":"定积分分部积分与面积","prerequisites":"会用分部积分求原函数；会求曲线交点并比较上下位置。","intuition":"分部积分题的关键是把每个边界项算清；面积题的关键是让每一条窄条的贡献为正。","sections":[{"title":"定积分分部公式","body":"<math xmlns=\"http://www.w3.org/1998/Mat >&#x00029;<\/mo><\/mrow><\/math>。","倍数非零，两个向量均非零，所以平行。"],"answer":"平行，方向相反。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["向量平行可用整体倍数，零分量不影响该定义。","坐标点和方向向量虽然都写三个数，但在方程中的作用不同。"],"citations":[{"source":"exam","locator":"第3题，试卷PDF第1页"},{"source":"answers","locator":"第3题，解析PDF第1页"}],"figure":null},{"id":"t19","module":"m07","title":"空间直线的点向式与参数式","prerequisites":"能找到直线经过的点和非零方向向量；会判断向量成比例。","intuition":"参数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 表示沿方向前进多少倍。参数式对所有非零方向向量都适用，点向式则需要注意分母零分量。","sections":[{"title":"参数式是稳妥的统一形式","body":"过 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、方向 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">s<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn mathvariant=\"bold\">0<\/mn><\/mrow><\/math> 的直线写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>c<\/mi><mi>t<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02208;<\/mo><mi mat \"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求偏导，把独立变量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 视作常数；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math> 则反过来。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02202;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo>&#x02202;<\/mo><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>，而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02202;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo>&#x02202;<\/mo><mi>y<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。指数外层仍需要链式法则，不能把指数原样当常数。"},{"title":"区分独立变量与复合路径","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，在相应可微条件下 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><mrow><mi>d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。偏导数计算时固定另一坐标；沿路径求普通导数时，两坐标可能都随 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 变，两个问题不同。"},{"title":"检查遗漏的通道","body":"先画或写依赖关系：外层函数依赖哪些中间变量，每个中间变量又依赖谁。每条路径乘导数，最后相加。多元函数在一点存在两个偏导数，并不足以保证该点可微；后面使用全微分时要确认可微条件。"}],"examples":[{"title":"真题第16题：二元函数驻点分类","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mi>cos<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><msup><mi>e<\/mi><mi>y<\/mi><\/msup><\/mrow><\/math> 的极值。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>cos<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故驻点满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><mi>&#x003C0;<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","奇数倍 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><\/mrow><\/math> 时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，Hessian 对角元均为1、行列式为1，为极小点，值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>。","偶数倍 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><\/mrow><\/math> 时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，Hessian 行列式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/msup><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，为鞍点。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>k<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x003C0;<\/mi><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 处极小值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>k<\/mi><mi>&#x003C0;<\/mi><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为鞍点。","pitfall":"逐个分类驻点，不能把驻点等同于极值点。"},{"title":"沿路径的导数","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><mrow><mi>d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["偏导为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，路径导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math>。","链式法则得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><mrow><mi>d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math>，代入路径为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>。","直接代入得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>t<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>，求导也是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，可作交叉验证。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><mrow><mi>d<\/mi><mi>t<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 求偏导时，独立的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 为常数；沿 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的路径则不能视作常数。","偏导数符号 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02202;<\/mo><\/mrow><\/math> 与普通导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> 的使用对象不同。"],"citations":[{"source":"exam","locator":"第16题，试卷PDF第2页"},{"source":"answers","locator":"第16题，解析PDF第4页"}],"figure":null},{"id":"t21","module":"m08","title":"全微分与局部线性近似","prerequisites":"会计算两个一阶偏导数；理解一元微分是增量的一阶主部。","intuition":"全微分把两个独立方向的一阶变化相加。它给出局部平面的近似，需要比“偏导数存在”更强的可微条件。","sections":[{"title":"公式和条件","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 在一点可微，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。若偏导数在该点某邻域内存在且在该点连续，这是保证可微的常用充分条件。由多项式、指数等光滑函数在其定义域内复合得到的本卷函数可直接满足这种条件。"},{"title":"写出全微分的三步","body":"先分别计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>x<\/mi><\/msub><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math>，再各乘相应的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，最后相加。题目问 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><\/math> 不能只写两个偏导，也不能把它写成两个偏导数相乘。若要求在指定点的微分，应把偏导系数代入该点，保留 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。"},{"title":"近似与边界","body":"可微时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mi>&#x00394;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mi>&#x00394;<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msqrt><mrow><mi>&#x00394;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x00394;<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。仅有偏导存在不保证可微：令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>x<\/mi><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>（非原点）、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，在原点由两个坐标轴方向的差商可得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，但沿 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 趋近时函数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，连连续性都不满足。"}],"examples":[{"title":"多元函数的全微分","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><\/math>。","steps":["该函数由光滑函数复合而成，一阶偏导连续，故可微。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>。","各乘对应微分并相加，保留两部分。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><msup><mi  stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>0.02<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.02<\/mn><\/mrow><\/math>。","新值近似 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2.02<\/mn><\/mrow><\/math>；实际值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1.01<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>1.98<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2.019798<\/mn><\/mrow><\/math>，差异来自二阶及以上项。"],"answer":"新值约为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2.02<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["多元偏导存在不能直接推出可微。","全微分是局部线性主部，不能把有限增量一律写成严格相等。"],"citations":[],"figure":null},{"id":"t22","module":"m09","title":"二重积分与直角坐标区域","prerequisites":"会算一元定积分；会在平面上读出直线与曲线的交点。","intuition":"二重积分把整个区域分成很多小块，累加“每单位面积的量乘面积”。化为累次积分后，外层变量决定一条切片，内层变量扫过该切片。","sections":[{"title":"二重积分的量","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math> 中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math> 是平面区域，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math> 是微小面积元。取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 得面积；取面密度 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><\/mrow><\/math> 得质量；被积函数若可为负，结果是带符号的累积，不能直接称面积或质量。"},{"title":"从区域写出上下限","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow
