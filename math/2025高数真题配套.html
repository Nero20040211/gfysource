/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，不是单纯 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。直观上小扇形的两边长度近似为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>r<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>；雅可比行列式的绝对值也为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>。"},{"title":"区域决定积分界限","body":"以原点为圆心、半径 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 的圆盘可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>；同心圆环改为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>b<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>；扇形还要限制角度。不要把所有圆形区域都积分一整周。若密度只依赖 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，角积分能直接提出扇形角度。"},{"title":"质量模型","body":"质量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mi>&#x003C1;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math>。依次替换区域、密度、面积元；例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math> 变成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>，再乘面积元中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，径向幂次才变成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>7<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。三部分任何一项漏换都会改变结果。"}],"examples":[{"title":"极坐标建模例题：分数幂密度","prompt":"以原点为圆心、半径 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 的圆盘薄片，密度 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>，求质量。","steps":["圆盘取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>，密度变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>R<\/mi><\/msubsup><msup><mi>r<\/mi><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><mo>&#x000B7;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>R<\/mi><\/msubsup><msup><mi>r<\/mi><mrow><mfrac><mrow><mn>7<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><mi>d<\/mi><mi>r<\/mi><\/mrow><\/math>。","幂次加一为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>10<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>&#x003C0;<\/mi><mo>&#x000B7;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>10<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>R<\/mi><mrow><mfrac><mrow><mn>10<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><msup><mi>R<\/mi><mrow><mfrac><mrow><mn>10<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"圆环不能从零积分","prompt":"圆环 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02264;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math>，密度 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，求质量。","steps":["平方半径范围给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>，角度是一整周。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mn>2<\/mn><\/msubsup><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><mo stretchy=\"false\">[<\/mo><mfrac><mrow><msup><mi>r<\/mi><mn>4<\/mn><\/msup><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><msubsup><mo stretchy=\"false\">]<\/mo><mn>1<\/mn><mn>2<\/mn><\/msubsup><\/mrow><\/math>。","代入得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>16<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；若把下限写零，会多算中心圆盘。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mn>15<\/mn><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["密度变换后的幂次和面积元半径要分别写出。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 对应 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>，不能误写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02264;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。"],"citations":[{"source":"exam","locator":"第4题，试卷PDF第1页"},{"source":"answers","locator":"第4题，解析PDF第1页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"极坐标小面元随半径变宽，面积元包含半径因子\"><title>极坐标小面元随半径变宽，面积元包含半径因子<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M170 210H520 M170 210V30\" stroke=\"#82938e\"/><path d=\"M170 210L428 87 A285 285 0 0 1 448 147Z\" fill=\"#e5eee8\"/><path d=\"M386 107 A240 240 0 0 1 405 157 L448 147 A285 285 0 0 0 428 87Z\" fill=\"#add7c3\" stroke=\"#17675b\" stroke-width=\"2\"/><path d=\"M210 210 A40 40 0 0 0 206 192\" stroke=\"#b06e44\" fill=\"none\"/><text x=\"264\" y=\"148\">r<\/text><text x=\"425\" y=\"175\">dr<\/text><text x=\"390\" y=\"52\">弧长约为 r dθ<\/text><text x=\"50\" y=\"262\">小扇形面积约为径向宽度乘弧长：r dr dθ<\/text><\/svg>"},{"id":"t24","module":"m10","title":"级数通项、等比级数与p级数","prerequisites":"理解数列极限；会计算有限等比数列和；区分通项与部分和。","intuition":"无穷级数的收敛看的是部分和是否趋于一个有限值。每一项越来越小是必要条件，却不足以保证无穷多项累加后有限。","sections":[{"title":"收敛的定义与必要条件","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>，定义部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>N<\/mi><\/mrow><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><\/mrow><\/math> 趋于有限值，就称级数收敛。因为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>，收敛必有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。逆命题不成立；调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的通项趋零但级数发散。"},{"title":"两个基准级数","body":"等比级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><msup><mi>q<\/mi><mi>n<\/mi><\/msup><\/mrow><\/math> 当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 时收敛，和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>q<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02265;<\/mo><mn>1<\/mn><\/mrow><\/math> 时发散。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 当且仅当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 时收敛。特别地 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 发散，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 也发散。"},{"title":"振荡项的检查与资料修正","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mfrac><mrow><mi>n<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，偶数项趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，奇数项趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，所以原通项极限不存在，更不趋零。它的绝对值才趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。所附解析把去掉符号后的幅值极限称作通项极限，结论虽为发散，理由应按这里修正。"}],"examples":[{"title":"真题第6题：正项极限比较","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的敛散性。","steps":["通项正，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>lim<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。","它与调和级数正项极限比较，故同敛散。","调和级数发散，原级数也发散。"],"answer":"发散。","pitfall":"比较时保留原通项并求比值极限。"},{"title":"真题第21题：裂项级数的部分和","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mi>a<\/mi><\/mrow><\/math>，证明 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mo>&#x0221E;<\/mo><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 收敛并求和。","steps":["部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mi>N<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><mo>&#x02192;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x02192;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math>。","部分和有有限极限，因此级数收敛且和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math>。"],"answer":"收敛，和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math>。","pitfall":"有限部分和的末项是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mi>N<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>。"}],"boundaries":["不能由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 直接判收敛。","交错符号不自动带来收敛；首先必须满足通项趋零。"],"citations":[{"source":"exam","locator":"第6题，试卷PDF第1页"},{"source":"answers","locator":"第6题，解析PDF第2页"},{"source":"exam","locator":"第21题，试卷PDF第2页"},{"source":"answers","locator":"第21题，解析PDF第6页"}],"figure":null},{"id":"t25","module":"m10","title":"比较、比值与根值判别","prerequisites":"熟悉正项级数；会算数列比值及 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根的极限。","intuition":"判别法选择依赖通项结构：有整体的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次幂优先考虑根值，有阶乘或指数与多项式的积商优先考虑比值。","sections":[{"title":"比较判别","body":"对非负项，如果从某项起 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02264;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛；如果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 发散，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 发散。不能把这两个方向反用。删改有限项不改变敛散性。"},{"title":"比值与根值","body":"正项级数若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo>lim<\/mo><msub><mi>u<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> 存在，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 收敛，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math>（含正无穷）发散；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 不作结论。根值判别使用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mroot><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><mi>n<\/mi><\/mroot><\/mrow><\/math>，结论相同。对一般实项可对绝对值使用，小于1时得到绝对收敛；本卷重点是正项情形。"},{"title":"把有限项与长期行为分开","body":"真题通项前面很多项可能很大，但根值最终趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，仍收敛。收敛并不意味着前几项小，也不意味着容易算出级数和。求敛散性与求和是不同任务。比值或根值等于1时应换方法，不能猜测。"}],"examples":[{"title":"标准题型16：整体n次幂","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><msup><mo stretchy=\"false\">]<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>。","steps":["通项为正，取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根后指数消去：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><mi>n<\/mi><\/mroot><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","分子分母同除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math>，极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","根值极限严格小于1，级数收敛；前面有限个大项不影响结论。"],"answer":"收敛。","pitfall":"","level":"标准例题"},{"title":"判别值等于1时不能下结论","prompt":"比较 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 的比值判别结果。","steps":["对第一项族，比值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>n<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。","对第二项族，比值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。","两个比值极限都是1，但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 级数标准分别给出发散与收敛，所以比值为1确实无法判定。"],"answer":"第一者发散，第二者收敛；比值法在这里均无结论。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["根值法只取通项的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根，不是对整个无穷和开根。","用判别法后写明极限与阈值1的关系。"],"citations":[{"source":"exam","locator":"第6题，试卷PDF第1页"},{"source":"answers","locator":"第6题，解析PDF第2页"}],"figure":null},{"id":"t26","module":"m11","title":"行列式性质与不可逆条件","prerequisites":"会二阶行列式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>d<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><\/math>；了解矩阵由行和列组成，行列式是一个数。","intuition":"先观察行列关系，常能避免展开。成比例的两列代表同一方向的重复信息，行列式为零。","sections":[{"title":"常用性质","body":"行列式要求方阵。交换两行使值变号；一行乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 使值乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>；一行加另一行的倍数，值不变。列也有对应性质。两行或两列相同、成比例，或有一整行/列为零，行列式都为零。"},{"title":"三阶展开与可逆","body":"沿第一行展开为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mrow><mn>13<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>13<\/mn><\/mrow><\/msub><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><\/mrow><\/math> 是余子式。三阶矩阵可逆当且仅当行列式非零；不可 003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>27<\/mn><\/mrow><\/math>。","不可逆等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["行列式展开前先找零行、比例行列和可简化的行列变换。","行变换对行列式的影响不同，不能把所有初等变换都说成值不变。"],"citations":[{"source":"exam","locator":"第11题，试卷PDF第2页"},{"source":"answers","locator":"第11题，解析PDF第3页"},{"source":"exam","locator":"第19题，试卷PDF第2页"},{"source":"answers","locator":"第19题，解析PDF第5页"}],"figure":null},{"id":"t27","module":"m11","title":"逆矩阵与独立复核","prerequisites":"会矩阵乘法；知道单位矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math> 对角为1、其余为0；会算行列式。","intuition":"逆矩阵把矩阵作用还原。计算结束后与原矩阵相乘得到单位矩阵，能够直接发现许多符号和转置错误。","sections":[{"title":"存在条件与定义","body":"方阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 的逆 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>I<\/mi><\/mrow><\/math>。存在逆等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>。矩阵乘法通常不交换，不能把数的除法法则直接照搬；记号 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 也不是逐元素取倒数。"},{"title":"两种计算方法","body":"伴随法为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mfrac><mrow><mo>&#x0002A;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/mfrac><\/msup><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> 是代数余子式矩阵的转置，转置不能漏。更适合系统计算的方法是在增广矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>I<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 上只做初等行变换，把左边化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math>，右边就变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>；左右必须同步变换。"},{"title":"验算和表达","body":"建议保持分数精确值，减少小数舍入。把候选逆矩阵记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math>，逐行乘逐列检查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>I<\/mi><\/mrow><\/math>；方阵情形该检查可确认逆。若中途发现行列式为零，应停止求逆并说明不存在，不能继续除以零。"}],"examples":[{"title":"真题第7题：乘积矩阵求逆","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><\/mrow><\/math> 同阶可逆，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><msup><mo stretchy=\"false\">&# ;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","第二行是第一行的2倍，行信息重复。","由可逆条件，逆不存在；不能对四个元素逐个取倒数。"],"answer":"不可逆。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["伴随矩阵要把代数余子式矩阵转置。","初等行变换求逆时，不能对右边单独作列变换。"],"citations":[{"source":"exam","locator":"第7题，试卷PDF第1页"},{"source":"answers","locator":"第7题，解析PDF第2页"}],"figure":null},{"id":"t28","module":"m11","title":"矩阵秩与含参线性方程组","prerequisites":"会线性方程代入；会增广矩阵；理解自由参数可取任意实数。","intuition":"消元逐步找出真正独立的约束。剩余没有主元的未知数成为自由变量，每个自由变量产生一个可自由改变的方向。","sections":[{"title":"只对增广矩阵作行变换","body":"把方程组写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。交换方程、方程乘非零常数、一个方程加另一个方程的倍数都不改变解集。行阶梯形中的非零行数为秩；非主元列对应自由变量。不要对增广矩阵任意作列变换，因为那会改变未知数的含义。"},{"title":"有解条件与自由维数","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则无解；秩相同才有解。对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 个未知数，有解时自由参数个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。当秩等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 时解唯一；少于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 时有无穷多解。方程条数不能直接当作秩，可能存在重复约束。"},{"title":"通解的结构及核验","body":"非齐次通解可写为 <math xmlns=\"http://www.w3.org/ \"2.047em\" maxsize=\"2.047em\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。两种方法必须用相同的等可能样本描述，不能把有序分子与无序分母混合。"},{"title":"用补事件处理至少一次","body":"“至少一次成功”通常可写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mtext>一次也没有<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。不放回时，失败后剩余失败数也减少；放回时在等可能独立重复抽取假设下，各次成功概率保持不变。是否放回是建模条件，不是可以忽略的措辞。"}],"examples":[{"title":"真题第8题：独立转盘上的奇数","prompt":"两个转盘的等面积扇区分别标 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mo>&#x0002C;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mn>8<\/mn><mo>&#x0002C;<\/mo><mn>9<\/mn><\/mrow><\/math>。独立转动，求两指针均落奇数区的概率。","steps":["每个转盘有3/5的区域标奇数。","两次转动独立，所求概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"分别统计两个转盘的奇数扇区，再使用独立性。"},{"title":"不放回与放回抽取的区别","prompt":"5张卡中有2张奖卡，不放回抽2张，求至少抽到一张奖卡的概率；再与放回抽取比较。","steps":["不放回时两次均无奖的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo stretchy=\" hy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"不能把互不相连区间上的同向单调性直接合并成整个定义域的单调性。"},{"id":"p10","module":"m04","level":"引导练习","topic_ids":["t10"],"prompt":"求不定积分 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><\/mrow><\/math>，并对结果求导检验。","hint":"积分可逐项进行。注意余弦求导带负号，因此负正弦的原函数是正余弦。","steps":["由线性性质，把积分拆成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0222B;<\/mo><mi>sin<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><\/mrow><\/math>。","幂函数项的原函数是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，三角项的原函数是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","合并并补上任意常数，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>cos<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>；求导恢复 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>cos<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"不定积分应包含任意常数；正弦与余弦的符号通过求导复核最稳妥。"},{"id":"p11","module":"m04","level":"独立练习","topic_ids":["t11"],"prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><\/mrow><\/math>。解释换元后为何还需要分部积分。","hint":"先把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 设为新变量，剩下的是对数积分；对数积分可写成对数与一的乘积。","steps":["令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00064;<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><\/mrow><\/math>，原积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>&#x0222B;<\/mo><mi>ln<\/mi><mi>u<\/mi><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>u<\/mi><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>ln<\/mi><mi>u<\/mi><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>u<\/mi><\/mrow><\/math> 分部积分：把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>u<\/mi><\/mrow><\/math> 求导，把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00064;<\/mi><mi>u<\/mi><\/mrow><\/math> 积分，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mi>ln<\/mi><mi>u<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mn>1<\/mn><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>ln<\/mi><mi>u<\/mi><mo>&#x02212;<\/mo><mi>u<\/mi><\/mrow><\/math>。","换回原变量，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo stretchy=\"false\">[<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","求导时两个额外的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 项相消，留下原被积函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"换元时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mi>&#x00064;<\/mi><mi>u<\/mi><\/mrow><\/math>；不要漏掉二分之一，也不要在最终答案中混用两个变量。"},{"id":"p12","module":"m04","level":"迁移练习","topic_ids":["t10"],"prompt":"有人写出“对一切 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mfrac><mn>1<\/mn><mi>x<\/mi><\/mfrac><mspace width=\"0.167em\" /><mi>&#x00064;<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>”。指出定义域问题并改正。如果同时在正、负两个半轴定义原函数，两边的常数必须相同吗？","hint":"实对数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 只在正半轴有定义。负半轴可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；两个分离区间之间没有连续性条件来关联常数。","steps":["在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 上，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 的导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，原写法在该区间成立。","在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 上，应用链式法则，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，故原函数可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","两个半轴是分离的区间，可以分别加任意常数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>；不存在跨过零点的区间要求它们相等。","通常在任一不跨零的区间上统一记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>；若讨论整个去掉零点的定义域，应允许每个分支各自选常数。"],"answer":"正半轴为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>，负半轴为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 可独立选择。","pitfall":"绝对值用于扩展对数原函数的实数适用区间；它不使被积函数在零点获得定义。"},{"id":"p13","module":"m05","level":"引导练习","topic_ids":["t13"],"prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<       if (active.length) {
        globalClock.href = "#paper/" + encodeURIComponent(active[0].id);
        globalClock.textContent = active[0].id + " 卷剩余 " + formatClock(active[0].deadline - now);
      }
    }
    function tick() {
      Object.keys(attempts).forEach(function (id) {
        if (shouldAutoSubmit(attempts[id], Date.now())) submit(id, "timeout");
      });
      updateClocks();
    }
    function refreshBadge(id, number) {
      var attempt = attempts[id], badge = main.querySelector('[data-response-badge="' + number + '"]');
      if (badge) badge.textContent = String(attempt.responses[number] == null ? "" : attempt.responses[number]).trim() ? "已作答" : "未作答";
      var count = main.querySelector('[data-response-count="' + id + '"]');
      if (count) count.textContent = responseCount(papers[id], attempt);
      var saved = main.querySelector('[data-save-paper="' + id + '"]');
      if (saved) saved.textContent = storageAvailable ? "已保存" : "仅本次会话";
    }
    function refreshQuestionScore(id, number) {
      var attempt = attempts[id], q = papers[id].questions.find(function (item) { return item.number === Number(number); });
      if (!attempt || !q || (!attempt.submitted && !attempt.revealed[number])) return;
      var item = scoreAttempt(papers[id], attempt).items.find(function (item) { return item.number === Number(number); });
      var status = main.querySelector('[data-score-status="' + number + '"]');
      if (status) {
        status.textContent = item.score === null ? "待自评" : item.score + " / " + q.points + " 分";
        var reason = status.parentElement.querySelector("span");
        if (reason) reason.textContent = item.reason;
      }
      if (q.type === "single") {
        main.querySelectorAll('input[name="response-' + id + '-' + number + '"]').forEach(function (radio) {
          var label = radio.closest("label"), correct = Number(radio.value) === q.correct;
          label.classList.toggle("correct-option", correct);
          if (correct && !label.querySelector(".correct-label")) {
            var marker = document.createElement("span"); marker.className = "correct-label";
            marker.textContent = "正确"; label.appendChild(marker);
          }
        });
      }
    }
    function revealQuestion(id, number) {
      var attempt = attempts[id]; if (!attempt || attempt.mode !== "practice" || attempt.submitted) return;
      if (!String(attempt.responses[number] == null ? "" : attempt.responses[number]).trim()) {
        var message = main.querySelector('[data-question-message="' + number + '"]');
        if (message) message.textContent = "先写下答案或解题思路，再展开解析。";
        return;
      }
      attempt.revealed[number] = true; save("attempt." + id, attempt);
      var q = papers[id].questions.find(function (item) { return item.number === number; });
      var region = main.querySelector('[data-question-result="' + number + '"]');
      if (region) region.innerHTML = renderQuestionResult(id, q);
      var button = main.querySelector('[data-action="question-reveal"][data-number="' + number + '"]');
      if (button) { button.disabled = true; button.textContent = "解析已展开"; }
      refreshQuestionScore(id, number); updateSummary(id);
    }
    main.addEventListener("input", function (event) {
      var element = event.target, id = element.dataset.paper, number = element.dataset.response;
      if (number != null && attempts[id] && !attempts[id].submitted) {
        if (shouldAutoSubmit(attempts[id], Date.now())) { submit(id, "timeout"); return; }
        if (element.type === "radio" && !element.checked) return;
        attempts[id].responses[number] = element.value; save("attempt." + id, attempts[id]);
        if (element.type === "radio") {
          main.querySelectorAll('input[name="' + element.name + '"]').forEach(function (radio) {
            radio.closest("label").classList.toggle("selected", radio.checked);
          });
        }
        refreshBadge(id, number);
        if (attempts[id].mode === "practice" && attempts[id].revealed[number]) {
          refreshQuestionScore(id, number); updateSummary(id);
        }
      } else if (element.dataset.selfScore != null && attempts[id]) {
        var qnumber = Number(element.dataset.selfScore), attempt = attempts[id];
        if (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[qnumber])) return;
        var q = papers[id].questions.find(function (item) { return item.number === qnumber; });
        var read = readScore(element.value, q.points);
        var message = document.getElementById("score-message-" + id + "-" + qnumber);
        element.setAttribute("aria-invalid", read.ok ? "false" : "true");
        if (message) message.textContent = read.ok ? "留空为待评；零为已评零分。" : read.error;
        if (!read.ok) {
          delete attempt.selfScores[qnumber]; save("attempt." + id, attempt);
          updateSummary(id); refreshQuestionScore(id, qnumber); return;
        }
        if (read.value === null) delete attempt.selfScores[qnumber]; else attempt.selfScores[qnumber] = read.value;
        save("attempt." + id, attempt); updateSummary(id);
        refreshQuestionScore(id, qnumber);
      } else if (element.dataset.practiceResponse) {
        var pid = element.dataset.practiceResponse;
        practiceProgress[pid] = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        practiceProgress[pid].response = element.value; save("practices", practiceProgress);
        var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
