  <script type="application/json" id="course-data">{"meta":{"title":"重庆专升本高数 · 真题配套学习","date":"2026-10-10","scope":"2023逐题考点＋同考点递进训练","content_hash":"bf478bf6f2d6908ee2916c467e3579526ac86427f2805fed062021a4f9271b4a"},"sources":[{"id":"exam","title":"2023年重庆市专升本高数真题（回忆版）","path":"2023年重庆市专升本高数真题.pdf","pages":7},{"id":"answers","title":"2023年重庆市专升本《高等数学》真题答案解析","path":"2023年重庆市专升本《高等数学》真题答案解析.pdf","pages":7},{"id":"s1","title":"第一章：函数，极限和连续","path":"第一章：函数，极限和连续.pdf","pages":27},{"id":"s2","title":"第二章：导数与微分","path":"第二章：导数与微分.pdf","pages":24},{"id":"s3","title":"第三章：微分中值定理与导数的应用","path":"第三章：微分中值定理与导数的应用.pdf","pages":25},{"id":"s4","title":"第四章：不定积分","path":"第四章：不定积分.pdf","pages":16},{"id":"s5","title":"第五章：定积分","path":"第五章：定积分.pdf","pages":19},{"id":"s6","title":"第六章：微分方程","path":"第六章：微分方程.pdf","pages":14}],"modules":[{"id":"m01","title":"极限与连续","topic_ids":["t01","t09","t13"]},{"id":"m02","title":"可导性与最值证明","topic_ids":["t02","t21"]},{"id":"m03","title":"空间直线","topic_ids":["t03"]},{"id":"m04","title":"一元积分","topic_ids":["t04","t15"]},{"id":"m05","title":"微分方程","topic_ids":["t05","t14"]},{"id":"m06","title":"无穷级数与幂级数","topic_ids":["t06","t16"]},{"id":"m07","title":"多元函数微分","topic_ids":["t10","t18"]},{"id":"m08","title":"二重积分","topic_ids":["t17"]},{"id":"m09","title":"线性代数","topic_ids":["t07","t11","t19","t20"]},{"id":"m10","title":"概率","topic_ids":["t08","t12"]}],"topics":[{"id":"t01","module":"m01","title":"函数在一点的连续性与间断点分类","prerequisites":"会求左右极限，知道定义域、函数值和极限是不同对象。","intuition":"判断间断点时，先问函数在该点是否定义，再问两侧各自趋向什么，最后把极限与函数值比较。单独算出一个有限极限，只完成了其中一步。","sections":[{"title":"连续的三个检查","body":"函数在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 连续，要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 有定义、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 存在，并且该极限等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。两侧极限相等才有两侧极限；只知道函数值不能替代极限。若端点只允许单侧接近，应按相应单侧连续讨论。"},{"title":"第一类：可去与跳跃","body":"若左右极限相等且有限，但函数值未定义或与极限不等，称为可去间断点。补定义为极限就能修复。若左右极限都有限而不相等，称为跳跃间断点；改变一个点的值不能使两侧接上。"},{"title":"第二类：无穷与振荡","body":"至少一个单侧极限不是有限值时，不属于第一类。无穷间断可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 理解；振荡间断可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 理解。有界振荡仍可能没有极限，所以“有界”不等于“极限存在”。"},{"title":"参数题怎样操作","body":"先算不含点值的去心极限，再与点值参数比较。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 在零点未定义，极限为零，是可去间断。C 卷的补定义问题需要区分“参数匹配时连续”和“参数不匹配时可去”，不能把零点一概当间断点。"}],"boundaries":["没有定义的点仍可有有限极限。","极限存在不代表已经连续；左右有限但不相等属于第一类跳跃间断。"],"examples":[{"title":"2023真题第1题 · 方法拆解","level":"真题精讲","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 是哪类间断点？<br>A. 可去<br>B. 跳跃<br>C. 无穷<br>D. 振荡","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，去心极限为 0。","零点未定义，左右有限极限相等；补定义 f(0)=0 即连续，所以是可去间断。"],"answer":"A；可去","pitfall":"没有定义的点仍可有有限极限。"},{"title":"同考点原创例题","level":"原创例题","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 是哪类间断点？<br>A. 跳跃间断点<br>B. 无穷间断点<br>C. 可去间断点<br>D. 振荡间断点","steps":["零点未定义。","由指数基本极限，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。","补定义 f(0)=2 即连续，故为可去间断点。"],"answer":"C；可去间断点","pitfall":"极限存在不代表已经连续；左右有限但不相等属于第一类跳跃间断。"}],"citations":[{"source":"exam","locator":"PDF物理第1页，第1题"},{"source":"answers","locator":"PDF物理第1页，第1题"},{"source":"s1","locator":"PDF第3、13页；资料印刷第3、13页：连续与间断点"}],"figure":"<svg viewBox=\"0 0 620 285\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"间断点的定义、左右极限与点值检查\"><title>间断点的定义、左右极限与点值检查<\/title><rect width=\"620\" height=\"285\" rx=\"12\" fill=\"#f3f7f5\"/><g font-family=\"Microsoft YaHei,Arial\" font-size=\"17\" fill=\"#234439\"><rect x=\"17\" y=\"38\" width=\"184\" height=\"145\" rx=\"10\" fill=\"#d9e9df\"/><text x=\"29\" y=\"72\" font-weight=\"bold\">可去<\/text><text x=\"29\" y=\"112\">左右极限相同<\/text><text x=\"29\" y=\"146\">点值未定义或不等<\/text><rect x=\"218\" y=\"38\" width=\"184\" height=\"145\" rx=\"10\" fill=\"#d9e9df\"/><text x=\"230\" y=\"72\" font-weight=\"bold\">跳跃<\/text><text x=\"230\" y=\"112\">左右极限有限<\/text><text x=\"230\" y=\"146\">但二者不同<\/text><rect x=\"419\" y=\"38\" width=\"184\" height=\"145\" rx=\"10\" fill=\"#d9e9df\"/><text x=\"431\" y=\"72\" font-weight=\"bold\">无穷／振荡<\/text><text x=\"431\" y=\"112\">至少一侧没有<\/text><text x=\"431\" y=\"146\">有限的单侧极限<\/text><text x=\"31\" y=\"226\">连续还要求：极限存在且等于该点函数值<\/text><text x=\"31\" y=\"257\">先检查定义，再检查左右极限，最后比较点值<\/text><\/g><\/svg>"},{"id":"t02","module":"m02","title":"可导与连续、单侧导数及参数衔接","prerequisites":"知道差商是函数增量除以自变量增量，会处理分段式。","intuition":"连续表示函数值接得上，可导还要求两侧斜率接得上。对一元函数，可导一定连续；反向不能仅靠连续性完成。","sections":[{"title":"导数定义","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>lim<\/mo><mrow><mi>h<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，存在指有限的两侧极限。可分别求左右导数；它们都有限且相等时，才有通常的导数。差商里的 h 有正负，绝对值在两侧的处理不同。"},{"title":"可导为什么推出连续","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>h<\/mi><mfrac><mrow><mo>&#x000B7;<\/mo><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，差商趋有限值而 h 趋零，所以函数增量趋零，函数在该点连续。这说明“连续”是“可导”的必要条件；不可导不能反推出不连续。"},{"title":"反例与充要条件","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 在零点连续，左导数 -1、右导数 1，故不可导。分段函数必须先按题目定义使用同一个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；求左右差商后得到的参数等式才是可导的条件。例如零点两侧线性首项系数分别为 a,b，通常需要 a=b。"},{"title":"高于一阶的小量","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>p<\/mi><\/msup><\/mrow><\/math> 在零点的右差商为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>h<\/mi><mrow><mi>p<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>、左差商为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mi>p<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 时可导且导数零；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时形成尖点；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>p<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 时有限导数不存在。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 则虽连续，差商仍振荡。解题要看差商，不能只看函数值极限。"}],"boundaries":["注意问的是“连续是可导的条件”，不是反向问法。","连续只给出函数值的衔接，不能保证左右斜率相同。"],"examples":[{"title":"2023真题第2题 · 方法拆解","level":"真题精讲","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 连续是它在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 可导的什么条件？<br>A. 必要不充分<br>B. 充分不必要<br>C. 充要<br>D. 既不必要也不充分","steps":["可导推出连续：函数增量等于差商乘自变量增量，后者趋零。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 在零点连续但不可导，所以连续不充分。","结论为必要不充分条件；所附解析“可导不一定连续”为笔误。"],"answer":"A；必要不充分","pitfall":"注意问的是“连续是可导的条件”，不是反向问法。"},{"title":"同考点原创例题","level":"原创例题","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;<\/mo><mtable><mtr><mtd columnalign=\"left\"><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><\/mtd><mtd columnalign=\"left\"><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><mn>0<\/mn><mo>&#x0002C;<\/mo><\/mtd><mtd columnalign=\"left\"><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mtd><\/mtr><\/mtable><\/mrow><\/mrow><\/math> 在零点<br>A. 连续但不可导<br>B. 连续且可导<br>C. 不连续但可导<br>D. 不连续且不可导","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，故在零点连续。","零点差商等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，其极限不存在。","因此连续但不可导。"],"answer":"A；连续但不可导","pitfall":"连续只给出函数值的衔接，不能保证左右斜率相同。"}],"citations":[{"source":"exam","locator":"PDF物理第1页，第2题"},{"source":"answers","locator":"PDF物理第1页，第2题"},{"source":"s2","locator":"PDF第1—3页；资料印刷第28—30页：导数定义与单侧导数"}],"figure":null},{"id":"t03","module":"m03","title":"空间直线：点、方向向量与零分量","prerequisites":"会做三维向量减法，理解非零向量及参数。","intuition":"空间直线由一个点与一个非零方向确定。把参数看成沿方向走了多少步，三个坐标分别变化，就能避免对称式里坐标和符号的混乱。","sections":[{"title":"参数式与对称式","body":"过 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、方向 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">d<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>l<\/mi><mo>&#x0002C;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn mathvariant=\"bold\">0<\/mn><\/mrow><\/math> 的直线为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>l<\/mi><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>m<\/mi><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>n<\/mi><mi>t<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。三个方向分量均非零时，可消去参数得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>l<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>m<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>z<\/mi><mo>&#x02212;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。"},{"title":"两点确定方向","body":"过两个不同点 P,Q 的方向可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>P<\/mi><mi>Q<\/mi><\/mrow><mo>&#x02192;<\/mo><\/mover><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo>&#x02212;<\/mo><mi>P<\/mi><\/mrow><\/math>。所有非零倍数都表示同一方向，反向也表示同一直线。验证选项时应检查基点是否在候选线上以及候选方向是否与给定方向平行，不能只逐字比较。"},{"title":"方向含零分量","body":"若 l=0，则 x 恒为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，不能写分母为零的分式。若方向为 (0,0,1)，写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>t<\/mi><\/mrow><\/math> 最清晰。平面 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 的交线中，先解出 x=2,y=-1，z 是自由变量。"},{"title":"坐标、点号与线的判别","body":"原题方向 (3,2,1) 是 x,y,z 三个方向分量，不是线上点；过点 (1,2,3) 要用坐标减点坐标。原扫描重复写 y 的地方应校正为 z。两条方向平行的线可能不重合，只有再满足一个基点在另一条线上才是同一直线。"}],"boundaries":["方向向量各分量按 x,y,z 顺序对应。","点坐标用减号进入对称式；第三个坐标是 z，零方向分量要改用参数式。"],"examples":[{"title":"2023真题第3题 · 方法拆解","level":"真题精讲","prompt":"过点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 且平行于向量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/ ;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，非零方向向量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","由参数式消去参数，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>z<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>1<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","原卷选项第三坐标误写为 y，此处按空间直线的 z 校正。"],"answer":"B；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><mrow><mn>1<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"方向向量各分量按 x,y,z 顺序对应。"},{"title":"同考点原创例题","level":"原创例题","prompt":"过点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 且平行于向量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>2<\/m i mathvariant=\"bold-italic\">d<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。","方向分量全非零，可将各坐标增量除以对应方向分量。","所得直线为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"B；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"点坐标用减号进入对称式；第三个坐标是 z，零方向分量要改用参数式。"}],"citations":[{"source":"exam","locator":"PDF物理第1页，第3题"},{"source":"answers","locator":"PDF物理第1页，第3题"}],"figure":null},{"id":"t04","module":"m04","title":"定积分的对称性、周期性与非负性","prerequisites":"知道定积分是数值，能判断函数奇偶性与区间。","intuition":"选择题经常只要求判断积分是否为零。先检查结构可以省下大部分计算，同时比直接找原函数更不容易丢符号。","sections":[{"title":"对称区间的公式与条件","body":"若 f 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 可积，奇函数满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>；偶函数满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。必须同时有对称区间与对应奇偶性，偶函数积分一般不等于零。"},{"title":"非负函数的正积分","body":"若连续函数 f 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 非负且某点取正值，则在一小段区间仍为正，因此积分严格为正。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>cos<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><\/mrow><\/math> 就可以这样判断。只有非负且恒为零才得到零积分；单个点取零不影响这个判断。"},{"title":"周期与常用恒等式","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 在一个整周期积分为零，因为正负部分抵消。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 可以写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。原题的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>cos<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><\/mrow><\/math> 用降幂式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>cos<\/mi><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>cos<\/mi><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 可算出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。周期性本身不意味着每个函数的整周期积分为零。"},{"title":"平移后的对称中心","body":"区间 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>c<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 关于 c 对称时，令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><\/mrow><\/math>。若平移后的表达式关于 t 是奇函数，积分为零。C 卷的中心为 1，不能仍按关于零的奇偶性判断。换元后上下限从原 x 的区间同步变成 t 的区间。"}],"boundaries":["C 的正值可由非负性判断，不必先求出数值。","偶函数的对称积分不一定为零；非负连续函数非恒零时积分严格为正。"],"examples":[{"title":"2023真题第4题 · 方法拆解","level":"真题精讲","prompt":"下列定积分不等于零的是<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>&#x003C0;<\/mi><\/msubsup><mi>cos<\/mi><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/msubsup><mi>sin<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msubsup><msup><mi>cos<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow y=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mi>x<\/mi><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，其中两个常数独立任意。"],"answer":"C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mi>x<\/mi><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","pitfall":"二阶通解需要两个独立常数；重根缺少 x 因子会丢失一个独立解。"}],"citations":[{"source":"exam","locator":"PDF物理第2页，第5题"},{"source":"answers","locator":"PDF物理第2页，第5题"},{"source":"s6","locator":"PDF第2—3页；资料印刷第113—114页：常系数齐次方程"}],"figure":null},{"id":"t06","module":"m06","title":"级数、比较判别与绝对／条件收敛","prerequisites":"会求数列极限，理解有界三角函数与 p 级数。","intuition":"级数关心部分和的极限，不是只问通项是否趋零。判断收敛类型时，本身的收敛与绝对值级数的收敛要分别检查。","sections":[{"title":"定义与必要条件","body":"级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，是部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mi>N<\/mi><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 趋于有限值。收敛必有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。反向不成立：调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 通项趋零但发散。通项不趋零可直接判发散，趋零后需继续判别。"},{"title":"p 级数与比较","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 当且仅当 p&gt;1 收敛。最终非负通项满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02264;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且较小者发散，则较大者发散。比较方向必须与要证明的结论一致。"},{"title":"绝对与条件收敛","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 收敛称为绝对收敛，并推出原级数收敛。原级数收敛、绝对值级数发散才称条件收敛。交错级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><msub><mi>a<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math>、最终单调不增且趋零时收敛；还要另查绝对值才能判断类型。"},{"title":"振荡因子和参数","body":"原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>sin<\/mi><mi>n<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 给出收敛上界。C 卷 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02264;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mi>cos<\/mi><mi>n<\/mi><mo>&#x02264;<\/mo><mn>3<\/mn><\/mrow><\/math>，既有正下界也有上界，所以与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 同敛散。当比值判别得到 1 时，该方法没有结论，不能当作发散；参数端点 p=1 需用比较或调和级数判断。"}],"boundaries":["含正弦的通项不自动表示条件收敛。","通项趋零仅为必要条件；比值极限为 1 时不能下敛散结论。"],"examples":[{"title":"2023真题第6题 · 方法拆解","level":"真题精讲","prompt":"级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>sin<\/mi><mi>n<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 的敛散性<br>A. 绝对收敛<br>B. 条件收敛<br>C. 发散<br>D. 不确定","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>sin<\/mi><mi>n<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>sin<\/mi><mi>n<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，右侧 p 级数收敛。","由比较判别，原级数绝对收敛。"],"answer":"A；绝对收敛","pitfall":"含正弦的通项不自动表示条件收敛。"},{"title":"同考点原创例题","level":"原创例题","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><msup><mi>sin<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>n<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 的敛散性为<br>A. 条件收敛<br>B. 绝对收敛<br>C. 发散<br>D. 敛散性不能判断","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02264;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>sin<\/mi><mn>2<\/mn><\/msup><mi>n<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>。","通项绝对值不超过 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，对应 p 级数收敛。","所以原级数绝对收敛。"],"answer":"B；绝对收敛","pitfall":"通项趋零仅为必要条件；比值极限为 1 时不能下敛散结论。"}],"citations":[{"source":"exam","locator":"PDF物理第2页，第6题"},{"source":"answers","locator":"PDF物理第2页，第6题"}],"figure":null},{"id":"t07","module":"m09","title":"可逆矩阵的消去与乘法次序","prerequisites":"认识单位矩阵、零矩阵、矩阵乘法和逆矩阵。","intuition":"矩阵的逆能还原它的作用，但必须在正确的一侧相乘。将普通数的交换规则直接搬过来，是这类题最常见的错误。","sections":[{"title":"逆的定义与存在条件","body":"n 阶方阵 A 可逆是存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 使 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。等价条件是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math>。零矩阵乘任意同型矩阵仍为零，但一般矩阵乘积为零不能推出某个因子为零。"},{"title":"左消去与右消去","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>C<\/mi><\/mrow><\/math> 且 A 可逆时，左乘逆得 B=C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><mi>A<\/mi><\/mrow><\/math> 则右乘逆得 B=C。原题 AB=O 通过左乘逆得到 B=O。若不可逆，不能使用逆来消去，结论可能失败。"},{"title":"求矩阵未知量","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>B<\/mi><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。两侧都有可逆因子时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>C<\/mi><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。先进行左消去，再进行右消去，每步保持中间乘积的原次序。"},{"title":"积的逆与反例意识","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>；因 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>，另一方向也成立。一般 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x02260;<\/mo><mi>B<\/mi><mi>A<\/mi><\/mrow><\/math>，不能据“看起来像相消”交换位置。判选项应问它是否对所有满足条件的矩阵都成立；给一个满足前提却推不出结论的例子就能反驳。"}],"boundaries":["AB=BA 本身没有对 C 的约束。","矩阵乘法通常不交换；不要把逆移到另一侧或改变乘积因子顺序。"],"examples":[{"title":"2023真题第7题 · 方法拆解","level":"真题精讲","prompt":"A,B,C 为同阶方阵，且 A 可逆。下列一定成立的是<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>C<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>B<\/mi><mo>&#x021D2;<\/mo><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><mo>&#x021D2;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><mi>A<\/mi><mo>&#x021D2;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><mi>B<\/mi><mo>&#x021D2;<\/mo><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><\/mrow><\/math>","steps":["在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><\/mrow><\/math> 两侧左乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。","得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>O<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><\/mrow><\/math>。","其余选项或消去结果错误，或擅自交换因子，或引入无关矩阵。"],"answer":"B；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><mo>&#x021D2;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>O<\/mi><\/mrow><\/math>","pitfall":"AB=BA 本身没有对 C 的约束。"},{"title":"同考点原创例题","level":"原创例题","prompt":"设 A、B 均可逆，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 等于<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>","steps":["计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。","反向乘积也等于 E。","因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>，顺序反转。"],"answer":"D；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>","pitfall":"矩阵乘法通常不交换；不要把逆移到另一侧或改变乘积因子顺序。"}],"citations":[{"source":"exam","locator":"PDF物理第2页，第7题"},{"source":"answers","locator":"PDF物理第2页，第7题"}],"figure":null},{"id":"t08","module":"m10","title":"方差的平移、数乘与独立线性组合","prerequisites":"理解方差描述离均值的平方偏离，知道独立随机变量。","intuition":"常数平移不会改变离散程度，数乘则把距离放大，平方距离因此按系数的平方改变。负系数也会平方。","sections":[{"title":"数乘与平移","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。可以从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 得到；平方并取期望就有 a²。期望的线性系数不平方，方差的系数要平方，两者不要混淆。"},{"title":"一般两变量公式","body":"在二阶矩存在时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>b<\/mi><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">v<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x0002C;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。独立可推出协方差零，因此独立情形最后一项消失。没有独立或不相关条件时，不能直接省略交叉项。"},{"title":"原题算法与符号","body":"原题 X,Y 独立，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>X<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>40<\/mn><\/mrow><\/math>。方差非负，得到负值应立即检查。加在组合外的常数不影响方差。"},{"title":"先还原到独立的变量","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><mo>&#x0003D;<\/mo><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>Y<\/mi><mo>&#x0002C;<\/mo><mi>V<\/mi><mo>&#x0003D;<\/mo><mi>X<\/mi><mo>&#x02212;<\/mo><mi>Y<\/mi><\/mrow><\/math>，即便 X,Y 独立，U,V 也未必独立。应先整理 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>U<\/mi><mo>&#x02212;<\/mo><mi>V<\/mi><mo>&#x0003D;<\/mo><mi>X<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>Y<\/mi><\/mrow><\/math>，再用原 X,Y 的独立性计算。这样不需要另算 U,V 的协方差，也不会误用独立公式。"}],"boundaries":["负系数不是方差中的减号。","负系数平方后为正；独立变量的两个组合通常不再独立。"],"examples":[{"title":"2023真题第8题 · 方法拆解","level":"真题精讲","prompt":"X,Y 相互独立，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>X<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 等于<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>32<\/mn><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>40<\/mn><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>29<\/mn><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><\/mrow><\/math>","steps":["独立时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>X<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>9<\/mn><mo>&#x000B7;<\/mo><mn>4<\/m 掌握 sin x/x 的基本极限和常见有界性。","intuition":"振荡函数本身可能没有极限，乘上趋零的系数后却能被压到零。先分清振荡的幅度和振荡的频率。","sections":[{"title":"夹逼定理","body":"若在去心邻域有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，且两边趋于同一有限值 L，则 f 也趋于 L。证明趋零时常写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。边界不等式应在邻域中成立，不能只比较个别点的数值。"},{"title":"有界函数乘无穷小","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>&#x003B1;<\/mi><mi>u<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>&#x003B1;<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 可取 M=1。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 不存在极限。"},{"title":"原题的因子拆分","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000B7;<\/mo><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。前一因子趋于 1，后一因子夹逼到 0。把有极限的平稳因子与振荡小量分开后，才能使用乘积极限法则。"},{"title":"分母阶数和混合主项","body":"若分子含平稳项和振荡项，先逐项分开。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>sin<\/mi><mo stretchy=\"fal ub><mi>u<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>。在偏导问题中不能擅自把 y 当成 x 的函数，这与隐函数求导不同。"},{"title":"全微分公式与条件","body":"若 u 在该点可微，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mi>x<\/mi><\/msub><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>y<\/mi><\/msub><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。偏导在邻域连续是可微的常用充分条件；本资料的初等函数在各自定义域内满足。仅有两个偏导存在的一般函数未必可微，不能脱离条件直接推广。"},{"title":"复合与分式项","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 时，两次偏导均要乘内层导数。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，x 偏导为 1/y，y 偏导为 -x/y²，同时要求 y≠0。写全微分时把两个系数分别用括号包住，避免 dx、dy 的归属不清。"},{"title":"结果的形式与复核","body":"先分别列 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>x<\/mi><\/msub><mo>&#x0002C;<\/mo><msub><mi>u<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math>，再按公式写 du。只给一个偏导、只给梯度向量、或丢掉微分符号，都没有完整回答 du。可分别固定一个变量变化，用一元微分检查对应项；等价且定义域正确的化简形式都可接受。"}],"boundaries":["全微分一般有 dx、dy 两项；求 x 偏导时 y 固定，不能把 y 当成 x 的函数。","全微分一般有 dx、dy 两项；求 x 偏导时 y 固定，不能把 y 当成 x 的函数。"],"examples":[{"title":"2023真题第10题 · 方法拆解","level":"真题精讲","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。","steps":["把另一个自变量固定，分别对 <math xmlns=\"http://www.w3.org/1998/Math/ <mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mi>y<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mi>y<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mi>y<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mi>y<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。","pitfall":"全微分一般有 dx、dy 两项；求 x 偏导时 y 固定，不能把 y 当成 x 的函数。"}],"citations":[{"source":"exam","locator":"PDF物理第3页，第10题"},{"source":"answers","locator":"PDF物理第3页，第10题"},{"source":"s2","locator":"PDF第4、6—7页；资料印刷第31、33—34页：求导与微分作为先修，二元部分为配套补充"}],"figure":null},{"id":"t11","module":"m09","title":"秩、自由变量与基础解系","prerequisites":"认识齐次方程组、主元、矩阵行列和线性独立。","intuition":"齐次方程组的解构成向量空间。每个主元限制一个方向，剩下的自由变量对应独立的解方向。","sections":[{"title":"基础解系与维数","body":"对有 n 个未知数的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，基础解系是解空间的一组基：向量线性独立且能生成全部解。其向量个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。n 等于 A 的列数；方程条数等于行数，不能替换。"},{"title":"非零解的条件","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>n<\/mi><\/mrow><\/math> 时至少有一个自由变量，存在非零解；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math> 时只有零解。解空间维数为一时，全部解仍可以有无穷多个，但基础解系只有一个向量。“全部解的个数”与“基向量个数”应分开。"},{"title":"消元怎样找基础解系","body":"化行阶梯形，确定主元变量与自由变量。依次让一个自由变量为 1、其余自由变量为 0，解出主元变量，得到一组独立解向量。它们的任意线性组合就是齐次通解。"},{"title":"含参数时先分类求秩","body":"消元产生 a−1 等主元时，先讨论参数是否使它为零。参数取临界值时，原来独立的行可能变成零行；随后重新计算秩与 n−r。C 卷有三列，非临界秩 2 时维数 1，临界秩 1 时维数 2。"}],"boundaries":["基础解系向量个数不是全部非零解的个数。","方程个数等于行数，不能拿行数代替未知数个数。"],"examples":[{"title":"2023真题第11题 · 方法拆解","level":"真题精讲","prompt":"齐次方程组 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，A 为 n 阶矩阵且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>n<\/mi><\/mrow><\/math>。基础解系中向量个数为多少？","steps":["齐次解空间维数等于未知数数目减去主元数。","未知数 n 个，主元数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故向量个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>","pitfall":"基础解系向量个数不是全部非零解的个数。"},{"title":"同考点原创例题","level":"原创例题","prompt":"齐次线性方程组有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math> 个未知数，系数矩阵秩为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>。基础解系含多少个向量？","steps":["基础解系维数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","所求向量个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>","pitfall":"方程个数等于行数，不能拿行数代替未知数个数。"}],"citations":[{"source":"exam","locator":"PDF物理第3页，第11题"},{"source":"answers","locator":"PDF物理第3页，第11题"}],"figure":null},{"id":"t12","module":"m10","title":"至少一次事件、独立性与可靠性模型","prerequisites":"理解并集、交集、对立事件和概率范围。","intuition":"至少一次成功包含多种情形，它的反面却只有全部失败这一种。独立条件让各次失败的联合概率可以写成乘积。","sections":[{"title":"事件的文字翻译","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示至少一个发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示两个同时发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> 表示两个都不发生。“至少一个”包括两个都发生，不能只加两个互斥的单独成功情形。"},{"title":"一般公式与独立条件","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。若 A,B 独立，才有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。互斥指不能同时发生，独立指发生与否不改变对方概率，两者是不同概念；两个正概率事件互斥时通常不独立。"},{"title":"多次独立成功公式","body":"相互独立的 m 次尝试，成功概率分别为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>p<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><mi>&#x02026;<\/mi><mo>&#x0002C;<\/mo><msub><mi>p<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math>，全部失败概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0220F;<\/mo><mrow><mi>i<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mi>m<\/mi><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，至少一次成功为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mo>&#x0220F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。同概率 p 时化成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><\/mrow><\/math>。传感器冗余可靠性是同一并事件模型。"},{"title":"原题欠缺的条件","body":"两次命中率均为 0.6，所附解析按独立算 0.84。若只给这两个边缘概率，则交概率可在 [0.2,0.6]，并概率在 [0.6,1]，结果并不唯一。配套模拟题明确独立条件；概率结果还需落在 [0,1]，且至少一次不小于任一单次概率。"}],"boundaries":["所附答案用了独立假设；边缘概率不足以单独算交事件概率。","只有独立时可将交事件概率写成各次概率乘积；至少一次不能直接将成功概率相加。"],"examples":[{"title":"2023真题第12题 · 方法拆解","level":"真题精讲","prompt":"系统发射两枚导弹，各自命中率 0.6。求至少一枚命中的概率（原题未明写独立条件）。","steps":["记两次命中为 A,B，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1.2<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","若相互独立，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.36<\/mn><\/mrow><\/math>，故至少一次为 0.84。","若未给独立，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.2<\/mn><mo>&#x02264;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mn>0.6<\/mn><\/mrow><\/math>，所以至少一次在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>0.6<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。"],"answer":"按两次命中相互独立的假设为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.84<\/mn><\/mrow><\/math>；只凭两次边缘命中率，不能唯一确定，范围为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>0.6<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。","pitfall":"所附答案用了独立假设；边缘概率不足以单独算交事件概率。"},{"title":"同考点原创例题","level":"原创例题","prompt":"有 2 次相互独立的尝试，成功概率分别为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>7<\/mn><\/mrow><mrow><mn>10<\/mn><\/mrow><\/mfrac><\/mrow><\/math>,<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。至少成功一次的概率为多少？","steps":["“至少成功一次”的对立事件是“每次均失败”。","独立性保证失败概率相乘：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mtext>全失败<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>50<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mtext>至少一次成功<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>50<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>47<\/mn><\/mrow><mrow><mn>50<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>47<\/mn><\/mrow><mrow><mn>50<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"只有独立时可将交事件概率写成各次概率乘积；至少一次不能直接将成功概率相加。"}],"citations":[{"source":"exam","locator":"PDF物理第3页，第12题"},{"source":"answers","locator":"PDF物理第3页，第12题"}],"figure":null},{"id":"t13","module":"m01","title":"无穷减无穷与相消后的高阶信息","prerequisites":"会通分、洛必达法则及 sin、cos、指数和对数基本极限。","intuition":"两个发散表达式相减后可以趋零，也可以趋于非零常数。通分后真正决定结果的是没有被抵消的首个非零阶。","sections":[{"title":"变成分式再判断","body":"原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>csc<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，变成零比零。无穷减无穷不是可直接使用洛必达的分式类型，需先通分或其他变形。变形中保留原定义域的去心条件。"},{"title":"等价替换的边界","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math> 能在合适的乘除结构中替换，但不能推出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 等价于零。相减消掉了一阶项，必须再找到三阶项。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"},{"title":"常用展开与余项","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mi>m<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 指除以 x^m 后趋零的余项。展开仅用作首个非零阶的追踪；应在 x→0 的邻域和函数实定义域内使用。"},{"title":"洛必达的另一条路线","body":"分子、分母在去心邻域可导、分母导数不为零，且为零比零或无穷比无穷时，可用导数之比求极限；每次继续使用都要重查条件。原题分子三阶、分母二阶，所以比值是 x/6 加更小量，极限为零。C 卷多抵消一项，需要逐步保留到三阶。"}],"boundaries":["不能在差式里只用 sin x≈x。","相减会抵消低阶主项；不能只把 sin x 换成 x 后把分子判成零。"],"examples":[{"title":"2023真题第13题 · 方法拆解","level":"真题精讲","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>csc<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>csc<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，通分得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","分子为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，分母为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","比值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，趋零。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>","pitfall":"不能在差式里只用 sin x≈x。"},{"title":"同考点原创例题","level":"原创例题","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mstyle><\/mrow><\/math>。","steps":["通分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，分子为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，分母为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","系数之比为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"相减会抵消低阶主项；不能只把 sin x 换成 x 后把分子判成零。"}],"citations":[{"source":"exam","locator":"PDF物理第3页，第13题"},{"source":"answers","locator":"PDF物理第3页，第13题"},{"source":"s1","locator":"PDF第11—12页；资料印刷第11—12页：无穷小"},{"source":"s3","locator":"PDF第3—5页；资料印刷第54—56页：洛必达"}],"figure":null},{"id":"t14","module":"m05","title":"一阶线性方程与积分因子","prerequisites":"掌握乘积求导、指数积分、对数积分与分部积分。","intuition":"积分因子把左边两个项拼成一个乘积的导数。先理解这个目标，再使用公式，就能检查符号与每一步的合理性。","sections":[{"title":"标准形式","body":"一阶线性方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。先除以最高阶导数系数并移项；若这个系数含 x，应限定它非零的区间。线性描述的是 y 与 y′ 的次数，而不是要求 x 的次数为一。"},{"title":"积分因子的推导","body":"希望 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>y<\/mi><\/mrow><\/math> 等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，就要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><mi>P<\/mi><\/mrow><\/math>。可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，只需取 P 的一个原函数，积分因子不需要额外任意常数。"},{"title":"四步解法","body":"先算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><\/mrow><\/math>，乘原式得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><mi>Q<\/mi><\/mrow><\/math>，积分得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x0222B;<\/mo><mi>&#x003BC;<\/mi><mi>Q<\/mi><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，再除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><\/mrow><\/math>。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>；变系数题在 x&gt;0 时常出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 和 x 的幂。指数相消后右端可能成为多项式或对数。"},{"title":"通解与核对","body":"任意常数所在的齐次项应为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。若有初值，最后才求 C；没有初值保留它。对所得 y 求导并代回原方程，验证右端完全相等。例如共振式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math> 的右侧与齐次指数相同，解中出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>，不能遗漏 x。"}],"boundaries":["右侧 e^x 前的负号不能丢。","移项与除以 y′ 系数都会影响符号；变量系数需先限定区间，通解保留一个任意常数。"],"examples":[{"title":"2023真题第14题 · 方法拆解","level":"真题精讲","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的通解。","steps":["化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。","积分因子 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mr
