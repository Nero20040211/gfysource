<\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 的通解。","steps":["化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","乘积分因子，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>。","两边积分，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mfrac><mrow><msqrt><mrow><mn>2<\/mn><\/mrow><\/msqrt><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。求导代入原标准方程，左端等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mfrac><mrow><msqrt><mrow><mn>2<\/mn><\/mrow><\/msqrt><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"移项与除以 y′ 系数都会影响符号；变量系数需先限定区间，通解保留一个任意常数。"}],"citations":[{"source":"exam","locator":"PDF物理第3页，第14题"},{"source":"answers","locator":"PDF物理第3,4页，第14题"},{"source":"s6","locator":"PDF第2页；资料印刷第113页：一阶线性方程"}],"figure":null},{"id":"t15","module":"m04","title":"不定积分：拆分、换元与分部","prerequisites":"熟悉常用导数与积分公式，会识别内层导数。","intuition":"一题含两个相加的函数时，可以分别选择合适的方法。原题的指数复合项适合换元，对数项适合分部。","sections":[{"title":"原函数与常数","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>f<\/mi><\/mrow><\/math>，则 F 为 f 的原函数，不定积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。不定积分结果是函数族，定积分结果是数值。多个积分相加的常数可以合成一个任意常数；验证原函数最直接的方法是求导。"},{"title":"第一类换元","body":"识别 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>g<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，令 u=g(x)，du=g′(x)dx。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 令 u=−x²，du=−2x dx，因此原函数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。换元比例和负号要保留，不能把 x dx 直接写成 du。"},{"title":"分部积分","body":"由乘积微分得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>v<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mi>m<\/mi><\/msup><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math>，常取 u=ln x、dv=x^m dx。m≠−1 时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><msup><mi>x<\/mi><mi>m<\/mi><\/msup><mi>ln<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mi>m<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msup><mfrac><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>m<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mrow><mi>m<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>m<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，实数定义域 x&gt;0。"},{"title":"组合题的流程","body":"先用线性性质拆分；每项独立标出换元或分部的变量；算完回到 x，并合并常数。C 卷用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 的对数原函数和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 组合，方法仍是这一链条。答案册同时给出求导复核，便于发现漏因子或漏减号。"}],"boundaries":["换元负号、对数定义域和任意常数都要保留。","对数定义域是 x&gt;0；两项合并后保留一个任意常数，分部积分的减号要追踪。"],"examples":[{"title":"2023真题第15题 · 方法拆解","level":"真题精讲","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["第一项令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","第二项取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>。","合并得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>","pitfall":"换元负号、对数定义域和任意常数都要保留。"},{"title":"同考点原创例题","level":"原创例题","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mstyle><\/mrow><\/math>。","steps":["将积分拆成两项，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 上计算。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。所以第一项原函数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","第二项用分部积分：取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>。","由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>v<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>，第二项为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>。","合并得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>；对结果求导可还原被积函数。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>","pitfall":"对数定义域是 x&gt;0；两项合并后保留一个任意常数，分部积分的减号要追踪。"}],"citations":[{"source":"exam","locator":"PDF物理第4页，第15题"},{"source":"answers","locator":"PDF物理第4页，第15题"},{"source":"s4","locator":"PDF第3—6页；资料印刷第79—82页：换元与分部积分"}],"figure":null},{"id":"t16","module":"m06","title":"幂级数的中心、半径与端点","prerequisites":"掌握比值判别、p 级数及交错级数判别。","intuition":"收敛半径只确定中心附近的开区间。两个端点是两道独立的数项级数问题，必须分别代回。","sections":[{"title":"幂级数与比值法","body":"形如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>，中心为 x₀。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><msub><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 存在且 0&lt;ρ&lt;∞，半径 R=1/ρ；因为通项比值极限为 ρ|x−x₀|。小于 1 时绝对收敛，大于 1 时发散，等于 1 时比值法无结论。"},{"title":"先得到开区间","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mi>R<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x02212;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>R<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。中心 x₀ 必收敛，因为从 n=1 开始的每个项都为零。不要把移位的半径直接写成 (−R,R)，也不要把这个开区间冒充最终收敛域。"},{"title":"两个端点各自判断","body":"分别代 x=x₀−R 与 x=x₀+R。若得到正调和级数则发散；交错调和级数条件收敛；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 或与之可比较的绝对值级数收敛。端点是否闭合由这些判断决定，可能两开、一开一闭、或两闭。"},{"title":"原题与递进变式","body":"原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><msup><mn>2<\/mn><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，半径 2；x=−2 得正调和级数，x=2 得交错调和级数，故收敛域 (−2,2]。C 卷端点系数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>n<\/mi><mn>3<\/mn><\/m <\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。对角元交换、非对角元变号并除以行列式。随后计算乘积核对，不仅看元素是否“像”逆矩阵。"},{"title":"分块对角矩阵","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>B<\/mi><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mi>D<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，B,D 均可逆，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><msup><mi>D<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。原题两块行列式都为 1，分块计算比完整四阶消元简洁；零块的大小仍要与原矩阵一致。"},{"title":"右上块不为零的变式","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>B<\/mi><\/mtd><mtd><mi>F<\/mi><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mi>D<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，设其逆为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>U<\/mi><\/mtd><mtd><mi>V<\/mi><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mi>W<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，乘积得 BU=E、DW=E、BV+FW=0。故 U=B⁻¹、W=D⁻¹、V=−B⁻¹FD⁻¹。此式来自同一求逆定义，C 卷把推导步骤完整给出；F=0 时回到上一种结构。"}],"boundaries":["四阶矩阵不能整体套二阶求逆公式；右上块非零时，逆的右上块一般也不为零。","四阶矩阵不能整体套二阶求逆公式；右上块非零时，逆的右上块一般也不为零。"],"examples":[{"title":"2023真题第19题 · 方法拆解","level":"真题精讲","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/ 998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。二阶导数在全实数范围为正，所以一阶导数严格递增，临界点左侧为负、右侧为正。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 取得全局最小值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>k<\/mi><mo>&#x02265;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以没有实根。","当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>k<\/mi><\/mrow><\/math> 均趋于正无穷。","由连续性，零点定理保证 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 各至少一个根；严格单调保证各至多一个，因此恰有两个。"],"method":"把有无实根转化为辅助函数的全局最小值；多根结论还要结合两端极限与严格单调性。","pitfall":"仅写导数为零或只有一个驻点不能代替全局最值证明；要说明定义域、单调性及参数阈值。","alternatives":[],"check_data":{"kind":"proof_min","f":"x**2 - x + exp(x)","critical":"0","threshold":"1","domain":"real","extra":true},"verification_note":"独立复算输入、结构检查及逻辑审阅见 _source 内核验记录。","rubric":[{"text":"求导、凸性和唯一驻点正确","points":2},{"text":"全局最小值及 k&lt;1 无根结论","points":2},{"text":"k&gt;1 时两端极限和零点存在性","points":2},{"text":"用严格单调性证明根的唯一性","points":2}]}]}],"formulas":[{"topic_id":"t01","title":"函数在一点的连续性与间断点分类","body":"函数在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 连续，要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 有定义、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 存在，并且该极限等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。两侧极限相等才有两侧极限；只知道函数值不能替代极限。若端点只允许单侧接近，应按相应单侧连续讨论。<br>若左右极限相等且有限，但函数值未定义或与极限不等，称为可去间断点。补定义为极限就能修复。若左右极限都有限而不相等，称为跳跃间断点；改变一个点的值不能使两侧接上。"},{"topic_id":"t02","title":"可导与连续、单侧导数及参数衔接","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>lim<\/mo><mrow><mi>h<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，存在指有限的两侧极限。可分别求左右导数；它们都有限且相等时，才有通常的导数。差商里的 h 有正负，绝对值在两侧的处理不同。<br>由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>h<\/mi><mfrac><mrow><mo>&#x000B7;<\/mo><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，差商趋有限值而 h 趋零，所以函数增量趋零，函数在该点连续。这说明“连续”是“可导”的必要条件；不可导不能反推出不连续。"},{"topic_id":"t03","title":"空间直线：点、方向向量与零分量","body":"过 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、方向 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">d<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>l<\/mi><mo>&#x0002C;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn mathvariant=\"bold\">0<\/mn><\/mrow><\/math> 的直线为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>l<\/mi><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>m<\/mi><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>n<\/mi><mi>t<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。三个方向分量均非零时，可消去参数得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>l<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>m<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>z<\/mi><mo>&#x02212;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。<br>过两个不同点 P,Q 的方向可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>P<\/mi><mi>Q<\/mi><\/mrow><mo>&#x02192;<\/mo><\/mover><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo>&#x02212;<\/mo><mi>P<\/mi><\/mrow><\/math>。所有非零倍数都表示同一方向，反向也表示同一直线。验证选项时应检查基点是否在候选线上以及候选方向是否与给定方向平行，不能只逐字比较。"},{"topic_id":"t04","title":"定积分的对称性、周期性与非负性","body":"若 f 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 可积，奇函数满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>；偶函数满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。必须同时有对称区间与对应奇偶性，偶函数积分一般不等于零。<br>若连续函数 f 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 非负且某点取正值，则在一小段区间仍为正，因此积分严格为正。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>cos<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><\/mrow><\/math> 就可以这样判断。只有非负且恒为零才得到零积分；单个点取零不影响这个判断。"},{"topic_id":"t05","title":"二阶常系数齐次微分方程的三种根型","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>q<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，p,q 为常数，代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，特征方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。原方程右侧为零才可直接用这里的齐次通解。<br>根为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mo>&#x02260;<\/mo><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。两个基解独立，两个常数可以任意取值。有初值时再求常数；没有初值时不能只给一个特解。"},{"topic_id":"t06","title":"级数、比较判别与绝对／条件收敛","body":"级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，是部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mi>N<\/mi><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 趋于有限值。收敛必有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。反向不成立：调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 通项趋零但发散。通项不趋零可直接判发散，趋零后需继续判别。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 当且仅当 p&gt;1 收敛。最终非负通项满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02264;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且较小者发散，则较大者发散。比较方向必须与要证明的结论一致。"},{"topic_id":"t07","title":"可逆矩阵的消去与乘法次序","body":"n 阶方阵 A 可逆是存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 使 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。等价条件是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math>。零矩阵乘任意同型矩阵仍为零，但一般矩阵乘积为零不能推出某个因子为零。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>C<\/mi><\/mrow><\/math> 且 A 可逆时，左乘逆得 B=C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><mi>A<\/mi><\/mrow><\/math> 则右乘逆得 B=C。原题 AB=O 通过左乘逆得到 B=O。若不可逆，不能使用逆来消去，结论可能失败。"},{"topic_id":"t08","title":"方差的平移、数乘与独立线性组合","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。可以从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02212;<\/mo><mi>E<\/mi><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 得到；平方并取期望就有 a²。期望的线性系数不平方，方差的系数要平方，两者不要混淆。<br>在二阶矩存在时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mi>D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>b<\/mi><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">v<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x0002C;<\/mo><mi>Y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。独立可推出协方差零，因此独立情形最后一项消失。没有独立或不相关条件时，不能直接省略交叉项。"},{"topic_id":"t09","title":"夹逼定理与无穷小乘有界振荡","body":"若在去心邻域有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，且两边趋于同一有限值 L，则 f 也趋于 L。证明趋零时常写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。边界不等式应在邻域中成立，不能只比较个别点的数值。<br>若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>&#x003B1;<\/mi><mi>u<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>&#x003B1;<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 可取 M=1。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 不存在极限。"},{"topic_id":"t10","title":"二元函数的偏导与全微分","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>x<\/mi><\/msub><\/mrow><\/math> 是固定 y、只对 x 求导；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math> 是固定 x、只对 y 求导。以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 为例，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0002C;<\/mo><msub><mi>u<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>。在偏导问题中不能擅自把 y 当成 x 的函数，这与隐函数求导不同。<br>若 u 在该点可微，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mi>x<\/mi><\/msub><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>y<\/mi><\/msub><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。偏导在邻域连续是可微的常用充分条件；本资料的初等函数在各自定义域内满足。仅有两个偏导存在的一般函数未必可微，不能脱离条件直接推广。"},{"topic_id":"t11","title":"秩、自由变量与基础解系","body":"对有 n 个未知数的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，基础解系是解空间的一组基：向量线性独立且能生成全部解。其向量个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。n 等于 A 的列数；方程条数等于行数，不能替换。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>n<\/mi><\/mrow><\/math> 时至少有一个自由变量，存在非零解；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math> 时只有零解。解空间维数为一时，全部解仍可以有无穷多个，但基础解系只有一个向量。“全部解的个数”与“基向量个数”应分开。"},{"topic_id":"t12","title":"至少一次事件、独立性与可靠性模型","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示至少一个发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示两个同时发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> 表示两个都不发生。“至少一个”包括两个都发生，不能只加两个互斥的单独成功情形。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。若 A,B 独立，才有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。互斥指不能同时发生，独立指发生与否不改变对方概率，两者是不同概念；两个正概率事件互斥时通常不独立。"},{"topic_id":"t13","title":"无穷减无穷与相消后的高阶信息","body":"原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>csc<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，变成零比零。无穷减无穷不是可直接使用洛必达的分式类型，需先通分或其他变形。变形中保留原定义域的去心条件。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math> 能在合适的乘除结构中替换，但不能推出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 等价于零。相减消掉了一阶项，必须再找到三阶项。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"},{"topic_id":"t14","title":"一阶线性方程与积分因子","body":"一阶线性方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。先除以最高阶导数系数并移项；若这个系数含 x，应限定它非零的区间。线性描述的是 y 与 y′ 的次数，而不是要求 x 的次数为一。<br>希望 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>y<\/mi><\/mrow><\/math> 等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，就要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><mi>P<\/mi><\/mrow><\/math>。可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，只需取 P 的一个原函数，积分因子不需要额外任意常数。"},{"topic_id":"t15","title":"不定积分：拆分、换元与分部","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>f<\/mi><\/mrow><\/math>，则 F 为 f 的原函数，不定积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。不定积分结果是函数族，定积分结果是数值。多个积分相加的常数可以合成一个任意常数；验证原函数最直接的方法是求导。<br>识别 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>g<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，令 u=g(x)，du=g′(x)dx。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 令 u=−x²，du=−2x dx，因此原函数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。换元比例和负号要保留，不能把 x dx 直接写成 du。"},{"topic_id":"t16","title":"幂级数的中心、半径与端点","body":"形如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>，中心为 x₀。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><msub><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 存在且 0&lt;ρ&lt;∞，半径 R=1/ρ；因为通项比值极限为 ρ|x−x₀|。小于 1 时绝对收敛，大于 1 时发散，等于 1 时比值法无结论。<br>由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mi>R<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x02212;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>R<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。中心 x₀ 必收敛，因为从 n=1 开始的每个项都为零。不要把移位的半径直接写成 (−R,R)，也不要把这个开区间冒充最终收敛域。"},{"topic_id":"t17","title":"曲线围成区域的二重积分","body":"二重积分 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math> 在一定条件下可化成累次积分。本资料被积函数在闭区域连续，满足换序条件。dx dy 表示面积微元，不代表可以随意使用常数上下限；累次积分中最靠内的微分决定先积分的变量。<br>若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02264;<\/mo><mi>x<\/mi><mo>&#x02264;<\/mo><mi>b<\/mi><\/mrow><\/math>，每条竖线与区域相交为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003D5;<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>y<\/mi><mo>&#x02264;<\/mo><msub><mi>&#x003D5;<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mrow><msub><mi>&#x003D5;<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msub><mi>&#x003D5;<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。先求交点，再判断同一 x 的上、下边界。"},{"topic_id":"t18","title":"一阶偏导与混合二阶偏导","body":"对 x 求偏导时，将 y 看作常数；对 y 求偏导时，将 x 看作常数。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mfrac><mrow><mi>y<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的 x 偏导为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mfrac><mrow><mi>y<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。第二项对 x 求导，y 虽是常数仍保留在系数中。<br>本资料记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mrow><mi>x<\/mi><mi>y<\/mi><\/mrow><\/msub><\/mrow><\/math> 为先对 x、再对 y：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mrow><mi>x<\/mi><mi>y<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo>&#x02202;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo>&#x02202;<\/mo><mi>y<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，题干也按这一含义明写。若两个混合偏导在邻域连续，交换顺序得到相同结果。不要把只求一次偏导的结果当二阶结果。"},{"topic_id":"t19","title":"四阶矩阵求逆与分块结构","body":"对可逆方阵 A，将 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 同时做初等行变换，左半部分化为 E 后，右半部分就是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。若左边无法化为满主元的 E，则 A 不可逆。每次行操作必须同时作用于两半，不能只改变 A。<br>对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>p<\/mi><\/mtd><mtd><mi>q<\/mi><\/mtd><\/mtr><mtr><mtd><mi>r<\/mi><\/mtd><mtd><mi>s<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，ps−qr≠0 时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mi>s<\/mi><mo>&#x02212;<\/mo><mi>q<\/mi><mi>r<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>s<\/mi><\/mtd><mtd><mo>&#x02212;<\/mo><mi>q<\/mi><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mi>r<\/mi><\/mtd><mtd><mi>p<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。对角元交换、非对角元变号并除以行列式。随后计算乘积核对，不仅看元素是否“像”逆矩阵。"},{"topic_id":"t20","title":"含参数线性方程组的三类解","body":"设系数矩阵 A、增广矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，未知数 n 个。若两者秩不等，无解；若同为 n，唯一解；若同为 r&lt;n，有无穷多解，齐次解空间有 n−r 个自由方向。这里右端向量 b 与题目中的参数 b 可同名，但含义要靠上下文区分。<br>原题第三行减 3 倍第一行和 2 倍第二行后成为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>；另两式给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>。这样无需先展开三阶行列式，就能看见全部分类条件。"},{"topic_id":"t21","title":"利用导数和全局最小值证明无根与根数","body":"对于 F(x)−k=0，先明确 F 的定义域，再求 F′。若在 c 左侧 F′&lt;0、右侧 F′&gt;0，则 F 在整个域内以 c 为全局最小点。只有 F′(c)=0 还不足以作出这个结论。<br>原题 F=eˣ−x，F′=eˣ−1，零点为 0。左侧导数负、右侧正，故 F(x)≥F(0)=1。k&lt;1 时 F(x)−k≥1−k&gt;0，无实根。也可以将结论写成 eˣ≥1+x，注意等号仅在零点取得。"}],"source_pages":{"exam":["../assets/source-pages/11d7e2cb3bafe4b52379f0f4d43549e3af7c2cf870b83986e0e13a6e7bd9c6eb.jpg","../assets/source-pages/a50232e709abd1d0df8ee3d7840f3584766944fbaec90144b68aebba6fa77d8c.jpg","../assets/source-pages/988728aeeb201a3739ad5e4abf2bda07b4da24f3b695cd45dcbe421d6fdd3fc7.jpg","../assets/source-pages/6c5703ebffdb8c51c8c851cb33689eaf5f05320e7793820b971274f0c4e7a95d.jpg","../assets/source-pages/761f5baa599703472765ff8390cca6025ac         (needle && !found.length ? '<p class="empty-state">没有匹配项。可尝试更短的概念词，或从模块目录进入。</p>' : "") +
        found.map(function (entry) {
          var offset = entry.body.toLowerCase().indexOf(terms[0]), start = Math.max(0, offset - 35);
          var snippet = entry.body.slice(start, start + 150);
          return '<article class="search-result"><p class="eyebrow">' + entry.kind + '</p><h2><a href="' +
            escapeHTML(entry.href) + '">' + escapeHTML(entry.title) + '</a></h2><p>' + (start ? "…" : "") +
            escapeHTML(snippet) + (entry.body.length > start + 150 ? "…" : "") + '</p></article>';
        }).join("");
    }
    function renderMissing() { return '<h1>未找到此内容</h1><p><a href="#home">返回学习首页</a></p>'; }
    function readRoute() {
      var parts = global.location.hash.replace(/^#/, "").split("/").map(function (s) {
        try { return decodeURIComponent(s); } catch (error) { return ""; }
      });
      return { name: parts[0] || "home", id: parts[1] || "", target: parts[2] || "" };
    }
    function reviewCount() {
      var total = 0;
      Object.keys(attempts).forEach(function (id) {
        var attempt = attempts[id]; if (!attempt.submitted && attempt.mode === "exam") return;
        scoreAttempt(papers[id], attempt, { onlyRevealed: !attempt.submitted }).items.forEach(function (item) {
          if (item.score === null || item.score < item.maximum) total += 1;
        });
      });
      return total + Object.values(practiceProgress).filter(function (p) { return p.review === "review"; }).length;
    }
    function refreshNav() {
      var group = { topic: "topics", practice: "practices", paper: "papers", source: "sources" }[route.name] || route.name;
      document.querySelectorAll("[data-nav]").forEach(function (link) {
        if (link.dataset.nav === group) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      var badge = document.getElementById("review-count"), count = reviewCount();
      badge.textContent = count ? String(count) : ""; badge.hidden = !count;
    }
    function jumpQuestion(id, number) {
      var element = document.getElementById("paper-" + id + "-q-" + number);
      if (element) element.scrollIntoView({ block: "start", behavior: "auto" });
    }
    function render() {
      var content;
      if (route.name === "home") content = renderHome();
      else if (route.name === "topics") content = renderTopics(route.id);
      else if (route.name === "topic") content = renderTopic(route.id);
      else if (route.name === "index") content = renderIndex(route.id);
      else if (route.name === "practices") content = renderPractices();
      else if (route.name === "practice") content = renderPractice(route.id);
      else if (route.name === "papers") content = renderPapers();
      else if (route.name === "paper") content = renderPaper(route.id);
      else if (route.name === "review") content = renderReview();
      else if (route.name === "sources") content = renderSources();
      else if (route.name === "source") content = renderSourcePage(route.id, route.target);
      else if (route.name === "search") content = renderSearch();
      else content = renderMissing();
      main.innerHTML = content; refreshNav(); updateClocks();
      if (route.name === "paper" && route.target) jumpQuestion(route.id, route.target);
      if (route.name === "index" && route.id) {
        var element = document.getElementById("index-q-" + route.id);
        if (element) element.scrollIntoView({ block: "start", behavior: "auto" });
      }
    }
    function updateSummary(id) {
      var region = main.querySelector('[data-attempt-summary="' + id + '"]');
      if (region) region.innerHTML = renderSummary(id);
      refreshNav();
    }
    function start(id, mode) {
      if (!papers[id] || (mode !== "exam" && mode !== "practice")) return null;
      attempts[id] = createAttempt(papers[id], mode, Date.now());
      save("attempt." + id, attempts[id]); render(); return attempts[id];
    }
    function submit(id, reason) {
      var attempt = attempts[id]; if (!attempt || attempt.submitted) return false;
      finalizeAttempt(attempt, reason || "manual", Date.now()); save("attempt." + id, attempt);
      if (route.name === "paper" && route.id === id) render();
      refreshNav();
      if (reason === "timeout") announce(papers[id].title + " 考试时间已到，已自动交卷。作答锁定，请完成自评。");
      else announce(papers[id].title + " 已交卷。请核对解析并完成待评题目。");
      return true;
    }
    function formatClock(milliseconds) {
      var seconds = Math.max(0, Math.ceil(milliseconds / 1000));
      return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
    }
    function updateClocks() {
      var now = Date.now(), active = [];
      Object.keys(attempts).forEach(function (id) {
        var attempt = attempts[id];
        if (attempt.mode === "exam" && !attempt.submitted) {
          active.push({ id: id, deadline: attempt.deadline });
          document.querySelectorAll('[data-clock-paper="' + id + '"]').forEach(function (element) {
            element.textContent = "剩余 " + formatClock(attempt.deadline - now);
          });
        }
      });
      var globalClock = document.getElementById("global-clock");
      active.sort(function (a, b) { return a.deadline - b.deadline; });
      globalClock.hidden = !active.length;
      if (active.length) {
        globalClock.href = "#paper/" + encodeURIComponent(active[0].id);
        globalClock.textContent = active[0].id + " 卷剩余 " + formatClock(active[0].deadline - now);
      }
    }
    function tick() {
      Object.keys(attempts).forEach(function (id) {
        if (shouldAutoSubmit(attempts[id], Date.now())) submit(id, "timeout");
      });
      updateClocks();
    }
    function refreshBadge(id, number) {
      var attempt = attempts[id], badge = main.querySelector('[data-response-badge="' + number + '"]');
      if (badge) badge.textContent = String(attempt.responses[number] == null ? "" : attempt.responses[number]).trim() ? "已作答" : "未作答";
      var count = main.querySelector('[data-response-count="' + id + '"]');
      if (count) count.textContent = responseCount(papers[id], attempt);
      var saved = main.querySelector('[data-save-paper="' + id + '"]');
      if (saved) saved.textContent = storageAvailable ? "已保存" : "仅本次会话";
    }
    function refreshQuestionScore(id, number) {
      var attempt = attempts[id], q = papers[id].questions.find(function (item) { return item.number === Number(number); });
      if (!attempt || !q || (!attempt.submitted && !attempt.revealed[number])) return;
      var item = scoreAttempt(papers[id], attempt).items.find(function (item) { return item.number === Number(number); });
      var status = main.querySelector('[data-score-status="' + number + '"]');
      if (status) {
        status.textContent = item.score === null ? "待自评" : item.score + " / " + q.points + " 分";
        var reason = status.parentElement.querySelector("span");
        if (reason) reason.textContent = item.reason;
      }
      if (q.type === "single") {
        main.querySelectorAll('input[name="response-' + id + '-' + number + '"]').forEach(function (radio) {
          var label = radio.closest("label"), correct = Number(radio.value) === q.correct;
          label.classList.toggle("correct-option", correct);
          if (correct && !label.querySelector(".correct-label")) {
            var marker = document.createElement("span"); marker.className = "correct-label";
            marker.textContent = "正确"; label.appendChild(marker);
          }
        });
      }
    }
    function revealQuestion(id, number) {
      var attempt = attempts[id]; if (!attempt || attempt.mode !== "practice" || attempt.submitted) return;
      if (!String(attempt.responses[number] == null ? "" : attempt.responses[number]).trim()) {
        var message = main.querySelector('[data-question-message="' + number + '"]');
        if (message) message.textContent = "先写下答案或解题思路，再展开解析。";
        return;
      }
      attempt.revealed[number] = true; save("attempt." + id, attempt);
      var q = papers[id].questions.find(function (item) { return item.number === number; });
      var region = main.querySelector('[data-question-result="' + number + '"]');
      if (region) region.innerHTML = renderQuestionResult(id, q);
      var button = main.querySelector('[data-action="question-reveal"][data-number="' + number + '"]');
      if (button) { button.disabled = true; button.textContent = "解析已展开"; }
      refreshQuestionScore(id, number); updateSummary(id);
    }
    main.addEventListener("input", function (event) {
      var element = event.target, id = element.dataset.paper, number = element.dataset.response;
      if (number != null && attempts[id] && !attempts[id].submitted) {
        if (shouldAutoSubmit(attempts[id], Date.now())) { submit(id, "timeout"); return; }
        if (element.type === "radio" && !element.checked) return;
        attempts[id].responses[number] = element.value; save("attempt." + id, attempts[id]);
        if (element.type === "radio") {
          main.querySelectorAll('input[name="' + element.name + '"]').forEach(function (radio) {
            radio.closest("label").classList.toggle("selected", radio.checked);
          });
        }
        refreshBadge(id, number);
        if (attempts[id].mode === "practice" && attempts[id].revealed[number]) {
          refreshQuestionScore(id, number); updateSummary(id);
        }
      } else if (element.dataset.selfScore != null && attempts[id]) {
        var qnumber = Number(element.dataset.selfScore), attempt = attempts[id];
        if (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[qnumber])) return;
        var q = papers[id].questions.find(function (item) { return item.number === qnumber; });
        var read = readScore(element.value, q.points);
        var message = document.getElementById("score-message-" + id + "-" + qnumber);
        element.setAttribute("aria-invalid", read.ok ? "false" : "true");
        if (message) message.textContent = read.ok ? "留空为待评；零为已评零分。" : read.error;
        if (!read.ok) {
          delete attempt.selfScores[qnumber]; save("attempt." + id, attempt);
          updateSummary(id); refreshQuestionScore(id, qnumber); return;
        }
        if (read.value === null) delete attempt.selfScores[qnumber]; else attempt.selfScores[qnumber] = read.value;
        save("attempt." + id, attempt); updateSummary(id);
        refreshQuestionScore(id, qnumber);
      } else if (element.dataset.practiceResponse) {
        var pid = element.dataset.practiceResponse;
        practiceProgress[pid] = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        practiceProgress[pid].response = element.value; save("practices", practiceProgress);
        var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
