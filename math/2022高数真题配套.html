gure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"恰好一个事件发生对应维恩图的两翼，交集被排除\"><title>恰好一个事件发生对应维恩图的两翼，交集被排除<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><defs><clipPath id=\"circleA2022\"><circle cx=\"246\" cy=\"145\" r=\"90\"/><\/clipPath><\/defs><circle cx=\"246\" cy=\"145\" r=\"90\" fill=\"#c4e3d5\"/><circle cx=\"374\" cy=\"145\" r=\"90\" fill=\"#eed4b4\"/><circle cx=\"374\" cy=\"145\" r=\"90\" fill=\"#dae0d9\" clip-path=\"url(#circleA2022)\"/><circle cx=\"246\" cy=\"145\" r=\"90\" fill=\"none\" stroke=\"#17675b\" stroke-width=\"2\"/><circle cx=\"374\" cy=\"145\" r=\"90\" fill=\"none\" stroke=\"#a56f42\" stroke-width=\"2\"/><text x=\"174\" y=\"145\" fill=\"#29483f\" style=\"font-size:16px\">仅 A<\/text><text x=\"387\" y=\"145\" fill=\"#29483f\" style=\"font-size:16px\">仅 B<\/text><text x=\"293\" y=\"139\" fill=\"#29483f\" style=\"font-size:16px\">同时<\/text><text x=\"293\" y=\"161\" fill=\"#29483f\" style=\"font-size:16px\">发生<\/text><text x=\"139\" y=\"284\" fill=\"#29483f\" style=\"font-size:16px\">“恰好一个”保留两翼，并排除中间的交集。<\/text><\/svg>"},{"id":"t09","module":"m01","title":"等价无穷小与乘积型极限","prerequisites":"熟悉三角与对数基本极限，知道未定式。","intuition":"分子和分母分别找到最先出现的非零阶，再比较系数；乘除可替换，加减要防相消。","sections":[{"title":"等价的含义与常用表","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003B1;<\/mi><\/mrow><mrow><mi>&#x003B2;<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x0007E;<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>。当 x 趋零时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。复合变量 u 也趋零时，可以把 x 替换成 u。最后一项属于二阶，是许多错误的来源；不能把所有趋零的函数都一律当成 x。实数对数还要求真数为正，但在零点的足够小邻域内，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 满足这一条件。"},{"title":"为什么乘除可直接使用","body":"若每个替换因子的原式与替代式比值趋一，则乘积的比值也趋一，所以分子分母的有限个乘除因子可以分别替换。比如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>a<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时分子等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，分母等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。替换后相同的 x 次幂约去，比例系数仍保留。b 为负时极限也可能为负，不能用“都是无穷小”推断结果非负。"},{"title":"相减与消去阶数","body":"加减结构不能随意逐项替换，因为首项可能正好抵消。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>，若把 sin x 替换成 x 得零，就丢掉真正的三阶项。应使用足够阶数的展开或洛必达法则，直到剩下第一个非零项。对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>，不要把 cos x 只替换成一；应直接使用已知二阶等价式。方法选择取决于式子的结构，而不只是看到三角或对数就套公式。"},{"title":"真题的完整链条","body":"真题分子二阶，分母是 x 与一阶对数的乘积，二者都是二阶，故比值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。也可拆成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 两个有极限因子相乘，分别为一半与一。这种拆分清楚呈现每个基本极限的使用条件。若分母改成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，阶数变成三阶，结果不再是有限常数；迁移练习应主动核对阶数，不能只照搬原题结论。"}],"boundaries":["余弦差为二阶无穷小。","余弦差是二阶，对数是一次；内层常数不能遗漏，负系数会影响极限符号。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mn>2<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mn>1<\/mn><mi>x<\/mi><\/mrow><\/math>，所以分母等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","约去 x²，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>。","对数在零点的充分小双侧邻域有定义，因此左右结论一致。"],"pitfall":"余弦差是二阶，对数是一次；内层常数不能遗漏，负系数会影响极限符号。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"(1 - cos(2*x))/(x*log(x + 1))","var":"x","at":"0","expected":"2","dir":"+"},{"op":"limit","expr":"(1 - cos(2*x))/x**2","var":"x","at":"0","expected":"2","dir":"+"},{"op":"limit","expr":"log(x + 1)/x","var":"x","at":"0","expected":"1","dir":"+"}]},"hint":"分别识别分子与分母的阶数。","answer_mode":"numeric","answer_value":2.0,"accepted":["2"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>，所以分母等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","约去 x²，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","对数在零点的充分小双侧邻域有定义，因此左右结论一致。"],"pitfall":"余弦差是二阶，对数是一次；内层常数不能遗漏，负系数会影响极限符号。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"(1 - cos(x))/(x*log(1 - 2*x))","var":"x","at":"0","expected":"-1/4","dir":"+"},{"op":"limit","expr":"(1 - cos(x))/x**2","var":"x","at":"0","expected":"1/2","dir":"+"},{"op":"limit","expr":"log(1 - 2*x)/x","var":"x","at":"0","expected":"-2","dir":"+"}]},"hint":"分别识别分子与分母的阶数。","answer_mode":"numeric","answer_value":-0.25,"accepted":["-1/4"]}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 9 题"},{"source":"answers","locator":"PDF 第 3 页，第 9 题"},{"source":"s1","locator":"PDF 第 11—12 页：等价无穷小；第 16—18 页：极限计算"}],"figure":null},{"id":"t10","module":"m02","title":"一元微分与复合函数链式法则","prerequisites":"会求常用初等函数导数，理解增量符号。","intuition":"先求导数，再乘自变量微分；内层函数改变的速度会作为一个额外因子出现。","sections":[{"title":"导数与微分的关系","body":"可导函数 y=f(x) 在一点的微分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，其中 dx 是自变量增量的独立微分记号。导数是变化率，微分是这条线性近似对应的函数改变量，答案类型不同。若题目问 dy，只写 f′ 会遗漏 dx；若问 y′，额外加 dx 又不合适。函数真实增量满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x00394;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x00394;<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，微分是其中的线性主部，不等于任意有限变化的精确值。"},{"title":"链式法则逐层展开","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，先求外层余弦，再乘内层常数 k；常数 c 的导数为零，但仍留在余弦内部。若内层是二次式，其导数是随 x 变化的线性式，也必须保留。把内外层分两行书写，比脑中一次完成更能发现漏因子。"},{"title":"乘积、商与定义域","body":"遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，除链式法则外还要乘积法则；两个相乘因素均随 x 变化，不能只对其中一个求导。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>g<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，但实数定义域要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>；对商函数分母需非零。求出微分之后的代数化简不会扩大原函数的定义域。边界或不可导点不能套通常微分式，应回到定义判断。"},{"title":"真题及量级检查","body":"真题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。当 x 变化很小时，可用该式估计 y 的变化，误差相对于 dx 更小；但不能在 dx 很大时把它当作精确差值。配套例题用线性内层与平方内层对比，练习加入乘积结构，难点仍在识别函数层次。复核时对原函数直接求导，再检查结果中是否完整保留了 dx 及各层比例。"}],"boundaries":["不能漏掉倍数二和 dx。","不要漏掉内层导数或最后的 dx；乘积不能只对一项求导。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>，求微分 dy。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>","steps":["微分公式是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，先求导数。","逐层用链式法则。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>。","最后乘 dx，结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。"],"pitfall":"不要漏掉内层导数或最后的 dx；乘积不能只对一项求导。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"sin(3*x - 1)","var":"x","order":1,"expected":"3*cos(3*x - 1)"}]},"hint":"把外层函数与内层表达式分开标出。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>，求微分 dy。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>","steps":["微分公式是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，先求导数。","逐层用链式法则。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math>。","最后乘 dx，结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。"],"pitfall":"不要漏掉内层导数或最后的 dx；乘积不能只对一项求导。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"sin(x**2)","var":"x","order":1,"expected":"2*x*cos(x**2)"}]},"hint":"把外层函数与内层表达式分开标出。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 10 题"},{"source":"answers","locator":"PDF 第 3 页，第 10 题"},{"source":"s2","locator":"导数运算法则与微分；全文作为先修资料，不指定未经定位的页码"}],"figure":null},{"id":"t11","module":"m09","title":"行列式乘法与含参数二阶矩阵","prerequisites":"会计算二阶行列式，知道矩阵积的顺序。","intuition":"求乘积的行列式时，先分别求两因子的行列式，通常比展开整个乘积更快。","sections":[{"title":"二阶行列式的计算","body":"矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>p<\/mi><\/mtd><mtd><mi>q<\/mi><\/mtd><\/mtr><mtr><mtd><mi>r<\/mi><\/mtd><mtd><mi>s<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 的行列式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mi>s<\/mi><mo>&#x02212;<\/mo><mi>q<\/mi><mi>r<\/mi><\/mrow><\/math>。主对角线乘积减副对角线乘积，遇到负数应保留括号。行列式是实数，而 A 是矩阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 表示行列式，不是把各元素取绝对值；行列式可以为负或零。含参数时，先把行列式写成参数多项式，再解方程，不能在还没弄清题目所求之前逐元素求积。"},{"title":"乘积公式与阶数条件","body":"同阶方阵满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。矩阵乘法一般不交换，但两个实数行列式相乘可以交换，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，这不代表 AB=BA。如果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>d<\/mi><\/mrow><\/math> 可以除以 |B| 得 |A|；若 |B|=0，则所有参数下 |AB|=0，给定 d 非零会无解，给定 d 为零则不能由这一条件约束 A。除法之前必须先检查因子是否为零。"},{"title":"数乘与加法的不同规则","body":"n 阶矩阵满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>c<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mi>c<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，因为每一行都乘了 c；不能只把行列式乘一次 c。一般没有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，也不能把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 写成 |A|−c。涉及未知参数的矩阵加法，应先把加法后的矩阵写出来，再计算行列式。这些规则的适用对象不同：乘积公式用于矩阵乘法，数乘公式用于整矩阵缩放，二阶交叉相乘用于一个具体矩阵。"},{"title":"真题的快速求解","body":"真题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math>，所以 a=0。若先展开 AB，也能求出同样结果，可作为独立核对，但考试主解不必增加步骤。新变式可将 B 的行列式设为参数零点，要求区分唯一值与所有值的分支；这种提升仍围绕二阶行列式和乘积性质。线性代数讲解为真题配套补充，不捏造六章资料中的相关章节。"},{"title":"计算路径的比较","body":"若采用先乘矩阵再取行列式，应完整保留每个参数项，最后与两因子行列式之积比对。两个方法相同说明展开过程一致；它们不意味着可以逐元素乘两个矩阵。矩阵积中的每个元素来自一行与一列的数量积，乘法定义与行列式交叉相乘是两种不同运算。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["行列式乘法不等于矩阵逐元素乘法。","若因子行列式为零，不能直接相除；矩阵加法也没有行列式线性规则。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>15<\/mn><\/mrow><\/math>，求 a。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。","由乘积公式 3(2 a - 3)=15。","解得 a=<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>。"],"pitfall":"若因子行列式为零，不能直接相除；矩阵加法也没有行列式线性规则。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"6*a - 9","rhs":"6*a - 9"},{"op":"eq","lhs":"15","rhs":"15"}]},"hint":"先求两个二阶行列式，不必展开 AB。","answer_mode":"numeric","answer_value":4.0,"accepted":["4"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，求 a。","answer":"任意实数 a 都满足。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，与条件一致。","此时不能除以 |B|，行列式条件没有约束 a。"],"pitfall":"若因子行列式为零，不能直接相除；矩阵加法也没有行列式线性规则。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"0","rhs":"0"}]},"hint":"先求两个二阶行列式，不必展开 AB。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 11 题"},{"source":"answers","locator":"PDF 第 3 页，第 11 题"}],"figure":null},{"id":"t12","module":"m10","title":"不放回抽取：数对计数与概率","prerequisites":"会算组合数，理解等可能样本空间。","intuition":"先锁定是否放回、是否看顺序，再让有利数对和总数使用同一种计数方式。","sections":[{"title":"样本空间必须说明试验","body":"从若干不同数字中随机取两个，若是不放回且不计顺序，每一个二元子集等可能，总数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;<\/mo><mfrac linethickness=\"0\"><mrow><mi>N<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>N<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>N<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。若依次抽取并计顺序，总数为 N(N−1)，每个不同数字的无序对对应两种顺序，概率不变。若放回，则会出现相同数字两次，总数 N²，事件概率可能改变。题干“任取两个”不足以自动决定这些细节，原创题将明确写出规则。"},{"title":"固定较小数字逐行枚举","body":"不计顺序时令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><mo>&#x0003C;<\/mo><mi>j<\/mi><\/mrow><\/math>，按 i 从小到大枚举，使每一对只出现一次。对于条件 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><mo>&#x0002B;<\/mo><mi>j<\/mi><mo>&#x0003E;<\/mo><mi>T<\/mi><\/mrow><\/math>，给定 i 后，j 必须同时满足 j&gt;i 与 j&gt;T−i，再与可选数字的上下界取交集。严格大于不包含等于，阈值为整数时，最小允许 j 是 T−i+1。这样按行计数比随意列一些数对更可靠，最后应确认没有重复和遗漏。"},{"title":"补事件与计数校验","body":"直接计算条件满足的对数，有时比求补事件简单；若条件“至少”“不超过”更容易列，则先算补事件再用一减。两种方法结果应相同。有序与无序模型必须统一，不能分子数有序对、分母用组合数。若改为放回，(i,i) 也可能满足条件，而且它只有一种有序表示，不能再把所有无序对都乘二。计数过程的可靠性来自完整分类，不来自答案小于一这一个检查。"},{"title":"真题规则与边界解释","body":"真题从 0 到 9 取两个数字，所附解析按不放回、不计顺序理解。和大于 10 的对数按较小数字 2、3、4、5、6、7、8 分别为 1、2、3、4、3、2、1，共 16 对，总数 45，概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>16<\/mn><\/mrow><mrow><mn>45<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。解析文字把满足“大于”的数对称成“小于”，应修正名称而保留正确计数。本单元明确列出抽样约定，迁移到其他数字集时也坚持同样样本空间。"},{"title":"把抽样变化说清楚","body":"如果改为放回抽取，先后两个位置各有 N 种选择，不能仍用 C(N,2) 作分母。求和阈值相同也可能得到不同概率，因为重复数字新增了样本。若题面只问无序抽取，不放回时每对等可能；放回后把有序结果压缩为无序对时，重复对与不同对的权重不同，不能一律当成等可能。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["卷面省略抽样约定；所附解析计数按不放回理解，并有“大于/小于”文字笔误。","大于不含等于；不放回不允许重复数字；分子分母必须统一是否计顺序。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"从数字集合 [0, 1, 2, 3, 4, 5] 中等可能地不放回抽取两个不同数字，不计顺序。求两数和严格大于 6 的概率。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["总无序对数为 C(6,2)=15。","固定较小数字，逐行枚举：较小数 2 对应 [5]；较小数 3 对应 [4, 5]；较小数 4 对应 [5]。","有利数对为 [(2, 5), (3, 4), (3, 5), (4, 5)]，共 4 对。","概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>=<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"大于不含等于；不放回不允许重复数字；分子分母必须统一是否计顺序。","check_data":{"kind":"generic","checks":[{"op":"count_pairs","values":[0,1,2,3,4,5],"threshold":6,"distinct":true,"expected_count":4,"expected_probability":"4/15"}]},"hint":"令小数 u&lt;大数 v，按 u 分类。","answer_mode":"numeric","answer_value":0.26666666666666666,"accepted":["4/15"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"从数字集合 [1, 2, 3, 4, 5, 6] 中等可能地不放回抽取两个不同数字，不计顺序。求两数和严格大于 7 的概率。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["总无序对数为 C(6,2)=15。","固定较小数字，逐行枚举：较小数 2 对应 [6]；较小数 3 对应 [5, 6]；较小数 4 对应 [5, 6]；较小数 5 对应 [6]。","有利数对为 [(2, 6), (3, 5), (3, 6), (4, 5), (4, 6), (5, 6)]，共 6 对。","概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>6<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>=<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"大于不含等于；不放回不允许重复数字；分子分母必须统一是否计顺序。","check_data":{"kind":"generic","checks":[{"op":"count_pairs","values":[1,2,3,4,5,6],"threshold":7,"distinct":true,"expected_count":6,"expected_probability":"2/5"}]},"hint":"令小数 u&lt;大数 v，按 u 分类。","answer_mode":"numeric","answer_value":0.4,"accepted":["2/5"]}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 12 题"},{"source":"answers","locator":"PDF 第 3 页，第 12 题"}],"figure":null},{"id":"t13","module":"m01","title":"相消型指数极限与高阶展开","prerequisites":"会用洛必达法则与指数导数，理解阶数。","intuition":"正负指数的奇数阶项相消后，最先留下二阶项；只保留一阶信息会失去答案。","sections":[{"title":"先判断未定式","body":"指数表达式在零点通常能先代入。若分子和分母都趋零，得到的是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 未定式，不能直接认定极限为零。需要找分子零点的阶数，并与分母比较。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，两个常数项合计后减二为零，两个线性项 ax 与 −ax 也相消，二次项相加后仍存在。因此若分母为 x²，期待有限非零值，而不是把每个指数近似到一阶就宣布分子恒零。"},{"title":"展开到足够的阶数","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，相加减二为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，除以 x² 得 a²。若题目再减去 a²x²，必须继续到四阶，不能用已有二阶展开计算相消后的极限。展开所到阶数由分母及相消结构决定，余项也要相应标为更小阶，避免保留的信息不足。"},{"title":"两次洛必达的条件","body":"在去心邻域分子分母可导、分母导数非零且为所允许的未定式时，可以应用洛必达。第一次得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mi>a<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，仍是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；第二次得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，极限为 a²。每次应用之前重新确认形态，不能在未定式消失后继续求导。若 a=0，原分子恒零，直接计算也得零；说明边界参数要与通用步骤交叉核对。"},{"title":"真题及迁移方法","body":"真题 a=1，结果为一。可将分母改为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>b<\/mi><mi>x<\/mi><\/mrow><\/math>，此时分母等价于 b²x²/2，b 非零时结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>；也可改为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/math>，留下的二阶系数为 a²/2。这些变式都考查相消后的首项。正负指数相加会消奇数阶，相减会消偶数阶，这个结构观察能帮助选择展开阶数，但最终仍须给出计算，不能仅凭“对称”写答案。"},{"title":"代数改写也可降低难度","body":"恒等式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 给出了另一条核对路径。除以 x² 后，利用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mi>a<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，直接得到 a²。这种改写避免高阶相消的书写，但只适用于这一结构；变式再减去二次项时，仍须获取四阶信息。"}],"boundaries":["不能只保留一阶展开。","遇到首项抵消，应继续提高展开阶数；不可以逐项一阶替换后把分子写成零。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>","steps":["直接代入为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，须寻找相消后的首个非零项。","分子展开到 2 阶，低阶项抵消，首项为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>。","分母对应首项为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>。","比值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>=<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>。"],"pitfall":"遇到首项抵消，应继续提高展开阶数；不可以逐项一阶替换后把分子写成零。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"(exp(2*x) - 2 + exp(-2*x))/x**2","var":"x","at":"0","expected":"4","dir":"+"},{"op":"eq","lhs":"4","rhs":"4"}]},"hint":"观察常数项、一次项是否相消。","answer_mode":"numeric","answer_value":4.0,"accepted":["4"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["直接代入为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，须寻找相消后的首个非零项。","分子展开到 2 阶，低阶项抵消，首项为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","分母对应首项为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>。","比值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>=<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"遇到首项抵消，应继续提高展开阶数；不可以逐项一阶替换后把分子写成零。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"(-3*x + exp(3*x) - 1)/x**2","var":"x","at":"0","expected":"9/2","dir":"+"},{"op":"eq","lhs":"9/2","rhs":"9/2"}]},"hint":"观察常数项、一次项是否相消。","answer_mode":"numeric","answer_value":4.5,"accepted":["9/2"]}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 13 题"},{"source":"answers","locator":"PDF 第 4 页，第 13 题"},{"source":"s1","locator":"PDF 第 11—12 页：无穷小与等价关系"}],"figure":null},{"id":"t14","module":"m05","title":"二阶齐次方程：重根与切线初值","prerequisites":"会解二次特征方程，能把直线转为斜率。","intuition":"二阶方程需要两个独立解，重根时第二个解必须带 x；切线平行把几何条件转为导数初值。","sections":[{"title":"特征方程与解的维数","body":"对常系数方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>q<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，试取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。两个不同实根时解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>；重实根 r 时则为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。二阶通解需要两个独立常数，两个同指数项合并后只剩一个有效常数，不是完整通解。这里的独立是函数之间不能互为常数倍，不能仅看写了两个字母。"},{"title":"为什么重根要乘 x","body":"对于方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>r<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mi>v<\/mi><\/mrow><\/math>。分别求导代入，含 v 与 v′ 的项抵消，剩 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><msup><mi>v<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 v 为一次函数。于是得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。这种代换直接解释了 x 的来源，也为检查重根形式提供方法；不能在所有二阶方程里随意乘 x，只有根型满足重根条件时才采用这一形式。"},{"title":"切线条件翻译成初值","body":"直线 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，斜率为 −A/B。曲线在 x=0 的切线与它平行，意味着 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><mi>A<\/mi><\/mrow><mrow><mi>B<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，常数 D 不影响斜率。题给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，由通解得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>；再求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>r<\/mi><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><mi>r<\/mi><msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>。若 B=0，则原线竖直，普通可导函数图像的有限导数切线不能与其平行，须检查几何条件是否可实现。"},{"title":"真题的完整求解与复核","body":"真题特征方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BB;<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，通解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。曲线过原点给 C₁=0，平行 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 给斜率 −2，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，特解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。最后分别代回微分方程、零点函数值和零点导数，这三个条件才能完整验证。难度提高可以改变重根、初值位置或斜率信息，核心仍是根型选择及两个初值，而非引入未学过的非齐次技巧。"}],"boundaries":["平行条件只给斜率 −2，与直线截距五无关。","重根的第二项必须带 x；切线斜率是导数初值，不是函数值。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，且 x=0 处切线斜率为 3。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","steps":["特征方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BB;<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，是重实根。","使用平移形式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>D<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>D<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false ttp://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>D<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>D<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mn>1<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><\/mrow><\/math>。","第一个初值给 D₁=0，第二个给 rD₁+D₂=0，所以 D₂=0。","代回得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>；零函数也是合法特解。"],"pitfall":"重根的第二项必须带 x；切线斜率是导数初值，不是函数值。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"0","rhs":"0"},{"op":"eq","lhs":"0","rhs":"0"},{"op":"eq","lhs":"0","rhs":"0"}]},"hint":"写重根通解，再代函数值与斜率。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 2 页，第 14 题"},{"source":"answers","locator":"PDF 第 4 页，第 14 题"},{"source":"s6","locator":"PDF 第 1—3 页：方程基本概念与常系数方程"}],"figure":null},{"id":"t15","module":"m04","title":"最大值包络函数的分段定积分","prerequisites":"会解曲线交点，掌握定积分线性与可加性。","intuition":"max 在每个区间选择较高的函数；积分之前先确定在哪些点会切换选择。","sections":[{"title":"先定义包络再比较大小","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 在每个 x 取两者较大值，是一个新的函数，并不是分别求两个函数的区间最大值再取较大者。若 f、g 连续，包络也连续，即使交点处导数可能改变，仍可积分。首先解 f=g 找可能的切换点，再判断每个相邻区间的大小关系。交点只是候选切换，若差函数在那里不变号，两边会仍由同一个函数占优，不应机械地切换。"},{"title":"分段依据来自差函数符号","body":"比较 x 与 x²，可看 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。在 (0,1) 为正，故较大者是 x；在 (1,2) 为负，较大者是 x²。负半轴上 x² 也大于 x。区间不同，选择规则可能改变，不能把只适用于 [0,2] 的分段表拿到整个实轴。若积分区间不含某个交点，就没有必要在那个点拆分；若交点等于端点，单点选哪一支不影响积分值。"},{"title":"积分可加与绝对值替代式","body":"分段之后，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>c<\/mi><\/msubsup><mi>f<\/mi><mo>&#x0002B;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>c<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math> 分别积分，再相加。另一种写法是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>f<\/mi><mo>&#x0002C;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>f<\/mi><mo>&#x0002B;<\/mo><mi>g<\/mi><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo>&#x02212;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，可用于验证，但绝对值本身仍需按差函数符号拆分，不能因此跳过比较。连续包络有界，积分代表它与横轴的带符号面积；若两支在区间内非负，积分必非负。先画出两条曲线的交点和上下关系，有助于检查积分选择。"},{"title":"真题、新颖变式与条件控制","body":"真题在 [0,2] 上，积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mn>2<\/mn><\/msubsup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><mn>7<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>17<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。变式可改成直线 ax 与抛物线 x²，切换点随参数 a 移动；先确认 a 是否在积分区间内部，再决定是否拆分。题面会限制参数范围使答案具有可读性。C 卷把这一逻辑作为方法选择提升，依旧只使用交点、符号和多项式定积分，不把“新颖”理解成超出真题要求的新理论。"},{"title":"检验面积的上下界","body":"包络在区间内不小于任一支，所以它的定积分应分别不小于两支的积分；同时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>f<\/mi><mo>&#x0002C;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>f<\/mi><mo>&#x0002B;<\/mo><mi>g<\/mi><\/mrow><\/math> 在两支非负时成立，可给一个粗上界。若最终数值违反这些关系，就应回到分段表检查哪一支取反。这个检查不能代替精确积分，却能快速识别明显的选择错误。"}],"boundaries":["不能把函数分别积分后取最大值。","交点在积分区间外时，不应机械地拆分；max 取的是每个 x 的较大函数。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>3<\/mn><\/msubsup><mo>max<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002C;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x0007D;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>31<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["交点满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，为零和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>。","在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>2<\/mn><\/mrow><\/math>，直线在上；在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>2<\/mn><\/mrow><\/math>，抛物线在上。"," font-size:16px\">1<\/text><text x=\"523\" y=\"270\" fill=\"#29483f\" style=\"font-size:16px\">2<\/text><text x=\"108\" y=\"292\" fill=\"#29483f\" style=\"font-size:15px\">先找交点与大小关系，再把积分按交点分段。<\/text><\/svg>"},{"id":"t16","module":"m06","title":"幂级数：平移中心、半径与端点","prerequisites":"掌握比值判别、p 级数和交错级数。","intuition":"比值法先找开区间，两个端点则各自成为新的数项级数，必须分别判断。","sections":[{"title":"系数、中心与半径","body":"幂级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 的中心是 h，而非总是零。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><msub><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 存在且为正有限数，通项比值极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，收敛半径 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>&#x003C1;<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mi>R<\/mi><\/mrow><\/math> 时绝对收敛，大于 R 时发散。中心 x=h 的项从 n=1 开始均为零，必收敛；这一点不能因为做比值时除以 x−h 而丢失。"},{"title":"多项式系数不改变几何尺度","body":"例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>r<\/mi><mi>n<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，相邻系数绝对比为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，极限 1/r，所以 R=r。n、n² 或 n 的固定次幂对半径没有影响，几何因子 rⁿ 决定尺度。若系数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><msup><mi>r<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，半径仍 r，但端点收敛情况会不同，这说明半径相同不代表收敛域相同。做比值时指数从 n 到 n+1 的变化必须完整保留，不能把 r 的因子约丢。"},{"title":"端点使用独立判别","body":"先得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>h<\/mi><mo>&#x02212;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><mi>h<\/mi><mo>&#x0002B;<\/mo><mi>R<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，再把左端与右端分别代入原通项。若得到 n+1 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，通项均不趋零，两个端点都发散；若得到 1/n，正项端点发散，交错端点在单调趋零条件下收敛；若得到 1/n²，两端都绝对收敛。比值极限等于一时没有结论，不意味着发散。最终括号是这些端点判断的汇总，不能先预设全开或全闭。"},{"title":"真题与平移迁移","body":"真题中心零、系数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mn>3<\/mn><mi>n<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，半径三，两端通项不趋零，收敛域为 (−3,3)。若把 x 改成 x−2，半径不变但开区间改为 (−1,5)。若再改系数的 n 次幂因素，端点可能开闭不同。新练习把平移和端点性质分别训练，让学习者能解释每个括号的来源；此单元为真题配套级数补充，章节资料没有完整覆盖该部分。"},{"title":"不把开区间上的操作搬到端点","body":"幂级数在收敛开区间内可以按相应条件逐项求导与积分，但求导后端点收敛可能改变。因此本单元只对给出的原级数逐端点判断，不能先换成另一条级数，再不加说明地继承它的端点。中心和半径先确定，端点最后判断，是最稳妥的书写顺序。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["比值等于一时需另判端点。","中心平移影响端点位置；比值判别等于一不能直接下结论，须把两端代回原级数。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求幂级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mo>&#x0221E;<\/mo><\/msubsup><msup><mn>2<\/mn><mrow><mo>&#x02212;<\/mo><mi>n<\/mi><\/mrow><\/msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 的收敛域。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>","steps":["系数相邻项之比趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","半径 R=2，中心 h=1，先得到开区间 (-1,3)。","左端通项为交错的 n 次多项式，绝对值不趋零，因此发散。","右端通项为 n 次多项式，亦不趋零，因此发散。","最终收敛域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"pitfall":"中心平移影响端点位置；比值判别等于一不能直接下结论，须把两端代回原级数。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"(n + 2)/(2*(n + 1))","var":"n","at":"oo","expected":"1/2","dir":"+"},{"op":"limit","expr":"n + 1","var":"n","at":"oo","expected":"oo","dir":"+"}],"power":{"coefficient":"(n + 1)/2**n","center":"1","radius":"2","endpoint_factor":"n+1","sign":1,"left_kind":"发散","right_kind":"发散","left_closed":false,"right_closed":false}},"hint":"先比值求半径，再分别检查左、右端点。","answer_mode":"self","power":{"coefficient":"(n + 1)/2**n","center":"1","radius":"2","endpoint_factor":"n+1","sign":1,"left_kind":"发散","right_kind":"发散","left_closed":false,"right_closed":false}},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"求幂级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mo>&#x0221E;<\/mo><\/msubsup><mfrac><mrow><msup><mn>3<\/mn><mrow><mo>&#x02212;<\/mo><mi>n<\/mi><\/mrow><\/msup><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 的收敛域。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>","steps":["系数相邻项之比趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","半径 R=3，中心 h=-1，先得到开区间 (-4,2)。","左端得到交错调和级数，绝对值单调趋零，故条件收敛。","右端得到调和级数，发散。","最终收敛域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"pitfall":"中心平移影响端点位置；比值判别等于一不能直接下结论，须把两端代回原级数。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"n/(3*(n + 1))","var":"n","at":"oo","expected":"1/3","dir":"+"},{"op":"limit","expr":"1/n","var":"n","at":"oo","expected":"0","dir":"+"},{"op":"limit","expr":"log(n)","var":"n","at":"oo","expected":"oo","dir":"+"}],"power":{"coefficient":"1/(3**n*n)","center":"-1","radius":"3","endpoint_factor":"1/n","sign":1,"left_kind":"条件收敛","right_kind":"发散","left_closed":true,"right_closed":false}},"hint":"先比值求半径，再分别检查左、右端点。","answer_mode":"self","power":{"coefficient":"1/(3**n*n)","center":"-1","radius":"3","endpoint_factor":"1/n","sign":1,"left_kind":"条件收敛","right_kind":"发散","left_closed":true,"right_closed":false}}],"citations":[{"source":"exam","locator":"PDF 第 2 页，第 16 题"},{"source":"answers","locator":"PDF 第 4 页，第 16 题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"原卷幂级数收敛区间为负3到3的开区间，端点单独判别\"><title>原卷幂级数收敛区间为负3到3的开区间，端点单独判别<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"75\" y1=\"150\" x2=\"550\" y2=\"150\" stroke=\"#7f9487\" stroke-width=\"3\"/><line x1=\"190\" y1=\"150\" x2=\"430\" y2=\"150\" stroke=\"#17675b\" stroke-width=\"7\"/><circle cx=\"190\" cy=\"150\" r=\"9\" fill=\"#f3f7f5\" stroke=\"#17675b\" stroke-width=\"3\"/><circle cx=\"430\" cy=\"150\" r=\"9\" fill=\"#f3f7f5\" stroke=\"#17675b\" stroke-width=\"3\"/><text x=\"172\" y=\"192\" fill=\"#29483f\" style=\"font-size:16px\">−3<\/text><text x=\"303\" y=\"192\" fill=\"#29483f\" style=\"font-size:16px\">0<\/text><text x=\"424\" y=\"192\" fill=\"#29483f\" style=\"font-size:16px\">3<\/text><text x=\"242\" y=\"115\" fill=\"#29483f\" style=\"font-size:16px\">原卷收敛区间<\/text><text x=\"102\" y=\"237\" fill=\"#29483f\" style=\"font-size:16px\">半径只确定内部；左右端点必须分别代入原级数。<\/text><text x=\"107\" y=\"273\" fill=\"#29483f\" style=\"font-size:15px\">换成新系数后，端点可能开、闭或只有一侧闭合。<\/text><\/svg>"},{"id":"t17","module":"m08","title":"半圆域的二重积分与积分顺序","prerequisites":"会解圆方程、做一元积分，了解连续函数可换序。","intuition":"积分区域来自几何不等式；换序要重新读同一个区域，不能简单交换原来上下限。","sections":[{"title":"把右半圆盘写成不等式","body":"半径 R 的右半圆盘为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>:<\/mi><mi>x<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。用水平小条切割，外层 y 在 [−R,R]，每个固定 y 的 x 从零到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>。若用竖条，x 在 [0,R]，y 从负平方根到正平方根。两种表达都编码同一块区域，不可把右半盘误写成第一象限四分之一盘。积分函数和区域连续闭有界时，通常可以合法换序。"},{"title":"为何先对 x 积分更简洁","body":"对被积函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，水平条先算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/msubsup><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，根号在平方后消失。于是外层只需积分偶多项式，可化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>R<\/mi><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>4<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，结果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><msup><mi>R<\/mi><mn>5<\/mn><\/msup><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。若先对 y 积分会出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>，仍能算，但明显不如前者直接。选顺序不是改变问题，而是利用同一域寻找简单的内层原函数。"},{"title":"对称性要同时看函数和区域","body":"右半圆盘关于 x 轴对称，被积函数若关于 y 为奇函数，如 xy，则积分为零；但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 关于 y 为偶函数、关于 x 在右半盘非负，积分应为正。全圆盘关于 y 轴也对称，此时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 对 x 为奇函数，积分才是零。因此“圆域对称”这四个字不够，需要指出是哪条对称轴以及被积函数对应变量的奇偶性。换成四分之一盘，结果则是原右半盘的一半。"},{"title":"真题及几何迁移","body":"真题 R=2，代公式得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>64<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。配套练习可把圆盘平移到 x=h，并把被积函数写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，令 u=x−h 后保持原几何结构；也可换成三角形域，练习重新列上下限。任何图示都要配明确不等式，不以绘图像素替代边界定义。二重积分为真题配套补充，一元定积分资料只是先修依据，不能把它写成已有二重积分章节。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["右半圆盘不是第一象限四分之一盘。","右半圆盘不是四分之一盘；奇偶消去要同时匹配区域对称轴与函数变量。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"在区域 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>x<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 上求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222C;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["外层 y 从 −1 到 1，内层 x 从 0 到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msqrt><\/mrow><\/math>。","先积分 x，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","外层为偶函数，将积分化为正半轴的两倍。","结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><msup><mi>R<\/mi><mn>5<\/mn><\/msup><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"右半圆盘不是四分之一盘；奇偶消去要同时匹配区域对称轴与函数变量。","check_data":{"kind":"generic","checks":[{"op":"double_integral","expr":"x*y**2","inner_var":"x","inner_lo":"0","inner_hi":"sqrt(1 - y**2)","outer_var":"y","outer_lo":"-1","outer_hi":"1","expected":"2/15"}]},"hint":"画水平条并让 x 先积分。","answer_mode":"numeric","answer_value":0.13333333333333333,"accepted":["2/15"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"在全圆盘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math> 上求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222C;<\/mo><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>","steps":["区域关于 y 轴对称，函数关于 x 为奇函数。","同一 y 处 x 的上下界互为相反数，内层积分为零，故整个积分为零。"],"pitfall":"右半圆盘不是四分之一盘；奇偶消去要同时匹配区域对称轴与函数变量。","check_data":{"kind":"generic","checks":[{"op":"double_integral","expr":"x*y**2","inner_var":"x","inner_lo":"-sqrt(4 - y**2)","inner_hi":"sqrt(4 - y**2)","outer_var":"y","outer_lo":"-2","outer_hi":"2","expected":"0"}]},"hint":"画水平条并让 x 先积分。","answer_mode":"numeric","answer_value":0.0,"accepted":["0"]}],"citations":[{"source":"exam","locator":"PDF 第 2 页，第 17 题"},{"source":"answers","locator":"PDF 第 4,5 页，第 17 题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"原卷右半圆积分区域，横条的x从0至半圆弧，y从负2至2\"><title>原卷右半圆积分区域，横条的x从0至半圆弧，y从负2至2<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"160\" y1=\"150\" x2=\"550\" y2=\"150\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"260\" y1=\"276\" x2=\"260\" y2=\"24\" stroke=\"#879d92\" stroke-width=\"2\"/><path
