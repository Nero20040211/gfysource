<mi>x<\/mi><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math>，通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。两种情形均相容。"],"method":"先用恒定独立约束消元，再对消元后的参数系数分情况。","pitfall":"除以 λ−2 前必须单独处理 λ=2；四条方程不代表有四条独立约束。","alternatives":[],"check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"(x+y+(a-1)*z-a)-(x+y+z-2)","rhs":"(a-2)*(z-1)"},{"op":"linear_system","matrix":[[1,1,1],[1,-1,1],[1,1,2],[2,0,2]],"rhs":[2,0,3,2],"solution":[0,1,1]},{"op":"linear_system","matrix":[[1,1,1],[1,-1,1],[1,1,1],[2,0,2]],"rhs":[2,0,2,2],"solution":[0,1,1],"basis":[[1,0,-1]]},{"op":"eq","lhs":"(t+1+(a-1)*(1-t))-a","rhs":"(2-a)*t"}]},"verification_note":"精确复算与数学条件审阅见来源与核验记录。","rubric":[{"text":"求得 y=1、x+z=1 并识别冗余行","points":2},{"text":"得到 (λ−2)z=λ−2","points":2},{"text":"正确求 λ≠2 的唯一解","points":2},{"text":"正确写出 λ=2 的全部解及参数范围","points":2}],"difficulty_note":"消元后分参数讨论唯一解与无穷解。"},{"number":21,"type":"proof","points":8,"topic_ids":["t21"],"stem":"证明方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>6<\/mn><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 有且只有一个正实数根。","answer":"存在且仅存在一个正根，且该根位于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，原方程等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>6<\/mn><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mi>x<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。函数 g 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 连续。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>7<\/mn><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>16<\/mn><mo>&#x0002B;<\/mo><mn>8<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>16<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。由介值定理，存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 使 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BE;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","对一切 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mstyle><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 g 在整个正半轴上严格递增。","严格递增函数不可能有两个不同零点。结合存在性和等价变形，原方程恰有一个正实数根。"],"method":"在所证的正半轴上除以 x，构造导数各项均为正的新函数。","pitfall":"原多项式导数 5x⁴+6x²−6 在零附近为负，不能直接声称它在整个正半轴递增；除以 x 只在 x&gt;0 合法。","alternatives":[],"check_data":{"kind":"generic","checks":[{"op":"diff","expr":"x**4+2*x**2-6-4/x","var":"x","order":1,"expected":"4*x**3+4*x+4/x**2"},{"op":"eq","lhs":"x*(x**4+2*x**2-6-4/x)","rhs":"x**5+2*x**3-6*x-4"},{"op":"eq","lhs":"(x**4+2*x**2-6-4/x).subs(x,1)","rhs":"-7"},{"op":"eq","lhs":"(x**4+2*x**2-6-4/x).subs(x,2)","rhs":"16"}],"unique_root":{"f":"x**5+2*x**3-6*x-4","transform":"x**4+2*x**2-6-4/x","domain_start":0,"bracket":[1,2]}},"verification_note":"精确复算与数学条件审阅见来源与核验记录。","rubric":[{"text":"正半轴等价变形及连续性","points":2},{"text":"计算异号值并用介值定理证明存在","points":2},{"text":"证明整个正半轴 g′&gt;0","points":2},{"text":"用严格单调性证明唯一并回到原方程","points":2}],"difficulty_note":"正半轴等价变形，分别证明存在与整个域上的唯一性。"}]}],"formulas":[{"topic_id":"t01","title":"分段函数：极限存在与连续延拓","body":"在一点连续，需要函数在该点有定义、去心极限存在、极限等于点值三个条件同时成立。去心极限只关心附近非零位置的函数值，不受单个点值的改变影响。左右极限都存在且相等时，两侧极限才存在。若左右极限不同，即使随意补一个点值也不能修复；若二者相同且有限，只需补成共同极限就能作连续延拓。先圈出题目是否给了 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，再开始计算参数，能避免把两个问题混为一谈。<br>基本极限 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mi>sin<\/mi><mi>u<\/mi><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 要求内部变量确实趋于零。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>k<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 时函数恒为零，结论仍成立。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 在零点表达式没有定义，但极限为一，正好说明极限存在不等于函数有定义。多项式一侧可以直接代入；分式一侧应先看是否为未定式，再使用基本极限。"},{"topic_id":"t02","title":"级数收敛的必要条件与反例","body":"记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>。若级数收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mi>S<\/mi><\/mrow><\/math>，同时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mi>S<\/mi><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。这个证明没有要求每项为正，也没有要求绝对收敛。它提供快速排除法：只要通项不趋零，级数就发散；但若已经算出通项趋零，还不能据此宣布收敛。学习时应把“必要条件”读成所有收敛级数都必须通过的门槛，而不是通过门槛就自动合格。<br>调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的通项趋零，却发散；平方倒数级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 收敛。二者的差别在累加速度。对正项级数，可用比较判别或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 级数结论：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 时收敛，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math> 时发散。比较时需要方向正确：用一个已知收敛的上界控制原级数，或用一个已知发散的下界推出原级数发散。不能只看分母含有 n 就判断收敛。"},{"topic_id":"t03","title":"空间向量的数量积与夹角","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">a<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>a<\/mi><mn>3<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">b<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>3<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，数量积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mn>3<\/mn><\/msub><msub><mi>b<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>，结果是实数，不是向量。计算时应让相同坐标位置配对，尤其注意负数乘负数的符号。长度为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msqrt><mrow><msubsup><mi>a<\/mi><mn>1<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0002B;<\/mo><msubsup><mi>a<\/mi><mn>2<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0002B;<\/mo><msubsup><mi>a<\/mi><mn>3<\/mn><mn>2<\/mn><\/msubsup><\/mrow><\/msqrt><\/mrow><\/math>，负分量在平方后仍贡献正数。数量积可以为负，长度不为负，这两种量不能混用。先求数量积再求长度，能减少不必要的平方根运算。<br>两条非零向量的夹角 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B8;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>&#x003C0;<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo>&#x000B7;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。分母必须非零，零向量与任何向量的夹角通常不定义；虽然零向量与其他向量的数量积都为零，也不能套公式得到直角。得到的余弦必须在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，超出范围说明计算有误。若只问锐角、直角或钝角，数量积符号已经足够，无须算反余弦。"},{"topic_id":"t04","title":"由不定积分反求被积函数","body":"若题给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，意思是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 在讨论区间的导数等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mi>f<\/mi><\/mrow><\/math>。对两边求导得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，任意常数的导数为零。应先算出右边完整导数，再处理左边的因子。不能把积分符号直接约去，也不能把 f 写成 F；积分和求导互为逆向操作，但求导仍要遵守复合函数、乘积及定义域规则。<br>指数复合函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 的导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>；若左边因子是 x，非零点便得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。类似地，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的导数是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。外层求导后一定要乘内层导数，省略它就会丢掉 x 或倍数。得到候选 f 后，再乘回 g 并与 F′ 比较，是一个独立而简单的核对办法。"},{"topic_id":"t05","title":"一阶齐次微分方程与初值","body":"方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>k<\/mi><mi>y<\/mi><\/mrow><\/math> 含未知函数及其导数，不是关于 x 的普通代数方程。解要求在某个区间上逐点满足等式。一阶方程的通解通常含一个任意常数：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。不同 C 给不同曲线，C 可以为正、负或零；零解是完整通解的一员。指数中 k 的符号决定非零解随 x 增大的尺度趋势，不能把 k 的符号当作 C 的符号限制。<br>对非零解，可写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>k<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，积分得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>k<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，指数化并把符号吸收到实常数，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。这一步曾除以 y，所以应单独检查被除掉的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，再并入 C=0。不能把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><msub><mi>C<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msup><\/mrow><\/math> 当成允许所有实数的常数，却又忘了原符号；正确写法是合并正负号，并补回零解。最终对函数求导代入，比只比较形式更可靠。"},{"topic_id":"t06","title":"一元函数极值：驻点与导数变号","body":"在内点 c 附近，若函数值都不小于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 c 是极小点；若都不大于，则是极大点。极值点是自变量位置，极值是该点的函数值，不能互换。可导函数在内点取得极值时，导数必为零；这只是必要条件。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 在零点导数零，却一直递增，没有极值。不满足可导条件的点也可能有极值，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 的零点，故寻找候选点还要检查不可导点。<br>先解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，按驻点把定义域分区间，取测试点或因式符号判断导数。左正右负是极大，左负右正是极小，两侧同号不是极值。判断需要邻域中的符号，而非只计算驻点处 f′。多项式导数分解后，偶重根不改变符号，奇重根通常改变符号；分母符号也应纳入。随后代入原函数求极值，不能把导数函数的值当答案。"},{"topic_id":"t07","title":"伴随矩阵的行列式","body":"对 n 阶方阵 A，伴随矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> 的第 i,j 元素是 A 的第 j,i 代数余子式，即余子式矩阵再转置。其核心恒等式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>，可由行列式按一行展开及重复行的行列式为零推出。这里星号表示伴随，不表示转置或共轭；不同教材符号可能不同，应按题干定义理解。即使 A 不可逆，恒等式也成立。<br>若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，由恒等式得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。对两边取行列式，注意把一个标量乘进 n 行会产生 n 次幂，于是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。直接取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 也得到相同公式。重点是右边单位矩阵仍为 n 阶，不能把它的行列式算成一个单独的 |A|。"},{"topic_id":"t08","title":"恰有一个事件发生：集合与概率","body":"设事件 A、B。“至少一个发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math>，“两者都发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math>，“恰有一个发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>&#x029F5;<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0222A;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mi>&#x029F5;<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。后面两块互斥，所以概率可相加。把事件语言先划分成只发生 A、只发生 B、同时发生、都不发生四块，能避免把相近的中文关键词误读成同一公式。两事件的交集是否为空，是一个关于试验结果的条件，不能凭题目给出两边缘概率来猜。<br>至少一个的公式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，减一次交集是因为两边缘概率把同时发生重复加了两次。恰好一个则是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因为最终交集不应保留。还可从至少一个再减同时发生推导。若求都不发生，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；若求至多一个，则是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，这与恰好一个又不同。"},{"topic_id":"t09","title":"等价无穷小与乘积型极限","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003B1;<\/mi><\/mrow><mrow><mi>&#x003B2;<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x0007E;<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>。当 x 趋零时，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。复合变量 u 也趋零时，可以把 x 替换成 u。最后一项属于二阶，是许多错误的来源；不能把所有趋零的函数都一律当成 x。实数对数还要求真数为正，但在零点的足够小邻域内，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 满足这一条件。<br>若每个替换因子的原式与替代式比值趋一，则乘积的比值也趋一，所以分子分母的有限个乘除因子可以分别替换。比如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>a<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时分子等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，分母等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。替换后相同的 x 次幂约去，比例系数仍保留。b 为负时极限也可能为负，不能用“都是无穷小”推断结果非负。"},{"topic_id":"t10","title":"一元微分与复合函数链式法则","body":"可导函数 y=f(x) 在一点的微分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，其中 dx 是自变量增量的独立微分记号。导数是变化率，微分是这条线性近似对应的函数改变量，答案类型不同。若题目问 dy，只写 f′ 会遗漏 dx；若问 y′，额外加 dx 又不合适。函数真实增量满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x00394;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x00394;<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，微分是其中的线性主部，不等于任意有限变化的精确值。<br>若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，先求外层余弦，再乘内层常数 k；常数 c 的导数为零，但仍留在余弦内部。若内层是二次式，其导数是随 x 变化的线性式，也必须保留。把内外层分两行书写，比脑中一次完成更能发现漏因子。"},{"topic_id":"t11","title":"行列式乘法与含参数二阶矩阵","body":"矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>p<\/mi><\/mtd><mtd><mi>q<\/mi><\/mtd><\/mtr><mtr><mtd><mi>r<\/mi><\/mtd><mtd><mi>s<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 的行列式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mi>s<\/mi><mo>&#x02212;<\/mo><mi>q<\/mi><mi>r<\/mi><\/mrow><\/math>。主对角线乘积减副对角线乘积，遇到负数应保留括号。行列式是实数，而 A 是矩阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 表示行列式，不是把各元素取绝对值；行列式可以为负或零。含参数时，先把行列式写成参数多项式，再解方程，不能在还没弄清题目所求之前逐元素求积。<br>同阶方阵满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。矩阵乘法一般不交换，但两个实数行列式相乘可以交换，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，这不代表 AB=BA。如果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>d<\/mi><\/mrow><\/math> 可以除以 |B| 得 |A|；若 |B|=0，则所有参数下 |AB|=0，给定 d 非零会无解，给定 d 为零则不能由这一条件约束 A。除法之前必须先检查因子是否为零。"},{"topic_id":"t12","title":"不放回抽取：数对计数与概率","body":"从若干不同数字中随机取两个，若是不放回且不计顺序，每一个二元子集等可能，总数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;<\/mo><mfrac linethickness=\"0\"><mrow><mi>N<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>N<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>N<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。若依次抽取并计顺序，总数为 N(N−1)，每个不同数字的无序对对应两种顺序，概率不变。若放回，则会出现相同数字两次，总数 N²，事件概率可能改变。题干“任取两个”不足以自动决定这些细节，原创题将明确写出规则。<br>不计顺序时令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><mo>&#x0003C;<\/mo><mi>j<\/mi><\/mrow><\/math>，按 i 从小到大枚举，使每一对只出现一次。对于条件 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><mo>&#x0002B;<\/mo><mi>j<\/mi><mo>&#x0003E;<\/mo><mi>T<\/mi><\/mrow><\/math>，给定 i 后，j 必须同时满足 j&gt;i 与 j&gt;T−i，再与可选数字的上下界取交集。严格大于不包含等于，阈值为整数时，最小允许 j 是 T−i+1。这样按行计数比随意列一些数对更可靠，最后应确认没有重复和遗漏。"},{"topic_id":"t13","title":"相消型指数极限与高阶展开","body":"指数表达式在零点通常能先代入。若分子和分母都趋零，得到的是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 未定式，不能直接认定极限为零。需要找分子零点的阶数，并与分母比较。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，两个常数项合计后减二为零，两个线性项 ax 与 −ax 也相消，二次项相加后仍存在。因此若分母为 x²，期待有限非零值，而不是把每个指数近似到一阶就宣布分子恒零。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，相加减二为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，除以 x² 得 a²。若题目再减去 a²x²，必须继续到四阶，不能用已有二阶展开计算相消后的极限。展开所到阶数由分母及相消结构决定，余项也要相应标为更小阶，避免保留的信息不足。"},{"topic_id":"t14","title":"二阶齐次方程：重根与切线初值","body":"对常系数方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>q<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，试取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。两个不同实根时解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>；重实根 r 时则为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。二阶通解需要两个独立常数，两个同指数项合并后只剩一个有效常数，不是完整通解。这里的独立是函数之间不能互为常数倍，不能仅看写了两个字母。<br>对于方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>r<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mi>v<\/mi><\/mrow><\/math>。分别求导代入，含 v 与 v′ 的项抵消，剩 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><msup><mi>v<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 v 为一次函数。于是得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。这种代换直接解释了 x 的来源，也为检查重根形式提供方法；不能在所有二阶方程里随意乘 x，只有根型满足重根条件时才采用这一形式。"},{"topic_id":"t15","title":"最大值包络函数的分段定积分","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 在每个 x 取两者较大值，是一个新的函数，并不是分别求两个函数的区间最大值再取较大者。若 f、g 连续，包络也连续，即使交点处导数可能改变，仍可积分。首先解 f=g 找可能的切换点，再判断每个相邻区间的大小关系。交点只是候选切换，若差函数在那里不变号，两边会仍由同一个函数占优，不应机械地切换。<br>比较 x 与 x²，可看 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。在 (0,1) 为正，故较大者是 x；在 (1,2) 为负，较大者是 x²。负半轴上 x² 也大于 x。区间不同，选择规则可能改变，不能把只适用于 [0,2] 的分段表拿到整个实轴。若积分区间不含某个交点，就没有必要在那个点拆分；若交点等于端点，单点选哪一支不影响积分值。"},{"topic_id":"t16","title":"幂级数：平移中心、半径与端点","body":"幂级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 的中心是 h，而非总是零。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><msub><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 存在且为正有限数，通项比值极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，收敛半径 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>&#x003C1;<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mi>R<\/mi><\/mrow><\/math> 时绝对收敛，大于 R 时发散。中心 x=h 的项从 n=1 开始均为零，必收敛；这一点不能因为做比值时除以 x−h 而丢失。<br>例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>r<\/mi><mi>n<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，相邻系数绝对比为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，极限 1/r，所以 R=r。n、n² 或 n 的固定次幂对半径没有影响，几何因子 rⁿ 决定尺度。若系数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><msup><mi>r<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，半径仍 r，但端点收敛情况会不同，这说明半径相同不代表收敛域相同。做比值时指数从 n 到 n+1 的变化必须完整保留，不能把 r 的因子约丢。"},{"topic_id":"t17","title":"半圆域的二重积分与积分顺序","body":"半径 R 的右半圆盘为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>:<\/mi><mi>x<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。用水平小条切割，外层 y 在 [−R,R]，每个固定 y 的 x 从零到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>。若用竖条，x 在 [0,R]，y 从负平方根到正平方根。两种表达都编码同一块区域，不可把右半盘误写成第一象限四分之一盘。积分函数和区域连续闭有界时，通常可以合法换序。<br>对被积函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，水平条先算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/msubsup><mi>x<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，根号在平方后消失。于是外层只需积分偶多项式，可化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>R<\/mi><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>4<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，结果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><msup><mi>R<\/mi><mn>5<\/mn><\/msup><\/mrow><mrow><mn>15<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。若先对 y 积分会出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><\/math>，仍能算，但明显不如前者直接。选顺序不是改变问题，而是利用同一域寻找简单的内层原函数。"},{"topic_id":"t18","title":"无盖长方体容器的全局最大体积","body":"设长、宽、高分别为 a、b、h，均为正数。无盖容器用料面积 S 包括一个底面和四个侧面，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>S<\/mi><\/mrow><\/math>，体积 V=abh。没有顶面，不能写成闭箱的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>a<\/mi><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>h<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>b<\/mi><mi>h<\/mi><\/mrow><\/math>；单位也要一致。变量不能任意趋于负数，边界 a=0、b=0 或 h=0 是退化容器，不属于正常尺寸，但可用极限讨论全局最大值是否被遗漏。<br>固定底面积 p=ab，由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x02265;<\/mo><mn>2<\/mn><msqrt><mi>p<\/mi><\/msqrt><\/mrow><\/math>，等号当且仅当 a=b。面积约束给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mfrac><mrow><mo>&#x02264;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><msqrt><mi>p<\/mi><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，从而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x02264;<\/mo><msqrt><mfrac><mrow><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/msqrt><\/mrow><\/math>。若底面不是正方形，周长较大，同样底面积要消耗更多侧面材料，使可用高度和体积更小。这个不等式给所有可行容器统一的上界，比仅猜测对称尺寸更能证明优化底面形状的合法性。"},{"topic_id":"t19","title":"矩阵方程的移项与左乘消去","body":"方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mi>X<\/mi><\/mrow><\/math> 中 X 是未知同阶矩阵。把右边的 cX 移到左边，利用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math>。这里减的是一个标量倍单位矩阵，不是从 A 的每一个元素都减 c；只改变对角元。若系数可逆，左乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><\/mrow><\/math>。把逆放到右侧一般无法按定义消去左系数，必须尊重矩阵乘法的顺序。<br>令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><\/mrow><\/math>，X 的各列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>，A 的对应列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">a<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math> 等价于对每列求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><msub><mi mathvariant=\"bold-italic\">x<\/mi><mi>j<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi mathvariant=\"bold-italic\">a<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>。这提供不显式求逆的消元方法：一次处理增广块 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo>&#x02223;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，左半变成 E 时，右半就是 X。若 B 为三角矩阵，可从每列逐行求未知数。方法的本质仍是解线性方程，而非逐元素把 A 除以 B。"},{"topic_id":"t20","title":"超定线性方程组与通解的含义","body":"设 m 个方程、n 个未知数，系数矩阵 A 为 m×n，增广矩阵再多一列。即使 m&gt;n，也可能唯一解、无穷多解或无解。真正判据是系数矩阵秩与增广矩阵秩：二者不同则无解；相同且等于 n 则唯一解；相同且小于 n 则有自由变量。方程条数只是数据规模，独立条件的数目由消元后的主元数决定。不能看到四个方程三个未知数就先认定矛盾。<br>把系数和右端一起写入增广矩阵，交换行、乘非零倍数、把一行的倍数加到另一行时，必须同时处理右端。若消出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><mn>0<\/mn><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>d<\/mi><\/mrow><\/math> 且 d 非零，便有矛盾；若右端也为零，则这行冗余，不增加约束。保留算式或清楚的行变换符号能帮助定位错误。只对左半做行变换，会改变方程的解集，而不再是原问题。"},{"topic_id":"t21","title":"高次方程正根唯一性：除以 x 的辅助函数","body":"证明方程恰有一个正根，需要先证明至少有一个，再证明不可能有两个。若连续函数在正数 a、b 处异号，由零点定理得到 (a,b) 中至少一根；但它并不限制区间外的根数。严格单调可保证至多一个根，却不能保证一定与零相交。书写证明时把这两条逻辑明确分开，分别给出条件和结论；图像的示意交点只能帮助理解，不能代替零点定理与单调性的论证。<br>对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x003B1;<\/mi><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mi>&#x003B2;<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>&#x003B3;<\/mi><\/mrow><\/math>，在 x&gt;0 时可以除以 x，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x003B1;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mi>&#x003B2;<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>&#x003B3;<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。原式与这个式子在正半轴等价，因为 x 非零；在 x=0 处不能这样除。若 α、γ 均为正，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>G<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>&#x003B1;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>&#x003B3;<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，全正半轴严格递增。这样的转换保留根的位置，却把原多项式导数中难处理的负常数项移成了辅助函数中的常数。"}],"source_pages":{"exam":["../assets/source-pages/0a1f394d078164b051eb635f9d9e4375714fd8ed50c2e982f9601ca1c44d5521.jpg","../assets/source-pages/33238c37ec84683ae82a3265f695532e0678be996baacca9aba957dabe62b3fa.jpg","../assets/source-pages/22fec7311c1e4324fd00135041e66db48df52a873e208fddc9eb39af34cdbbd7.jpg"],"answers":["../assets/source-pages/96a36e3f949baeafb097c1bc5c1f46d5e89bbfd96a3bb342da27a614b2aba874.jpg","../assets/source-pages/4231dfa9e72a095616ad62b8fee38aa14b87862b65dbcd9adb26ea86907946ec.jpg","../assets/source-pages/cd54d0da9f6c9ea8d3e1572a5c0ffb9085fd0edbfbfad614876785593529ee86.jpg","../assets/source-pages/033dd6ce92dca78e9fa07ede73dba422e8989bccd5619acc2c47540dd48d1252.jpg","../assets/source-pages/3946aa1753c6ad2487831fc94b962e4ffa99991566a27db6d6abbb7da02db367.jpg","../assets/source-pages/65761d8a6f1b26c8a92b98e0867545e2757f0a03e013fcc35900fb6f0f269462.jpg","../assets/source-pages/9a54e2055391394782f768fde0bb80e014834903498d83f4a4cdc9b184405cbf.jpg"],"s1":["../assets/source-pages/eec22cb51973b1df21186ba6cde9e428f687cefc0c941ea5d515067a6abdda5f.jpg","../assets/source-pages/373a6b22eb1216801b4367bcd378b7cf3773f753e4f2c86708c393de355ebea0.jpg","../assets/source-pages/b43a7ca09b45ff025b09973fd8e0f4a44e8521ff6101cb0f946c80095d61bc4e.jpg","../assets/source-pages/8dc52cf72be587c7a864ac0d789d859f1dc578fe8e33968fb777145d5ddc4773.jpg","../assets/source-pages/1cf8c1f898c12fd1e721009008a2887ee4f0499713101239d7bfeaeea741ae4a.jpg","../assets/source-pages/496a388d2453a6dfb3b97c0508140a8c1916863cc0fb6b07406d08ab122f9d61.jpg","../assets/source-pages/d0a65ea4b87213a89dc0f78e9a67d11e25a425fcd103d43e009a5ea62158f4bf.jpg","../assets/source-pages/c54127965d3f0c8a0870d51faf9ea819ee67f47fd5c6ff3e006649e88d1ea8e8.jpg","../assets/source-pages/b1e532c83dc9de86642236d6b0add8fbe0f8fbcfda101616427f0dc89c55b42c.jpg","../assets/sour       if (button) { button.disabled = true; button.textContent = "解析已展开"; }
      refreshQuestionScore(id, number); updateSummary(id);
    }
    main.addEventListener("input", function (event) {
      var element = event.target, id = element.dataset.paper, number = element.dataset.response;
      if (number != null && attempts[id] && !attempts[id].submitted) {
        if (shouldAutoSubmit(attempts[id], Date.now())) { submit(id, "timeout"); return; }
        if (element.type === "radio" && !element.checked) return;
        attempts[id].responses[number] = element.value; save("attempt." + id, attempts[id]);
        if (element.type === "radio") {
          main.querySelectorAll('input[name="' + element.name + '"]').forEach(function (radio) {
            radio.closest("label").classList.toggle("selected", radio.checked);
          });
        }
        refreshBadge(id, number);
        if (attempts[id].mode === "practice" && attempts[id].revealed[number]) {
          refreshQuestionScore(id, number); updateSummary(id);
        }
      } else if (element.dataset.selfScore != null && attempts[id]) {
        var qnumber = Number(element.dataset.selfScore), attempt = attempts[id];
        if (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[qnumber])) return;
        var q = papers[id].questions.find(function (item) { return item.number === qnumber; });
        var read = readScore(element.value, q.points);
        var message = document.getElementById("score-message-" + id + "-" + qnumber);
        element.setAttribute("aria-invalid", read.ok ? "false" : "true");
        if (message) message.textContent = read.ok ? "留空为待评；零为已评零分。" : read.error;
        if (!read.ok) {
          delete attempt.selfScores[qnumber]; save("attempt." + id, attempt);
          updateSummary(id); refreshQuestionScore(id, qnumber); return;
        }
        if (read.value === null) delete attempt.selfScores[qnumber]; else attempt.selfScores[qnumber] = read.value;
        save("attempt." + id, attempt); updateSummary(id);
        refreshQuestionScore(id, qnumber);
      } else if (element.dataset.practiceResponse) {
        var pid = element.dataset.practiceResponse;
        practiceProgress[pid] = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        practiceProgress[pid].response = element.value; delete practiceProgress[pid].judgment; save("practices", practiceProgress);
        var liveVerdict = main.querySelector(".practice-verdict");
        if (liveVerdict && practiceProgress[pid].revealed) liveVerdict.textContent = practiceVerdict(practiceMap[pid], practiceProgress[pid]);
        refreshNav();
        var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-correct" || action === "practice-incorrect") {
        var judgedId = button.dataset.id, judged = practiceProgress[judgedId];
        if (!judged || !judged.revealed) return;
        judged.judgment = action === "practice-correct" ? "correct" : "incorrect";
        save("practices", practiceProgress);
        var verdict = main.querySelector(".practice-verdict");
        if (verdict) verdict.textContent = practiceVerdict(practiceMap[judgedId], judged);
        refreshNav();
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
