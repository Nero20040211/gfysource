问题化为一变量。","sections":[{"title":"建模与正变量范围","body":"设长、宽、高分别为 a、b、h，均为正数。无盖容器用料面积 S 包括一个底面和四个侧面，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>S<\/mi><\/mrow><\/math>，体积 V=abh。没有顶面，不能写成闭箱的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>a<\/mi><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>h<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>b<\/mi><mi>h<\/mi><\/mrow><\/math>；单位也要一致。变量不能任意趋于负数，边界 a=0、b=0 或 h=0 是退化容器，不属于正常尺寸，但可用极限讨论全局最大值是否被遗漏。"},{"title":"先证明正方形底面最优","body":"固定底面积 p=ab，由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x02265;<\/mo><mn>2<\/mn><msqrt><mi>p<\/mi><\/msqrt><\/mrow><\/math>，等号当且仅当 a=b。面积约束给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mfrac><mrow><mo>&#x02264;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><msqrt><mi>p<\/mi><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，从而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x02264;<\/mo><msqrt><mfrac><mrow><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/msqrt><\/mrow><\/math>。若底面不是正方形，周长较大，同样底面积要消耗更多侧面材料，使可用高度和体积更小。这个不等式给所有可行容器统一的上界，比仅猜测对称尺寸更能证明优化底面形状的合法性。"},{"title":"化成一变量并判断全局","body":"令 u=√p，范围 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>u<\/mi><mo>&#x0003C;<\/mo><msqrt><mi>S<\/mi><\/msqrt><\/mrow><\/math>，上界为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math> 前正后负，故该点是整个可行区间的唯一最大点；两端极限均为零。选择 a=b=u、h=u/2 时可以取得上界，因此这也是原三变量问题的全局最优，而不是只在正方形底面子类中的局部结论。"},{"title":"尺寸、最大体积及边界检查","body":"总面积 S 下最优长宽为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>，高为其一半，最大体积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。真题 S=48 得 4、4、2，体积 32。写答案时既要尺寸又要证明最大性，不能只解拉格朗日驻点就结束。若要求底面长宽比例固定为 r，比例不等于一时最大体积会变小；迁移题将在明确约束下重新优化，防止把无盖条件与任意箱体模型混用。"}],"boundaries":["只找到驻点不能自动声称全局最大；无盖不计顶面。","无盖只计一个底面；对称条件应由证明或题面约束得到，不能盲目把长宽高都设相等。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"无盖长方体容器用料面积为 27，长宽高均正，求最大体积及尺寸。","answer":"长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>，宽 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>，高 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，最大体积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>27<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["设底面积 p=ab，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x02265;<\/mo><mn>2<\/mn><msqrt><mi>p<\/mi><\/msqrt><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x02264;<\/mo><msqrt><mfrac><mrow><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/msqrt><\/mrow><\/math>。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo>&#x0003D;<\/mo><msqrt><mi>p<\/mi><\/msqrt><\/mrow><\/math>，对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><msup><mi>q<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 求导，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>q<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，唯一最大点为 q=√(S/3)。","上界在正方形底面取得，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，最大体积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>27<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","导数在该点前正后负，两端体积趋零；这给全局最大而非仅驻点。"],"pitfall":"无盖只计一个底面；对称条件应由证明或题面约束得到，不能盲目把长宽高都设相等。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"q*(27 - q**2)/4","var":"q","order":1,"expected":"27/4 - 3*q**2/4"},{"op":"eq","lhs":"27","rhs":"27"},{"op":"eq","lhs":"27/2","rhs":"27/2"}]},"hint":"先用底面周长不等式或比例约束化成一个变量。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"无盖长方体容器用料面积为 12，另限制长等于宽的 4 倍。求最大体积及尺寸，并比较不限制比例时的体积。","answer":"长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>，宽 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，高 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，最大体积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>16<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["设宽 q&gt;0，长为 4q，由面积约束得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>S<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>q<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","体积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><mi>q<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>12<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>q<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，可行范围 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>q<\/mi><mo>&#x0003C;<\/mo><msqrt><mrow><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>。","导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>24<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><mn>24<\/mn><msup><mi>q<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，唯一变号点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x000B7;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>，前正后负。","宽 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>，高 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，最大体积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>16<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；小于不限制比例时的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>。"],"pitfall":"无盖只计一个底面；对称条件应由证明或题面约束得到，不能盲目把长宽高都设相等。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"2*q*(12 - 4*q**2)/5","var":"q","order":1,"expected":"24/5 - 24*q**2/5"},{"op":"eq","lhs":"12","rhs":"12"},{"op":"eq","lhs":"16/5","rhs":"16/5"}]},"hint":"先用底面周长不等式或比例约束化成一个变量。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 3 页，第 18 题"},{"source":"answers","locator":"PDF 第 5 页，第 18 题"},{"source":"s3","locator":"PDF 第 8—9 页：极值与最值"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"无盖长方体水箱及长度宽度高度标记，透视示意不表示真实比例\"><title>无盖长方体水箱及长度宽度高度标记，透视示意不表示真实比例<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M145 110L365 110L468 58L248 58Z\" fill=\"none\" stroke=\"#17675b\" stroke-width=\"3\"/><path d=\"M145 110V235L365 235L468 182V58 M365 110V235 M145 235L248 182L468 182 M248 58V182\" fill=\"#dceee3\" fill-opacity=\".35\" stroke=\"#17675b\" stroke-width=\"3\"/><text x=\"234\" y=\"257\" fill=\"#29483f\" style=\"font-size:16px\">长 l<\/text><text x=\"424\" y=\"230\" fill=\"#29483f\" style=\"font-size:16px\">宽 w<\/text><text x=\"97\" y=\"184\" fill=\"#29483f\" style=\"font-size:16px\">高 h<\/text><text x=\"284\" y=\"92\" fill=\"#29483f\" style=\"font-size:16px\">无顶盖<\/text><text x=\"103\" y=\"292\" fill=\"#29483f\" style=\"font-size:15px\">底面积与四壁面积组成约束；目标是长×宽×高。<\/text><\/svg>"},{"id":"t19","module":"m09","title":"矩阵方程的移项与左乘消去","prerequisites":"会做矩阵加减与乘法，理解可逆矩阵。","intuition":"X 左侧的矩阵系数必须从左边消去；把矩阵当可交换实数会改变解。","sections":[{"title":"先识别乘法所在的位置","body":"方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><mi>X<\/mi><\/mrow><\/math> 中 X 是未知同阶矩阵。把右边的 cX 移到左边，利用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math>。这里减的是一个标量倍单位矩阵，不是从 A 的每一个元素都减 c；只改变对角元。若系数可逆，左乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><\/mrow><\/math>。把逆放到右侧一般无法按定义消去左系数，必须尊重矩阵乘法的顺序。"},{"title":"把一个矩阵方程拆成列方程","body":"令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><\/mrow><\/math>，X 的各列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">x<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>，A 的对应列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">a<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math> 等价于对每列求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><msub><mi mathvariant=\"bold-italic\">x<\/mi><mi>j<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi mathvariant=\"bold-italic\">a<\/mi><mi>j<\/mi><\/msub><\/mrow><\/math>。这提供不显式求逆的消元方法：一次处理增广块 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo>&#x02223;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，左半变成 E 时，右半就是 X。若 B 为三角矩阵，可从每列逐行求未知数。方法的本质仍是解线性方程，而非逐元素把 A 除以 B。"},{"title":"可逆性与简便结构","body":"如果 B 是下三角矩阵，其行列式为对角元的乘积，只要所有对角元非零就可逆。还可以写 A=B+cE，于是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><mo>&#x0002B;<\/mo><mi>c<\/mi><msup><mi>B<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>，有时计算更快。若 c=0 且 A 可逆，原式 AX=A 给 X=E；若 B 奇异，则不能直接求逆，要逐列检查一致性，可能无解或有多个解。没有证明可逆就“约掉”矩阵，既可能非法，也可能遗漏参数分支。"},{"title":"真题与乘积复核","body":"真题 c=2，A 的对角元为 4、1、3，所以 B 的对角元为 2、−1、1，乘积非零。解出 X 后应验证 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>X<\/mi><\/mrow><\/math> 为零矩阵，每个元素都需满足，而不能只检查行列式相等。所附解对应 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。原创例题用三角与非对角矩阵对照，讲清同一代数操作的方向条件；该部分是专门线性代数补充。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["逆的乘法位置不能交换；只有对角元减二。","从左侧消去系数；A−cE 只改对角元，不能每个元素减 c。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mi>X<\/mi><\/mrow><\/math> 的矩阵 X。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mtd><mtd><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","steps":["移项并提取右因子 X，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math>。","系数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，行列式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>≠0，可逆。","从左乘逆得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><\/mrow><\/math>，逐列求解或块消元均可。","计算得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mtd><mtd><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，把 BX 与 A 比较，每个元素一致。"],"pitfall":"从左侧消去系数；A−cE 只改对角元，不能每个元素减 c。","check_data":{"kind":"generic","checks":[{"op":"matrix_product","a":[["2","0"],["1","3"]],"b":[["3/2","0"],["-1/6","4/3"]],"expected":[["3","0"],["1","4"]]},{"op":"eq","lhs":"Matrix([[2, 0], [1, 3]]).det()","rhs":"6"}]},"hint":"先把标量倍 X 写成 (cE)X。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x0002B;<\/mo><mn>0<\/mn><mi>X<\/mi><\/mrow><\/math> 的矩阵 X。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","steps":["移项并提取右因子 X，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mi>E<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math>。","系数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，行列式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>≠0，可逆。","从左乘逆得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02212;<\/mo><mi>c<\/mi><mi>E<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><\/mrow><\/math>，逐列求解或块消元均可。","计算得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，把 BX 与 A 比较，每个元素一致。"],"pitfall":"从左侧消去系数；A−cE 只改对角元，不能每个元素减 c。","check_data":{"kind":"generic","checks":[{"op":"matrix_product","a":[["1","2"],["0","1"]],"b":[["1","0"],["0","1"]],"expected":[["1","2"],["0","1"]]},{"op":"eq","lhs":"Matrix([[1, 2], [0, 1]]).det()","rhs":"1"}]},"hint":"先把标量倍 X 写成 (cE)X。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 3 页，第 19 题"},{"source":"answers","locator":"PDF 第 5,6 页，第 19 题"}],"figure":null},{"id":"t20","module":"m09","title":"超定线性方程组与通解的含义","prerequisites":"会列增广矩阵和初等行变换，理解自由变量。","intuition":"方程比未知数多不意味着无解；多出来的方程可能与已有方程一致，也可能提供矛盾。","sections":[{"title":"方程数不是解的分类标准","body":"设 m 个方程、n 个未知数，系数矩阵 A 为 m×n，增广矩阵再多一列。即使 m&gt;n，也可能唯一解、无穷多解或无解。真正判据是系数矩阵秩与增广矩阵秩：二者不同则无解；相同且等于 n 则唯一解；相同且小于 n 则有自由变量。方程条数只是数据规模，独立条件的数目由消元后的主元数决定。不能看到四个方程三个未知数就先认定矛盾。"},{"title":"消元必须作用于整行","body":"把系数和右端一起写入增广矩阵，交换行、乘非零倍数、把一行的倍数加到另一行时，必须同时处理右端。若消出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><mn>0<\/mn><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>d<\/mi><\/mrow><\/math> 且 d 非零，便有矛盾；若右端也为零，则这行冗余，不增加约束。保留算式或清楚的行变换符号能帮助定位错误。只对左半做行变换，会改变方程的解集，而不再是原问题。"},{"title":"通解不一定包含自由参数","body":"“通解”指全部解的描述。唯一解时全部解只有一个向量，直接写该向量就完成通解；不能为了符合字面印象而强行加入参数。有自由变量时，应选非主元变量为参数，再从主元行求其他变量，写成一个特解加齐次方向的线性组合。参数个数是 n−rank(A)。如果题目有参数条件导致秩变化，应先分支再除可能为零的量，避免排除合法分支。"},{"title":"真题代入与冗余行检查","body":"真题四个方程三个未知数，前三条的三阶系数行列式为 22，故前三条唯一解；所得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 也满足第四条，因而整个方程组唯一解。求解后必须把候选向量代回全部四式，而非只验证用于求解的三式。练习将多余一行改成矛盾或完全冗余的对照，解释解为何改变。线性代数部分依据卷面问题独立补充，不把四方程形式误改成别的题型。"},{"title":"残差与解空间的复核","body":"给出候选向量后，计算残差 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi mathvariant=\"bold-italic\">x<\/mi><mo>&#x02212;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><\/mrow><\/math>，必须是零向量。若解写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>t<\/mi><mi mathvariant=\"bold-italic\">v<\/mi><\/mrow><\/math>，还要分别核对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msub><mi mathvariant=\"bold-italic\">x<\/mi><mn>0<\/mn><\/msub><mo>&#x0003D;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi mathvariant=\"bold-italic\">v<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。这只能验证所写向量确实是解；要证明已经包含全部解，仍需根据秩和自由变量说明方向空间的维数。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["“通解”不强制带自由参数。","通解不必带参数；方程多于未知数并不自动无解。所有方程都需复核。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求方程组 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;<\/mo><mtable><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><mn>2<\/mn><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mtd><\/mtr><\/mtable><\/mrow><\/mrow><\/math> 的通解。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">x<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","steps":["增广矩阵消元，系数与增广秩均为三。","每个未知数都有主元，因而没有自由参数。","解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","代回全部四个方程都满足，第四条没有造成矛盾。通解就是这个唯一向量。"],"pitfall":"通解不必带参数；方程多于未知数并不自动无解。所有方程都需复核。","check_data":{"kind":"generic","checks":[{"op":"linear_system","matrix":[[1,1,0],[0,1,1],[1,0,1],[2,2,0]],"rhs":["3","1","2","6"],"solution":["2","1","0"]}]},"hint":"先做增广矩阵消元，再按主元数判断自由变量。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"求方程组 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;<\/mo><mtable><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><mn>2<\/mn><msub><mi>x<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mtd><\/mtr><\/mtable><\/mrow><\/mrow><\/math> 的通解。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">x<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>t<\/mi><mo>&#x00028;<\/mo><mtable><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>","steps":["对增广矩阵作初等行变换，得到系数矩阵秩为二，增广秩也为二。","三个未知数中有一个自由变量，齐次解空间为一维。","取特解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，齐次方向 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，两者代入分别给右端与零。","所有解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">x<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>t<\/mi><mo>&#x00028;<\/mo><mtable><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。"],"pitfall":"通解不必带参数；方程多于未知数并不自动无解。所有方程都需复核。","check_data":{"kind":"generic","checks":[{"op":"linear_system","matrix":[[1,1,0],[0,1,1],[1,2,1],[2,2,0]],"rhs":["2","3","5","4"],"solution":["0","2","1"],"basis":[["-1","1","-1"]]}]},"hint":"先做增广矩阵消元，再按主元数判断自由变量。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 3 页，第 20 题"},{"source":"answers","locator":"PDF 第 6 页，第 20 题"}],"figure":null},{"id":"t21","module":"m03","title":"高次方程正根唯一性：除以 x 的辅助函数","prerequisites":"会求导、判断单调性，知道连续函数零点定理。","intuition":"存在性靠变号，唯一性靠严格单调；原多项式不单调时，可以在正半轴换一个等价辅助函数。","sections":[{"title":"存在与唯一是两个任务","body":"证明方程恰有一个正根，需要先证明至少有一个，再证明不可能有两个。若连续函数在正数 a、b 处异号，由零点定理得到 (a,b) 中至少一根；但它并不限制区间外的根数。严格单调可保证至多一个根，却不能保证一定与零相交。书写证明时把这两条逻辑明确分开，分别给出条件和结论；图像的示意交点只能帮助理解，不能代替零点定理与单调性的论证。"},{"title":"原函数导数不简单时换函数","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x003B1;<\/mi><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mi>&#x003B2;<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>&#x003B3;<\/mi><\/mrow><\/math>，在 x&gt;0 时可以除以 x，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x003B1;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mi>&#x003B2;<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>&#x003B3;<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。原式与这个式子在正半轴等价，因为 x 非零；在 x=0 处不能这样除。若 α、γ 均为正，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>G<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>&#x003B1;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>&#x003B3;<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，全正半轴严格递增。这样的转换保留根的位置，却把原多项式导数中难处理的负常数项移成了辅助函数中的常数。"},{"title":"端点行为保证存在","body":"当 γ&gt;0 时，x 趋零正侧，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003B3;<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 使 G 趋于负无穷；x 趋正无穷，x⁴ 主导使 G 趋于正无穷。因此可以选两个正数使其异号，连续性给一根；全域严格递增给至多一根。如果题目要求根所在的具体区间，则计算对应两个端点的值并显示异号。仅证明在某区间单调，不能排除区间外的其他正根，故单调区间必须覆盖整个待证范围。"},{"title":"版本差异与真题完整证明","body":"试卷第 21 题是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>7<\/mn><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，所附解析却是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>7<\/mn><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，二者不是同一方程。本资料采用试卷版本：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>7<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，在正半轴导数严格正；G(1)=−7，G(2)=12，故 (1,2) 至少有一根且全正半轴至多一根。也可用原多项式在 1、2 的值 −7、24 来证存在，两种端点数值不可混写。证明卷依旧保留论证题形式，逐步提升参数与辅助函数选择。"}],"boundaries":["所附解析的方程不同；本资料跟随试卷，不搬用另一个多项式。","仅证明局部单调不足以排除其他正根；存在性与唯一性分开，除以 x 只在正半轴合法。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"证明方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>5<\/mn><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 恰有一个正根，并说明它在 (0,2) 内。","answer":"恰有一个正根，且在 (0,2) 内。","steps":["在 x&gt;0 除以 x，原方程等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>4<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>G<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，所有项在正半轴非负且首项为正，故 G 严格递增。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>（x→0+），而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>37<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，由连续性存在一根。","严格递增保证全正半轴至多一根；合并得唯一正根。"],"pitfall":"仅证明局部单调不足以排除其他正根；存在性与唯一性分开，除以 x 只在正半轴合法。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"x**5 + 2*x**3 - 5*x - 1","rhs":"x*(x**4 + 2*x**2 - 5 - 1/x)"},{"op":"diff","expr":"x**4 + 2*x**2 - 5 - 1/x","var":"x","order":1,"expected":"4*x**3 + 4*x + x**(-2)"},{"op":"limit","expr":"x**4 + 2*x**2 - 5 - 1/x","var":"x","at":"0","expected":"-oo","dir":"+"},{"op":"eq","lhs":"37/2","rhs":"37/2"}]},"hint":"在正半轴除以 x，观察辅助函数导数。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"证明方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>0<\/mn><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 没有正根。","answer":"没有正根。","steps":["在 x&gt;0 除以 x，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","左边两项均为正，所以不可能等于零。","原方程的 x=0 根不是正根，除以 x 的限定不会遗漏待讨论范围中的根。"],"pitfall":"仅证明局部单调不足以排除其他正根；存在性与唯一性分开，除以 x 只在正半轴合法。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"x**5 + x**3","rhs":"x*(x**4 + x**2)"},{"op":"diff","expr":"x**4 + x**2","var":"x","order":1,"expected":"4*x**3 + 2*x"}]},"hint":"在正半轴除以 x，观察辅助函数导数。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 3 页，第 21 题"},{"source":"answers","locator":"PDF 第 6,7 页，第 21 题"},{"source":"s3","locator":"PDF 第 25 页：方程根的证明与应用"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"原卷证明题除以正x得到严格递增的辅助函数，只能与零线相交一次\"><title>原卷证明题除以正x得到严格递增的辅助函数，只能与零线相交一次<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"75\" y1=\"240\" x2=\"560\" y2=\"240\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"90\" y1=\"255\" x2=\"90\" y2=\"35\" stroke=\"#879d92\" stroke-width=\"2\"/><text x=\"557\" y=\"264\" fill=\"#29483f\" style=\"font-size:16px\">x<\/text><text x=\"69\" y=\"35\" fill=\"#29483f\" style=\"font-size:16px\">y<\/text><line x1=\"90\" y1=\"173\" x2=\"560\" y2=\"173\" stroke=\"#a0aaa4\" stroke-width=\"2\"/><path d=\"M150.00 220.26 L153.12 218.97 L156.25 217.80 L159.38 216.74 L162.50 215.75 L165.62 214.83 L168.75 213.97 L171.88 213.15 L175.00 212.37 L178.12 211.63 L181.25 210.90 L184.38 210.20 L187.50 209.51 L190.62 208.83 L193.75 208.15 L196.88 207.48 L200.00 206.80 L203.12 206.12 L206.25 205.43 L209.38 204.74 L212.50 204.02 L215.62 203.30 L218.75 202.55 L221.88 201.79 L225.00 201.00 L228.12 200.19 L231.25 199.35 L234.38 198.48 L237.50 197.58 L240.62 196.64 L243.75 195.67 L246.88 194.66 L250.00 193.61 L253.12 192.52 L256.25 191.38 L259.38 190.20 L262.50 188.97 L265.62 187.69 L268.75 186.35 L271.88 184.96 L275.00 183.51 L278.12 182.00 L281.25 180.43 L284.38 178.79 L287.50 177.08 L290.62 175.31 L293.75 173.46 L296.88 171.54 L300.00 169.55 L303.12 167.47 L306.25 165.31 L309.38 163.07 L312.50 1
