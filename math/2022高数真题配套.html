  <script type="application/json" id="course-data">{"meta":{"title":"重庆专升本高数 · 真题配套学习","date":"2026-10-11","scope":"2022逐题考点＋同考点递进训练","content_hash":"90080aa3e7a59b2dfa9ec182f0bac519c56e6d60aa4e956e9b10f7b4a61958ee"},"sources":[{"id":"exam","title":"2022年重庆市专升本高数真题（A3排版）","path":"2022年重庆市专升本高数真题（A3排版）.pdf","pages":3},{"id":"answers","title":"2022年重庆市专升本《高等数学》真题答案解析","path":"2022年重庆市专升本《高等数学》真题答案解析.pdf","pages":7},{"id":"s1","title":"第一章：函数，极限和连续","path":"第一章：函数，极限和连续.pdf","pages":27},{"id":"s2","title":"第二章：导数与微分","path":"第二章：导数与微分.pdf","pages":24},{"id":"s3","title":"第三章：微分中值定理与导数的应用","path":"第三章：微分中值定理与导数的应用.pdf","pages":25},{"id":"s4","title":"第四章：不定积分","path":"第四章：不定积分.pdf","pages":16},{"id":"s5","title":"第五章：定积分","path":"第五章：定积分.pdf","pages":19},{"id":"s6","title":"第六章：微分方程","path":"第六章：微分方程.pdf","pages":14}],"modules":[{"id":"m01","title":"极限与连续","topic_ids":["t01","t09","t13"]},{"id":"m02","title":"导数与微分","topic_ids":["t10"]},{"id":"m03","title":"导数应用与根的唯一性","topic_ids":["t06","t18","t21"]},{"id":"m04","title":"一元积分","topic_ids":["t04","t15"]},{"id":"m05","title":"微分方程","topic_ids":["t05","t14"]},{"id":"m06","title":"无穷级数与幂级数","topic_ids":["t02","t16"]},{"id":"m07","title":"空间向量","topic_ids":["t03"]},{"id":"m08","title":"二重积分","topic_ids":["t17"]},{"id":"m09","title":"线性代数","topic_ids":["t07","t11","t19","t20"]},{"id":"m10","title":"概率","topic_ids":["t08","t12"]}],"topics":[{"id":"t01","module":"m01","title":"分段函数：极限存在与连续延拓","prerequisites":"会代入初等函数，知道左右极限和函数值的区别。","intuition":"先把零点两侧的趋近分开，再决定参数和点值；缺少点值时，不能直接谈在该点连续。","sections":[{"title":"三件需要分别核对的事","body":"在一点连续，需要函数在该点有定义、去心极限存在、极限等于点值三个条件同时成立。去心极限只关心附近非零位置的函数值，不受单个点值的改变影响。左右极限都存在且相等时，两侧极限才存在。若左右极限不同，即使随意补一个点值也不能修复；若二者相同且有限，只需补成共同极限就能作连续延拓。先圈出题目是否给了 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，再开始计算参数，能避免把两个问题混为一谈。"},{"title":"常见零点极限的用法","body":"基本极限 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mi>sin<\/mi><mi>u<\/mi><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 要求内部变量确实趋于零。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>k<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 时函数恒为零，结论仍成立。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 在零点表达式没有定义，但极限为一，正好说明极限存在不等于函数有定义。多项式一侧可以直接代入；分式一侧应先看是否为未定式，再使用基本极限。"},{"title":"参数匹配与点值补全","body":"遇到左段 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><\/math>、右段 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，左极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>，右极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>。要求极限存在，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math>；要求连续，还需要 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math>。其中斜率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 对零点左极限没有影响，却会影响导数；因此连续题中没有求出的参数可能并非遗漏，而是该条件本来不约束它。若给了 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math>，必须同时写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math>，不能只处理左右段。"},{"title":"先处理真题的表述边界","body":"2022 年试卷第 1 题左段为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><\/math>，右段为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，题面未给零点值，却写零点连续。按“极限存在”的可确定信息，参数是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>；补充 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 后才得到连续函数。所附解析采用极限存在的表述，说明这里应把参数答案和连续延拓说明同时保留。独立练习将明确给出零点定义，迁移练习则要求判断能否通过修改一个点值实现连续，而不是默认所有间断都可修复。"}],"boundaries":["缺少点值时，原函数在零点的连续性不能直接成立。","左右极限相同只是极限存在；还要检查点值。若没有点值，应补定义。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>p<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><\/math>（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>），<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>），其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。求连续所需的 a。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。","steps":["左侧多项式趋于 a，与斜率 p=2 无关。","右侧写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，极限为 3。","两侧极限相等需要 a=3。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。"],"pitfall":"左右极限相同只是极限存在；还要检查点值。若没有点值，应补定义。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"sin(3*x)/x","var":"x","at":"0","expected":"3","dir":"+"},{"op":"limit","expr":"2*x + 3","var":"x","at":"0","expected":"3","dir":"-"},{"op":"eq","lhs":"3","rhs":"3"}]},"hint":"依次比较左极限、右极限、点值。","answer_mode":"numeric","answer_value":3.0,"accepted":["3"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>p<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><\/math>（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>），<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>），其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>。能否只选择 a 使 f 在零点连续？说明理由。","answer":"无此 a。左右极限匹配要求 a=2，但点值为 5，不等于共同极限。","steps":["左侧多项式趋于 a，与斜率 p=1 无关。","右侧写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，极限为 2。","两侧极限相等需要 a=2。","无此 a。左右极限匹配要求 a=2，但点值为 5，不等于共同极限。"],"pitfall":"左右极限相同只是极限存在；还要检查点值。若没有点值，应补定义。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"sin(2*x)/x","var":"x","at":"0","expected":"2","dir":"+"},{"op":"limit","expr":"x + 2","var":"x","at":"0","expected":"2","dir":"-"},{"op":"eq","lhs":"5","rhs":"5"}]},"hint":"依次比较左极限、右极限、点值。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 1 题"},{"source":"answers","locator":"PDF 第 1 页，第 1 题"},{"source":"s1","locator":"连续概念与左右极限；全文作为先修资料，不指定未经定位的页码"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"分段函数的衔接：左极限、右极限和点值需要同时匹配，示意图\"><title>分段函数的衔接：左极限、右极限和点值需要同时匹配，示意图<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"75\" y1=\"240\" x2=\"560\" y2=\"240\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"90\" y1=\"255\" x2=\"90\" y2=\"35\" stroke=\"#879d92\" stroke-width=\"2\"/><text x=\"557\" y=\"264\" fill=\"#29483f\" style=\"font-size:16px\">x<\/text><text x=\"69\" y=\"35\" fill=\"#29483f\" style=\"font-size:16px\">y<\/text><line x1=\"150\" y1=\"218\" x2=\"310\" y2=\"130\" stroke=\"#17675b\" stroke-width=\"3\"/><path d=\"M310.00 130.00 L315.00 128.75 L320.00 127.51 L325.00 126.29 L330.00 125.09 L335.00 123.93 L340.00 122.81 L345.00 121.74 L350.00 120.72 L355.00 119.78 L360.00 118.90 L365.00 118.10 L370.00 117.38 L375.00 116.75 L380.00 116.21 L385.00 115.77 L390.00 115.42 L395.00 115.18 L400.00 115.04 L405.00 115.00 L410.00 115.07 L415.00 115.24 L420.00 115.51 L425.00 115.89 L430.00 116.36 L435.00 116.93 L440.00 117.59 L445.00 118.33 L450.00 119.15 L455.00 120.05 L460.00 121.02 L465.00 122.05 L470.00 123.14 L475.00 124.28 L480.00 125.45 L485.00 126.65 L490.00 127.88 L495.00 129.13 L500.00 130.38 L505.00 131.62 L510.00 132.86\" fill=\"none\" stroke=\"#9b6a3c\" stroke-width=\"3\"/><circle cx=\"310\" cy=\"130\" r=\"7\" fill=\"#f3f7f5\" stroke=\"#17675b\" stroke-width=\"3\"/><line x1=\"310\" y1=\"130\" x2=\"310\" y2=\"240\" stroke=\"#879d92\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"120\" y=\"81\" fill=\"#29483f\" style=\"font-size:16px\">先算左极限<\/text><text x=\"387\" y=\"83\" fill=\"#29483f\" style=\"font-size:16px\">再算右极限<\/text><text x=\"246\" y=\"263\" fill=\"#29483f\" style=\"font-size:16px\">衔接点 x₀<\/text><text x=\"117\" y=\"289\" fill=\"#29483f\" style=\"font-size:16px\">两侧一致还需点值匹配，才能在该点连续。<\/text><\/svg>"},{"id":"t02","module":"m06","title":"级数收敛的必要条件与反例","prerequisites":"理解数列极限、级数部分和与发散的含义。","intuition":"收敛级数的每一项必须变小到零；反过来，项变小不保证所有项的累计总和有限。","sections":[{"title":"从部分和推出通项趋零","body":"记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>。若级数收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mi>S<\/mi><\/mrow><\/math>，同时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mi>S<\/mi><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。这个证明没有要求每项为正，也没有要求绝对收敛。它提供快速排除法：只要通项不趋零，级数就发散；但若已经算出通项趋零，还不能据此宣布收敛。学习时应把“必要条件”读成所有收敛级数都必须通过的门槛，而不是通过门槛就自动合格。"},{"title":"必要条件不能反向使用","body":"调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的通项趋零，却发散；平方倒数级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 收敛。二者的差别在累加速度。对正项级数，可用比较判别或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 级数结论：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 时收敛，在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math> 时发散。比较时需要方向正确：用一个已知收敛的上界控制原级数，或用一个已知发散的下界推出原级数发散。不能只看分母含有 n 就判断收敛。"},{"title":"倒数级数的定义与符号","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 且每个相关项非零，则对任意 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，充分大的 n 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003C;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>M<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003E;<\/mo><mi>M<\/mi><\/mrow><\/math>。倒数通项的绝对值趋于无穷，不可能趋零，所以倒数级数发散。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 有零项，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> 在那些位置根本没有定义，应先说明定义障碍。只有最终保持正号时，才能写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>；存在正负交替时，带符号的倒数可能没有无穷极限。"},{"title":"交错符号不能代替判别","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 给出一个绝对收敛的级数，但其倒数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，绝对值不断增大，倒数级数仍发散。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 可由交错判别收敛，绝对值级数却发散。真题第 2 题考查的是由收敛推出通项趋零，再排除倒数级数；不需要把“交错”和“收敛”直接等同。本单元为真题配套补充，六章一元微积分资料没有提供完整级数章节，讲解与反例均单独编写。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["不具备最终正号条件时，不应写倒数趋于正无穷；有零项时倒数未定义。","通项趋零是必要而非充分条件；倒数要求分母非零，符号也不能省略。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 是否足以推出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛。","answer":"不足。通项趋零，但调和级数发散。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>lim<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，只满足必要条件。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mi>N<\/mi><\/msubsup><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>N<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>；积分判别说明调和级数发散。"],"pitfall":"通项趋零是必要而非充分条件；倒数要求分母非零，符号也不能省略。","check_data":{"kind":"generic","checks":[{"op":"limit","expr":"1/n","var":"n","at":"oo","expected":"0","dir":"+"},{"op":"limit","expr":"log(n)","var":"n","at":"oo","expected":"oo","dir":"+"}]},"hint":"先分清对象是否有定义，再检查通项必要条件。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>，并评价“倒数趋于正无穷”。","answer":"原级数绝对收敛，倒数级数发散；倒数不趋于正无穷，而是正负交替、绝对值趋于无穷。","steps":["绝对值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，p=2&gt;1，级数收敛。","倒数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，通项不趋零。","偶数子列趋正无穷，奇数子列趋负无穷；所以不能写统一的正无穷极限。"],"pitfall":"通项趋零是必要而非充分条件；倒数要求分母非零，符号也不能省略。","check_data":{"kind":"generic","checks":[{"op":"integral","expr":"1/x**2","var":"x","lo":"1","hi":"oo","expected":"1"},{"op":"limit","expr":"n**2","var":"n","at":"oo","expected":"oo","dir":"+"},{"op":"limit","expr":"-(2*n+1)**2","var":"n","at":"oo","expected":"-oo","dir":"+"}]},"hint":"先分清对象是否有定义，再检查通项必要条件。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 2 题"},{"source":"answers","locator":"PDF 第 1 页，第 2 题"}],"figure":null},{"id":"t03","module":"m07","title":"空间向量的数量积与夹角","prerequisites":"会算三分量向量长度，熟悉余弦的取值范围。","intuition":"夹角由数量积和两条向量的长度共同确定；长度或分量的相似并不意味着方向相同。","sections":[{"title":"数量积的坐标定义","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">a<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>a<\/mi><mn>3<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">b<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>3<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，数量积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mn>3<\/mn><\/msub><msub><mi>b<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>，结果是实数，不是向量。计算时应让相同坐标位置配对，尤其注意负数乘负数的符号。长度为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msqrt><mrow><msubsup><mi>a<\/mi><mn>1<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0002B;<\/mo><msubsup><mi>a<\/mi><mn>2<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0002B;<\/mo><msubsup><mi>a<\/mi><mn>3<\/mn><mn>2<\/mn><\/msubsup><\/mrow><\/msqrt><\/mrow><\/math>，负分量在平方后仍贡献正数。数量积可以为负，长度不为负，这两种量不能混用。先求数量积再求长度，能减少不必要的平方根运算。"},{"title":"夹角公式与适用条件","body":"两条非零向量的夹角 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B8;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>&#x003C0;<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo>&#x000B7;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。分母必须非零，零向量与任何向量的夹角通常不定义；虽然零向量与其他向量的数量积都为零，也不能套公式得到直角。得到的余弦必须在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，超出范围说明计算有误。若只问锐角、直角或钝角，数量积符号已经足够，无须算反余弦。"},{"title":"垂直、平行与参数题","body":"非零向量垂直当且仅当数量积为零。平行则要求一个向量是另一个的实数倍，比例为正时夹角零，为负时夹角为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><\/mrow><\/math>。含参数时，先按题目要的关系建立方程：垂直用数量积零；夹角已知用余弦公式。若平方以消去根号，最后必须回到未平方的式子检查符号，否则可能把锐角和钝角答案同时保留下来。分量为零时也不能随便用除法比较比例。"},{"title":"真题思路与结果解释","body":"真题两向量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的数量积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，长度都是三，故夹角 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。这题的核心是坐标数量积而非空间图形的外观。配套例题设置直角与钝角对照，练习再加入参数，使学习者解释符号变化的意义。向量内容属于真题配套补充，来源限于卷面及所附解析；示意图只编码方向关系，不能从图上目测推导精确夹角。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["数量积结果是数；不要把向量夹角看成平面投影的目测夹角。","不要对数量积取绝对值，否则会把钝角改成锐角。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"非零向量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">u<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">v<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，求夹角的余弦并判断夹角类型。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>，夹角为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["数量积为 0。","长度平方分别为 5 与 14，两者非零。","用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi mathvariant=\"bold-italic\">u<\/mi><mo>&#x000B7;<\/mo><mi mathvariant=\"bold-italic\">v<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">u<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">v<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","由数量积符号判断夹角为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"不要对数量积取绝对值，否则会把钝角改成锐角。","check_data":{"kind":"generic","checks":[{"op":"vector_angle","a":[1,2,0],"b":[2,-1,3],"expected_cos":"0"},{"op":"eq","lhs":"0","rhs":"0"}]},"hint":"先做对应坐标乘积之和。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"非零向量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">u<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">v<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，求夹角的余弦并判断夹角类型。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，夹角为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["数量积为 -1。","长度平方分别为 2 与 2，两者非零。","用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi mathvariant=\"bold-italic\">u<\/mi><mo>&#x000B7;<\/mo><mi mathvariant=\"bold-italic\">v<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">u<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi mathvariant=\"bold-italic\">v<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","由数量积符号判断夹角为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"pitfall":"不要对数量积取绝对值，否则会把钝角改成锐角。","check_data":{"kind":"generic","checks":[{"op":"vector_angle","a":[1,1,0],"b":[-1,0,1],"expected_cos":"-1/2"},{"op":"eq","lhs":"-1","rhs":"-1"}]},"hint":"先做对应坐标乘积之和。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 3 题"},{"source":"answers","locator":"PDF 第 1 页，第 3 题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"空间向量示意投影，不能根据绘制夹角判断实际夹角\"><title>空间向量示意投影，不能根据绘制夹角判断实际夹角<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"155\" y1=\"206\" x2=\"505\" y2=\"206\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"155\" y1=\"206\" x2=\"76\" y2=\"255\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"155\" y1=\"206\" x2=\"155\" y2=\"46\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"155\" y1=\"206\" x2=\"429\" y2=\"78\" stroke=\"#17675b\" stroke-width=\"4\"/><line x1=\"155\" y1=\"206\" x2=\"295\" y2=\"38\" stroke=\"#b17443\" stroke-width=\"4\"/><text x=\"436\" y=\"79\" fill=\"#29483f\" style=\"font-size:16px\">向量 a<\/text><text x=\"282\" y=\"28\" fill=\"#29483f\" style=\"font-size:16px\">向量 b<\/text><text x=\"500\" y=\"231\" fill=\"#29483f\" style=\"font-size:16px\">x<\/text><text x=\"62\" y=\"270\" fill=\"#29483f\" style=\"font-size:16px\">y<\/text><text x=\"166\" y=\"47\" fill=\"#29483f\" style=\"font-size:16px\">z<\/text><text x=\"267\" y=\"180\" fill=\"#29483f\" style=\"font-size:16px\">先算点积与模长<\/text><text x=\"90\" y=\"289\" fill=\"#29483f\" style=\"font-size:15px\">二维示意投影；空间夹角由点积求出，不能按图量角。<\/text><\/svg>"},{"id":"t04","module":"m04","title":"由不定积分反求被积函数","prerequisites":"理解原函数定义，会用链式法则。","intuition":"对等式两边求导，就能从原函数回到被积函数；乘在未知函数前的因子可能留下零点漏洞。","sections":[{"title":"原函数等式的真正含义","body":"若题给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，意思是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 在讨论区间的导数等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mi>f<\/mi><\/mrow><\/math>。对两边求导得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，任意常数的导数为零。应先算出右边完整导数，再处理左边的因子。不能把积分符号直接约去，也不能把 f 写成 F；积分和求导互为逆向操作，但求导仍要遵守复合函数、乘积及定义域规则。"},{"title":"内层导数与比例系数","body":"指数复合函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 的导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>；若左边因子是 x，非零点便得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。类似地，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的导数是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。外层求导后一定要乘内层导数，省略它就会丢掉 x 或倍数。得到候选 f 后，再乘回 g 并与 F′ 比较，是一个独立而简单的核对办法。"},{"title":"除以零不能偷偷进行","body":"从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 得到 f 时，只能在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 处除以 x。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，原等式在零点只说 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，没有确定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；如果额外要求 f 连续，才可用附近值的极限补定零点值。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，则没有在零点取有限值的 f 能满足等式。这个区分涉及点值与邻域信息，不能因为最后表达式看起来在零点有定义，就声称题目已强制确定那里。"},{"title":"原题边界与一般化","body":"真题右端是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，所以非零点处 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。题目没有额外连续条件时，零点值不受乘积导数关系约束；若按连续函数理解，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。变式把因子改为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math> 时，漏洞移动到 a；把因子改为始终非零的指数函数时，可以在整个区间唯一反解。答题时应交代在哪个区间讨论原函数，再给出适用条件，而不是仅记住一条机械公式。"}],"boundaries":["未给连续性时，零点 f 值不受关系限制。","除以 x−h 时要说明非零条件；单点值不能由消去后的式子强行补定。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，且 f 在实轴连续，求 f。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>（对所有实数 x）。","steps":["两边求导，积分常数的导数为零。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>。","当 x≠0 时除以该因子，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>。","在 x=0 时乘积关系仅为 0=0。连续性给零点值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/math>。"],"pitfall":"除以 x−h 时要说明非零条件；单点值不能由消去后的式子强行补定。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"exp(-2*x**2)","var":"x","order":1,"expected":"-4*x*exp(-2*x**2)"},{"op":"eq","lhs":"-4*x*exp(-2*x**2)","rhs":"-4*x*exp(-2*x**2)"},{"op":"limit","expr":"-4*exp(-2*x**2)","var":"x","at":"0","expected":"-4","dir":"+"}]},"hint":"先求右端导数，后除左边因子。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，未要求 f 连续，求非零因子处的 f，并说明特殊点是否确定。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>6<\/mn><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>（<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>）；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 未被条件确定。","steps":["两边求导，积分常数的导数为零。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>6<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>。","当 x≠0 时除以该因子，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>6<\/mn><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msup><\/mrow><\/math>。","在 x=0 时乘积关系仅为 0=0。没有连续性，不能确定该点值。"],"pitfall":"除以 x−h 时要说明非零条件；单点值不能由消去后的式子强行补定。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"exp(-3*x**2)","var":"x","order":1,"expected":"-6*x*exp(-3*x**2)"},{"op":"eq","lhs":"-6*x*exp(-3*x**2)","rhs":"-6*x*exp(-3*x**2)"},{"op":"limit","expr":"-6*exp(-3*x**2)","var":"x","at":"0","expected":"-6","dir":"+"}]},"hint":"先求右端导数，后除左边因子。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 4 题"},{"source":"answers","locator":"PDF 第 2 页，第 4 题"},{"source":"s4","locator":"PDF 第 1 页：原函数与不定积分定义"}],"figure":null},{"id":"t05","module":"m05","title":"一阶齐次微分方程与初值","prerequisites":"会求指数导数与基本积分，理解任意常数。","intuition":"增长率正比于函数自身时，解为指数函数族；一个初值从这一函数族中选出一条曲线。","sections":[{"title":"微分方程与通解","body":"方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>k<\/mi><mi>y<\/mi><\/mrow><\/math> 含未知函数及其导数，不是关于 x 的普通代数方程。解要求在某个区间上逐点满足等式。一阶方程的通解通常含一个任意常数：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。不同 C 给不同曲线，C 可以为正、负或零；零解是完整通解的一员。指数中 k 的符号决定非零解随 x 增大的尺度趋势，不能把 k 的符号当作 C 的符号限制。"},{"title":"分离变量的推导与遗漏风险","body":"对非零解，可写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>k<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，积分得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>k<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，指数化并把符号吸收到实常数，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。这一步曾除以 y，所以应单独检查被除掉的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，再并入 C=0。不能把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><msub><mi>C<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msup><\/mrow><\/math> 当成允许所有实数的常数，却又忘了原符号；正确写法是合并正负号，并补回零解。最终对函数求导代入，比只比较形式更可靠。"},{"title":"用积分因子避免除未知函数","body":"把方程写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mi>k<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，左边正好是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><\/mrow><\/math>。因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><mi>x<\/mi><\/mrow><\/msup><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><\/mrow><\/math>，直接得到全体解，零解不会遗漏。若 k 被连续函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 替代，则积分因子为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>；任取一个原函数即可，积分因子中的附加常数可以吸收，不需再引入第二个独立常数。"},{"title":"初值、特解与核对","body":"给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>k<\/mi><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msup><\/mrow><\/math>，可写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><msup><mi>e<\/mi><mrow><mi>k<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><\/mrow><\/math>。真题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，没有初值时不能擅自指定 C=1。初值为零会选出恒零函数，而不是使方程无解。核对时分别验证导数关系与初值，两项缺一不可；仅满足方程的函数若未满足初值，还不是题目所求的特解。"}],"boundaries":["零解也属于通解。","分离变量曾除以 y，不能遗漏零初值对应的零解。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"求方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>y<\/mi><\/mrow><\/math> 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 的特解。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","steps":["通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，允许 C=0。","代入初值得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。","代回通解得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","求导与初值分别核对。"],"pitfall":"分离变量曾除以 y，不能遗漏零初值对应的零解。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"6*exp(3*x)","rhs":"6*exp(3*x)"},{"op":"eq","lhs":"2","rhs":"2"}]},"hint":"先写通解，再代初值。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"求方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><\/math> 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的特解。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>","steps":["通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，允许 C=0。","代入初值得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","代回通解得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","求导与初值分别核对。"],"pitfall":"分离变量曾除以 y，不能遗漏零初值对应的零解。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"0","rhs":"0"},{"op":"eq","lhs":"0","rhs":"0"}]},"hint":"先写通解，再代初值。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 5 题"},{"source":"answers","locator":"PDF 第 2 页，第 5 题"},{"source":"s6","locator":"PDF 第 1—3 页：微分方程基本概念及解法"}],"figure":null},{"id":"t06","module":"m03","title":"一元函数极值：驻点与导数变号","prerequisites":"掌握一阶、二阶导数与数轴符号分析。","intuition":"导数等于零给出候选点，极大或极小取决于该点两侧的变化趋势。","sections":[{"title":"极值的局部含义","body":"在内点 c 附近，若函数值都不小于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 c 是极小点；若都不大于，则是极大点。极值点是自变量位置，极值是该点的函数值，不能互换。可导函数在内点取得极值时，导数必为零；这只是必要条件。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 在零点导数零，却一直递增，没有极值。不满足可导条件的点也可能有极值，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 的零点，故寻找候选点还要检查不可导点。"},{"title":"一阶导数符号法","body":"先解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，按驻点把定义域分区间，取测试点或因式符号判断导数。左正右负是极大，左负右正是极小，两侧同号不是极值。判断需要邻域中的符号，而非只计算驻点处 f′。多项式导数分解后，偶重根不改变符号，奇重根通常改变符号；分母符号也应纳入。随后代入原函数求极值，不能把导数函数的值当答案。"},{"title":"二阶导数的快捷判别","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，c 为极小点；二阶导数小于零则为极大点。若二阶导数也为零，判别法没有结论，要回到一阶导数符号或更直接比较。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 在零点二阶导数零但取得极小，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 二阶导数零却没有极值，这对照说明“二阶导数零”不能自动解释成两种中的任意一种。"},{"title":"局部极值与区间最值","body":"真题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>6<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 在 x=1 的导数为零，二阶导数为 12，所以那里是极小点，极小值为 −3。若题目改问闭区间最大值与最小值，还须比较所有内点候选值和两个端点值；端点可以取得全局最值，却通常不按内点极值定义处理。三次函数在整个实轴上无全局最大最小，不能把局部极大值称为全局最大值。"},{"title":"端点与图形核对","body":"如果函数只在闭区间上考查，先画驻点和区间端点的相对位置，再比较原函数值。某个驻点不在区间内就不纳入候选；一个驻点恰好成为端点时，单侧趋势可以说明区间最值，却不能直接套两侧极值判别。检查答案究竟要求“点”还是“值”，可避免方法正确而结果类型错误。"}],"boundaries":["极小点与极小值是不同对象。","二阶导数为零时没有直接结论，不能一律判定非极值。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math>，判断 x=1 是否为极值点；若是，写出类型与极值。","answer":"极小点，极值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。","steps":["一阶导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>，在 x=1 为零，是驻点。","二阶导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mi>x<\/mi><\/mrow><\/math>。","二阶导数在该点为 6，由判别法确定。","驻点只给候选，最终结论依赖二阶非零判别或一阶变号。"],"pitfall":"二阶导数为零时没有直接结论，不能一律判定非极值。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"x**3 - 3*x","var":"x","order":1,"expected":"3*x**2 - 3"},{"op":"diff","expr":"x**3 - 3*x","var":"x","order":2,"expected":"6*x"},{"op":"eq","lhs":"0","rhs":"0"},{"op":"eq","lhs":"-2","rhs":"-2"}]},"hint":"先求一阶和二阶导数；退化情况看两侧符号。","answer_mode":"self"},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msup><\/mrow><\/math>，判断 x=0 是否为极值点；若是，写出类型与极值。","answer":"非极值点。","steps":["一阶导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>，在 x=0 为零，是驻点。","二阶导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mi>x<\/mi><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 在两侧均为正，函数继续递增，没有极值。","驻点只给候选，最终结论依赖二阶非零判别或一阶变号。"],"pitfall":"二阶导数为零时没有直接结论，不能一律判定非极值。","check_data":{"kind":"generic","checks":[{"op":"diff","expr":"x**3","var":"x","order":1,"expected":"3*x**2"},{"op":"diff","expr":"x**3","var":"x","order":2,"expected":"6*x"},{"op":"eq","lhs":"0","rhs":"0"},{"op":"eq","lhs":"0","rhs":"0"}]},"hint":"先求一阶和二阶导数；退化情况看两侧符号。","answer_mode":"self"}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 6 题"},{"source":"answers","locator":"PDF 第 2 页，第 6 题"},{"source":"s3","locator":"PDF 第 8—9 页：极值与最值"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"导数由负变正给出局部极小值，示意图不代表特定函数\"><title>导数由负变正给出局部极小值，示意图不代表特定函数<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7f5\"/><line x1=\"75\" y1=\"240\" x2=\"560\" y2=\"240\" stroke=\"#879d92\" stroke-width=\"2\"/><line x1=\"90\" y1=\"255\" x2=\"90\" y2=\"35\" stroke=\"#879d92\" stroke-width=\"2\"/><text x=\"557\" y=\"264\" fill=\"#29483f\" style=\"font-size:16px\">x<\/text><text x=\"69\" y=\"35\" fill=\"#29483f\" style=\"font-size:16px\">y<\/text><path d=\"M110.00 94.00 L117.00 94.38 L124.00 95.51 L131.00 97.39 L138.00 99.98 L145.00 103.26 L152.00 107.18 L159.00 111.70 L166.00 116.77 L173.00 122.32 L180.00 128.28 L187.00 134.59 L194.00 141.16 L201.00 147.92 L208.00 154.78 L215.00 161.66 L222.00 168.48 L229.00 175.16 L236.00 181.61 L243.00 187.75 L250.00 193.51 L257.00 198.83 L264.00 203.63 L271.00 207.86 L278.00 211.47 L285.00 214.41 L292.00 216.64 L299.00 218.15 L306.00 218.91 L313.00 218.91 L320.00 218.15 L327.00 216.64 L334.00 214.41 L341.00 211.47 L348.00 207.86 L355.00 203.63 L362.00 198.83 L369.00 193.51 L376.00 187.75 L383.00 181.61 L390.00 175.16 L397.00 168.48 L404.00 161.66 L411.00 154.78 L418.00 147.92 L425.00 141.16 L432.00 134.59 L439.00 128.28 L446.00 122.32 L453.00 116.77 L460.00 111.70 L467.00 107.18 L474.00 103.26 L481.00 99.98 L488.00 97.39 L495.00 95.51 L502.00 94.38 L509.00 94.00\" fill=\"none\" stroke=\"#17675b\" stroke-width=\"3\"/><line x1=\"309\" y1=\"217\" x2=\"309\" y2=\"240\" stroke=\"#879d92\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"159\" y=\"104\" fill=\"#29483f\" style=\"font-size:16px\">左侧递减<\/text><text x=\"363\" y=\"111\" fill=\"#29483f\" style=\"font-size:16px\">右侧递增<\/text><text x=\"259\" y=\"267\" fill=\"#29483f\" style=\"font-size:16px\">极小值点<\/text><text x=\"117\" y=\"289\" fill=\"#29483f\" style=\"font-size:16px\">局部谷底不等于整个定义域上的最小值。<\/text><\/svg>"},{"id":"t07","module":"m09","title":"伴随矩阵的行列式","prerequisites":"会算方阵行列式，理解单位矩阵与余子式。","intuition":"伴随矩阵来自代数余子式的转置，它的行列式由原矩阵行列式及阶数共同控制。","sections":[{"title":"伴随的定义与核心恒等式","body":"对 n 阶方阵 A，伴随矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> 的第 i,j 元素是 A 的第 j,i 代数余子式，即余子式矩阵再转置。其核心恒等式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>，可由行列式按一行展开及重复行的行列式为零推出。这里星号表示伴随，不表示转置或共轭；不同教材符号可能不同，应按题干定义理解。即使 A 不可逆，恒等式也成立。"},{"title":"可逆情形推导行列式","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，由恒等式得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。对两边取行列式，注意把一个标量乘进 n 行会产生 n 次幂，于是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。直接取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 也得到相同公式。重点是右边单位矩阵仍为 n 阶，不能把它的行列式算成一个单独的 |A|。"},{"title":"奇异与小阶边界","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02265;<\/mo><mn>2<\/mn><\/mrow><\/math>，若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，伴随矩阵也奇异，公式仍给零；可通过秩关系或行列式多项式恒等式解释。原公式不是仅在可逆情形才成立，只是用逆矩阵的那条推导暂时要求可逆。二阶时伴随的行列式等于原行列式；三阶时等于平方，原行列式负数也会得到正数。切勿因为含负号就把平方结果写成负数。"},{"title":"与数乘及乘积结合","body":"真题是三阶 A，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>。若再求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>c<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，先乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>c<\/mi><mi>n<\/mi><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>c<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>；若求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。阶数是这一题中必读的条件。练习将阶数与数乘搭配，迫使学习者识别两个不同的指数来源。该单元是线性代数配套补充，不把它归入六章微积分资料的覆盖范围。"},{"title":"用低维实例检查规则","body":"可以取对角矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>diag<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>d<\/mi><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mi>&#x02026;<\/mi><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，伴随对角元为一个一和 n−1 个 d，因此其行列式正是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>d<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。这个实例帮助检查公式的指数和负号；一般性证明仍来自伴随恒等式。不要把某个例子的对角结构误当作所有矩阵的要求。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["不要用三次幂或只乘一次原行列式。","数乘指数是阶数，伴随指数是阶数减一；负行列式要按实际幂计算。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"设 A 是 3 阶矩阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><\/mrow><\/math>","steps":["伴随恒等式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mrow><mn>3<\/mn><\/mrow><\/msub><\/mrow><\/math> 给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>。","标量乘入 3 行，故行列式再乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>1<\/mn><mrow><mn>3<\/mn><\/mrow><\/msup><\/mrow><\/math>。","结果为 9。"],"pitfall":"数乘指数是阶数，伴随指数是阶数减一；负行列式要按实际幂计算。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"Matrix([[-3, 0, 0], [0, 1, 0], [0, 0, 1]]).adjugate().det()","rhs":"9"},{"op":"eq","lhs":"(1*Matrix([[-3, 0, 0], [0, 1, 0], [0, 0, 1]]).adjugate()).det()","rhs":"9"}]},"hint":"先用伴随行列式公式，再处理数乘。","answer_mode":"numeric","answer_value":9.0,"accepted":["9"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"设 A 是 2 阶矩阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>","steps":["伴随恒等式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>E<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><\/mrow><\/math> 给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><msup><mo stretchy=\"false\">&#x0007C;<\/mo><mrow><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。","标量乘入 2 行，故行列式再乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>1<\/mn><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>。","结果为 -2。"],"pitfall":"数乘指数是阶数，伴随指数是阶数减一；负行列式要按实际幂计算。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"Matrix([[-2, 0], [0, 1]]).adjugate().det()","rhs":"-2"},{"op":"eq","lhs":"(1*Matrix([[-2, 0], [0, 1]]).adjugate()).det()","rhs":"-2"}]},"hint":"先用伴随行列式公式，再处理数乘。","answer_mode":"numeric","answer_value":-2.0,"accepted":["-2"]}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 7 题"},{"source":"answers","locator":"PDF 第 2 页，第 7 题"}],"figure":null},{"id":"t08","module":"m10","title":"恰有一个事件发生：集合与概率","prerequisites":"理解并事件、交事件、互斥和独立。","intuition":"“至少一个”保留同时发生，“恰好一个”排除同时发生；两者概率相差一个交事件。","sections":[{"title":"先把语言写成事件","body":"设事件 A、B。“至少一个发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math>，“两者都发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math>，“恰有一个发生”为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>&#x029F5;<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0222A;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mi>&#x029F5;<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。后面两块互斥，所以概率可相加。把事件语言先划分成只发生 A、只发生 B、同时发生、都不发生四块，能避免把相近的中文关键词误读成同一公式。两事件的交集是否为空，是一个关于试验结果的条件，不能凭题目给出两边缘概率来猜。"},{"title":"两种常用公式的推导","body":"至少一个的公式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，减一次交集是因为两边缘概率把同时发生重复加了两次。恰好一个则是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因为最终交集不应保留。还可从至少一个再减同时发生推导。若求都不发生，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；若求至多一个，则是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，这与恰好一个又不同。"},{"title":"独立与互斥不能混淆","body":"独立要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，互斥要求交集为空、交概率零。若两边缘概率都大于零，这两个条件不能同时成立。题目已经给交概率时，直接代入集合公式即可，不需要独立假设；若没有给交概率，也没有独立等关系，通常无法唯一求恰好一个。边缘与交概率还应满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mo>min<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，否则数据不可能来自同一概率模型。"},{"title":"真题与变式的检核","body":"真题两边缘概率都为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，交概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，所以恰好一个为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。试卷与解析的选项排列有差异，应按数值与试卷字母核对，不能直接搬解析选项。配套题明确说明独立与否，并给出四块概率的非负检查。概率知识为专门补充；公式解释依托真题事件结构，不声称六章微积分资料已讲授概率。"},{"title":"已知至少一个发生时的条件概率","body":"设 D 表示至少一个发生，即 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math>；E 表示恰好一个发生。条件概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02223;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02229;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。因为恰好一个一定属于至少一个，E 包含于 D，分子就是 P(E)，故结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">[<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。若已给并概率，先由并事件公式反求交概率，再计算恰好一个。举例的数值检核是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo>&#x0002C;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002C;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 时，交概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>10<\/mn><\/mrow><\/mfrac><\/mrow><\/math>、恰好一个概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，条件概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>5<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。这是在原概率领域内的迁移方法，不要求额外独立性；若 D 概率零，通常条件概率式不定义。"},{"title":"补充内容的来源边界","body":"此知识单元依据 2022 年真题所需方法独立编写，卷面和解析用于识别考点与交叉核对。所提供六章资料未完整覆盖本领域；这里的定义、推导、原创例题和练习是配套补充，不作为章节资料原文或官方考试说明。"}],"boundaries":["所附解析选项版式与试卷有差异，应核对事件和数值。","恰好一个要减两次交集；至少一个只减一次。"],"examples":[{"title":"标准方法 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。求恰好一个发生的概率。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","steps":["交概率已给出，无需再假设独立。","只发生 A 的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，只发生 B 同理。","这两块互斥，相加得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","代入得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；四块概率均非负且和为一。"],"pitfall":"恰好一个要减两次交集；至少一个只减一次。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"1/2","rhs":"1/2"},{"op":"eq","lhs":"1","rhs":"1"}]},"hint":"将恰好一个拆为两个互斥的只发生事件。","answer_mode":"numeric","answer_value":0.5,"accepted":["1/2"]},{"title":"对照与边界 · 原创例题","level":"原创例题","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。求恰好一个发生的概率。","answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>","steps":["交概率已给出，无需再假设独立。","只发生 A 的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，只发生 B 同理。","这两块互斥，相加得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","代入得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>；四块概率均非负且和为一。"],"pitfall":"恰好一个要减两次交集；至少一个只减一次。","check_data":{"kind":"generic","checks":[{"op":"eq","lhs":"1","rhs":"1"},{"op":"eq","lhs":"1","rhs":"1"}]},"hint":"将恰好一个拆为两个互斥的只发生事件。","answer_mode":"numeric","answer_value":1.0,"accepted":["1"]}],"citations":[{"source":"exam","locator":"PDF 第 1 页，第 8 题"},{"source":"answers","locator":"PDF 第 2,3 页，第 8 题"}],"fi
