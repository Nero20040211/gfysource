5;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。坐标变换的雅可比绝对值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。图中的小扇形在大半径处更宽，这解释了面积元的半径因子。"},{"title":"确定区域","body":"上半圆盘半径 R 对应 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mi>&#x003C0;<\/mi><\/mrow><\/math>；右半圆盘可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；第一象限圆环内外半径分别为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。边界取等号与否不影响这些面积积分。"},{"title":"径向函数的积分","body":"若被积函数变成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，且区域径向范围不随角度变化，则积分为角度长度乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><\/mrow><\/math>。例如原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>r<\/mi><\/mrow><\/math>，所以实际积分的是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，不是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>。"},{"title":"作答检查","body":"先画或描述区域，再列极角和半径上下限，变换被积函数，补上面元因子，最后按先半径后角度计算。上半圆的角度从零到正的圆周率，不能颠倒为反向范围。"}],"boundaries":["所附解析的极角范围有上下限颠倒的文字错误。","不能遗漏面积元中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>；右半圆与上半圆的极角范围不同。"],"examples":[{"title":"2024真题第17题 · 方法拆解","level":"真题精讲","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><msqrt><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>，<mat #x00028;<\/mo><mi>r<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><\/mrow><\/math>。","内层积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；乘以角度区间长度，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"不能遗漏面积元中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>；右半圆与上半圆的极角范围不同。"}],"citations":[{"source":"exam","locator":"PDF第4页，第17题"},{"source":"answers","locator":"PDF物理第6,7页，第17题"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"上半圆盘积分区域；极角范围为零到圆周率\"><title>上半圆盘积分区域；极角范围为零到圆周率<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M65 220H555 M310 250V24\" stroke=\"#82938e\"/><path d=\"M120 220 A190 190 0 0 1 500 220Z\" fill=\"#d2e9df\" stroke=\"#17675b\" stroke-width=\"3\"/><path d=\"M310 220L437 80\" stroke=\"#b06e44\" stroke-width=\"3\"/><path d=\"M358 220 A48 48 0 0 0 342 184\" stroke=\"#b06e44\" fill=\"none\"/><text x=\"355\" y=\"158\">r<\/text><text x=\"360\" y=\"204\">θ<\/text><text x=\"503\" y=\"242\">a<\/text><text x=\"101\" y=\"242\">−a<\/text><text x=\"295\" y=\"245\">0<\/text><text x=\"74\" y=\"20\">上半圆盘：0 ≤ θ ≤ π，0 ≤ r ≤ a<\/text><text x=\"505\" y=\"270\">x<\/text><text x=\"320\" y=\"65\">y<\/text><\/svg>"},{"id":"t18","module":"m08","title":"矩形费用建模与条件最小值","prerequisites":"会用面积约束消元和求导判最值。","intuition":"最优化题最容易出错的环节是费用模型。先明确较贵的是哪条边，再按每条边的价格计费，之后的导数与最优边长才有明确意义。","sections":[{"title":"模型和定义域","body":"取一条明确指定的边长为 s，相邻边为 t。面积约束为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>S<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。若两条平行于 s 的边单价合计为 u，另两条平行于 t 的边单价合计为 v，费用为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mi>t<\/mi><mo>&#x0002B;<\/mo><mi>d<\/mi><\/mrow><\/math>，d 是固定费用。"},{"title":"约束消元","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>d<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>u<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，驻点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>，另一边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mfrac><mrow><mi>u<\/mi><mi>S<\/mi><\/mrow><mrow><mi>v<\/mi><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>。这些公式要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0002C;<\/mo><mi>S<\/mi><\/mrow><\/math> 均为正。"},{"title":"为何是全局最小","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><msup><mi>s<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，且当 s 趋零或无穷时费用趋于无穷，所以唯一驻点给出全局最小。也可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><mo>&#x02265;<\/mo><mn>2<\/mn><msqrt><mrow><mi>u<\/mi><mi>v<\/mi><mi>S<\/mi><\/mrow><\/msqrt><\/mrow><\/math>，等号条件是两项相等。最小费用为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mi>u<\/mi><mi>v<\/mi><mi>S<\/mi><\/mrow><\/msqrt><mo>&#x0002B;<\/mo><mi>d<\/mi><\/mrow><\/math>。"},{"title":"拉格朗日方法的对照","body":"也可对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mi>t<\/mi><mo>&#x0002B;<\/mo><mi>&#x003BB;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mi>t<\/mi><mo>&#x02212;<\/mo><mi>S<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 求偏导，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0002B;<\/mo><mi>&#x003BB;<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0002B;<\/mo><mi>&#x003BB;<\/mi><mi>s<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>s<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>S<\/mi><\/mrow><\/math>。消去乘子得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mi>s<\/mi><mo>&#x0003D;<\/mo><mi>v<\/mi><mi>t<\/mi><\/mrow><\/math>，与一元法一致。求驻点后仍需说明最小性；本题的一元方法更直接。"}],"boundaries":["不能只求驻点而不验证最小性；所附解析的费用式与偏导式存在不一致。","“长、宽”命名不能代替哪条边较贵的定义；固定费用影响总价，不影响最优边长。"],"examples":[{"title":"2024真题第18题 · 方法拆解","level":"真题精讲","prompt":"矩形面积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>60<\/mn><\/mrow><\/math> 平方米，一边每米 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> 元，其余三边每米 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 元，求最省费用的边长。","steps":["明确取较贵边长为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>，相邻边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>60<\/mn><\/mrow><\/math>。","总价 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>15<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mn>10<\/mn><mi>t<\/mi><\/mrow><\/math>。","消元得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>15<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mn>600<\/mn><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>15<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mn>600<\/mn><\/mrow><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。","令导数为零得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>，进而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1200<\/mn><\/mrow><mrow><msup><mi>s<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，两端趋无穷，故为全局最小；代回得最小费用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>60<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>。"],"answer":"较贵边长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 米，相邻边长 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 米；最小费用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>60<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 元。","pitfall":"不能只求驻点而不验证最小性；所附解析的费用式与偏导式存在不一致。"},{"title":"同考点原创例题","level":"原创例题","prompt":"面积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>50<\/mn><\/mrow><\/math> 平方米的矩形，一边每米 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math> 元，其余三边每米 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 元。设第一条描述的边长为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>，相邻边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>。求费用最小时的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/math> 和最小费用。","steps":["面积约束为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>50<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。依照边的单价，费用为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>t<\/mi><\/mrow><\/math>。","消去 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 后，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>10<\/mn><mi>s<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mn>200<\/mn><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，定义域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>10<\/mn><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>200<\/mn><\/mrow><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>。令其为零，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>400<\/mn><\/mrow><mrow><msup><mi>s<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mstyle><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>；且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x02192;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时费用趋于无穷，因此这是全局最小值。","由面积约束得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><\/mrow><\/math>，代回费用式得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mrow><mo>min<\/mo><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>40<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 元。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><mtext>&#x000A0;<\/mtext><mtext>米<\/mtext><mo>&#x0002C;<\/mo><mspace width=\"1em\" /><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><mtext>&#x000A0;<\/mtext><mtext>米<\/mtext><\/mrow><\/math>；最小费用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>40<\/mn><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 元。","pitfall":"“长、宽”命名不能代替哪条边较贵的定义；固定费用影响总价，不影响最优边长。"}],"citations":[{"source":"exam","locator":"PDF第5页，第18题"},{"source":"answers","locator":"PDF物理第7页，第18题"},{"source":"s3","locator":"PDF第8—10页；资料印刷第59—61页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"2024第18题边长变量与单价对应；较贵边为s，图为示意\"><title>2024第18题边长变量与单价对应；较贵边为s，图为示意<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><rect x=\"150\" y=\"55\" width=\"285\" height=\"175\" fill=\"#d2e9df\" stroke=\"#17675b\" stroke-width=\"3\"/><path d=\"M435 55V230\" stroke=\"#b06e44\" stroke-width=\"5\"/><text x=\"225\" y=\"38\">t：5 元/米<\/text><text x=\"225\" y=\"255\">t：5 元/米<\/text><text x=\"448\" y=\"130\">s<\/text><text x=\"448\" y=\"157\">10 元/米<\/text><text x=\"33\" y=\"130\">s<\/text><text x=\"33\" y=\"157\">5 元/米<\/text><text x=\"220\" y=\"142\">面积 st = 60<\/text><text x=\"184\" y=\"192\">费用 15s + 10t<\/text><\/svg>"},{"id":"t19","module":"m09","title":"左侧矩阵系数与矩阵方程","prerequisites":"掌握单位矩阵、矩阵乘法与求逆。","intuition":"矩阵不能像实数一样随意交换顺序。未知矩阵左侧的系数必须用左乘逆矩阵消掉，且先证明这个系数矩阵可逆。","sections":[{"title":"从原式整理系数","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><\/mrow><\/math> 等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 同阶。若变式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math>，则系数应为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><\/mrow><\/math>。写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 一般与原式不同。"},{"title":"求解与维数","body":"记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>H<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，唯一解是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><msup><mi>H<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>B<\/mi><\/mrow><\/math>。如果 H 是 n 阶，B 为 n 行 m 列，则 X 也是 n 行 m 列；右乘的次序通常不合法或得到不同结果。"},{"title":"怎样求逆和计算","body":"可用增广矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>H<\/mi><mo>&#x02223;<\/mo><mi>E<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 作初等行变换，左块化成 E 时右块就是逆矩阵。随后做行乘列计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>H<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>B<\/mi><\/mrow><\/math>。也可直接对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>H<\/mi><mo>&#x02223;<\/mo><mi>B<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 消元，把左块化成 E 后右块给出 X，避免完整求逆。"},{"title":"最终复核","body":"把答案代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math> 或原式，逐个元素核对。只有验证某一列正确不能证明其他列也正确。若 H 不可逆，不能使用逆矩阵公式，需要另行判断方程组的相容性。"}],"boundaries":["矩阵因子的顺序不可交换。","不得把矩阵当作数直接相除；矩阵方程中的单位矩阵必须与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 同阶。"],"examples":[{"title":"2024真题第19题 · 方 {"id":"p01","module":"m01","level":"独立练习","topic_ids":["t01"],"prompt":"考察函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>3<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>x<\/mi><\/mrow><\/math> 在其整个定义域上的性质，正确的是（　）。<br>A. 偶函数且严格递增<br>B. 奇函数且严格递增<br>C. 奇函数且严格递减<br>D. 有增有减","hint":"先用定义域约束性质，再用导数符号判单调；奇偶性另作代入判断。","steps":["先检查定义域，本题各指数或对数式在实数域上均有意义。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，故在实数域上严格递增。","代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因此为奇函数。"],"answer":"B；奇函数且严格递增","pitfall":"单调递增与奇函数可以同时成立；不能只检查某几个数值。"},{"id":"p02","module":"m01","level":"独立练习","topic_ids":["t02"],"prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，下列说法正确的是（　）。<br>A. 零点为极大值点<br>B. 零点为极小值点<br>C. 零点是驻点，但不是极值点<br>D. 零点不是驻点","hint":"先区分必要条件和充分条件，再结合导数变号或定义判断。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi> i><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则为偶函数；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则为奇函数。单调递增要求对区间内任意 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003C;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 都有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，不是仅比较两组数值。<br>若函数在区间内可导且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 恒成立，则严格递增；导数恒负则严格递减。可把区间内任意两点代入拉格朗日中值定理，函数值之差等于某中间点的导数乘正的自变量差，从而解释这一判据。"},{"topic_id":"t02","title":"极大值、驻点与不可导点","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 是定义域内点，函数在该点可导且有极值，由费马定理有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。不要求可导时，候选极值点还包括导数不存在的点。端点的最大或最小值不属于这一内点判据。<br>在连续前提下，考察候选点两侧的导数符号：由正变负是极大值，由负变正是极小值，两侧同号通常没有极值。符号变化必须针对同一个点两侧的充分小邻域。"},{"topic_id":"t03","title":"平面法向量与垂直条件","body":"平面 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mi>z<\/mi><mo>&#x0002B;<\/mo><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的一个法向量是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，其中三个系数不能全为零。常数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math> 改变平面位置，不改变法向量方向。法向量乘非零常数仍表示相同方向。<br>对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>c<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>c<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，数量积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>c<\/mi><mn>1<\/mn><\/msub><msub><mi>c<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>。两非零向量垂直当且仅当数量积为零。负号必须跟在分量上参与乘法。"},{"topic_id":"t04","title":"原函数与反求被积函数","body":"如果在某区间内 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 的一个原函数。该区间内所有原函数相差常数，记作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。区间与定义域是关系成立的前提。<br>对积分结果两边求导，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>C<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。因此被积函数不能再附带一个任意的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。求导后再回代核对比只凭公式印象判断更可靠。"},{"topic_id":"t05","title":"二阶常系数齐次微分方程","body":"对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>q<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>q<\/mi><\/mrow><\/math> 是常数。代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以特征方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。只有右侧为零才是这里讨论的齐次方程。<br>若根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mo>&#x02260;<\/mo><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，通解是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的根为正负根号二；指数中的系数应是根而不是常数项二。"},{"topic_id":"t06","title":"级数收敛的通项必要条件","body":"级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 的第 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><\/mrow><\/math> 个部分和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>N<\/mi><\/msub><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><\/mrow><\/math> 趋于有限实数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math>，级数收敛，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math> 为其和；否则发散。通项 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 与部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 是两个不同对象。<br>由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>，如果部分和收敛到同一个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math>，通项极限就是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><mo>&#x02212;<\/mo><mi>S<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。所以通项极限非零或不存在时，级数必发散。这里的“有限”不能省略。"},{"topic_id":"t07","title":"矩阵可逆与行列式非零","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 阶方阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>，存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 当且仅当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，也等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math>。非方阵不直接套用这个逆矩阵判据。逆矩阵满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。<br>行列式有零行或两行成比例时为零；三角矩阵行列式是对角元乘积。对角线中有零元素的三角矩阵不可逆；只有一般矩阵的某个对角元为零却不一定不可逆。"},{"topic_id":"t08","title":"事件运算与德摩根律","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示二者同时发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示至少一个发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> 表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 不发生。事件是样本空间的子集，概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 是零到一之间的数，两者应使用不同记号。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo>&#x0222A;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>，表示全部不发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>，表示至少一个不发生。将整句话否定后，交并运算对换且每个事件都取补。"},{"topic_id":"t09","title":"指数、对数与零乘无穷型极限","body":"含 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 时实数定义域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 应按右极限理解。若求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>lim<\/mo><msup><mi>e<\/mi><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mi>L<\/mi><\/mrow><\/math> 为有限数，由连续性结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>L<\/mi><\/msup><\/mrow><\/math>。<br>当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>。写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 后，分子分母为无穷型；求导比为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>，极限为零。洛必达求导的是分子与分母，不能把整个商再求导。"},{"topic_id":"t10","title":"反正切复合函数的一阶微分","body":"对一元可导函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，定义 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。在一元情形，可导与可微等价。求微分可以先求导，但导数与微分不是同一个表达式。<br>若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。实数反正切本身对全部实数有定义，复合函数仍须满足内层定义域。"},{"topic_id":"t11","title":"数乘逆矩阵的行列式","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 阶方阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mi>k<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 可逆，由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math> 和乘积行列式性质得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。<br>把两条公式结合可得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>k<\/mi><mi>n<\/mi><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。这里 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 为方阵阶数，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 的符号在奇偶阶下会产生不同影响，原行列式为负也需要保留负号。"},{"topic_id":"t12","title":"独立抽样与至少一次事件","body":"有放回抽查且每次独立时，各次合格概率不变，记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math>。单次不合格概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><\/mrow><\/math>。如果不放回，后一次的概率一般会受前一次结果影响，不能照搬同一个乘法式。<br>独立抽查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 次，全部不合格概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><\/mrow><\/math>。所以至少一次合格为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><\/mrow><\/math>。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>0.9<\/mn><\/mrow><\/math>，故结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mn>0.1<\/mn><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0.99<\/mn><\/mrow><\/math>。"},{"topic_id":"t13","title":"相消差式与高阶无穷小","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003B1;<\/mi><\/mrow><mrow><mi>&#x003B2;<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，记作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x0007E;<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>。在适当的乘除极限中可用等价量替换；但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math> 并不能推出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mi>&#x0007E;<\/mi><mn>0<\/mn><\/mrow><\/math>，后者失去了决定极限的三阶项。<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>tan<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mi>k<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>x<\/mi><mi>k<\/mi><\/msup><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，表示比该阶更小的余项。"},{"topic_id":"t14","title":"一阶线性方程与积分因子","body":"一阶线性方程写作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。若某项在右边，应先移项，尤其检查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><\/mrow><\/math> 的符号。线性指未知函数及其导数只以一次形式出现，而不是自变量只能一次。<br>希望 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>y<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo stretchy=\"false\">[<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mi>y<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 相等，就需要 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003BC;<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>&#x003BC;<\/mi><mi>P<\/mi><\/mrow><\/math>。可取非零积分因子 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，其中求一个原函数即可。"},{"topic_id":"t15","title":"绝对值、对称区间与定积分换元","body":"若被积函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 可积且是偶函数，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>g<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>g<\/mi><\/mrow><\/math>；若是奇函数则积分为零。需要同时具备对称区间和相应奇偶性。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 都是偶函数。<br>在正半轴 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>，负半轴 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>。原题用偶性化为两倍正半轴后才去掉绝对值；如果一开始整个区间都写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>，就会错误地把题目变成奇函数积分。"},{"topic_id":"t16","title":"阶乘型级数的绝对收敛","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 收敛，称原级数绝对收敛，并能推出原级数收敛。若原级数收敛而绝对值级数发散，才是条件收敛。出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 只说明符号交错，不能直接决定属于哪一种。<br>对于最终为正的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>，若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo>lim<\/mo><msub><mi>a<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> 存在，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003C1;<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 时级数收敛；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 或为正无穷时发散；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时该方法不作结论。本次阶乘型变式的极限为零。"},{"topic_id":"t17","title":"圆域二重积分与极坐标面元","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。坐标变换的雅可比绝对值为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。图中的小扇形在大半径处更宽，这解释了面积元的半径因子。<br>上半圆盘半径 R 对应 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mi>&#x003C0;<\/mi><\/mrow><\/math>；右半圆盘可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；第一象限圆环内外半径分别为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。边界取等号与否不影响这些面积积分。"},{"topic_id":"t18","title":"矩形费用建模与条件最小值","body":"取一条明确指定的边长为 s，相邻边为 t。面积约束为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>S<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。若两条平行于 s 的边单价合计为 u，另两条平行于 t 的边单价合计为 v，费用为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mi>t<\/mi><mo>&#x0002B;<\/mo><mi>d<\/mi><\/mrow><\/math>，d 是固定费用。<br>由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>S<\/mi><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>s<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>s<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><mi>s<\/mi><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>d<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>u<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><msup><mi>s<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>，驻点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mfrac><mrow><mi>v<\/mi><mi>S<\/mi><\/mrow><mrow><mi>u<\/mi><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>，另一边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mfrac><mrow><mi>u<\/mi><mi>S<\/mi><\/mrow><mrow><mi>v<\/mi><\/mrow><\/mfrac><\/mrow><\/msqrt><\/mrow><\/math>。这些公式要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0002C;<\/mo><mi>S<\/mi><\/mrow><\/math> 均为正。"},{"topic_id":"t19","title":"左侧矩阵系数与矩阵方程","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><\/mrow><\/math> 等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 同阶。若变式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>B<\/mi><\/mrow><\/math>，则系数应为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><\/mrow><\/math>。写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 一般与原式不同。<br>记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><mo>&#x02212;<\/mo><mi>A<\/mi><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo>&#x0002B;<\/mo><mi>A<\/mi><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>H<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，唯一解是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0003D;<\/mo><msup><mi>H<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>B<\/mi><\/mrow><\/math>。如果 H 是 n 阶，B 为 n 行 m 列，则 X 也是 n 行 m 列；右乘的次序通常不合法或得到不同结果。"},{"topic_id":"t20","title":"非齐次方程组的通解与自由参数","body":"方程组写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">[<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">]<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，无解；二者相等时有解。相等且等于未知数个数 n 时唯一解；相等且小于 n 时有无穷多解，自由参数个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。<br>允许交换两行、某行乘非零常数、某行加另一行的倍数，且右端列必须同步处理。逐列选择主元，消去同列其他元素。行最简形方便直接读取主变量与自由变量关系。"},{"topic_id":"t21","title":"对称区间的定积分恒等式证明","body":"闭区间连续函数可积。由区间可加性，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mn>0<\/mn><\/msubsup><mi>f<\/mi><mo>&#x0002B;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>。要把前一项写到正区间，需要使用反射换元 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>。<br>当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 时，函数变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，微分变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>，上下限从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mn>0<\/mn><\/mrow><\/math> 变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mn>0<\/mn><\/mrow><\/math>。于是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mn>0<\/mn><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mn>0<\/mn><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。"}],"source_pages":{"exam":["../assets/source-pages/06e16e6755ff2ddfdf6850dfca21088a60feb8c947d9f373dec33fb897846172.jpg","../assets/source-pages/be17cef20175ef57e5fc879e308e12ecfb4106f0c41546508cffc9d6e5bc7bf3.jpg","../assets/source-pages/66414e4de6411329f265f3dc279a0fadd1ab311ebe53cbbad711d68e6696cd0a.jpg","../assets/source-pages/568cbdfe46935136c167333a3e670656675b3f83df6f7513386f60ef29383b18.jpg","../assets/source-pages/b58095bf82838036b76f455271f69ad21df35d35d6d34f0f1256a71bf670c65a.jpg","../assets/source-pages/e57b881541fb83b4af31c6fadacbff42326a3054476d7b3a8fdb223464fcf682.jpg","../assets/source-pages/e9d25ab2be128f78e5dc92cb9b4acfa5a2e4eb2c9a46884c44f666618b346828.jpg"],"answers":["../assets/source-pages/2eca8fec6b5d2acebd4a789900b7392584d20edcb4d2eec1f7aab75ff79b6835.jpg","../assets/source-pages/92692e5e4aa18bbe3cec4619295b6a19f2f5648732b5c961f050a144b4898d79.jpg","../assets/source-pages/d896b310093918e82bddf8896eae085489af405c6077c4a2f2adf909cd408241.jpg","../assets/source-pages/c303199584a69c6031109bf79479eeb560be4748e052eebdfe84455c73ab98a3.jpg","../assets/source-pages/03d5e43da34a65945315c33eee1af48deeb450b45eeeb0a451376dc5b9420858.jpg","../assets/source-pages/80565e842da96fa18fc2b6ad9d22c03e48185937497ca24fc7f49046477f895c.jpg","../assets/source-pages/2c658432f64e488d7e91071fceed       attempt.revealed[number] = true; save("attempt." + id, attempt);

      var region = main.querySelector('[data-question-result="' + number + '"]');
      if (region) region.innerHTML = renderQuestionResult(id, q);
      var button = main.querySelector('[data-action="question-reveal"][data-number="' + number + '"]');
      if (button) { button.disabled = true; button.textContent = "解析已展开"; }
      refreshQuestionScore(id, number); updateSummary(id);
    }
    main.addEventListener("input", function (event) {
      var element = event.target, id = element.dataset.paper, number = element.dataset.response;
      if (number != null && attempts[id] && !attempts[id].submitted) {
        if (shouldAutoSubmit(attempts[id], Date.now())) { submit(id, "timeout"); return; }
        if (element.type === "radio" && !element.checked) return;
        attempts[id].responses[number] = element.value; save("attempt." + id, attempts[id]);
        if (element.type === "radio") {
          main.querySelectorAll('input[name="' + element.name + '"]').forEach(function (radio) {
            radio.closest("label").classList.toggle("selected", radio.checked);
          });
        }
        refreshBadge(id, number);
        if (attempts[id].mode === "practice" && attempts[id].revealed[number]) {
          refreshQuestionScore(id, number); updateSummary(id);
        }
      } else if (element.dataset.selfScore != null && attempts[id]) {
        var qnumber = Number(element.dataset.selfScore), attempt = attempts[id];
        if (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[qnumber])) return;
        var q = papers[id].questions.find(function (item) { return item.number === qnumber; });
        var read = readScore(element.value, q.points);
        var message = document.getElementById("score-message-" + id + "-" + qnumber);
        element.setAttribute("aria-invalid", read.ok ? "false" : "true");
        if (message) message.textContent = read.ok ? "留空为待评；零为已评零分。" : read.error;
        if (!read.ok) {
          delete attempt.selfScores[qnumber]; save("attempt." + id, attempt);
          updateSummary(id); refreshQuestionScore(id, qnumber); return;
        }
        if (read.value === null) delete attempt.selfScores[qnumber]; else attempt.selfScores[qnumber] = read.value;
        save("attempt." + id, attempt); updateSummary(id);
        refreshQuestionScore(id, qnumber);
      } else if (element.dataset.practiceResponse) {
        var pid = element.dataset.practiceResponse;
        practiceProgress[pid] = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        practiceProgress[pid].response = element.value; save("practices", practiceProgress);
        var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
</body>
