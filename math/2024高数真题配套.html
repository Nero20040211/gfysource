  <script type="application/json" id="course-data">{"meta":{"title":"重庆专升本高数 · 真题配套学习","date":"2026-10-10","scope":"2024逐题考点＋同考点递进训练","content_hash":"abccaaba37c397b23adb93116715f1de90d875bd4ebe38d11214bd4ecfba5b9d"},"sources":[{"id":"exam","title":"2024年重庆市专升本高数真题","path":"2024年重庆市专升本高数真题.pdf","pages":7},{"id":"answers","title":"2024年重庆市专升本《高等数学》真题答案解析","path":"2024年重庆市专升本《高等数学》真题答案解析.pdf","pages":9},{"id":"s1","title":"第一章：函数，极限和连续","path":"第一章：函数，极限和连续.pdf","pages":27},{"id":"s2","title":"第二章：导数与微分","path":"第二章：导数与微分.pdf","pages":24},{"id":"s3","title":"第三章：微分中值定理与导数的应用","path":"第三章：微分中值定理与导数的应用.pdf","pages":25},{"id":"s4","title":"第四章：不定积分","path":"第四章：不定积分.pdf","pages":16},{"id":"s5","title":"第五章：定积分","path":"第五章：定积分.pdf","pages":19},{"id":"s6","title":"第六章：微分方程","path":"第六章：微分方程.pdf","pages":14}],"modules":[{"id":"m01","title":"函数、导数与微分","topic_ids":["t01","t02","t10"]},{"id":"m02","title":"极限与无穷小","topic_ids":["t09","t13"]},{"id":"m03","title":"平面与法向量","topic_ids":["t03"]},{"id":"m04","title":"原函数、定积分与证明","topic_ids":["t04","t15","t21"]},{"id":"m05","title":"微分方程","topic_ids":["t05","t14"]},{"id":"m06","title":"无穷级数","topic_ids":["t06","t16"]},{"id":"m07","title":"二重积分与极坐标","topic_ids":["t17"]},{"id":"m08","title":"费用建模与最优化","topic_ids":["t18"]},{"id":"m09","title":"线性代数","topic_ids":["t07","t11","t19","t20"]},{"id":"m10","title":"概率与事件","topic_ids":["t08","t12"]}],"topics":[{"id":"t01","module":"m01","title":"函数性质与导数判单调","prerequisites":"掌握指数函数求导，了解函数定义域和区间。","intuition":"奇偶性描述图像对称，单调性描述自变量增加时函数值的变化。两种性质须分别判断，同一函数可以既是奇函数又严格递增。","sections":[{"title":"定义与适用条件","body":"奇偶性要求定义域关于原点对称。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则为偶函数；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则为奇函数。单调递增要求对区间内任意 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003C;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 都有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，不是仅比较两组数值。"},{"title":"导数怎样提供判断","body":"若函数在区间内可导且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 恒成立，则严格递增；导数恒负则严格递减。可把区间内任意两点代入拉格朗日中值定理，函数值之差等于某中间点的导数乘正的自变量差，从而解释这一判据。"},{"title":"指数式的处理","body":"牢记 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>a<\/mi><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>a<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。含负指数时要保留内层导数，例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 求导后两项相加，因此导数恒正。"},{"title":"解题顺序","body":"先写定义域，再代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 判奇偶；求导后整理为容易判断符号的形式，最后说明所讨论的整个区间。如果导数有零点，要分区间或回到单调定义，不能将某点导数为零直接解释为函数不严格递增。"}],"boundaries":["奇函数与递增性质可以同时成立。","单调递增与奇函数可以同时成立；不能只检查某几个数值。"],"examples":[{"title":"2024真题第1题 · 方法拆解","level":"真题精讲","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 在实数域上的单调性质。<br>A. 有增有减<br>B. 偶函数<br>C. 单调递减<br>D. 单调递增","steps":["指数函数在实数域有定义。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故为奇函数。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以在整个实数域上严格递增。"],"answer":"D；严格单调递增，且函数为奇函数。","pitfall":"奇函数与递增性质可以同时成立。"},{"title":"同考点原创例题","level":"原创例题","prompt":"考察函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mo>atan<\/mo><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/math> 在其整个定义域上的性质，正确的是（　）。<br>A. 奇函数且严格递增<br>B. 偶函数且严格递增<br>C. 奇函数且严格递减<br>D. 有增有减","steps":["先检查定义域，本题各指数或对数式在实数域上均有意义。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，故在实数域上严格递增。","代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因此为奇函数。"],"answer":"A；奇函数且严格递增","pitfall":"单调递增与奇函数可以同时成立；不能只检查某几个数值。"}],"citations":[{"source":"exam","locator":"PDF第1页，第1题"},{"source":"answers","locator":"PDF物理第1页，第1题"},{"source":"s1","locator":"PDF第4页；资料印刷第4页"},{"source":"s3","locator":"PDF第5—6页；资料印刷第56—57页"}],"figure":null},{"id":"t02","module":"m01","title":"极大值、驻点与不可导点","prerequisites":"区分函数值、极值点、导数和二阶导数。","intuition":"极值比较的是一个点与附近函数值；驻点只表示该点导数为零。极值点可能是驻点，也可能是不可导点，反过来驻点未必有极值。","sections":[{"title":"必要条件","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 是定义域内点，函数在该点可导且有极值，由费马定理有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。不要求可导时，候选极值点还包括导数不存在的点。端点的最大或最小值不属于这一内点判据。"},{"title":"第一充分条件","body":"在连续前提下，考察候选点两侧的导数符号：由正变负是极大值，由负变正是极小值，两侧同号通常没有极值。符号变化必须针对同一个点两侧的充分小邻域。"},{"title":"第二充分条件与失效情形","body":"当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，二阶导数为正可判极小，为负可判极大。若二阶导数等于零，判据不提供结论：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 为极小，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 为极大，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 没有极值。"},{"title":"选择题的反例法","body":"遇到“必然”二字，检查它是否把充分条件误当成必要条件。用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 检验可导性，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 检验二阶导数必须为负，用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 检验导数为零必有极值。反例要同时满足题干而违反候选结论。"}],"boundaries":["结论要求定义域内点，端点最值不可直接套用费马定理。","二阶导数为零不能直接判为无极值；极值点不一定可导。"],"examples":[{"title":"2024真题第2题 · 方法拆解","level":"真题精讲","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在定义域内点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 处有极大值，判断必然满足的条件。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 或导数不存在","steps":["若该内点可导，由费马定理得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","若不可导仍可能有极大值，例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 在零点。","二阶导数负值不是必要条件，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 在零点为极大值但二阶导数为零。"],"answer":"D；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 不存在。","pitfall":"结论要求定义域内点，端点最值不可直接套用费马定理。"},{"title":"同考点原创例题","level":"原创例题","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>，关于零点的说法正确的是（　）。<br>A. 零点不是极值点<br>B. 零点为极大值点，且二阶导数为零<br>C. 零点的二阶导数必小于零<br>D. 零点处不可导","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 成立。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>12<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","所以零点为极大值点，但二阶导数等于零。"],"answer":"B；零点为极大值点，且二阶导数为零","pitfall":"二阶导数为零不能直接判为无极值；极值点不一定可导。"}],"citations":[{"source":"exam","locator":"PDF第1页，第2题"},{"source":"answers","locator":"PDF物理第1页，第2题"},{"source":"s3","locator":"PDF第8—10页；资料印刷第59—61页"}],"figure":null},{"id":"t03","module":"m03","title":"平面法向量与垂直条件","prerequisites":"能读出平面方程的三个变量系数，会计算向量数量积。","intuition":"平面中的位移向量与法向量垂直。两个平面夹角可以通过它们的法向量判断，原卷只需要识别垂直对应点积为零。","sections":[{"title":"平面与法向量","body":"平面 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mi>z<\/mi><mo>&#x0002B;<\/mo><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的一个法向量是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，其中三个系数不能全为零。常数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math> 改变平面位置，不改变法向量方向。法向量乘非零常数仍表示相同方向。"},{"title":"数量积公式","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>c<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>c<\/mi><mn>2<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，数量积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mn>1<\/mn><\/msub><msub><mi>a<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>b<\/mi><mn>1<\/mn><\/msub><msub><mi>b<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>c<\/mi><mn>1<\/mn><\/msub><msub><mi>c<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>。两非零向量垂直当且仅当数量积为零。负号必须跟在分量上参与乘法。"},{"title":"平面垂直的判据","body":"两平面垂直的充要条件是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>1<\/mn><\/msub><mo>&#x000B7;<\/mo><msub><mi mathvariant=\"bold-italic\">n<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。法向量成比例对应平面平行或重合；仅有常数项不同不能构成垂直的依据。不要把向量点积与分量分别相乘后构成的新向量混淆。"},{"title":"参数与选项检查","body":"不含参数时逐项点积，检查只有一个零值；含参数时先写法向量再解点积为零的方程，同时保证两法向量非零。将求出的参数代回原平面，复核点积。"}],"boundaries":["常数项不影响垂直判据。","平面法向量平行对应平面平行或重合，不对应垂直。"],"examples":[{"title":"2024真题第3题 · 方法拆解","level":"真题精讲","prompt":"判断与平面 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 垂直的平面。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>z<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x02212;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>","steps":["原平面的法向量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","C 选项法向量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","点积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，因此两平面垂直。"],"answer":"C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","pitfall":"常数项不影响垂直判据。"},{"title":"同考点原创例题","level":"原创例题","prompt":"与平面 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 垂直的平面是（　）。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>","steps":["已知平面的法向量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","逐个提取候选平面的三个变量系数作为法向量。","所选平面的法向量点积为零，因此垂直。"],"answer":"C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>z<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>","pitfall":"平面法向量平行对应平面平行或重合，不对应垂直。"}],"citations":[{"source":"exam","locator":"PDF第1页，第3题"},{"source":"answers","locator":"PDF物理第1,2页，第3题"}],"figure":null},{"id":"t04","module":"m04","title":"原函数与反求被积函数","prerequisites":"会对根式、对数、指数与复合函数求导。","intuition":"积分与求导在这里是逆向关系。已知一个积分结果，要找被积函数，应对结果求导，通常不需要再进行积分。","sections":[{"title":"原函数的定义","body":"如果在某区间内 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 的一个原函数。该区间内所有原函数相差常数，记作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。区间与定义域是关系成立的前提。"},{"title":"为什么常数消失","body":"对积分结果两边求导，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display ><\/msup><mo>&#x0002B;<\/mo><mi>q<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>q<\/mi><\/mrow><\/math> 是常数。代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以特征方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>p<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。只有右侧为零才是这里讨论的齐次方程。"},{"title":"两个不同实根","body":"若根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mo>&#x02260;<\/mo><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>，通解是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的根为正负根号二；指数中的系数应是根而不是常数项二。"},{"title":"二重实根","body":"若特征方程有二重根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。第二项乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 才与第一项独立；写两项相同的指数函数只有一个有效自由常数，不能代表二阶通解。"},{"title":"复核与边界","body":"分别把两个基解代回方程，并确认它们独立。教材也列出共轭复根的形式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>&#x003B1;<\/mi><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mi>cos<\/mi><mi>&#x003B2;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>sin<\/mi><mi>&#x003B2;<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；本次卷侧重不同实根与重根。二阶非齐次方程不能直接只写这类齐次解。"}],"boundaries":["根为正负根号二，不是正负二。","重根不能重复写两个相同的指数函数；通解应含两个独立任意常数。"],"examples":[{"title":"2024真题第5题 · 方法拆解","level":"真题精讲","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的通解。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msqrt><mn>2<\/mn><\/msqrt><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mi>x<\/mi><\/mr mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/math>","steps":["设指数型解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，得到特征方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><mi>r<\/mi><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","特征根为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><\/mrow><\/math>。两根不同，取对应的两个指数解。","因此通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，两个常数独立任意。"],"answer":"A；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><mn>4<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","pitfall":"重根不能重复写两个相同的指数函数；通解应含两个独立任意常数。"}],"citations":[{"source":"exam","locator":"PDF第1页，第5题"},{"source":"answers","locator":"PDF物理第2页，第5题"},{"source":"s6","locator":"PDF第2—3页；资料印刷第113—114页"}],"figure":null},{"id":"t06","module":"m06","title":"级数收敛的通项必要条件","prerequisites":"会求数列极限，理解部分和。","intuition":"级数收敛讨论的是部分和是否趋于有限值。通项趋零只是所有收敛级数都要通过的检查，无法单独保证无穷多项加起来有有限和。","sections":[{"title":"部分和定义","body":"级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 的第 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><\/mrow><\/math> 个部分和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>u<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><msub><mi>u<\/mi><mi>N<\/mi><\/msub><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><\/mrow><\/math> 趋于有限实数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math>，级数收敛，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math> 为其和；否则发散。通项 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 与部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 是两个不同对象。"},{"title":"必要条件的推导","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>，如果部分和收敛到同一个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><\/mrow><\/math>，通项极限就是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S<\/mi><mo>&#x02212;<\/mo><mi>S<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。所以通项极限非零或不存在时，级数必发散。这里的“有限”不能省略。"},{"title":"反向推论的反例","body":"调和级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 通项趋零，但发散。可将项按长度依次为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>8<\/mn><mo>&#x0002C;<\/mo><mi>&#x02026;<\/mi><\/mrow><\/math> 分组，每组贡献有固定正下界，部分和不断增大。相反 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 收敛，说明同样的通项零极限可以对应两种敛散结果。"},{"title":"题目怎样判","body":"先求通项极限。非零即可停止并判发散；为零则仅记录必要条件满足，继续选其他判别法。遇到“只要通项趋零就收敛”的选项，用调和级数反驳。"}],"boundaries":["通项趋零不能单独证明级数收敛。","通项趋零不能反推出级数收敛；需继续选用判别法。"],"examples":[{"title":"2024真题第6题 · 方法拆解","level":"真题精讲","prompt":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>lim<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0221E;<\/mo><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>","steps":["收敛意味着部分和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 有有限极限。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>S<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>，故极限为零。","这是必要条件，反向推论不成立。"],"answer":"B；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","pitfall":"通项趋零不能单独证明级数收敛。"},{"title":"同考点原创例题","level":"原创例题","prompt":"对级数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><mn>3<\/mn><mi>n<\/mi><\/mrow><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，正确的是（　）。<br>A. 因通项有界而收敛<br>B. 因通项趋于三而发散<br>C. 因通项为正而收敛<br>D. 因通项趋于零而收敛","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>lim<\/mo><mn>3<\/mn><mi>n<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。","通项极限不为零，违反级数收敛必要条件。","故该级数发散。"],"answer":"B；因通项趋于三而发散","pitfall":"通项趋零不能反推出级数收敛；需继续选用判别法。"}],"citations":[{"source":"exam","locator":"PDF第1页，第6题"},{"source":"answers","locator":"PDF物理第2,3页，第6题"}],"figure":null},{"id":"t07","module":"m09","title":"矩阵可逆与行列式非零","prerequisites":"了解方阵、三阶行列式和初等行变换。","intuition":"可逆表示矩阵对应的线性变换没有丢失方向，能够还原。对方阵，行列式是否为零是最快的代数判据。","sections":[{"title":"等价判据","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 阶方阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>，存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 当且仅当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，也等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><\/mrow><\/math>。非方阵不直接套用这个逆矩阵判据。逆矩阵满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。"},{"title":"快速观察","body":"行列式有零行或两行成比例时为零；三角矩阵行列式是对角元乘积。对角线中有零元素的三角矩阵不可逆；只有一般矩阵的某个对角元为零却不一定不可逆。"},{"title":"计算与参数","body":"三阶行列式可按一行展开，符号为正负交替，或用一行加另一行的倍数制造零。含参数时先算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 再求不为零的参数集合，不是只求方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 就作为可逆条件。"},{"title":"复核提醒","body":"行变换中交换两行使行列式变号，一行乘常数使行列式同倍变化，一行加另一行的倍数不改变行列式。若只判零与非零，可使用合法消元；若给出具体行列式值，应追踪这些变化。"}],"boundaries":["所附解析有一处把非零条件误写为零，须按勘误理解。","行列式为零表示不可逆，不能把条件写反。"],"examples":[{"title":"2024真题第7题 · 方法拆解","level":"真题精讲","prompt":"判断原卷四个三阶矩阵中哪个可逆。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>4<\/mn><\/mtd><mtd><mn>6<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","steps":["方阵可逆的充要条件是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>。","A 有零行，B 的第二、三行成比例，D 行列式为零。","C 是下三角矩阵，行列式为对角元乘积 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。"],"answer":"C；下三角矩阵的行列式为一。","pitfall":"所附解析有一处把非零条件误写为零，须按勘误理解。"},{"title":"同考点原创例题","level":"原创例题","prompt":"下列矩阵中可逆的是（　）。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><mtd><mn>6<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","steps":["只对方阵应用判据：可逆等价于行列式非零。","所选矩阵的行列式为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>。","其余三个矩阵的行列式均为零，故唯一正确的是所选矩阵。"],"answer":"C；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>","pitfall":"行列式为零表示不可逆，不能把条件写反。"}],"citations":[{"source":"exam","locator":"PDF第2页，第7题"},{"source":"answers","locator":"PDF物理第3页，第7题"}],"figure":null},{"id":"t08","module":"m10","title":"事件运算与德摩根律","prerequisites":"会区分交集、并集和补集。","intuition":"“全部不发生”与“不全部发生”含义不同。前者一个也不能发生，后者只需至少有一个没有发生，译成事件式时交集与并集不能互换。","sections":[{"title":"三种基本运算","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示二者同时发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示至少一个发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> 表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 不发生。事件是样本空间的子集，概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 是零到一之间的数，两者应使用不同记号。"},{"title":"德摩根律","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo>&#x0222A;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>，表示全部不发生；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>，表示至少一个不发生。将整句话否定后，交并运算对换且每个事件都取补。"},{"title":"逐词翻译","body":"先圈出“且、或、都、至少一个、同时”的作用范围。例如“不发生 A，且 B、C 不同时发生”要先把后一块写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math>，再与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> 取交集。括号体现否定作用的范围。"},{"title":"检验事件式","body":"可枚举三个事件发生与否的八种状态，用某个状态检查题意与候选式是否一致。例如 A 发生而 B、C 不发生，符合“不全部发生”却不符合“全部不发生”。仅有事件文字不能求出数值概率。"}],"boundaries":["原卷选项是事件式，不能把集合本身当作概率数值。","事件表达式与概率值不同；要求概率时应在事件外写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x000B7;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"examples":[{"title":"2024真题第8题 · 方法拆解","level":"真题精讲","prompt":"把事件 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><\/mrow><\/math> 全部不发生写成事件表达式。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo>&#x0222A;<\/mo><mi>C<\/mi><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>","steps":["全部不发生意味着三个补事件同时发生。","用交集表示“同时”，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>。","它也等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo>&#x0222A;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math>。若求数值概率，应写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，还需概率信息。"],"answer":"A；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>。","pitfall":"原卷选项是事件式，不能把集合本身当作概率数值。"},{"title":"同考点原创例题","level":"原创例题","prompt":"“<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><\/mrow><\/math> 不全部同时发生”的事件为（　）。<br>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math><br>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><\/math><br>C. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo>&#x0222A;<\/mo><mi>C<\/mi><\/mrow><\/math><br>D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math>","steps":["全部同时发生写作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><\/math>。","对该事件取补集。","结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><mo>&#x0003D;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x0222A;<\/mo><mover><mi>C<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>。"],"answer":"D；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><mi>C<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math>","pitfall":"事件表达式与概率值不同；要求概率时应在事件外写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x000B7;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"}],"citations":[{"source":"exam","locator":"PDF第2页，第8题"},{"source":"answers","locator":"PDF物理第3,4页，第8题"}],"figure":null},{"id":"t09","module":"m02","title":"指数、对数与零乘无穷型极限","prerequisites":"会判断实数对数的定义域，掌握连续函数的极限运算。","intuition":"指数函数可把复杂的乘方极限转成指数内的极限。遇到零乘无穷型，需要变形后求极限，不能把两个趋向直接当作数相乘。","sections":[{"title":"先确定趋向","body":"含 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 时实数定义域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 应按右极限理解。若求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>lim<\/mo><msup><mi>e<\/mi><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mi>L<\/mi><\/mrow><\/math> 为有限数，由连续性结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>L<\/mi><\/msup><\/mrow><\/math>。"},{"title":"处理零乘无穷","body":"当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>。写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 后，分子分母为无穷型；求导比为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>，极限为零。洛必达求导的是分子与分母，不能把整个商再求导。"},{"title":"常用极限支撑","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。若有额外分母 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><\/mrow><\/math>，它趋于一，可与已求出的有限极限组合。乘方 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msup><\/mrow><\/math> 可写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，前提是底数为正。"},{"title":"洛必达条件","body":"在去心邻域中分子分母可导、分母导数不为零，且确实为零比零或无穷比无穷时，才讨论导数之比的极限。运用后仍是未定式可继续判断条件；非未定式时应直接算，不是机械地不停求导。"}],"boundaries":["零乘无穷型需化为商。","有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 的表达式在零点只讨论右极限；不能写成零乘负无穷后直接下结论。"],"examples":[{"title":"2024真题第9题 · 方法拆解","level":"真题精讲","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/msub><msup><mi>e<\/mi><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","steps":["由定义域可知应取右极限。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。洛必达法则给出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>lim<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mo>lim<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","利用指数函数连续性，原极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mn>0<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。","pitfall":"零乘无穷型需化为商。"},{"title":"同考点原创例题","level":"原创例题","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/msub><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>x<\/mi><mi>ln<\/mi><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/mrow><\/msup><mo>&#x0003D;<\/mo><\/mrow><\/math> ________。","steps":["先求指数的极限，再利用指数函数的连续性。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>，用洛必达法则得其右极限为零。","指数中的常数倍或分母 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><\/mrow><\/math> 不改变其趋零结论。","所以原极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>","pitfall":"有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 的表达式在零点只讨论右极限；不能写成零乘负无穷后直接下结论。"}],"citations":[{"source":"exam","locator":"PDF第2页，第9题"},{"source":"answers","locator":"PDF物理第4页，第9题"},{"source":"s1","locator":"PDF第10—12页；资料印刷第10—12页"},{"source":"s3","locator":"PDF第3—5页；资料印刷第54—56页"}],"figure":null},{"id":"t10","module":"m01","title":"反正切复合函数的一阶微分","prerequisites":"了解导数、链式法则和自变量微分。","intuition":"导数是变化率，微分是这个变化率乘以自变量微分。原题要求的是 dy，完整答案需要同时包含系数函数与 dx。","sections":[{"title":"一阶微分","body":"对一元可导函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，定义 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。在一元情形，可导与可微等价。求微分可以先求导，但导数与微分不是同一个表达式。"},{"title":"反正切链式公式","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。实数反正切本身对全部实数有定义，复合函数仍须满足内层定义域。"},{"title":"复合层次怎样处理","body":"内层为二次式时先对二次式求导；内层为分式时用商法则；内层为根式时注意正根与定义区间。不要只把原题中的二换成新的系数，内层函数结构一变，分母与分子都可能变化。"},{"title":"复核方法","body":"先独立计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><\/mrow><\/math>，再写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>u<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，最后统一分母化简并乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。若分式化简消去某因子，原函数的定义域限制仍要保留。等价表达式应按数学意义判定，不只比较文本。"}],"boundaries":["内层导数与微分符号都不可漏。","只写导数没有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，不能作为完整的一阶微分。"],"examples":[{"title":"2024真题第10题 · 方法拆解","level":"真题精讲","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。","steps":["设内层 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><\/mrow><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","pitfall":"内层导数与微分符号都不可漏。"},{"title":"同考点原创例题","level":"原创例题","prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。","steps":["把内层函数记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>。","使用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998 个基本性质","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 阶方阵，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mi>k<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 可逆，由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math> 和乘积行列式性质得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。"},{"title":"组合公式","body":"把两条公式结合可得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><msup><mi>k<\/mi><mi>n<\/mi><\/msup><\/mrow><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/mfrac><\/mro }],"figure":null},{"id":"t12","module":"m10","title":"独立抽样与至少一次事件","prerequisites":"理解独立事件概率相乘和对立事件。","intuition":"至少一次成功可以包含很多互斥情形，直接相加容易漏项。它的反面只有一种情形：每次都失败，因此补事件通常更简便。","sections":[{"title":"试验条件","body":"有放回抽查且每次独立时，各次合格概率不变，记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math>。单次不合格概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><\/mrow><\/math>。如果不放回，后一次的概率一般会受前一次结果影响，不能照搬同一个乘法式。"},{"title":"补事件公式","body":"独立抽查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 次，全部不合格概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><\/mrow><\/math>。所以至少一次合格为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><\/mrow><\/math>。原题 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>0.9<\/mn><\/mrow><\/math>，故结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mn>0.1<\/mn><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0.99<\/mn><\/mrow><\/math>。"},{"title":"反求合格率","body":"若给出至少一次概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>m<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>q<\/mi><\/mrow><\/math>。解方程后必须检查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>，选择与非负的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>p<\/mi><\/mrow><\/math> 一致的实根。数学方程可能产生不符合概率范围的候选值。"},{"title":"结果检查","body":"所求概率应位于零到一之间，且至少一次合格的概率不小于单次合格率。连续多次相加得到大于一的数值通常说明误把非互斥事件概率直接相加。"}],"boundaries":["独立性是概率相乘的前提。","“有放回”配合独立抽样说明使用同一个概率相乘；不要直接把各次合格率相加。"],"examples":[{"title":"2024真题第12题 · 方法拆解","level":"真题精讲","prompt":"合格率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.9<\/mn><\/mrow><\/math>，独立有放回抽查两次，求至少一次合格的概率。","steps":["每次不合格概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.1<\/mn><\/mrow><\/math>。","独立两次均不合格的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>0.1<\/mn><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>0.01<\/mn><\/mrow><\/math>。","所求为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mn>0.01<\/mn><mo>&#x0003D;<\/mo><mn>0.99<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.99<\/mn><\/mrow><\/math>。","pitfall":"独立性是概率相乘的前提。"},{"title":"同考点原创例题","level":"原创例题","prompt":"产品合格率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.9<\/mn><\/mrow><\/math>，独立、有放回抽查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 次，至少一次抽到合格品的概率为 ________。","steps":["“至少一次合格”的补事件是全部不合格。","各次抽样独立，不合格概率相乘。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mtext>至少一次合格<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>10<\/mn><\/mrow><\/mfrac><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mn>3<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mfrac><mrow><mn>999<\/mn><\/mrow><mrow><mn>1000<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>999<\/mn><\/mrow><mrow><mn>1000<\/mn><\/mrow><\/mfrac><\/mrow><\/math>","pitfall":"“有放回”配合独立抽样说明使用同一个概率相乘；不要直接把各次合格率相加。"}],"citations":[{"source":"exam","locator":"PDF第2页，第12题"},{"source":"answers","locator":"PDF物理第4页，第12题"}],"figure":null},{"id":"t13","module":"m02","title":"相消差式与高阶无穷小","prerequisites":"会使用等价无穷小和常用函数在零点附近的展开。","intuition":"加减相消会消掉低阶主项。这时必须找到差式第一个没有被抵消的项，才能确定分子分母的阶数和系数。","sections":[{"title":"等价替换的边界","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003B1;<\/mi><\/mrow><mrow><mi>&#x003B2;<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>，记作 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x0007E;<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>。在适当的乘除极限中可用等价量替换；但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math> 并不能推出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mi>&#x0007E;<\/mi><mn>0<\/mn><\/mrow><\/math>，后者失去了决定极限的三阶项。"},{"title":"需要记住的首项","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>tan<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mi>k<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><msup><mi>x<\/mi><mi>k<\/mi><\/msup><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，表示比该阶更小的余项。"},{"title":"找阶数与系数","body":"分别展开分子和分母，先执行题干中的相减，再乘上额外的自变量因子。若均为三阶，极限是三阶系数之比；如果阶数不同，须继续判断是否趋零、无穷或不存在。"},{"title":"另一条解法","body":"满足洛必达条件时，可反复对分子分母求导到不再未定式。每一轮应重新确认类型和条件。对于原题，展开更容易追踪负号：<math xmlns=\"http://www.w3.org/1 来。","sections":[{"title":"对称性条件","body":"若被积函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 可积且是偶函数，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mi>a<\/mi><\/msubsup><mi>g<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>g<\/mi><\/mrow><\/math>；若是奇函数则积分为零。需要同时具备对称区间和相应奇偶性。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 都是偶函数。"},{"title":"去掉绝对值","body":"在正半轴 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>，负半轴 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>。原题用偶性化为两倍正半轴后才去掉绝对值；如果一开始整个区间都写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>，就会错误地把题目变成奇函数积分。"},{"title":"根式换元","body":"遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msqrt><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>，令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。定积分应把 x 的上下限同步换成 u 的上下限；负微分与反向上下限通常抵消。多出的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 也要用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mi>u<\/mi><\/mrow><\/math> 表示。"},{"title":"完整计算与复核","body":"先写对称化的积分，再列换元、微分和新上下限，计算幂函数积分，最后给精确值。被积函数非负则结果不应为负。根式需检查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>，不可越过实数定义域。"}],"boundaries":["原卷竖线是绝对值，不是单独的变量。","负半轴上不能直接把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 换成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>；换元时上下限与负号要一起处理。"],"examples":[{"title":"2024真题第15题 · 方法拆解","level":"真题精讲","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><mn>4<\/mn><\/msubsup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/ 98/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 收敛，称原级数绝对收敛，并能推出原级数收敛。若原级数收敛而绝对值级数发散，才是条件收敛。出现 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 只说明符号交错，不能直接决定属于哪一种。"},{"title":"比值判别","body":"对于最终为正的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math>，若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo>lim<\/mo><msub><mi>a<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>a<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math> 存在，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003C1;<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 时级数收敛；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 或为正无穷时发散；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时该方法不作结论。本次阶乘型变式的极限为零。"},{"title":"阶乘约分细节","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x00021;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x
