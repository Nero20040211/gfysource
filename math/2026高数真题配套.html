tchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","前 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><\/mrow><\/math> 项相消后得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>N<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>N<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><mo>&#x02192;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时部分和趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，由定义得到收敛及其和。"],"answer":"收敛，和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["不能由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 直接判收敛。","交错符号不自动带来收敛；首先必须满足通项趋零。"],"citations":[{"source":"exam","locator":"第6题，PDF第1页"},{"source":"answers","locator":"PDF第3页；通项极限表述在此修正"}],"figure":null},{"id":"t25","module":"m10","title":"比较、比值与根值判别","prerequisites":"熟悉正项级数；会算数列比值及 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根的极限。","intuition":"判别法选择依赖通项结构：有整体的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次幂优先考虑根值，有阶乘或指数与多项式的积商优先考虑比值。","sections":[{"title":"比较判别","body":"对非负项，如果从某项起 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02264;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛；如果 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>v<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 发散，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 发散。不能把这两个方向反用。删改有限项不改变敛散性。"},{"title":"比值与根值","body":"正项级数若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><msub><mi>u<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002F;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 存在，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 收敛，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math>（含正无穷）发散；<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 不作结论。根值判别使用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x0003D;<\/mo><mo>lim<\/mo><mroot><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><mi>n<\/mi><\/mroot><\/mrow><\/math>，结论相同。对一般实项可对绝对值使用，小于1时得到绝对收敛；本卷重点是正项情形。"},{"title":"把有限项与长期行为分开","body":"真题通项前面很多项可能很大，但根值最终趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><\/mrow><\/math>，仍收敛。收敛并不意味着前几项小，也不意味着容易算出级数和。求敛散性与求和是不同任务。比值或根值等于1时应换方法，不能猜测。"}],"examples":[{"title":"真题16：整体n次幂","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mo stretchy=\"false\">[<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mo stretchy=\"false\">]<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>。","steps":["通项为正，取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根后指数消去：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><mi>n<\/mi><\/mroot><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","分子分母同除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math>，极限为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><\/mrow><\/math>。","根值极限严格小于1，级数收敛；前面有限个大项不影响结论。"],"answer":"收敛。","pitfall":"","level":"标准例题"},{"title":"判别值等于1时不能下结论","prompt":"比较 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mi>n<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 的比值判别结果。","steps":["对第一项族，比值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。","对第二项族，比值 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>n<\/mi><mn>2<\/mn><\/msup><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。","两个比值极限都是1，但 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 级数标准分别给出发散与收敛，所以比值为1确实无法判定。"],"answer":"第一者发散，第二者收敛；比值法在这里均无结论。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["根值法只取通项的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 次根，不是对整个无穷和开根。","用判别法后写明极限与阈值1的关系。"],"citations":[{"source":"exam","locator":"第16题，PDF第2页"},{"source":"answers","locator":"PDF第9页；比较及边界说明为配套拓展"}],"figure":null},{"id":"t26","module":"m11","title":"行列式性质与不可逆条件","prerequisites":"会二阶行列式 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>d<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><\/math>；了解矩阵由行和列组成，行列式是一个数。","intuition":"先观察行列关系，常能避免展开。成比例的两列代表同一方向的重复信息，行列式为零。","sections":[{"title":"常用性质","body":"行列式要求方阵。交换两行使值变号；一行乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 使值乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>；一行加另一行的倍数，值不变。列也有对应性质。两行或两列相同、成比例，或有一整行/列为零，行列式都为零。"},{"title":"三阶展开与可逆","body":"沿第一行展开为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mrow><mn>13<\/mn><\/mrow><\/msub><msub><mi>M<\/mi><mrow><mn>13<\/mn><\/mrow><\/msub><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><\/mrow><\/math> 是余子式。三阶矩阵可逆当且仅当行列式非零；不可逆就令行列式为零。四阶及以上不能使用三阶对角线法。"},{"title":"资料中的成比例列解释","body":"真题11第一列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>T<\/mi><\/msup><\/mrow><\/math>，第二列为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>T<\/mi><\/msup><\/mrow><\/math>，第二列始终是第一列的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 倍。当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，第二列为零列；当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，两列成比例。所附解析中“虽然不成比例”的中间说法不成立；其后修正得到的零值结论是正确的。"}],"examples":[{"title":"真题11：四阶行列式无需展开","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0007C;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><mtd><mi>b<\/mi><\/mtd><mtd><mi>c<\/mi><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><mtd><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mtd><mtd><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><mtd><msup><mi>b<\/mi><mn>3<\/mn><\/msup><\/mtd><mtd><msup><mi>c<\/mi><mn>3<\/mn><\/msup><\/mtd><\/m ><mi>t<\/mi><mo>&#x02212;<\/mo><mn>48<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>t<\/mi><mo>&#x02212;<\/mo><mn>42<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>32<\/mn><mo>&#x02212;<\/mo><mn>35<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","化简得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>27<\/mn><\/mrow><\/math>。","不可逆等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["行列式展开前先找零行、比例行列和可简化的行列变换。","行变换对行列式的影响不同，不能把所有初等变换都说成值不变。"],"citations":[{"source":"exam","locator":"第7、11题，PDF第1—2页"},{"source":"answers","locator":"PDF第3、5页；成比例列论证已修正"}],"figure":null},{"id":"t27","module":"m11","title":"逆矩阵与独立复核","prerequisites":"会矩阵乘法；知道单位矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math> 对角为1、其余为0；会算行列式。","intuition":"逆矩阵把矩阵作用还原。计算结束后与原矩阵相乘得到单位矩阵，能够直接发现许多符号和转置错误。","sections":[{"title":"存在条件与定义","body":"方阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 的逆 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>I<\/mi><\/mrow><\/math>。存在逆等价于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>。矩阵乘法通常不交换，不能把数的除法法则直接照搬；记号 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math> 也不是逐元素取倒数。"},{"title":"两种计算方法","body":"伴随法为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> 是代数余子式矩阵的转置，转置不能漏。更适合系统计算的方法是在增广矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>I<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 上只做初等行变换，把左边化为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math>，右边就变为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>；左右必须同步变换。"},{"title":"验算和表达","body":"建议保持分数精确值，减少小数舍入。把候选逆矩阵记为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math>，逐行乘逐列检查 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>I<\/mi><\/mrow><\/math>；方阵情形该检查可确认逆。若中途发现行列式为零，应停止求逆并说明不存在，不能继续除以零。"}],"examples":[{"title":"真题19：三阶逆矩阵","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 的逆。","steps":["沿第一行展开得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，确认可逆。","代数余子式矩阵为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>6<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>6<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>4<\/mn><\/mtd><mtd><mn>5<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，转置得到伴随矩阵。","除以2得候选逆；将原矩阵与它相乘，三条对角结果均为1，非对角结果均为0。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>5<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"不存在逆时先停止","prompt":"矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 是否可逆？","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","第二行是第一行的2倍，行信息重复。","由可逆条件，逆不存在；不能对四个元素逐个取倒数。"],"answer":"不可逆。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["伴随矩阵要把代数余子式矩阵转置。","初等行变换求逆时，不能对右边单独作列变换。"],"citations":[{"source":"exam","locator":"第19题，PDF第2页"},{"source":"answers","locator":"PDF第11页"}],"figure":null},{"id":"t28","module":"m11","title":"消元、秩与非齐次方程组通解","prerequisites":"会线性方程代入；会增广矩阵；理解自由参数可取任意实数。","intuition":"消元逐步找出真正独立的约束。剩余没有主元的未知数成为自由变量，每个自由变量产生一个可自由改变的方向。","sections":[{"title":"只对增广矩阵作行变换","body":"把方程组写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。交换方程、方程乘非零常数、一个方程加另一个方程的倍数都不改变解集。行阶梯形中的非零行数为秩；非主元列对应自由变量。不要对增广矩阵任意作列变换，因为那会改变未知数的含义。"},{"title":"有解条件与自由维数","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则无解；秩相同才有解。对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 个未知数，有解时自由参数个数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。当秩等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 时解唯一；少于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 时有无穷多解。方程条数不能直接当作秩，可能存在重复约束。"},{"title":"通解的结构及核验","body":"非齐次通解可写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mi>p<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>k<\/mi><mn>1<\/mn><\/msub><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002B;<\/mo><msub><mi>k<\/mi><mi>s<\/mi><\/msub><msub><mi>v<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msub><mi>x<\/mi><mi>p<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msub><mi>v<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，齐次向量线性独立且数量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0003D;<\/mo><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。代入任取的一个参数值只是抽查，验证这些结构条件才能确认整个解族。"}],"examples":[{"title":"真题20：一个自由参数","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;<\/mo><mtable><mtr><mtd columnalign=\"left\"><mn>2<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x02212;<\/mo><mn>3<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><mn>4<\/mn><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><mn>3<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002E;<\/mo><\/mtd><\/mtr><\/mtable><\/mrow><\/mrow><\/math> 的通解。","steps":["以第二个方程作首行，消去其他行的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>，得到约束 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 及 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><mn>3<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x02212;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>。","两式相加得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>12<\/mn><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>；再得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>4<\/mn><\/msub><\/mrow><\/math>。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math>，秩为3，四未知数恰有一个自由参数。特解和齐次方向分别代回可检验。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>8<\/mn><mo>&#x0002C;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>T<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>T<\/mi><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"发现矛盾行","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;<\/mo><mtable><mtr><mtd columnalign=\"left\"><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><\/mtd><\/mtr><mtr><mtd columnalign=\"left\"><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mtd><\/mtr><\/mtable><\/mrow><\/mrow><\/math> 的解。","steps":["第二个方程减去第一个方程的2倍。","得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，说明约束矛盾。","系数矩阵秩为1，增广矩阵秩为2，因此无解；不能把第二个变量随意设为参数。"],"answer":"无解。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["写出一个特解不等于求出通解。","参数名可以变化，但齐次方向的张成空间和特解所在仿射集合应相同。"],"citations":[{"source":"exam","locator":"第20题，PDF第2页"},{"source":"answers","locator":"PDF第12—13页"}],"figure":null},{"id":"t29","module":"m12","title":"事件运算与概率加法公式","prerequisites":"理解集合的并、交和补；概率非负且总样本空间概率为1。","intuition":"把事件画成区域，再把目标区域拆成互不重叠的小块，可避免误把交集当并集，或把同一部分算两次。","sections":[{"title":"符号和事件含义","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示至少一个发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><\/mrow><\/math> 表示同时发生，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math> 表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 不发生。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><mi>B<\/mi><\/mrow><\/math> 是发生 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 而不发生 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>，即 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>&#x029F5;<\/mi><mi>A<\/mi><\/mrow><\/math>，不是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/mover><\/mrow><\/math>。补号覆盖范围决定含义。"},{"title":"加法公式与差事件","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，因为同时发生的部分被数了两次。又有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。也可直接把并集拆成不相交的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><mi>B<\/mi><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"},{"title":"互斥与独立不同","body":"互斥表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/math> 不可能发生，因而 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>；独立表示 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。两个正概率互斥事件不独立，因为发生其中一个会排除另一个。不要在未给独立条件时直接把交集概率写成乘积。"}],"examples":[{"title":"真题12：使用不相交分解","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>A<\/mi><mo accent=\"true\">&#x02015;<\/mo><\/mover><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.2<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.6<\/mn><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["并集由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>&#x029F5;<\/mi><mi>A<\/mi><\/mrow><\/math> 两个不相交部分组成。","因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.6<\/mn><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>0.2<\/mn><\/mrow><\/math>。","直接相减得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.4<\/mn><\/mrow><\/math>，不需要假设事件独立。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.4<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"恰好发生一个","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.6<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.5<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0.2<\/mn><\/mrow><\/math>，求恰有一个事件发生的概率。","steps":["只有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 发生的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.6<\/mn><mo>&#x02212;<\/mo><mn>0.2<\/mn><mo>&#x0003D;<\/mo><mn>0.4<\/mn><\/mrow><\/math>。","只有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 发生的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.5<\/mn><mo>&#x02212;<\/mo><mn>0.2<\/mn><mo>&#x0003D;<\/mo><mn>0.3<\/mn><\/mrow><\/math>。","两部分互斥，相加得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.7<\/mn><\/mrow><\/math>；亦可用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.7<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["“至少一个”与“恰好一个”差一个同时发生区域。","补号在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 上和补号在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/math> 上，含义不同。"],"citations":[{"source":"exam","locator":"第12题，PDF第2页"},{"source":"answers","locator":"PDF第6页；事件关系为配套拓展"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"并集拆成A和B中不属于A的部分，两部分互不相交\"><title>并集拆成A和B中不属于A的部分，两部分互不相交<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><defs><mask id=\"outside-a\"><rect width=\"620\" height=\"280\" fill=\"white\"/><circle cx=\"250\" cy=\"140\" r=\"90\" fill=\"black\"/><\/mask><\/defs><circle cx=\"250\" cy=\"140\" r=\"90\" fill=\"#c3dfd2\"/><circle cx=\"370\" cy=\"140\" r=\"90\" fill=\"#efcea8\" mask=\"url(#outside-a)\"/><circle cx=\"250\" cy=\"140\" r=\"90\" fill=\"none\" stroke=\"#17675b\" stroke-width=\"2\"/><circle cx=\"370\" cy=\"140\" r=\"90\" fill=\"none\" stroke=\"#a56c41\" stroke-width=\"2\"/><text x=\"207\" y=\"145\">A<\/text><text x=\"379\" y=\"145\">B且非A<\/text><text x=\"172\" y=\"268\">并集 = A 与 B中不属于A的部分<\/text><\/svg>"},{"id":"t30","module":"m12","title":"古典概型、条件概率与不放回抽样","prerequisites":"会分数运算；会按顺序计数或使用组合数；能区分是否放回。","intuition":"不放回会改变剩余样本：第一次发生后，第二次的总数与目标数都可能变化。把第二步写成条件概率可以防止机械相乘。","sections":[{"title":"古典概型与条件概率","body":"有限且等可能的样本空间中，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 等于有利结果数除以所有结果数。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，条件概率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo>&#x02223;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo>&#x02223;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。只有独立时才可把条件概率换成无条件的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"},{"title":"顺序法与组合法","body":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><mo>&#x0002C;<\/mo><mi>K<\/mi><\/mrow><\/math> 为整数，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><mo>&#x02265;<\/mo><mn>2<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>K<\/mi><mo>&#x02264;<\/mo><mi>N<\/mi><\/mrow><\/math>。从 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N<\/mi><\/mrow><\/math> 件中有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> 件目标，不放回抽两件且两件均为目标，概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>K<\/mi><mo>&#x0002F;<\/mo><mi>N<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>K<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>N<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，也等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;<\/mo><mfrac linethickness=\"0\"><mi>K<\/mi><mn>2<\/mn><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;<\/mo><mfrac linethickness=\"0\"><mi>N<\/mi><mn>2<\/mn><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;<\/mo><\/mrow><\/math>。两种方法必须用相同的等可能样本描述，不能把有序分子与无序分母混合。"},{"title":"用补事件处理至少一次","body":"“至少一次成功”通常可写成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mtext>一次也没有<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。不放回时，失败后剩余失败数也减少；放回时在等可能独立重复抽取假设下，各次成功概率保持不变。是否放回是建模条件，不是可以忽略的措辞。"}],"examples":[{"title":"真题8：两次均为一等奖","prompt":"100张票有10张一等奖，不放回抽两次，每次一张，求两次均为一等奖的概率。","steps":["第一次抽到一等奖概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><mo>&#x0002F;<\/mo><mn>100<\/mn><\/mrow><\/math>。","已知第一次成功，剩99张，其中9张一等奖，所以第二次条件概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x0002F;<\/mo><mn>99<\/mn><\/mrow><\/math>。","乘法公式给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>10<\/mn><mo>&#x0002F;<\/mo><mn>100<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>9<\/mn><mo>&#x0002F;<\/mo><mn>99<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>110<\/mn><\/mrow><\/math>；用组合数也得相同结果。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>110<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"至少一次与放回比较","prompt":"5张卡中有2张奖卡，不放回抽2张，求至少抽到一张奖卡的概率；再与放回抽取比较。","steps":["不放回时两次均无奖的概率为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002F;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002F;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><mo>&#x0002F;<\/mo><mn>10<\/mn><\/mrow><\/math>。","因此至少一次中奖为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002F;<\/mo><mn>10<\/mn><mo>&#x0003D;<\/mo><mn>7<\/mn><mo>&#x0002F;<\/mo><mn>10<\/mn><\/mrow><\/math>。","若每次放回且独立，均无奖为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002F;<\/mo><mn>5<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><mo>&#x0002F;<\/mo><mn>25<\/mn><\/mrow><\/math>，至少一次为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16<\/mn><mo>&#x0002F;<\/mo><mn>25<\/mn><\/mrow><\/math>。"],"answer":"不放回为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>7<\/mn><mo>&#x0002F;<\/mo><mn>10<\/mn><\/mrow><\/math>；放回为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16<\/mn><mo>&#x0002F;<\/mo><mn>25<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["没有独立条件时，联合概率应使用条件概率。","票数减少一张，奖票数是否减少取决于已经发生的事件。"],"citations":[{"source":"exam","locator":"第8题，PDF第1—2页"},{"source":"answers","locator":"PDF第4页"}],"figure":null}],"practices":[{"id":"p01","module":"m01","level":"引导练习","topic_ids":["t01"],"prompt":"设 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。求定义域，判断奇偶性，并给出一个适用于整个定义域的上界。","hint":"先检查根号与分母；奇偶性比较 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。估计大小时分别利用分子不超过二、分母不小于一。","steps":["实数根号要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math>，即 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x02264;<\/mo><mi>x<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>；分母 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 不再增加限制。","定义域关于原点对称，而且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故是偶函数。","在定义域内 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02265;<\/mo><mn>1<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>；在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 处取到上界。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>；偶函数，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>。","pitfall":"化简或估计之前保留根号的实数限制；只说分子有界，还须确认分母不会趋于零。"},{"id":"p02","module":"m01","level":"独立练习","topic_ids":["t02","t03"],"prompt":"求极限 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mi>cos<\/mi><mi>x<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/math>。说明为何只用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mn>1<\/mn><\/mrow><\/math> 不足以得出答案。","hint":"分子的一次项相互抵消。把正弦保留到三次项，把余弦保留到二次项。","steps":["有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>cos<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，分子为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","同除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，得到极限 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mrow><\/math>。只保留一次主项会把分子写成零，丢失真正决定结果的三次 h/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02265;<\/mo><mn>1<\/mn><\/mrow><\/math> 时满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mrow><mn>2<\/mn><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x02265;<\/mo><mfrac><mn>1<\/mn><mrow><mn>3<\/mn><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math>；右侧级数为调和级数的正倍数而发散，故第二级数发散。"],"answer":"不能。第一级数收敛，和为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/math>；第二级数发散。比值法在这里都没有结论。","pitfall":"比值等于一不是收敛条件，也不是发散条件；比较判别的大小方向必须与基准级数的结论相匹配。"},{"id":"p31","module":"m11","level":"引导练习","topic_ids":["t26","t27"],"prompt":"求矩阵 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 的行列式及逆矩阵，并用乘积验证。","hint":"先确认二阶行列式非零，再用二阶逆矩阵公式；逆矩阵不是逐项取倒数。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo movablelimits=\"true\">det<\/mo><mi>A<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以矩阵可逆。","二阶逆矩阵由交换对角项、改变非对角项符号，再除以行列式得到，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","相乘得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003 <\/mrow><\/math> 设为参数，使另外两个未知数的表达式保持整数系数。完成后分别核验特解与齐次方向。","steps":["两行系数不成比例，所以系数矩阵秩为二；消元不会出现矛盾行，三个未知数有一个自由参数。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math>。两个方程给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>t<\/mi><\/mrow><\/math>，相减得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math>。","回代得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mi>t<\/mi><\/mrow><\/math>，故通解为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi mathvariant=\"sans-serif\">T<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi mathvariant=\"sans-serif\">T<\/mi><\/mrow><\/msup><\/mrow><\/math>。","特解代入两个方程分别得到二和一；齐次方向代入分别为零，且非零，覆盖唯一自由方向。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><msub><mi>x<\/mi><mn>1<\/mn><\ th/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">[<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><msup><mo minsize=\"1.2em\" maxsize=\"1.2em\">]<\/mo><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>。","乘积求导得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>，常数项的导数为零。","合并同类项，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。"],"option_explanations":["A 错误。只对多项式求导，漏掉了指数因子求导产生的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。","B 错误。这是给定原函数中去掉任意常数后的表达式，尚未完成求导。","C 正确。乘积求导后得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>，正好可以写成该形式。","D 错误。在乘积求导时漏掉了原多项式中的常数项所贡献的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。"],"pitfall":"把“求原函数”与“由原函数求被积函数”混淆，或认为多项式中的常数项完全不影响乘积的导数。","alternatives":[],"verification_note":"脚本对 JSON 题干给出的原函数独立求导，并逐一比较四个 JSON 选项；仅 C 与导数恒等。"},{"number":5,"type":"single","topic_ids":["t17"],"points":4,"stem":"微分方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02033;<\/mi><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的一个解是（ ）。","options":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>"],"correct":1,"answer":"B，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math>。","method":"二阶常系数齐次方程可由特征方程识别其解的结构。此题出现重根，通解中既有指数函数，也有自变量乘指数函数。","steps":["写出特征方程 <math xmlns=\"http://www.w         var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
