><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","intuition":"函数性质是对整个定义域作出的判断。检查一个点只能提供反例，不能证明全局性质；判奇偶性之前必须先检查定义域是否关于原点对称。","sections":[{"title":"定义域先于化简","body":"函数给每个允许的自变量指定唯一函数值。分母不能为零，实数范围内偶次根号内非负，对数真数为正。化简后表达式相同，也必须保留原式的限制。例如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002F;<\/mo><mi>x<\/mi><\/mrow><\/math> 只在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时等于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，不能因此把原函数的定义域补成全体实数。"},{"title":"奇偶、有界、周期分别怎样证明","body":"在对称定义域上，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为偶函数，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为奇函数；恒零函数可同时是奇、偶函数。有界要求存在同一个常数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><\/mrow><\/math> 使所有允许的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 都满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><\/mrow><\/math>。周期要求存在固定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，使定义域在平移下适用且恒有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>T<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。三种性质不能相互替代。"},{"title":"考试中的检验顺序","body":"先看定义域，再代 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>，随后根据所问性质找全局恒等式或反例。乘积的奇偶性来自符号相乘：奇乘奇为偶，奇乘偶为奇。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 中的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 使振幅增长，不能因为出现正弦就判为周期或有界。"}],"examples":[{"title":"真题1：乘积的奇偶性","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math> 上的性质。","steps":["定义域为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>，关于原点对称。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，故为偶函数。","取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>&#x003C0;<\/mi><mo>&#x0002F;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>n<\/mi><mi>&#x003C0;<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，故无界。连续周期函数必有界，因此本函数也不是周期函数。"],"answer":"偶函数；无界且非周期。","pitfall":"正弦的有界性不等于与它相乘的任意函数仍有界。","level":"标准例题"},{"title":"定义域限制会改变奇偶判断","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 是否为偶函数？","steps":["由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 得定义域 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0222A;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","该定义域关于原点对称，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","虽然定义域不是一个完整区间，奇偶性定义仍然适用。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 是偶函数。","pitfall":"不要误认为偶函数必须在原点有定义。","level":"拔高与边界变式"}],"boundaries":["只在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 上给出的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，按该定义域不能判为偶函数。","“取几个点成立”不足以证明恒等式；证明无界可构造趋于无穷的函数值序列。"],"citations":[{"source":"s1","locator":"PDF第3—6页"},{"source":"exam","locator":"第1题，PDF第1页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"偶函数关于纵轴对称\"><title>偶函数关于纵轴对称<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M30 140H590 M310 25V255\" stroke=\"#82938e\"/><polyline points=\"50.00,167.94 52.17,172.43 54.33,176.76 56.50,180.93 58.67,184.91 60.83,188.71 63.00,192.32 65.17,195.72 67.33,198.92 69.50,201.90 71.67,204.67 73.83,207.22 76.00,209.55 78.17,211.65 80.33,213.52 82.50,215.16 84.67,216.57 86.83,217.74 89.00,218.69 91.17,219.42 93.33,219.91 95.50,220.18 97.67,220.23 99.83,220.07 102.00,219.69 104.17,219.11 106.33,218.33 108.50,217.35 110.67,216. ay=\"inline\"><mrow><msup><mi>u<\/mi><mi>k<\/mi><\/msup><\/mrow><\/math> 后趋零。先判断分母的阶，再把分子展开至首次非零项；代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 后，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>。"},{"title":"与洛必达法则的比较","body":"洛必达法则直接适用于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0002F;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0221E;<\/mo><mo>&#x0002F;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 型，还须满足相应去心邻域内分子、分母可导，分母导数不为零，以及导数商存在极限等条件。每次使用都要重新检查未定式和条件。本题类反复求导容易变长；低阶泰勒或把复合小量提出，通常更清楚。非未定式不能机械地分别求导。"}],"examples":[{"title":"真题13：先确定抵消阶数","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>。","steps":["分母 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><m /mn><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>24<\/mn><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","同除以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>，余项商趋零。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>24<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["等价关系不能无条件在加减法中逐项替换。","展开式的余项阶数必须在代换后同步改变。"],"citations":[{"source":"s1","locator":"PDF第10—12页"},{"source":"s3","locator":"PDF第2—5页：洛必达法则"},{"source":"answers","locator":"第13题，PDF第6页；泰勒步骤为配套说明"}],"figure":null},{"id":"t04","module":"m01","title":"连续、零点与根的存在性","prerequisites":"区分开区间与闭区间；方程 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的根就是函数图像与横轴的交点。","intuition":"连续把区间两端连接起来。两端异号意味着途中至少穿过一次零，但不能说明只穿过一次。","sections":[{"title":"在一点连续的三项核对","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 连续要求：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 有定义，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><\/mrow><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 存在，且两者相等。分段函数在连接点要分别检查左右极限，并与 tchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则至少有一点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BE;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。连续检查包含端点，可导只要求内部。结论是至少存在一点，不保证唯一。"},{"title":"拉格朗日定理","body":"去掉端点值相等条件，保留前两项，则存在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 使 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BE;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。几何上有一条切线平行于端点连成的割线。罗尔定理是割线斜率为零的特殊情形。"},{"title":"如何用于唯一性与不等式","body":"若假设函数有两个不同零点，罗尔定理会推出两点之间有导数为零的点；若已知导数处处正或处处负，就产生矛盾。证明函数严格单调也可由拉格朗日定理：对于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>，中值点处导数的符号决定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的符号。"}],"examples":[{"title":"找出中值点","prompt":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 使用拉格朗日定理，求中值点。","steps":["多项式在闭区间连续、内部可导，满足条件。","割线斜率 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>。","由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BE;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>&#x003BE;<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BE;<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"缺少可导条件","prompt":"函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 端点相等，是否必有内部点导数为零？","steps":["端点值同为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，并且函数连续。","但在内部点 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 不可导，罗尔定理条件不全。","其余内部点的导数为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 或 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，确实没有导数为零的点。"],"answer":"不能使用罗尔定理，也没有这样的点。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["定理结论不能代替对条件的核对。","证明至多一个根仍需另外证明至少一个根。"],"citations":[{"source":"s3","locator":"PDF第1—2页"}],"figure":null},{"id":"t08","module":"m03","title":"单调性、极值与唯一根","prerequisites":"会求导、解导数零点、判断符号；会用零点定理建立存在性。","intuition":"导数符号告诉函数朝哪个方向走。极值关心某点两侧方向是否改变；唯一根关心整个指定定义域是否始终同向。","sections":[{"title":"单调性的判定","body":"在区间内若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，函数严格递增；若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，严格递减。<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 只直接保证不减；要进一步断言严格递增，应排除非退化区间上恒为零等情况。函数定义域若分成互不相连的区间，不能只分别判导数就自动宣称整个定义域严格递增。"},{"title":"极值与最值","body":"可导内点取得极值时必有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，但驻点不一定是极值点。导数由正变负为极大，由负变正为极小；不变号则不是极值。闭区间最值要比较内部候选点和两个端点，不能只找驻点。"},{"title":"唯一根的完整模板","body":"令方程左边为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math>。先在某个闭区间检查连续和异号，得到至少一个根；再在题设整个定义域证明严格单调，得到至多一个根。两部分合并才能得出有且仅有一个。对于指数加正系数一次项，导数常直接处处为正。"}],"examples":[{"title":"真题21：完成唯一性","prompt":"继续证明 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的实根唯一。","steps":["前面已经由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 和连续性证明至少有一根。","对任意实数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> 在整个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math> 严格递增，至多有一个零点。结合存在性得恰有一个实根。"],"answer":"有且仅有一个实根，且位于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"驻点不必是极值点","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 在零点是否有极值。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，故零点是驻点。","零点两侧导数均为正，函数由负值经过零继续增至正值。","零点不满足局部最大或最小的定义。"],"answer":"零点是驻点，但不是极值点。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["导数等于零只是可导内点取得极值的必要条件。","只证明在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 递增不能排除该区间外的其他根。"],"citations":[{"source":"s3","locator":"PDF第5—6、8—10页"},{"source":"answers","locator":"第21题，PDF第14页"}],"figure":null},{"id":"t09","module":"m03","title":"凹凸性与拐点","prerequisites":"会求二阶导数并作符号表；知道拐点要用平面坐标表示。","intuition":"拐点是弯曲方向改变的地方。二阶导数为零仅提供候选位置，真正决定拐点的是两侧弯曲方向是否改变。","sections":[{"title":"用明确的弯曲方向理解符号","body":"本资料把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 称为开口向上（通常中文教材称凹），<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 称为开口向下（凸）。不同资料的术语习惯可能不同，作答优先写二阶导数符号和图像方向，避免只记一个汉字。"},{"title":"拐点的检查流程","body":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>f<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><\/mrow><\/math>，找二阶导数为零或不存在的候选点；检查函数在候选点连续，比较两侧二阶导数符号或直接确认凹凸改变；最后代回 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 求纵坐标。并不是所有拐点都满足二阶导数为零，例如某些二阶导数不存在但图像连续且凹凸改变的点。"},{"title":"与极值分开","body":"极值由一阶导数在两侧的符号变化判断，拐点由凹凸变化判断。一个点可以是水平切线拐点，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 的原点；也可能有极值但不是拐点，如 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 的原点。"}],"examples":[{"title":"真题2：三次曲线拐点","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math> 的拐点。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><mi>x<\/mi><\/mrow><\/math>，候选点为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，二阶导数负；当 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，二阶导数正，且函数连续。","凹凸改变，代入 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 得拐点坐标。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"二阶导数为零但无拐点","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 在原点是否有拐点。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>12<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，在零点为零。","两侧均为正，图像都开口向上。","凹凸没有改变，原点不是拐点；它实际上是极小值点。"],"answer":"原点不是拐点。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["必须检查变号，不能只解 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","“拐点”为坐标点，不能只答横坐标。"],"citations":[{"source":"s3","locator":"PDF第6—8页"},{"source":"exam","locator":"第2题，PDF第1页"}],"figure":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"原点两侧二阶导数变号，弯曲方向改变\"><title>原点两侧二阶导数变号，弯曲方向改变<\/title><rect width=\"620\" height=\"280\" rx=\"12\" fill=\"#f3f7f5\"/><path d=\"M30 140H590 M310 25V255\" stroke=\"#82938e\"/><polyline points=\"50.00,206.67 52.17,201.72 54.33,196.89 56.50,192.16 58.67,187.55 60.83,183.04 63.00,178.63 65.17,174.34 67.33,170.14 69.50,166.05 71.67,162.07 73.83,158.18 76.00,154.40 78.17,150.72 80.33,147.13 82.50,143.65 84.67,140.26 86.83,136.96 89.00,133.77 91.17,130.66 93.33,127.65 95.50,124.74 97.67,121.91 99.83,119.18 102.00,116.53 104.17 mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>sin<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>arctan<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。公式应在相应的实数区间内使用。"},{"title":"已知积分反求函数","body":"若题目给 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，两边对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求导，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。常数的导数为零，不能把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 留在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 中。线性性质允许拆和与提出常数，但通常不能把乘积的积分拆成两个积分的乘积。"}],"examples":[{"title":"真题4：求被积函数","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["原式要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。由原函数定义，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>。","使用乘积法则，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x0002F;<\/mo><mi>x<\/mi><\/mrow><\/math>。","积分常数的导数为零。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"幂公式的例外","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002F;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["分开为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0222B;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0002F;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0222B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","第一项不能套 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 分母公式，因为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>；用对数公式。","结果为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，在不跨过零的区间上求导可复核。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["不定积分要写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>；定积分的最终数值不写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 的绝对值来自兼容正、负区间，不能无条件删去。"],"citations":[{"source":"s4","locator":"PDF第1—4页"},{"source":"answers","locator":"第4题，PDF第2页"}],"figure":null},{"id":"t11","module":"m04","title":"换元积分与分部积分","prerequisites":"会用链式法则和乘积求导；能识别表达式内层及其导数。","intuition":"换元法把复合结构改写成简单变量；分部积分把较难的乘积积分换成另一项更容易的积分。方法应让剩余计算变简单。","sections":[{"title":"换元法来自链式法则","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x0222B;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。实际计算先找内层及其导数；差一个常数因子可以补偿。换元后不要在同一个积分里混留 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math>。不定积分算完需换回原变量。"},{"title":"分部积分来自乘积微分","body":"由 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mi>v<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math> 移项积分，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mi>v<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>v<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>。选择 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math> 时考虑它求导后能否更简单；对数常作为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><\/mrow><\/math>，多项式求导会降次。选择 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>v<\/mi><\/mrow><\/math> 时必须能求出 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math>。只背顺序口诀而不看剩余积分是否容易，可能越算越复杂。"},{"title":"两种方法可以配合","body":"遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 优先凑 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，遇到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math> 优先分部。先作结构判断，再计算；最终对结果求导复核。当题目是定积分，换元要同时改上下限，分部的边界项要在上下端点分别代值。"}],"examples":[{"title":"凑微分","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>cos<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["内层为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，其导数正好是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>。令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","原积分变成 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>cos<\/mi><mi>u<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>sin<\/mi><mi>u<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","换回原变量并检查求导。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"对数乘幂","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>。","steps":["取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0002F;<\/mo><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math>。","原积分 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002F;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","继续积分并补上常数，求导后两项附加的一次项相消。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["换元需要连同 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 一起变换，不能只替换函数的一部分。","分部积分第二项前的负号不能漏。"],"citations":[{"source":"s4","locator":"PDF第4—6页"}],"figure":null},{"id":"t12","module":"m05","title":"定积分性质与微积分基本定理","prerequisites":"会求原函数；理解带方向的积分区间；知道连续函数在闭区间有界。","intuition":"定积分累积带符号的微小贡献。原函数把这种累积转化为两个端点函数值的差。","sections":[{"title":"定积分与面积的区别","body":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 是带符号的累积；横轴上方贡献为正，下方为负。图形面积则应对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 积分，或在交点处分段取正。区间反向有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>b<\/mi><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>，同端点积分为零，区间可加。"},{"title":"牛顿—莱布尼茨公式","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 连续且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>F<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mi>f<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。先求原函数，再代上限减下限。原函数中的常数会相消，因此定积分结果不写 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>。连续是常用的充分条件，不是所有可积函数都必须连续。"},{"title":"对称性与比较","body":"在对称区间 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 上，可积奇函数积分为零；可积偶函数积分是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>。判断奇偶性要看整个被积函数。若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>，积分非负；这能检查答案符号。积分中的哑变量名称不改变结果。"}],"examples":[{"title":"用对称性减少计算","prompt":"求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>1<\/mn><\/mrow><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math> 为奇函数，在对称区间上的积分为零。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 为偶函数，其积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","代原函数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>3<\/mn><\/mrow><\/math>，得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"积分为零但面积不为零","prompt":"比较 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>1<\/mn><\/mrow><\/msubsup><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 与曲线 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>、横轴在该区间围成的面积。","steps":["奇函数积分为零，左右两部分带符号贡献抵消。","面积应为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","两个三角形面积各为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math>，总面积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。"],"answer":"定积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>，面积为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["上限减下限，不是大数减小数；区间方向决定符号。","奇偶性简化要求区间关于零对称。"],"citations":[{"source":"s5","locator":"PDF第1—5页"}],"figure":null},{"id":"t13","module":"m05","title":"变限积分的复合求导","prerequisites":"掌握链式法则；把被积变量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 和外部自变量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 分开。","intuition":"变上限积分先看作“累计到某一点的函数”，再把累计位置看作另一个函数。上限变化多快，要再乘一次上限的导数。","sections":[{"title":"从固定上限到变化上限","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 在包含积分区间的区间内连续，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>u<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>G<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。再要求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 在考察点可导，且积分上限落在该连续区间内，即有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>d<\/mi><\/mrow><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mstyle><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。求导时把被积函数中的每个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 换成整个 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，再乘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>。"},{"title":"上下限都变时","body":"在 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 连续且上下限函数均可导、积分区间适用的条件下，利用区间可加性，把 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math> 写成两个同起点积分之差，得到导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>g<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>h<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。下限项带负号。若被积函数本身显式含外部变量 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，还会涉及额外项，不能直接照搬这里的公式。"},{"title":"不要先强求原函数","body":"像 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math> 的原函数不能用有限初等函数表示，但变限积分的导数仍可直接求。题目问 <math xmlns=\"http://ww #x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x0222B;<\/mo><mi>&#x003BC;<\/mi><mi>Q<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。初始点须位于该区间内；这一推导解释了积分因子指数的正负号。"},{"title":"已知一个特解时的捷径","body":"若已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> 满足原方程，则令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mi>p<\/mi><\/msub><mo>&#x0002B;<\/mo><mi>v<\/mi><\/mrow><\/math>，代入后得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>v<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>P<\/mi><mi>v<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，故 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mo>&#x0222B;<\/mo><mi>P<\/mi><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。所以通解等于已知特解加齐次通解。这与积分因子法等价，能少算一次积分。"},{"title":"初值与复核","body":"求通解后再代入初值确定常数。复核需做两项：函数满足原微分方程；在指定初始点取给定值。只满足初值的函数不一定解方程，只满足方程也可能不满足初值。"}],"examples":[{"title":"真题15：从特解确定右端","prompt":"已知 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><\/math> 是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的特解，求满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 的解。","steps":["代入已知特解：<math xmlns=\"http:// mi><\/msup><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的特解，求满足 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 的解。","steps":["由代入得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>v<\/mi><\/mrow><\/math>，有 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>v<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>v<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，完成初值求解。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["方程若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math> 前系数不是1，应先除以该系数并注明不为零的区间。","已知特解只是一个函数，不能把它直接当作满足任意初值的解。"],"citations":[{"source":"s6","locator":"PDF第2页及相关例题"},{"source":"answers","locator":"第15题，PDF第8页"}],"figure":null},{"id":"t17","module":"m06","title":"二阶常系数齐次线性方程","prerequisites":"会解二次方程；知道复根成共轭对，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>i<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>。","intuition":"指数函数求导后形状不变，因此把微分方程转化为关于指数率的代数方程；重根和复根决定通解的不同形式。","sections":[{"title":"特征方程","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mrow><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 试 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。因指数非零，特征方程为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>r<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。该方法针对这里的常系数齐次线性形式，不能不加说明地套到变系数方程。"},{"title":"三种根与通解","body":"两个不同实根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><msup><mi>e<\/mi><mrow><msub><mi>r<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。二重实根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。共轭根 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x000B1;<\/mi><mi>i<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B2;<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mi>&#x003B1;<\/mi><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mi>cos<\/mi><mi>&#x003B2;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><mi>sin<\/mi><mi>&#x003B2;<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。重根必须补上 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 才有两个独立解。"},{"title":"选择题也可直接代入","body":"题目只问某函数是否为解时，求两次导数并代回往往最快。看见三角 mn><\/msup><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002F;<\/mo><mo>&#x02202;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。指数外层仍需要链式法则，不能把指数原样当常数。"},{"title":"区分独立变量与复合路径","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，且 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，在相应可微条件下 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0002F;<\/mo><mi>d<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。偏导数计算时固定另一坐标；沿路径求普通导数时，两坐标可能都随 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 变，两个问题不同。"},{"title":"检查遗漏的通道","body":"先画或写依赖关系：外层函数依赖哪些中间变量，每个中间变量又依赖谁。每条路径乘导数，最后相加。多元函数在一点存在两个偏导数，并不足以保证该点可微；后面使用全微分时要确认可微条件。"}],"examples":[{"title":"真题17的偏导步骤","prompt":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math> 求两个一阶偏导数。","steps":["对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求偏导时固定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><mo>&#x000B7;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>。","对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 求偏导时固定 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>：<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><mo>&#x000B7;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","两个偏导的指数保持 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/math>，外面分别乘对应内层导数。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"沿路径的导数","prompt":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mi>y<\/mi><\/mrow><\/math>，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，求 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0002F;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>。","steps":["偏导为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，路径导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math>。","链式法则得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0002F;<\/mo><mi>d<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math>，代入路径为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>。","直接代入得到 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>t<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math>，求导也是 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，可作交叉验证。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0002F;<\/mo><mi>d<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><msup><mi>t<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 求偏导时，独立的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 为常数；沿 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的路径则不能视作常数。","偏导数符号 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02202;<\/mo><\/mrow><\/math> 与普通导数 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> 的使用对象不同。"],"citations":[{"source":"exam","locator":"第17题，PDF第2页"},{"source":"answers","locator":"PDF第9页；复合路径为配套拓展"}],"figure":null},{"id":"t21","module":"m08","title":"全微分与局部线性近似","prerequisites":"会计算两个一阶偏导数；理解一元微分是增量的一阶主部。","intuition":"全微分把两个独立方向的一阶变化相加。它给出局部平面的近似，需要比“偏导数存在”更强的可微条件。","sections":[{"title":"公式和条件","body":"若 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 在一点可微，则 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。若偏导数在该点某邻域内存在且在该点连续，这是保证可微的常用充分条件。由多项式、指数等光滑函数在其定义域内复合得到的本卷函数可直接满足这种条件。"},{"title":"写出全微分的三步","body":"先分别计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>x<\/mi><\/msub><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math>，再各乘相应的 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，最后相加。题目问 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>z<\/mi><\/mrow><\/math> 不能只写两个偏导，也不能把它写成两个偏导数相乘。若要求在指定点的微分，应把偏导系数代入该点，保留 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。"},{"title":"近似与边界","body":"可微时 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mi>z<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mi>&#x00394;<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mi>&#x00394;<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msqrt><mrow><mi>&#x00394;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>&#x00394;<\/mi><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。仅有偏导存在不保证可微：令 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>y<\/mi><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>（非原点）、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi >d<\/mi><mi>y<\/mi><\/mrow><\/math>；先描述同一个点集，再按水平切片写新的界限。区域复杂时可能需分段。遇到圆域与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，直角坐标会出现根号边界，后面的极坐标通常更简单。"}],"examples":[{"title":"矩形区域的累次积分","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><mo>&#x000D7;<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。","steps":["写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>2<\/mn><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>y<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","内层积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>2<\/mn><msubsup><mo stretchy=\"false\">]<\/mo><mn>0<\/mn><mn>2<\/mn><\/msubsup><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math>。","外层积分 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><msubsup><mo stretchy=\"false\">]<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"三角形区域与换序","prompt":"计算 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>A<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>y<\/mi><mo>&#x02264;<\/mo><mi>x<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math>，并写出换序形式。","steps":["按竖直切片，积分为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>x<\/mi><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>y<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002F;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","计算得 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math>。","同一区域可写为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>y<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x02264;<\/mo><mi>x<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math>，故换序为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mi>y<\/mi><mn>1<\/mn><\/msubsup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，结果同样为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math>。"],"answer":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math>；换序后上下限随区域一起改变。","pitfall":"","level":"拔高与边界变式"}],"boundaries":["内层积分变量与内层界限要对应。","质量题密度应非负；若给定式可能为负，需检查题设物理含义。"],"citations":[{"source":"exam","locator":"第18题，PDF第2页"},{"source":"answers","locator":"PDF第10页；直角坐标基础为配套拓展"}],"figure":null},{"id":"t23","module":"m09","title":"极坐标、面积元与薄片质量","prerequisites":"知道 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>h<\/mi><mi>e<\/mi><mi>t<\/mi><mi>a<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>h<\/mi><mi>e<\/mi><mi>t<\/mi><mi>a<\/mi><\/mrow><\/math>；会积分幂函数；半径取非负。","intuition":"离原点越远，同一个角度增量对应的弧越长，所以极坐标小块面积中必须出现半径因子。","sections":[{"title":"变量变换和面积元","body":"极坐标中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，因此 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。面积元为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，不是单纯 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。直观上小扇形的两边长度近似为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>r<\/mi><\/mrow><\/math> 与 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>；雅可比行列式的绝对值也为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>。"},{"title":"区域决定积分界限","body":"以原点为圆心、半径 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 的圆盘可取 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>、<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>；同心圆环改为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>b<\/mi><\/mrow><\/math>，其中 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/math>；扇形还要限制角度。不要把所有圆形区域都积分一整周。若密度只依赖 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>，角积分能直接提出扇形角度。"},{"title":"质量模型","body":"质量为 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><msub><mo>&#x0222C;<\/mo><mi>D< ><\/mrow><\/math> 发散，<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>2<\/mn><\/mrow><\/math> 也发散。"},{"title":"振荡项的检查与资料修正","body":"对 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mi>n<\/mi><mo>&#x0002F;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，偶数项趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，奇数项趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，所以原通项极限不存在，更不趋零。它的绝对值才趋于 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。所附解析把去掉符号后的幅值极限称作通项极限，结论虽为发散，理由应按这里修正。"}],"examples":[{"title":"真题6：识别收敛选项","prompt":"判断 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mo stretchy=\"false\">[<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 的敛散性，并求和。","steps":["两项分别为公比 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>3<\/mn><\/mrow><\/math> 和 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002F;<\/mo><mn>4<\/mn><\/mrow><\/math> 的等比级数，公比绝对
