lns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>。","代入 <math aria-label=\"(x,y)=(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，得 <math aria-label=\"C_1=5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>。初值附近应选正平方根分支。","显式分支只在合适区间讨论。按原式的分母限制，可取包含 <math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 的区间 <math aria-label=\"(0,\\sqrt5)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><msqrt><mn>5<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"answer":"D，<math aria-label=\"x^2+y^2=5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>；初值附近为 <math aria-label=\"y=\\sqrt{5-x^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mn>5<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>。","pitfall":"交叉相乘可能扩大形式上的解集，不能遗忘原式分母条件。","level":"真题拆解"},{"title":"乘积型分离变量","prompt":"解 <math aria-label=\"y\\prime=2xy\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><\/mrow><\/math>，<math aria-label=\"y(0)=3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。","steps":["对非零分支，<math aria-label=\"\\frac{dy}{y}=2x\\,dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","<math aria-label=\"\\ln|y|=x^2+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，写成 <math aria-label=\"y=Ce^{x^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。","由初值得C=3；另有零解，但不满足该初值。"],"answer":"<math aria-label=\"y=3e^{x^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"被除掉的常值解","prompt":"方程 <math aria-label=\"y\\prime=y(1-y)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 有哪些常值解？非零非一分支怎样求？","steps":["令右侧为0，常值解为 <math aria-label=\"y=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>、<math aria-label=\"y=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","其他分支满足 <math aria-label=\"\\frac{dy}{[y(1-y)]}=dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\">[<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，积分得 <math aria-label=\"\\ln|\\frac{y}{(1-y)}|=x+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","整理得到 <math aria-label=\"y=\\frac{1}{(1+Ce^{-x})}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，在分母不为0的区间成立；y=0仍需单列。"],"answer":"常值解0、1；一般非平衡分支如上。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t05","module":"m05","citations":[{"source":"exam","locator":"PDF第1页，第5题","pages":[1]},{"source":"answers","locator":"PDF第1页；经本配套独立核对","pages":[1]},{"source":"s6","locator":"PDF第1—2页，资料印刷页112—113；可分离变量与初值","pages":[1]}]},{"title":"幂级数：半径、中心与两个端点","prerequisites":"区分数列通项与级数之和；掌握等比级数、调和级数、p级数和交错级数的基本判别。","intuition":"幂级数的收敛通常先形成一个开区间，再由两端点的数项级数补齐边界。半径只能解决内部，不能替代端点检查。","sections":[{"title":"数项级数的必要知识","body":"若 <math aria-label=\"\\sum u_n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>u<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛，必有 <math aria-label=\"u_n\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mi>n<\/mi><\/msub><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，逆命题不成立。<math aria-label=\"\\frac{\\sum1}{n^p}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02211;<\/mo><mn>1<\/mn><\/mrow><mrow><msup><mi>n<\/mi><mi>p<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 当且仅当 <math aria-label=\"p&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 收敛。若 <math aria-label=\"b_n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>b<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 单调递减趋于0，则交错级数 <math aria-label=\"\\sum(-1)^n b_n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><msub><mi>b<\/mi><mi>n<\/mi><\/msub><\/mrow><\/math> 收敛。绝对值级数也收敛称绝对收敛；原级数收敛而绝对值发散称条件收敛。"},{"title":"比值法求半径与中心","body":"对 <math aria-label=\"\\sum c_n(x-x_0)^n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02211;<\/mo><msub><mi>c<\/mi><mi>n<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>，计算绝对值相邻项比值的极限L。L小于1时绝对收敛，大于1时发散，等于1不能判。若 <math aria-label=\"\\lim|\\frac{c_{n+1}}{c_n}|=\\ell\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>lim<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mfrac><mrow><msub><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msub><\/mrow><mrow><msub><mi>c<\/mi><mi>n<\/mi><\/msub><\/mrow><\/mfrac><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mi>&#x02113;<\/mi><\/mrow><\/math> 且 <math aria-label=\"0&lt;\\ell&lt;\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>&#x02113;<\/mi><mo>&#x0003C;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，半径为 <math aria-label=\"R=\\frac{1}{\\ell}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>&#x02113;<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，开区间为 <math aria-label=\"(x_0-R,x_0+R)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x02212;<\/mo><mi>R<\/mi><mo>&#x0002C;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>R<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"},{"title":"端点为什么要代回","body":"同样的半径可能对应两个端点都收敛、只收敛一个或都不收敛。端点代回后应写出真实的数项级数，再用p级数或交错判别；不要只看幂项的正负。本单元按真题补充，不把六章一元微积分材料说成已有级数全章。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["通项趋零只必要不充分。","中心为x0，不一定为0。","收敛半径、收敛开区间、最终收敛域是三个不同结果。"],"examples":[{"title":"2020原题完整拆解","prompt":"求 <math aria-label=\"\\sum_{n=1}^{\\infty}\\frac{x^n}{n}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><msup><mi>x<\/mi><mi>n<\/mi><\/msup><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的收敛域。","steps":["对绝对值项用比值法：比值极限为 <math aria-label=\"|x|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，所以开区间 <math aria-label=\"(-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 内绝对收敛，外部发散。","<math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时为调和级数，发散。","<math aria-label=\"x=-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 时为交错调和级数，按莱布尼茨判别收敛，但不绝对收敛。","收敛域应把左端点加入，写为 <math aria-label=\"[-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。原参考对应讲解错放在第2题下。"],"answer":"C，<math aria-label=\"[-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"比值极限等于1不产生结论；端点必须另判。","level":"真题拆解"},{"title":"先找移位中心","prompt":"求 <math aria-label=\"\\sum_{n=1}^{\\infty}\\frac{(x-2)^n}{n3^n}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><mrow><mi>n<\/mi><msup><mn>3<\/mn><mi>n<\/mi><\/msup><\/mrow><\/mfrac><\/mrow><\/math> 的收敛域。","steps":["比值极限为 <math aria-label=\"\\frac{|x-2|}{3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，开区间 <math aria-label=\"(-1,5)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","x=-1时为交错调和级数，收敛；x=5时为调和级数，发散。"],"answer":"<math aria-label=\"[-1,5)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"端点通项不趋零","prompt":"求 <math aria-label=\"\\sum_{n=1}^{\\infty}n(x+2)^n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math> 的收敛域。","steps":["比值极限为 <math aria-label=\"|x+2|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，半径1，中心-2。","端点x=-3、-1时通项分别为 <math aria-label=\"n(-1)^n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math>、n，均不趋零。"],"answer":"<math aria-label=\"(-3,-1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t06","module":"m06","citations":[{"source":"exam","locator":"PDF第1页，第6题","pages":[1]},{"source":"answers","locator":"PDF第1,2页；经本配套独立核对","pages":[1,2]}]},{"title":"行列式展开：元素、余子式与符号","prerequisites":"会二阶行列式 <math aria-label=\"ad-bc\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>d<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><\/math>；用 <math aria-label=\"M_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math> 表示余子式，<math aria-label=\"A_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math> 表示代数余子式。","intuition":"沿同一行或列展开，就是用这一行或列中的元素给相应的小行列式加权。代数余子式已经把位置造成的正负号算在里面。","sections":[{"title":"余子式与代数余子式","body":"从n阶行列式中删去第i行、第j列，得到的n-1阶行列式为 <math aria-label=\"M_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math>；<math aria-label=\"A_{ij}=(-1)^{i+j}M_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mi>i<\/mi><mo>&#x0002B;<\/mo><mi>j<\/mi><\/mrow><\/msup><msub><mi>M<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math>。符号从左上角正号开始棋盘式交替。字母A在这里表示代数余子式，不要与整张矩阵A混淆。"},{"title":"按一行或一列展开","body":"固定行i，<math aria-label=\"|A|=\\sum_j a_{ij}A_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>j<\/mi><\/msub><msub><mi>a<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math>；固定列j，<math aria-label=\"|A|=\\sum_i a_{ij}A_{ij}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>a<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><\/mrow><\/math>。任选一行或列结果都相同。计算时优先选零多的一行或列，可直接跳过乘零的项。"},{"title":"不同的行交叉相乘为何为零","body":"当 <math aria-label=\"i\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i<\/mi><mo>&#x02260;<\/mo><mi>k<\/mi><\/mrow><\/math> 时，<math aria-label=\"\\sum_j a_{ij}A_{kj}=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x02211;<\/mo><mi>j<\/mi><\/msub><msub><mi>a<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mi>k<\/mi><mi>j<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。可理解为把第k行替换成第i行后，出现两行相同，行列式为0。该性质与同一行展开得到行列式的公式形成对照，也用于伴随矩阵恒等式。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["行列式是数，矩阵是数表。","已给代数余子式时不得再次变号。","展开时元素和代数余子式的下标必须对应。"],"examples":[{"title":"2020原题完整拆解","prompt":"四阶行列式第一列元素依次为 <math aria-label=\"2,0,2,0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><\/mrow><\/math>，对应代数余子式依次为 <math aria-label=\"2,1,3,4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><\/mrow><\/math>，求行列式。","steps":["按第一列展开：<math aria-label=\"D=\\sum_{i=1}^4a_{i1}A_{i1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x02211;<\/mo><mrow><mi>i<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mn>4<\/mn><\/msubsup><msub><mi>a<\/mi><mrow><mi>i<\/mi><mn>1<\/mn><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mi>i<\/mi><mn>1<\/mn><\/mrow><\/msub><\/mrow><\/math>。","<math aria-label=\"D=2\\cdot2+0\\cdot1+2\\cdot3+0\\cdot4=10\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x000B7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>。","题目已给代数余子式，它已包含正负号；不要再次乘符号因子。"],"answer":"D，<math aria-label=\"10\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math>。","pitfall":"余子式与代数余子式不同；已带符号的代数余子式不再变号。","level":"真题拆解"},{"title":"只需做加权求和","prompt":"某行元素为 <math aria-label=\"1,-2,0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><\/mrow><\/math>，其对应代数余子式为 <math aria-label=\"4,3,-5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><\/mrow><\/math>，求行列式。","steps":["按该行展开。","<math aria-label=\"D=1\\cdot4+(-2)\\cdot3+0\\cdot(-5)=-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000B7;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x000B7;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"不同的行交叉组合","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;2\\\\3&amp;4\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求 <math aria-label=\"a_{11}A_{21}+a_{12}A_{22}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mn>21<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>a<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><msub><mi>A<\/mi><mrow><mn>22<\/mn><\/mrow><\/msub><\/mrow><\/math>。","steps":["<math aria-label=\"A_{21}=-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A<\/mi><mrow><mn>21<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，<math aria-label=\"A_{22}=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A<\/mi><mrow><mn>22<\/mn><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","结果为 <math aria-label=\"1(-2)+2(1)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，与异行展开恒等式相符。"],"answer":"<math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t07","module":"m09","citations":[{"source":"exam","locator":"PDF第1页，第7题","pages":[1]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]}]},{"title":"独立事件：交、并、补与互斥","prerequisites":"交集表示同时发生，并集表示至少一个发生；补事件记作 <math aria-label=\"\\bar A\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math>。","intuition":"独立表示知道一件事发生不会改变另一件事的概率。互斥表示两件事不能同时发生，两者在题目中承担完全不同的角色。","sections":[{"title":"独立性的定义","body":"<math aria-label=\"A,B\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><\/mrow><\/math> 独立当且仅当 <math aria-label=\"P(A\\cap B)=P(A)P(B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。当 <math aria-label=\"P(B)&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 时，等价于 <math aria-label=\"P(A\\mid B)=P(A)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。定义本身不要求概率严格为正，条件概率的分母则必须非零。"},{"title":"常用计算链","body":"总有 <math aria-label=\"P(A\\cup B)=P(A)+P(B)-P(A\\cap B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。独立时把交集换为乘积。独立还保证A与补B、补A与B、两个补事件彼此独立，因此 <math aria-label=\"P(\\bar A\\cap\\bar B)=[1-P(A)][1-P(B)]\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>A<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo>&#x02229;<\/mo><mover><mi>B<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。"},{"title":"独立与互斥的边界","body":"互斥要求交集为空，故交集概率为0；若两个事件概率都正，独立要求交集概率为正，二者不能同时成立。零概率事件存在特殊边界，不能说独立与互斥在所有情况下绝对对立。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["并集用加法公式，独立用乘法公式。","出现补事件时先翻译为集合关系。","独立性必须有题设或推导支持，不能由生活直觉任意添加。"],"examples":[{"title":"2020原题完整拆解","prompt":"随机事件 <math aria-label=\"A,B\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><\/mrow><\/math> 相互独立，何式成立？选项中 B 为 <math aria-label=\"P(AB)=P(A)P(B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["相互独立的定义是 <math aria-label=\"P(A\\cap B)=P(A)P(B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，不要求事件互斥。","并集一般应为 <math aria-label=\"P(A\\cup B)=P(A)+P(B)-P(A)P(B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，不能省去交集。","例如两个独立公平投币事件的交集概率为 <math aria-label=\"\\frac{1}{4}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，并非 <math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。因此独立不意味着“不能同时发生”。"],"answer":"B，<math aria-label=\"P(A\\cap B)=P(A)P(B)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"两个正概率事件若互斥就不可能独立。","level":"真题拆解"},{"title":"至少一件发生","prompt":"A、B独立，概率分别为0.2、0.7，求至少一个发生的概率。","steps":["交集概率为 <math aria-label=\"0.2\\cdot0.7=0.14\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.2<\/mn><mo>&#x000B7;<\/mo><mn>0.7<\/mn><mo>&#x0003D;<\/mo><mn>0.14<\/mn><\/mrow><\/math>。","并集概率为 <math aria-label=\"0.2+0.7-0.14=0.76\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.2<\/mn><mo>&#x0002B;<\/mo><mn>0.7<\/mn><mo>&#x02212;<\/mo><mn>0.14<\/mn><mo>&#x0003D;<\/mo><mn>0.76<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"0.76\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.76<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"正概率的互斥事件","prompt":"A、B互斥且概率为0.2、0.3，是否独立？","steps":["交集概率为0。","两概率的乘积为0.06，与交集概率不同，故不独立。"],"answer":"不独立。","pitfall":"","level":"迁移例题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"交并关系示意；面积不编码概率，也不单独证明事件独立\"><title>交并关系示意；面积不编码概率，也不单独证明事件独立<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7fa\"/><circle cx=\"240\" cy=\"140\" r=\"90\" fill=\"#c3dce8\" fill-opacity=\".7\" stroke=\"#246687\" stroke-width=\"2\"/><circle cx=\"370\" cy=\"140\" r=\"90\" fill=\"#e9c8af\" fill-opacity=\".7\" stroke=\"#ad6140\" stroke-width=\"2\"/><text x=\"190\" y=\"140\">A<\/text><text x=\"395\" y=\"140\">B<\/text><text x=\"286\" y=\"145\">A∩B<\/text><text x=\"80\" y=\"265\">并集先相加，再减去被重复计算的交集<\/text><text x=\"80\" y=\"292\">集合示意：图中面积不代表具体概率或独立性<\/text><\/svg>","id":"t08","module":"m10","citations":[{"source":"exam","locator":"PDF第2页，第8题","pages":[2]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]}]},{"title":"无穷远极限：先分清有界量与未定式","prerequisites":"知道 <math aria-label=\"\\arctan x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>arctan<\/mi><mi>x<\/mi><\/mrow><\/math> 的值域为 <math aria-label=\"(\\frac{-\\pi}{2},\\frac{\\pi}{2})\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002C;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；会把无穷远换成零点趋近。","intuition":"看见分母趋于无穷，不必马上求导。先判断分子有界、趋于常数还是也发散，常常能直接决定方法。","sections":[{"title":"有界函数乘无穷小","body":"若 <math aria-label=\"|g(x)|\\le M\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><\/mrow><\/math> 且 <math aria-label=\"h(x)\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math aria-label=\"g(x)h(x)\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>。依据是 <math aria-label=\"|gh|\\le M|h|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>g<\/mi><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02264;<\/mo><mi>M<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，由夹逼准则得到结论。g自身可以振荡而无极限，只要在相关范围有界即可。"},{"title":"换元把无穷远变为零点","body":"令 <math aria-label=\"t=\\frac{1}{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。当 <math aria-label=\"x\\to+\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时，<math aria-label=\"t\\to0^+\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/math>，例如 <math aria-label=\"x\\arctan(\\frac{1}{x})=\\frac{\\arctan t}{t}\\to1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>arctan<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mi>arctan<\/mi><mi>t<\/mi><\/mrow><mrow><mi>t<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。熟悉的零点基本极限可转用于无穷远。"},{"title":"洛必达的使用入口","body":"只有确认商为 <math aria-label=\"\\frac{0}{0}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 或 <math aria-label=\"\\frac{\\infty}{\\infty}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x0221E;<\/mo><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，并在相应去心区间满足可导等条件时，才考虑洛必达法则。常数除以无穷大不属未定式。有界量乘无穷大的结果不能一概而论，可能发散、收敛或振荡。"}],"boundaries":["先识别结构，再决定求导。","换元要同步改趋近方向。","对数的慢增长不能只靠口号，必要时用洛必达证明。"],"examples":[{"title":"2020原题完整拆解","prompt":"求 <math aria-label=\"\\lim_{x\\to+\\infty}\\frac{\\arctan x}{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mfrac><mrow><mi>arctan<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["<math aria-label=\"0&lt;\\arctan x&lt;\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>arctan<\/mi><mi>x<\/mi><mo>&#x0003C;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>（<math aria-label=\"x&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>），所以 <math aria-label=\"0&lt;\\frac{\\arctan x}{x}&lt;\\frac{\\pi}{(2x)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mfrac><mrow><mi>arctan<\/mi><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003C;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","右端趋于 <math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>，由夹逼准则原极限为 <math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。也可用“有界函数乘无穷小”判断。","分子趋于 <math aria-label=\"\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，分母趋于正无穷；这不是 <math aria-label=\"\\frac{\\infty}{\\infty}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x0221E;<\/mo><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，不必也不应直接套洛必达法则。"],"answer":"<math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","pitfall":"无穷远处有界，不代表无穷远处的每种乘积都趋于零。","level":"真题拆解"},{"title":"对数与一次函数的比较","prompt":"求 <math aria-label=\"\\lim_{x\\to+\\infty}\\frac{\\ln(1+x)}{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mfrac><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["是 <math aria-label=\"\\frac{\\infty}{\\infty}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x0221E;<\/mo><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/mfrac><\/mrow><\/math> 型，满足洛必达条件。","导数之比为 <math aria-label=\"\\frac{1}{(1+x)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，极限为0。"],"answer":"<math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"不能把有界乘无穷大直接判为零","prompt":"求 <math aria-label=\"\\lim_{x\\to+\\infty}x\\sin(\\frac{1}{x})\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/msub><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["令 <math aria-label=\"t=\\frac{1}{x}\\to0^+\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><msup><mn>0<\/mn><mo>&#x0002B;<\/mo><\/msup><\/mrow><\/math>。","原式为 <math aria-label=\"\\frac{\\sin t}{t}\\to1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mi>t<\/mi><\/mrow><mrow><mi>t<\/mi><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t09","module":"m01","citations":[{"source":"exam","locator":"PDF第2页，第9题","pages":[2]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]},{"source":"s1","locator":"PDF第8—12页，资料印刷页8—12；极限性质与无穷小","pages":[8]},{"source":"s3","locator":"PDF第2—4页，资料印刷页53—55；洛必达法则","pages":[2]}]},{"title":"不定积分与导数：原函数、常数和内部变量","prerequisites":"明确积分变量与求导变量；把 <math aria-label=\"\\int f(x)dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 理解为一族函数。","intuition":"不定积分的核心是找原函数。验证积分答案的可靠方法，是把结果求导后看能否回到原被积函数。","sections":[{"title":"原函数定义","body":"在区间I上若 <math aria-label=\"F\\prime=f\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><\/mrow><\/math>，则F是f的一个原函数；该区间上全部原函数为 <math aria-label=\"F+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。连续函数在区间上有原函数，原函数不一定能用有限个初等函数写出。"},{"title":"两种运算次序","body":"<math aria-label=\"\\frac d{dx}[\\int f(x)dx]=f(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">[<\/mo><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo stretchy=\"false\">]<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；而 <math aria-label=\"\\int f\\prime(x)dx=f(x)+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。前者对一族原函数求导，常数消失；后者把求导丢失的常数重新补齐。两式不能都写成没有C。"},{"title":"复合结构怎样看","body":"<math aria-label=\"\\int f(3x)dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 是以x为变量的原函数，求导后直接是 <math aria-label=\"f(3x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，不会凭空多出3。若设G是f的原函数，积分结果可写成 <math aria-label=\"\\frac{G(3x)}{3}+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>G<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，求导后链式法则的3恰好与外面1/3抵消。"}],"boundaries":["不定积分答案保留任意常数。","定积分没有随意加C的步骤。","乘积或复合位于积分符号外时，仍须遵守求导法则。"],"examples":[{"title":"2020原题完整拆解","prompt":"求 <math aria-label=\"\\frac d{dx}\\left[\\int f(x)\\,dx\\right]\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><\/mrow><\/math>。","steps":["设 <math aria-label=\"F\\prime(x)=f(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math aria-label=\"\\int f(x)\\,dx=F(x)+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","对 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求导，<math aria-label=\"F\\prime(x)+0=f(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>0<\/mn><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。这里 <math aria-label=\"C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 是相对 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 的常数。","反方向 <math aria-label=\"\\int F\\prime(x)\\,dx=F(x)+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，不能把两个方向的常数处理混为一谈。"],"answer":"<math aria-label=\"f(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>（在原函数存在的区间）。","pitfall":"不定积分是一族原函数；定积分则可能是一个数或上限函数。","level":"真题拆解"},{"title":"原函数难写仍可求导","prompt":"求 <math aria-label=\"\\frac d{dx}[\\int\\sin(x^2)dx]\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"false\">[<\/mo><mo>&#x0222B;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。","steps":["把不定积分记成某个原函数加C。","按定义求导得到原被积函数。"],"answer":"<math aria-label=\"\\sin(x^2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"反向核验积分","prompt":"计算 <math aria-label=\"\\frac{\\int2x}{(1+x^2)}dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x0222B;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math> 并复核。","steps":["令 <math aria-label=\"u=1+x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math aria-label=\"du=2x\\,dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>，积分为 <math aria-label=\"\\ln u+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>u<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","由于u恒正，可写为 <math aria-label=\"\\ln(1+x^2)+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>；求导确得原式。"],"answer":"<math aria-label=\"\\ln(1+x^2)+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t10","module":"m04","citations":[{"source":"exam","locator":"PDF第2页，第10题","pages":[2]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]},{"source":"s4","locator":"PDF第1—2页，资料印刷页77—78；原函数与不定积分","pages":[1]}]},{"title":"二阶矩阵求逆：先判可逆，再写矩阵","prerequisites":"会二阶行列式及矩阵乘法；单位矩阵E的主对角元素为1，其他为0。","intuition":"逆矩阵把一次线性变换还原。它存在的前提是原变换没有把不同方向压缩到一起，因此行列式必须非零。","sections":[{"title":"定义与二阶公式","body":"<math aria-label=\"AA^{-1}=A^{-1}A=E\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mi>E<\/mi><\/mrow><\/math>。若 <math aria-label=\"A=\\begin{pmatrix}a&amp;b\\\\c&amp;d\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>a<\/mi><\/mtd><mtd><mi>b<\/mi><\/mtd><\/mtr><mtr><mtd><mi>c<\/mi><\/mtd><mtd><mi>d<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，则可逆当且仅当 <math aria-label=\"ad-bc\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>d<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><mi>c<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>；此时 <math aria-label=\"A^{-1}=\\frac1{ad-bc}\\begin{pmatrix}d&amp;-b\\\\-c&amp;a\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mfrac><mn>1<\/mn><mrow><mi>a<\/mi><mi>d<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><\/mfrac><mo>&#x00028;<\/mo><mtable><mtr><mtd><mi>d<\/mi><\/mtd><mtd><mo>&#x02212;<\/mo><mi>b<\/mi><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mi>c<\/mi><\/mtd><mtd><mi>a<\/mi><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。"},{"title":"怎样减少符号错误","body":"按“算行列式、交换主对角、另两项变号、整体除以行列式”的顺序操作。最后把原矩阵与候选逆矩阵相乘；四个结果必须组成E。检查一边等于E对同阶方阵已足以保证逆矩阵正确。"},{"title":"含参数时先列排除值","body":"若行列式含参数，先求它不为0的条件，再写逆矩阵。不能对奇异参数值继续使用含零分母的公式。矩阵中某元素为0不妨碍可逆；判断依据是行列式，而非逐个元素是否非零。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["逆矩阵必须是方阵的逆。","整体数乘不能只作用于一个元素。","奇异矩阵仍有伴随矩阵，但没有逆矩阵。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;2\\\\3&amp;5\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>5<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求 <math aria-label=\"A^{-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>。","steps":["<math aria-label=\"|A|=1\\cdot5-2\\cdot3=-1\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x000B7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，所以可逆。","二阶公式给出 <math aria-label=\"A^{-1}=\\frac1{-1}\\begin{pmatrix}5&amp;-2\\\\-3&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mfrac><mn>1<\/mn><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>5<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","化简即为所列矩阵。将其与 <math aria-label=\"A\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 相乘得到单位矩阵，可复核位置和符号。"],"answer":"<math aria-label=\"\\begin{pmatrix}-5&amp;2\\\\3&amp;-1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mo>&#x02212;<\/mo><mn>5<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"矩阵求逆不是逐元素取倒数。","level":"真题拆解"},{"title":"完整写出分母与符号","prompt":"求 <math aria-label=\"\\begin{pmatrix}3&amp;1\\\\2&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 的逆。","steps":["行列式为 <math aria-label=\"3-2=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","按公式得 <math aria-label=\"\\begin{pmatrix}1&amp;-1\\\\-2&amp;3\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，乘回原矩阵得到E。"],"answer":"<math aria-label=\"\\begin{pmatrix}1&amp;-1\\\\-2&amp;3\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"参数先决定是否可逆","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;a\\\\2&amp;2\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mi>a<\/mi><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math> 何时可逆？","steps":["<math aria-label=\"|A|=2-2a\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>a<\/mi><\/mrow><\/math>。","<math aria-label=\"a\\ne1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mn>1<\/mn><\/mrow><\/math> 时可逆，逆为 <math aria-label=\"\\frac1{2-2a}\\begin{pmatrix}2&amp;-a\\\\-2&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1<\/mn><mrow><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mi>a<\/mi><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>；a=1时两行成比例。"],"answer":"<math aria-label=\"a\\ne1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t11","module":"m09","citations":[{"source":"exam","locator":"PDF第2页，第11题","pages":[2]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]}]},{"title":"离散随机变量：分布列与端点筛选","prerequisites":"随机变量把随机结果映射到数值；离散型变量只在所列数值点上分配概率。","intuition":"区间概率不是对连续面积作积分，而是从分布表中挑出落在区间内的取值，再加它们的概率。","sections":[{"title":"分布列的合法性","body":"若 <math aria-label=\"P(X=x_i)=p_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>p<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math>，必须 <math aria-label=\"p_i\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math> 且 <math aria-label=\"\\sum_i p_i=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x02211;<\/mo><mi>i<\/mi><\/msub><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。有未知参数时应先利用总和为1解出它，再检查非负性。漏掉概率总和检查，后续计算即使算术正确也没有合法分布含义。"},{"title":"离散点怎样匹配事件","body":"<math aria-label=\"P(a\\le X&lt;b)=\\sum_{a\\le x_i&lt;b}p_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02264;<\/mo><mi>X<\/mi><mo>&#x0003C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>a<\/mi><mo>&#x02264;<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>&#x0003C;<\/mo><mi>b<\/mi><\/mrow><\/msub><msub><mi>p<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math>。先在取值一行上圈选满足条件的点，再读取下面对应概率；不要看到上下界就把相邻两格机械相加。严格小于与小于等于在离散分布中常有实质区别。"},{"title":"用补事件减少计算","body":"若要求的点很多，可用 <math aria-label=\"P(X\\in S)=1-P(X\\notin S)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02208;<\/mo><mi>S<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02209;<\/mo><mi>S<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。对单一取值，<math aria-label=\"P(X\\ne c)=1-P(X=c)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02260;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x0003D;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。期望 <math aria-label=\"E(X)=\\sum x_i p_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02211;<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><msub><mi>p<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math> 则是加权平均，与“区间内概率相加”任务不同，不能把取值也乘进去。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["先查概率非负且总和为1。","开闭端点要逐字落实到离散点。","计算概率与计算期望的加权项不同。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"X\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 取 <math aria-label=\"-1,0,1,2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><\/mrow><\/math> 的概率依次为 <math aria-label=\"0.1,0.4,0.2,0.3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.1<\/mn><mo>&#x0002C;<\/mo><mn>0.4<\/mn><mo>&#x0002C;<\/mo><mn>0.2<\/mn><mo>&#x0002C;<\/mo><mn>0.3<\/mn><\/mrow><\/math>，求 <math aria-label=\"P\\{-0.5\\le X&lt;2\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x0007B;<\/mo><mo>&#x02212;<\/mo><mn>0.5<\/mn><mo>&#x02264;<\/mo><mi>X<\/mi><mo>&#x0003C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>。","steps":["先检查概率非负且和为1。","区间 <math aria-label=\"[-0.5,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>0.5<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 中的可能取值只有 <math aria-label=\"0,1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><\/mrow><\/math>，不包含 <math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>。","因不同取值事件互斥，概率相加：<math aria-label=\"0.4+0.2=0.6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.4<\/mn><mo>&#x0002B;<\/mo><mn>0.2<\/mn><mo>&#x0003D;<\/mo><mn>0.6<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"0.6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.6<\/mn><\/mrow><\/math>。","pitfall":"离散分布下，端点是否包含可能改变答案。","level":"真题拆解"},{"title":"闭区间内选点","prompt":"X取 <math aria-label=\"-1,0,2,4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><\/mrow><\/math> 的概率为 <math aria-label=\"0.2,0.1,0.3,0.4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.2<\/mn><mo>&#x0002C;<\/mo><mn>0.1<\/mn><mo>&#x0002C;<\/mo><mn>0.3<\/mn><mo>&#x0002C;<\/mo><mn>0.4<\/mn><\/mrow><\/math>，求 <math aria-label=\"P(0\\le X\\le2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x02264;<\/mo><mi>X<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["满足事件的取值为0与2。","相应概率相加为 <math aria-label=\"0.1+0.3=0.4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.1<\/mn><mo>&#x0002B;<\/mo><mn>0.3<\/mn><mo>&#x0003D;<\/mo><mn>0.4<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"0.4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.4<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"先归一化再计算","prompt":"X取 <math aria-label=\"-1,0,1,2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><\/mrow><\/math> 的概率为 <math aria-label=\"c,2c,c,c\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mo>&#x0002C;<\/mo><mn>2<\/mn><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><\/mrow><\/math>，求 <math aria-label=\"P(X\\ne0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["<math aria-label=\"5c=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mi>c<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，故 <math aria-label=\"c=0.2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mo>&#x0003D;<\/mo><mn>0.2<\/mn><\/mrow><\/math>，各概率合法。","<math aria-label=\"P(X\\ne0)=1-2c=0.6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>c<\/mi><mo>&#x0003D;<\/mo><mn>0.6<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"0.6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.6<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t12","module":"m10","citations":[{"source":"exam","locator":"PDF第2页，第12题","pages":[2]},{"source":"answers","locator":"PDF第2页；经本配套独立核对","pages":[2]}]},{"title":"相消型极限：通分、洛必达与高阶项","prerequisites":"熟记常用等价式，会对数及指数求导；高阶展开仅在相应趋近点附近使用。","intuition":"两项各自很大却彼此相减时，真正决定结果的是它们的细小差别。只留下各自的一阶近似，往往正好把这点差别删掉。","sections":[{"title":"先把无穷大之差化为商","body":"遇到 <math aria-label=\"\\infty-\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0221E;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，优先通分、根式有理化或提出主项，转成 <math aria-label=\"\\frac{0}{0}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 或 <math aria-label=\"\\frac{\\infty}{\\infty}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x0221E;<\/mo><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。通分后先检查阶数，再决定是否适用洛必达。每次使用洛必达前都要确认仍是允许的未定式。"},{"title":"洛必达法则的执行","body":"在相关去心区间内分子分母可导、分母导数非零等条件成立，且导数比值的极限存在或为无穷时，可用导数比求原商的极限。它不是分式的求导法则：这里只分别求分子、分母的导数，不使用商法则。"},{"title":"展开是保留信息的方法","body":"当 <math aria-label=\"u\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math aria-label=\"\\ln(1+u)=u-\\frac{u^2}{2}+\\frac{u^3}{3}+o(u^3)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>u<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>u<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math aria-label=\"e^u=1+u+\\frac{u^2}{2}+\\frac{u^3}{6}+o(u^3)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>u<\/mi><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>u<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math aria-label=\"\\sin u=u-\\frac{u^3}{6}+o(u^3)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>u<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><msup><mi>u<\/mi><mn>3<\/mn><\/msup><\/mrow><mrow><mn>6<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>u<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。若首项相消就至少保留下一项；如还除以u，往往需再多保留一阶。可选择洛必达作为不依赖展开记忆的复核方法。"}],"boundaries":["不要把两项发散的极限直接相减。","展开到足以确定最后非零阶数为止。","洛必达是算极限的规则，不是分式求导公式。"],"examples":[{"title":"2020原题完整拆解","prompt":"求 <math aria-label=\"\\lim_{x\\to1}\\left(\\frac{x}{x-1}-\\frac1{\\ln x}\\right)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mo>&#x02212;<\/mo><mfrac><mn>1<\/mn><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>。","steps":["两项各自发散，先通分为 <math aria-label=\"\\frac{x\\ln x-x+1}{(x-1)\\ln x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，得到 <math aria-label=\"\\frac{0}{0}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math> 型。","分子一次求导为 <math aria-label=\"\\ln x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><\/mrow><\/math>；分母一次求导为 <math aria-label=\"\\ln x+\\frac{(x-1)}{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，仍为 <math aria-label=\"\\frac{0}{0}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>0<\/mn><\/mrow><mrow><mn>0<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","再求导后的比值为 <math aria-label=\"\\frac{\\frac{1}{x}}{\\frac{1}{x}+\\frac{1}{x^2}}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/mfrac><\/mrow><\/math>，当 <math aria-label=\"x\\to1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math> 时趋于 <math aria-label=\"\\frac{1}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","复核：令 <math aria-label=\"h=x-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math urce":"s1","locator":"PDF第11—12页；等价无穷小。高阶展开为本配套补充","pages":[11]}]},{"title":"隐函数求导：链式、乘积与二阶导数","prerequisites":"把y视作x的函数；熟悉 <math aria-label=\"[e^y]\\prime=e^y y\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo stretchy=\"false\">]<\/mo><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mi>y<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math> 和 <math aria-label=\"[xy]\\prime=y+xy\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mi>x<\/mi><mi>y<\/mi><mo stretchy=\"false\">]<\/mo><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>x<\/mi><mi>y<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math>。","intuition":"没有把y显式解出来，也能利用方程对它求导。关键是每次对y求导时，都带上它随x变化的速度。","sections":[{"title":"一阶隐函数公式","body":"若 <math aria-label=\"F(x,y)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 在某点附近足够光滑，且该点 <math aria-label=\"F_y\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，则局部可把y视作x的函数，并有 <math aria-label=\"y\\prime=\\frac{-F_x}{F_y}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><msub><mi>F<\/mi><mi>x<\/mi><\/msub><\/mrow><mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>。这里偏导 <math aria-label=\"F_x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>x<\/mi><\/msub><\/mrow><\/math> 把y固定，<math aria-label=\"F_y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><\/mrow><\/math> 把x
