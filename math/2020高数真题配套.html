false\">]<\/mo><\/mrow><mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math>。在指定点算二阶导数时，先算该点的一阶导数通常更省力。"}],"boundaries":["公式的分母条件不可省。","xy求导有两项。","二阶求导时y导数自身也要继续求导。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"e^y+2xy-x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 所确定的隐函数 <math aria-label=\"y=y(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，求 <math aria-label=\"\\frac{dy}{dx}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["对两侧关于 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 求导：<math aria-label=\"e^y y\\prime+2y+2xy\\prime-1=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","含 <math aria-label=\"y\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math> 的项合并：<math aria-label=\"(e^y+2x)y\\prime=1-2y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><\/math>。","在 <math aria-label=\"e^y+2x\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 的局部隐函数范围内，除以该系数得到答案。"],"answer":"<math aria-label=\"\\frac{1-2y}{e^y+2x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><mrow><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>，需 <math aria-label=\"e^y+2x\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>y<\/mi><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>。","pitfall":"漏写链式法则中的y导数，或漏掉乘积项中的2y。","level":"真题拆解"},{"title":"二次曲线指定点求导","prompt":"<math aria-label=\"x^2+xy+y^2=3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>，求 <math aria-label=\"(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 处 <math aria-label=\"y\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math>。","steps":["该点满足原式。求导得 <math aria-label=\"2x+y+(x+2y)y\\prime=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","代入得到 <math aria-label=\"3+3y\\prime=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。"],"answer":"<math aria-label=\"y\\prime=-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"不先解出y的二阶求导","prompt":"<math aria-label=\"xy+\\sin y=x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>sin<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>，求原点处 <math aria-label=\"y\\prime,y\\prime\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math>。","steps":["原点在曲线上，<math aria-label=\"F_y=x+\\cos y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>cos<\/mi><mi>y<\/mi><\/mrow><\/math> 在原点等于1。","由 <math aria-label=\"(x+\\cos y)y\\prime=1-y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>cos<\/mi><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><\/mrow><\/math> 得原点一阶导数为1。","再求导得 <math aria-label=\"(x+\\cos y)y\\prime\\prime+(1-\\sin y\\,y\\prime)y\\prime=-y\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>cos<\/mi><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>y<\/mi><mspace width=\"0.167em\" /><mi>y<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>y<\/mi><mi>&#x02032;<\/mi><\/mrow><\/math>，代入原点得二阶导数-2。"],"answer":"<math aria-label=\"y\\prime(0)=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math aria-label=\"y\\prime\\prime(0)=-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t14","module":"m02","citations":[{"source":"exam","locator":"PDF第2页，第14题","pages":[2]},{"source":"answers","locator":"PDF第3页；经本配套独立核对","pages":[3]},{"source":"s2","locator":"PDF第5—6、14—15页，资料印刷页32—33、41—42；隐函数与高阶导数","pages":[5]}]},{"title":"未知定积分作常数：把函数关系变成代数方程","prerequisites":"会定积分线性性、常数积分和分部积分；先分清固定参数a与变化自变量x。","intuition":"题目看似要求同时求函数和积分，实际上往往只要求一个数。把整段定积分命名为I，再沿相同区间积分，未知函数就被压缩成一个代数未知数。","sections":[{"title":"为什么可以把积分看作常数","body":"对固定上下限a、b，<math aria-label=\"I=\\int_a^b f(t)dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math> 只由函数与端点决定，不随外部x变化。t是积分哑变量，改成u或x不改变数值。相反，<math aria-label=\"\\int_a^x f(t)dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>x<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math> 是随x变化的函数，不能混用。"},{"title":"通用计算框架","body":"若 <math aria-label=\"f(x)=g(x)+h(x)I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>I<\/mi><\/mrow><\/math> 且 <math aria-label=\"I=\\int_a^b f\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>f<\/mi><\/mrow><\/math>，令 <math aria-label=\"G=\\int_a^b g\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>g<\/mi><\/mrow><\/math>、<math aria-label=\"H=\\int_a^b h\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mi>h<\/mi><\/mrow><\/math>，则 <math aria-label=\"I=G+HI\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mi>G<\/mi><mo>&#x0002B;<\/mo><mi>H<\/mi><mi>I<\/mi><\/mrow><\/math>，即 <math aria-label=\"(1-H)I=G\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>H<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>I<\/mi><mo>&#x0003D;<\/mo><mi>G<\/mi><\/mrow><\/math>。当 <math aria-label=\"1-H\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>H<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 时 <math aria-label=\"I=\\frac{G}{(1-H)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>G<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>H<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。常数项积分要乘区间长度，不能直接写成原常数。"},{"title":"临界参数需要单独分类","body":"若 <math aria-label=\"1-H=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>H<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，不能继续相除。此时G非零表示关系不相容，无满足条件的函数；G也为0时，积分关系不再唯一约束I，应回到函数式检查可能的函数族。这种分类是C卷的适度拔高点。"},{"title":"对数积分的复习","body":"<math aria-label=\"\\int\\ln x\\,dx=x\\ln x-x+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222B;<\/mo><mi>ln<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>（<math aria-label=\"x&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>），由分部积分得到。定积分应用端点相减，定积分答案不加任意常数。"}],"boundaries":["必须是固定上下限，才能相对x视作常数。","常数积分要乘长度。","含参数系数为零时，先看方程是否相容。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"f(x)=\\ln x-\\int_1^a f(t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，<math aria-label=\"a&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math>，求 <math aria-label=\"\\int_1^a f(x)\\,dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["令 <math aria-label=\"I=\\int_1^a f(t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mi>a<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，对固定参数 <math aria-label=\"a\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 而言，<math aria-label=\"I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><\/mrow><\/math> 不随 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 变化。于是 <math aria-label=\"f(x)=\\ln x-I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>I<\/mi><\/mrow><\/math>。","两侧从1积到a，得到 <math aria-label=\"I=(a\\ln a-a+1)-(a-1)I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mi>ln<\/mi><mi>a<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>I<\/mi><\/mrow><\/math>。","移项得 <math aria-label=\"aI=a\\ln a-a+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>I<\/mi><mo>&#x0003D;<\/mo><mi>a<\/mi><mi>ln<\/mi><mi>a<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>。由于 <math aria-label=\"a&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math>，可除以 <math aria-label=\"a\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>。","所以 <math aria-label=\"I=\\ln a-1+\\frac{1}{a}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mi>ln<\/mi><mi>a<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。先求未知数I，无须先求一遍完整函数。"],"answer":"<math aria-label=\"\\ln a-1+\\frac{1}{a}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mi>a<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>a<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"不要把积分哑变量t当成额外未知函数，也不要把I当成关于x的上限函数。","level":"真题拆解"},{"title":"常数积分记得乘区间长度","prompt":"<math aria-label=\"f(x)=2x-I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>I<\/mi><\/mrow><\/math>，<math aria-label=\"I=\\int_0^2 f(t)dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>2<\/mn><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，求I。","steps":["两侧从0积到2：<math aria-label=\"I=4-2I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>I<\/mi><\/mrow><\/math>。","<math aria-label=\"3I=4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>I<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，故 <math aria-label=\"I=\\frac{4}{3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math aria-label=\"\\frac{4}{3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"参数等于临界值时不可相除","prompt":"<math aria-label=\"f(x)=x+\\lambda I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>&#x003BB;<\/mi><mi>I<\/mi><\/mrow><\/math>，<math aria-label=\"I=\\int_0^1 f(t)dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>。讨论I。","steps":["<math aria-label=\"I=\\frac{1}{2}+\\lambda I\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>&#x003BB;<\/mi><mi>I<\/mi><\/mrow><\/math>，故 <math aria-label=\"(1-\\lambda)I=\\frac{1}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>&#x003BB;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>I<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","<math aria-label=\"\\lambda\\ne1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BB;<\/mi><mo>&#x02260;<\/mo><mn>1<\/mn><\/mrow><\/math> 时 <math aria-label=\"I=\\frac{1}{[2(1-\\lambda)]}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">[<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>&#x003BB;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","<math aria-label=\"\\lambda=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BB;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时得到 <math aria-label=\"0=\\frac{1}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003D;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，不存在满足关系的函数。"],"answer":"分情况结果如上。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t15","module":"m04","citations":[{"source":"exam","locator":"PDF第3页，第15题","pages":[3]},{"source":"answers","locator":"PDF第3页；经本配套独立核对","pages":[3]},{"source":"s5","locator":"PDF第2—3、5—6页，资料印刷页94—95、97—98；线性性与分部积分","pages":[2]},{"source":"s4","locator":"PDF第5—6页；分部积分","pages":[5]}]},{"title":"二元函数极值：偏导、驻点与Hessian判别","prerequisites":"偏导表示固定另一个变量求导。下文记 <math aria-label=\"A=f_{xx},B=f_{xy},C=f_{yy}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mrow><mi>x<\/mi><mi>x<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mrow><mi>x<\/mi><mi>y<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mi>C<\/mi><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mrow><mi>y<\/mi><mi>y<\/mi><\/mrow><\/msub><\/mrow><\/math>，假设有关二阶偏导连续。","intuition":"驻点只是坡度暂时为零的位置。向各个方向离开它时函数都升高才是极小；如果某方向上升、另一个方向下降，就是鞍点。","sections":[{"title":"必要条件与完整找点","body":"内点处可微函数若取得局部极值，必有 <math aria-label=\"f_x=f_y=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>f<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。先解这两个方程列出全部驻点，再逐一判别。题目若有边界约束，边界需另查；本年真题是在整个平面讨论光滑多项式，不需要额外引入约束优化。"},{"title":"统一记号防止判别式符号相反","body":"本资料统一使用 <math aria-label=\"\\Delta=AC-B^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003D;<\/mo><mi>A<\/mi><mi>C<\/mi><mo>&#x02212;<\/mo><msup><mi>B<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。若 <math aria-label=\"\\Delta&gt;0,A&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>A<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 为极小；<math aria-label=\"\\Delta&gt;0,A&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>A<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 为极大；<math aria-label=\"\\Delta&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 为鞍点；<math aria-label=\"\\Delta=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 时二阶方法无结论。原解析用 <math aria-label=\"B^2-AC\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mi>A<\/mi><mi>C<\/mi><\/mrow><\/math>，其符号恰相反，使用时必须先核对定义。"},{"title":"极值与最值不能混同","body":"极值是局部概念，最值在整个定义域比较。正定二次型的极小可进一步证明为全局最小；一般三次函数即使有局部极小，也可能沿另一条路径无下界。极值点的坐标与代入后的极值数值要同时写清。"},{"title":"判别式为零怎么办","body":"<math aria-label=\"x^4+y^4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 和 <math aria-label=\"x^4-y^4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>4<\/mn><\/msup><\/mrow><\/math> 在原点二阶偏导都为0，前者有极小，后者为鞍点。这说明零判别式不能写成“无极值”，需用定义、配方或选取路径。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["列完所有驻点，不能只找到一个就停止。","统一判别式的符号约定。","局部极小不直接等于全局最小。"],"examples":[{"title":"2020原题完整拆解","prompt":"求 <math aria-label=\"z=x^2-y^3+2xy+y+2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>3<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math> 的极值。","steps":["<math aria-label=\"z_x=2x+2y=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，<math aria-label=\"z_y=-3y^2+2x+1=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>z<\/mi><mi>y<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。由 <math aria-label=\"x=-y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>y<\/mi><\/mrow><\/math> 得 <math aria-label=\"3y^2+2y-1=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","解得驻点 <math aria-label=\"(1,-1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 和 <math aria-label=\"(\\ 2;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 处极小值为 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>；<math aria-label=\"(\\frac{-1}{3},\\frac{1}{3})\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo>&#x0002C;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 为鞍点；无极大值。","pitfall":"极值点是坐标，极值是函数值；局部极小不自动是全局最小。","level":"真题拆解"},{"title":"二次函数可以配方复核","prompt":"求 <math aria-label=\"z=x^2+2y^2-4x+4y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>y<\/mi><\/mrow><\/math> 的极值。","steps":["驻点由 <math aria-label=\"2x-4=0,4y+4=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 得 <math aria-label=\"(2,-1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","<math aria-label=\"A=2,B=0,C=4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>，<math aria-label=\"\\Delta=8&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003D;<\/mo><mn>8<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>，为极小。","配方为 <math aria-label=\"(x-2)^2+2(y+1)^2-6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>6<\/mn><\/mrow><\/math>，故也是全局最小。"],"answer":"在 <math aria-label=\"(2,-1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 处极小值和最小值均为 <math aria-label=\"-6\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>6<\/mn><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"驻点却不是极值","prompt":"判断 <math aria-label=\"z=x^2-y^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 在原点的性质。","steps":["原点是驻点；<math aria-label=\"A=2,B=0,C=-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>C<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>，<math aria-label=\"\\Delta=-4&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>。","沿y=0函数非负，沿x=0函数非正，附近同时出现更大与更小值。"],"answer":"鞍点。","pitfall":"","level":"迁移例题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"极小与鞍点的局部方向关系，等高线和示意截线不表示原题精确三维曲面\"><title>极小与鞍点的局部方向关系，等高线和示意截线不表示原题精确三维曲面<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7fa\"/><text x=\"55\" y=\"35\">二阶判别的局部含义（示意）<\/text><ellipse cx=\"175\" cy=\"150\" rx=\"100\" ry=\"70\" fill=\"none\" stroke=\"#98b8cc\"/><ellipse cx=\"175\" cy=\"150\" rx=\"70\" ry=\"48\" fill=\"none\" stroke=\"#739bb4\"/><ellipse cx=\"175\" cy=\"150\" rx=\"40\" ry=\"27\" fill=\"none\" stroke=\"#246687\" stroke-width=\"2\"/><circle cx=\"175\" cy=\"150\" r=\"5\" fill=\"#246687\"/><text x=\"110\" y=\"252\">极小：离开后升高<\/text><path d=\"M340 155H565 M450 60V240\" stroke=\"#8196a4\"/><path d=\"M355 80Q450 235 545 80 M355 230Q450 75 545 230\" fill=\"none\" stroke=\"#ad6140\" stroke-width=\"3\"/><circle cx=\"450\" cy=\"155\" r=\"5\" fill=\"#ad6140\"/><text x=\"353\" y=\"277\">鞍点：存在升、降方向<\/text><text x=\"70\" y=\"294\">先求全部驻点，再判别；图形不能替代二阶偏导计算<\/text><\/svg>","id":"t16","module":"m07","citations":[{"source":"exam","locator":"PDF第3页，第16题","pages":[3]},{"source":"answers","locator":"PDF第3页；经本配套独立核对","pages":[3]}]},{"title":"二重积分与偏心圆盘：先画区域，再选坐标","prerequisites":"会一元定积分；二重积分可理解为平面上每个小面积乘高度后相加。r是非负半径，角度用弧度。","intuition":"同样是圆形区域，圆心在不在原点会改变积分限。先配方看圆心，再比较直接用极坐标与平移后用极坐标的代价。","sections":[{"title":"从区域到累次积分","body":"直角坐标下，若区域为 <math aria-label=\"a\\le x\\le b\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02264;<\/mo><mi>x<\/mi><mo>&#x02264;<\/mo><mi>b<\/mi><\/mrow><\/math>、<math aria-label=\"g(x)\\le y\\le h(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02264;<\/mo><mi>y<\/mi><mo>&#x02264;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，则 <math aria-label=\"\\iint_D f\\,dxdy=\\int_a^b\\int_{g(x)}^{h(x)} f(x,y)\\,dy\\,dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mi>f<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。外层变量在积分结束前视为常量；上下界必须与所选切片方向一致。"},{"title":"极坐标面积元","body":"<math aria-label=\"x=r\\cos\\theta,y=r\\sin\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，<math aria-label=\"dxdy=r\\,drd\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。这个r是面积伸缩因子，不能遗漏。原点圆盘 <math aria-label=\"x^2+y^2\\le R^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><msup><mi>R<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 的范围为 <math aria-label=\"0\\le r\\le R\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mi>R<\/mi><\/mrow><\/math>、全角度；偏心圆盘 <math aria-label=\"x^2+y^2\\le2ax\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>x<\/mi><\/mrow><\/math>（a&gt;0）则为 <math aria-label=\"\\frac{-\\pi}{2}\\le\\theta\\le\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>、<math aria-label=\"0\\le r\\le2a\\cos\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mi>a<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。"},{"title":"平移有时更省力","body":"若圆心为(h,k)，可令 <math aria-label=\"u=x-h,v=y-k\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mi>k<\/mi><\/mrow><\/math>，面积元不变。对中心圆盘，u、v的奇函数项积分为0；再令 <math aria-label=\"u=r\\cos\\theta,v=r\\sin\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。例如 <math aria-label=\"\\iint_D(x^2+y^2)=\\pi R^2(h^2+k^2)+\\pi \\frac{R^4}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>&#x003C0;<\/mi><msup><mi>R<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>h<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>k<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>&#x003C0;<\/mi><mfrac><mrow><msup><mi>R<\/mi><mn>4<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，此式须在完整圆盘上使用。"},{"title":"计算与合理性检查","body":"先检查被积函数非负时结果是否非负，利用区域面积和典型函数量级检查数量级。若圆盘半径扩大一倍，积分 <math aria-label=\"\\iint (x^2+y^2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0222C;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的量级受长度四次方控制；不能只按面积倍数猜答案。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["先配方确认圆心和半径。","极坐标必须同时改区域、被积函数、面积元。","用对称性消去奇函数项时，区域也必须有对应对称性。"],"examples":[{"title":"2020原题完整拆解","prompt":"计算 <math aria-label=\"\\iint_D(x^2+y^2)\\,dx\\,dy\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mi>D<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>，<math aria-label=\"D:x^2+y^2\\le4x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mi>:<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>4<\/mn><mi>x<\/mi><\/mrow><\/math>。","steps":["区域为 <math aria-label=\"(x-2)^2+y^2\\le4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math>，位于右半平面且与原点相切。取 <math aria-label=\"x=r\\cos\\theta,y=r\\sin\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>cos<\/mi><mi>&#x003B8;<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><mi>sin<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>。","不等式化为 <math aria-label=\"0\\le r\\le4\\cos\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mn>4<\/mn><mi>cos<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，角度为 <math aria-label=\"\\frac{-\\pi}{2}\\le\\theta\\le\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","面积元为 <math aria-label=\"r\\,dr\\,d\\theta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/math>，故积分为 <math aria-label=\"\\int_{\\frac{-\\pi}{2}}^{\\frac{\\pi}{2}}\\int_0^{4\\cos\\theta}r^3\\,dr\\,d\\theta=64\\int_{\\frac{-\\pi}{2}}^{\\frac{\\pi}{2}}\\cos^4\\theta\\,d\\theta=24\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><mn>4<\/mn><mi>cos<\/mi><mi>&#x003B8;<\/mi><\/mrow><\/msubsup><msup><mi>r<\/mi><mn>3<\/mn><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mn>64<\/mn><msubsup><mo>&#x0222B;<\/mo><mrow><mfrac><mrow><mo>&#x02212;<\/mo><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/msubsup><msup><mi>cos<\/mi><mn>4<\/mn><\/msup><mi>&#x003B8;<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mn>24<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。","也可平移 <math aria-label=\"u=x-2,v=y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>v<\/mi><mo>&#x0003D;<\/mo><mi>y<\/mi><\/mrow><\/math>。奇函数项 <math aria-label=\"4u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>u<\/mi><\/mrow><\/math> 在中心圆盘上积分为0，剩下半径平方的积分与4倍面积，分别为 <math aria-label=\"8\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math> 和 <math aria-label=\"16\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。"],"answer":"<math aria-label=\"24\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>24<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。","pitfall":"偏心圆盘不能机械写成常数半径，也不能遗漏雅可比因子r。","level":"真题拆解"},{"title":"积分1就是面积","prompt":"计算 <math aria-label=\"\\iint_{x^2+y^2\\le9}1\\,dxdy\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>&#x0222C;<\/mo><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>9<\/mn><\/mrow><\/msub><mn>1<\/mn><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。","steps":["取 <math aria-label=\"0\\le r\\le3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>r<\/mi><mo>&#x02264;<\/mo><mn>3<\/mn><\/mrow><\/math>，<math aria-label=\"0\\le\\theta\\le2\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02264;<\/mo><mi>&#x003B8;<\/mi><mo>&#x02264;<\/mo><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。","<math aria-label=\"\\int_0^{2\\pi}\\int_0^3r\\,drd\\theta=9\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mrow><mn>2<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/msubsup><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mn>3<\/mn><\/msubsup><mi>r<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>r<\/mi><mi>d<\/mi><mi>&#x003B8;<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。"],"answer":"<math aria-label=\"9\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"平移消去奇函数项","prompt":"计算圆盘 <math aria-label=\"(x-2)^2+(y+1)^2\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math> 上 <math aria-label=\"x^2+y^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 的积分。","steps":["令u=x-2、v=y+1，被积函数为 <math aria-label=\"u^2+v^2+4u-2v+5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>v<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>u<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>v<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math>。","中心圆盘上两个一次项积分为0。","半径平方项积分为 <math aria-label=\"\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，常数项为 <math aria-label=\"5\\pi\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mi>&#x003C0;<\/mi><\/mrow><\/math>。"],"answer":"<math aria-label=\"11\\frac{\\pi}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>11<\/mn><mfrac><mrow><mi>&#x003C0;<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"原题圆心为二零半径为二的圆盘，与原点相切；坐标图为等比例示意\"><title>原题圆心为二零半径为二的圆盘，与原点相切；坐标图为等比例示意<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7fa\"/><path d=\"M55 140H570 M210 250V25\" stroke=\"#8196a4\"/><circle cx=\"310\" cy=\"140\" r=\"100\" fill=\"#d4e4ee\" stroke=\"#246687\" stroke-width=\"3\"/><circle cx=\"310\" cy=\"140\" r=\"4\" fill=\"#246687\"/><path d=\"M210 140L390 80\" stroke=\"#ad6140\" stroke-width=\"2\"/><text x=\"185\" y=\"165\">O<\/text><text x=\"305\" y=\"165\">(2,0)<\/text><text x=\"336\" y=\"54\">半径 2<\/text><text x=\"110\" y=\"270\">原题圆盘：(x−2)²+y² ≤ 4<\/text><text x=\"110\" y=\"295\">平移到圆心后，奇函数项在对称圆盘内抵消<\/text><\/svg>","id":"t17","module":"m08","citations":[{"source":"exam","locator":"PDF第3页，第17题","pages":[3]},{"source":"answers","locator":"PDF第3,4页；经本配套独立核对","pages":[3,4]}]},{"title":"切线斜率建模与一阶线性微分方程","prerequisites":"曲线在点上的切线斜率是导数；会指数求导与分部积分。","intuition":"几何文字先变成导数方程；方程标准化后，积分因子把左边拼成一个乘积的导数，后续就变为直接积分。","sections":[{"title":"由斜率到初值问题","body":"若斜率为 <math aria-label=\"g(x,y)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，就写 <math aria-label=\"y\\prime=g(x,y)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；曲线过 <math aria-label=\"(x_0,y_0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&#x0002C;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 写成 <math aria-label=\"y(x_0)=y_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>。此处过原点意味着函数值为0，不意味着导数也为0，导数仍由斜率关系决定。"},{"title":"标准式与积分因子","body":"先整理为 <math aria-label=\"y\\prime+P(x)y=Q(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>Q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。令 <math aria-label=\"\\mu(x)=e^{\\int P(x)dx}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BC;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x0222B;<\/mo><mi>P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，乘上后左边为 <math aria-label=\"(\\mu y)\\prime\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003BC;<\/mi><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><\/mrow><\/math>。故 <math aria-label=\"y=\\mu^{-1}[\\int\\mu Q\\,dx+C]\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>&#x003BC;<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo stretchy=\"false\">[<\/mo><mo>&#x0222B;<\/mo><mi>&#x003BC;<\/mi><mi>Q<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>。把P前的正负号读错，会使整个解法偏离。"},{"title":"参数区间与复核","body":"当P、Q含分母或对数，解应在避开奇点、包含初值点的区间讨论。最后同时检查 <math aria-label=\"y\\prime+Py-Q=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><mi>P<\/mi><mi>y<\/mi><mo>&#x02212;<\/mo><mi>Q<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 与初值；只验证一项不足以确认特解。多项式乘指数的积分常用分部积分。"}],"boundaries":["先标准化再写积分因子。","初值必须在方程有意义的区间内。","积分所得常数只保留一个独立任意常数。"],"examples":[{"title":"2020原题完整拆解","prompt":"曲线过原点，在任意点 <math aria-label=\"(x,y)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的切线斜率为 <math aria-label=\"3x+y\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><\/mrow><\/math>，求曲线方程。","steps":["斜率就是导数，所以 <math aria-label=\"y\\prime-y=3x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math>，初值为 <math aria-label=\"y(0)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","积分因子为 <math aria-label=\"e^{-x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。乘上后有 <math aria-label=\"(e^{-x}y)\\prime=3xe^{-x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","积分得到 <math aria-label=\"e^{-x}y=-3(x+1)e^{-x}+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，即 <math aria-label=\"y=Ce^x-3x-3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>。","由 <math aria-label=\"y(0)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 得 <math aria-label=\"C=3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>。代回初值和原方程两项均吻合。"],"answer":"<math aria-label=\"y=3e^x-3x-3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&#x02212;<\/mo><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>。","pitfall":"移项后P(x)为-1，积分因子不是e的x次方。","level":"真题拆解"},{"title":"常系数非齐次方程","prompt":"解 <math aria-label=\"y\\prime+2y=4x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mi>x<\/mi><\/mrow><\/math>，<math aria-label=\"y(0)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。","steps":["积分因子 <math aria-label=\"e^{2x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>，有 <math aria-label=\"(e^{2x}y)\\prime=4xe^{2x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mi>x<\/mi><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","积分得 <math aria-label=\"y=2x-1+Ce^{-2x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>C<\/mi><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","初值得C=1。"],"answer":"<math aria-label=\"y=2x-1+e^{-2x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>e<\/mi><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"变量系数的积分因子","prompt":"解 <math aria-label=\"y\\prime-\\frac{y}{(x+1)}=x+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x02212;<\/mo><mfrac><mrow><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math aria-label=\"y(0)=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","steps":["在 <math aria-label=\"x&gt;-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 上，积分因子为 <math aria-label=\"\\frac{1}{(x+1)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","<math aria-label=\"[\\frac{y}{(x+1)}]\\prime=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mfrac><mrow><mi>y<\/mi><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo stretchy=\"false\">]<\/mo><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，故 <math aria-label=\"y=(x+1)(x+C)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","代入初值得C=1。"],"answer":"<math aria-label=\"y=(x+1)^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math>，<math aria-label=\"x&gt;-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003E;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t18","module":"m05","citations":[{"source":"exam","locator":"PDF第3页，第18题","pages":[3]},{"source":"answers","locator":"PDF第4页；经本配套独立核对","pages":[4]},{"source":"s6","locator":"PDF第2—3、10页，资料印刷页113—114、121；一阶线性方程","pages":[2]},{"source":"s4","locator":"PDF第5—6页；分部积分","pages":[5]}]},{"title":"伴随矩阵、转置乘积与数乘行列式","prerequisites":"掌握代数余子式、矩阵乘法与转置；<math aria-label=\"A^*\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> 在本资料中专指伴随矩阵，不是共轭转置。","intuition":"伴随矩阵把所有代数余子式收集起来并转置。把它与原矩阵相乘会得到“行列式乘单位矩阵”，这也是检查手算结果的可靠办法。","sections":[{"title":"伴随矩阵的定义与恒等式","body":"<math aria-label=\"A^*=(A_{ji})\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>A<\/mi><mrow><mi>j<\/mi><mi>i<\/mi><\/mrow><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，即代数余子式矩阵的转置，满足 <math aria-label=\"AA^*=A^*A=|A|E\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mi>A<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>E<\/mi><\/mrow><\/math>。若A可逆，可写 <math aria-label=\"A^*=|A|A^{-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><msup><mi>A<\/mi><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>；即使A奇异，伴随矩阵仍按余子式定义存在，不能用不存在的逆矩阵代替。"},{"title":"转置与乘法的尺寸","body":"若B为 <math aria-label=\"m\\times n\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x000D7;<\/mo><mi>n<\/mi><\/mrow><\/math>，则 <math aria-label=\"B^T\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math> 为 <math aria-label=\"n\\times m\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x000D7;<\/mo><mi>m<\/mi><\/mrow><\/math>。矩阵乘积的内侧尺寸必须相等；结果外侧尺寸决定答案的行列数。<math aria-label=\"(AB)^T=B^TA^T\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>T<\/mi><\/msup><mo>&#x0003D;<\/mo><msup><mi>B<\/mi><mi>T<\/mi><\/msup><msup><mi>A<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math>，次序要反过来。原题先求B转置再右乘，不能随意交换A伴随与B转置。"},{"title":"行列式数乘与行数","body":"n阶矩阵每个元素都乘k，等于每一行分别乘k，所以 <math aria-label=\"|kA|=k^n|A|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mi>k<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。只把一行乘k才是整体行列式乘一次k。对三阶矩阵，<math aria-label=\"|-A|=-|A|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02212;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>；对二阶矩阵则等于原行列式。"},{"title":"推荐计算流程","body":"先写清矩阵尺寸，利用零元素算行列式；再按余子式构造伴随并转置，逐行逐列乘B转置。最后用伴随恒等式核验，数乘行列式另算，避免把矩阵值与数值混在一起。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["伴随矩阵最后必须转置。","矩阵乘法通常不可交换。","用A逆求伴随时必须先确认A可逆。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;2&amp;0\\\\3&amp;4&amp;0\\\\-1&amp;2&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，<math aria-label=\"B=\\begin{pmatrix}2&amp;3&amp;-1\\\\-2&amp;4&amp;0\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求（1）<math aria-label=\"A^*B^T\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><msup><mi>B<\/mi><mi>T<\/mi><\/msup><\/mrow><\/math>；（2）<math aria-label=\"|4A|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>4<\/mn><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>。","steps":["<math aria-label=\"|A|=-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。余子式计算后先组成代数余子式矩阵，再转置，得 <math aria-label=\"A^*=\\begin{pmatrix}4&amp;-2&amp;0\\\\-3&amp;1&amp;0\\\\10&amp;-4&amp;-2\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>4<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>10<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>4<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。","<math aria-label=\"B^T=\\begin{pmatrix}2&amp;-2\\\\3&amp;4\\\\-1&amp;0\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>B<\/mi><mi>T<\/mi><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，其尺寸是 <math aria-label=\"3\\times2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x000D7;<\/mo><mn>2<\/mn><\/mrow><\/math>，乘积应为 <math aria-label=\"3\\times2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x000D7;<\/mo><mn>2<\/mn><\/mrow><\/math>。原解析把转置后的右上元素误写成正2。","按原卷负2计算，得到 <math aria-label=\"A^*B^T=\\begin{pmatrix}2&amp;-16\\\\-3&amp;10\\\\10&amp;-36\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><msup><mi>B<\/mi><mi>T<\/mi><\/msup><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>16<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>10<\/mn><\/mtd><\/mtr><mtr><mtd><mn>10<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>36<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>。所附解析的另一乘积对应改变过符号的B，不适用于原卷。","A是三阶矩阵，所以 <math aria-label=\"|4A|=4^3|A|=64(-2)=-128\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>4<\/mn><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><msup><mn>4<\/mn><mn>3<\/mn><\/msup><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>64<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>128<\/mn><\/mrow><\/math>。复核伴随矩阵可用 <math aria-label=\"AA^*=|A|E\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><msup><mi>A<\/mi><mo>&#x0002A;<\/mo><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mi>E<\/mi><\/mrow><\/math>。"],"answer":"（1）<math aria-label=\"\\begin{pmatrix}2&amp;-16\\\\-3&amp;10\\\\10&amp;-36\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>16<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>3<\/mn><\/mtd><mtd><mn>10<\/mn><\/mtd><\/mtr><mtr><mtd><mn>10<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>36<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>；（2）<math aria-label=\"-128\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>128<\/mn><\/mrow><\/math>。","pitfall":"伴随矩阵要转置；整个n阶矩阵数乘k时，行列式乘k的n次方。","level":"真题拆解"},{"title":"二阶例子展示整个链条","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;2\\\\0&amp;3\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，<math aria-label=\"B=\\begin{pmatrix}1&amp;0\\\\1&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，求 <math aria-label=\"A^*B^T\" xmln <\/mn><mn>2<\/mn><\/msup><mo>&#x000B7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>12<\/mn><\/mrow><\/math>。"],"answer":"乘积如上，行列式为12。","pitfall":"","level":"标准例题"},{"title":"奇异矩阵仍然有伴随","prompt":"<math aria-label=\"A=\\begin{pmatrix}1&amp;2\\\\2&amp;4\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，是否有伴随与逆？","steps":["行列式为0，所以无逆矩阵。","伴随仍为 <math aria-label=\"\\begin{pmatrix}4&amp;-2\\\\-2&amp;1\\end{pmatrix}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;<\/mo><mtable><mtr><mtd><mn>4<\/mn><\/mtd><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mo>&#x02212;<\/mo><mn>2<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>&#x00029;<\/mo><\/mrow><\/math>，乘原矩阵得到零矩阵。"],"answer":"有伴随，无逆。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t19","module":"m09","citations":[{"source":"exam","locator":"PDF第4页，第19题","pages":[4]},{"source":"answers","locator":"PDF第4,5页；经本配套独立核对","pages":[4,5]}]},{"title":"含参数线性方程组：有解、唯一与自由变量","prerequisites":"会初等行变换。系数矩阵为A，增广矩阵记作 <math aria-label=\"(A\\mid b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，未知数个数为n。","intuition":"消元不是只把数字化简，还要保留哪些参数会让主元消失。每遇到可能为零的系数，都可能分出唯一解、无解和无穷多解。","sections":[{"title":"三种解的判定","body":"<math aria-label=\"r(A)\\ne r(A\\mid b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02223;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 时无解；两秩相等且等于n时唯一解；两秩相等且小于n时无穷多解，自由变量个数为 <math aria-label=\"n-r(A)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。行列式非零可直接保证唯一解；行列式为零时不能直接判无解。"},{"title":"含参数主元怎样处理","body":"消元时尽量使用不含参数的主元，把参数留到最后的方程，例如 <math aria-label=\"(a-a_0)z=b-b_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><msub><mi>b<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>。先分 <math aria-label=\"a\\ne a_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><msub><mi>a<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math>，才能除以该系数；在 <math aria-label=\"a=a_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><msub><mi>a<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 时，分别检查是否出现 <math aria-label=\"0=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math aria-label=\"0=非零数\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003D;<\/mo><mi>非<\/mi><mi>零<\/mi><mi>数<\/mi><\/mrow><\/math>。"},{"title":"写全部解而不是一组解","body":"有自由变量时可令其为t，再回代所有其他变量，写成“一个特解加齐次解向量乘任意参数”。若有多个自由变量，就使用多个独立参数。应说明参数取全体实数，不能只写取0时的一组解。"},{"title":"多临界值的迁移","body":"若消元后有 <math aria-label=\"ay=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 和 <math aria-label=\"(a^2-1)z=b-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，应按a为0、1、-1及其余值分别检查；不能只盯着某一个分母。C卷使用这种结构，但所有步骤仍来自普通消元与相容性检查。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["除以含参数因子前必须分情况。","零行对应的右端不为零就是矛盾。","无穷多解时把每个自由变量都参数化。"],"examples":[{"title":"2020原题完整拆解","prompt":"讨论方程组 <math aria-label=\"x_1+2x_3=-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>，<math aria-label=\"-x_1+x_2-3x_3=2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x02212;<\/mo><mn>3<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>，<math aria-label=\"2x_1-x_2+ax_3=b\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><mi>a<\/mi><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 的有解条件并求全部解。","steps":["先由第一式得到 <math aria-label=\"x_1=-1-2x_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><msub><mi>x<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>，代入第二式得到 <math aria-label=\"x_2=1+x_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>。","代入第三式：<math aria-label=\"-3+(a-5)x_3=b\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&# ><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","<math aria-label=\"a=5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 时必须 <math aria-label=\"b=-3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>。此时令 <math aria-label=\"x_3=t\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math>，全部解为 <math aria-label=\"(-1,1,0)+t(-2,1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；否则出现矛盾方程，无解。"],"answer":"<math aria-label=\"a\\ne5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mn>5<\/mn><\/mrow><\/math> 时唯一解；<math aria-label=\"a=5,b=-3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 时无穷多解；<math aria-label=\"a=5,b\\ne-3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x02260;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 时无解。","pitfall":"行列式为零不等于无解，还要核对右端常数是否相容。","level":"真题拆解"},{"title":"二元系统的同样逻辑","prompt":"讨论 <math aria-label=\"2x+y=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"4x+ay=b\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 的全部解。","steps":["第二式减第一式2倍，得 <math aria-label=\"(a-2)y=b-2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>。","<math aria-label=\"a\\ne2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mn>2<\/mn><\/mrow><\/math> 时 <math aria-label=\"y=\\frac{(b-2)}{(a-2)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，<math aria-label=\"x=\\frac{(1-y)}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","<math aria-label=\"a=2,b=2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 时令y=t，x=(1-t)/2；<math aria-label=\"a=2,b\\ne2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x02260;<\/mo><mn>2<\/mn><\/mrow><\/math> 时无解。"],"answer":"唯一解、无穷多解、无解三支如上。","pitfall":"","level":"标准例题"},{"title":"两个自由变量","prompt":"求 <math aria-label=\"x+y+z=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>、<math aria-label=\"2x+2y+2z=2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>z<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 的全部解。","steps":["第二式与第一式等价，只剩一个独立方程。","令y=s、z=t，则x=1-s-t，s、t任意。"],"answer":"<math aria-label=\"(x,y,z)=(1-s-t,s,t)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo>&#x0002C;<\/mo><mi>z<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>s<\/mi><mo>&#x02212;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，<math aria-label=\"s,t\\in\\mathbb R\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x02208;<\/mo><mi mathvariant=\"double-struck\">R<\/mi><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t20","module":"m09","citations":[{"source":"exam","locator":"PDF第4页，第20题","pages":[4]},{"source":"answers","locator":"PDF第5页；经本配套独立核对","pages":[5]}]},{"title":"唯一根证明：存在性、至多性与孤立驻点","prerequisites":"会连续性、零点定理、导数符号与中值定理；“恰好一个”需要两部分证明。","intuition":"函数从正值走到负值说明至少穿过零一次；严格单调说明最多穿过一次。把两部分接起来，才得到唯一根。","sections":[{"title":"第一步：先证明存在","body":"把方程移成 <math aria-label=\"F(x)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，明确F的定义域与连续性。若能找有限端点a、b使 <math aria-label=\"F(a)F(b)&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>，零点定理保证 <math aria-label=\"(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 内有根。也可先算无穷远极限，再据此选出有限的异号端点；不应直接把无穷大当成闭区间端点。"},{"title":"第二步：证明至多一个","body":"若F在整个定义域严格单调，则至多一个零点。常用导数恒正或恒负直接推出。也可反证：若有两根，罗尔定理使中间存在导数为0的点，与导数严格同号矛盾。使用罗尔时闭区间连续、开区间可导的条件需成立。"},{"title":"导数有一个零点时怎样补证","body":"<math aria-label=\"F\\prime\\le0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo>&#x02264;<\/mo><mn>0<\/mn><\/mrow><\/math> 只能直接推出非增，不能仅凭这一句推出严格递减。若导数连续且除孤立点外均负，任意非退化区间都包含一个导数负的子区间，故 <math aria-label=\"F(v)-F(u)=\\int_u^vF\\prime(t)dt&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>v<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>u<\/mi><mi>v<\/mi><\/msubsup><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>t<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>。也可在孤立点两侧分别用中值定理再拼接。"},{"title":"避免无效计算","body":"证明唯一性通常不必解出根，也不必给出小数近似。若仅需存在，单调性不是必需；若仅证明最多一个，尚未完成“有且仅有”。对参数问题，应让存在性与单调性都对允许的全部参数成立。"}],"boundaries":["先陈述定义域和连续性。","无穷远极限用于选择有限端点。","非正导数不自动等于严格递减，需排除常值区间。"],"examples":[{"title":"2020原题完整拆解","prompt":"证明 <math aria-label=\"\\ln(1+x^2)=x-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 在实数域有且仅有一个实根。","steps":["设 <math aria-label=\"F(x)=\\ln(1+x^2)-x+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>，它在实数轴连续。<math aria-label=\"x\\to-\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时 <math aria-label=\"F\\to+\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>；<math aria-label=\"x\\to+\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 时 <math aria-label=\"F\\to-\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>&#x02192;<\/mo><mo>&#x02212;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>。故可选有限区间两端异号，由零点定理至少有一根。","<math aria-label=\"F\\prime(x)=\\frac{2x}{(1+x^2)}-1=\\frac{-(x-1)^2}{(1+x^2)}\\le0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><mo str
