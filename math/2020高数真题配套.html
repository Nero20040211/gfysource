\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>、右导数为 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，两点均不可导。","其他开区间上都是多项式，不再产生不可导点。所附解析把本题与第6题的讲解互换，应按题干重新对应。"],"entry":"比较两个表达式，列分段函数，再检查切换点的左右导数。","pitfall":"交点只是候选点；两个分支也可能相切并保持可导。","topic_ids":["t02"],"exam_pages":[1],"answer_pages":[1,2]},{"number":3,"title":"平面与坐标轴","type":"single","points":4,"prompt":"平面 <math aria-label=\"By+Cz+D=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mi>z<\/mi><mo>&#x0002B;<\/mo><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，且 <math aria-label=\"BCD\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，一定平行于哪条坐标轴？","answer":"A，平行于 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴。","steps":["法向量是 <math aria-label=\"\\boldsymbol n=(0,B,C)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；<math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴方向是 <math aria-label=\"\\boldsymbol e_x=(1,0,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">e<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","<math aria-label=\"\\boldsymbol n\\cdot\\boldsymbol e_x=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x000B7;<\/mo><msub><mi mathvariant=\"bold-italic\">e<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，说明该方向与平面平行。","把 <math aria-label=\"y=z=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 代入平面方程会要求 <math aria-label=\"D=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，与已知矛盾，故 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴不在平面内，而与平面平行。","<math aria-label=\"B,C\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 排除了平行另外两轴；法向量也不与 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴方向平行，因此不是垂直于 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴。"],"entry":"读出法向量，再用点积判断方向关系。","pitfall":"缺少某坐标变量，只说明对应方向平行；判断整条轴是否包含于平面还需常数项。","topic_ids":["t03"],"exam_pages":[1],"answer_pages":[1]},{"number":4,"title":"积分上限函数求导","type":"single","points":4,"prompt":"<math aria-label=\"\\Phi(x)=\\int_0^x\\sin(4t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>x<\/mi><\/msubsup><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，求 <math aria-label=\"\\Phi\\prime(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","answer":"C，<math aria-label=\"\\sin(4x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["被积函数连续，由微积分基本定理，<math aria-label=\"\\Phi\\prime(x)=\\sin(4x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","这里直接把积分变量 <math aria-label=\"t\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 换成上限 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，上限的导数是 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>；不是把被积函数再求一次导数。","复核：<math aria-label=\"\\Phi(x)=\\frac{(1-\\cos4x)}{4}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，求导同样得到 <math aria-label=\"\\sin4x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mn>4<\/mn><mi>x<\/mi><\/mrow><\/math>。"],"entry":"先辨认是积分上限函数的导数，还是三角函数本身的导数。","pitfall":"被积函数中的4不自动产生外部因子4。","topic_ids":["t04"],"exam_pages":[1],"answer_pages":[1]},{"number":5,"title":"可分离变量与初值","type":"single","points":4,"prompt":"微分方程 <math aria-label=\"\\frac{dx}{y}=-\\frac{dy}{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 满足 <math aria-label=\"y(2)=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>，求其特解。","answer":"D，<math aria-label=\"x^2+y^2=5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>；初值附近为 <math aria-label=\"y=\\sqrt{5-x^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mn>5<\/mn><mo>&#x02212;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>。","steps":["在原微分形式有意义的 <math aria-label=\"xy\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>y<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 处交叉相乘，得 <math aria-label=\"x\\,dx=-y\\,dy\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>y<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>。","两侧积分：<math aria-label=\"\\frac{x^2}{2}=\\frac{-y^2}{2}+C\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mo>&#x02212;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mi>C<\/mi><\/mrow><\/math>，把常数重新记为 <math aria-label=\"C_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>，即 <math aria-label=\"x^2+y^2=C_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msub><mi>C<\/mi><mn>1<\/mn><\/msub><\/mrow><\/math>。","代入 <math aria-label=\"(x,y)=(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，得 <math aria-label=\"C_1=5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>。初值附近应选正平方根分支。","显式分支只在合适区间讨论。按原式的分母限制，可取包含 <math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 的区间 <math aria-label=\"(0,\\sqrt5)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><msqrt><mn>5<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。"],"entry":"分离变量、积分、代入初值，并核对原式分母与分支。","pitfall":"交叉相乘可能扩大形式上的解集，不能遗忘原式分母条件。","topic_ids":["t05"],"exam_pages":[1],"answer_pages":[1]},{"number":6,"title":"幂级数收敛域","type":"single","points":4,"prompt":"求 <math aria-label=\"\\sum_{n=1}^{\\infty}\\frac{x^n}{n}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x02211;<\/mo><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/msubsup><mfrac><mrow><msup><mi>x<\/mi><mi>n<\/mi><\/msup><\/mrow><mrow><mi>n<\/mi><\/mrow><\/mfrac><\/mrow><\/math> 的收敛域。","answer":"C，<math aria-label=\"[-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["对绝对值项用比值法：比值极限为 <math aria-label=\"|x|\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>，所以开区间 <math aria-label=\"(-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 内绝对收敛，外部发散。","<math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 时为调和级数，发散。","<math aria-label=\"x=-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 时为交错调和级数，按莱布尼茨判别收敛，但不绝对收敛。","收敛域应把左端点加入，写为 <math aria-label=\"[-1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。原参考对应讲解错放在第2题下。"],"entry":"先求半径，再把两个端点代回原级数逐一判断。","pitfall":"比值极限等于1不产生结论；端点必须另判。","topic_ids":["t06"],"exam_pages":[1],"answer_pages":[1,2]},{"number":7,"title":"按行列展开行列式","type":"single","points":4,"prompt":"四阶行列式第一列元素依次为 <math aria-label=\"2,0,2,0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><\/mrow><\/math>，对应代数余子式依次为 <math aria-label=\"2,1,3,4\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><\/mrow><\/math>，求行列       var status = main.querySelector('[data-score-status="' + number + '"]');

        status.closest('.question-result').dataset.feedback=item.score===null?'pending':item.score===q.points?'correct':'incorrect';
        status.textContent = item.score === null ? "待自评" : item.score + " / " + q.points + " 分";
        var reason = status.parentElement.querySelector("span");
        if (reason) reason.textContent = item.reason;
      }
      if (q.type === "single") {
        main.querySelectorAll('input[name="response-' + id + '-' + number + '"]').forEach(function (radio) {
          var label = radio.closest("label"), correct = Number(radio.value) === q.correct;
          label.classList.toggle("correct-option", correct);
          if (correct && !label.querySelector(".correct-label")) {
            var marker = document.createElement("span"); marker.className = "correct-label";
            marker.textContent = "正确"; label.appendChild(marker);
          }
        });
      }
    }
    function revealQuestion(id, number) {
      var attempt = attempts[id]; if (!attempt || attempt.mode !== "practice" || attempt.submitted) return;
      if (!String(attempt.responses[number] == null ? "" : attempt.responses[number]).trim()) {
        var message = main.querySelector('[data-question-message="' + number + '"]');
        if (message) message.textContent = "先写下答案或解题思路，再展开解析。";
        return;
      }
      attempt.revealed[number] = true; save("attempt." + id, attempt);
      var q = papers[id].questions.find(function (item) { return item.number === number; });
      var region = main.querySelector('[data-question-result="' + number + '"]');
      if (region) region.innerHTML = renderQuestionResult(id, q);
      var button = main.querySelector('[data-action="question-reveal"][data-number="' + number + '"]');
      if (button) { button.disabled = true; button.textContent = "解析已展开"; }
      refreshQuestionScore(id, number); updateSummary(id);
    }
    main.addEventListener("input", function (event) {
      var element = event.target, id = element.dataset.paper, number = element.dataset.response;
      if (number != null && attempts[id] && !attempts[id].submitted) {
        if (shouldAutoSubmit(attempts[id], Date.now())) { submit(id, "timeout"); return; }
        if (element.type === "radio" && !element.checked) return;
        attempts[id].responses[number] = element.value; save("attempt." + id, attempts[id]);
        if (element.type === "radio") {
          main.querySelectorAll('input[name="' + element.name + '"]').forEach(function (radio) {
            radio.closest("label").classList.toggle("selected", radio.checked);
          });
        }
        refreshBadge(id, number);
        if (attempts[id].mode === "practice" && attempts[id].revealed[number]) {
          refreshQuestionScore(id, number); updateSummary(id);
        }
      } else if (element.dataset.selfScore != null && attempts[id]) {
        var qnumber = Number(element.dataset.selfScore), attempt = attempts[id];
        if (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[qnumber])) return;
        var q = papers[id].questions.find(function (item) { return item.number === qnumber; });
        var read = readScore(element.value, q.points);
        var message = document.getElementById("score-message-" + id + "-" + qnumber);
        element.setAttribute("aria-invalid", read.ok ? "false" : "true");
        if (message) message.textContent = read.ok ? "留空为待评；零为已评零分。" : read.error;
        if (!read.ok) {
          delete attempt.selfScores[qnumber]; save("attempt." + id, attempt);
          updateSummary(id); refreshQuestionScore(id, qnumber); return;
        }
        if (read.value === null) delete attempt.selfScores[qnumber]; else attempt.selfScores[qnumber] = read.value;
        save("attempt." + id, attempt); updateSummary(id);
        refreshQuestionScore(id, qnumber);
      } else if (element.dataset.practiceResponse) {
        var pid = element.dataset.practiceResponse;
        practiceProgress[pid] = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        practiceProgress[pid].response = element.value; save("practices", practiceProgress);
        var savedPractice = main.querySelector("[data-practice-save]");
        if (savedPractice) savedPractice.textContent = storageAvailable ? "已保存在当前浏览器。" : "仅本次会话保存。";
      }
    });
    main.addEventListener("change", function (event) {
      if (event.target.dataset.sourcePage) {
        global.location.hash = "#source/" + encodeURIComponent(event.target.dataset.sourcePage) + "/" + event.target.value;
        return;
      }
      var filter = event.target.dataset.filter;
      if (filter === "practice-module" || filter === "practice-level") {
        practiceFilter[filter === "practice-module" ? "module" : "level"] = event.target.value; render();
      }
    });
    main.addEventListener("click", function (event) {
      var sourceAnchor = event.target.closest("a.source-link");
      if (sourceAnchor) { sourceReturnRoute = global.location.hash || "#home"; sourceZoom = 100; }
      var button = event.target.closest("button[data-action]"); if (!button) return;
      var action = button.dataset.action, id = button.dataset.paper, number = Number(button.dataset.number);
      if (action === "source-zoom") {
        sourceZoom = Number(button.dataset.zoom);
        var sourceImage = main.querySelector('.source-page-image');
        if (sourceImage) sourceImage.style.width = sourceZoom + '%';
        main.querySelectorAll('[data-action="source-zoom"]').forEach(function (item) { item.setAttribute('aria-pressed', String(Number(item.dataset.zoom) === sourceZoom)); });
      }
      else if (action === "start-practice" || action === "start-exam") start(id, action === "start-exam" ? "exam" : "practice");
      else if (action === "ask-submit" || action === "ask-restart") {
        var panel = document.getElementById(action === "ask-submit" ? "submit-confirmation" : "restart-confirmation");
        panel.hidden = false; panel.scrollIntoView({ block: "center", behavior: "auto" });
      } else if (action === "cancel-submit" || action === "cancel-restart")
        document.getElementById(action === "cancel-submit" ? "submit-confirmation" : "restart-confirmation").hidden = true;
      else if (action === "confirm-submit") submit(id, "manual");
      else if (action === "confirm-restart") {
        var mode = document.getElementById("restart-mode").value;
        start(id, mode); announce(papers[id].title + " 已重新开始，其他卷记录保留。");
      } else if (action === "jump-question") jumpQuestion(id, number);
      else if (action === "question-reveal") revealQuestion(id, number);
      else if (action === "blank-manual" || action === "blank-auto") {
        var attempt = attempts[id];
        if (!attempt || (!attempt.submitted && !(attempt.mode === "practice" && attempt.revealed[number]))) return;
        if (action === "blank-manual") attempt.manualBlanks[number] = true; else delete attempt.manualBlanks[number];
        delete attempt.selfScores[number]; save("attempt." + id, attempt);
        var q = papers[id].questions.find(function (item) { return item.number === number; });
        main.querySelector('[data-question-result="' + number + '"]').innerHTML = renderQuestionResult(id, q); updateSummary(id);
      } else if (action === "practice-reveal") {
        var pid = button.dataset.id, progress = practiceProgress[pid] || { response: "", revealed: false, review: "" };
        if (!progress.response.trim()) { document.getElementById("practice-message").textContent = "先写下答案或解题思路，再展开解析。"; return; }
        progress.revealed = true; practiceProgress[pid] = progress; save("practices", practiceProgress);
        document.getElementById("practice-analysis").innerHTML = practiceAnalysis(practiceMap[pid]);
        button.disabled = true; button.textContent = "解析已展开"; document.getElementById("practice-message").textContent = "";
      } else if (action === "practice-review" || action === "practice-mastered") {
        var practiceId = button.dataset.id;
        if (!practiceProgress[practiceId] || !practiceProgress[practiceId].revealed) return;
        practiceProgress[practiceId].review = action === "practice-review" ? "review" : "mastered";
        save("practices", practiceProgress); refreshNav();
        main.querySelector('[data-practice-status="' + practiceId + '"]').textContent = action === "practice-review" ? "待复习" : "已掌握";
      } else if (action === "copy-path") {
        var input = document.getElementById(button.dataset.target); input.focus(); input.select();
        if (global.navigator.clipboard && global.navigator.clipboard.writeText)
          global.navigator.clipboard.writeText(input.value).then(function () { announce("本地路径已复制。"); },
            function () { announce("路径已选中，可按复制快捷键后粘贴到资源管理器。"); });
        else announce("路径已选中，可按复制快捷键后粘贴到资源管理器。");
      }
    });
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault(); query = searchInput.value;
      global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    searchInput.addEventListener("input", function () {
      query = searchInput.value; global.history.replaceState(null, "", "#search"); route = readRoute(); render();
    });
    document.getElementById("clear-search").addEventListener("click", function () {
      searchInput.value = ""; query = ""; global.history.replaceState(null, "", "#search"); route = readRoute(); render(); searchInput.focus();
    });
    global.addEventListener("hashchange", function () {
      route = readRoute(); render();
      if (route.name === "source" || (!route.target && !(route.name === "index" && route.id))) global.scrollTo({ top: 0, behavior: "auto" });
    });
    global.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    global.MathStudy = Object.assign({}, logic, {
      getState: function () { return JSON.parse(JSON.stringify({ attempts: attempts, practiceProgress: practiceProgress, route: route,
        query: query, storageAvailable: storageAvailable, storagePrefix: prefix })); },
      render: render, submit: submit, start: start, tick: tick,
      navigate: function (hash) { global.location.hash = hash; }
    });
    route = readRoute(); render(); tick();
    if (!storageAvailable) announce("当前环境无法保存到本机；本次仍可作答，刷新后记录可能丢失。");
    if (Object.values(attempts).some(function (a) { return a.autoSubmitted; }))
      announce("已恢复作答记录。已到结束时间的限时考试已自动交卷。");
    global.setInterval(tick, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
