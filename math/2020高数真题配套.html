  <script type="application/json" id="course-data">{"meta":{"title":"重庆专升本高数 · 真题配套学习","date":"2026-10-21","scope":"2020逐题考点＋同考点递进训练","content_hash":"5129758e336b2acbc270b9a2a013b8c8187044397adc510251c878ba2942d3db"},"sources":[{"id":"exam","title":"2020年重庆市专升本高数真题","path":"2020年重庆市专升本高数真题.pdf","pages":4},{"id":"answers","title":"2020年重庆市专升本《高等数学》真题答案解析","path":"2020年重庆市专升本《高等数学》真题答案解析.pdf","pages":6},{"id":"s1","title":"第一章：函数，极限和连续","path":"第一章：函数，极限和连续.pdf","pages":27},{"id":"s2","title":"第二章：导数与微分","path":"第二章：导数与微分.pdf","pages":24},{"id":"s3","title":"第三章：微分中值定理与导数的应用","path":"第三章：微分中值定理与导数的应用.pdf","pages":25},{"id":"s4","title":"第四章：不定积分","path":"第四章：不定积分.pdf","pages":16},{"id":"s5","title":"第五章：定积分","path":"第五章：定积分.pdf","pages":19},{"id":"s6","title":"第六章：微分方程","path":"第六章：微分方程.pdf","pages":14}],"modules":[{"id":"m01","title":"极限与无穷小","topic_ids":["t01","t09","t13"]},{"id":"m02","title":"导数与唯一根证明","topic_ids":["t02","t14","t21"]},{"id":"m03","title":"空间平面","topic_ids":["t03"]},{"id":"m04","title":"微积分的基本联系","topic_ids":["t04","t10","t15"]},{"id":"m05","title":"微分方程","topic_ids":["t05","t18"]},{"id":"m06","title":"幂级数","topic_ids":["t06"]},{"id":"m07","title":"二元函数极值","topic_ids":["t16"]},{"id":"m08","title":"二重积分","topic_ids":["t17"]},{"id":"m09","title":"线性代数","topic_ids":["t07","t11","t19","t20"]},{"id":"m10","title":"概率","topic_ids":["t08","t12"]}],"topics":[{"title":"等价无穷小：比较阶数与保留相消信息","prerequisites":"会识别 <math aria-label=\"x\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>、去心邻域和基本初等函数；本节比较的函数在相关去心邻域内有意义。","intuition":"两项同时趋于零，只说明它们都是无穷小；等价要求它们以相同的主系数、相同阶数趋近零。计算比值能把直观比较变成可验证的结论。","sections":[{"title":"定义与阶数","body":"若 <math aria-label=\"\\alpha,\\beta\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002C;<\/mo><mi>&#x003B2;<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，且 <math aria-label=\"\\beta\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B2;<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，则 <math aria-label=\"\\frac{\\lim\\alpha}{\\beta}=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo>lim<\/mo><mi>&#x003B1;<\/mi><\/mrow><mrow><mi>&#x003B2;<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 记作 <math aria-label=\"\\alpha\\sim\\beta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x0007E;<\/mi><mi>&#x003B2;<\/mi><\/mrow><\/math>。比值为0时，<math aria-label=\"\\alpha\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><\/mrow><\/math> 是比 <math aria-label=\"\\beta\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B2;<\/mi><\/mrow><\/math> 更高阶的无穷小，记作 <math aria-label=\"o(\\beta)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>o<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003B2;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；比值为非零常数时为同阶，但常数不为1就不叫等价。"},{"title":"必须熟记的局部等价式","body":"当 <math aria-label=\"u\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 时，<math aria-label=\"\\sin u\\sim u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>u<\/mi><mi>&#x0007E;<\/mi><mi>u<\/mi><\/mrow><\/math>、<math aria-label=\"\\tan u\\sim u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>tan<\/mi><mi>u<\/mi><mi>&#x0007E;<\/mi><mi>u<\/mi><\/mrow><\/math>、<math aria-label=\"\\ln(1+u)\\sim u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mi>u<\/mi><\/mrow><\/math>、<math aria-label=\"e^u-1\\sim u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mi>u<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x0007E;<\/mi><mi>u<\/mi><\/mrow><\/math>、<math aria-label=\"1-\\cos u\\sim \\frac{u^2}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>u<\/mi><mi>&#x0007E;<\/mi><mfrac><mrow><msup><mi>u<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。若 <math aria-label=\"\\alpha\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><\/mrow><\/math> 是固定实数，则 <math aria-label=\"(1+u)^\\alpha-1\\sim\\alpha u\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>u<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x003B1;<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x0007E;<\/mi><mi>&#x003B1;<\/mi><mi>u<\/mi><\/mrow><\/math>（<math aria-label=\"\\alpha\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，且实数定义域满足要求）。内部变量也必须趋于0。"},{"title":"如何使用与为何不能滥用","body":"乘除结构中的非零因子通常可以作等价替换。若要比较 <math aria-label=\"\\sin(\\sin x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，应把两层分别除以内部变量。加减结构要先看首项是否抵消；例如 <math aria-label=\"\\sin x-x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mi>x<\/mi><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 的两项都等价于x，却不能把它改成0后断言高阶比值为0。第13题专门处理这种信息损失。"}],"boundaries":["先写清趋近点及单侧定义域。","同阶不等于等价；不能漏掉常数系数。","分子内出现首项相消时，用更高阶展开、通分或洛必达。"],"examples":[{"title":"2020原题完整拆解","prompt":"当 <math aria-label=\"x\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 时，与 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 等价的无穷小是：A. <math aria-label=\"x+\\sqrt{x}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><\/mrow><\/math>；B. <math aria-label=\"\\sin(\\sin x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；C. <math aria-label=\"x\\sin x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>；D. <math aria-label=\"1-\\cos x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><\/mrow><\/math>。","steps":["等价不是“都趋于零”，而是比值趋于 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>。先检查每个函数在相应去心邻域的定义域。","<math aria-label=\"\\frac{\\sin(\\sin x)}x=\\frac{\\sin(\\sin x)}{\\sin x}\\frac{\\sin x}x\\to1\\cdot1=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mi>x<\/mi><\/mfrac><mo>&#x0003D;<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/mfrac><mfrac><mrow><mi>sin<\/mi><mi>x<\/mi><\/mrow><mi>x<\/mi><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><mo>&#x000B7;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>。","<math aria-label=\"x\\sin x\\sim x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mi>sin<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，<math aria-label=\"1-\\cos x\\sim \\frac{x^2}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mi>x<\/mi><mi>&#x0007E;<\/mi><mfrac><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，二者与 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 的比值都趋于 <math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>。","A 只在零点右侧有实数意义，且 <math aria-label=\"\\frac{(x+\\sqrt{x})}{x}=1+\\frac{1}{\\sqrt{x}}\\to+\\infty\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>x<\/mi><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mo>&#x0002B;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math>，仍非等价。"],"answer":"B，<math aria-label=\"\\sin(\\sin x)\\sim x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>sin<\/mi><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><mi>x<\/mi><\/mrow><\/math>。","pitfall":"等价替换不能任意进入已经发生首项抵消的加减式。","level":"真题拆解"},{"title":"嵌套前先把常数提清","prompt":"求 <math aria-label=\"\\lim_{x\\to0}\\frac{\\sin(5x)}{(2x)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["<math aria-label=\"5x\\to0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math>，因此 <math aria-label=\"\\frac{\\sin(5x)}{(5x)}\\to1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x02192;<\/mo><mn>1<\/mn><\/mrow><\/math>。","原式等于 <math aria-label=\"(\\frac{5}{2})\\frac{\\sin(5x)}{(5x)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mfrac><mrow><mn>5<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo stretchy=\"false\">&#x00029;<\/mo><mfrac><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>，极限为 <math aria-label=\"\\frac{5}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>5<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"],"answer":"<math aria-label=\"\\frac{5}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>5<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"分母的内部变量也是无穷小","prompt":"求 <math aria-label=\"\\lim_{x\\to0}\\frac{(1-\\cos3x)}{\\ln(1+x^2)}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mo>lim<\/mo><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/msub><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mn>3<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mrow><\/math>。","steps":["<math aria-label=\"1-\\cos3x\\frac{\\sim9x^2}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mn>3<\/mn><mi>x<\/mi><mfrac><mrow><mi>&#x0007E;<\/mi><mn>9<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；<math aria-label=\"\\ln(1+x^2)\\sim x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ln<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x0007E;<\/mi><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","二者作商，得到 <math aria-label=\"\\frac{9}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>；分母在足够小的非零x处不为0。"],"answer":"<math aria-label=\"\\frac{9}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>9<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t01","module":"m01","citations":[{"source":"exam","locator":"PDF第1页，第1题","pages":[1]},{"source":"answers","locator":"PDF第1页；经本配套独立核对","pages":[1]},{"source":"s1","locator":"PDF第10—12页，资料印刷页10—12；无穷小比较","pages":[10]}]},{"title":"最小值与最大值函数：先分段，再看左右导数","prerequisites":"熟悉连续、导数定义和多项式求导；<math aria-label=\"\\min\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>min<\/mo><\/mrow><\/math> 表示两个数中较小者，<math aria-label=\"\\max\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>max<\/mo><\/mrow><\/math> 表示较大者。","intuition":"取小、取大相当于从两条曲线上选一条。只有被选分支发生切换的位置才需要重点检查，但切换不一定形成尖角。","sections":[{"title":"如何把运算符改写为分段函数","body":"对 <math aria-label=\"f=\\min\\{g,h\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mo>min<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mi>g<\/mi><mo>&#x0002C;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>，先解 <math aria-label=\"g=h\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x0003D;<\/mo><mi>h<\/mi><\/mrow><\/math> 找到候选点，再研究 <math aria-label=\"g-h\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><\/mrow><\/math> 的符号；当 <math aria-label=\"g-h\\le0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo>&#x02264;<\/mo><mn>0<\/mn><\/mrow><\/math> 时取g，否则取h。对max恰好相反。若g、h连续，则它们的min和max连续，因为 <math aria-label=\"\\min\\{g,h\\}=\\frac{(g+h-|g-h|)}{2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>min<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mi>g<\/mi><mo>&#x0002C;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>g<\/mi><mo>&#x0002B;<\/mo><mi>h<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>g<\/mi><mo>&#x02212;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>。"},{"title":"可导条件与候选点筛选","body":"在切换点 <math aria-label=\"c\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>，要先确认两侧值连接，再计算 <math aria-label=\"f\\prime_-(c)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><msub><mi>&#x02032;<\/mi><mo>&#x02212;<\/mo><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与 <math aria-label=\"f\\prime_+(c)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><msub><mi>&#x02032;<\/mi><mo>&#x0002B;<\/mo><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。相等且有限才可导。若两分支在c处相交且导数相等，拼接后可能仍可导；若只是接触但不切换，也不能把交点计作不可导点。"},{"title":"完整的检查顺序","body":"先找两个分支自身的定义域与不可导点，再找交点，列符号表、写分段式，最后逐点检查。导函数在拼接点是否连续是更强问题，不应与“该点能否求导”混为一谈。"}],"boundaries":["交点数量与不可导点数量不是同一件事。","先判连续性，再判左右差商。","一个分支若自身含绝对值，也要检查其尖点是否实际被选中。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"f(x)=\\min\\{x,x^2\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>min<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 在实数轴上有几个不可导点？","steps":["先解 <math aria-label=\"x=x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>，得到候选切换点 <math aria-label=\"0,1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><\/mrow><\/math>。由 <math aria-label=\"x^2-x=x(x-1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的符号得：区间外取 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，区间内取 <math aria-label=\"x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","即 <math aria-label=\"x\\le0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02264;<\/mo><mn>0<\/mn><\/mrow><\/math> 或 <math aria-label=\"x\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02265;<\/mo><mn>1<\/mn><\/mrow><\/math> 时 <math aria-label=\"f(x)=x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>；<math aria-label=\"0&lt;x&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>x<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 时 <math aria-label=\"f(x)=x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。两个切换点处都连续。","零点处左导数为 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>、右导数为 <math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>；一点处左导数为 <math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>、右导数为 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>，两点均不可导。","其他开区间上都是多项式，不再产生不可导点。所附解析把本题与第6题的讲解互换，应按题干重新对应。"],"answer":"C，共 <math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 个：<math aria-label=\"x=0,1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><\/mrow><\/math>。","pitfall":"交点只是候选点；两个分支也可能相切并保持可导。","level":"真题拆解"},{"title":"常数上界截断抛物线","prompt":"求 <math aria-label=\"\\min\\{x^2,9\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>min<\/mo><mo stretchy=\"false\">&#x000 \"bold-italic\">n<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>，点法式为 <math aria-label=\"A(x-x_0)+B(y-y_0)+C(z-z_0)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>z<\/mi><mo>&#x02212;<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。展开即可得到一般式。系数可以同时乘同一个非零数，表示同一平面。"},{"title":"方向平行、直线包含、直线平行","body":"非零方向 <math aria-label=\"\\boldsymbol s\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">s<\/mi><\/mrow><\/math> 与平面平行当且仅当 <math aria-label=\"\\boldsymbol n\\cdot\\boldsymbol s=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x000B7;<\/mo><mi mathvariant=\"bold-italic\">s<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>。若直线方向满足这一条件，基点在平面上则整线包含于平面；基点不在平面上则直线与平面平行而不相交。直线垂直平面则要求方向向量与法向量平行。"},{"title":"坐标轴是特殊直线","body":"三轴方向分别为 <math aria-label=\"(1,0,0),(0,1,0),(0,0,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。一般式中x系数为0，说明x轴方向平行平面；再检查原点能否满足方程，就能区分平行与包含。只有法向量两个分量为0时，才可能垂直某坐标轴。本单元按真题补充，六章一元微积分资料没有系统覆盖它。"},{"title":"本节来源与范围","body":"本节依据原卷与所附解析建立题目所需知识链，定义、方法说明与原创变式为本配套整理。六章资料未系统覆盖该专题，不据此声称覆盖全部考试范围。"}],"boundaries":["法向量必须非零。","方向关系与整条直线的位置关系要分开。","平面的常数项不影响法向量，但影响轴是否落在平面内。"],"examples":[{"title":"2020原题完整拆解","prompt":"平面 <math aria-label=\"By+Cz+D=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mi>z<\/mi><mo>&#x0002B;<\/mo><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，且 <math aria-label=\"BCD\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>，一定平行于哪条坐标轴？","steps":["法向量是 <math aria-label=\"\\boldsymbol n=(0,B,C)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>；<math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴方向是 <math aria-label=\"\\boldsymbol e_x=(1,0,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi mathvariant=\"bold-italic\">e<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","<math aria-label=\"\\boldsymbol n\\cdot\\boldsymbol e_x=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"bold-italic\">n<\/mi><mo>&#x000B7;<\/mo><msub><mi mathvariant=\"bold-italic\">e<\/mi><mi>x<\/mi><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，说明该方向与平面平行。","把 <math aria-label=\"y=z=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 代入平面方程会要求 <math aria-label=\"D=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，与已知矛盾，故 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴不在平面内，而与平面平行。","<math aria-label=\"B,C\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 排除了平行另外两轴；法向量也不与 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴方向平行，因此不是垂直于 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴。"],"answer":"A，平行于 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 轴。","pitfall":"缺少某坐标变量，只说明对应方向平行；判断整条轴是否包含于平面还需常数项。","level":"真题拆解"},{"title":"缺失变量的意义","prompt":"判断平面 <math aria-label=\"2x-3y+5=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 与z轴的位置关系。","steps":["法向量 <math aria-label=\"(2,-3,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 与z轴方向点积为0。","z轴上任一点的x、y均为0，代入得到5，故没有交点。"],"answer":"平行于z轴。","pitfall":"","level":"标准例题"},{"title":"常数项改变位置关系","prompt":"平面 <math aria-label=\"2y-z=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>y<\/mi><mo>&#x02212;<\/mo><mi>z<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 与x轴是什么关系？","steps":["法向量与x轴方向点积为0。","x轴所有点均有y、z为0，全部满足方程。"],"answer":"x轴包含于该平面内。","pitfall":"","level":"迁移例题"}],"figure":null,"id":"t03","module":"m03","citations":[{"source":"exam","locator":"PDF第1页，第3题","pages":[1]},{"source":"answers","locator":"PDF第1页；经本配套独立核对","pages":[1]}]},{"title":"积分上限函数：换上限与链式法则","prerequisites":"会复合函数求导；积分字母t是哑变量，不是外部自变量x。","intuition":"积分上限向右移动一小段时，新增面积近似为端点高度乘上限的增量，所以导数取端点值；若上限移动速度不是1，还要再乘这个速度。","sections":[{"title":"微积分基本定理","body":"f在有关区间连续时，<math aria-label=\"F(x)=\\int_a^x f(t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mi>a<\/mi><mi>x<\/mi><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math> 满足 <math aria-label=\"F\\prime(x)=f(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。不需要先求出f的初等原函数；即使原函数难以写出，上限函数也能直接求导。"},{"title":"上下限都是函数","body":"若u、v可导，f在对应范围连续，则 <math aria-label=\"\\frac d{dx}\\int_{v(x)}^{u(x)} f(t)\\,dt=f(u(x))u\\prime(x)-f(v(x))v\\prime(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><msubsup><mo>&#x0222B;<\/mo><mrow><mi>v<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msubsup><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>u<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><mi>u<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>v<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00029;<\/mo><mi>v<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。上限贡献取正，下限贡献取负。应分成“代入端点”“乘端点导数”两个步骤。"},{"title":"被积函数含参数时的区别","body":"本单元公式直接用于被积函数只依赖积分变量t的情形。若题目写成 <math aria-label=\"\\int_0^x x f(t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>x<\/mi><\/msubsup><mi>x<\/mi><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，先把不随t变化的x提出，再用乘积法则；不能把内部出现的全部x都当成上限替换。"}],"boundaries":["检查连续性与链式法则。","下限变化项前有负号。","被积函数的导数与积分上限函数的导数是不同计算。"],"examples":[{"title":"2020原题完整拆解","prompt":"<math aria-label=\"\\Phi(x)=\\int_0^x\\sin(4t)\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msubsup><mo>&#x0222B;<\/mo><mn>0<\/mn><mi>x<\/mi><\/msubsup><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>，求 <math aria-label=\"\\Phi\\prime(x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","steps":["被积函数连续，由微积分基本定理，<math aria-label=\"\\Phi\\prime(x)=\\sin(4x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mi>&#x02032;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","这里直接把积分变量 <math aria-label=\"t\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 换成上限 <math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>，上限的导数是 <math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>；不是把被积函数再求一次导数。","复核：<math aria-label=\"\\Phi(x)=\\frac{(1-\\cos4x)}{4}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003A6;<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>cos<\/mi><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>，求导同样得到 <math aria-label=\"\\sin4x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mn>4<\/mn><mi>x<\/mi><\/mrow><\/math>。"],"answer":"C，<math aria-label=\"\\sin(4x)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","pitfall":"被积函数中的4不自动产生外部因子4。","level":"真题拆解"},{"title":"上限是三次函数","prompt":"求 <math aria-label=\"\\frac d{dx}\\int_1^{x^3}e^t\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><msubsup><mo>&#x0222B;<\/mo><mn>1<\/mn><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/msubsup><msup><mi>e<\/mi><mi>t<\/mi><\/msup><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>。","steps":["上限 <math aria-label=\"u=x^3\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/math>，<math aria-label=\"u\\prime=3x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。","取端点值 <math aria-label=\"e^{x^3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>，再乘 <math aria-label=\"3x^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>。"],"answer":"<math aria-label=\"3x^2e^{x^3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><msup><mi>x<\/mi><mn>3<\/mn><\/msup><\/mrow><\/msup><\/mrow><\/math>。","pitfall":"","level":"标准例题"},{"title":"上下限同时移动","prompt":"求 <math aria-label=\"\\frac d{dx}\\int_x^{x^2}\\sin t\\,dt\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mi>d<\/mi><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><msubsup><mo>&#x0222B;<\/mo><mi>x<\/mi><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msubsup><mi>sin<\/mi><mi>t<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>。","steps":["上限贡献为 <math aria-label=\"2x\\sin(x^2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>。","下限贡献为 <math aria-label=\"-\\sin x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>，二者相加。"],"answer":"<math aria-label=\"2x\\sin(x^2)-\\sin x\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mi>sin<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>sin<\/mi><mi>x<\/mi><\/mrow><\/math>。","pitfall":"","level":"迁移例题"}],"figure":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"积分上限增加时新增面积的窄条示意；不是特定被积函数的精确曲线\"><title>积分上限增加时新增面积的窄条示意；不是特定被积函数的精确曲线<\/title><rect width=\"620\" height=\"300\" rx=\"12\" fill=\"#f3f7fa\"/><path d=\"M55 235H570 M80 250V35\" stroke=\"#8196a4\"/><path d=\"M80 235V155 Q220 35 360 115V235Z\" fill=\"#cfdfeb\"/><path d=\"M80 155Q220 35 360 115Q400 135 440 160\" fill=\"none\" stroke=\"#246687\" stroke-width=\"3\"/><path d=\"M360 235V115L385 126V235Z\" fill=\"#d9ae8c\"/><path d=\"M360 247H385\" stroke=\"#ad6140\" stroke-width=\"3\"/><text x=\"70\" y=\"274\">a<\/text><text x=\"351\" y=\"274\">x<\/text><text x=\"395\" y=\"274\">x+Δx<\/text><text x=\"410\" y=\"87\">高度约为 f(x)<\/text><text x=\"100\" y=\"294\">新增窄条面积约为 f(x)Δx；Δx 趋零即得到导数<\/text><\/svg>","id":"t04","module":"m04","citations":[{"source":"exam","locator":"PDF第1页，第4题","pages":[1]},{"source":"answers","locator":"PDF第1页；经本配套独立核对","pages":[1]},{"source":"s5","locator":"PDF第4—5页，资料印刷页96—97；积分上限函数","pages":[4]}]},{"title":"可分离变量方程：通解、特解与分支","prerequisites":"会基本积分和代入初始条件；导数记作 <math aria-label=\"y\\prime=\\frac{dy}{dx}\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>d<\/mi><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>。","intuition":"把只含y的部分放到一边，只含x的部分放到另一边后，两侧分别积分。初值选出积分曲线，也可能选出同一隐式曲线的某一局部分支。","sections":[{"title":"识别形式","body":"形如 <math aria-label=\"y\\prime=p(x)q(y)\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mi>&#x02032;<\/mi><mo>&#x0003D;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 的方程，在 <math aria-label=\"q(y)\\ne0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math> 处可写成 <math aria-label=\"\\frac{dy}{q(y)}=p(x)dx\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>d<\/mi><mi>y<\/mi><\/mrow><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><mo>&#x0003D;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>。两边积分后得到隐式或显式通解。未知函数、其导数及自变量之间的关系叫微分方程；一阶方程的通解通常含一个任意常数。"},{"title":"除法前先查丢解","body":"若 <math aria-label=\"q(c)=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>，常值函数 <math aria-label=\"y=c\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>c<\/mi><\/mrow><\/math> 可能是原方程的解。除以q后它不会出现在积分步骤里，必须另查。对原式中已含分母的题，还需记录其原始定义域；交叉相乘不能自动恢复原本无意义的位置。"},{"title":"初值与复核","body":"把 <math aria-label=\"y(x_0)=y_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mi>y<\/mi><mn>0<\/mn><\/msub><\/mrow><\/math> 代入积
