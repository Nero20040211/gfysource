与新技术","evidence":"分层练习与模拟卷对应题"}],"roles":[{"id":"teacher","name":"学习指南","function":"先理解，再练习","avatar":"学","tone":"teacher"}],"stages":[{"id":"start","title":"使用与资料","sceneIds":["welcome","source-index","errata"]},{"id":"m1","title":"计算机基础与信息编码","sceneIds":["m1-storage","m1-number","m1-code","m1-logic","m1-practice"]},{"id":"m2","title":"操作系统与 Windows","sceneIds":["m2-process","m2-path","m2-fs","m2-practice"]},{"id":"m3","title":"Word 文档处理","sceneIds":["m3-layout","m3-section","m3-view","m3-practice"]},{"id":"m4","title":"Excel 公式与数据处理","sceneIds":["m4-ref","m4-if","m4-stats","m4-text","m4-practice"]},{"id":"m5","title":"网络与网页基础","sceneIds":["m5-network","m5-address","m5-protocol","m5-web","m5-practice"]},{"id":"m6","title":"数据库与 SQL","sceneIds":["m6-model","m6-query","m6-dml","m6-practice"]},{"id":"m7","title":"算法与流程图","sceneIds":["m7-control","m7-loop","m7-recursion","m7-complex","m7-practice"]},{"id":"m8","title":"信息安全与新技术","sceneIds":["m8-sec","m8-cloud","m8-media","m8-practice"]},{"id":"exams","title":"模拟考试与复盘","sceneIds":["exam-A","exam-B","exam-C","wrong-review"]}],"scenes":[{"id":"welcome","stageId":"start","type":"orientation","title":"开始学习与使用说明","content":{"html":"<p>按真题考点学习，再用三套完整卷检验。知识先讲清原理、例题与边界；考试解析在交卷后开放。<\/p><div class=\"exam-home-grid\"><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-A\">模拟卷 A · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-B\">模拟卷 B · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-C\">模拟卷 C · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"source-index\">46题考点索引<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"errata\">回忆版勘误<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"wrong-review\">错题复习<\/button><\/div><p>学习模式可逐题检查；考试模式提供限时与交卷。客观题自动评分，开放式公式、SQL与流程图按小问自评，待评部分明确标示。<\/p><p>断网可用；记录保存在本浏览器。移动或改名HTML、换浏览器或清理浏览器数据后，旧记录可能无法自动找到。五份PDF与本页位于同一文件夹。<\/p>"},"knowledge":{"title":"从基础理解到完整限时训练","mentalModel":"先按模块读每节的先修提示，用自己的话解释关键概念，再尝试标准例题。会背答案但说不清理由时，把它当作尚未掌握；遇到边界例题时，检查原方法的适用条件。引导练习可先看提示，独立练习先合上解析，迁移练习则需要把同一原理放进新的情境。","sections":[{"id":"support-1","title":"先做一次小诊断","body":"先按模块读每节的先修提示，用自己的话解释关键概念，再尝试标准例题。会背答案但说不清理由时，把它当作尚未掌握；遇到边界例题时，检查原方法的适用条件。引导练习可先看提示，独立练习先合上解析，迁移练习则需要把同一原理放进新的情境。"},{"id":"support-2","title":"八模块怎样连起来","body":"先用硬件、容量与编码建立基本单位意识，再把操作系统理解为管理程序、内存与文件的机制。Word侧重文字、段落与节的范围；Excel侧重引用、函数与数据。网络帮助读懂通信层次和地址，网页基础区分结构、样式与输入控件。数据库把记录、条件和汇总组织起来；算法把步骤、分支、循环和递归串起来。安全与新技术始终要问工具能解决什么，以及什么条件下不能保证结果。"},{"id":"support-3","title":"模拟卷怎样使用","body":"每套有46道主问题、120分，完整限时120分钟。第一次可先在学习模式熟悉题型，再另开考试记录限时完成；考试开始后保存绝对截止时刻，切换知识页或刷新不会重新获得120分钟。题号导航标记未答，交卷后开放解析。自动评分覆盖选项、判断和明确短填空；公式、SQL、流程图与步骤题需要按评分点自评。不要把待评部分误当已得零分。"},{"id":"support-4","title":"从成绩走向下一次练习","body":"复盘先看错因，再看分数。概念错回读定义，公式错追踪坐标，计算错重新列出中间值，边界错用相等和前后一个值测试。主观题按小问逐项给分，先确认步骤再看结果；写法不同但语义正确、满足环境与条件，可以依据等价解法给分。浏览器会保存本地记录，清除前确认已完成复盘。"}],"pitfalls":["把做过的题数当作掌握程度，容易掩盖重复犯错。","答题时先使用题目明确的单位、环境与边界。"],"citations":[{"sourceId":"exam","locator":"PDF第1–11页：题型、分值与考点；学习方法为配套整理"}]}},{"id":"source-index","stageId":"start","type":"orientation","title":"46道真题考点索引","content":{"html":"<p>页码均指所给PDF物理页码。点击“回看知识”进入对应精讲。<\/p><section class=\"exam-source-entry\"><h3>真题 1 · PDF第1页<\/h3><p>C，显卡<\/p><p>按主要用途区分存储设备与图形处理部件。<\/p><p class=\"muted\">显卡带显存，不改变其整体主要用途。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-storage\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 2 · PDF第1页<\/h3><p>D，基本ASCII<\/p><p>先判断编码能否覆盖汉字。<\/p><p class=\"muted\">UTF-8是Unicode编码形式；字符数不等于字节数。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-code\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 3 · PDF第1页<\/h3><p>B，255<\/p><p>8位有256种组合，从0开始计数。<\/p><p class=\"muted\">256是组合总数，不是最大值。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-number\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 4 · PDF第1页<\/h3><p>回忆版标C；标准三状态模型应为阻塞/等待，选项条件不足<\/p><p>分清等CPU与等事件，并先确定进程状态模型。<\/p><p class=\"muted\">不把挂起与阻塞无条件视为同义。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m2-process\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 5 · PDF第1页<\/h3><p>B，1111<\/p><p>逐位使用OR真值规则。<\/p><p class=\"muted\">OR不进位，不是加法。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-logic\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 6 · PDF第1页<\/h3><p>按选项意图选B；精确术语为同一文档的两个窗格<\/p><p>区分文档、窗口和窗格。<\/p><p class=\"muted\">拆分不会得到两份独立文档。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-view\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 7 · PDF第1页<\/h3><p>按通常编辑页眉文字的含义选D<\/p><p>逐项判断是否会改变正文可容纳空间。<\/p><p class=\"muted\">页眉布局设置与修改页眉文字不是同一操作。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-layout\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 8 · PDF第1–2页<\/h3><p>=Sheet2!C6+A2，选B<\/p><p>确定当前工作表，再写跨表引用。<\/p><p class=\"muted\">工作表与地址之间用感叹号。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-ref\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 9 · PDF第2页<\/h3><p>C，5、7、9<\/p><p>两个已选数值给出差为2的序列。<\/p><p class=\"muted\">仅选一个数字的默认填充可能不同。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-ref\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 10 · PDF第2页<\/h3><p>D，两端对齐图标<\/p><p>看左右两侧边缘是否整齐。<\/p><p class=\"muted\">不背选项位置。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-layout\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 11 · PDF第2页<\/h3><p>B，ping localhost（通常解析到回环）<\/p><p>区分回环测试与外网测试。<\/p><p class=\"muted\">回环成功不能证明外网畅通。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-protocol\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 12 · PDF第2页<\/h3><p>A的描述错误<\/p><p>区分普通节点与公共主干故障。<\/p><p class=\"muted\">不要把任意节点故障都推广成全网故障。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-network\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 13 · PDF第2页<\/h3><p>A，192.168.1.10<\/p><p>与三段私有地址范围逐一对照。<\/p><p class=\"muted\">172.15不在172.16至172.31范围中。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-address\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 14 · PDF第2页<\/h3><p>D，投影仪<\/p><p>按基础互连功能分类。<\/p><p class=\"muted\">设备能联网不代表主要功能就是网络互连。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-network\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 15 · PDF第2页<\/h3><p>D，光纤<\/p><p>联合判断300米距离和强电磁干扰。<\/p><p class=\"muted\">题目要求有线，不能选红外线。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-network\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 16 · PDF第2页<\/h3><p>A，自我复制及经U盘传播<\/p><p>识别病毒特征与传播途径。<\/p><p class=\"muted\">安装杀毒软件不保证绝对安全。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-sec\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 17 · PDF第2页<\/h3><p>C，字段<\/p><p>二维表的一列对应属性/字段。<\/p><p class=\"muted\">一行是记录或元组。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-model\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 18 · PDF第3页<\/h3><p>C，WHERE grade BETWEEN 70 AND 90<\/p><p>闭区间包含两端；使用合法SQL条件。<\/p><p class=\"muted\">IN(70,90)只取两个离散值。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-query\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 19 · PDF第3页<\/h3><p>B，数字水印<\/p><p>识别不可见但算法可检出的来源标记。<\/p><p class=\"muted\">不是单纯压缩或格式转换。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-media\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 20 · PDF第3页<\/h3><p>D，左右型<\/p><p>辨认常见图文环绕名称。<\/p><p class=\"muted\">图片左右对齐不同于环绕类型。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-view\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 21 · PDF第3页<\/h3><p>B，浮点型<\/p><p>平均成绩可能包含小数。<\/p><p class=\"muted\">整数会损失小数部分。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-control\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 22 · PDF第3页<\/h3><p>A，顺序O(n)，二分O(log n)，二分须有序<\/p><p>比较最坏情形的主要增长量级。<\/p><p class=\"muted\">不能忽略二分有序前提；对数底数排版须核对。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-complex\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 23 · PDF第3页<\/h3><p>B，9次（计入最初调用）<\/p><p>基例也算1次，当前调用加左右子调用。<\/p><p class=\"muted\">返回值5与调用9次是不同问题。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-recursion\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 24 · PDF第3页<\/h3><p>C，IaaS<\/p><p>购买的是虚拟化基础资源。<\/p><p class=\"muted\">别与直接使用成品应用SaaS混淆。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-cloud\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 25 · PDF第3页<\/h3><p>D，RFID<\/p><p>芯片标签与计时感应设备进行射频识别。<\/p><p class=\"muted\">GPS定位与二维码光学识别不匹配该描述。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-cloud\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 26 · PDF第4页<\/h3><p>错误；公开获取不等于无条件授权<\/p><p>辨认“无需考虑”这一绝对表述。<\/p><p class=\"muted\">仍需核对来源、许可与适用规则。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-media\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 27 · PDF第4页<\/h3><p>NOT可用于取反，但“Excel运算符”这一称呼不严谨<\/p><p>区分逻辑功能与Excel函数/运算符分类。<\/p><p class=\"muted\">标准写法为NOT(logical)逻辑函数。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-if\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 28 · PDF第4页<\/h3><p>错误；带宽不同于实际吞吐率<\/p><p>区分链路能力与实际传送结果。<\/p><p class=\"muted\">负载及协议开销等会影响实际速率。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-protocol\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 29 · PDF第4页<\/h3><p>正确；HAVING可筛选分组结果<\/p><p>先分组，再判断组的聚合条件。<\/p><p class=\"muted\">WHERE通常用于分组前的行筛选。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-query\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 30 · PDF第4页<\/h3><p>错误；防火墙不能抵御所有攻击<\/p><p>识别安全措施的能力边界。<\/p><p class=\"muted\">单一措施不提供绝对安全保证。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-sec\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 31 · PDF第4页<\/h3><p>顺序<\/p><p>控制结构为顺序、选择（分支）、循环。<\/p><p class=\"muted\">数组是数据组织方式。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-control\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 32 · PDF第4页<\/h3><p>10101110<\/p><p>82写8位，逐位取反，再加1。<\/p><p class=\"muted\">先补足8位，再操作。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-number\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 33 · PDF第4页<\/h3><p>=A1&amp;&quot;年&quot;&amp;B1&amp;MID(C1,3,2)<\/p><p>目标分段，MID从1开始计数。<\/p><p class=\"muted\">“年”是文本常量；B1已有“月”。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-text\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 34 · PDF第4页<\/h3><p>分节符<\/p><p>不同节可设置独立页眉页脚。<\/p><p class=\"muted\">实操还需按需取消链接到前一节。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-section\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 35 · PDF第4页<\/h3><p>传输层<\/p><p>UDP与TCP同属传输层。<\/p><p class=\"muted\">不要写网际层。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-protocol\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 36 · PDF第4页<\/h3><p>访问控制<\/p><p>限制主体能访问的资源及操作。<\/p><p class=\"muted\">认证与授权含义不同。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-sec\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 37 · PDF第4页<\/h3><p>DISTINCT<\/p><p>对选出的字段组合去重。<\/p><p class=\"muted\">不删除原表记录。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-query\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 38 · PDF第4页<\/h3><p>虚拟内存<\/p><p>借助地址空间和后备存储管理内存需求。<\/p><p class=\"muted\">不代表硬盘与RAM等速。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m2-process\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 39 · PDF第4页<\/h3><p>①100*0.5+(x-100)*0.8；②x*0.5<\/p><p>先固定第一段，再计算超过部分。<\/p><p class=\"muted\">超过阈值后不把全部件数改按0.8计算。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-control\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 40 · PDF第4–5页<\/h3><p>读“物理地址”字段；截图字符模糊，与所附答案存在差异，保留不确定性<\/p><p>按6组十六进制逐组转录。<\/p><p class=\"muted\">不能用模糊图和红字答案互相循环证明。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-address\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 41 · PDF第5–6页<\/h3><p>树形；FAT32/exFAT/NTFS任二；computer*.py非法；相对路径为..\\..\\temp\\a.bat<\/p><p>目录树向上两层后进入temp。<\/p><p class=\"muted\">文件名不能含*；路径从当前文件夹出发。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m2-path\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 42 · PDF第6页<\/h3><p>CSS管样式；Apache/Nginx/IIS任二；title；文本域；HTTP<\/p><p>分别定位样式、服务器、标签页标题、输入控件、URL方案。<\/p><p class=\"muted\">title不等于正文h1。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-web\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 43 · PDF第6–7页<\/h3><p>SUM、固定范围的RANK、嵌套IF、ROUND(AVERAGE(...),1)、INDEX/MATCH；见勘误<\/p><p>逐一对齐行列、阈值和返回区域。<\/p><p class=\"muted\">末行漏填、评分档位重叠、查找列错位。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stats\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 44 · PDF第7–8页<\/h3><p>OrderID；Oracle；SUM(Number)=6；INSERT需补完整字段值；按UserID删除<\/p><p>先核对关系表，再按方言写语句。<\/p><p class=\"muted\">省略号不可执行；returnDay未给条件时答案不唯一。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-dml\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 45 · PDF第8–10页<\/h3><p>①n=n-1；②maxIndex；③max；加判max&gt;=14后提前输出<\/p><p>追踪轮次、候选人数、票数和编号。<\/p><p class=\"muted\">图的原始编号、并列票及淘汰规则不充分，详见勘误。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-loop\">回看知识<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 46 · PDF第11页<\/h3><p>24轮分裂，12小时，首次严格超过10的7次方<\/p><p>数量从1开始，每轮乘2，时间增加0.5小时。<\/p><p class=\"muted\">第23轮未超过，别把阈值条件方向画反。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-loop\">回看知识<\/button><\/section>"},"knowledge":{"title":"用46题索引定位薄弱知识","mentalModel":"每道原题都有对应模块、知识页、解题入口与易错提醒。索引中的页码是所给PDF的物理页码，从第一页开始计数；它不一定等于书上印出的页码。原题中红色文字是资料编者提供的答案，回忆版的文字、表格和图像仍需共同核对。先找到原题的提问对象，再打开对应精讲，避免只按一个熟悉词语机械选择公式。","sections":[{"id":"support-1","title":"索引的用途","body":"每道原题都有对应模块、知识页、解题入口与易错提醒。索引中的页码是所给PDF的物理页码，从第一页开始计数；它不一定等于书上印出的页码。原题中红色文字是资料编者提供的答案，回忆版的文字、表格和图像仍需共同核对。先找到原题的提问对象，再打开对应精讲，避免只按一个熟悉词语机械选择公式。"},{"id":"support-2","title":"一题可以带出哪些关联","body":"容量题连接位、字节和编址；补码题连接固定位宽与数值解释；Word分节题连接独立页面设置和链接到前一节；Excel汇总题连接复制引用与评分边界；SQL题连接字段、记录、筛选和分组。算法题则常把初始化、条件、更新和输出放在同一流程中。索引提供主入口，同一题还可回读相邻章节，学习不应被单一标签限制。"},{"id":"support-3","title":"如何处理争议答案","body":"如果题干、表格和所附答案发生冲突，先列出各自条件，检查是否存在唯一可执行的解。能够确认的知识错误在勘误中修正；条件不充分的题保留不确定性。模糊MAC地址不宜根据印好的答案猜字母，评分区间重叠应先修复规则，再计算公式。把假定条件写清，可以区分方法是否正确与原回忆是否准确。"},{"id":"support-4","title":"推荐的一次复习流程","body":"选择一题，读索引的解题入口，回到知识页完成标准例题，再尝试边界对照和模块迁移题。然后在三套模拟卷中寻找同一模块的新题，独立写出理由。核对时不要只看最终字母，要说明每个错误选项的问题，并给自己补一个反例。这样建立的是可迁移的方法，而不是记住原题的选项位置。"}],"pitfalls":["把做过的题数当作掌握程度，容易掩盖重复犯错。","答题时先使用题目明确的单位、环境与边界。"],"citations":[{"sourceId":"exam","locator":"PDF第1–11页：题型、分值与考点；学习方法为配套整理"}]}},{"id":"errata","stageId":"start","type":"orientation","title":"回忆版勘误与版本说明","content":{"html":"<p>确定的修正与仍无法确认的回忆内容分别列出。<\/p><section class=\"exam-source-entry\"><h3>第4题：挂起与阻塞的模型条件<\/h3><p class=\"muted\">表述有歧义 · 原PDF第1页<\/p><p>资料将“因某事件而暂停”标为挂起。<\/p><p>在运行、就绪、阻塞三状态模型中，等待I/O或事件通常属于阻塞。挂起涉及另外的状态扩展；题目没有给足条件，原选项缺少标准匹配。本手册讲清差别，模拟卷明确状态模型。<\/p><p class=\"muted\">UIC Processes，3.1.2。<\/p><\/section><section class=\"exam-source-entry\"><h3>第6题：两个窗格的术语<\/h3><p class=\"muted\">术语修正 · 原PDF第1页<\/p><p>所附选项表述为两个窗口显示一个文档。<\/p><p>Word拆分更精确地说是同一文档窗口内的两个窗格，可分别滚动，编辑同一份内容。<\/p><p class=\"muted\">核心笔记文字处理部分；按功能区分拆分与新建窗口。<\/p><\/section><section class=\"exam-source-entry\"><h3>第7题：编辑页眉文字与页眉布局设置<\/h3><p class=\"muted\">保留题意边界 · 原PDF第1页<\/p><p>修改页眉被列为不能改变正文挤页情况。<\/p><p>按通常仅编辑页眉文字理解，可选该项；但调整页眉距边界或页眉占位可能影响正文。模拟题明确操作含义。<\/p><p class=\"muted\">Word页面/分节概念。<\/p><\/section><section class=\"exam-source-entry\"><h3>第27题：NOT是函数<\/h3><p class=\"muted\">确定的分类修正 · 原PDF第4页<\/p><p>资料把NOT称为Excel逻辑非运算符并判对。<\/p><p>Excel正式分类中NOT是逻辑函数，语法为NOT(logical)。它确有取反功能，但应把题干改为“可使用NOT函数实现逻辑取反”。<\/p><p class=\"muted\">Microsoft Support：NOT function。<\/p><\/section><section class=\"exam-source-entry\"><h3>第40题：MAC截图与红字答案<\/h3><p class=\"muted\">无法可靠唯一转录 · 原PDF第4–5页<\/p><p>截图中部分字符变形，所附MAC答案与图示存在字符差异。<\/p><p>保留截图读取不确定性，不擅自构造唯一MAC。正确方法是读“物理地址”一行，按6组十六进制检查；模拟题用清晰文本配置表。<\/p><p class=\"muted\">原PDF第4–5页的题干及截图。<\/p><\/section><section class=\"exam-source-entry\"><h3>第43题：合计公式填充范围<\/h3><p class=\"muted\">确定的范围修正 · 原PDF第6–7页<\/p><p>原表公司位于第3至8行，但题文只说填充到F7。<\/p><p>若要求计算六家公司年度合计，F3填=SUM(B3:E3)，向下应填到F8，包含第8行四川分公司。<\/p><p class=\"muted\">原PDF第6页公司绩效表。<\/p><\/section><section class=\"exam-source-entry\"><h3>第43题：评分区间相互重叠<\/h3><p class=\"muted\">题干不能唯一恢复 · 原PDF第7页<\/p><p>一档标50至不足100，最低档又标低于80；所附IF用80作阈值。<\/p><p>50至不足80同时落入两档，题干不一致。讲解明确采用与所附IF一致的80至不足100得6分、低于80得4分作为一种修订方案；不能断言这一定是原考试完整标准。<\/p><p class=\"muted\">原PDF第7页评分表与红字公式对照。<\/p><\/section><section class=\"exam-source-entry\"><h3>第44题：INSERT的缺失值<\/h3><p class=\"muted\">条件不足 · 原PDF第8页<\/p><p>VALUES结尾使用省略号，returnDay没有给出具体新值。<\/p><p>完整INSERT必须与字段列表对应。若题设补充“未归还且允许空值”，returnDay可写NULL；否则不能唯一决定值。模拟题明确列名、数据类型和日期方言。<\/p><p class=\"muted\">Microsoft Learn：INSERT INTO；原PDF第7–8页。<\/p><\/section><section class=\"exam-source-entry\"><h3>第45题：原始编号与并列票<\/h3><p class=\"muted\">算法假设需补充 · 原PDF第8–10页<\/p><p>淘汰后数组前移，却仍把下标当候选人编号；未规定并列最低票处理。<\/p><p>原图意图下可填n=n-1、maxIndex、max；但完整实现应保存原始ID并同步移动，补充并列淘汰与终局决胜规则，明确最后一次统计使用哪轮票数。模拟题避免依赖未定义规则。<\/p><p class=\"muted\">原PDF第8–10页题干和流程图。<\/p><\/section><section class=\"exam-source-entry\"><h3>补充资料：旧版Office/Windows与泛化陈述<\/h3><p class=\"muted\">版本与适用范围说明 · 500知识点第9–16、26–33页；核心笔记第75–78、112页<\/p><p>包含Office2000菜单、固定剪贴板条数、MAC固化不可变、ping超时直接归因等说法。<\/p><p>保留可迁移的概念，旧版菜单和默认数目只在说明版本时采用。MAC可能本地管理或随机化；ping超时有多种原因；网络是否同子网必须结合掩码。本卷未直接考PowerPoint与FrontPage界面，因此不扩展成整本旧版操作题库。<\/p><p class=\"muted\">三份材料交叉核对后的适用范围整理。<\/p><\/section>"},"knowledge":{"title":"怎样阅读回忆版勘误","mentalModel":"确定修正表示可以依据定义或算式确认原说法有错；措辞边界表示答案需依赖所用模型、版本或操作范围；无法可靠恢复表示截图或条件不足，不能宣称已经知道官方标准答案。这里保留原材料的问题，目的在于帮助按正确原理学习，而不是给回忆文字补造一套未经证实的考试规则。","sections":[{"id":"support-1","title":"区分三种问题","body":"确定修正表示可以依据定义或算式确认原说法有错；措辞边界表示答案需依赖所用模型、版本或操作范围；无法可靠恢复表示截图或条件不足，不能宣称已经知道官方标准答案。这里保留原材料的问题，目的在于帮助按正确原理学习，而不是给回忆文字补造一套未经证实的考试规则。"},{"id":"support-2","title":"先查模型与版本","body":"等待I/O在基本三状态模型中属于阻塞，扩展模型中的挂起不能无条件当作同义词。Word拆分是同一文档的两个窗格；编辑页眉文字与调整页眉布局也不完全相同。旧Office资料里的菜单名、固定剪贴板条数和默认行为受版本影响，复习时优先掌握跨版本成立的操作对象、范围和原理。"},{"id":"support-3","title":"再查数据与边界","body":"Excel评分表若有重叠区间，单靠嵌套IF的先后顺序会把矛盾藏起来，必须先说明采用的无重叠标准。填充公式应覆盖完整数据行；数据库新增记录应给出字段和值的对应关系。流程图删除数组元素时，后续下标会变化，原始编号不能凭当前下标自动保留。循环还需检查达到与超过、初始化时刻与首次更新时刻。"},{"id":"support-4","title":"把勘误转成检验习惯","body":"做新题时先写环境，例如常见桌面版Word、8位补码、TCP/IP四层或Access日期语法。再列已知数据和目标，最后挑一个边界值独立复算。对SQL同时检查查询返回的行与汇总值，对Excel同时检查公式地址与数值结果。若条件不足，应明确指出缺失条件并给条件化解答；不应凭资料里的红字跳过逻辑检查。"}],"pitfalls":["把做过的题数当作掌握程度，容易掩盖重复犯错。","答题时先使用题目明确的单位、环境与边界。"],"citations":[{"sourceId":"exam","locator":"PDF第1–11页：题型、分值与考点；学习方法为配套整理"}]}},{"id":"m1-storage","stageId":"m1","type":"concept","title":"硬件、存储层次与容量单位","objectiveIds":["m1"],"knowledge":{"title":"硬件、存储层次与容量单位","summary":"对应真题：1","prerequisites":["先分清“部件有什么功能”和“数据存放在哪里”。"],"mentalModel":"把计算机想成一个工作台：CPU负责执行，内存存放当前工作材料，外存长期保存文件。设备的名称不能代替功能判断。","sections":[{"id":"m1-storage-s1","title":"系统与部件","body":"计算机系统由硬件和软件共同组成。硬件的基本功能可按运算、控制、存储、输入、输出区分。CPU包括运算器与控制器；微型计算机通常把CPU和内存称为主机的核心组成。显卡主要完成图形处理及显示输出控制，虽带显存，也不能因此把“显卡”归为题目所说的通用存储设备。遇到“不是某类设备”的题，先写出分类标准，再逐项排除。"},{"id":"m1-storage-s2","title":"内存与外存","body":"RAM可读写，通常断电丢失，适合正在运行的程序和数据；ROM用于保存固件等相对固定的信息，不能简单理解成“计算机绝不可能改写的所有芯片”。硬盘、固态硬盘、U盘属于外存，通常断电仍保存数据。Cache用于缓解CPU与主存之间的速度差异；它不是增加硬盘容量的技术。容量大、速度快、价格低是不同指标，不能互相替代。"},{"id":"m1-storage-s3","title":"单位与条件","body":"bit是二进制位，Byte是字节，一个字节含8位。做容量题先统一单位，再计算。教材常以1024逐级换算KB、MB、GB；严格区分时，KiB、MiB表示二进制倍数，kB、MB可表示十进制倍数。模拟题会明确采用哪种约定。字长是CPU一次处理数据的典型位数，不能把“64位字长”当作64字节，也不能据此直接推断某个文件大小。"}],"workedExamples":[{"title":"标准例题","prompt":"按二进制换算，4 MiB有多少字节？","steps":[{"text":"1 MiB含1024×1024字节。"},{"text":"4×1024×1024等于4194304。"}],"result":"4194304 B。","exampleType":"standard","id":"m1-storage-example-1"},{"title":"边界例题","prompt":"显卡有8 GB显存，是否应与硬盘、U盘同列为通用存储设备？","steps":[{"text":"分类看主要用途。"},{"text":"显存服务于图形处理，显卡整体仍主要是图形处理和显示控制部件。"}],"result":"不能因局部带存储器就改变整块设备的主要功能分类。","exampleType":"contrast","id":"m1-storage-example-2"}],"pitfalls":["8 bit才是1 B；网络速率常用bit/s，文件大小常用B。","RAM/ROM描述的是存储特性，内存/外存描述的是层次与用途。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第21–27页"},{"sourceId":"500","locator":"PDF第2–8页"}]},"content":{"text":""}},{"id":"m1-number","stageId":"m1","type":"concept","title":"进制、无符号数与补码","objectiveIds":["m1"],"knowledge":{"title":"进制、无符号数与补码","summary":"对应真题：3、32","prerequisites":["知道一个二进制位只有0或1；能按位权展开。"],"mentalModel":"位数决定编码组合的数量，是否有符号决定这些组合如何解释。同一串8位二进制，在无符号与补码解释下可能表示不同的数。","sections":[{"id":"m1-number-s1","title":"进制转换","body":"二进制各位的位权从右往左依次是1、2、4、8等。转十进制时把为1的位权相加；十进制整数转二进制可反复除2取余，最后逆序读余数。二进制转十六进制，从小数点处向两侧每4位分组，不足处按数值规则补零。十六进制A到F分别代表十进制10到15。先保留题目要求的固定宽度，再处理最高位。"},{"id":"m1-number-s2","title":"表示范围","body":"n位无符号整数的最小值为0，最大值比编码组合总数少1。8位共有256种组合，但最大值为255；“共有多少个数”与“最大是多少”必须分开。n位补码整数的负数范围比正数多一个值，8位补码范围为负128到正127。最高位为1并不表示无符号数是负数，必须先确认采用的解释规则。","formula":{"tex":"0≤x≤2^n-1","spoken":"n位无符号整数从0到2的n次方减1","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mn>0<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><msup><mn>2<\/mn><mi>n<\/mi><\/msup><mo>−<\/mo><mn>1<\/mn><\/mrow><\/math>"}},{"id":"m1-number-s3","title":"负数补码","body":"求固定宽度负数的补码，先写出其绝对值的二进制，补足位数，逐位取反，再加1；运算保留规定的位数。也可用模数减去绝对值验证。反向解读8位负补码时，可将其按无符号数解释后减256。求补码不能先漏掉前导零，否则取反会改变宽度；也不能把“取反”直接当作补码的全部步骤。"}],"workedExamples":[{"title":"标准例题","prompt":"求负82的8位补码。","steps":[{"text":"82写成8位是01010010。"},{"text":"取反得到10101101，加1得到10101110。"},{"text":"按无符号数解释为174；174减256等于负82。"}],"result":"10101110。","exampleType":"standard","id":"m1-number-example-1"},{"title":"边界例题","prompt":"11111111分别按8位无符号和补码解释。","steps":[{"text":"无符号：各位权相加为255。"},{"text":"补码：最高位为1，用255减256。"}],"result":"分别为255和负1。","exampleType":"boundary","id":"m1-number-example-2"}],"pitfalls":["8位无符号最大值为255，组合总数为256。","补码题先圈出位数；不要把符号位丢掉。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第9–16页"}]},"content":{"text":""}},{"id":"m1-code","stageId":"m1","type":"concept","title":"ASCII、Unicode与汉字编码","objectiveIds":["m1"],"knowledge":{"title":"ASCII、Unicode与汉字编码","summary":"对应真题：2","prerequisites":["区分字符、字符编号和保存字节。"],"mentalModel":"字符是要表达的符号，编码规定怎样把符号变成数值或字节。屏幕上看见同一个“中”字，并不意味着所有文件里都占相同字节数。","sections":[{"id":"m1-code-s1","title":"编码体系","body":"基本ASCII使用7位编码，包含英文字母、数字、标点及控制字符，不为汉字分配编码。GB2312和GBK属于常见中文编码体系。Unicode为不同文字分配码位；UTF-8是Unicode的一种编码形式，不是“每个字符固定占一个字节”的编码。真题把UTF-8列在可表示汉字的编码中，而把ASCII作为不能表示汉字的选项，应理解为这一能力差别。"},{"id":"m1-code-s2","title":"字节数判断","body":"UTF-8为变长编码，ASCII范围字符通常占1字节，常用汉字通常占3字节，某些扩展字符占4字节。GB2312中的一个汉字通常用2字节表示。计算文件字节数必须明确字符范围、编码、是否含换行或BOM；不能只数屏幕显示的字符个数。课堂例题均明确不计BOM、换行及文件系统开销。"},{"id":"m1-code-s3","title":"排错思路","body":"乱码常来自保存时与读取时使用了不同编码，例如按UTF-8保存的文件被按其他编码读取；乱码本身不必然表示文件被病毒破坏。看字符容量题时先写“文本有哪些字符”，再写“每类字符在指定编码下占几字节”，最后分别计数求和。不要把一个码位、一个字节和一个屏幕上显示的字形机械地看成一一对应。"}],"workedExamples":[{"title":"标准例题","prompt":"“AB中”以UTF-8保存，不计BOM和换行，占几字节？","steps":[{"text":"A和B各占1字节。"},{"text":"“中”是常用汉字，占3字节。"}],"result":"共5字节。","exampleType":"standard","id":"m1-code-example-1"},{"title":"易错对照","prompt":"同一文本改用GB2312保存，“中”是否仍占3字节？","steps":[{"text":"该汉字在GB2312中通常用2字节。"},{"text":"字符相同不保证字节数相同。"}],"result":"该文本占4字节。","exampleType":"contrast","id":"m1-code-example-2"}],"pitfalls":["基本ASCII不包含汉字；Unicode与UTF-8不是完全相同的概念。","“一个汉字几个字节”没有脱离编码的统一答案。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第16–20页"}]},"content":{"text":""}},{"id":"m1-logic","stageId":"m1","type":"concept","title":"按位逻辑与逻辑判断","objectiveIds":["m1"],"knowledge":{"title":"按位逻辑与逻辑判断","summary":"对应真题：5","prerequisites":["先确认处理对象是二进制位串还是布尔条件。"],"mentalModel":"按位运算像把两排开关逐个配对；逻辑判断则回答整个条件是真还是假。两个层次不能混用。","sections":[{"id":"m1-logic-s1","title":"逐位规则","body":"按位与AND只有两个对应位均为1才得到1；按位或OR只要至少一个对应位为1就得到1；异或XOR在两个对应位不同的时候得到1，相同得到0；按位非把0与1互换。运算时将相同位权对齐，必要时先按题目要求补足位数。OR不是二进制加法：两个1做OR仍是1，不会产生进位。"},{"id":"m1-logic-s2","title":"条件组合","body":"在算法条件中，AND要求两个条件同时成立，OR要求至少一个成立，NOT对真假取反。例如成绩属于闭区间，必须同时满足下界和上界；不是把两个不等式当成一条任意语言都能识别的数学链式关系。SQL使用AND连接条件，Excel使用AND等函数组合逻辑表达式。语法形式由所用环境决定。"},{"id":"m1-logic-s3","title":"运算边界","body":"固定宽度的按位非需要明确位数：4位数的取反与8位数的取反会得到不同位串。程序语言中整型按位运算符与逻辑运算符可能不同，不应把某一种语言的符号直接套到所有环境。真题第5题是逐位OR，第27题涉及Excel的NOT函数；两者都与逻辑运算有关，但处理对象和表达层次不同。"}],"workedExamples":[{"title":"标准例题","prompt":"1101与1011进行按位OR。","steps":[{"text":"从左到右配对：1或1、1或0、0或1、1或1。"},{"text":"四个对应位都至少有一个1。"}],"result":"1111。","exampleType":"standard","id":"m1-logic-example-1"},{"title":"边界对照","prompt":"同样两串数做XOR，是否仍为1111？","steps":[{"text":"相同位得到0，不同位得到1。"},{"text":"首尾两位相同，中间两位不同。"}],"result":"0110。","exampleType":"contrast","id":"m1-logic-example-2"}],"pitfalls":["按位OR不进位。","NOT在Excel中是逻辑函数，不能笼统称作所有环境中的运算符。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第9–16页"},{"sourceId":"ms-not","locator":"Syntax / Remarks"}]},"content":{"text":""}},{"id":"m1-practice","stageId":"m1","type":"quiz","title":"计算机基础与信息编码 · 分层练习","objectiveIds":["m1"],"content":{"items":[{"id":"m1-practice-1","module":"m1","kind":"single","prompt":"8位无符号整数的最大值是？","options":[{"id":"A","text":"128"},{"id":"B","text":"255"},{"id":"C","text":"256"},{"id":"D","text":"127"}],"answer":["B"],"explanation":"共有256个编码，从0计数，最大值为255。混淆点是“数量”与“最大值”。 128是8位补码负边界的绝对值；127是8位补码正数上限，256是无符号编码组合总数。题干的“无符号”决定最高位也参与数值。","feedback":{"correct":"判断正确。共有256个编码，从0计数，最大值为255。混淆点是“数量”与“最大值”。 128是8位补码负边界的绝对值；127是8位补码正数上限，256是无符号编码组合总数。题干的“无符号”决定最高位也参与数值。","incorrect":"需要调整判断。共有256个编码，从0计数，最大值为255。混淆点是“数量”与“最大值”。 128是8位补码负边界的绝对值；127是8位补码正数上限，256是无符号编码组合总数。题干的“无符号”决定最高位也参与数值。"},"practiceLevel":"guided","hintLadder":["先确定是否有符号，再看从0还是1计数。"],"objectiveIds":["m1"],"novelTransfer":false},{"id":"m1-practice-2","module":"m1","kind":"single","prompt":"负45的8位补码是？","options":[{"id":"A","text":"00101101"},{"id":"B","text":"11010010"},{"id":"C","text":"11010011"},{"id":"D","text":"10101101"}],"answer":["C"],"explanation":"45为00101101，取反为11010010，再加1为11010011。 只置符号位得到的是原码；只取反还差加1。反向按无符号值211减256，可验证负45，且结果必须保留完整8位。","feedback":{"correct":"判断正确。45为00101101，取反为11010010，再加1为11010011。 只置符号位得到的是原码；只取反还差加1。反向按无符号值211减256，可验证负45，且结果必须保留完整8位。","incorrect":"需要调整判断。45为00101101，取反为11010010，再加1为11010011。 只置符号位得到的是原码；只取反还差加1。反向按无符号值211减256，可验证负45，且结果必须保留完整8位。"},"practiceLevel":"independent","hintLadder":["绝对值先补足8位。"],"objectiveIds":["m1"],"novelTransfer":false},{"id":"m1-practice-3","module":"m1","kind":"single","prompt":"文本“A中B”存为UTF-8，不计BOM和换行，大小是？","options":[{"id":"A","text":"3字节"},{"id":"B","text":"4字节"},{"id":"C","text":"5字节"},{"id":"D","text":"6字节"}],"answer":["C"],"explanation":"两个ASCII范围字母各1字节，常用汉字3字节，共5字节。 不能把全部字符都按1字节或全部都按3字节计算；字符数是3，不等于UTF-8字节数。BOM与换行被明确排除。","feedback":{"correct":"判断正确。两个ASCII范围字母各1字节，常用汉字3字节，共5字节。 不能把全部字符都按1字节或全部都按3字节计算；字符数是3，不等于UTF-8字节数。BOM与换行被明确排除。","incorrect":"需要调整判断。两个ASCII范围字母各1字节，常用汉字3字节，共5字节。 不能把全部字符都按1字节或全部都按3字节计算；字符数是3，不等于UTF-8字节数。BOM与换行被明确排除。"},"practiceLevel":"transfer","hintLadder":["分别统计不同编码长度的字符。"],"objectiveIds":["m1"],"novelTransfer":true}]}},{"id":"m2-process","stageId":"m2","type":"concept","title":"进程状态与虚拟内存","objectiveIds":["m2"],"knowledge":{"title":"进程状态与虚拟内存","summary":"对应真题：4、38","prerequisites":["程序是静态指令集合，进程是程序的一次执行活动。"],"mentalModel":"把进程看作等候使用CPU的任务：材料齐全但没轮到它，与材料还没到，是两种不同的等待。","sections":[{"id":"m2-process-s1","title":"三种基本状态","body":"运行态表示正在使用CPU；就绪态表示除CPU外已满足运行条件，正在等待调度；阻塞或等待态表示正在等I/O、资源或某个事件，当前即使有空闲CPU也不能继续。运行进程的时间片用完通常转就绪；发起尚未完成的I/O通常转阻塞；I/O完成后通常先转就绪，再经调度运行。阻塞不等于进程已经结束。"},{"id":"m2-process-s2","title":"挂起的区别","body":"某些进程模型额外引入挂起态，用来表示进程被暂停、换出或暂不参与普通调度等情况，具体含义依系统与模型而定。只说“因为等待事件不能运行”时，基本模型中应先识别为阻塞。原回忆版第4题使用“挂起”，但未提供足够模型条件，不能从这一题推出“阻塞和挂起永远同义”。模拟题将明确采用三状态模型或直接说明挂起情境。"},{"id":"m2-process-s3","title":"虚拟内存","body":"虚拟内存给进程提供抽象地址空间，常结合分页和后备存储，使当前不活跃的页面可暂存于外存，需要时再调入内存。它不能把硬盘真的变成与RAM同速的硬件，也不是“内存无限大”。缺页调入及页面换出会产生开销。真题的“利用硬盘部分空间模拟内存”对应基础课程里的虚拟内存描述，应同时理解速度与容量的边界。"}],"workedExamples":[{"title":"标准例题","prompt":"任务等待读取磁盘数据，CPU空闲也不能继续，处于什么状态？","steps":[{"text":"缺少的是I/O结果，不仅是CPU。"},{"text":"按运行、就绪、阻塞模型归类。"}],"result":"阻塞或等待态。","exampleType":"standard","id":"m2-process-example-1"},{"title":"易错对照","prompt":"任务所需数据已到齐，但另一任务占用CPU。","steps":[{"text":"除CPU外运行条件齐全。"},{"text":"这不是等待I/O。"}],"result":"就绪态。","exampleType":"contrast","id":"m2-process-example-2"}],"pitfalls":["事件完成后通常先就绪，不一定立即运行。","外存支持虚拟内存，不等于增加了物理RAM。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第28–32页"},{"sourceId":"uic","locator":"3.1.2 Process State"}]},"content":{"text":""}},{"id":"m2-path","stageId":"m2","type":"concept","title":"文件名、目录树与相对路径","objectiveIds":["m2"],"knowledge":{"title":"文件名、目录树与相对路径","summary":"对应真题：41","prerequisites":["知道盘符、文件夹和文件三个层级；从当前目录开始逐段走路径。"],"mentalModel":"绝对路径像完整地址，相对路径像从“你现在的位置”出发的路线。计算相对路径时，当前目录本身不算已经走过的一层。","sections":[{"id":"m2-path-s1","title":"命名规则","body":"Windows常见文件系统中的普通文件名不能包含反斜杠、正斜杠、冒号、星号、问号、双引号、小于号、大于号和竖线等字符。扩展名通常提示类型，但修改扩展名不会自动完成文件格式转换。文件与文件夹也不能在同一目录中使用完全相同的名称。判断是否合法，先检查禁用字符，再考虑同名及系统保留名称等条件。"},{"id":"m2-path-s2","title":"目录与路径","body":"Windows目录通常按树形结构组织。绝对路径从盘符或网络共享根开始定位；相对路径依赖当前目录，点表示当前目录，两个点表示父目录。求路径先找到当前目录与目标的最近公共祖先：每向上一层写一次两个点，再向下写目标目录和文件名。不能把磁盘容量、目录层数和文件数量混为一谈。"},{"id":"m2-path-s3","title":"实际操作","body":"从E盘tools下的Computer文件夹访问E盘temp下的a.bat，要先回到tools，再回到E盘根，随后进入temp。这里需向上两层。若当前目录移动，相对路径含义也会变；绝对路径在同一盘符映射下定位相对稳定。模拟题均给出完整起点与终点，使用反斜杠作为Windows路径分隔符。"}],"workedExamples":[{"title":"标准例题","prompt":"从E:\\tools\\Computer访问E:\\temp\\a.bat，写相对路径。","steps":[{"text":"最近公共祖先是E盘根目录。"},{"text":"向上两层，再进入temp。"}],"result":"..\\..\\temp\\a.bat。","exampleType":"standard","id":"m2-path-example-1"},{"title":"边界例题","prompt":"从E:\\tools访问E:\\tools\\data\\score.csv。","steps":[{"text":"目标是当前目录的子目录。"},{"text":"不需要返回父目录。"}],"result":"data\\score.csv（或.\\data\\score.csv）。","exampleType":"boundary","id":"m2-path-example-2"}],"pitfalls":["文件名中的*不是“任意字符”的合法命名方式。","两个点表示父目录；不要把当前目录也多算一层。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第33–40页"},{"sourceId":"500","locator":"PDF第9–11页"}]},"content":{"text":""}},{"id":"m2-fs","stageId":"m2","type":"concept","title":"文件系统、剪贴板与回收站","objectiveIds":["m2"],"knowledge":{"title":"文件系统、剪贴板与回收站","summary":"对应真题：","prerequisites":["区分保存文件的存储设备与组织文件的规则。"],"mentalModel":"文件系统是组织和定位文件的一套规则，剪贴板是复制粘贴的临时中转，回收站是部分删除操作的恢复入口。它们处理的问题不同。","sections":[{"id":"m2-fs-s1","title":"文件系统","body":"FAT32、exFAT和NTFS都是Windows可使用的文件系统。FAT32兼容性广，但单个文件的大小有约4 GiB的限制；exFAT常用于可移动存储和较大文件；NTFS支持权限等较丰富功能，常用于Windows系统盘。选择文件系统应结合设备和操作系统支持，不要把“某系统常用”理解成“所有设备都必须用”。"},{"id":"m2-fs-s2","title":"复制、移动与剪贴板","body":"复制保留原对象，移动改变对象位置；剪切常表示准备移动。剪贴板用于保存复制或剪切内容的临时数据，现代系统可能支持多条历史记录，其容量、是否保留历史和可同步方式依版本与设置而定。不能沿用Office 2000资料中的固定条数当作所有版本的普遍结论。文件复制的耗时与同盘移动并非总是相同。"},{"id":"m2-fs-s3","title":"删除与恢复","body":"回收站依存储位置和系统设置工作，普通本地文件删除可能进入回收站，永久删除、网络位置删除或某些可移动存储情境不一定进入。回收站占用磁盘空间，不能替代备份。清空回收站或永久删除会减少普通恢复入口，但不应据此断言存储介质上所有数据已安全擦除。考试题应按明确的操作和位置判断。"}],"workedExamples":[{"title":"标准例题","prompt":"需要在Windows与其他支持exFAT的设备间交换一个8 GiB文件，FAT32适合吗？","steps":[{"text":"检查单文件限制，不能只看U盘总容量。"},{"text":"8 GiB超过FAT32单文件大小限制。"}],"result":"不适合；可在两端支持的前提下选exFAT等。","exampleType":"standard","id":"m2-fs-example-1"},{"title":"易错对照","prompt":"把“video.mp4”改名为“video.txt”，是否完成视频到文本转换？","steps":[{"text":"改名仅改变文件名后缀。"},{"text":"文件内部编码内容未转换。"}],"result":"没有完成格式转换。","exampleType":"contrast","id":"m2-fs-example-2"}],"pitfalls":["回收站不是备份，不能保证覆盖所有删除操作。","扩展名不等于文件内容本身。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第33–40页"}]},"content":{"text":""}},{"id":"m2-practice","stageId":"m2","type":"quiz","title":"操作系统与 Windows · 分层练习","objectiveIds":["m2"],"content":{"items":[{"id":"m2-practice-1","module":"m2","kind":"single","prompt":"三状态模型中，运行条件齐全但未获得CPU，属于？","options":[{"id":"A","text":"运行"},{"id":"B","text":"就绪"},{"id":"C","text":"阻塞"},{"id":"D","text":"结束"}],"answer":["B"],"explanation":"缺的只有CPU，属于就绪。阻塞是等事件或资源。 运行要求已经占有CPU；阻塞要求还在等待其他条件；结束表示执行完成。题干已排除其他等待条件，所以只缺调度。","feedback":{"correct":"判断正确。缺的只有CPU，属于就绪。阻塞是等事件或资源。 运行要求已经占有CPU；阻塞要求还在等待其他条件；结束表示执行完成。题干已排除其他等待条件，所以只缺调度。","incorrect":"需要调整判断。缺的只有CPU，属于就绪。阻塞是等事件或资源。 运行要求已经占有CPU；阻塞要求还在等待其他条件；结束表示执行完成。题干已排除其他等待条件，所以只缺调度。"},"practiceLevel":"guided","hintLadder":["问“除了CPU，还缺什么”。"],"objectiveIds":["m2"],"novelTransfer":false},{"id":"m2-practice-2","module":"m2","kind":"single","prompt":"当前D:\\study\\notes，目标D:\\study\\images\\a.png，相对路径是？","options":[{"id":"A","text":"..\\images\\a.png"},{"id":"B","text":"..\\..\\images\\a.png"},{"id":"C","text":"images\\a.png"},{"id":"D","text":".\\study\\images\\a.png"}],"answer":["A"],"explanation":"公共祖先是D:\\study，只向上一层，再进入images。 向上两层会回到D盘根，images不会位于正确层级；直接写images则会在notes下面寻找。先回到study再进入目标目录。","feedback":{"correct":"判断正确。公共祖先是D:\\study，只向上一层，再进入images。 向上两层会回到D盘根，images不会位于正确层级；直接写images则会在notes下面寻找。先回到study再进入目标目录。","incorrect":"需要调整判断。公共祖先是D:\\study，只向上一层，再进入images。 向上两层会回到D盘根，images不会位于正确层级；直接写images则会在notes下面寻找。先回到study再进入目标目录。"},"practiceLevel":"independent","hintLadder":["先找最近公共祖先。"],"objectiveIds":["m2"],"novelTransfer":false},{"id":"m2-practice-3","module":"m2","kind":"single","prompt":"16 GiB的FAT32 U盘剩余12 GiB，能直接存入单个8 GiB文件吗？","options":[{"id":"A","text":"一定能，剩余空间足够"},{"id":"B","text":"不能，超过单文件限制"},{"id":"C","text":"必须先改文件扩展名"},{"id":"D","text":"只能复制不能移动"}],"answer":["B"],"explanation":"除了总容量，还需检查FAT32约4 GiB的单文件上限；改扩展名不能解决。 复制与移动都受目标文件系统限制。应先备份再考虑转换文件系统或分卷等方案；仅检查剩余12 GiB会漏掉单文件限制。","feedback":{"correct":"判断正确。除了总容量，还需检查FAT32约4 GiB的单文件上限；改扩展名不能解决。 复制与移动都受目标文件系统限制。应先备份再考虑转换文件系统或分卷等方案；仅检查剩余12 GiB会漏掉单文件限制。","incorrect":"需要调整判断。除了总容量，还需检查FAT32约4 GiB的单文件上限；改扩展名不能解决。 复制与移动都受目标文件系统限制。应先备份再考虑转换文件系统或分卷等方案；仅检查剩余12 GiB会漏掉单文件限制。"},"practiceLevel":"transfer","hintLadder":["总空闲空间与单文件限制是两条条件。"],"objectiveIds":["m2"],"novelTransfer":true}]}},{"id":"m3-layout","stageId":"m3","type":"concept","title":"字符、段落与页面排版","objectiveIds":["m3"],"knowledge":{"title":"字符、段落与页面排版","summary":"对应真题：7、10","prerequisites":["先定位设置作用于字符、段落还是整页。"],"mentalModel":"排版问题像给文字安排位置：字符决定字的形态，段落决定一组文字怎样排列，页面决定可使用的纸面范围。先找作用层级，再选命令。","sections":[{"id":"m3-layout-s1","title":"字符与段落","body":"字体、字号、加粗、颜色等属于字符格式；段落对齐、缩进、行距、段前段后间距等属于段落格式。左对齐的右边缘可以参差；右对齐的左边缘可以参差；居中对齐将段落围绕中线安排；两端对齐在普通完整行中使两侧边缘整齐。两端对齐与分散对齐并非所有情形完全相同，段落最后一行的处理可能不同。"},{"id":"m3-layout-s2","title":"一页放不下怎么办","body":"多出一行时，减少行距、段前段后间距、字号或页边距，都可能增加一页可容纳的正文。修改页眉文字本身通常不直接改变正文排版；但若调整页眉距边界等布局设置，或页眉占据了额外空间，结果可能改变。因此原题的“修改页眉”按通常指编辑其内容理解，不能推广为“所有页眉设置都不影响正文”。实际排错应先检查隐藏段落标记、空段与手动分页。"},{"id":"m3-layout-s3","title":"标题样式、目录与邮件合并","body":"自动目录通常依据标题样式或相应大纲级别识别章节。先给章、节分别应用标题1、标题2等样式，再插入自动目录；正文修改后要更新目录，选择只更新页码还是更新整个目录。仅把字变大或改红不等于设置了标题级别。邮件合并则把一份主文档与名单数据源结合，在姓名、班级等位置插入合并域，预览后生成多份个性化通知；它解决批量变内容，不是建立目录。"},{"id":"m3-layout-s4","title":"操作原则","body":"格式刷复制的是格式，不会自动把源文字内容覆盖到目标。双击格式刷通常可以连续刷选多处不相邻的目标，完成后按Esc退出。显示段落标记用于看清结构，不会仅因开启显示而把编辑标记打印成正文。选中一段文字后直接输入会替换被选中内容；仅把光标放到位置则通常是插入。对齐图标可通过短线的左右边缘识别，不能只记A、B、C、D字母，因为选项次序会变。调整页面前先明确纸型固定、是否允许改变字号等题目限制。"}],"workedExamples":[{"title":"标准例题","prompt":"文章第二页仅有一行，且纸型固定为A4，列出两种可能的调整。","steps":[{"text":"先检查是否存在空段或手动分页。"},{"text":"在允许范围内缩小行距或页边距。"}],"result":"减少行距、减少页边距等；效果需依实际排版验证。","exampleType":"standard","id":"m3-layout-example-1"},{"title":"易错对照","prompt":"把段落设置为两端对齐是否会自动缩小字号？","steps":[{"text":"对齐控制段落在水平方向的排列。"},{"text":"字号属于字符格式。"}],"result":"不会因两端对齐自动改变字号。","exampleType":"contrast","id":"m3-layout-example-2"}],"pitfalls":["行距不是字号，段后间距也不是每行之间的距离。","图标题看边缘规律，不背选项字母。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第41–47页"},{"sourceId":"500","locator":"PDF第11–14页"}]},"content":{"text":""}},{"id":"m3-section","stageId":"m3","type":"concept","title":"分页、分节与不同页眉页脚","objectiveIds":["m3"],"knowledge":{"title":"分页、分节与不同页眉页脚","summary":"对应真题：34","prerequisites":["知道“页”是排版结果，“节”是可独立设置版式的区域。"],"mentalModel":"分页符只是要求从下一页开始；分节符则给前后区域建立独立的版式边界。要改变章节页眉，通常既要分节，也要处理与上一节的关联。","sections":[{"id":"m3-section-s1","title":"分页与分节","body":"自动分页随文字长度变化；手动分页符强制后文另起一页，常用Ctrl+Enter插入。分节符使文档分成可独立设置页眉页脚、纸张方向、页边距、页码格式等的节。下一页分节符同时开始新节和新页；连续分节符可在同页建立新节，适用于同页局部改变栏数等情形。不是每次另起一页都需要分节。"},{"id":"m3-section-s2","title":"设置章节页眉","body":"在章节边界插入合适的分节符，进入新节的页眉或页脚区域，按需取消“链接到前一节”，再编辑内容。页眉与页脚的关联可以分别处理。若仍链接，修改后可能同步影响前一节。页码可连续，也可设置重新起始；是否重新编号应由要求决定。原真题只问插入什么符号，答案为分节符；实际操作还需检查关联。"},{"id":"m3-section-s3","title":"相关但不同的功能","body":"“首页不同”处理同一节首页与后续页的差别；“奇偶页不同”处理奇数页和偶数页的差别。它们不等于任意章节都已独立。页面多一页时，也不能不加判断地删除全部分节符，因为这可能合并版式设置。检查时显示编辑标记，先辨认分页符与分节符的种类，再做修改。"}],"workedExamples":[{"title":"标准例题","prompt":"第一章页眉写“绪论”，第二章写“方法”，怎样设置？","steps":[{"text":"在第二章前插入分节符。"},{"text":"进入第二节页眉，取消链接到前一节。"},{"text":"分别输入各章页眉。"}],"result":"分节并按需解除关联。","exampleType":"standard","id":"m3-section-example-1"},{"title":"易错对照","prompt":"只插入一个分页符，是否保证两页可以设置不同章节页眉？","steps":[{"text":"分页符不建立独立节。"},{"text":"前后通常仍共用同一节页眉设置。"}],"result":"不能保证。","exampleType":"contrast","id":"m3-section-example-2"}],"pitfalls":["分节符与分页符作用不同。","“链接到前一节”未解除，是章节页眉互相影响的常见原因。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第41–47页"}]},"content":{"text":""}},{"id":"m3-view","stageId":"m3","type":"concept","title":"拆分窗口与图文环绕","objectiveIds":["m3"],"knowledge":{"title":"拆分窗口与图文环绕","summary":"对应真题：6、20","prerequisites":["区分文档、窗口和窗格；区分图片在正文中的排版方式。"],"mentalModel":"拆分让同一篇文档的两个位置同时可见，图文环绕决定正文怎样绕开或接近图片。两种操作都改变观看或排版方式，并不自动复制文档。","sections":[{"id":"m3-view-s1","title":"拆分与新建窗口","body":"Word拆分把同一文档的窗口分成两个可分别滚动的窗格，常用于对照前后段落；编辑一个窗格，改变的是同一份文档。教材有时简写为“两个窗口显示一个文档”，更精确的说法是“同一窗口内的两个窗格”。新建窗口则可以为同一文档再开一个窗口；并排查看还可以涉及两份不同文档。作答要看题目具体使用了哪种功能。"},{"id":"m3-view-s2","title":"图文环绕","body":"嵌入型图片像一个较大的字符，随所在段落移动；四周型让文字在图片外接矩形周围排列；紧密型更贴近图片轮廓；上下型使文字主要位于图片上方与下方；还可能有衬于文字下方、浮于文字上方等。具体菜单名称随版本略有变化，但“左右型”不是常见的标准环绕名称。要分清图像的左右对齐与图文环绕，二者不是同一设置。"},{"id":"m3-view-s3","title":"操作边界","body":"图片对象的锚点、随文字移动和固定位置等设置会影响版面稳定。嵌入型图片不一定能像浮动对象一样任意拖动。不能仅凭图片当前位置就断定它采用哪种环绕，需要查看设置或观察文字的避让方式。模拟题以常见桌面版Word功能为准，不考旧版本中独有的动态文字效果或固定菜单位置。"}],"workedExamples":[{"title":"标准例题","prompt":"需要同时核对同一报告第2页和第20页，且修改应同步。","steps":[{"text":"使用拆分功能。"},{"text":"分别滚动两个窗格到需要的位置。"}],"result":"仍是同一文档，修改作用于共同内容。","exampleType":"standard","id":"m3-view-example-1"},{"title":"易错对照","prompt":"图片左对齐是否代表使用“左右型”环绕？","steps":[{"text":"左对齐描述水平位置。"},{"text":"环绕描述图片与周围正文的关系。"}],"result":"不是；“左右型”不是此处标准环绕名称。","exampleType":"contrast","id":"m3-view-example-2"}],"pitfalls":["窗格、窗口、文档不是同一概念。","图片对齐和图文环绕应分别判断。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第41–47页"}]},"content":{"text":""}},{"id":"m3-practice","stageId":"m3","type":"quiz","title":"Word 文档处理 · 分层练习","objectiveIds":["m3"],"content":{"items":[{"id":"m3-practice-1","module":"m3","kind":"single","prompt":"不同章节设置不同页眉，关键边界通常是？","options":[{"id":"A","text":"空行"},{"id":"B","text":"分页符"},{"id":"C","text":"分节符"},{"id":"D","text":"制表符"}],"answer":["C"],"explanation":"分节允许独立设置页眉页脚，实操再按需解除链接。 分页符仅强制后文另起一页，空行和制表符只影响当前位置。分节后还需检查链接到前一节，才能使页眉内容按章独立。","feedback":{"correct":"判断正确。分节允许独立设置页眉页脚，实操再按需解除链接。 分页符仅强制后文另起一页，空行和制表符只影响当前位置。分节后还需检查链接到前一节，才能使页眉内容按章独立。","incorrect":"需要调整判断。分节允许独立设置页眉页脚，实操再按需解除链接。 分页符仅强制后文另起一页，空行和制表符只影响当前位置。分节后还需检查链接到前一节，才能使页眉内容按章独立。"},"practiceLevel":"guided","hintLadder":["需要新的版式区域。"],"objectiveIds":["m3"],"novelTransfer":false},{"id":"m3-practice-2","module":"m3","kind":"single","prompt":"第二节页眉修改后第一节也变化，优先检查？","options":[{"id":"A","text":"是否设两端对齐"},{"id":"B","text":"链接到前一节"},{"id":"C","text":"图片格式"},{"id":"D","text":"文档字数"}],"answer":["B"],"explanation":"仍链接到前一节时内容可能联动；先检查该设置。 两端对齐、图片格式和字数不控制跨节页眉内容的关联。先解除正确类型页眉的链接，再修改并检查前一节是否保持。","feedback":{"correct":"判断正确。仍链接到前一节时内容可能联动；先检查该设置。 两端对齐、图片格式和字数不控制跨节页眉内容的关联。先解除正确类型页眉的链接，再修改并检查前一节是否保持。","incorrect":"需要调整判断。仍链接到前一节时内容可能联动；先检查该设置。 两端对齐、图片格式和字数不控制跨节页眉内容的关联。先解除正确类型页眉的链接，再修改并检查前一节是否保持。"},"practiceLevel":"independent","hintLadder":["独立节与独立关联是两个步骤。"],"objectiveIds":["m3"],"novelTransfer":false},{"id":"m3-practice-3","module":"m3","kind":"single","prompt":"同一文档拆分后，在上窗格修改文字，下窗格的同一位置会怎样？","options":[{"id":"A","text":"保持原文"},{"id":"B","text":"同步反映同一文档修改"},{"id":"C","text":"产生另一份文件"},{"id":"D","text":"自动删除页眉"}],"answer":["B"],"explanation":"两个窗格查看同一文档，编辑不是复制出另一篇。 拆分只增加同一内容的观看位置。另一窗格若滚到同一段，看到的是同一次编辑；需要独立副本时才应另存文件。","feedback":{"correct":"判断正确。两个窗格查看同一文档，编辑不是复制出另一篇。 拆分只增加同一内容的观看位置。另一窗格若滚到同一段，看到的是同一次编辑；需要独立副本时才应另存文件。","incorrect":"需要调整判断。两个窗格查看同一文档，编辑不是复制出另一篇。 拆分只增加同一内容的观看位置。另一窗格若滚到同一段，看到的是同一次编辑；需要独立副本时才应另存文件。"},"practiceLevel":"transfer","hintLadder":["区分观看入口与被编辑对象。"],"objectiveIds":["m3"],"novelTransfer":true}]}},{"id":"m4-ref","stageId":"m4","type":"concept","title":"单元格引用、跨表公式与填充","objectiveIds":["m4"],"knowledge":{"title":"单元格引用、跨表公式与填充","summary":"对应真题：8、9","prerequisites":["会用列字母和行号定位单元格；公式通常以等号开头。"],"mentalModel":"复制公式像搬运一张带相对方位的路线图：没有锁定的坐标随位置改变，带美元符号的部分固定。","sections":[{"id":"m4-ref-s1","title":"四种引用","body":"A1是相对引用，行列都可在复制时改变；$A$1是绝对引用，行列均固定；$A1只固定列；A$1只固定行。美元符号写在要锁定的坐标前。判断复制结果时先算公式移动了几行几列，再只改变未锁定的部分。不要因出现一个美元符号就认为整个引用均固定。"},{"id":"m4-ref-s2","title":"跨表引用","body":"引用其他工作表一般用工作表名、感叹号、单元格地址组合。例如在Sheet1中把Sheet2的C6与本表A2相加，公式写为=Sheet2!C6+A2。工作表名含空格或特殊字符时，通常用单引号包住表名，例如='年度 业绩'!B2。感叹号用于工作表与地址之间，不应换成冒号。冒号常用于连续区域，例如B3:E3。"},{"id":"m4-ref-s3","title":"自动填充","body":"同时选中1、3两个数值单元格再拖动，Excel通常识别等差序列，后续为5、7、9；仅选中一个普通数字拖动，常默认复制，该行为还可能受填充选项影响。公式填充改变的是引用位置。先判断题目给的是数值序列还是公式，再决定使用数列规律还是引用平移规则。"}],"workedExamples":[{"title":"标准例题","prompt":"C2中的公式=A2*$F$1向下复制到C3。","steps":[{"text":"下移一行，A2变A3。"},{"text":"$F$1的列行都固定。"}],"result":"=A3*$F$1。","exampleType":"standard","id":"m4-ref-example-1"},{"title":"边界例题","prompt":"=A$1+$B2从C2复制到D3。","steps":[{"text":"右移一列、下移一行。"},{"text":"A$1列变为B，行1固定；$B2列B固定，行变3。"}],"result":"=B$1+$B3。","exampleType":"boundary","id":"m4-ref-example-2"}],"pitfalls":["冒号表示区域，感叹号表示跨工作表引用。","数据填充与公式填充分别处理。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第49–62页"},{"sourceId":"500","locator":"PDF第15–16页"}]},"content":{"text":""}},{"id":"m4-if","stageId":"m4","type":"concept","title":"IF、AND、OR、NOT与分段条件","objectiveIds":["m4"],"knowledge":{"title":"IF、AND、OR、NOT与分段条件","summary":"对应真题：27","prerequisites":["先把自然语言范围整理成互不重叠、无遗漏的区间。"],"mentalModel":"嵌套IF是一串从上往下问的问题。排在前面的条件一旦成立，后面的条件就不会决定该行结果；因此条件顺序与边界同样重要。","sections":[{"id":"m4-if-s1","title":"条件与分支","body":"IF需要逻辑测试、成立时返回值、不成立时返回值三个部分。AND要求条件全真，OR只要至少一个条件真，NOT对真假取反；它们在Excel中都是函数。判断某数是否位于一个区间时，可使用AND组合上下界，也可在顺序正确的嵌套IF中利用前面条件已排除的信息。比较关系用>=、<=、<>等Excel语法。"},{"id":"m4-if-s2","title":"从高到低分档","body":"若120及以上得10分，100到不足120得8分，80到不足100得6分，低于80得4分，可从最高阈值开始依次判断。写完公式后必须用119、120、99、100、79、80检查边界。回忆版表格的一档写成50到不足100，但后面的最低档又写低于80，产生重叠；不能靠公式暗自替题干修订，而应先明确采用哪套无重叠标准。"},{"id":"m4-if-s3","title":"分段计费","body":"阶梯累计计费与“全部按当前档单价”不同。例如前100件每件0.5元，超出部分每件0.8元，超出时应先计算前100件的金额，再加剩余件数的金额。若把所有件数直接乘0.8，会改变题意。通过阈值本身和阈值加1这两个测试值，可快速发现漏算、重算和边界方向错误。"}],"workedExamples":[{"title":"标准例题","prompt":"C2按120、100、80三个阈值评分，写公式。","steps":[{"text":"先判断最高档，再判断下一档。"},{"text":"最终else覆盖低于80的情形。"}],"result":"=IF(C2>=120,10,IF(C2>=100,8,IF(C2>=80,6,4)))。","exampleType":"standard","id":"m4-if-example-1"},{"title":"边界例题","prompt":"前100件每件0.5元，超出部分0.8元，101件补贴多少？","steps":[{"text":"前100件为50元。"},{"text":"只把第101件按0.8元计算。"}],"result":"50.8元；不是80.8元。","exampleType":"boundary","id":"m4-if-example-2"}],"pitfalls":["每个边界应只有一个归属。","NOT是逻辑函数；不要把函数名与数学逻辑符号混用。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第54–62页"},{"sourceId":"ms-not","locator":"Syntax / Remarks"}]},"content":{"text":""}},{"id":"m4-stats","stageId":"m4","type":"concept","title":"SUM、RANK、ROUND与INDEX/MATCH","objectiveIds":["m4"],"knowledge":{"title":"SUM、RANK、ROUND与INDEX/MATCH","summary":"对应真题：43","prerequisites":["会引用连续区域；知道题目求的是数值、名次还是对应名称。"],"mentalModel":"求最大值与找出“谁最大”是两步：MAX找到数值，MATCH找到相对位置，INDEX取回该位置上的名称。","sections":[{"id":"m4-stats-s1","title":"基础统计","body":"SUM求和，AVERAGE求平均，MAX取最大值。对年度业绩求和时，求的是同一行四个季度，不能误取一列所有公司的值。ROUND用于把计算结果舍入到指定位数，和只改变单元格显示的小数位不同：前者产生新的计算值，后者通常只改变显示。对平均分保留1位小数，应先求平均再对平均值ROUND，不能随意先舍入每条数据。"},{"id":"m4-stats-s2","title":"数数要先说数什么","body":"COUNT对引用区域统计数值，包括公式产生的数值，通常不把文本数字和空白计入；COUNTA统计非空单元格，连公式返回的空字符串也可能计入，因此不等于“肉眼看见有文字的格数”。COUNTIF按一个条件计数，例如=COUNTIF(F3:F6,\">=80\")统计至少80的项目数。区域内若是12、文本“待入库”、18、空白、30，COUNT为3，COUNTA为4。求和值、数值个数、非空个数与达标个数分别选择不同函数。"},{"id":"m4-stats-s3","title":"排名与固定区域","body":"RANK或较新版本的RANK.EQ可对数值排名。省略第三参数或使用0时通常按降序，较大数排名靠前。向下复制排名公式时，被排名的单元格随行改变，而全体比较区域应固定。出现并列值时，普通竞赛排名会跳过之后相应名次，例如1、2、2、4，而不是自动变成1、2、2、3。题目若要求其他排名规则应另行说明。"},{"id":"m4-stats-s4","title":"查找对应名称","body":"MATCH的精确匹配模式可求目标在区域中的相对序号；INDEX用这个序号从名称列返回对应项。MATCH返回相对位置，不是工作表的绝对行号；名称区域与数值区域应等长、同起止对象。多个并列最大值时，常见精确MATCH返回第一个匹配，不能声称一条这样的公式就返回了所有并列公司。"}],"workedExamples":[{"title":"标准例题","prompt":"A3:A8为公司，C3:C8为二季度业绩，找最高业绩公司。","steps":[{"text":"MAX(C3:C8)求最高值。"},{"text":"MATCH(最高值,C3:C8,0)求位置。"},{"text":"INDEX从A3:A8取同一位置的名称。"}],"result":"=INDEX(A3:A8,MATCH(MAX(C3:C8),C3:C8,0))。","exampleType":"standard","id":"m4-stats-example-1"},{"title":"边界例题","prompt":"成绩90、80、80、70降序排名如何？","steps":[{"text":"90排第1，两条80同排第2。"},{"text":"70前面有3条记录。"}],"result":"1、2、2、4。","exampleType":"boundary","id":"m4-stats-example-2"}],"pitfalls":["求整行年度合计不能漏掉最后一家公司或某一季度。","INDEX与MATCH的区域要按同一对象对齐。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第49–62页"}]},"content":{"text":""}},{"id":"m4-text","stageId":"m4","type":"concept","title":"字符串连接与MID文本提取","objectiveIds":["m4"],"knowledge":{"title":"字符串连接与MID文本提取","summary":"对应真题：33","prerequisites":["知道数值参与算术，文本可以拼接；先逐字符编号。"],"mentalModel":"文本公式像剪纸再拼贴：MID按位置剪出一段，&把需要的片段按顺序连接。先写目标文本，再倒推每一段来自哪里。","sections":[{"id":"m4-text-s1","title":"连接符与引号","body":"Excel使用&连接文本，字符串常量放在英文双引号内；引用单元格本身不加双引号。A1与\"A1\"分别表示A1单元格内容和字面字符A1。连接时年份数值可被转成文本参与拼接；这不等于真正的日期计算。要得到“2025年12月考试”，需要保留B1中已有的“月”，不要重复补一个“月”。"},{"id":"m4-text-s2","title":"MID位置规则","body":"MID的参数依次是原文本、起始位置、提取字符数，起始位置从1开始。对“参加考试时间”逐字编号：参1、加2、考3、试4、时5、间6。因此从第3个字符取2个字符得到“考试”。不能把第3个字符理解成从0开始计数的第4个字符，也不能把第三参数当作结束位置。"},{"id":"m4-text-s3","title":"LEFT、RIGHT与前导零","body":"LEFT从最左侧取指定字符数，RIGHT从最右侧取指定字符数，结果属于文本。例如=RIGHT(\"批次03\",2)得到文本“03”，并非数值3。若要保留编号的前导零，应保留这个文本结果，避免不必要地转成数值。若目标为“第03批”，可以把“第”、提取结果、“批”按顺序用&连接；每段的来源都要与题目要求的单元格对应。"},{"id":"m4-text-s4","title":"组合与检查","body":"写文本公式时把目标拆成“年份”“年”“月份”“考试”四段，再分别选引用或常量。检查输出应比较完整字符串，包括是否多出空格、缺字、重复单位。公式中的函数名大小写通常不影响结果，但引号必须成对；从文档复制来的弯引号可能需要替换为适合公式输入的英文直引号。"}],"workedExamples":[{"title":"标准例题","prompt":"A1为2025，B1为12月，C1为参加考试时间，生成2025年12月考试。","steps":[{"text":"年份来自A1，“年”是常量。"},{"text":"月份来自B1，考试由MID(C1,3,2)取得。"}],"result":"=A1&\"年\"&B1&MID(C1,3,2)。","exampleType":"standard","id":"m4-text-example-1"},{"title":"易错对照","prompt":"MID(\"参加考试时间\",3,4)会得到什么？","steps":[{"text":"起点是“考”，连续取4个字符。"},{"text":"第三参数是数量，不是截止下标。"}],"result":"考试时间。","exampleType":"contrast","id":"m4-text-example-2"}],"pitfalls":["&用于连接；加号主要用于算术，不能把任意文本直接相加。","文本提取的位置从1开始。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第54–62页"}]},"content":{"text":""}},{"id":"m4-practice","stageId":"m4","type":"quiz","title":"Excel 公式与数据处理 · 分层练习","objectiveIds":["m4"],"content":{"items":[{"id":"m4-practice-1","module":"m4","kind":"single","prompt":"向下复制公式时，比较范围始终固定为B2:B7，应写？","options":[{"id":"A","text":"B2:B7"},{"id":"B","text":"$B$2:$B$7"},{"id":"C","text":"$B2:$B7"},{"id":"D","text":"B$2:B7"}],"answer":["B"],"explanation":"行列均锁定需两个地址的行列都带美元符号。 相对引用会随复制改变，混合引用只固定一部分。虽然本题只向下填充，两个端点的行号必须都锁定；给定选项只有完整绝对引用满足要求。","feedback":{"correct":"判断正确。行列均锁定需两个地址的行列都带美元符号。 相对引用会随复制改变，混合引用只固定一部分。虽然本题只向下填充，两个端点的行号必须都锁定；给定选项只有完整绝对引用满足要求。","incorrect":"需要调整判断。行列均锁定需两个地址的行列都带美元符号。 相对引用会随复制改变，混合引用只固定一部分。虽然本题只向下填充，两个端点的行号必须都锁定；给定选项只有完整绝对引用满足要求。"},"practiceLevel":"guided","hintLadder":["需要锁定每个端点的行与列。"],"objectiveIds":["m4"],"novelTransfer":false},{"id":"m4-practice-2","module":"m4","kind":"single","prompt":"MID(\"志愿服务记录\",3,2)返回？","options":[{"id":"A","text":"志愿"},{"id":"B","text":"愿服"},{"id":"C","text":"服务"},{"id":"D","text":"记录"}],"answer":["C"],"explanation":"字符从1开始：志1、愿2、服3、务4，因此取“服务”。 “志愿”来自前两个字符，“记录”来自最后两个字符，“愿服”从第2个字符开始。将起点和长度分开读取即可排除这些位置偏移。","feedback":{"correct":"判断正确。字符从1开始：志1、愿2、服3、务4，因此取“服务”。 “志愿”来自前两个字符，“记录”来自最后两个字符，“愿服”从第2个字符开始。将起点和长度分开读取即可排除这些位置偏移。","incorrect":"需要调整判断。字符从1开始：志1、愿2、服3、务4，因此取“服务”。 “志愿”来自前两个字符，“记录”来自最后两个字符，“愿服”从第2个字符开始。将起点和长度分开读取即可排除这些位置偏移。"},"practiceLevel":"independent","hintLadder":["第三参数是提取数量。"],"objectiveIds":["m4"],"novelTransfer":false},{"id":"m4-practice-3","module":"m4","kind":"single","prompt":"评分120及以上10分，100至不足120为8分，低于100为6分；输入100应得？","options":[{"id":"A","text":"6"},{"id":"B","text":"8"},{"id":"C","text":"10"},{"id":"D","text":"条件重叠不能评分"}],"answer":["B"],"explanation":"100包含在中间档，正确按>=100判为8。用临界值发现条件方向错误。 输入100没有达到120，但满足至少100；因此归入8分档。各档互不重叠，恰好100不能算成低于100，也不能直接落到最高档。","feedback":{"correct":"判断正确。100包含在中间档，正确按>=100判为8。用临界值发现条件方向错误。 输入100没有达到120，但满足至少100；因此归入8分档。各档互不重叠，恰好100不能算成低于100，也不能直接落到最高档。","incorrect":"需要调整判断。100包含在中间档，正确按>=100判为8。用临界值发现条件方向错误。 输入100没有达到120，但满足至少100；因此归入8分档。各档互不重叠，恰好100不能算成低于100，也不能直接落到最高档。"},"practiceLevel":"transfer","hintLadder":["把每个区间端点的归属写清。"],"objectiveIds":["m4"],"novelTransfer":true}]}},{"id":"m5-network","stageId":"m5","type":"concept","title":"网络拓扑、设备与传输介质","objectiveIds":["m5"],"knowledge":{"title":"网络拓扑、设备与传输介质","summary":"对应真题：12、14、15","prerequisites":["区分连接形状、设备功能和传输材料。"],"mentalModel":"拓扑说明“谁和谁相连”，设备说明“怎样转发”，介质说明“信号走什么路”。同一个网络题往往同时出现这三个层面。","sections":[{"id":"m5-network-s1","title":"常见拓扑","body":"总线型由多个节点共享公共主干；星型由节点连接中心设备；环型形成闭合环路；树型按层级组织。基础模型中，星型的普通支路故障主要影响该支路，而中心设备故障可能影响整体。总线主干的故障可能造成广泛中断，但不能说“总线任意一个普通节点故障必定导致全网瘫痪”。现实网络还可能有冗余链路，答题时按题目给出的模型判断。"},{"id":"m5-network-s2","title":"设备功能","body":"网卡提供主机接入网络的接口；交换机通常按MAC地址在局域网内转发帧；路由器通常依据IP地址与路由表在网络之间转发分组。投影仪的主要用途是显示输出，不能仅因为某台投影仪能联网，就把它当作基础题中的网络互连设备。集线器、交换机、路由器的工作方式不同，不能只看外形或接口数量。"},{"id":"m5-network-s3","title":"介质选择","body":"双绞线用于常见以太网接入，但常规铜缆链路有距离及电磁干扰约束；光纤传输光信号，适合较远距离、大带宽和强电磁干扰场景。某厂房距离300米且干扰强，通常选光纤而不是普通100米级双绞线链路。无线电、红外线属于无线介质，题目要求有线传输时不能选红外线。选择时同时看距离、干扰、带宽和布线要求。"}],"workedExamples":[{"title":"标准例题","prompt":"仓库距办公室300米，周围有强电磁干扰，要求有线稳定传输。","steps":[{"text":"距离超出常见普通双绞线单段的100米级范围。"},{"text":"光纤不以导电铜线传输数据，抗电磁干扰能力强。"}],"result":"优先选择合适的光纤链路。","exampleType":"standard","id":"m5-network-example-1"},{"title":"易错对照","prompt":"星型网络中某普通终端故障，一定使所有终端断网吗？","steps":[{"text":"普通支路与中心节点故障不同。"},{"text":"按无冗余的基本星型模型判断。"}],"result":"不一定；中心设备故障的影响通常更大。","exampleType":"contrast","id":"m5-network-example-2"}],"pitfalls":["普通节点与公共主干故障不能混写。","具有联网功能的设备不一定属于题目所考的互连设备。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第73–75页"},{"sourceId":"500","locator":"PDF第17–23页"}]},"content":{"text":""}},{"id":"m5-address","stageId":"m5","type":"concept","title":"IP、私有地址、子网掩码与MAC","objectiveIds":["m5"],"knowledge":{"title":"IP、私有地址、子网掩码与MAC","summary":"对应真题：13、40","prerequisites":["会区分十进制分段地址和十六进制硬件地址。"],"mentalModel":"IP地址用于网络层寻址，MAC地址用于链路层标识；子网掩码说明地址的哪些位属于网络部分。读配置图时应按字段标签定位。","sections":[{"id":"m5-address-s1","title":"IPv4与私有地址","body":"IPv4地址有32位，常写成四段0到255的十进制数。私有范围包括10开头的整个/8块、172.16到172.31的/12块，以及192.168的/16块。172.15不是私有范围的一部分，不能把所有172开头地址都看成私有地址。私有地址可在内部网络使用，通常需借助网关及地址转换等方式访问公网；它不是“不能用于任何网络”的地址。"},{"id":"m5-address-s2","title":"子网掩码","body":"掩码中连续的1表示网络位。在常见/24网络中，掩码为255.255.255.0，但并不是所有局域网都必须前三段相同。判断两地址是否属于同一子网，应使用各自明确的掩码做网络号计算。基础题若给出192.168.1.2/24，其网络号为192.168.1.0，广播地址为192.168.1.255；可用普通主机范围通常排除这两个地址。"},{"id":"m5-address-s3","title":"MAC与读图","body":"常见以太网MAC地址是48位，通常写为6组十六进制数，用冒号或短横线分隔。ipconfig /all输出中的“物理地址”对应MAC，“IPv4地址”“默认网关”“DNS服务器”是其他字段。MAC不等于IPv4，也不能绝对说永远不可更改，现实中有本地管理地址和随机化等情形。读模糊截图应逐组核对，不应机械相信旁边印好的答案。"}],"workedExamples":[{"title":"标准例题","prompt":"172.20.4.8与172.15.4.8中哪个属于RFC1918私有范围？","steps":[{"text":"172私有范围的第二段为16到31。"},{"text":"20在范围内，15在范围外。"}],"result":"172.20.4.8。","exampleType":"standard","id":"m5-address-example-1"},{"title":"边界例题","prompt":"同为192.168.1开头，是否不看掩码就能断言同一子网？","steps":[{"text":"网络前缀长度可能不是/24。"},{"text":"例如/25会把末段0到127与128到255分成不同子网。"}],"result":"不能脱离掩码判断。","exampleType":"boundary","id":"m5-address-example-2"}],"pitfalls":["MAC常见为48位，IPv4为32位，IPv6为128位。","私有地址范围需要记完整边界。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第75–81页"}]},"content":{"text":""}},{"id":"m5-protocol","stageId":"m5","type":"concept","title":"分层、带宽、DNS与网络诊断","objectiveIds":["m5"],"knowledge":{"title":"分层、带宽、DNS与网络诊断","summary":"对应真题：11、28、35","prerequisites":["先问协议解决哪一层的问题，再读诊断结果。"],"mentalModel":"网络分层把复杂通信拆成分工。诊断应由本机到局域网、再到外部地址和域名逐步缩小问题范围，单次失败不能直接证明唯一原因。","sections":[{"id":"m5-protocol-s1","title":"TCP/IP分工","body":"基础课程常采用应用层、传输层、网际层、网络接口层四层模型。HTTP、DNS、SMTP等属于应用层；TCP和UDP属于传输层；IP属于网际层。TCP提供可靠、有序的字节流传输机制；UDP提供数据报服务，开销较小，但自身不保证可靠有序交付。UDP不可靠不等于“现实中发送的数据必定丢失”。OSI七层与TCP/IP四层不要混背。OSI模型中路由器的基本IP转发功能在网络层，普通以太网交换的基本功能在数据链路层；现实设备可能兼有其他功能。DNS把主机名解析到地址，一个域名可以有多个地址。邮件发送通常使用SMTP，接收常见POP3或IMAP。HTTPS通常在TLS上提供加密、完整性保护和服务器身份认证机制，默认端口443；HTTP默认端口80，显式写出的端口优先。"},{"id":"m5-protocol-s2","title":"带宽与速率","body":"网络带宽在基础题中通常指链路可提供的最大数据传输能力，实际吞吐率受拥塞、设备、协议开销等影响，未必达到带宽。Mbps中的小写b表示bit，每8 bit为1 Byte；换算下载时间先统一单位。题目若说明忽略开销，可按理想速率计算，否则不能把理想数值当实际测量结果。时延则描述传输所需时间，与容量指标不同。"},{"id":"m5-protocol-s3","title":"诊断方法","body":"127.0.0.1是常见IPv4回环地址，localhost通常解析到本机回环地址，测试本机协议栈不等于测试外部网络。ipconfig /all用于查看配置，ping常利用ICMP回显检测可达性；ping通IP而域名失败时，可优先检查DNS。ping超时还可能由过滤、对方不响应或网络故障造成，不能直接断定对方关机或拒绝所有连接。"}],"workedExamples":[{"title":"标准例题","prompt":"100 MB文件经100 Mbps链路传输，按十进制、忽略开销，至少多少秒？","steps":[{"text":"100 MB换算为800 Mb。"},{"text":"800除以100得到8。"}],"result":"8秒的理想传输时间。","exampleType":"standard","id":"m5-protocol-example-1"},{"title":"易错对照","prompt":"ping 127.0.0.1成功，是否说明能浏览互联网？","steps":[{"text":"回环测试主要涉及本机。"},{"text":"外部链路、网关和DNS可能仍有问题。"}],"result":"不能据此确认外网正常。","exampleType":"contrast","id":"m5-protocol-example-2"}],"pitfalls":["带宽不是当前实测吞吐率。","DNS把域名解析到地址，不负责把所有网络故障自动修好。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第73–79页"}]},"content":{"text":""}},{"id":"m5-web","stageId":"m5","type":"concept","title":"HTML、CSS、表单与URL","objectiveIds":["m5"],"knowledge":{"title":"HTML、CSS、表单与URL","summary":"对应真题：42","prerequisites":["知道浏览器是客户端，Web服务器负责提供资源。"],"mentalModel":"HTML安排内容结构，CSS控制外观样式，JavaScript常负责交互行为。浏览器标签标题与正文可见的大标题也是两种不同位置。","sections":[{"id":"m5-web-s1","title":"结构与样式","body":"HTML使用标签表达文档结构。title通常位于head中，用于文档标题，常出现在浏览器标签页；h1等标题标签位于正文，用于页面中显示的标题。CSS描述颜色、字体、布局和间距等样式，不能说只有CSS才能改变任何外观，但题目问网页外观样式设计技术时应识别CSS。图中圈出的浏览器标签文字应对应title，而不是看到“标题”就统一写h1。"},{"id":"m5-web-s2","title":"表单域","body":"input配合type属性定义常见输入控件。text用于普通单行文本，password以掩码形式显示输入，radio用于单选组，checkbox用于复选，submit用于提交。textarea适合多行文本。密码框的显示掩码不等于网络传输已经加密；要保护传输还需HTTPS等机制。用户看到的提示语可能是placeholder，并不一定是已填入的值。"},{"id":"m5-web-s3","title":"URL与服务器","body":"URL可包含方案、主机名、端口、路径、查询和片段；http与https表明不同访问方案，基础题中的默认端口分别是80与443。Apache HTTP Server、Nginx、IIS是常见Web服务器软件。主页名可能配置为index.html、index.htm等，不能假设所有服务器只能使用一个固定文件名。模拟题中示例域名用于辨认结构，不需要联网访问。"},{"id":"m5-web-s4","title":"相对URL定位","body":"在当前页面https://example.org/store/pages/list.html中，../images/a.png先回到store目录，再进入images，因此定位到https://example.org/store/images/a.png；以斜杠开头的/images/a.png则从站点根目录开始。相对路径的基准是当前页面所在目录，还可能受base标签影响，模拟题会明确未设置base。不要把Windows的反斜杠原样搬进网页URL。"}],"workedExamples":[{"title":"标准例题","prompt":"https://study.example.org:8443/course/index.html中方案、端口和路径是什么？","steps":[{"text":"方案为https。"},{"text":"显式端口8443优先于默认端口。"},{"text":"路径从主机后第一个斜杠开始。"}],"result":"https；8443；/course/index.html。","exampleType":"standard","id":"m5-web-example-1"},{"title":"易错对照","prompt":"输入框用password后，内容在网络上一定加密吗？","steps":[{"text":"password控制显示方式。"},{"text":"网络加密由传输安全机制等决定。"}],"result":"不一定。","exampleType":"contrast","id":"m5-web-example-2"}],"pitfalls":["title与h1分别定位标签页标题和正文标题。","HTTP/HTTPS方案与.html文件扩展名不是一回事。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第76、96页"},{"sourceId":"500","locator":"PDF第31–33页（旧版FrontPage仅作版本背景）"}]},"content":{"text":""}},{"id":"m5-practice","stageId":"m5","type":"quiz","title":"网络与网页基础 · 分层练习","objectiveIds":["m5"],"content":{"items":[{"id":"m5-practice-1","module":"m5","kind":"single","prompt":"UDP位于TCP/IP四层模型中的？","options":[{"id":"A","text":"应用层"},{"id":"B","text":"传输层"},{"id":"C","text":"网际层"},{"id":"D","text":"网络接口层"}],"answer":["B"],"explanation":"UDP与TCP同属于传输层，IP属于网际层。 应用层协议服务具体应用，IP处理网际寻址，网络接口层面向链路接入。UDP提供端到端的数据报服务，因此归入传输层。","feedback":{"correct":"判断正确。UDP与TCP同属于传输层，IP属于网际层。 应用层协议服务具体应用，IP处理网际寻址，网络接口层面向链路接入。UDP提供端到端的数据报服务，因此归入传输层。","incorrect":"需要调整判断。UDP与TCP同属于传输层，IP属于网际层。 应用层协议服务具体应用，IP处理网际寻址，网络接口层面向链路接入。UDP提供端到端的数据报服务，因此归入传输层。"},"practiceLevel":"guided","hintLadder":["按协议职责归类。"],"objectiveIds":["m5"],"novelTransfer":false},{"id":"m5-practice-2","module":"m5","kind":"single","prompt":"以下属于私有IPv4范围的是？","options":[{"id":"A","text":"172.15.9.1"},{"id":"B","text":"172.32.1.1"},{"id":"C","text":"172.31.255.1"},{"id":"D","text":"8.8.8.8"}],"answer":["C"],"explanation":"172私有范围第二段从16到31，31符合，15与32都越界。 172.15和172.32分别位于私有块下界外和上界外；8.8.8.8也不在题目列出的私有块。不要只凭172开头就判私有。","feedback":{"correct":"判断正确。172私有范围第二段从16到31，31符合，15与32都越界。 172.15和172.32分别位于私有块下界外和上界外；8.8.8.8也不在题目列出的私有块。不要只凭172开头就判私有。","incorrect":"需要调整判断。172私有范围第二段从16到31，31符合，15与32都越界。 172.15和172.32分别位于私有块下界外和上界外；8.8.8.8也不在题目列出的私有块。不要只凭172开头就判私有。"},"practiceLevel":"independent","hintLadder":["检查第二段完整边界。"],"objectiveIds":["m5"],"novelTransfer":false},{"id":"m5-practice-3","module":"m5","kind":"single","prompt":"服务器IP可ping通，域名访问失败，应优先检查？","options":[{"id":"A","text":"显示器"},{"id":"B","text":"DNS配置或解析"},{"id":"C","text":"文件名扩展名"},{"id":"D","text":"CPU字长"}],"answer":["B"],"explanation":"IP可达但域名失败提示可优先排查解析；并不据此证明只有一种原因。 显示器、扩展名和CPU字长不能直接解释名称解析失败。优先检查不等于证明唯一原因，还需按域名解析和应用访问逐步排查。","feedback":{"correct":"判断正确。IP可达但域名失败提示可优先排查解析；并不据此证明只有一种原因。 显示器、扩展名和CPU字长不能直接解释名称解析失败。优先检查不等于证明唯一原因，还需按域名解析和应用访问逐步排查。","incorrect":"需要调整判断。IP可达但域名失败提示可优先排查解析；并不据此证明只有一种原因。 显示器、扩展名和CPU字长不能直接解释名称解析失败。优先检查不等于证明唯一原因，还需按域名解析和应用访问逐步排查。"},"practiceLevel":"transfer","hintLadder":["区分地址通信与名称解析。"],"objectiveIds":["m5"],"novelTransfer":true}]}},{"id":"m6-model","stageId":"m6","type":"concept","title":"DB、DBMS、关系表与主键","objectiveIds":["m6"],"knowledge":{"title":"DB、DBMS、关系表与主键","summary":"对应真题：17","prerequisites":["把数据集合、管理软件和完整应用系统分开。"],"mentalModel":"数据库是被管理的数据，DBMS是管理它的软件，数据库系统还包括相关硬件、应用和人员。关系表中，横向一行是一条记录，纵向一列是一个属性。","sections":[{"id":"m6-model-s1","title":"概念与对象","body":"DB指数据库，DBMS指数据库管理系统，DBS指数据库系统；DBMS是系统的核心软件。Access、MySQL、Oracle、SQL Server是常见DBMS，Python是编程语言，不能只因能访问数据库就把它归类为DBMS。Access数据库可包含表、查询、窗体、报表等对象，表负责存储基础数据。不同版本使用.mdb或.accdb等格式，题目应说明版本或接受符合条件的格式。"},{"id":"m6-model-s2","title":"关系与字段","body":"关系模型常用二维表表达数据，一行称元组或记录，一列称属性或字段；属性可有取值范围。字段数与记录数是不同维度，不能按表格总单元格数回答记录数。关系模式描述表名及字段结构，表中的具体数据可不断变化。数据库降低冗余、提高共享与一致性，并不表示“冗余必定为零”或“用户可不经授权任意访问”。"},{"id":"m6-model-s3","title":"键与约束","body":"候选键可以唯一标识记录，主键是选定的一个候选键；主键可以由多个字段组成，通常要求唯一且非空。借阅或租赁表中，同一用户可能多次借物，用户编号通常不能单独唯一标识一次订单；订单编号更合适。外键用于关联其他表的键。判断键必须根据业务语义和约束，不能只看当前几行数据恰好不重复。"}],"workedExamples":[{"title":"标准例题","prompt":"借阅表有OrderID、UserID、BookID、BorrowDay，哪个更适合标识一次借阅？","steps":[{"text":"同一用户可能多次借阅。"},{"text":"同一本书也可能在不同时期被借阅。"},{"text":"订单编号按业务保证每次记录唯一。"}],"result":"OrderID。","exampleType":"standard","id":"m6-model-example-1"},{"title":"边界例题","prompt":"选课表中“学号”和“课程号”单独都重复，能组成主键吗？","steps":[{"text":"若同一学生同一课程最多一条选课记录，二者组合可以唯一。"},{"text":"若允许多次修读，还需考虑学期等条件。"}],"result":"在明确唯一约束下可以使用组合主键。","exampleType":"boundary","id":"m6-model-example-2"}],"pitfalls":["唯一性依业务规则，不只依眼前样本。","主键不是“只能由一个字段组成”。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第97–105页"}]},"content":{"text":""}},{"id":"m6-query","stageId":"m6","type":"concept","title":"SELECT、DISTINCT、聚合与分组过滤","objectiveIds":["m6"],"knowledge":{"title":"SELECT、DISTINCT、聚合与分组过滤","summary":"对应真题：18、29、37","prerequisites":["能读出表中的字段、记录和条件范围。"],"mentalModel":"查询可按“先挑记录，再按需要分组和汇总，最后输出字段”的思路理解。这是解释逻辑，不是声称数据库必须逐条按这一物理顺序执行。","sections":[{"id":"m6-query-s1","title":"筛选与区间","body":"SELECT指定输出字段，FROM指定来源表，WHERE限制记录。BETWEEN下界AND上界包含两端；IN列举的是若干离散值。分数BETWEEN70AND90包含70、82、90；IN(70,90)只包含70与90，不能替代整个区间。多个不等式应明确写字段名，并用AND或OR连接，不要照搬数学链式关系到SQL。"},{"id":"m6-query-s2","title":"去重与聚合","body":"DISTINCT对最终选出字段的组合去重，不是自动删除原表中的记录。SUM求和，AVG求平均，MAX/MIN求极值；COUNT(*)统计记录数，COUNT(字段)通常不统计该字段的NULL。NULL表示缺失或未知，判断常用IS NULL而不是与NULL作普通等号比较。示例中若所有值非空，SUM等于逐条相加，实际题目则需留意空值说明。"},{"id":"m6-query-s3","title":"WHERE与HAVING","body":"GROUP BY按指定字段分组，HAVING筛选分组后的结果；WHERE用于分组前记录筛选。统计每位用户借物总数并只保留总数至少3的用户，应对Number求SUM，再用HAVING限制这个总数。若只选择某时间范围内的记录，应先用WHERE限制时间。不要用WHERE SUM(Number)>=3取代分组后的条件，也不要误把一个组的总数当成原表记录数。"},{"id":"m6-query-s4","title":"输出排序","body":"ORDER BY按指定字段或表达式排列结果，ASC为升序，DESC为降序。例如按Score从高到低排列，末尾使用ORDER BY Score DESC。分组统计后也可以按汇总值排序，如ORDER BY SUM(Number) DESC；GROUP BY决定哪些记录属于同组，不能代替输出排序。没有ORDER BY时，不应保证结果按原表行序或某个字段有序。"}],"workedExamples":[{"title":"标准例题","prompt":"scores含70、60、90、82，查询闭区间70至90。","steps":[{"text":"条件写grade BETWEEN 70 AND 90。"},{"text":"70和90均被包含，82也符合。"}],"result":"返回70、90、82三条成绩。","exampleType":"standard","id":"m6-query-example-1"},{"title":"易错对照","prompt":"同一数据用grade IN (70,90)，结果相同吗？","steps":[{"text":"IN只匹配列表中的值。"},{"text":"82不在列表中。"}],"result":"只返回70和90。","exampleType":"contrast","id":"m6-query-example-2"}],"pitfalls":["BETWEEN包含端点，IN不是连续区间。","DISTINCT不修改原表；HAVING与WHERE作用阶段不同。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第99、105–106页"}]},"content":{"text":""}},{"id":"m6-dml","stageId":"m6","type":"concept","title":"INSERT、UPDATE、DELETE与Access方言","objectiveIds":["m6"],"knowledge":{"title":"INSERT、UPDATE、DELETE与Access方言","summary":"对应真题：44","prerequisites":["先识别新增、修改、删除哪个动作，再确定作用范围。"],"mentalModel":"数据修改语句必须同时回答“改哪张表”“改什么”“影响哪些记录”。省略条件往往扩大影响范围；日期和文本的写法还受SQL方言约束。","sections":[{"id":"m6-dml-s1","title":"新增记录","body":"INSERT INTO后给目标表及字段列表，VALUES按相同顺序给出对应值。明确列名更容易避免字段顺序变化造成错误。文本常量使用英文单引号；数字通常不加引号，但看起来全是数字的编号也可能是文本字段，要以字段类型为准。没有列名时，应为表中各字段按定义顺序给出值，不能用省略号表示一个真正可执行的完整语句。"},{"id":"m6-dml-s2","title":"修改与删除","body":"UPDATE结合SET指定新值，WHERE限制记录；DELETE FROM删除满足WHERE条件的记录。DELETE删除行，DROP TABLE删除表对象，二者不是同一动作。原表有多条同一用户记录时，按UserID删除会影响所有匹配记录；如果只删一次订单，应按唯一OrderID等条件定位。题目应明确要求删除哪一类记录。"},{"id":"m6-dml-s3","title":"方言边界","body":"Access SQL日期字面量常以#包围，例如#2026/10/07#；SQL Server等常见方言通常使用引号和相应日期转换规则。Access的LIKE通配符还可能随ANSI模式不同而变化，不能把*和?无条件套给所有数据库。模拟题将明确Access或标准SQL子集；对等价解法按其指定环境和实际语义判断，不把全角引号当成可直接执行的SQL符号。"}],"workedExamples":[{"title":"标准例题","prompt":"删除borrows中UserID为文本2025002的所有记录。","steps":[{"text":"动作是删除记录，不是删除表。"},{"text":"UserID是文本，使用直单引号。"}],"result":{"code":"DELETE FROM borrows WHERE UserID='2025002';"},"exampleType":"standard","id":"m6-dml-example-1"},{"title":"易错对照","prompt":"DELETE FROM borrows;与带WHERE的语句有何差别？","steps":[{"text":"无WHERE时没有记录筛选条件。"},{"text":"将影响表中全部记录，表结构仍存在。"}],"result":"删除所有记录；不是删除整个表对象。","exampleType":"contrast","id":"m6-dml-example-2"}],"pitfalls":["不要在可执行答案里保留省略号。","日期写法、文本引号与通配符都需说明方言。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第99、105–106页"},{"sourceId":"ms-insert","locator":"Syntax / Remarks"},{"sourceId":"ms-dates","locator":"Date literals"}]},"content":{"text":""}},{"id":"m6-practice","stageId":"m6","type":"quiz","title":"数据库与 SQL · 分层练习","objectiveIds":["m6"],"content":{"items":[{"id":"m6-practice-1","module":"m6","kind":"single","prompt":"关系表中的一列称为？","options":[{"id":"A","text":"元组"},{"id":"B","text":"字段"},{"id":"C","text":"记录"},{"id":"D","text":"数据库系统"}],"answer":["B"],"explanation":"列对应属性/字段，行对应元组/记录。 元组与记录都对应横向的一行；数据库系统比单张表更大的概念。题目问竖向一列，答案是字段，在关系模型中也称属性。","feedback":{"correct":"判断正确。列对应属性/字段，行对应元组/记录。 元组与记录都对应横向的一行；数据库系统比单张表更大的概念。题目问竖向一列，答案是字段，在关系模型中也称属性。","incorrect":"需要调整判断。列对应属性/字段，行对应元组/记录。 元组与记录都对应横向的一行；数据库系统比单张表更大的概念。题目问竖向一列，答案是字段，在关系模型中也称属性。"},"practiceLevel":"guided","hintLadder":["按横行和竖列分别判断。"],"objectiveIds":["m6"],"novelTransfer":false},{"id":"m6-practice-2","module":"m6","kind":"single","prompt":"条件BETWEEN 60 AND 80包含哪些端点？","options":[{"id":"A","text":"两个都不含"},{"id":"B","text":"只含60"},{"id":"C","text":"只含80"},{"id":"D","text":"两个都包含"}],"answer":["D"],"explanation":"SQL BETWEEN包含上下界；用IN(60,80)则只选两种值。 含端点还意味着中间的值也可入选。例如70满足该区间，而IN列举60和80时不包含70。两个条件在范围筛选中不能互换。","feedback":{"correct":"判断正确。SQL BETWEEN包含上下界；用IN(60,80)则只选两种值。 含端点还意味着中间的值也可入选。例如70满足该区间，而IN列举60和80时不包含70。两个条件在范围筛选中不能互换。","incorrect":"需要调整判断。SQL BETWEEN包含上下界；用IN(60,80)则只选两种值。 含端点还意味着中间的值也可入选。例如70满足该区间，而IN列举60和80时不包含70。两个条件在范围筛选中不能互换。"},"practiceLevel":"independent","hintLadder":["闭区间与离散集合不同。"],"objectiveIds":["m6"],"novelTransfer":false},{"id":"m6-practice-3","module":"m6","kind":"single","prompt":"每个用户借用件数总和至少5，应把SUM(Number)>=5放在哪里？","options":[{"id":"A","text":"SELECT之前"},{"id":"B","text":"WHERE中代替行筛选"},{"id":"C","text":"GROUP BY后的HAVING"},{"id":"D","text":"DELETE之后"}],"answer":["C"],"explanation":"先按用户分组，HAVING限制组内总和；WHERE用于分组前记录条件。 SUM是组内汇总值，需要先形成用户分组才能判断至少5。WHERE可先筛日期等原始记录条件，却不能直接替代这里的HAVING。","feedback":{"correct":"判断正确。先按用户分组，HAVING限制组内总和；WHERE用于分组前记录条件。 SUM是组内汇总值，需要先形成用户分组才能判断至少5。WHERE可先筛日期等原始记录条件，却不能直接替代这里的HAVING。","incorrect":"需要调整判断。先按用户分组，HAVING限制组内总和；WHERE用于分组前记录条件。 SUM是组内汇总值，需要先形成用户分组才能判断至少5。WHERE可先筛日期等原始记录条件，却不能直接替代这里的HAVING。"},"practiceLevel":"transfer","hintLadder":["先区分组与原始行。"],"objectiveIds":["m6"],"novelTransfer":true}]}},{"id":"m7-control","stageId":"m7","type":"concept","title":"变量类型、三种结构与分段建模","objectiveIds":["m7"],"knowledge":{"title":"变量类型、三种结构与分段建模","summary":"对应真题：21、31、39","prerequisites":["先把现实量映射成变量，明确单位和取值范围。"],"mentalModel":"程序求解先建立准确的规则，再把规则安排成可执行步骤。变量类型决定能表达什么值，控制结构决定步骤以什么顺序执行。","sections":[{"id":"m7-control-s1","title":"类型选择","body":"整型适合人数、件数等离散数量，浮点或其他适当实数表示适合带小数的平均值，布尔型表达真或假，字符或字符串表达文本。把可能有小数的平均成绩放入普通整型会损失信息。实际金融计算还可能选定点或十进制定点类型；考试问“整型、浮点型、字符型、布尔型中哪个最适合平均成绩”时通常选浮点型。不能因输出保留一位小数就认为所有内部数据必须先舍入。"},{"id":"m7-control-s2","title":"三种基本结构","body":"顺序结构按先后执行；选择结构根据条件执行不同分支；循环结构重复执行步骤。数组是数据组织方式，不是与顺序、选择、循环并列的基本控制结构。赋值更新变量当前值，不能把赋值语句当成普通数学恒等式。追踪变量时从初值出发，按语句实际顺序计算，不能把同一轮中的更新当成同时发生。"},{"id":"m7-control-s3","title":"分段规则","body":"先圈出阈值属于哪一档，再区分“累计阶梯”与“全量跳档”。对前100件0.5元、超出部分0.8元的累计补贴，未超过阈值时按原价；超过时前一段金额固定，再加新增部分。自然语言中的“不超过”“至少”“超过”分别影响小于等于、大于等于和大于等条件。写完伪代码用0、阈值、阈值加1三个输入检验。"}],"workedExamples":[{"title":"标准例题","prompt":"平均成绩可能为85.5，四种基础类型中选哪种？","steps":[{"text":"结果可能含小数。"},{"text":"整型不能完整表达这一平均值。"}],"result":"浮点型。","exampleType":"standard","id":"m7-control-example-1"},{"title":"边界例题","prompt":"补贴阈值100件，输入100件应该执行哪一档？","steps":[{"text":"题干说“不超过100”属于第一档。"},{"text":"第二档只适用于严格超过。"}],"result":"按100件每件0.5元，共50元。","exampleType":"boundary","id":"m7-control-example-2"}],"pitfalls":["数组是数据结构，不是控制结构。","分段题先处理边界，再写条件和表达式。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第82–84页"}]},"content":{"text":""}},{"id":"m7-loop","stageId":"m7","type":"concept","title":"循环追踪、数组扫描与流程图","objectiveIds":["m7"],"knowledge":{"title":"循环追踪、数组扫描与流程图","summary":"对应真题：45、46","prerequisites":["知道初值、循环条件、循环体、更新与输出五个要素。"],"mentalModel":"循环像逐页检查名单：先确定从哪页开始，再决定是否还有页，处理本页，最后移动到下一页。漏了移动步骤就可能永远停在同一页。","sections":[{"id":"m7-loop-s1","title":"手工追踪","body":"先建立变量表，逐轮记录循环开始时的变量、条件真假、循环体后的变量与输出。累加器常从0开始，连乘器常从1开始，计数器按已处理对象数量定义。先判断的循环可能一次也不执行；先执行后判断的循环至少执行一次。求首次超过容量时，在等于容量的时刻还应继续，不能将“超过”改为“达到”。"},{"id":"m7-loop-s2","title":"数组与极值","body":"扫描n个数据时，常设置索引从1到n或从0到n减1，必须全程一致。找最大值可先以第一项初始化，再从下一项比较，避免把最大值先设为0而漏掉全为负数的数组。若还要求对应编号，要同步保存数值和编号；删除元素并向前移动会改变位置，原始编号应另存或明确重编号规则。并列最大值保留首次或末次，取决于比较是否使用严格大于，应在题目中说明。"},{"id":"m7-loop-s3","title":"流程图规则","body":"圆角或终止符表示开始结束，矩形表示处理，平行四边形表示输入输出，菱形表示条件分支，箭头表示控制方向。条件的真与假两路都应明确，循环回边要回到合适的条件检查处。能画出漂亮方框不代表算法正确：还需检查初值、更新、终止条件和输出单位。模拟解析会同时给变量追踪表、伪代码和流程图，允许语义等价的画法。"}],"workedExamples":[{"title":"标准例题","prompt":"从1开始每半小时倍增，首次严格超过1000需要多久？","steps":[{"text":"第9轮数量512，还未超过。"},{"text":"第10轮数量1024，首次超过。"},{"text":"每轮0.5小时。"}],"result":"10轮，共5小时。","exampleType":"standard","id":"m7-loop-example-1"},{"title":"边界例题","prompt":"最大值初始设0，数组是负5、负2、负9，会出什么错？","steps":[{"text":"所有元素都不大于0。"},{"text":"程序可能错误保留0，而0不在数组里。"}],"result":"应以首元素等可靠方式初始化，正确最大值为负2。","exampleType":"boundary","id":"m7-loop-example-2"}],"pitfalls":["不要遗漏索引更新，也不要把n个元素扫描成n减1个。","严格超过与达到在阈值恰为增长序列某项时会差一轮。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第84–95页"}]},"content":{"text":""}},{"id":"m7-recursion","stageId":"m7","type":"interactive","title":"递归基例、返回值与调用次数","objectiveIds":["m7"],"knowledge":{"title":"递归基例、返回值与调用次数","summary":"对应真题：23","prerequisites":["理解一次函数调用会拥有自己的参数和返回位置。"],"mentalModel":"递归像把任务分给更小任务，再等待它们返回结果。返回的数值、创建的调用总次数和同时压在调用栈上的层数是三个不同的问题。","sections":[{"id":"m7-recursion-s1","title":"基例与递归分解","body":"基例直接返回，不再递归调用；递归分支把规模减小到最终可达基例。斐波那契递归在参数为1或2时返回1，其余情况返回前两项之和。缺少基例、规模不减或某些分支永远到不了基例，都可能导致无法正常结束。追踪应先画当前调用，再展开子调用，最后按返回顺序计算值。"},{"id":"m7-recursion-s2","title":"统计总调用","body":"计算调用次数时，基例本身也算一次调用；非基例的次数等于当前这一次，加上每个子调用的次数。输入5时，左右子树中的同名调用不能合并，因为普通无缓存递归会分别执行。若题目使用记忆化或迭代，实现和统计就会不同。原题问的是函数被调用的总次数，并非只问执行了几次加法。","formula":{"tex":"T(n)=1+T(n-1)+T(n-2)","spoken":"非基例的总调用次数包括当前调用和两个子调用","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>T<\/mi><mo>(<\/mo><mi>n<\/mi><mo>)<\/mo><mo>=<\/mo><mn>1<\/mn><mo>+<\/mo><mi>T<\/mi><mo>(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo>)<\/mo><mo>+<\/mo><mi>T<\/mi><mo>(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>2<\/mn><mo>)<\/mo><\/mrow><\/math>"}},{"id":"m7-recursion-s3","title":"与栈深度区分","body":"调用总数是在整个运行过程中累计的节点数；最大栈深度是某一时刻尚未返回的最长调用链。斐波那契返回值为5不代表调用5次，调用9次也不代表栈深9层。题目必须说明是否把主程序发起的第一次调用计入，模拟题默认计入并会在题干中写清。复杂度讨论也应明确无缓存朴素递归这个前提。"},{"id":"m7-recursion-lab","title":"用单支阶乘观察调用栈","body":"网页演示使用单支阶乘递归，与前面的双分支斐波那契分开。参数不大于1时返回1，否则递归求前一项再乘当前参数。输入4时依次进入4、3、2、1四个调用帧，再按1、2、6、24的顺序逐层返回，共调用4次，最大同时保留4帧。点击下一步观察入栈与返回，调大输入后先预测帧数，再核对。基例变成0会改变调用次数，不能把本演示的计数直接套给所有递归程序。"}],"workedExamples":[{"title":"标准例题","prompt":"朴素斐波那契的第1、2项均为1，计算第5项，含首次调用共调用几次？","steps":[{"text":"T(1)与T(2)均为1。"},{"text":"T(3)为3，T(4)为5。"},{"text":"T(5)为当前1次加T(4)的5次和T(3)的3次。"}],"result":"9次；返回数值为5。","exampleType":"standard","id":"m7-recursion-example-1"},{"title":"易错对照","prompt":"若只数非基例展开次数，f(5)是多少？","steps":[{"text":"f(5)、f(4)、两次f(3)是非基例节点。"},{"text":"其余5次是直接返回的基例调用。"}],"result":"4次非基例展开，不是总调用次数。","exampleType":"contrast","id":"m7-recursion-example-2"}],"pitfalls":["先读清统计的是返回值、总调用、加法次数还是栈深度。","同一参数被多次递归调用，不能擅自当作缓存结果复用。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第82–89页"}]},"content":{"widgetType":"recursion-lab","widgetConfig":{"model":"factorial","n":4,"min":1,"max":7,"baseCase":"参数不大于1时直接返回1。","recursiveCase":"参数较大时，返回当前参数乘以前一项的递归结果。"}}},{"id":"m7-complex","stageId":"m7","type":"concept","title":"顺序查找、二分查找与复杂度","objectiveIds":["m7"],"knowledge":{"title":"顺序查找、二分查找与复杂度","summary":"对应真题：22","prerequisites":["先确认数据是否有序，以及基本操作指比较还是其他动作。"],"mentalModel":"复杂度描述问题规模增长时，操作量按怎样的量级增长。它帮助比较扩展趋势，不是给出每台机器上精确相同的秒数。","sections":[{"id":"m7-complex-s1","title":"顺序查找","body":"顺序查找逐项比较，不要求数据有序。最坏情况下扫描全部n项，时间复杂度为线性量级；若目标在第一项，最好情况只比较一次。等概率成功且目标只出现一次时，平均比较次数可由1到n的比较次数取平均得到。不能在没有概率模型、未区分成功失败的情况下把某个平均值当作所有查找的固定次数。"},{"id":"m7-complex-s2","title":"二分查找","body":"二分查找通常要求在已排序且可方便定位中点的数据序列上执行。比较中点后保留可能包含目标的一半区间，不断缩小。必须确定升序或降序和中点取整规则；更新边界时要排除已比较过的中点，避免区间不缩小。对每次近乎减半的搜索，比较次数随规模呈对数量级增长。无序图书直接套二分查找不具备相同保证。"},{"id":"m7-complex-s3","title":"排序与模型","body":"冒泡排序通过相邻比较和交换逐轮把较大元素移到一端。普通未提前终止的实现常进行多轮比较；加入“本轮没有交换就停止”的优化后，已排序输入的表现不同。Big-O给出渐近上界描述，基础比较题常用来表达主要增长量级；不能把它当作精确时间，也不能只凭代码有两层循环就不看边界地断言一定平方级。"}],"workedExamples":[{"title":"标准例题","prompt":"升序数组5、13、19、21、37、56、64、75、80、88、92，二分查找21，中点向下取整。","steps":[{"text":"先比较第6项56，缩到左侧5项。"},{"text":"再比较第3项19，缩到第4至5项。"},{"text":"再比较第4项21。"}],"result":"共比较3次。","exampleType":"standard","id":"m7-complex-example-1"},{"title":"易错对照","prompt":"把无序数组任意分两半，按中点大小舍弃一半，能保证找到目标吗？","steps":[{"text":"无序时目标可能位于被舍弃的那一半。"},{"text":"中点大小不能提供整体顺序信息。"}],"result":"不能保证；先满足有序前提。","exampleType":"contrast","id":"m7-complex-example-2"}],"pitfalls":["比较次数、输入规模和运行秒数是不同量。","先说最坏、最好或平均情境，再比较复杂度。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第82–84页"}]},"content":{"text":""}},{"id":"m7-practice","stageId":"m7","type":"quiz","title":"算法与流程图 · 分层练习","objectiveIds":["m7"],"content":{"items":[{"id":"m7-practice-1","module":"m7","kind":"single","prompt":"以下哪项不是三种基本控制结构？","options":[{"id":"A","text":"顺序"},{"id":"B","text":"选择"},{"id":"C","text":"循环"},{"id":"D","text":"数组"}],"answer":["D"],"explanation":"数组是数据组织方式；顺序、选择、循环安排执行流程。 数组说明数据怎样组织，不说明下一步执行哪条语句。三种控制结构可以组合构成算法，数组则可被这些结构遍历与处理。","feedback":{"correct":"判断正确。数组是数据组织方式；顺序、选择、循环安排执行流程。 数组说明数据怎样组织，不说明下一步执行哪条语句。三种控制结构可以组合构成算法，数组则可被这些结构遍历与处理。","incorrect":"需要调整判断。数组是数据组织方式；顺序、选择、循环安排执行流程。 数组说明数据怎样组织，不说明下一步执行哪条语句。三种控制结构可以组合构成算法，数组则可被这些结构遍历与处理。"},"practiceLevel":"guided","hintLadder":["区分存储方式与执行方式。"],"objectiveIds":["m7"],"novelTransfer":false},{"id":"m7-practice-2","module":"m7","kind":"single","prompt":"朴素斐波那契的第1、2项均为1，其他为前两项之和，求第4项含首次调用共几次？","options":[{"id":"A","text":"3"},{"id":"B","text":"4"},{"id":"C","text":"5"},{"id":"D","text":"7"}],"answer":["C"],"explanation":"T(3)为3，T(4)为当前1次加T(3)的3次加T(2)的1次，共5。 第4项会调用第3项和第2项；第3项又调用第2项和第1项。同名基例分别执行，不能合并计数，也不能把返回值3当调用数。","feedback":{"correct":"判断正确。T(3)为3，T(4)为当前1次加T(3)的3次加T(2)的1次，共5。 第4项会调用第3项和第2项；第3项又调用第2项和第1项。同名基例分别执行，不能合并计数，也不能把返回值3当调用数。","incorrect":"需要调整判断。T(3)为3，T(4)为当前1次加T(3)的3次加T(2)的1次，共5。 第4项会调用第3项和第2项；第3项又调用第2项和第1项。同名基例分别执行，不能合并计数，也不能把返回值3当调用数。"},"practiceLevel":"independent","hintLadder":["基例调用也计数。"],"objectiveIds":["m7"],"novelTransfer":false},{"id":"m7-practice-3","module":"m7","kind":"single","prompt":"数量初始2，每轮翻倍，首次严格超过32，需要几轮？","options":[{"id":"A","text":"3"},{"id":"B","text":"4"},{"id":"C","text":"5"},{"id":"D","text":"6"}],"answer":["C"],"explanation":"四轮时恰为32，严格超过要再一轮到64，所以5轮。 每轮末的数量依次为4、8、16、32、64。把条件误写成达到32就停止会提前一轮；应用题应同步检查不等号方向和轮数。","feedback":{"correct":"判断正确。四轮时恰为32，严格超过要再一轮到64，所以5轮。 每轮末的数量依次为4、8、16、32、64。把条件误写成达到32就停止会提前一轮；应用题应同步检查不等号方向和轮数。","incorrect":"需要调整判断。四轮时恰为32，严格超过要再一轮到64，所以5轮。 每轮末的数量依次为4、8、16、32、64。把条件误写成达到32就停止会提前一轮；应用题应同步检查不等号方向和轮数。"},"practiceLevel":"transfer","hintLadder":["达到与超过在相等时差一轮。"],"objectiveIds":["m7"],"novelTransfer":true}]}},{"id":"m8-sec","stageId":"m8","type":"concept","title":"病毒、防火墙、身份认证与访问控制","objectiveIds":["m8"],"knowledge":{"title":"病毒、防火墙、身份认证与访问控制","summary":"对应真题：16、30、36","prerequisites":["分别问：是谁、允许做什么、发生了什么。"],"mentalModel":"身份认证核实主体身份，访问控制限制操作权限，审计记录可追溯事件。安全依赖多层措施，任何单一软件都不能保证抵御所有威胁。","sections":[{"id":"m8-sec-s1","title":"病毒与恶意软件","body":"计算机病毒是恶意代码的一类，其传播常与自我复制和附着感染机制有关，可通过受感染文件、可移动介质等途径传播。恶意软件不只病毒，还包括木马、蠕虫、勒索软件等；不能把所有木马都说成必定自我复制。病毒可能影响文档与宏等，不能只认为可执行文件才有风险。移动设备也可能受到恶意软件攻击。"},{"id":"m8-sec-s2","title":"安全控制的分工","body":"身份认证确认登录者或设备是谁，访问控制决定其可访问资源和操作，审计保存活动记录用于检查。验证员工终端准入、限定共享目录读写权限、划分资源安全等级，都与访问控制策略相关。采用最小权限原则，仅授予完成任务所需权限；管理员权限并不是普通办公软件必须具备的条件。"},{"id":"m8-sec-s3","title":"防火墙与备份","body":"防火墙按策略控制允许与阻止的通信，可以由软件或硬件等方式实现，但不能保证阻止所有网络攻击、自动清除已有病毒或纠正用户泄露密码。更新、备份、谨慎处理附件、身份认证和权限管理应协同使用。加密帮助保护机密性，数字签名用于支持来源真实性与完整性验证，二者也不能互相替代。备份还需考虑可恢复性和与源数据的隔离。多因素认证组合不同类别的因素，例如密码属于知识因素，硬件令牌属于持有因素；输入两次密码仍不是两个不同类别。数字签名通常用私钥签名、相应公钥验证，帮助核验来源和签名后完整性，不自动加密正文，也不保证正文中的商业说法属实。"}],"workedExamples":[{"title":"标准例题","prompt":"员工只能读取公共资料，财务人员能修改工资表，这属于哪类策略？","steps":[{"text":"区分“核实身份”与“授权操作”。"},{"text":"限制的是资源和操作范围。"}],"result":"访问控制。","exampleType":"standard","id":"m8-sec-example-1"},{"title":"易错对照","prompt":"安装防火墙后是否可以随意打开不明附件？","steps":[{"text":"防火墙控制的主要是网络通信。"},{"text":"恶意附件可能利用其他路径或被用户主动执行。"}],"result":"仍需谨慎，不能把防火墙当作全面免疫。","exampleType":"contrast","id":"m8-sec-example-2"}],"pitfalls":["认证、授权和审计分别回答不同问题。","自我复制是病毒相关特征，不能无条件推广到所有恶意软件。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第112–113页"}]},"content":{"text":""}},{"id":"m8-cloud","stageId":"m8","type":"concept","title":"云服务模式与物联网识别","objectiveIds":["m8"],"knowledge":{"title":"云服务模式与物联网识别","summary":"对应真题：24、25","prerequisites":["先看购买的服务层次，再看感知、传输和应用三个环节。"],"mentalModel":"云服务可以按“租基础资源、租开发平台、直接用软件”区分。物联网则把现实对象的数据采集与联网应用连接起来。","sections":[{"id":"m8-cloud-s1","title":"IaaS、PaaS与SaaS","body":"IaaS提供计算、存储、网络等基础资源，例如虚拟机和虚拟化服务器；PaaS提供应用开发与部署平台能力；SaaS提供可直接使用的软件应用。题目希望避免购买硬件而租用虚拟服务器，重点是IaaS。某些实际产品同时提供多个层次，分类须依据题干具体购买的能力，不能只记某个商业产品永远只属于一类。"},{"id":"m8-cloud-s2","title":"部署与服务别混","body":"公有云、私有云、混合云描述部署或使用组织方式；IaaS、PaaS、SaaS描述服务交付层次，二者是不同维度。按需使用和弹性伸缩是云计算常见特征，但不意味着任何网络、权限或备份问题都由云自动解决。用户仍需按所用服务承担相应的配置与数据保护责任。"},{"id":"m8-cloud-s3","title":"物联网与识别","body":"物联网基础模型常分为感知层、网络层和应用层。RFID利用射频方式识别标签，适合运动员芯片计时、仓储标签等场景；二维码通常需要光学识别，GPS主要用于定位。NFC属于近距离无线通信技术，其应用范围与常见远距离RFID计时场景不同。不要因都能识别对象，就忽略通信距离、读写方式和实际使用场景。"}],"workedExamples":[{"title":"标准例题","prompt":"公司租用云虚拟机，自行安装系统和业务软件，属于哪类服务？","steps":[{"text":"购买的是基础计算资源。"},{"text":"并非直接使用成品应用。"}],"result":"IaaS。","exampleType":"standard","id":"m8-cloud-example-1"},{"title":"易错对照","prompt":"公有云是否就是SaaS的另一名称？","steps":[{"text":"公有云是部署维度。"},{"text":"SaaS是服务交付层次。"}],"result":"不是，同一公有云环境可提供不同服务层次。","exampleType":"contrast","id":"m8-cloud-example-2"}],"pitfalls":["服务模式与部署模式分别分类。","芯片标签计时优先识别RFID，不把GPS定位与射频识别混写。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第107–110页"}]},"content":{"text":""}},{"id":"m8-media","stageId":"m8","type":"concept","title":"多媒体、数字水印与AI使用边界","objectiveIds":["m8"],"knowledge":{"title":"多媒体、数字水印与AI使用边界","summary":"对应真题：19、26","prerequisites":["分清保护来源、压缩体积与改变文件格式三种目标。"],"mentalModel":"同一张图像可以被压缩、转换格式，也可以嵌入水印；处理动作解决的目标不同，不能因都修改了文件就把技术名称混为一谈。","sections":[{"id":"m8-media-s1","title":"媒体与压缩","body":"多媒体可以综合文字、图形、图像、声音和视频等信息，数字化后最终以二进制形式存储与处理。无损压缩允许恢复原始数据，有损压缩通过舍弃部分信息换取更高压缩效率。图像分辨率、颜色深度、音频采样率与采样精度等影响未压缩数据量。计算存储量时要说明是否压缩、是否忽略文件头，不能仅凭扩展名推断固定压缩率。"},{"id":"m8-media-s2","title":"数字水印","body":"水印可将与来源或权利相关的信息嵌入媒体，既可见，也可不可见；题目描述“肉眼不可见，但特定算法可识别的标记”时，应识别为数字水印。视频格式转换改变容器或编码方式，压缩主要减少数据量，它们都不等于嵌入来源标记。水印的检测与耐受性依具体实现，不应声称任意水印都绝对无法去除或必定证明所有权。"},{"id":"m8-media-s3","title":"AI与数据责任","body":"人工智能可用于语音识别、机器翻译、图像识别和推荐等，但结果仍需根据场景核验。公开可获取的数据，不等于作者已经放弃版权、隐私或使用条件。判断题中的“公开数据训练模型无需考虑版权”过于绝对，应判错并说明仍需检查来源、授权和适用规则。本复习材料只考一般责任意识，不给具体法律个案结论，也不以某个模型名代替算法原理。区块链的防篡改机制针对账本记录的维护，不自动保证首次输入的产地或身份信息真实。AI生成的题名、作者、DOI等也要到可靠来源核验，形式完整不能代替真实性。"}],"workedExamples":[{"title":"标准例题","prompt":"视频中嵌入不可见、可由特定算法识别的来源标记，是什么技术？","steps":[{"text":"目标是嵌入可识别信息。"},{"text":"不是单纯缩小体积或改变扩展名。"}],"result":"数字水印。","exampleType":"standard","id":"m8-media-example-1"},{"title":"易错对照","prompt":"网页上无需登录就能下载的图片，能否直接认定可任意用于训练和再发布？","steps":[{"text":"公开访问与授权是不同条件。"},{"text":"仍需检查许可、权利和用途限制。"}],"result":"不能直接认定。","exampleType":"contrast","id":"m8-media-example-2"}],"pitfalls":["公开可见不等于无条件授权。","水印与压缩、加密、格式转换分别解决不同问题。"],"takeaway":"先辨认题目条件，再选择方法；用一个边界值检查结果。","citations":[{"sourceId":"core","locator":"PDF第7–8、107–113页"}]},"content":{"text":""}},{"id":"m8-practice","stageId":"m8","type":"quiz","title":"信息安全与新技术 · 分层练习","objectiveIds":["m8"],"content":{"items":[{"id":"m8-practice-1","module":"m8","kind":"single","prompt":"租用虚拟机并自行部署业务软件，通常对应？","options":[{"id":"A","text":"IaaS"},{"id":"B","text":"PaaS"},{"id":"C","text":"SaaS"},{"id":"D","text":"RFID"}],"answer":["A"],"explanation":"租的是基础计算资源，属于IaaS。 PaaS侧重开发部署平台，SaaS交付可直接使用的软件，RFID是识别技术。题干明确自行部署，购买的是底层虚拟计算资源。","feedback":{"correct":"判断正确。租的是基础计算资源，属于IaaS。 PaaS侧重开发部署平台，SaaS交付可直接使用的软件，RFID是识别技术。题干明确自行部署，购买的是底层虚拟计算资源。","incorrect":"需要调整判断。租的是基础计算资源，属于IaaS。 PaaS侧重开发部署平台，SaaS交付可直接使用的软件，RFID是识别技术。题干明确自行部署，购买的是底层虚拟计算资源。"},"practiceLevel":"guided","hintLadder":["判断交付的是资源、开发平台还是成品应用。"],"objectiveIds":["m8"],"novelTransfer":false},{"id":"m8-practice-2","module":"m8","kind":"single","prompt":"把员工权限限定为只能读取共享文档，主要属于？","options":[{"id":"A","text":"身份认证"},{"id":"B","text":"访问控制"},{"id":"C","text":"数据压缩"},{"id":"D","text":"图像采样"}],"answer":["B"],"explanation":"限制允许的资源和操作是访问控制；认证关注主体身份。 身份认证回答使用者是谁，访问控制回答允许访问什么和执行什么；压缩与采样不管理操作权限。限制写权限属于授权规则。","feedback":{"correct":"判断正确。限制允许的资源和操作是访问控制；认证关注主体身份。 身份认证回答使用者是谁，访问控制回答允许访问什么和执行什么；压缩与采样不管理操作权限。限制写权限属于授权规则。","incorrect":"需要调整判断。限制允许的资源和操作是访问控制；认证关注主体身份。 身份认证回答使用者是谁，访问控制回答允许访问什么和执行什么；压缩与采样不管理操作权限。限制写权限属于授权规则。"},"practiceLevel":"independent","hintLadder":["问“你是谁”还是“你能做什么”。"],"objectiveIds":["m8"],"novelTransfer":false},{"id":"m8-practice-3","module":"m8","kind":"single","prompt":"视频中添加不可见但算法可识别的来源标记，对应？","options":[{"id":"A","text":"无损压缩"},{"id":"B","text":"格式转换"},{"id":"C","text":"数字水印"},{"id":"D","text":"网关配置"}],"answer":["C"],"explanation":"嵌入标记以支持来源识别是数字水印，压缩和格式转换目标不同。 无损压缩减少数据量并可恢复原数据；格式转换改变表示形式；网关配置处理网络转发。题干的目的在嵌入可识别标记。","feedback":{"correct":"判断正确。嵌入标记以支持来源识别是数字水印，压缩和格式转换目标不同。 无损压缩减少数据量并可恢复原数据；格式转换改变表示形式；网关配置处理网络转发。题干的目的在嵌入可识别标记。","incorrect":"需要调整判断。嵌
