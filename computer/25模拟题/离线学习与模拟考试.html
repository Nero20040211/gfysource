svg>"}],"revision":"flowchart-applications-r2"},{"id":"C","title":"2025重庆专升本计算机模拟卷C","duration_minutes":120,"questions":[{"number":1,"type":"single","module":"m1","topicId":"m1-system","points":2,"stem":"某程序的指令和数据都先送入内存，CPU按指令顺序取出执行。这个过程主要体现冯·诺依曼计算机的哪项基本思想？","answer_text":"A．存储程序","explanation":["指令先存储，再由控制器依次取指和执行，体现存储程序思想。","程序与数据均以二进制形式表示，存于存储器中。"],"pitfall":"不要把存储程序误解为只保存数据文件。","options":["存储程序","用十进制存储全部信息","必须联网运行","用显示器代替运算器"],"correct":0,"option_explanations":["正确，题设的先存后执行正是存储程序。","内部采用二进制，而非十进制。","是否联网不是该体系的基本要求。","显示器是输出设备，不能替代运算器。"]},{"number":2,"type":"single","module":"m1","topicId":"m1-system","points":2,"stem":"学校新装电脑，先安装Windows，再安装工资统计软件。按软件用途分类，二者依次属于哪类？","answer_text":"B．系统软件、应用软件","explanation":["Windows管理硬件资源并提供运行环境，属于系统软件。","工资统计软件完成特定业务，属于应用软件。"],"pitfall":"分类依据是用途，不是安装先后。","options":["应用软件、系统软件","系统软件、应用软件","系统软件、系统软件","应用软件、应用软件"],"correct":1,"option_explanations":["顺序颠倒。","两类用途与题设对应。","工资统计软件不管理系统基础资源。","Windows不属于特定业务应用软件。"]},{"number":3,"type":"single","module":"m1","topicId":"m1-encoding","points":2,"stem":"已知ASCII码中字符'0'的十进制值为48。字符'7'的十进制值为多少？","answer_text":"C．55","explanation":["数字字符在ASCII码表中连续排列。","'7'相对'0'偏移7，所以48+7=55。"],"pitfall":"区分数字7与字符7的编码。","options":["7","48","55","57"],"correct":2,"option_explanations":["字符的编码不是其表示的数值。","48对应字符0。","48+7=55。","57对应字符9。"]},{"number":4,"type":"single","module":"m1","topicId":"m1-radix","points":2,"stem":"将十进制数45转换成二进制数，结果为哪项？","answer_text":"A．101101","explanation":["45=32+8+4+1。","按32、16、8、4、2、1排列各位，得到101101。"],"pitfall":"按位权复核，不要倒置余数顺序。","options":["101101","110101","101011","111001"],"correct":0,"option_explanations":["32+8+4+1=45。","32+16+4+1=53。","32+8+2+1=43。","32+16+8+1=57。"]},{"number":5,"type":"single","module":"m1","topicId":"m1-storage","points":2,"stem":"某单色字库存储24×24点阵汉字，每个点用1位表示，不计索引及其他开销。存储一个汉字需要多少字节？","answer_text":"D．72","explanation":["点数为24×24=576点，对应576位。","8位组成1字节，576÷8=72字节。"],"pitfall":"点阵先算位，再换算字节。","options":["24","48","576","72"],"correct":3,"option_explanations":["只计了一行的点数。","没有正确按点数除以8。","576是位数而非字节数。","576位等于72字节。"]},{"number":6,"type":"single","module":"m3","topicId":"m3-format","points":2,"stem":"在Word中要将某段落的字体和段落格式连续复制到三处不相邻文本，哪种操作最合适？","answer_text":"B．双击格式刷，再依次刷选目标","explanation":["先选中具有目标格式的文字或段落，双击格式刷可以连续应用。","依次刷选三处后按Esc退出格式刷。"],"pitfall":"单击格式刷通常只应用一次。","options":["单击保存按钮三次","双击格式刷，再依次刷选目标","只按Ctrl+C后单击目标","单击格式刷后立即按Esc"],"correct":1,"option_explanations":["保存不复制格式。","双击使格式刷保持可连续使用。","复制操作还需粘贴，且不是连续刷格式的方式。","Esc会退出格式刷。"]},{"number":7,"type":"single","module":"m3","topicId":"m3-mail","points":2,"stem":"用同一份录取通知书模板，为表格中的不同考生生成各自姓名和专业的通知书，应采用哪项功能？","answer_text":"D．邮件合并","explanation":["通知书固定内容放在主文档中。","姓名和专业来自数据源，以合并域插入后批量生成个性化文档。"],"pitfall":"邮件合并不要求实际通过电子邮件发送。","options":["修订","拆分窗口","目录更新","邮件合并"],"correct":3,"option_explanations":["修订记录文档改动。","拆分窗口只改变查看方式。","目录更新依据标题生成目录。","邮件合并对应一个模板加多条记录。"]},{"number":8,"type":"single","module":"m3","topicId":"m3-ppt","points":2,"stem":"PowerPoint中，教师想直接从当前第6张幻灯片开始全屏放映，通常使用哪组快捷键？","answer_text":"B．Shift+F5","explanation":["F5从第一张开始放映。","Shift+F5从当前幻灯片开始放映。"],"pitfall":"分清从头放映与从当前页放映。","options":["F5","Shift+F5","Ctrl+S","Esc"],"correct":1,"option_explanations":["从第一张开始，不符合当前页条件。","从当前页开始。","用于保存。","用于结束放映。"]},{"number":9,"type":"single","module":"m4","topicId":"m4-text","points":2,"stem":"Excel中A2存有文本“CQ2025-078”，公式=MID(A2,3,4)的结果是什么？","answer_text":"A．2025","explanation":["MID的参数依次为文本、起始位置、字符数。","位置从1开始，第3至第6个字符为2025。"],"pitfall":"Excel文本函数的位置从1开始。","options":["2025","CQ20","025-","078"],"correct":0,"option_explanations":["从第3个字符取4个，得到2025。","从第1个字符开始才得到CQ20。","这是从第4个字符开始取4个。","末尾3位不是题设截取范围。"]},{"number":10,"type":"single","module":"m4","topicId":"m4-ref","points":2,"stem":"Excel中将C3的公式=$A3*B$1向右下方复制到D4，公式变为什么？","answer_text":"D．=$A4*C$1","explanation":["复制位置右移1列、下移1行。","$A3固定A列，行号变为4；B$1固定第1行，列号变为C。"],"pitfall":"美元符号只固定它紧接着的列或行。","options":["=$A3*B$1","=A4*C1","=$B4*C$2","=$A4*C$1"],"correct":3,"option_explanations":["相对部分必须随复制变化。","丢失了原有的绝对引用标记。","固定的A列和第1行不应变化。","两处固定方向均正确。"]},{"number":11,"type":"single","module":"m4","topicId":"m4-macro","points":2,"stem":"某Excel工作簿含有需要保留的VBA宏。保存为哪种格式最合适？","answer_text":"D．.xlsm","explanation":["xlsm是启用宏的Excel工作簿格式。","xlsx不保存VBA宏；txt和csv主要保存文本数据，不能保留宏。"],"pitfall":"扩展名与宏能否保留有关。","options":[".xlsx",".csv",".txt",".xlsm"],"correct":3,"option_explanations":["普通xlsx不能保留VBA宏。","CSV不能保存VBA宏。","文本文件不能保存工作簿宏。","xlsm支持保存VBA宏。"]},{"number":12,"type":"single","module":"m5","topicId":"m5-layers","points":2,"stem":"普通二层以太网交换机主要依据MAC地址转发帧，它主要工作在OSI哪一层？","answer_text":"C．数据链路层","explanation":["MAC地址和帧属于数据链路层概念。","普通二层交换机通过MAC地址表选择转发端口。"],"pitfall":"题设限定普通二层交换机，避免与三层交换机混淆。","options":["物理层","网络层","数据链路层","应用层"],"correct":2,"option_explanations":["物理层主要传送比特。","路由器依据IP地址转发分组属于网络层。","依据MAC转发帧对应数据链路层。","应用层提供具体网络应用服务。"]},{"number":13,"type":"single","module":"m5","topicId":"m5-protocol","points":2,"stem":"在TCP/IP协议体系中，负责可靠传输并使用端口号区分应用进程的TCP属于哪一层？","answer_text":"A．运输层","explanation":["TCP通过确认、重传等机制实现可靠传输。","TCP与UDP属于运输层，IP属于网际层。"],"pitfall":"端口号不是IP地址，二者作用层次不同。","options":["运输层","应用层","网际层","网络接口层"],"correct":0,"option_explanations":["TCP是运输层协议。","HTTP、DNS等属于应用层。","IP是网际层协议。","以太网等位于网络接口层。"]},{"number":14,"type":"single","module":"m5","topicId":"m5-web","points":2,"stem":"在浏览器访问学校网站时，直接响应HTTP请求并返回网页内容的软件应是哪项？","answer_text":"C．Web服务器软件","explanation":["浏览器是客户端，Web服务器软件接收HTTP请求并返回资源。","例如网站服务器上的Web服务程序承担这一角色。"],"pitfall":"服务器可指机器，也可指提供服务的软件；此题问软件。","options":["磁盘碎片整理程序","拼音输入法","Web服务器软件","打印驱动程序"],"correct":2,"option_explanations":["整理程序用于磁盘维护。","输入法用于文字输入。","符合HTTP服务角色。","打印驱动负责打印设备。"]},{"number":15,"type":"single","module":"m5","topicId":"m5-security","points":2,"stem":"单位防火墙只允许访问指定服务器的指定端口。它最直接实现的作用是什么？","answer_text":"A．按安全规则控制网络通信","explanation":["防火墙按地址、端口等规则允许或拒绝通信。","访问控制不能替代杀毒、备份和账号安全管理。"],"pitfall":"安全设备提供特定防护，不提供绝对安全保证。","options":["按安全规则控制网络通信","保证所有文件绝无病毒","自动恢复所有丢失数据","使每个账号密码永不泄露"],"correct":0,"option_explanations":["对应防火墙的流量过滤作用。","防火墙不能保证所有文件无病毒。","数据恢复主要依靠备份等措施。","密码仍可能因钓鱼等原因泄露。"]},{"number":16,"type":"single","module":"m6","topicId":"m6-model","points":2,"stem":"在关系数据库中，一张“课程”表中的一行完整课程信息通常称为什么？","answer_text":"B．记录","explanation":["关系表的行表示一条记录，也称元组。","列表示字段，也称属性。"],"pitfall":"分清行与列的术语。","options":["字段","记录","数据库","索引"],"correct":1,"option_explanations":["字段对应列。","记录对应行。","数据库可包含多张表等对象。","索引用于提高检索效率等。"]},{"number":17,"type":"single","module":"m6","topicId":"m6-key","points":2,"stem":"学生表中姓名允许重名，学号规定每人唯一且不得为空。最适合设为主键的是哪一字段？","answer_text":"C．学号","explanation":["主键用于唯一标识记录，不能重复且不能为Null。","学号满足这些约束，姓名等字段不满足。"],"pitfall":"“看起来有区别”不等于具有唯一性约束。","options":["姓名","性别","学号","班级"],"correct":2,"option_explanations":["姓名允许重复。","性别不能唯一标识学生。","学号唯一且不为空。","一个班级有多人。"]},{"number":18,"type":"single","module":"m6","topicId":"m6-select","points":2,"stem":"Access默认ANSI-89通配符模式下，查找姓名以‘陈’开头的记录，WHERE条件应是哪项？","answer_text":"A．姓名 LIKE '陈*'","explanation":["ANSI-89中*匹配任意数量字符，?只匹配一个字符。","'陈*'表示以陈开头；等号不会将*解释为通配符。"],"pitfall":"Access默认ANSI-89用*，不要套用ANSI-92中的%。","options":["姓名 LIKE '陈*'","姓名 LIKE '*陈'","姓名 LIKE '陈?'","姓名 = '陈*'"],"correct":0,"option_explanations":["匹配以陈开头的姓名，含后续任意长度。","匹配以陈结尾。","只允许陈后恰好一个字符。","等号按字面量比较。"]},{"number":19,"type":"single","module":"m7","topicId":"m7-media","points":2,"stem":"一幅640×480像素、24位真彩色未压缩图像，不计文件头，数据量是多少KiB？（1 KiB=1024 B）","answer_text":"D．900","explanation":["每像素24÷8=3字节。","640×480×3=921600 B；除以1024得到900 KiB。"],"pitfall":"色深是每像素位数。","options":["300","600","7200","900"],"correct":3,"option_explanations":["相当于每像素只用1字节。","相当于每像素只用2字节。","7200是按位数除以1024，未转字节。","24位即3字节，结果900 KiB。"]},{"number":20,"type":"single","module":"m7","topicId":"m7-media","points":2,"stem":"采用44.1 kHz采样率、16位量化、单声道记录10秒未压缩PCM音频，不计文件头，数据量是多少字节？","answer_text":"C．882000","explanation":["每秒44100个采样，每个采样16÷8=2字节。","单声道10秒共44100×2×1×10=882000字节。"],"pitfall":"kHz换成每秒采样次数，单声道因子为1。","options":["441000","1764000","882000","7056000"],"correct":2,"option_explanations":["漏乘每采样2字节。","这是双声道的数据量。","采样率×量化位数÷8×声道数×时长。","这是位数，未除以8。"]},{"number":21,"type":"single","module":"m7","topicId":"m7-newtech","points":2,"stem":"城市交通平台同时处理定位轨迹、道路视频和刷卡记录。题设最直接体现大数据的哪项特征？","answer_text":"B．类型多样","explanation":["轨迹、视频、交易记录具有不同结构和表示形式。","这些差异体现数据类型多样性，不代表准确性有绝对保证。"],"pitfall":"大数据特征不等于质量保证。","options":["数据必然完全正确","类型多样","数据只可人工处理","数据永远不更新"],"correct":1,"option_explanations":["大数据仍可能含噪声或错误。","多源多形式对应类型多样。","大数据通常依赖计算机处理。","交通数据持续产生与更新。"]},{"number":22,"type":"single","module":"m7","topicId":"m7-newtech","points":2,"stem":"系统先用大量已标注猫狗图片训练模型，再识别新图片。其主要采用哪类技术？","answer_text":"C．机器学习","explanation":["训练数据包含图片及类别标签，模型学习图像与类别之间的关系。","对未见图片作分类是机器学习的典型应用。"],"pitfall":"自动完成任务不代表任何自动程序都属于机器学习。","options":["文件压缩","磁盘格式化","机器学习","数据备份"],"correct":2,"option_explanations":["压缩减少存储量。","格式化用于建立文件系统。","通过样本训练模型再预测。","备份用于保留副本。"]},{"number":23,"type":"single","module":"m7","topicId":"m7-newtech","points":2,"stem":"某单位无需管理服务器或安装办公软件，只通过浏览器订阅并使用在线文档服务。这最符合哪种云服务模式？","answer_text":"D．SaaS","explanation":["SaaS向用户提供可直接使用的软件服务。","IaaS主要提供基础计算资源，PaaS主要提供开发运行平台。"],"pitfall":"依据用户获得的服务层次判断。","options":["IaaS","PaaS","本地离线存储","SaaS"],"correct":3,"option_explanations":["IaaS通常需用户管理系统及应用。","PaaS面向应用开发与部署平台。","题设通过网络使用订阅服务。","在线文档是直接使用的软件服务。"]},{"number":24,"type":"single","module":"m8","topicId":"m8-method","points":2,"stem":"为了找出三位数中各位数字之和为12的所有数，程序依次检查100到999的每个整数并保留满足条件者。这属于哪种方法？","answer_text":"B．枚举法","explanation":["候选范围有限，逐个尝试并检查条件，是枚举法。","只要遍历全部候选并判断正确，就不会遗漏符合条件者。"],"pitfall":"枚举的重点是候选范围及筛选条件。","options":["二分查找","枚举法","冒泡排序","递归调用"],"correct":1,"option_explanations":["没有对半缩小查找范围。","逐一试验全部候选符合枚举定义。","没有交换相邻元素进行排序。","没有函数调用自身。"]},{"number":25,"type":"single","module":"m3","topicId":"m3-ppt","points":2,"stem":"在PowerPoint放映时单击“返回目录”文字跳到本演示文稿第2张幻灯片，应为文字设置什么？","answer_text":"A．指向第2张幻灯片的超链接","explanation":["选中文字，插入超链接，选择本文档中的位置及第2张幻灯片。","放映中单击该文字即可跳转；下划线本身不建立链接。"],"pitfall":"可点击的跳转必须有链接或相应动作设置。","options":["指向第2张幻灯片的超链接","仅设置字体下划线","仅设置切换声音","仅设置页码"],"correct":0,"option_explanations":["超链接能指定文稿内部目标。","下划线只是字符格式。","切换声音不指定跳转目标。","页码只用于标识页数。"]},{"number":26,"type":"judge","module":"m5","topicId":"m5-media","points":2,"stem":"双绞线和光纤属于有线传输介质，无线局域网通过无线电波传输信息。","answer_text":"正确","explanation":["有线传输依托实体线缆；无线传输不以线缆连接两端。","光纤虽然传光信号，仍属于有线介质。"],"pitfall":"传输信号是光不意味着无线。","correct":true,"correction":"双绞线、光纤属于有线介质，无线局域网使用无线电波。"},{"number":27,"type":"judge","module":"m3","topicId":"m3-table","points":2,"stem":"Word表格中用=SUM(ABOVE)求上方数据之和后，若上方数值被修改，公式结果通常需要更新域才能反映新值。","answer_text":"正确","explanation":["Word表格公式结果以域形式存储。","它不像Excel那样通常随单元格变化自动重算，修改后应更新域。"],"pitfall":"不要把Excel的自动重算习惯直接套到Word表格。","correct":true,"correction":"修改源数值后可选中公式域按F9更新结果。"},{"number":28,"type":"judge","module":"m6","topicId":"m6-group","points":2,"stem":"在Access SQL中，查询各部门平均工资并只保留平均工资超过5000的部门，可以先GROUP BY部门，再用HAVING AVG(工资)>5000筛选组。","answer_text":"正确","explanation":["WHERE主要筛选参与分组的原始记录。","HAVING可以使用聚合表达式，对分组后的平均值进行筛选。"],"pitfall":"不要把聚合条件直接写在WHERE中。","correct":true,"correction":"Access SQL可用GROUP BY分组，再用HAVING AVG(工资)>5000筛选分组结果。"},{"number":29,"type":"judge","module":"m7","topicId":"m7-media","points":2,"stem":"只要对多媒体文件进行压缩，解压后就一定能逐位恢复全部原始数据。","answer_text":"错误","explanation":["压缩分无损和有损两类。","有损压缩会舍弃部分信息，换取更高压缩率。"],"pitfall":"区分压缩方式，不能将无损性质推广到所有压缩。","correct":false,"correction":"无损压缩可逐位恢复原始数据；有损压缩通常不能完全恢复原始数据。"},{"number":30,"type":"judge","module":"m7","topicId":"m7-newtech","points":2,"stem":"二维码和RFID都可用于物品识别，但普通二维码需要光学读取，RFID标签可通过无线电方式读取。","answer_text":"正确","explanation":["两者都可承载物品标识。","二维码是图形编码，RFID是射频识别，读取方式不同。"],"pitfall":"用途相同不等于读取原理相同。","correct":true,"correction":"二维码通常用摄像头等光学设备识读，RFID使用射频通信。"},{"number":31,"type":"blank","module":"m1","topicId":"m1-logic","points":2,"stem":"将两个4位二进制数1011与0010逐位异或，结果为____。（保留4位）","answer_text":"1001","explanation":["异或规则：相同为0，不同为1。","逐位得到1⊕0=1、0⊕0=0、1⊕1=0、1⊕0=1，因此1001。"],"pitfall":"异或不是逻辑或，也不是二进制加法。","grading":"auto","accepted":["1001","(1001)2","1001B"]},{"number":32,"type":"blank","module":"m1","topicId":"m1-storage","points":2,"stem":"某存储器按字节编址，地址从0000H到7FFFH（含两端），容量为____KiB。（1 KiB=1024 B）","answer_text":"32","explanation":["地址数量=7FFFH−0000H+1=8000H=32768。","每地址对应1字节，32768÷1024=32 KiB。"],"pitfall":"含首尾地址必须加1；按字节编址不再除以8。","grading":"auto","accepted":["32","32KiB"]},{"number":33,"type":"blank","module":"m4","topicId":"m4-sort","points":2,"stem":"Excel成绩表要先按总分从高到低排列，总分相同时按学号从小到大排列。排序对话框中主要关键字应为____，次要关键字应为____。（写明顺序）","answer_text":"总分降序；学号升序","explanation":["第一层先比较总分，因此主要关键字为总分、降序。","总分相同才比较学号，因此次要关键字为学号、升序。"],"pitfall":"次要关键字只在主要关键字相同时起作用。","grading":"self","rubric":[{"text":"总分降序；学号升序","points":2}]},{"number":34,"type":"blank","module":"m4","topicId":"m4-text","points":2,"stem":"Excel中B2为姓名，C2为班级。要在D2显示“姓名（班级）”，如“李青（1班）”，填写公式____。","answer_text":"=B2&\"（\"&C2&\"）\"","explanation":["&是Excel文本连接运算符。","依次连接姓名、左括号、班级和右括号；括号作为文本放在双引号内。"],"pitfall":"公式必须以=开始，连接符不能用算术加号代替。","grading":"self","rubric":[{"text":"=B2&\"（\"&C2&\"）\"","points":2}]},{"number":35,"type":"blank","module":"m5","topicId":"m5-protocol","points":2,"stem":"浏览器访问域名时，将域名解析为IP地址通常由____服务完成。","answer_text":"DNS","explanation":["域名便于人记忆，网络通信需要IP地址。","DNS提供域名解析服务。"],"pitfall":"DNS解析与DHCP自动分配地址不是一回事。","grading":"auto","accepted":["DNS","域名系统","域名解析","域名解析服务"]},{"number":36,"type":"blank","module":"m1","topicId":"m1-language","points":2,"stem":"将源程序整体翻译成目标程序，再运行目标程序的翻译方式称为____。","answer_text":"编译","explanation":["编译先对源程序进行整体翻译，生成目标代码。","解释方式在运行时解释执行，通常不以先生成独立目标程序为前提。"],"pitfall":"程序最终能运行并不能判断编译或解释，要看翻译过程。","grading":"auto","accepted":["编译","编译方式"]},{"number":37,"type":"blank","module":"m8","topicId":"m8-recursion","points":2,"stem":"函数定义为F(0)=1，n>0时F(n)=2×F(n−1)。则F(3)=____。","answer_text":"8","explanation":["F(1)=2×1=2。","F(2)=2×2=4，F(3)=2×4=8；递归最终到F(0)终止。"],"pitfall":"不能把F(0)误当成0。","grading":"auto","accepted":["8"]},{"number":38,"type":"blank","module":"m8","topicId":"m8-loop","points":2,"stem":"某装置初始速度v=10 km/s。每经过1个有效工作秒，速度增加0.02 km/s；每连续工作80个有效秒，若速度仍低于目标13.4 km/s，则暂停6秒后继续。暂停期间速度不变，达到目标立即停止，不再暂停。变量t为总经过秒数，w为本段连续有效工作秒数。伪代码：t←0，w←0，v←10；当v<13.4时：v←v+0.02；t←t+1；w←w+1；若w=80且v<13.4，则执行____，随后w←0；循环结束。请填写暂停时对t的更新语句。","answer_text":"t←t+6（或t=t+6、t+=6）","explanation":["t记录有效工作和暂停合计的总秒数；暂停6秒必须令t增加6，因此填t←t+6。","w在暂停后清零，重新统计下一段有效工作秒数；暂停期间v不变。","从10增加至13.4需(13.4−10)/0.02=170个有效秒。第80与第160个有效秒后各暂停6秒，最终总时间170+2×6=182秒。","达到目标即停止，不再额外暂停。单位：速度为km/s，t与w为秒。"],"pitfall":"暂停只增加总时间t，不增加有效工作计数或速度；达到目标后不再执行暂停。","grading":"self","rubric":[{"text":"写出t增加6秒的更新式，如t←t+6、t=t+6或t+=6","points":2}]},{"number":39,"type":"blank","module":"m1","topicId":"m1-bus","points":2,"stem":"USB中的S表示Serial，即USB采用____传输方式。","answer_text":"串行","explanation":["USB全称为Universal Serial Bus，中文为通用串行总线。","串行方式按顺序传输数据位，与并行传输概念不同。"],"pitfall":"接口外形或速度不能直接作为串并行判断依据。","grading":"auto","accepted":["串行","串行传输"]},{"number":40,"type":"blank","module":"m2","topicId":"m2-process","points":2,"stem":"一个进程在运行中发出磁盘读取请求，因所需数据尚未返回而暂时不能继续执行，此时由运行态转入____态。","answer_text":"阻塞","explanation":["进程等待I/O完成，暂时不具备继续运行条件，进入阻塞态。","就绪态已具备运行条件，只是等待CPU；挂起涉及暂停或换出等另一维度，不能替代本题的等待I/O状态。"],"pitfall":"等待CPU是就绪，等待I/O事件是阻塞。","grading":"auto","accepted":["阻塞","阻塞态","等待","等待态"]},{"number":41,"type":"application","module":"m2","topicId":"m2-task","points":5,"stem":"Windows电脑打开多个应用后明显变慢。任务管理器“进程”页显示：浏览器内存1800 MB、CPU 2%；视频播放器内存350 MB、CPU 4%；文字处理软件内存500 MB、CPU 1%。全机内存使用率95%，CPU总使用率12%。用户确认浏览器中的工作已保存。","answer_text":"（1） 优先查看内存列；内存95%而CPU12%，内存压力更突出。；（2） 浏览器；先保存或确认保存工作，优先正常退出，未响应时再选中对应进程并结束任务。","explanation":["本题判断对象明确为内存压力。","一次关闭应用只能释放其所占资源，不保证解决所有卡顿原因。"],"pitfall":"CPU百分比与内存MB不能跨单位直接比大小。","grading":"self","parts":[{"label":"（1）","prompt":"本题应优先查看CPU列还是内存列？说明依据。","points":2,"answer":"优先查看内存列；内存95%而CPU12%，内存压力更突出。","steps":["对比全机CPU和内存使用率。","当前证据支持先排查内存占用，不可仅凭电脑慢认定CPU满载。"],"alternatives":[],"rubric":[{"text":"选择内存列","points":1},{"text":"用95%与12%的对比说明依据","points":1}]},{"label":"（2）","prompt":"在给出的三个应用中，关闭哪个最可能释放最多内存？写出规范操作及一项数据保护措施。","points":3,"answer":"浏览器；先保存或确认保存工作，优先正常退出，未响应时再选中对应进程并结束任务。","steps":["浏览器占用1800 MB，高于另外两项。","正常退出通常更有利于保存状态；结束任务前确认未保存内容。"],"alternatives":[],"rubric":[{"text":"选择浏览器","points":0.5},{"text":"说明浏览器内存1800 MB为三个应用最大","points":0.5},{"text":"正常退出或选中对应进程结束任务","points":1},{"text":"先保存或确认保存工作","points":1}]}]}, ":"中心设备为交换机；不必然，PC2支路故障通常不影响PC1与PC3的正常连接。","steps":["星形各支路分别连接中心。","局部支路故障不同于中心设备故障。"],"alternatives":[],"rubric":[{"text":"中心设备为交换机；不必然，PC2支路故障通常不影响PC1与PC3的正常连接。","points":1}]},{"label":"（2）","prompt":"写出查看题设IP配置信息的命令。","points":1,"answer":"ipconfig","steps":["在命令提示符中输入ipconfig查看IPv4、掩码、默认网关。"],"alternatives":["ipconfig /all"],"rubric":[{"text":"ipconfig","points":1}]},{"label":"（3）","prompt":"求PC1所在子网的网络地址、广播地址。","points":2,"answer":"网络地址192.168.30.64；广播地址192.168.30.127。","steps":["掩码最后一段192=11000000，子网步长256−192=64。","66落在64至127区间，首地址为网络地址，末地址为广播地址。"],"alternatives":[],"rubric":[{"text":"网络地址192.168.30.64","points":1},{"text":"广播地址192.168.30.127","points":1}]},{"label":"（4）","prompt":"192.168.30.100与192.168.30.130中，哪个与PC1处于同一子网？","points":1,"answer":"192.168.30.100。","steps":["本子网可用主机范围65至126。","100位于该范围，130属于128至191的另一个子网。"],"alternatives":[],"rubric":[{"text":"192.168.30.100。","points":1}]}]},{"number":45,"type":"application","module":"m6","topicId":"m6-select","points":5,"stem":"Access数据库中有“借阅”表，字段与现有记录如下。借阅号为主键、短文本；读者号为短文本；天数为数值；状态为短文本，字段均不为Null。请按Access SQL作答，各小问均以给出的原始四条记录为基础，互不影响。","answer_text":"（1） 借阅号是标识而非计算量，短文本可保留前导零，如0007。；（2） SELECT COUNT(*) AS 未还数 FROM 借阅 WHERE 状态='未还'; 结果为3。；（3） INSERT INTO 借阅 (借阅号,读者号,天数,状态) VALUES ('0011','003',8,'未还');；（4） SELECT 借阅号 FROM 借阅 WHERE 状态='未还' AND 天数>10; 结果为0009、0010。","explanation":["此题SQL默认Access；短文本借阅号的引号用于保留前导零。","各小问独立，插入记录不参与另外小问计算。"],"pitfall":"SELECT与FROM要配套；>10不含10。","grading":"self","parts":[{"label":"（1）","prompt":"为何借阅号应使用短文本而非数值？","points":1,"answer":"借阅号是标识而非计算量，短文本可保留前导零，如0007。","steps":["数值存储通常把0007表示为7。","文本可保留标识的固定形式。"],"alternatives":[],"rubric":[{"text":"借阅号是标识而非计算量，短文本可保留前导零，如0007。","points":1}]},{"label":"（2）","prompt":"写SQL统计状态为“未还”的记录数，并给出结果。","points":2,"answer":"SELECT COUNT(*) AS 未还数 FROM 借阅 WHERE 状态='未还'; 结果为3。","steps":["FROM指定数据表，WHERE筛选未还记录。","0007、0009、0010满足条件，COUNT(*)结果为3。"],"alternatives":["SELECT COUNT(借阅号) AS 未还数 FROM 借阅 WHERE 状态='未还';"],"rubric":[{"text":"SELECT COUNT(*) FROM 借阅及 -family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">c = 5；k = 0<\/text><polygon points=\"300,157.0 450.0,200 300,243.0 150.0,200\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"300\" y=\"205.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">c &lt; 500？<\/text><rect x=\"160.0\" y=\"273.0\" width=\"280\" height=\"54\" rx=\"0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"300\" y=\"305.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">c = 3 * c<\/text><rect x=\"160.0\" y=\"363.0\" width=\"280\" height=\"54\" rx=\"0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"300\" y=\"395.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">k = k + 1<\/text><polygon points=\"177.0,470.0 440.0,470.0 423.0,530.0 160.0,530.0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"300\" y=\"505.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">输出 k、c<\/text><rect x=\"230.0\" y=\"554.0\" width=\"140\" height=\"42\" rx=\"18\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"300\" y=\"580.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">结束<\/text><\/svg>"},{"number":47,"type":"application","module":"m8","topicId":"m8-loop","points":5,"stem":"学习小组中每两名成员恰好交流一次，同一对不重复计数。已知共有45对交流，求人数n。请画出逐人累计求人数的流程图；s表示累计交流对数。","answer_text":"（1） 见参考流程图：n=1、s=0；判断s<45；成立时先n加1，再将n-1计入s，返回判断；不成立时输出n、s并结束。；（2） n=10；10×9÷2=45。；（3） 不能；9人36对，10人45对。循环只求首次不少于44的人数，44不是可实现的恰好总数。","explanation":["画图时以常用流程图符号表达算法，用箭头表示先后与循环返回，不需要写程序代码。","较晚到场的人与此前各人形成新配对，每一对只计一次。"],"pitfall":"将条件写在菱形中并标明分支；只列人数公式或只写最终人数，不能代替题目要求的完整流程图。","grading":"self","parts":[{"label":"（1）","prompt":"画出完整流程图，包含初始化、未达目标时的循环、输出，并标明判断的两个分支。","points":3,"answer":"见参考流程图：n=1、s=0；判断s<45；成立时先n加1，再将n-1计入s，返回判断；不成立时输出n、s并结束。","steps":["n先加1代表新成员加入。","新增成员与此前n-1人各形成一对，所以累计增加n-1。","停止时还应核对是否恰好等于45。"],"alternatives":["先s=s+n，再n=n+1，其他逻辑相同。"],"rubric":[{"text":"初始化及s<45判断正确","points":1},{"text":"人数与累计更新表达式和顺序正确","points":1},{"text":"分支、回边、输出与起止完整","points":1}],"answer_format":"draw_flowchart"},{"label":"（2）","prompt":"给出人数，并用配对总数公式复核。","points":1,"answer":"n=10；10×9÷2=45。","steps":["累计1+2+…+9=45；10人恰有45对。"],"alternatives":[],"rubric":[{"text":"人数10且复核45正确","points":1}]},{"label":"（3）","prompt":"若将目标45改为44，仍输出n=10，能否说10人恰好有44对？说明理由。","points":1,"answer":"不能；9人36对，10人45对。循环只求首次不少于44的人数，44不是可实现的恰好总数。","steps":["阈值停止只保证s>=44，若要回答恰好44对还必须检查s=44。"],"alternatives":[],"rubric":[{"text":"否定并说明36与45之间不存在44的累计状态","points":1}]}],"revision":"flowchart-applications-r2","solution_flow":{"init":["n ← 1","s ← 0"],"condition":"s < 45？","body":["n ← n+1","s ← s+n-1"],"output":"输出 n、s"}},{"number":48,"type":"application","module":"m8","topicId":"m8-sort","points":5,"stem":"有N名学生，N为正整数，成绩保存在数组score中，下标从0到N-1。请画出使用冒泡排序将成绩按升序排列，然后输出中位数的完整流程图。N为奇数时取排序后中间一项；N为偶数时取中间两项的平均值，平均值可为小数。用N=6、score=[76, 60, 88, 60, 92, 84]检验你的流程图。","answer_text":"（1） 见完整参考流程图。读入N和score，i=0；判断i<N-1；每趟j=0，判断j<N-1-i；若score[j]>score[j+1]则交换；j加1后回内层判断，内层结束后i加1回外层判断。排序完成后判断N奇偶，奇数输出score[(N-1)//2]，偶数输出(score[N//2-1]+score[N//2])/2，最后结束。；（2） 升序数组：[60,60,76,84,88,92]；中位数80。","explanation":["本题考查流程图表达算法；常用处理框、判断框、输入/输出框及带方向箭头均应清楚。","评分关注算法逻辑与图中连接关系；允许等价循环写法和变量名，但不得漏掉冒泡排序，只画中位数分支。"],"pitfall":"两个循环的返回位置要区分；交换条件不成立也需递增j；相等元素无需交换且不可去重；偶数中位数使用零下标N//2-1与N//2。","grading":"self","parts":[{"label":"（1）","prompt":"画出完整流程图，须包括两层循环、相邻比较与交换、奇偶判断及输出。只写排序结果或程序代码不能代替画图。","points":4,"answer":"见完整参考流程图。读入N和score，i=0；判断i<N-1；每趟j=0，判断j<N-1-i；若score[j]>score[j+1]则交换；j加1后回内层判断，内层结束后i加1回外层判断。排序完成后判断N奇偶，奇数输出score[(N-1)//2]，偶数输出(score[N//2-1]+score[N//2])/2，最后结束。","steps":["外层执行N-1趟；每一趟把未排序部分最大值移到右端。","内层j从0到N-2-i，确保访问j+1不越界；比较不满足时也要执行j加1。","排序结束后才判断奇偶。//表示整数除法，最终平均值用可保留小数的除法。"],"alternatives":[],"rubric":[{"text":"输入、初始化与开始/结束完整","points":0.5},{"text":"外层条件、更新、回边正确","points":1},{"text":"内层初始化、条件、更新、回边正确","points":1},{"text":"相邻比较和交换、否分支汇合正确","points":0.5},{"text":"排序后奇偶分支及两种零下标中位数输出正确","points":1}],"answer_format":"draw_flowchart"},{"label":"（2）","prompt":"写出检验数组的最终升序结果和中位数。","points":1,"answer":"升序数组：[60,60,76,84,88,92]；中位数80。","steps":["中央下标为2、3，对应76和84，平均值为80。"],"alternatives":[],"rubric":[{"text":"升序数组和中位数均正确","points":1}]}],"revision":"flowchart-applications-r2","solution_flow_graph":{"width":820,"height":1240,"fontSize":20,"nodes":[{"id":"start","kind":"start","label":"开始","x":365,"y":30,"w":150,"h":42},{"id":"input","kind":"io","label":"输入 N>=1 与数组 score","x":365,"y":105,"w":480,"h":60},{"id":"init","kind":"process","label":"i = 0","x":365,"y":180,"w":220,"h":46},{"id":"outer","kind":"decision","label":"i < N-1 ?","x":365,"y":270,"w":310,"h":100},{"id":"jinit","kind":"process","label":"j = 0","x":365,"y":365,"w":220,"h":46},{"id":"inner","kind":"decision","label":"j < N-1-i ?","x":365,"y":455,"w":330,"h":100},{"id":"compare","kind":"decision","label":"score[j] > score[j+1] ?","x":365,"y":580,"w":380,"h":110},{"id":"swap","kind":"process","label":"tmp = score[j]\nscore[j] = score[j+1]\nscore[j+1] = tmp","x":365,"y":710,"w":450,"h":92},{"id":"jnext","kind":"process","label":"j = j + 1","x":365,"y":815,"w":220,"h":46},{"id":"inext","kind":"process","label":"i = i + 1","x":85,"y":455,"w":155,"h":56},{"id":"parity","kind":"decision","label":"N % 2 == 1 ?","x":365,"y":960,"w":310,"h":100},{"id":"odd","kind":"io","label":"输出 score[(N-1)//2]","x":170,"y":1080,"w":320,"h":70},{"id":"even","kind":"io","label":"输出 (score[N//2-1] +\nscore[N//2]) / 2","x":575,"y":1080,"w":420,"h":80},{"id":"end","kind":"end","label":"结束","x":365,"y":1200,"w":150,"h":42}],"edges":[{"to":"input","label":"","from":"start","points":[[365,51],[365,75]]},{"to":"init","label":"","from":"input","points":[[365,135],[365,157]]},{"to":"outer","label":"","from":"init","points":[[365,203],[365,220]]},{"to":"jinit","label":"是","from":"outer","points":[[365,320],[365,342]]},{"to":"inner","label":"","from":"jinit","points":[[       const value=store.native[key], baseline=initialState[key];

  function richText(value) {return String(value ?? '').split(/\n\s*\n/).map(paragraph=>`<p>${escapeText(paragraph).replace(/\n/g,'<br>')}</p>`).join('');}

  function renderFlow(spec,label='流程图') {return `<figure class="exam-flow"><figcaption>${escapeText(label)}</figcaption><div class="exam-flow-scroll" tabindex="0" role="region" aria-label="${escapeText(label)}，可横向滚动">${makeFlowSvg(spec)}</div></figure>`;}
  function renderMaterials(q) {return `${(q.tables || []).map(renderTable).join('')}${q.code ? `<pre class="exam-code" tabindex="0"><code>${escapeText(q.code)}</code></pre>` : ''}${q.flow ? renderFlow(q.flow,'题目流程图') : ''}${q.flow_graph_svg ? '<figure class=\"exam-flow\"><figcaption>题'+q.number+'图</figcaption><div class=\"exam-graph\">'+q.flow_graph_svg+'</div></figure>' : ''}`;}
  function revealed(q,attempt) {return attempt?.status === 'submitted' || (attempt?.mode === 'practice' && attempt.checked?.[q.number] === true);}

    if(!attempt) return '未开始';

      if(answeredQuestion(q,attempt.answers[q.number])) return '已答';

  function navigationClass(q,attempt) {

  function selfControl(paper,q,attempt,part,index) {
    const maximum=part ? part.points : q.points, value=part ? attempt.selfScores[q.number]?.[index] : attempt.selfScores[q.number];
    const id=`exam-score-${paper.id}-${q.number}-${part ? index : 'whole'}`;
    return `<div class="exam-score-control"><label for="${id}">${part ? `${escapeText(part.label)} ` : ''}对照评分点自评（0–${maximum} 分）</label><div class="exam-score-row"><input id="${id}" class="exam-self-input" type="number" inputmode="decimal" min="0" max="${maximum}" step="0.5" placeholder="待自评" value="${validScore(value,maximum) ? value : ''}" data-exam-self="true" data-exam-paper="${escapeText(paper.id)}" data-exam-number="${q.number}" data-exam-part="${part ? index : ''}" aria-describedby="${id}-help ${id}-error"><span id="${id}-help" class="exam-note">按 0.5 分递增；空白表示待评</span></div><p id="${id}-error" class="exam-score-error" aria-live="polite"></p></div>`;
  }
  function renderRubric(rubric) {return rubric?.length ? `<div class="exam-rubric"><strong>评分点</strong><ul>${rubric.map(item=>`<li>${escapeText(item.text)} <span class="exam-points">${item.points} 分</span></li>`).join('')}</ul></div>` : '';}
  function renderExplanation(paper,q,attempt) {
    if(!revealed(q,attempt)) return '';

    let html=`<div class="exam-result ${result.pending ? 'exam-pending' : result.earned === result.possible ? 'exam-correct' : 'exam-incorrect'}"><strong>${escapeText(questionStatus(q,attempt))}</strong>${!result.automatic ? '<span>主观题按下列评分点自行核对。</span>' : ''}</div><h4>参考答案</h4>${richText(q.answer_text)}`;
    if(q.solution_code)html+='<h4>补全后的完整伪代码</h4><pre class="exam-code"><code>'+escapeText(q.solution_code)+'</code></pre>';

      html+=`<section class="exam-part-solution"><h4>${escapeText(part.label)} 参考解答 · ${part.points} 分</h4>${richText(part.answer)}${part.steps?.length ? `<ol>${part.steps.map(step=>`<li>${escapeText(step)}</li>`).join('')}</ol>` : ''}${part.alternatives?.length ? `<p><strong>等价答案</strong></p><ul>${part.alternatives.map(text=>`<li>${escapeText(text)}</li>`).join('')}</ul>` : ''}${renderRubric(part.rubric)}${selfControl(paper,q,attempt,part,index)}</section>`;

  function renderAnswerControls(paper,q,attempt) {

    return q.grading==='self' ? `${label}<textarea id="${prefix}" class="exam-answer-textarea" rows="3" maxlength="20000" ${data} ${disabled} placeholder="填写公式、表达式或必要过程">${escapeText(value || '')}</textarea>` : `${label}<input id="${prefix}" class="exam-blank-input" type="text" autocomplete="off" spellcheck="false" maxlength="20000" ${data} value="${escapeText(value || '')}" ${disabled}>`;
  }
  function renderQuestion(paper,q,attempt) {
    const typeLabel={single:'单项选择题',judge:'判断题',blank:'填空题',application:'应用题'}[q.type] || q.type;
    return `<article class="exam-question" id="exam-q-${escapeText(paper.id)}-${q.number}" data-exam-number="${q.number}" tabindex="-1"><div class="exam-question-head"><h3>${q.number}．${escapeText(typeLabel)}</h3><span class="exam-question-points">${q.points} 分</span></div><div class="exam-question-meta"><span>${escapeText(titleForModule(q.module))}</span><span class="exam-question-status">${escapeText(questionStatus(q,attempt))}</span></div><div class="exam-stem">${richText(q.stem)}</div>${renderMaterials(q)}${renderAnswerControls(paper,q,attempt)}${attempt.mode==='practice' && attempt.status==='active' ? `<button type="button" id="exam-check-${escapeText(paper.id)}-${q.number}" class="exam-check-button" data-exam-action="check" data-exam-paper="${escapeText(paper.id)}" data-exam-number="${q.number}">${revealed(q,attempt) ? '重新检查' : objective(q) ? '检查并看解析' : '对照答案与评分点'}</button>` : ''}<div class="exam-feedback" ${revealed(q,attempt) ? '' : 'hidden'}>${renderExplanation(paper,q,attempt)}</div></article>`;

  function renderSummary(paper,attempt) {
    if(attempt?.status!=='submitted') return `<p class="exam-note">${attempt?.mode==='exam' ? '考试进行中，交卷后显示答案与评分。未答客观题按 0 分处理。' : '练习中，按题检查后显示该题解析。结束练习后汇总成绩与错题。'}</p>`;

  function renderPaperTabs(paper) {return `<div class="exam-paper-tabs" role="group" aria-label="切换模拟卷">${papers.map(item=>`<button type="button" class="exam-paper-tab" data-exam-action="paper" data-exam-paper="${escapeText(item.id)}" aria-pressed="${item.id===paper.id}">${escapeText(item.title)}${store.papers[item.id]?.status==='submitted' ? ' · 已交卷' : store.papers[item.id] ? ' · 进行中' : ''}</button>`).join('')}</div>`;}
  function renderExamSceneImpl(scene) {

    if(!attempt) return shell(scene,body+'<div class="exam-mode-note"><p><strong>练习模式：</strong>不限时，按题检查后查看答案与逐步解析。</p><p><strong>考试模式：</strong>开始后计时，交卷前不展示答案；刷新与切换页面继续计时，到时自动交卷。</p><p>客观题自动评分。公式、过程与应用题按评分点自行核对，不进行自动语义评分。</p></div></div>');

  function renderWrongSceneImpl(scene) {

  function currentExamId() {return (course.scenes || []).find(scene=>scene.id===state.sceneId)?.content?.examId;}
  function updateNavigation(paper,attempt) {
    const root=host.querySelector('[data-exam-root]');
    if(!root || root.dataset.examRoot!==paper.id) return;
    const progress=root.querySelector('[data-exam-progress]');
    if(progress) progress.textContent=String(paper.questions.filter(q=>answeredQuestion(q,attempt.answers[q.number])).length);
    for(const q of paper.questions) {
      const button=root.querySelector(`.exam-jump[data-exam-number="${q.number}"]`);
      if(button){button.className=`exam-jump ${navigationClass(q,attempt)}`;button.setAttribute('aria-label',`第 ${q.number} 题，${questionStatus(q,attempt)}`);}
      const status=root.querySelector(`.exam-question[data-exam-number="${q.number}"] .exam-question-status`);
      if(status) status.textContent=questionStatus(q,attempt);
      const feedbackResult=root.querySelector(`.exam-question[data-exam-number="${q.number}"] .exam-result`);
      if(feedbackResult && revealed(q,attempt)) {
        feedbackResult.className=`exam-result ${navigationClass(q,attempt)}`;

  function expireAll(now=Date.now(),refresh=true) {
    if(ticking) return [];
    ticking=true;

    for(const paper of papers) {
      const attempt=store.papers[paper.id];
      if(attempt?.status==='active' && attempt.mode==='exam' && remainingMs(attempt,now)===0) {store.papers[paper.id]=submitAttempt(attempt,now,'timeout');expired.push(paper.id);}
    }
    ticking=false;
    if(expired.length) {
      saveNow();
      if(refresh) {
        const current=(course.scenes || []).find(scene=>scene.id===state.sceneId);
        if(expired.includes(current?.content?.examId) || current?.content?.wrongReview) renderScene('preserve');
        announce(`${expired.map(id=>paperById(id).title).join('、')}时间到，已自动交卷。`);
      }
    }
    document.querySelectorAll('[data-exam-clock]').forEach(element=>{const attempt=store.papers[element.dataset.examClock];element.textContent=attempt?.status==='submitted' ? '已交卷' : formatTime(remainingMs(attempt,now));});
    return expired;
  }
  function gotoScene(id,number,paperId) {

    if(number)requestAnimationFrame(()=>jumpToQuestion(paperId,number));
  }
  function jumpToQuestion(paperId,number) {
    const target=document.getElementById(`exam-q-${paperId}-${number}`);
    if(!target)return;

    target.scrollIntoView({behavior:'auto',block:'start'});target.focus({preventScroll:true});saveNow();
  }
  function goPaper(id,number) {const scene=(course.scenes || []).find(item=>item.content?.examId===id);if(scene)gotoScene(scene.id,number,id);}

  function askConfirmation(action,id,message) {
    host.querySelector('.exam-confirmation')?.remove();

    panel.className='exam-confirmation';panel.setAttribute('role','alertdialog');
    panel.setAttribute('aria-label','确认试卷操作');

    host.querySelector('.exam-root')?.prepend(panel);
    panel.scrollIntoView?.({behavior:'auto',block:'center'});

  host.addEventListener('input',answerInput);
  host.addEventListener('change',event=>{if(event.target?.type==='radio')answerInput(event);});

  const originalRender=render, originalRenderScene=renderScene;
  renderScene=function(mode='preserve'){const result=originalRenderScene(mode);queueSave();return result;};
  render=function(mode='preserve'){const result=originalRender(mode);queueSave();return result;};
  document.addEventListener('input',queueSave);
  document.addEventListener('change',queueSave);
  document.addEventListener('click',queueSave);
  window.addEventListener('pagehide',saveNow);
  window.addEventListener('beforeunload',saveNow);
  document.addEventListener('visibilitychange',()=>{expireAll();if(document.hidden)saveNow();});
  window.addEventListener('focus',()=>expireAll());
  window.setInterval(()=>expireAll(),1000);
  showStorageNotice();
  saveNow();
  return {...pure,renderExamScene:renderExamSceneImpl,renderWrongScene:renderWrongSceneImpl};
})();

function renderExamScene(scene) {return ZSBExam.renderExamScene(scene);}
function renderWrongScene(scene) {return ZSBExam.renderWrongScene(scene);}
function flowSvg(spec) {return ZSBExam.flowSvg(spec);}

/* Mobile chapter picker uses the same native scene navigation and saved state. */
const originalChapterRenderNav = renderNav;
renderNav = function () {
  originalChapterRenderNav();
  const rail = document.querySelector('.course-rail');
  if (!rail) return;
  let picker = document.getElementById('chapterPicker');
  if (!picker) {
    const label = document.createElement('label');
    label.className = 'mobile-chapter-picker';
    label.innerHTML = '<span>跳转章节</span><select id="chapterPicker" aria-label="跳转章节">' +
      course.scenes.map((scene, index) => '<option value="' + esc(scene.id) + '">' + (index + 1) + ' · ' + esc(scene.title) + '</option>').join('') + '</select>';
    rail.appendChild(label);
    picker = document.getElementById('chapterPicker');
    picker.addEventListener('change', () => {
      if (course.scenes.some(scene => scene.id === picker.value)) {
        state.sceneId = picker.value;
        render('navigation');

  }

};
