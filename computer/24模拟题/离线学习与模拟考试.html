,"explanation":["下标从1开始，到N-2结束，可安全访问左右邻项。","两个邻项比较均为严格大于，等高平台必须排除。","循环条件同时包含边界和c<K，使第K个之后不再检查下一候选。","没找到峰值时c保持0，也能按边界正常结束。"],"pitfall":"不能从0检查或检查N-1，否则邻项越界；c<K与c≤K不同。","modern_extension":false,"parts":[{"label":"（1）","prompt":"画出包含开始、输入、初始化、循环条件、峰值判断、输出、计数更新、下标更新及结束的完整流程图。","answer_format":"draw_flowchart","points":6,"answer":"见完整参考图。检查条件为i≤N-2且c<K；峰值条件为A[i]>A[i-1]且A[i]>A[i+1]；仅成功分支输出i并增加c；两支合并后i增加并回到循环条件，最后输出c。","steps":["先读入N、K和数组，初始化i=1,c=0。","确认下标合法且尚未达到K后再访问数组邻项。","成功分支输出下标并计数，失败分支直接到下标更新。","每次i=i+1；回边指向循环条件，不指向初始化。","退出后输出c并结束。"],"alternatives":["可拆分两个循环终止判断；可在找到第K个时直接跳到输出c，均需保证不再检查后续候选。","达到第K个后执行一次下标自增但不访问新候选，也符合立即停止检查。"],"rubric":[{"text":"输入和初始化i=1,c=0","points":1},{"text":"边界检查仅限1..N-2","points":1},{"text":"计数达到K时停止检查","points":1},{"text":"两个严格大于比较且只成功支路输出和增加c","points":1},{"text":"两支正确合流、下标更新及循环回边","points":1},{"text":"退出输出c并结束，图形与分支明确","points":1}]},{"label":"（2）","prompt":"分别写出样例输出的峰值下标序列及最终c：①N=9，K=2，A=[2,5,1,4,4,2,6,1,9]；②N=4，K=3，A=[1,4,4,1]。说明①停止在哪个峰值。","points":2,"answer":"①依次输出下标1、6，最终c=2，在下标6的第二个峰值后停止，不再检查下标7；②不输出峰值下标，最终c=0。","steps":["①i=1满足5>2且5>1。","i=3、4因邻项等于4不满足；i=6满足6>2且6>1。","c达到2后循环结束；边界元素9不检查。","②两个中间4各与一个邻项相等，因此没有严格峰值。"],"alternatives":["允许写为空序列[]和计数0；下标必须按题设0基数组。"],"rubric":[{"text":"样例①序列1、6及c=2和提前结束正确","points":1},{"text":"样例②空序列及c=0正确","points":1}]}],"solution_flow_graph":{"width":960,"height":790,"fontSize":18,"maxHeight":480,"caption":"第46题完整参考图：严格峰值、边界控制和找到K个后的提前结束。","nodes":[{"id":"start","kind":"start","label":"开始","x":355,"y":35,"w":100,"h":36},{"id":"read","kind":"io","label":"输入 N、K、A","x":355,"y":100,"w":230,"h":44},{"id":"init","kind":"process","label":"i=1，c=0","x":355,"y":165,"w":210,"h":44},{"id":"loop","kind":"decision","label":"i≤N-2 且\nc<K？","x":355,"y":250,"w":250,"h":92},{"id":"peak","kind":"decision","label":"A[i]>A[i-1] 且\nA[i]>A[i+1]？","x":355,"y":370,"w":310,"h":100},{"id":"output_i","kind":"io","label":"输出 i","x":175,"y":480,"w":180,"h":44},{"id":"count","kind":"process","label":"c=c+1","x":175,"y":550,"w":18   }
  function formatTime(milliseconds) {

    return `${Math.floor(seconds / 3600) ? `${Math.floor(seconds / 3600)}:` : ''}${String(Math.floor(seconds / 60) % 60).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
  }

    return {...attempt,status:'submitted',submittedAt:reason === 'timeout' && Number.isFinite(attempt.deadline) ? attempt.deadline : now,submissionReason:reason};
  }
  function answeredQuestion(q, answer) {
    if (q.type === 'single') return Number.isInteger(answer) && answer >= 0 && answer < (q.options || []).length;
    if (q.type === 'judge') return typeof answer === 'boolean';
    if (q.type === 'application') return (q.parts || []).length > 0 && q.parts.every((part,index) => typeof answer?.[index] === 'string' && answer[index].trim().length > 0);

    let correct = false;

  }
  function scorePaper(paper, attempt) {

    const sum = (key,predicate) => results.filter(predicate).reduce((total,result) => total + (result[key] || 0),0);

  let flowSequence = 0;

      if(status) status.textContent=questionStatus(q,attempt);
      const feedbackResult=root.querySelector(`.exam-question[data-exam-number="${q.number}"] .exam-result`);
      if(feedbackResult && revealed(q,attempt)) {
        feedbackResult.className=`exam-result ${navigationClass(q,attempt)}`;
        const text=feedbackResult.querySelector('strong');if(text)text.textContent=questionStatus(q,attempt);

  }
  function expireAll(now=Date.now(),refresh=true) {
    if(ticking) return [];

      saveNow();
      if(refresh) {
        const current=(course.scenes || []).find(scene=>scene.id===state.sceneId);
        if(expired.includes(current?.content?.examId) || current?.content?.wrongReview) renderScene('preserve');

      }
    }
    document.querySelectorAll('[data-exam-clock]').forEach(element=>{const attempt=store.papers[element.dataset.examClock];element.textContent=attempt?.status==='submitted' ? '已交卷' : formatTime(remainingMs(attempt,now));});

  }
  function gotoScene(id,number,paperId) {
    if(!(course.scenes || []).some(scene=>scene.id===id)) return;

    if(typeof stopMotion==='function')stopMotion(state.sceneId);
    state.sceneId=id;render('navigation');saveNow();
    if(number)requestAnimationFrame(()=>jumpToQuestion(paperId,number));
  }

    const target=document.getElementById(`exam-q-${paperId}-${number}`);
    if(!target)return;

    target.scrollIntoView({behavior:'auto',block:'start'});target.focus({preventScroll:true});saveNow();
  }
  function goPaper(id,number) {const scene=(course.scenes || []).find(item=>item.content?.examId===id);if(scene)gotoScene(scene.id,number,id);}

  function askConfirmation(action,id,message) {
    host.querySelector('.exam-confirmation')?.remove();

    panel.className='exam-confirmation';panel.setAttribute('role','alertdialog');
    panel.setAttribute('aria-label','确认试卷操作');

    host.querySelector('.exam-root')?.prepend(panel);
    panel.scrollIntoView?.({behavior:'auto',block:'center'});

  function answerInput(event) {
    const input=event.target;if(!input?.dataset?.examAnswer && !input?.dataset?.examSelf)return;

    saveNow();updateNavigation(paper,attempt);
  }
  host.addEventListener('input',answerInput);
  host.addEventListener('change',event=>{if(event.target?.type==='radio')answerInput(event);});

  const originalRender=render, originalRenderScene=renderScene;
  renderScene=function(mode='preserve'){const result=originalRenderScene(mode);queueSave();return result;};
  render=function(mode='preserve'){const result=originalRender(mode);queueSave();return result;};
  document.addEventListener('input',queueSave);
  document.addEventListener('change',queueSave);
  document.addEventListener('click',queueSave);
  window.addEventListener('pagehide',saveNow);
  window.addEventListener('beforeunload',saveNow);
  document.addEventListener('visibilitychange',()=>{expireAll();if(document.hidden)saveNow();});
  window.addEventListener('focus',()=>expireAll());
  window.setInterval(()=>expireAll(),1000);
  showStorageNotice();
  saveNow();
  return {...pure,renderExamScene:renderExamSceneImpl,renderWrongScene:renderWrongSceneImpl};
})();

function renderExamScene(scene) {return ZSBExam.renderExamScene(scene);}
function renderWrongScene(scene) {return ZSBExam.renderWrongScene(scene);}
function flowSvg(spec) {return ZSBExam.flowSvg(spec);}

/* Mobile chapter picker uses the same native scene navigation and saved state. */
const originalChapterRenderNav = renderNav;
renderNav = function () {
  originalChapterRenderNav();
  const rail = document.querySelector('.course-rail');
  if (!rail) return;
  let picker = document.getElementById('chapterPicker');
  if (!picker) {
    const label = document.createElement('label');
    label.className = 'mobile-chapter-picker';
    label.innerHTML = '<span>跳转章节</span><select id="chapterPicker" aria-label="跳转章节">' +
      course.scenes.map((scene, index) => '<option value="' + esc(scene.id) + '">' + (index + 1) + ' · ' + esc(scene.title) + '</option>').join('') + '</select>';
    rail.appendChild(label);
    picker = document.getElementById('chapterPicker');
    picker.addEventListener('change', () => {
      if (course.scenes.some(scene => scene.id === picker.value)) {
        state.sceneId = picker.value;
        render('navigation');

  }
