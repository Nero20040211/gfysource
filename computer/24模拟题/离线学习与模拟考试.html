ept","title":"网络层次、路由器、交换机与网卡","objectiveIds":["m5"],"knowledge":{"title":"网络层次、路由器、交换机与网卡","summary":"对应真题：40","prerequisites":["OSI七层与TCP/IP四层采用不同名称。"],"mentalModel":"判断设备主要工作层次，要看它依据什么信息转发，而不是看外壳上有多少接口。","sections":[{"id":"m5-layers-s1","title":"基础层次对应","body":"OSI从低到高为物理、数据链路、网络、传输、会话、表示、应用。基础题中集线器主要在物理层转发信号；网桥及普通二层交换机依据MAC地址在数据链路层转发帧；路由器依据IP地址在网络层转发分组。"},{"id":"m5-layers-s2","title":"网卡与综合设备","body":"网卡提供主机连接网络的接口，涉及物理与数据链路层。家用无线路由器常集路由、交换、无线接入等多种功能，不能用实际一体机的复杂性否定基础题对“路由器基本路由功能在网络层”的分类。"},{"id":"m5-layers-s3","title":"星形拓扑的理解","body":"多台终端分别连接中心交换/接入设备，在基础物理拓扑上形成星形。无线终端通过无线网卡接入无线接入点。拓扑描述连接结构，协议描述通信规则，两者不同。原网络图以无线路由器为中心连接多台设备，按星形回答。"}],"workedExamples":[{"title":"标准例题","prompt":"设备根据目的IP选择下一跳，主要工作在哪一层？","steps":[{"text":"IP是网络层地址。"},{"text":"根据IP进行跨网转发是路由。"}],"result":"OSI网络层。","exampleType":"standard","variantType":"standard","id":"m5-layers-example-1"},{"title":"对照例题","prompt":"MAC转发的交换机与IP路由器有什么区别？","steps":[{"text":"前者按链路层地址转发帧。"},{"text":"后者按网络层地址转发分组。"}],"result":"基本功能分别对应数据链路层与网络层。","exampleType":"contrast","variantType":"contrast","id":"m5-layers-example-2"}],"pitfalls":["OSI网络层与TCP/IP网际层名称不同但此处对应。","一体机功能多不等于所有题目都应答应用层。"],"takeaway":"OSI网络层。","citations":[{"sourceId":"exam","locator":"2024部分：题40，PDF第35页"},{"sourceId":"exam25","locator":"PDF第2、6页，第12、44(1)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第73—78页"}],"pedagogicalFigures":[{"id":"m5-layers-figure","template":"generic-flow","figureKind":"concept","title":"中心设备与星形连接","learningPurpose":"判断设备主要工作层次，要看它依据什么信息转发，而不是看外壳上有多少接口。","caption":"基础星形连接示意；物理连线不按比例，终端分别连接中心设备。","after":"section:m5-layers-s3","code":{"width":780,"height":480,"fontSize":18,"nodes":[{"id":"router","kind":"process","label":"中心路由/接入点","x":380,"y":230,"w":190,"h":70},{"id":"pc1","kind":"process","label":"台式机A","x":125,"y":65,"w":190,"h":70},{"id":"pc2","kind":"process","label":"台式机B","x":635,"y":65,"w":190,"h":70},{"id":"wifi1","kind":"process","label":"笔记本\n无线网卡","x":125,"y":405,"w":190,"h":70},{"id":"wifi2","kind":"process","label":"平板\n无线接入","x":635,"y":405,"w":190,"h":70},{"id":"internet","kind":"process","label":"Internet","x":660,"y":230,"w":190,"h":70}],"edges":[{"from":"pc1","to":"router","arrow":false,"label":"有线"},{"from":"pc2","to":"router","arrow":false,"label":"有线"},{"from":"wifi1","to":"router","arrow":false,"label":"无线"},{"from":"wifi2","to":"router","arrow":false,"label":"无线"},{"from":"router","to":"internet","arrow":false,"label":"上联网关"}],"caption":"基础星形连接示意；物理连线不按比例，终端分别连接中心设备。"},"assetId":"m5-layers-asset","sourceRef":"exam","sourceLocator":"相关原题与本节原理的教学重绘"}]},"content":{"text":""}},{"id":"m5-protocol","stageId":"m5","type":"concept","title":"TCP/IP协议、FTP、DNS与网络诊断","objectiveIds":["m5"],"knowledge":{"title":"TCP/IP协议、FTP、DNS与网络诊断","summary":"对应真题：31","prerequisites":["先问协议解决哪一层的问题，再读诊断结果。"],"mentalModel":"网络分层把复杂通信拆成分工。诊断应由本机到局域网、再到外部地址和域名逐步缩小问题范围，单次失败不能直接证明唯一原因。","sections":[{"id":"m5-protocol-s1","title":"TCP/IP分工","body":"基础课程常采用应用层、传输层、网际层、网络接口层四层模型。HTTP、DNS、SMTP等属于应用层；TCP和UDP属于传输层；IP属于网际层。TCP提供可靠、有序的字节流传输机制；UDP提供数据报服务，开销较小，但自身不保证可靠有序交付。UDP不可靠不等于“现实中发送的数据必定丢失”。OSI七层与TCP/IP四层不要混背。OSI模型中路由器的基本IP转发功能在网络层，普通以太网交换的基本功能在数据链路层；现实设备可能兼有其他功能。DNS把主机名解析到地址，一个域名可以有多个地址。邮件发送通常使用SMTP，接收常见POP3或IMAP。HTTPS通常在TLS上提供加密、完整性保护和服务器身份认证机制，默认端口443；HTTP默认端口80，显式写出的端口优先。"},{"id":"m5-protocol-s2","title":"带宽与速率","body":"网络带宽在基础题中通常指链路可提供的最大数据传输能力，实际吞吐率受拥塞、设备、协议开销等影响，未必达到带宽。Mbps中的小写b表示bit，每8 bit为1 Byte；换算下载时间先统一单位。题目若说明忽略开销，可按理想速率计算，否则不能把理想数值当实际测量结果。时延则描述传输所需时间，与容量指标不同。"},{"id":"m5-protocol-s3","title":"诊断方法","body":"127.0.0.1是常见IPv4回环地址，localhost通常解析到本机回环地址，测试本机协议栈不等于测试外部网络。ipconfig /all用于查看配置，ping常利用ICMP回显检测可达性；ping通IP而域名失败时，可优先检查DNS。ping超时还可能由过滤、对方不响应或网络故障造成，不能直接断定对方关机或拒绝所有连接。"},{"id":"m5-protocol-https","title":"HTTPS与连通性测试","body":"HTTPS在HTTP通信中使用TLS等传输安全机制，提供机密性、完整性及相应身份验证。它不保证网页内容真实或网站无恶意。DHCP可以自动分配IP地址、掩码、网关、DNS等配置；ping通过相应报文检查可达性，超时也可能由过滤造成，不能单凭超时判定服务器必然宕机。"}],"workedExamples":[{"title":"标准例题","prompt":"100 MB文件经100 Mbps链路传输，按十进制、忽略开销，至少多少秒？","steps":[{"text":"100 MB换算为800 Mb。"},{"text":"800除以100得到8。"}],"result":"8秒的理想传输时间。","exampleType":"standard","variantType":"standard","id":"m5-protocol-example-1"},{"title":"易错对照","prompt":"ping 127.0.0.1成功，是否说明能浏览互联网？","steps":[{"text":"回环测试主要涉及本机。"},{"text":"外部链路、网关和DNS可能仍有问题。"}],"result":"不能据此确认外网正常。","exampleType":"contrast","variantType":"contrast","id":"m5-protocol-example-2"}],"pitfalls":["带宽不是当前实测吞吐率。","DNS把域名解析到地址，不负责把所有网络故障自动修好。"],"takeaway":"8秒的理想传输时间。","citations":[{"sourceId":"exam","locator":"2024部分：题31，PDF第33页；题40，PDF第35页"},{"sourceId":"exam25","locator":"PDF第2、4、6页，第13、35、44(3)题；考点题设依据。辅助页支持层次、FTP、邮件协议、带宽和网络诊断；DNS解析、TLS细节为编者补充，不声称来自该页段。"},{"sourceId":"core","locator":"PDF第73—81页"}]},"content":{"text":""}},{"id":"m5-web","stageId":"m5","type":"concept","title":"Web服务器、网页访问与IIS","objectiveIds":["m5"],"knowledge":{"title":"Web服务器、网页访问与IIS","summary":"对应真题：16","prerequisites":["客户端发请求，服务器响应。"],"mentalModel":"浏览器用来访问网页，Web服务器软件用来接收请求并发布站点，编辑工具与数据库又承担其他任务。","sections":[{"id":"m5-web-s1","title":"角色区别","body":"浏览器是客户端；IIS、Apache HTTP Server等可提供Web服务；Oracle是数据库产品体系；Outlook主要是邮件与日程客户端；Flash曾用于多媒体内容，不能因此当成通用Web服务器。原第14题应选择IIS。软件能出现在网站系统中，不等于它就是负责发布网页的Web服务器。"},{"id":"m5-web-s2","title":"HTTP、FTP与层次","body":"HTTP用于网页资源传输，FTP用于文件传输，DNS用于名称解析，均属于TCP/IP应用层。TCP、UDP属于传输层，IP属于网际层。应用层协议仍可借助下层协议完成端到端通信，不能说使用TCP的FTP就属于传输层。"},{"id":"m5-web-s3","title":"请求与地址","body":"URL通常包含协议、主机、可选端口和路径。网站文件保存在某文件夹并不等于已向网络发布；还要配置服务器、访问权限与对应地址。基础题中“发布网站的服务器软件”直接考角色识别，不要求背过时网页编辑软件菜单。"}],"workedExamples":[{"title":"标准例题","prompt":"IIS、Outlook、Oracle、图像编辑器中，哪一个能承担题设Web发布服务？","steps":[{"text":"按主要功能分类。"},{"text":"IIS提供Web服务器功能。"}],"result":"IIS。","exampleType":"standard","variantType":"standard","id":"m5-web-example-1"},{"title":"对照例题","prompt":"FTP运行在TCP之上，FTP与TCP各属于哪层？","steps":[{"text":"服务于文件传输的FTP是应用层。"},{"text":"TCP提供端到端传输服务。"}],"result":"FTP应用层，TCP传输层。","exampleType":"contrast","variantType":"contrast","id":"m5-web-example-2"}],"pitfalls":["网页制作工具、浏览器和服务器不是同一角色。","历史产品名称按题目功能识别，不推广过时软件使用建议。"],"takeaway":"IIS。","citations":[{"sourceId":"exam","locator":"2024部分：题16，PDF第31页"},{"sourceId":"exam25","locator":"PDF第2页，第14题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第73—81页"}]},"content":{"text":""}},{"id":"m5-security","stageId":"m5","type":"concept","title":"防火墙、恶意软件与安全能力边界","objectiveIds":["m5"],"knowledge":{"title":"防火墙、恶意软件与安全能力边界","summary":"对应真题：15、40、41","prerequisites":["安全工具有各自职责，不存在单项万能保护。"],"mentalModel":"防火墙控制通信，反恶意软件工具检测清理恶意程序，备份帮助恢复数据。能力边界是判断题的关键。","sections":[{"id":"m5-security-s1","title":"防火墙做什么","body":"防火墙根据规则允许或阻止网络通信，可减少未授权访问。个人防火墙可针对网络类型与程序设置策略。它不等于杀毒软件，不能保证清除所有病毒，也不能保证系统绝不遭受攻击。原题“可清除计算机中的所有病毒”错误。"},{"id":"m5-security-s2","title":"常见防护手段","body":"补丁修复已知漏洞，权限控制限制可操作资源，身份认证核对用户身份，备份用于故障后的恢复，反恶意软件工具承担相应检测和处置。工具之间互补，不能由“装了一个工具”推断其他措施都不需要。"},{"id":"m5-security-s3","title":"判断绝对措辞","body":"“所有、彻底、绝对、永远”常使表述超出工具能力，但不能只凭绝对词机械判错，仍要比较具体规则。下载文件、宏和外设可能带来风险，来源可信与经过校验比文件后缀好看更有意义。"},{"id":"m5-security-transfer-check","title":"同类题的解题检查","body":"判断功能边界时，把“可以降低风险”与“保证完全消除风险”分开。防火墙按规则允许或阻止通信；即使通信被允许，其中的文件也可能含有恶意内容。题目若说防火墙能清除所有病毒，属于把通信控制与恶意程序处理混淆。安全措施往往需要配合使用；回答此类基础题时应说明各工具的主要职责，不能根据工具名称推断它拥有所有安全功能。"}],"workedExamples":[{"title":"标准例题","prompt":"阻止陌生应用接受不必要的入站连接，主要用什么？","steps":[{"text":"问题是控制网络通信。"},{"text":"对应防火墙入站规则。"}],"result":"防火墙。","exampleType":"standard","variantType":"standard","id":"m5-security-example-1"},{"title":"误区例题","prompt":"防火墙已开启，能否认定电脑中的所有病毒已被清除？","steps":[{"text":"开启规则不等于扫描全部恶意文件。"},{"text":"两类工具的功能不同。"}],"result":"不能。","exampleType":"misconception","variantType":"misconception","id":"m5-security-example-2"}],"pitfalls":["默认设置可能随版本和管理员策略不同；以题设界面为准。","防火墙不能替代备份与补丁。"],"takeaway":"防火墙。","citations":[{"sourceId":"exam","locator":"2024部分：题15，PDF第31页；题41，PDF第36页"},{"sourceId":"exam25","locator":"PDF第2页，第15题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第112—113页"}]},"content":{"text":""}},{"id":"m5-media","stageId":"m5","type":"concept","title":"有线、无线传输介质与无线接入","objectiveIds":["m5"],"knowledge":{"title":"有线、无线传输介质与无线接入","summary":"对应真题：","prerequisites":["传输介质是信号传播的物理渠道。"],"mentalModel":"先判断信号依赖实体线缆还是开放空间传播，再比较材料和距离等性质。","sections":[{"id":"m5-media-s1","title":"有线介质","body":"双绞线、同轴电缆和光纤属于有线介质。双绞线与同轴主要传送电信号；光纤传送光信号，抗电磁干扰能力较好。光纤传光不等于无线，是否有实体线路才是这里的分类依据。"},{"id":"m5-media-s2","title":"无线介质","body":"无线电、微波、红外等通过空间传播，属于无线方式。Wi-Fi是无线局域网接入技术，终端一般需要无线网卡，与无线路由器/接入点通信。原第26题把微波也列为有线，因此整句为错。"},{"id":"m5-media-s3","title":"结合情境答题","body":"接入终端用什么设备，要区分网卡、交换机、路由器和传输介质。笔记本无线连接需无线网卡；“用无线电”回答的是传播方式，不是所问网络硬件。比较距离、速率或干扰时要看具体标准与条件，不把一种介质说成所有指标都最优。"},{"id":"m5-media-transfer-check","title":"同类题的解题检查","body":"遇到传输介质题，先看信号是否依赖实体线路，再判断设备是否具备对应接口。有光纤或双绞线作为路径的属于有线；通过空间传播的微波属于无线。无线网卡是终端连接无线网络的设备，微波是传播方式，两者不能互相替代作答。笔记本有无线网卡只说明具备接入条件，真正接入还需存在可用接入点和相应配置；题目只问设备名称时不必混写成协议名称。"}],"workedExamples":[{"title":"标准例题","prompt":"光纤、双绞线、微波中，哪项无线？","steps":[{"text":"前两项依赖实体线缆。"},{"text":"微波通过空间传播。"}],"result":"微波。","exampleType":"standard","variantType":"standard","id":"m5-media-example-1"},{"title":"对照例题","prompt":"光纤使用光信号，是否因此属于无线？","steps":[{"text":"信号形式是光。"},{"text":"光沿实体光纤传播。"}],"result":"不是，仍属有线介质。","exampleType":"contrast","variantType":"contrast","id":"m5-media-example-2"}],"pitfalls":["有线/无线不按电/光分类。","设备与介质不要答非所问。"],"takeaway":"微波。","citations":[{"sourceId":"exam","locator":"2024部分：题40，PDF第35页"},{"sourceId":"exam25","locator":"PDF第3、6页，第26、44(2)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第74、77、79—80页（无线设备及有线/无线介质）"},{"sourceId":"500","locator":"PDF第22页（常见有线传输介质）"}]},"content":{"text":""}},{"id":"m5-ip","stageId":"m5","type":"concept","title":"IPv4、传统分类、子网掩码与网关","objectiveIds":["m5"],"knowledge":{"title":"IPv4、传统分类、子网掩码与网关","summary":"对应真题：40","prerequisites":["会区分十进制分段地址和十六进制硬件地址。"],"mentalModel":"IP地址用于网络层寻址，MAC地址用于链路层标识；子网掩码说明地址的哪些位属于网络部分。读配置图时应按字段标签定位。","sections":[{"id":"m5-ip-class","title":"传统分类与默认网关","body":"传统分类按首字节范围区分：A类常用1—126，B类128—191，C类192—223；127属于回环范围，D类224—239用于组播。现代分配主要采用CIDR，实际网络号仍由掩码确定，不能用传统类别代替掩码。原图192.168.110.81属于传统C类。默认网关用于把非本地子网的分组交给下一跳；通常需为主机可达的本地路由接口。原图网关192.168.110.1，与/24主机同子网。"},{"id":"m5-ip-s1","title":"IPv4与私有地址","body":"IPv4地址有32位，常写成四段0到255的十进制数。私有范围包括10开头的整个/8块、172.16到172.31的/12块，以及192.168的/16块。172.15不是私有范围的一部分，不能把所有172开头地址都看成私有地址。私有地址可在内部网络使用，通常需借助网关及地址转换等方式访问公网；它不是“不能用于任何网络”的地址。"},{"id":"m5-ip-s2","title":"子网掩码","body":"掩码中连续的1表示网络位。在常见/24网络中，掩码为255.255.255.0，但并不是所有局域网都必须前三段相同。判断两地址是否属于同一子网，应使用各自明确的掩码做网络号计算。基础题若给出192.168.1.2/24，其网络号为192.168.1.0，广播地址为192.168.1.255；可用普通主机范围通常排除这两个地址。"},{"id":"m5-ip-s3","title":"MAC与读图","body":"常见以太网MAC地址是48位，通常写为6组十六进制数，用冒号或短横线分隔。ipconfig /all输出中的“物理地址”对应MAC，“IPv4地址”“默认网关”“DNS服务器”是其他字段。MAC不等于IPv4，也不能绝对说永远不可更改，现实中有本地管理地址和随机化等情形。读模糊截图应逐组核对，不应机械相信旁边印好的答案。"}],"workedExamples":[{"title":"标准例题","prompt":"172.20.4.8与172.15.4.8中哪个属于RFC1918私有范围？","steps":[{"text":"172私有范围的第二段为16到31。"},{"text":"20在范围内，15在范围外。"}],"result":"172.20.4.8。","exampleType":"standard","variantType":"standard","id":"m5-ip-example-1"},{"title":"边界例题","prompt":"同为192.168.1开头，是否不看掩码就能断言同一子网？","steps":[{"text":"网络前缀长度可能不是/24。"},{"text":"例如/25会把末段0到127与128到255分成不同子网。"}],"result":"不能脱离掩码判断。","exampleType":"boundary","variantType":"boundary","id":"m5-ip-example-2"}],"pitfalls":["MAC常见为48位，IPv4为32位，IPv6为128位。","私有地址范围需要记完整边界。"],"takeaway":"172.20.4.8。","citations":[{"sourceId":"exam","locator":"2024部分：题40，PDF第36页"},{"sourceId":"exam25","locator":"PDF第6页，第44(4)—(5)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第75—81页（分类、私有地址、MAC、网关及子网）"}]},"content":{"text":""}},{"id":"m5-ipv6","stageId":"m5","type":"concept","title":"IPv6的128位地址、零压缩与安全边界","objectiveIds":["m5"],"knowledge":{"title":"IPv6的128位地址、零压缩与安全边界","summary":"对应真题：14、17","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"IPv6像扩大了地址编号系统：地址空间明显增长，但编号更长并不自动让通信更快或更安全。地址写法判断要看8组16位十六进制，而不是只看是否有冒号。","sections":[{"id":"m5-ipv6-s1","title":"IPv4与IPv6","body":"IPv4地址为32位，常用四段十进制表示；IPv6为128位，通常写成8组十六进制，每组16位。更大的空间是确定的结构差异；实际速度与安全取决于链路、路由、协议配置和管理，不能把IPv6等同于自动加速或万能防护。"},{"id":"m5-ipv6-s2","title":"压缩规则","body":"每组前导零可以省略，但一组至少留一个数字。连续全零组可用::压缩，在一个地址中最多使用一次，否则无法唯一恢复各组位置。2001:0DB8:0000:0000:0000:0000:0000:0001可写2001:db8::1。字母大小写不影响地址数值。"},{"id":"m5-ipv6-s3","title":"地址与前缀","body":"地址后面的/64等表示前缀长度，不是地址中的普通字符。IPv6中不应出现R、G这类十六进制范围外字符。扫描题17中合法选项需要能恢复为8组，其余选项的问题分别是多次零压缩、组数不符或非法符号。实际IPv6还有合法的IPv4混合表示，基础题应明确讨论纯十六进制形式。"},{"id":"m5-ipv6-s4","title":"网络配置与保护","body":"IPv6可配合无状态地址自动配置或DHCPv6等机制，具体取决于网络。连接到IPv6网络仍需正确网关/路由、DNS、访问控制和服务端保护。加密与身份认证由相应安全协议实现，不能从地址版本单独推导出访问一定可信。"}],"workedExamples":[{"title":"标准例题","prompt":"2001:db8::12可恢复为多少组？","steps":[{"text":"已有3个显式组：2001、db8、12。"},{"text":"::补入5个全零组，使总数为8。"}],"result":"是合法的纯十六进制IPv6地址。","variantType":"standard","id":"m5-ipv6-example-1"},{"title":"边界对照","prompt":"2001::db8::12为什么不合法？","steps":[{"text":"两处::各压缩多少组无法唯一确定。"},{"text":"标准只允许一处::。"}],"result":"一个地址不能重复使用零压缩符。","variantType":"boundary","id":"m5-ipv6-example-2"}],"pitfalls":["地址更多不等于性能一定更好。","/64是前缀长度，不能随意混入某个地址组。"],"takeaway":"是合法的纯十六进制IPv6地址。","citations":[{"sourceId":"exam","locator":"PDF第31—32页题14、17"},{"sourceId":"ipv6-rfc","locator":"第2.2节"},{"sourceId":"core","locator":"网络新技术与IPv6章节"}]},"content":{"text":""}},{"id":"m5-cloud","stageId":"m5","type":"concept","title":"云服务、协作权限、同步、版本历史与备份","objectiveIds":["m5"],"knowledge":{"title":"云服务、协作权限、同步、版本历史与备份","summary":"对应真题：","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"云服务把资源放到可通过网络使用的服务中，但你买的是计算资源、开发平台还是成品应用，需要分别判断。共享解决别人能否访问，备份解决出错后能否恢复，二者不能互相代替。","sections":[{"id":"m5-cloud-s1","title":"三种服务交付","body":"IaaS提供基础计算、存储、网络等资源，用户还需要管理更多软件层；PaaS提供应用开发运行平台；SaaS提供可直接使用的成品应用。在线协作文档通常是SaaS情境，租虚拟机自行安装系统和应用则更接近IaaS。分类依据服务交付边界，不依据是否叫“智能云”。"},{"id":"m5-cloud-s2","title":"协作权限与最小授权","body":"共享链接可能允许查看或编辑，也可能限制为指定的人。收集反馈时应按实际任务设置权限：只需阅读可给查看，需要修改才给编辑。某人可能同时通过链接、直接授权和父文件夹继承获得访问权；仅删除一个链接不保证其他路径都被撤销。"},{"id":"m5-cloud-s3","title":"同步与备份","body":"同步保持多个位置的状态接近，错误编辑或删除也可能被同步。独立备份保留额外恢复副本，版本历史保存历史状态，但其保留范围与服务设置有关。选择题若问防止误删，不能仅回答“已经同步所以一定不会丢”。重要文件需要可验证的恢复路径。"},{"id":"m5-cloud-s4","title":"共享对象与敏感数据","body":"上传成绩表前要核对姓名、学号、联系方式等是否都是任务所需。匿名汇总结果常比直接公开全表更符合最小披露目标。撤销共享后，应考虑收件人是否已下载副本；修改云端权限不能控制已经离线保存的每一份文件。"}],"workedExamples":[{"title":"标准例题","prompt":"只让同学阅读报告，允许老师修改，怎样授权？","steps":[{"text":"对同学提供查看权限。"},{"text":"对指定教师提供编辑权限。"},{"text":"避免公开任何人可编辑的链接。"}],"result":"按角色分配最小必要权限。","variantType":"standard","id":"m5-cloud-example-1"},{"title":"边界对照","prompt":"同步目录里的文件被误删，同步能自动保证恢复吗？","steps":[{"text":"删除可能传播到其他同步设备。"},{"text":"应检查回收站、版本历史或独立备份的可恢复副本。"}],"result":"同步本身不提供必然恢复保证。","variantType":"boundary","id":"m5-cloud-example-2"}],"pitfalls":["文件在云端不意味着默认公开，也不意味着自动保密。","共享链接、直接授权与继承权限要分别核对。"],"takeaway":"按角色分配最小必要权限。","citations":[{"sourceId":"sharing","locator":"共享方式、查看/编辑权限及继承访问路径"},{"sourceId":"core","locator":"PDF第107页云服务类型"}]},"content":{"text":""}},{"id":"m5-auth","stageId":"m5","type":"concept","title":"认证因素、钓鱼识别、隐私与更新","objectiveIds":["m5"],"knowledge":{"title":"认证因素、钓鱼识别、隐私与更新","summary":"对应真题：41","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"信息安全题应从身份、权限、数据和维护四个环节读题。密码证明你知道一个秘密，多因素认证再增加另一类证明；它们可以降低风险，但都不构成永远不会被盗的保证。","sections":[{"id":"m5-auth-s1","title":"密码和独立因素","body":"密码与PIN同属知道的秘密，一张硬件安全密钥属于持有的物品，生物特征属于自身特征。两次输入同一个密码不是多因素认证；两种秘密也不是两类因素。验证码具体属于哪类须看其实现和持有渠道，基础题可用密码加硬件安全密钥说明两类因素。"},{"id":"m5-auth-s2","title":"密码管理边界","body":"更长、独特的密码可降低猜测和重复泄漏带来的风险。发现泄漏时应更换受影响凭据并检查关联会话；不应把频繁机械改密当作所有环境通用的最优策略。现代指南不要求无条件周期性强制改密，学校或单位的具体政策需另外遵守，不能混为一道无条件判断题。"},{"id":"m5-auth-s3","title":"钓鱼与最小权限","body":"收到要求输入密码的链接，先核对真实域名、来源和任务，必要时从已知官方入口访问。HTTPS说明传输受到相应保护，不证明网站经营者可靠，仿冒站也可能使用HTTPS。应用权限应只授权完成任务所必需的部分，通讯录、定位、相册访问需按用途审核。"},{"id":"m5-auth-s4","title":"更新与恢复","body":"系统和应用更新可修补已知漏洞；补丁来自可信渠道，不应从不明弹窗下载。恶意软件防护有能力边界，不能断言能清除所有威胁。保存独立备份并验证恢复，有助于应对误删、故障和勒索。涉及个人信息时先判断收集是否必要，再决定共享与保存范围。"}],"workedExamples":[{"title":"标准例题","prompt":"密码加硬件安全密钥为什么是两类因素？","steps":[{"text":"密码属于知道的秘密。"},{"text":"硬件安全密钥属于持有的物品。"},{"text":"两类证明降低只泄漏一种凭据就被登录的风险。"}],"result":"不同类别；仍需防范会话劫持、钓鱼等其他风险。","variantType":"standard","id":"m5-auth-example-1"},{"title":"边界对照","prompt":"邮件链接有HTTPS和熟悉的标志，能直接输入校园账户密码吗？","steps":[{"text":"加密不证明域名和经营者身份符合预期。"},{"text":"核对真实域名或从学校已知入口进入。"}],"result":"不能仅凭HTTPS和标志判定可信。","variantType":"boundary","id":"m5-auth-example-2"}],"pitfalls":["PIN加密码通常仍是同一类因素。","现代安全说明和历史参考答案要分别标注。"],"takeaway":"不同类别；仍需防范会话劫持、钓鱼等其他风险。","citations":[{"sourceId":"exam","locator":"PDF第36页题41"},{"sourceId":"identity","locator":"认证因素、密码要求和凭据泄漏处理"},{"sourceId":"core","locator":"网络安全章节"}]},"content":{"text":""}},{"id":"m5-practice","stageId":"m5","type":"quiz","title":"网络与安全 · 分层练习","objectiveIds":["m5"],"content":{"items":[{"id":"m5-guided","module":"m5","kind":"single","practiceLevel":"guided","topicId":"m5-ipv6","objectiveIds":["m5"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"IPv6地址中::可以出现几次？","options":[{"id":"A","text":"任意次"},{"id":"B","text":"最多1次"},{"id":"C","text":"必须2次"},{"id":"D","text":"不能出现"}],"answer":["B"],"explanation":"多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。","feedback":{"correct":"判断正确。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。","incorrect":"先检查关键条件。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。"},"optionFeedback":{"A":"该项不满足题设。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。","B":"正确。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。","C":"该项不满足题设。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。","D":"该项不满足题设。多次会使省略的0组数分配不明确；展开总计8组。 八组字段的省略长度必须唯一确定；若有两处双冒号，会有多种补零分配方式。每组还要满足十六进制及长度限制。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m5-independent","module":"m5","kind":"single","practiceLevel":"independent","topicId":"m5-ip","objectiveIds":["m5"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"传统IPv4 /24子网常规可用主机地址数是多少？","options":[{"id":"A","text":"256"},{"id":"B","text":"255"},{"id":"C","text":"254"},{"id":"D","text":"128"}],"answer":["C"],"explanation":"8位主机位共有256，减网络地址与广播地址为254，不计/31等特殊链路例外。 把256直接当可用数会把网络号和广播号算进去；255只减掉一个保留地址。这里是常规广播子网，不套特殊点 6-model","stageId":"m6","type":"concept","title":"数据库、DBMS与关系模型","objectiveIds":["m6"],"knowledge":{"title":"数据库、DBMS与关系模型","summary":"对应真题：","prerequisites":["一张二维表由行和列构成。"],"mentalModel":"数据库保存有组织的数据，数据库管理系统负责管理和访问数据，关系模型用表及表之间的联系描述数据。","sections":[{"id":"m6-model-s1","title":"概念层次","body":"DB是数据库；DBMS是数据库管理系统，如Access、MySQL；数据库系统还包括数据库、管理软件、应用和相关人员等。把MySQL称作一个员工数据表不准确，表是其管理的对象。"},{"id":"m6-model-s2","title":"关系表的术语","body":"关系模型中，一行通常叫记录/元组，一列叫字段/属性，表名和字段结构共同描述关系模式。记录个数与字段个数分别计数；不能因为一行有5个字段就说有5条记录。二维表表示关系，不等于层次模型或网状模型。"},{"id":"m6-model-s3","title":"字段类型选择","body":"姓名、专业一般用文本；数值计算的工资可用适合的数值/货币类型；日期用日期时间类型。工号、学号、电话即使只含数字，也可能要用文本保留前导零和固定格式。是否用于数值运算比“肉眼看起来是数字”更关键。"}],"workedExamples":[{"title":"标准例题","prompt":"Student表有3名学生、每人5个字段，多少记录多少字段？","steps":[{"text":"按行数记录，按列数字段。"},{"text":"3行学生对应3条记录，5列对应5个字段。"}],"result":"3条记录，5个字段。","exampleType":"standard","variantType":"standard","id":"m6-model-example-1"},{"title":"对照例题","prompt":"学号001与数值1在保存含义上是否相同？","steps":[{"text":"作为标识符，001需要保留固定格式。"},{"text":"数值1通常不会保留前导零。"}],"result":"可选文本存学号，不因全是数字就选数值。","exampleType":"contrast","variantType":"contrast","id":"m6-model-example-2"}],"pitfalls":["DB与DBMS不是同义词。","关系表的数据模型与Excel界面看起来相似不代表管理能力相同。"],"takeaway":"3条记录，5个字段。","citations":[{"sourceId":"exam25","locator":"PDF第2、7页，第16、45(1)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第97—99页"}]},"content":{"text":""}},{"id":"m6-key","stageId":"m6","type":"concept","title":"主键、唯一性与前导零标识","objectiveIds":["m6"],"knowledge":{"title":"主键、唯一性与前导零标识","summary":"对应真题：19","prerequisites":["主键用于稳定地识别一条记录。"],"mentalModel":"选主键要问：每条记录是否都有这个值，是否能唯一识别记录，而不是问这个字段是否最容易记。","sections":[{"id":"m6-key-s1","title":"主键的基本条件","body":"主键不能重复且不能为空，可由一个或多个字段组成。员工号比姓名、年龄、部门更适合做单字段主键，因为姓名可能重名、年龄和部门通常重复。主键不是“必须是第一列”或“必须是数字”。"},{"id":"m6-key-s2","title":"唯一性需要业务条件","body":"样本里恰好不重复的字段未必长期唯一。题目若说明工号唯一且非空，可据此选主键。若没有单字段唯一，可能需要组合键。一个表只有一个被选定的主键定义，但这个定义可含多个字段。"},{"id":"m6-key-s3","title":"标识字段的保存","body":"文本学号001、002可以作主键。电话通常不适合作学生主键，可能变更或共用。把001转成1会改变标识格式，数据类型选择要保持业务含义。"},{"id":"m6-key-transfer-check","title":"同类题的解题检查","body":"选择主键时先检查候选字段能否唯一识别记录，再检查是否允许空值，并考虑它的实际含义。同名、同龄或同部门都很常见，不能因为样例暂未重复就认定字段永久唯一。员工号、学号等通常是标识符；若题设要求保留前导零，文本字段更合适。主键可以由多个字段组成，但基础题给出一个明确唯一编号时，优先按题设编号作答，避免无依据地增加字段。"}],"workedExamples":[{"title":"标准例题","prompt":"员工表包含员工号、姓名、年龄、部门，应优先选哪个作主键？","steps":[{"text":"姓名、年龄、部门可能重复。"},{"text":"员工号按题设唯一且非空。"}],"result":"员工号。","exampleType":"standard","variantType":"standard","id":"m6-key-example-1"},{"title":"边界例题","prompt":"某小表当前姓名都不重名，能否据此保证姓名是可靠主键？","steps":[{"text":"当前样本不重复不代表未来业务约束唯一。"},{"text":"需要稳定唯一的规则支持。"}],"result":"不能仅凭当前样本决定。","exampleType":"boundary","variantType":"boundary","id":"m6-key-example-2"}],"pitfalls":["主键可以是文本。","组合主键是一个主键定义，不是多个互相独立的主键。"],"takeaway":"员工号。","citations":[{"sourceId":"exam","locator":"2024部分：题19，PDF第32页"},{"sourceId":"exam25","locator":"PDF第2页，第17题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第98—99页"}]},"content":{"text":""}},{"id":"m6-select","stageId":"m6","type":"concept","title":"SELECT、WHERE、LIKE与COUNT","objectiveIds":["m6"],"knowledge":{"title":"SELECT、WHERE、LIKE与COUNT","summary":"对应真题：18、32","prerequisites":["知道字段名、表名和文本常量的区别。"],"mentalModel":"把查询分成“输出什么、从哪里取、保留哪些记录”三步，SQL结构就不难记。","sections":[{"id":"m6-select-s1","title":"基础查询模板","body":{"parts":[{"text":"SELECT StuName, StuPhone FROM Student WHERE "},{"code":"Major='计算机' AND Sex='男'; 输出姓名和电话"},{"text":"，来源Student，只保留同时满足专业与性别的记录。字段名使用原表拼写，文本值使用英文引号。FROM不能写成Form。AND要求同时满足，OR表示至少满足一个。"}]}},{"id":"m6-select-s2","title":"LIKE与通配符的环境","body":"LIKE用于模式匹配。在Access桌面数据库默认ANSI-89模式中，*匹配零个或多个字符，?匹配一个字符，例如StuName LIKE '王*'。在MySQL等常见方言中用%和_；Access也存在ANSI-92模式。必须先读题目指定的方言，不可把一种通配符规则推广到所有环境。"},{"id":"m6-select-s3","title":"统计与排序","body":{"parts":[{"text":"COUNT(*)统计记录数；COUNT(字段)不计该字段为NULL的记录。原学号非空且有3条记录，所以"},{"formula":{"tex":"COUNT(StuID)=3","spoken":"COUNT(StuID)=3","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>COUNT<\/mi><mo>(<\/mo><mi>StuID<\/mi><mo>)<\/mo><mo>=<\/mo><mn>3<\/mn><\/mrow><\/math>"}},{"text":"。ORDER BY Score DESC按分数降序；没有ORDER BY时不保证结果顺序。DISTINCT对输出字段组合去重，不会直接删除原表记录。"}]}},{"id":"m6-select-range","title":"开闭区间和JOIN","body":"BETWEEN 20 AND 80包含两端。要与单价>=20 AND 单价<80等价，可写单价 BETWEEN 20 AND 80 AND 单价<80。JOIN把相关表按连接条件合并，连接条件通常利用主键与外键，缺少连接条件可能产生与预期不同的组合。SELECT负责查询，INSERT负责插入；判断关键字时应限定普通SELECT查询语句的语境，避免把SQL所有复杂语法都混在一起。"}],"workedExamples":[{"title":"标准例题","prompt":"Student三条记录学号均非空，SELECT COUNT(StuID) FROM Student返回什么？","steps":[{"text":"每条记录的StuID都计入。"},{"text":"共有3条。"}],"result":"3。","exampleType":"standard","variantType":"standard","id":"m6-select-example-1"},{"title":"边界例题","prompt":"四条记录里电话有一条NULL，COUNT(*)与COUNT(电话)各多少？","steps":[{"text":"COUNT(*)按记录计为4。"},{"text":"COUNT(电话)略过NULL。"}],"result":"4与3；空值条件决定差异。","exampleType":"boundary","variantType":"boundary","id":"m6-select-example-2"}],"pitfalls":["全角标点是排版展示，实际SQL应采用正确半角符号。","LIKE需明确数据库与ANSI模式。"],"takeaway":"3。","citations":[{"sourceId":"exam","locator":"2024部分：题18，PDF第32页；题32，PDF第33页"},{"sourceId":"exam25","locator":"PDF第2、7页，第18、45(2)、45(4)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第99—106页"}]},"content":{"text":""}},{"id":"m6-group","stageId":"m6","type":"concept","title":"GROUP BY、WHERE与HAVING的区别","objectiveIds":["m6"],"knowledge":{"title":"GROUP BY、WHERE与HAVING的区别","summary":"对应真题：","prerequisites":["聚合把多条记录汇总成一个结果。"],"mentalModel":"WHERE先筛原始记录，GROUP BY形成组，HAVING再筛汇总结果。不要把单条记录条件与组的总量条件放错位置。","sections":[{"id":"m6-group-s1","title":"按组统计","body":"SELECT Major, COUNT(*) FROM Student GROUP BY Major; 对每个专业形成一组并计算人数。输出普通字段时，应与分组关系相容。统计值属于整组，不是原表某一行的字段值。"},{"id":"m6-group-s2","title":"两阶段筛选","body":{"parts":[{"text":"若只统计男生，先用WHERE "},{"formula":{"tex":"Sex='男'","spoken":"Sex='男'","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Sex<\/mi><mo>=<\/mo><mtext>&#x27;<\/mtext><mtext>男<\/mtext><mtext>&#x27;<\/mtext><\/mrow><\/math>"}},{"text":"；若只保留人数至少2的专业，在GROUP BY后用HAVING COUNT(*)>=2。WHERE不能直接代替HAVING COUNT(*)条件，因为分组统计尚未产生。"}]}},{"id":"m6-group-s3","title":"HAVING是否必须搭配GROUP BY","body":"原判断题使用“必须”过于绝对。以MySQL的聚合查询为明确例子，SELECT COUNT(*) FROM Student HAVING COUNT(*)>=2; 可将筛选后的全部记录作为一个聚合组。因此原题判错有可支持的反例。不同方言的细节要单独说明，模拟题主要考WHERE与HAVING的语义差别，避免不标环境的绝对句。"}],"workedExamples":[{"title":"标准例题","prompt":"记录专业依次为计算机、通信、计算机，按专业分组且HAVING COUNT(*)>=2，保留哪个专业？","steps":[{"text":"计算机组2条，通信组1条。"},{"text":"HAVING只保留人数至少2的组。"}],"result":"计算机。","exampleType":"standard","variantType":"standard","id":"m6-group-example-1"},{"title":"边界例题","prompt":"MySQL中，没有GROUP BY的COUNT聚合可以使用HAVING筛总人数吗？","steps":[{"text":"全部满足WHERE的记录可构成一个聚合组。"},{"text":"HAVING再判断该组总人数。"}],"result":"可以；不要写“所有SQL必须显式GROUP BY”。","exampleType":"boundary","variantType":"boundary","id":"m6-group-example-2"}],"pitfalls":["分组不是排序。","先说明方言，反例不能无条件替代其他数据库语法检查。"],"takeaway":"计算机。","citations":[{"sourceId":"exam25","locator":"PDF第3页，第28题；考点题设依据。核心第106页支持GROUP BY；HAVING反例见所列MySQL来源，原题绝对表述的辨析为编者补充。"},{"sourceId":"core","locator":"PDF第106页（仅GROUP BY示例）"},{"sourceId":"mysql-group","locator":"HAVING与GROUP BY说明"}]},"content":{"text":""}},{"id":"m6-write","stageId":"m6","type":"concept","title":"INSERT、字段顺序与规范SQL书写","objectiveIds":["m6"],"knowledge":{"title":"INSERT、字段顺序与规范SQL书写","summary":"对应真题：20","prerequisites":["字段和对应值必须一一对齐。"],"mentalModel":"新增记录要说明放入哪个表、哪些列、每列什么值；先写列名可以减少位置错误。","sections":[{"id":"m6-write-s1","title":"INSERT的基本格式","body":"INSERT INTO Student (StuID,StuName,StuPhone,Major,Sex) VALUES ('004','小七','18349685212','通信工程','女'); 字段顺序和VALUES顺序对应。指定列名的写法便于核对；不指定时必须遵守表定义顺序并满足完整性约束。"},{"id":"m6-write-s2","title":"相似关键字的区别","body":"新增记录用INSERT INTO，不是ADD INTO。UPDATE配合SET修改已有记录；DELETE FROM删除符合条件的记录；CREATE TABLE新建表，不能拿来新增一名学生。此处只作为语句分类知识，不要求对真实数据库执行变更。"},{"id":"m6-write-s3","title":"可执行语法与排版错字","body":"FROM表示查询来源，应拼写准确，Form不是合法替代。用半角英文引号括文本，别把中文引号直接复制进数据库。原题答案中的“Form”应更正为FROM；学号004作为文本保留前导零。"},{"id":"m6-write-delete","title":"DELETE、DROP与条件","body":"DELETE FROM Students没有WHERE时删除全部记录，通常保留表结构。DROP TABLE Students则移除表对象，不能与DELETE互换。WHERE条件决定删哪些记录，删除前可先用同样条件SELECT检查目标集。UPDATE用于改现有记录，INSERT用于添加新记录；INSERT指定字段名能避免表结构变化引起字段顺序错误。"}],"workedExamples":[{"title":"标准例题","prompt":"已有Student表，要新增学号004的学生，首个关键字是什么？","steps":[{"text":"是新增记录而非新增字段。"},{"text":"使用INSERT INTO。"}],"result":"INSERT。","exampleType":"standard","variantType":"standard","id":"m6-write-example-1"},{"title":"对照例题","prompt":"VALUES给出姓名、学号，而列名先写学号、姓名，有什么问题？","steps":[{"text":"值按列名顺序赋给字段。"},{"text":"两项会颠倒。"}],"result":"必须调整顺序使字段与值一一对应。","exampleType":"contrast","variantType":"contrast","id":"m6-write-example-2"}],"pitfalls":["可执行SQL不能用省略号代替必需值。","WHERE省略会扩大UPDATE/DELETE的影响范围，题目与解析应精确说明。"],"takeaway":"INSERT。","citations":[{"sourceId":"exam","locator":"2024部分：题20，PDF第32页"},{"sourceId":"exam25","locator":"PDF第7页，第45(3)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第99—106页"},{"sourceId":"ms-insert","locator":"Single-record append query"}]},"content":{"text":""}},{"id":"m6-practice","stageId":"m6","type":"quiz","title":"数据库与SQL · 分层练习","objectiveIds":["m6"],"content":{"items":[{"id":"m6-guided","module":"m6","kind":"single","practiceLevel":"guided","topicId":"m6-select","objectiveIds":["m6"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"SQL中20≤单价<80应使用哪个条件？","options":[{"id":"A","text":"单价 BETWEEN 20 AND 80"},{"id":"B","text":"单价>=20 AND 单价<80"},{"id":"C","text":"单价>20 OR 单价<80"},{"id":"D","text":"单价=20 AND 单价=80"}],"answer":["B"],"explanation":"两个条件用AND连接，上界用严格小于；BETWEEN含上界80。 BETWEEN同时包含两个端点，会误选80；OR使条件过宽，两个等号AND则不可能同时成立。应分别检查20与80两个边界。","feedback":{"correct":"判断正确。两个条件用AND连接，上界用严格小于；BETWEEN含上界80。 BETWEEN同时包含两个端点，会误选80；OR使条件过宽，两个等号AND则不可能同时成立。应分别检查20与80两个边界。","incorrect":"先检查关键条件。两个条件用AND连接，上界用严格小于；BETWEEN含上界80。 BETWEEN同时包含两个端点，会误选80；OR使条件过宽，两个等号AND则不可能同时成立。应分别检查20与80两个边界。"},"optionFeedback":{"A":"该项不满足题设。两个条件用AND连接，上界用严格小于；BETWEEN含上界80。 BETWEEN同时包含两个端点，会误选80；OR使条件过宽，两个等号AND则不可能同时成立。应分别检查20与80两个边界。","B":"正确。两个条件用AND连接，上界用严格小于；BETWEEN含上界80。 BETWEE ROP TABLE才删除表结构，二者不能互换。","incorrect":"先检查关键条件。DELETE删除匹配记录而保留结构；级联行为须另有外键配置，不可默认存在。 删除条件只作用于满足条件的记录，表名、列定义和未命中记录仍保留。DROP TABLE才删除表结构，二者不能互换。"},"optionFeedback":{"A":"正确。DELETE删除匹配记录而保留结构；级联行为须另有外键配置，不可默认存在。 删除条件只作用于满足条件的记录，表名、列定义和未命中记录仍保留。DROP TABLE才删除表结构，二者不能互换。","B":"该项不满足题设。DELETE删除匹配记录而保留结构；级联行为须另有外键配置，不可默认存在。 删除条件只作用于满足条件的记录，表名、列定义和未命中记录仍保留。DROP TABLE才删除表结构，二者不能互换。","C":"该项不满足题设。DELETE删除匹配记录而保留结构；级联行为须另有外键配置，不可默认存在。 删除条件只作用于满足条件的记录，表名、列定义和未命中记录仍保留。DROP TABLE才删除表结构，二者不能互换。","D":"该项不满足题设。DELETE删除匹配记录而保留结构；级联行为须另有外键配置，不可默认存在。 删除条件只作用于满足条件的记录，表名、列定义和未命中记录仍保留。DROP TABLE才删除表结构，二者不能互换。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"}]}},{"id":"m7-media","stageId":"m7","type":"concept","title":"图像容量、音频采样与压缩标准","objectiveIds":["m7"],"knowledge":{"title":"图像容量、音频采样与压缩标准","summary":"对应真题：21、22、23、33","prerequisites":["会做位与字节的换算。"],"mentalModel":"未压缩容量按“每个采样单元需要多少位×采样单元数量”计算；压缩后的大小则取决于编码与内容，不能套同一结果。","sections":[{"id":"m7-media-s1","title":"图像容量","body":"未压缩、忽略文件头和行填充时，图像数据量=宽×高×每像素位数÷8字节。原题1920×1080、24位，数据量6220800 B；按1024^2换算约5.93 MiB。24位是每像素的位数，不是整张图只有24位，也不是24字节。"},{"id":"m7-media-s2","title":"音频采样参数","body":"采样频率是每秒采集声音样本的次数，单位Hz；量化位数描述一个样本的幅值编码位数；声道数表示并行音频通道数量。未经压缩的PCM数据量=采样频率×量化位数×声道数×秒数÷8。采样频率提高通常增大原始数据量，不等于声音自动更响。"},{"id":"m7-media-s3","title":"压缩与媒体类型","body":"JPEG常用于静态图像有损压缩，PNG常用于无损图像，MPEG系列涉及数字视频及音频编码；教材把MPEG概括为动态图像压缩标准，原判断题按此常用口径判对。有损压缩可丢弃信息，无损压缩可还原原数据；同一视频的实际文件大小不能只靠分辨率唯一确定。"},{"id":"m7-media-units","title":"2024音频题的单位核验","body":{"parts":[{"text":"PCM数据字节数按采样率(Hz)乘量化位数、声道数、秒数，再除8。48kHz按48000Hz，5分钟为300秒，16位双声道原始数据为57600000字节；按10:1压缩得5760000字节。若"},{"formula":{"tex":"KB=1000字节则为5760KB","spoken":"KB=1000字节则为5760KB","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>KB<\/mi><mo>=<\/mo><mn>1000<\/mn><mtext>字<\/mtext><mtext>节<\/mtext><mtext>则<\/mtext><mtext>为<\/mtext><mn>5760<\/mn><mi>KB<\/mi><\/mrow><\/math>"}},{"text":"；若"},{"formula":{"tex":"KiB=1024字节则为5625KiB","spoken":"KiB=1024字节则为5625KiB","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>KiB<\/mi><mo>=<\/mo><mn>1024<\/mn><mtext>字<\/mtext><mtext>节<\/mtext><mtext>则<\/mtext><mtext>为<\/mtext><mn>5625<\/mn><mi>KiB<\/mi><\/mrow><\/math>"}},{"text":"。原答案采用十进制KB，题35又按1"},{"formula":{"tex":"KB=1024字节处理ASCII容量","spoken":"KB=1024字节处理ASCII容量","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>KB<\/mi><mo>=<\/mo><mn>1024<\/mn><mtext>字<\/mtext><mtext>节<\/mtext><mtext>处<\/mtext><mtext>理<\/mtext><mi>ASCII<\/mi><mtext>容<\/mtext><mtext>量<\/mtext><\/mrow><\/math>"}},{"text":"，必须说明各题约定。GIF可保存多帧动画，也可保存静态图，不能仅凭扩展名宣称一定在动。"}]}}],"workedExamples":[{"title":"标准例题","prompt":"800×600、24位未压缩图像，忽略附加信息，容量多少字节？","steps":[{"text":"像素数480000。"},{"text":"每像素24÷8=3 B。"},{"text":"480000×3=1440000 B。"}],"result":"1440000 B，按1024换算约1.37 MiB。","exampleType":"standard","variantType":"standard","id":"m7-media-example-1"},{"title":"边界例题","prompt":"44.1kHz、16位、双声道PCM录音10秒，多少字节？","steps":[{"text":"44100×16×2×10得到位数。"},{"text":"再除以8。"}],"result":"1764000 B；别漏掉声道或除8。","exampleType":"boundary","variantType":"boundary","id":"m7-media-example-2"}],"pitfalls":["未说明压缩方式不能精确推断压缩文件大小。","MB/ MiB、bit/B必须按题设统一。"],"takeaway":"1440000 B，按1024换算约1.37 MiB。","citations":[{"sourceId":"exam","locator":"2024部分：题21，PDF第32页；题22，PDF第32页；题23，PDF第32页；题33，PDF第34页"},{"sourceId":"exam25","locator":"PDF第2—3页，第19、20、29题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第15—20页"}]},"content":{"text":""}},{"id":"m7-newtech","stageId":"m7","type":"concept","title":"大数据、AI、云服务与RFID","objectiveIds":["m7"],"knowledge":{"title":"大数据、AI、云服务与RFID","summary":"对应真题：13、25、30、39","prerequisites":["通过功能区分技术名称，不靠场景是否新颖。"],"mentalModel":"新技术题主要考“技术解决什么问题”。数据多、系统联网或设备自动运行，不能单独证明它用了人工智能。","sections":[{"id":"m7-newtech-s1","title":"大数据的常见特征","body":"基础教材常用大量Volume、多样Variety、高速Velocity、价值Value概括，常强调有用价值密度较低，需要从大量数据中提取价值；扩展版本还可能加入真实性Veracity。不同V模型不能混背固定数量。原题“不属于”的选项是价值密度高。"},{"id":"m7-newtech-s2","title":"人工智能的应用边界","body":"语音识别、人脸识别、自动驾驶中的感知与决策是常见AI应用。普通文件复制按确定规则搬运数据，不因由计算机自动完成就成为AI。现代系统可能同时包含AI与普通功能，题目应明确考哪项核心处理。"},{"id":"m7-newtech-s3","title":"IaaS、PaaS、SaaS","body":"IaaS提供计算、存储、网络等基础资源，用户可部署操作系统和软件；PaaS提供应用开发运行平台；SaaS交付可直接使用的成品应用服务。先问租用的是资源、平台还是应用，再分类。部署在云端不意味着三个概念可以互换。"},{"id":"m7-newtech-s4","title":"RFID与二维码","body":"RFID通过射频与电子标签交换识别信息；二维码依赖图形编码与光学读取。身份证等含芯片证件的非接触读取不等于扫二维码。真实进站系统还可能配合身份核验等步骤，不能把整个流程简化为一项技术。"}],"workedExamples":[{"title":"标准例题","prompt":"租用虚拟机并自行安装数据库，与直接使用在线文档分别属于什么服务？","steps":[{"text":"前者购买基础计算资源。"},{"text":"后者使用完成的应用。"}],"result":"前者IaaS，后者SaaS。","exampleType":"standard","variantType":"standard","id":"m7-newtech-example-1"},{"title":"易混例题","prompt":"复制文件是自动操作，所以属于AI，这个推断成立吗？","steps":[{"text":"自动执行确定步骤是普通程序也能做到的。"},{"text":"题目未涉及识别、学习或智能决策。"}],"result":"不成立。","exampleType":"misconception","variantType":"misconception","id":"m7-newtech-example-2"}],"pitfalls":["不能把低价值密度理解成完全没有价值。","RFID与二维码读取原理不同。"],"takeaway":"前者IaaS，后者SaaS。","citations":[{"sourceId":"exam","locator":"2024部分：题13，PDF第31页；题25，PDF第32页；题30，PDF第33页；题39，PDF第35页"},{"sourceId":"exam25","locator":"PDF第3页，第21—23、30题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第3—8、107—111页"}]},"content":{"text":""}},{"id":"m7-genai","stageId":"m7","type":"concept","title":"生成式AI、计算机视觉与输出核验","objectiveIds":["m7"],"knowledge":{"title":"生成式AI、计算机视觉与输出核验","summary":"对应真题：","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"识别、预测和生成是不同任务。能生成流畅文字，不代表系统已核实每个事实；能识别图片，也不代表所有生物特征识别都只能靠摄像头。先看输入、输出和方法再分类。","sections":[{"id":"m7-genai-s1","title":"任务分类","body":"计算机视觉处理图像或视频中的信息，人脸、虹膜等视觉识别是典型情境。密码比对不属于视觉任务。指纹可以通过不同传感方式获得，因此“所有指纹识别都必须是视觉”需要限定。生成式AI产生文字、图像、音频等内容，与只判断某个类别的系统存在任务差别。"},{"id":"m7-genai-s2","title":"错误输出与核验","body":"生成式系统可能给出听起来确定却错误的内容，包括编造资料名称、误算数据或遗漏条件。核验应回到原始资料、可信文档或独立计算；再问一次同一模型不是独立证据。对考试公式与SQL可使用题目数据复算，而不是仅检查语句看起来专业。"},{"id":"m7-genai-s3","title":"数据隐私与授权","body":"将学号、成绩、联系方式或未公开文件输入在线系统前，应确认必要性、授权和服务的数据处理规则。可以先移除不必要的标识，改用虚构例子学习表达。去掉姓名不必然完成匿名化，其他字段组合仍可能识别人。"},{"id":"m7-genai-s4","title":"人机分工与监督","body":"AI可以辅助整理提纲、提出变式、生成代码草稿，但人仍需检查条件、来源、结果和使用权限。更清楚的任务描述可减少歧义，却不能保证输出永远正确。自动化决策涉及个人利益时，更要明确复核与纠错路径，不能把模型建议直接包装成事实。"}],"workedExamples":[{"title":"标准例题","prompt":"AI列出三个资料来源，但其中一个网址打不开且查不到原文，应怎么办？","steps":[{"text":"把来源看作待核验信息。"},{"text":"检索原发布者或数据库，核对题名和内容。"},{"text":"无法核验时保留未核验状态，不能补造原文。"}],"result":"流畅引用不等于可追溯证据。","variantType":"standard","id":"m7-genai-example-1"},{"title":"边界对照","prompt":"仅去掉姓名后上传成绩、学号和手机号，是否已匿名？","steps":[{"text":"学号和手机号仍可直接或间接识别人。"},{"text":"删除姓名不能消除其余识别字段。"}],"result":"尚不能称匿名数据。","variantType":"boundary","id":"m7-genai-example-2"}],"pitfalls":["生成的代码需要检查和测试。","提示更详细不保证事实更准确。"],"takeaway":"流畅引用不等于可追溯证据。","citations":[{"sourceId":"genai","locator":"错误输出、数据隐私、人机配置风险；案例与解题方法为编者原创"},{"sourceId":"exam","locator":"PDF第31页题13；第33页题30"}]},"content":{"text":""}},{"id":"m7-practice","stageId":"m7","type":"quiz","title":"多媒体与新技术 · 分层练习","objectiveIds":["m7"],"content":{"items":[{"id":"m7-guided","module":"m7","kind":"single","practiceLevel":"guided","topicId":"m7-media","objectiveIds":["m7"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"10秒、8kHz、16位、单声道PCM占多少字节，不计头？","options":[{"id":"A","text":"160000"},{"id":"B","text":"1280000"},{"id":"C","text":"80000"},{"id":"D","text":"16000"}],"answer":["A"],"explanation":"10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。","feedback":{"correct":"判断正确。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。","incorrect":"先检查关键条件。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。"},"optionFeedback":{"A":"正确。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。","B":"该项不满足题设。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。","C":"该项不满足题设。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000是位数而不是字节；少乘时间或量化位数都会明显低估容量。","D":"该项不满足题设。10×8000×16÷8=160000B；16位是每采样位数。 先算每秒每声道的数据位数，再乘时间并除八。1280000 标是改变并稳定环境，不是存储、排版或增强图像。传感器失效或通信中断时也要有本地保护，不能默认云端永远可用。","B":"正确。传感器观测，经控制逻辑形成动作，再由环境变化反馈；通信故障需安全策略。 控制目标是改变并稳定环境，不是存储、排版或增强图像。传感器失效或通信中断时也要有本地保护，不能默认云端永远可用。","C":"该项不满足题设。传感器观测，经控制逻辑形成动作，再由环境变化反馈；通信故障需安全策略。 控制目标是改变并稳定环境，不是存储、排版或增强图像。传感器失效或通信中断时也要有本地保护，不能默认云端永远可用。","D":"该项不满足题设。传感器观测，经控制逻辑形成动作，再由环境变化反馈；通信故障需安全策略。 控制目标是改变并稳定环境，不是存储、排版或增强图像。传感器失效或通信中断时也要有本地保护，不能默认云端永远可用。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"}]}},{"id":"m8-method","stageId":"m8","type":"concept","title":"算法特征、三种结构与枚举建模","objectiveIds":["m8"],"knowledge":{"title":"算法特征、三种结构与枚举建模","summary":"对应真题：9、10、42","prerequisites":["算法是解决问题的明确步骤。"],"mentalModel":"先定义输入、输出和条件，再选择逐个试、逐步推或排序查找等方法。算法名称必须和实际步骤一致。","sections":[{"id":"m8-method-s1","title":"算法的基本要求","body":"常用五个特征是有穷性、确定性、可行性、输入和输出。输入可为0个或多个，必须有相应输出；步骤需要有限可执行并能终止。可读性是质量评价之一，不属于教材常列的五个基本特征。"},{"id":"m8-method-s2","title":"顺序、选择、循环","body":"顺序结构依次执行；选择结构根据条件走不同分支；循环重复执行直到停止条件满足。一个实际算法可组合三种结构。流程图的回边、真假分支和变量更新要与伪代码相符。"},{"id":"m8-method-s3","title":"枚举与递推的区别","body":"枚举在明确候选集合中逐个检查是否满足条件。例如缺失百位的五位数可让该位从0到9取值，再检测能否被57和68整除。递推/迭代从初值按关系不断产生下一状态，如每轮翻倍。查找通常在已有集合定位目标，排序改变数据的次序。原第24题选择枚举，不必先求出未知数才能判断方法。"}],"workedExamples":[{"title":"标准例题","prompt":"某个五位编号的百位未知，其余位确定，要找符合整除条件的候选应怎样做？","steps":[{"text":"让未知位取0..9。"},{"text":"拼出完整编号。"},{"text":"逐个测试所有条件并保存符合者。"}],"result":"枚举候选并验证。","exampleType":"standard","variantType":"standard","id":"m8-method-example-1"},{"title":"边界例题","prompt":"循环中条件永远为真且变量不变，是否符合算法有穷性？","steps":[{"text":"没有机制达到停止状态。"},{"text":"对这种输入不会在有限步内结束。"}],"result":"不符合，需修改更新或停止条件。","exampleType":"boundary","variantType":"boundary","id":"m8-method-example-2"}],"pitfalls":["“自动执行”不等于算法有穷。","必须枚举所有允许候选，不漏0和9等边界。"],"takeaway":"枚举候选并验证。","citations":[{"sourceId":"exam","locator":"2024部分：题9，PDF第30页；题10，PDF第30页；题28，PDF第32页；题42，PDF第36页"},{"sourceId":"exam25","locator":"PDF第3、7页，第24、46(2)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第82—84页"}]},"content":{"text":""}},{"id":"m8-recursion","stageId":"m8","type":"interactive","title":"递归的基例、规模变化与返回","objectiveIds":["m8"],"knowledge":{"title":"递归的基例、规模变化与返回","summary":"对应真题：11","prerequisites":["函数调用会暂存当前执行位置与局部状态。"],"mentalModel":"递归是直接或间接调用自身；能否结束取决于是否到达基例，而不是调用形式是否看起来短。","sections":[{"id":"m8-recursion-s1","title":"直接与间接递归","body":"函数F内部调用F是直接递归；F调用G而G又调用F是间接递归。普通循环在同一执行框架内重复，不一定发生自调用。原第37题描述自调用，因此填递归。"},{"id":"m8-recursion-s2","title":"两个必需部分","body":"基例给出无需继续分解的最小问题答案；递归分支把问题规模推向基例。例如factorial(n)在n<=1时返回1，否则返回n*factorial(n-1)。题目应规定n为正整数，避免把表达式不加条件推广到其他输入。"},{"id":"m8-recursion-s3","title":"进入和返回分开追踪","body":"factorial(4)依次进入4、3、2、1，再返回1、2、6、24。返回值、总调用次数和最大调用深度是不同指标。在这个无缓存单支实现中初始调用计入，共4次；改成双分支递归后计数规则会不同。网页提供对应调用栈的逐步演示。"},{"id":"m8-recursion-transfer-check","title":"同类题的解题检查","body":"追踪递归可建立一张调用表，依次记录当前参数、尚未完成的计算和返回结果。例如阶乘从4依次调用3、2、1，到基例先返回1，再按相反方向完成2、6、24。调用阶段参数递减，返回阶段结果逐层合成；两种顺序不要混淆。验证递归时要分别检查基例是否正确、规模是否向基例靠近、返回值是否参与外层计算。仅有自调用而没有可达停止条件，会导致无法正常结束。"}],"workedExamples":[{"title":"标准例题","prompt":{"parts":[{"formula":{"tex":"F(n)=1(n<=1)","spoken":"F(n)=1(n<=1)","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>(<\/mo><mi>n<\/mi><mo>)<\/mo><mo>=<\/mo><mn>1<\/mn><mo>(<\/mo><mi>n<\/mi><mo>&lt;<\/mo><mo>=<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><\/math>"}},{"text":"，否则n*F(n-1)，F(4)是多少？"}]},"steps":[{"text":{"parts":[{"formula":{"tex":"F(1)=1","spoken":"F(1)=1","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>(<\/mo><mn>1<\/mn><mo>)<\/mo><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>"}},{"text":"。"}]}},{"text":{"parts":[{"formula":{"tex":"F(2)=2×1=2","spoken":"F(2)=2×1=2","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>(<\/mo><mn>2<\/mn><mo>)<\/mo><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>1<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/math>"}},{"text":"。"}]}},{"text":{"parts":[{"formula":{"tex":"F(3)=3×2=6","spoken":"F(3)=3×2=6","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F ":"，本材料解释为每有效加速秒速度增加0.01km/s。9到16.7需770个有效秒。每完整100个加速秒后暂停10秒，达到目标时立即结束，则在100..700秒后暂停7次，共770+70=840秒。原流程在连续计数w到100时执行"},{"formula":{"tex":"t=t+10并重置w","spoken":"t=t+10并重置w","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>=<\/mo><mi>t<\/mi><mo>+<\/mo><mn>10<\/mn><mtext>并<\/mtext><mtext>重<\/mtext><mtext>置<\/mtext><mi>w<\/mi><\/mrow><\/math>"}},{"text":"。若目标恰在第100个有效秒达到，应另读停止与暂停顺序，不能机械再加暂停。"}]}},{"id":"m8-loop-s3","title":"对折与指数阈值","body":{"parts":[{"text":"原纸厚0.1mm，目标8848.86"},{"formula":{"tex":"m=8848860mm","spoken":"m=8848860mm","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>=<\/mo><mn>8848860<\/mn><mi>mm<\/mi><\/mrow><\/math>"}},{"text":"，每折一次厚度翻倍。0.1*2^26=6710886.4mm仍不足，0.1*2^27=13421772.8mm已达到，所以最少27次。要求达到目标时，继续条件为s<目标；要求严格超过则可用s<=目标。原数值下两条件得到同一次数，但一般边界不同。"}]}},{"id":"m8-loop-s4","title":"两两配对的累计","body":{"parts":[{"text":"n人各与其他人碰杯一次，总次数为n(n-1)/2。迭代可从"},{"formula":{"tex":"n=1","spoken":"n=1","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>"}},{"text":","},{"formula":{"tex":"s=0开始","spoken":"s=0开始","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><mo>=<\/mo><mn>0<\/mn><mtext>开<\/mtext><mtext>始<\/mtext><\/mrow><\/math>"}},{"text":"，每加一人新增加n次，再令"},{"formula":{"tex":"n=n+1","spoken":"n=n+1","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>=<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/math>"}},{"text":"。s达到903时"},{"formula":{"tex":"n=43","spoken":"n=43","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>=<\/mo><mn>43<\/mn><\/mrow><\/math>"}},{"text":"，因为43*42/2=903。若总次数不保证可行，循环应在s>=目标时停止，并判断是否恰等于，避免用s!=目标造成无限增长。"}]}}],"workedExamples":[{"title":"标准例题","prompt":"起始数量3，每轮翻倍，首次至少100需要几轮？","steps":[{"text":"3、6、12、24、48、96、192依次 ":{"A":"该项不满足题设。4与相邻4相等，不是严格峰；只有5同时大于左右邻居。 两处连续的四都只有非严格优势，至少一个邻居相等，所以均不合格。首尾也不计入，逐个检查内部下标才能得到唯一峰。","B":"正确。4与相邻4相等，不是严格峰；只有5同时大于左右邻居。 两处连续的四都只有非严格优势，至少一个邻居相等，所以均不合格。首尾也不计入，逐个检查内部下标才能得到唯一峰。","C":"该项不满足题设。4与相邻4相等，不是严格峰；只有5同时大于左右邻居。 两处连续的四都只有非严格优势，至少一个邻居相等，所以均不合格。首尾也不计入，逐个检查内部下标才能得到唯一峰。","D":"该项不满足题设。4与相邻4相等，不是严格峰；只有5同时大于左右邻居。 两处连续的四都只有非严格优势，至少一个邻居相等，所以均不合格。首尾也不计入，逐个检查内部下标才能得到唯一峰。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"}]}},{"id":"exam-A","stageId":"exams","type":"quiz","title":"模拟卷 A","content":{"examId":"A","items":[]}},{"id":"exam-B","stageId":"exams","type":"quiz","title":"模拟卷 B","content":{"examId":"B","items":[]}},{"id":"exam-C","stageId":"exams","type":"quiz","title":"模拟卷 C","content":{"examId":"C","items":[]}},{"id":"wrong-review","stageId":"exams","type":"orientation","title":"错题复习","content":{"wrongReview":true},"knowledge":{"prerequisites":["能分清题目要求、给定输入与输出。"],"mentalModel":"有效复盘不是重复答案，而是找出从条件到结论的哪一步出了问题。先分清对象，再统一单位与表示，最后用边界验证推理。","sections":[{"id":"review-1","title":"先辨认题目要求","body":"同一道题可以问软件操作、数据结果，也可以问流程图实际输出。首先圈出任务动词：统计要给汇总值，查询要确定符合条件的记录，补空要结合空位的形状和已有文字，作图要给完整的控制路径。计算机基础知识不能只背术语。比如文件长度与占用空间都以字节计量，但占用空间还受簇大小约束；“看到多少行”也不等于数据库真正保存多少行，筛选一般只是隐藏记录。明确被问的对象，是判断选项与公式之前的第一步。"},{"id":"review-2","title":"再确定条件与表示","body":"单位、下标与软件环境会改变答案。音频容量先根据采样率、时间、量化位数和声道数求总位数，再换字节；十进制KB与二进制KiB不能混用。数组从零开始时，第一个内部元素的下标是一，最后一个内部元素是倒数第二个；两端无法同时拥有左右邻居。Excel复制公式时，要先辨认每一段引用是随行移动、随列移动还是固定。SQL查询要区分逐行筛选和汇总后筛选，日期、通配符与函数语法还应服从题目注明的方言。"},{"id":"review-3","title":"把推理展开成可检查的步骤","body":"只写一个最终数字往往掩盖条件误读。先列输入和中间量，再检查最小值、最大值与恰好到达阈值的情况。分段价格的第一段费用应完整保留，而不是把全部数量都乘末段折扣。平均值算法要分别记录累计和与有效个数，结束哨兵不进入这两个量；没有有效数据时走单独分支，不能直接相除。枚举要证明候选范围包含全部可能情况；循环不仅要使条件变化，还要让每条路径都能完成必要的更新，否则遇到特定输入可能停滞。"},{"id":"review-4","title":"核对依据而不是只看结论","body":"所给参考答案是重要依据，但仍要与题图、题干和独立计算互相核对。若参考答案的位置写反、单位约定含混或图中数据相互冲突，应同时记录原答案和核验结果，不能把修正后的图当成原图。相同结果并不证明算法普遍正确，可以通过边界用例寻找反例。现代安全题也要注意适用范围：加密保护传输，不能证明网页内容真实；云同步便于协作，不能自动代替独立备份；人工智能生成的文字流畅，并不能保证事实与引用可靠。"}],"workedExamples":[{"title":"复盘例题","prompt":"平均气温算法把结束标记0也计入总天数，应该纠正哪一类错误？","steps":[{"text":"标记用于控制输入结束，不属于有效温度数据。"},{"text":"先判断是否结束，再执行累计与计数。"},{"text":"检查首个输入即结束和只有一条有效数据两个边界。"}],"result":"属于输入语义与更新次序错误；改正后还需防护空输入。"}],"pitfalls":["参考答案与独立核验必须分栏记录。","样例正确不等于所有输入均正确。"],"citations":[{"sourceId":"exam","locator":"2024原题29—37页与应用题边界"},{"sourceId":"answers","locator":"原答案21—24页；勘误对照"}],"title":"把错题转化为可检验的规则"}}],"moduleTitles":{"m1":"计算机系统与编码","m2":"Windows与进程","m3":"Word与PowerPoint","m4":"Excel公式与数据处理","m5":"网络与安全","m6":"数据库与SQL","m7":"多媒体与新技术","m8":"算法与流程图"},"topicTitles":{"m1-system":"冯·诺依曼体系、硬件与软件分类","m1-encoding":"ASCII、汉字编码与点阵字模","m1-radix":"进制转换与数值表示","m1-logic":"按位与、或、非、异或","m1-storage":"位、字节、寻址空间与容量单位","m1-complement":"有符号整数与补码的双向转换","m2-process":"程序、进程与就绪/运行/阻塞","m2-task":"任务管理器：打开、读表与结束任务","m2-files":"Windows目录、文件名、路径与文件系统","m3-format":"字符格式、段落对齐、项目符号与页眉","m3-ppt":"PowerPoint视图、放映与超链接","m3-toc":"Word另存、页边距、标题样式、目录与分节","m4-text":"文本提取、连接符与前导零","m4-ref":"相对、绝对、混合引用与跨表引用","m4-sort":"数据清单与多关键字排序","m4-lookup":"SUM、跨表引用与VLOOKUP精确查找","m4-if":"IF嵌套、绩效档位与公式核对","m4-pmt":"PMT等额付款函数：周期、现金流与参数","m4-pivot":"数据清单、筛选与数据透视表","m4-fill":"Excel自动填充、名称框与选择性粘贴","m4-stat":"AVERAGE、ROUND、ABS与RANK：评分表的完整计算","m5-layers":"网络层次、路由器、交换机与网卡","m5-protocol":"TCP/IP协议、FTP、DNS与网络诊断","m5-web":"Web服务器、网页访问与IIS","m5-security":"防火墙、恶意软件与安全能力边界","m5-media":"有线、无线传输介质与无线接入","m5-ip":"IPv4、传统分类、子网掩码与网关","m5-ipv6":"IPv6的128位地址、零压缩与安全边界","m5-cloud":"云服务、协作权限、同步、版本历史与备份","m5-auth":"认证因素、钓鱼识别、隐私与更新","m6-model":"数据库、DBMS与关系模型","m6-key":"主键、唯一性与前导零标识","m6-select":"SELECT、WHERE、LIKE与COUNT","m6-group":"GROUP BY、WHERE与HAVING的区别","m6-write":"INSERT、字段顺序与规范SQL书写","m7-media":"图像容量、音频采样与压缩标准","m7-newtech":"大数据、AI、云服务与RFID","m7-genai":"生成式AI、计算机视觉与输出核验","m8-method":"算法特征、三种结构与枚举建模","m8-recursion":"递归的基例、规模变化与返回","m8-loop":"循环追踪、暂停计时、阈值与累计人数","m8-sentinel":"哨兵输入、累计平均与零个数据","m8-peaks":"数组非边界峰值：邻项、下标与循环边界","m8-piecewise":"分段计费、条件互斥与循环外提"},"moduleTopics":{"m1":"m1-system","m2":"m2-process","m3":"m3-format","m4":"m4-text","m5":"m5-layers","m6":"m6-model","m7":"m7-media","m8":"m8-method"},"sourceCover  function renderKnowledge(scene){const k=scene.knowledge||scene.content?.knowledge;if(!k)return'';const title=k.title||'本节知识';let body='',idx=0;const figs=k.pedagogicalFigures||[],animations=k.processAnimations||[],usedFigs=new Set(),examples=[...(k.workedExamples||[])];if(k.example)examples.unshift(typeof k.example==='string'?{title:'例子',text:k.example}:k.example);const inlineFigIds=new Set(examples.map(ex=>ex&&typeof ex==='object'?ex.figureRef:null).filter(Boolean)),figuresById=Object.fromEntries(figs.filter(f=>f?.id).map(f=>[f.id,f]));
 const add=(label,html,cls='')=>{const id=sectionId(scene,label,idx++);body+=`<section id="${esc(id)}" class="knowledge-section ${cls}" data-toc-title="${esc(label)}"><div class="knowledge-label">${esc(label)}</div>${html}</section>`};

  if(k.mechanism)add('机制与推理链',`<div class="knowledge-prose">${prose(k.mechanism)}</div>`);addFigs('mechanism');addAnimations('mechanism');

function startMotion(scene){const c=widgetContent(scene),st=motionState(scene,c),m=motionCalc(scene,c);if(st.playing){stopMotion(scene.id);updateMotionDom(scene);return}if(reduceMotion){st.t=st.t>=m.T-.001?0:m.T;st.playing=false;updateMotionDom(scene);return}if(st.t>=m.T-.001)st.t=0;st.playing=true;updateMotionDom(scene);let last=performance.now();const tick=now=>{if(state.sceneId!==scene.id||!st.playing){stopMotion(scene.id);return}const dt=Math.max(0,(now-last)/1000);last=now;const mm=motionCalc(scene,c);st.t=Math.min(mm.T,st.t+dt*(Number(c.widgetConfig?.playbackRate)||1));updateMotionDom(scene);if(st.t>=mm.T){st.t=mm.T;stopMotion(scene.id);updateMotionDom(scene);return}motionTimers[scene.id]=requestAnimationFrame(tick)};motionTimers[scene.id]=requestAnimationFrame(tick)}

后原样上传","只把文件名改为“匿名”后上传","遵守学校授权规则，只提供完成任务必需且经过适当去标识的数据"],"correct":3,"answer_text":"D：遵守授权规则并最小化、适当去标识数据。","option_explanations":["原样上传会泄露超出任务需要的个人信息。","模型的语言承诺不是服务的数据处理政策或授权。","改文件名不改变内部身份证号等个人信息。","先确认是否获准使用该服务，再减少字段并适当去标识，符合数据最小化思路。"],"explanation":["成绩分析通常不需要身份证号。","应先按学校规则确认服务和处理方式获准，再删除无关字段并考虑重识别风险。","若不能满足规则，应使用获准的本地工具或其他合规方式。"],"pitfall":"仅删姓名不一定充分匿名；去标识与完全无法重识别不同。","modern_extension":true,"topicIds":["m7-genai"]},{"number":24,"type":"single","module":"m4","topicId":"m4-fill","points":2,"stem":"在Excel的A1输入3、A2输入7，同时选中两格，按等差序列向下填充至A5，A5应为（ ）。","options":["7","15","19","21"],"correct":2,"answer_text":"C：19。","option_explanations":["7是第二项，不是第5项。","15是第4项。","公差为4，第5项3+(5-1)×4=19。","21不是该等差序列中的第5项。"],"explanation":["由前两项推得公差7-3=4。","后续项依次为11、15、19。","题目明确按等差序列填充，因此A5=19。"],"pitfall":"只选一个数直接拖动时可能是复制，实际界面可在填充选项中指定序列。","modern_extension":false,"topicIds":["m4-fill"]},{"number":25,"type":"single","module":"m4","topicId":"m4-stat","points":2,"stem":"B2:B6依次为“已交、未交、已交、待核验、已交”。统计其中“已交”数量应使用（ ）。","options":["=SUM(B2:B6)","=COUNTIF(B2:B6,\"已交\")","=AVERAGE(B2:B6)","=COUNTIF(B2:B6,\"未交\")"],"correct":1,"answer_text":"B：=COUNTIF(B2:B6,\"已交\")，结果3。","option_explanations":["SUM用于求和，不能按文本状态计数。","COUNTIF按条件计数，已交出现3次。","AVERAGE用于数值平均，不能统计指定文字出现次数。","函数选择正确但条件错误，会得到未交数量1。"],"explanation":["统计对象是满足文本条件的单元格。","COUNTIF的参数为区域和条件。","把条件写为双引号中的已交，得到3。"],"pitfall":"条件文本必须与数据匹配；前后多余空格可能影响匹配。","modern_extension":false,"topicIds":["m4-stat"]},{"number":26,"type":"judge","module":"m4","topicId":"m4-stat","points":2,"stem":"对Excel列表筛选后，SUM(B2:B20)通常仍会把该区域内被筛选隐藏的数值计入总和。","correct":true,"correction":"正确。SUM通常包含区域内被筛选隐藏的数值；按筛选结果求和可采用合适的SUBTOTAL函数。","answer_text":"正确。","explanation":["筛选改变的是行的显示状态。","SUM按指定引用区域求和，不因筛选隐藏而自动缩小区域。","例如只需可见筛选记录的总和，可使用=SUBTOTAL(9,B2:B20)，并注意手工隐藏行与参数差异。"],"pitfall":"筛选、删除和改变引用区域是不同操作。","modern_extension":false,"topicIds":["m4-stat","m4-sort"]},{"number":27,"type":"judge","module":"m5","topicId":"m5-security","points":2,"stem":"只要网页地址使用HTTPS，就可以断定该网页不是钓鱼网站。","correct" 行实付结果。","points":1}]},{"label":"（3）","prompt":"在F6计算总实付，写出使用SUM的公式和结果。","points":1,"answer":"=SUM(F2:F5)，结果303.00元。","steps":["求和范围只含四行项目。","59+105+53+86=303。"],"alternatives":["=SUM(F2,F3,F4,F5)"],"rubric":[{"text":"SUM区域正确且结果为303元。","points":1}]},{"label":"（4）","prompt":"统计实付费用不少于90元的人数，写出COUNTIF公式和结果。","points":1,"answer":"=COUNTIF(F2:F5,\">=90\")，结果1。","steps":["不少于90使用>=90条件。","四个实付中仅105满足。"],"alternatives":["使用指向阈值90的辅助单元格拼接条件，也可接受。"],"rubric":[{"text":"COUNTIF条件与范围正确且计数为1。","points":1}]},{"label":"（5）","prompt":"用数据透视表按优惠系数汇总实付总额，写出行字段、值字段和三组汇总结果。","points":1,"answer":"行字段：优惠系数；值字段：实付，求和。0.8→53.00元，0.9→145.00元，1→105.00元。","steps":["按优惠系数分组。","对实付采用求和而非计数。","0.9组为59+86=145，其余各一行。"],"alternatives":["组排列顺序不同不扣分。"],"rubric":[{"text":"分组与求和配置正确，三组数值正确。","points":1}]}],"answer_text":"原始费用60、100、60、90；实付59、105、53、86；总实付303；不少于90元人数1。","explanation":["先计算行内乘积，再乘优惠系数加固定材料费。","使用跨表固定引用，避免复制后材料费引用下移。","金额按ROUND保留两位小数，最后按题设汇总。","数据透视表0.9组汇总145元，三组之和303元。"],"pitfall":"材料费在折扣之后加；如果把材料费也乘优惠系数，会改变结果。","modern_extension":false,"topicIds":["m4-ref"]},{"number":43,"type":"application","module":"m3","topicId":"m3-format","points":5,"grading":"self","stem":"用Word排版一份已设置标题样式的报告。正文为纵向，最后的宽表格需要独占一个横向节；表格之后不再有正文。修改完成后希望保留原DOCX，并产生一份不同文件名的DOCX和一份PDF。","parts":[{"label":"（1）","prompt":"在不覆盖原文件的前提下，如何保存新的DOCX？","points":1,"answer":"使用“另存为”，选择DOCX格式并设置不同文件名或保存位置。","steps":["普通保存通常更新当前文件。","另存为指定新名称，保留原文件。"],"alternatives":["先复制原文件，再打开副本修改并保存。"],"rubric":[{"text":"正确保留原文件并保存新的DOCX。","points":1}]},{"label":"（2）","prompt":"让最后的宽表格单独横向，写出分节与页面方向设置步骤。","points":1,"answer":"在表格前插入下一页分节符，选中或定位最后一节，设置横向并应用于本节。","steps":["表格前建立新节。","横向仅应用于最后一节；题设表后无正文，无需再建纵向节。"],"alternatives":["用能正确把目标表格划为独立节的等价操作。"],"rubric":[{"text":"分节和仅本节横向均正确。","points":1}]},{"label":"（3）","prompt":"最后一节的页眉需与正文不同，应首先关闭什么关联设置？","points":1,"answer":"关闭最后一节页眉的“链接到前一节”或“同前节”。","steps":["进入最后一节页眉。","取消继承上一节页眉后编辑本节页眉。"],"alternatives":["“链接到前一个”或对应版本等价名称。"],"rubric":[{"text":"指出页眉取消链接到前一节。","points":1}]},{"label":"（4）","prompt":"修改了标题内容和章节分页后，自动目录应如何更新？","points":1,"answer":"更新整个目录，并检查标题层级及页码。","steps":["标题文字变化需要更新条目。","仅更新页码不能同步标题内容。"],"alternatives":["重新按原层级插入自动目录，结果正确也可。"],"rubric":[{"text":"明确选择更新整个目录。","points":1}]},{"label":"（5）","prompt":"如何正确生成PDF，且确保宽表格没有超出页面？","points":1,"answer":"使用导出或另存为PDF，输出后打开检查最后一节的页面方向、表格边界和分页。","steps":["用Word支持的PDF导出功能生成。","检查导出的PDF，而不只看DOCX编辑视图。"],"alternatives":["打印到PDF并核对输出页面布局。"],"rubric":[{"text":"正确生成PDF并提出检查表格输出布局。","points":1}]}],"answer_text":"另存新DOCX；表格前下一页分节并设置本节横向；取消页眉前节链接；更新整个目录；导出并检查PDF。","explanation":["文件保存方式、分节页面设置和目录域更新分别处理。","页眉继承需在正确的节里关闭。","最终输出应实际检查横向表格和页面边界。"],"pitfall":"修改横向节时不要把页面方向应用到整个文档；页眉页脚的链接需分别检查。","modern_extension":false,"topicIds":["m3-format"]},{"number":44,"type":"application","module":"m5","topicId":"m5-ip","points":5,"grading":"self","stem":"某实验室电脑的IPv4配置为192.168.16.70，子网掩码255.255.255.192（/26）。只考虑普通IPv4子网的网络地址与广播地址保留规则，不考虑特殊保留政策。另有同网段服务器192.168.16.100。","parts":[{"label":"（1）","prompt":"写出该电脑所在子网的网络地址。","points":1,"answer":"192.168.16.64。","steps":["/26在最后一字节保留最高2位作为网络位，块大小64。","70处于64到127的地址块，网络地址为64。"],"alternatives":["192.168.16.70与255.255.255.192逐位AND得到192.168.16.64。"],"rubric":[{"text":"网络地址四段完整正确。","points":1}]},{"label":"（2）","prompt":"写出广播地址。","points":1,"answer":"192.168.16.127。","steps":["该地址块从64开始，共64个地址。","最后地址64+63=127为广播地址。"],"alternatives":[],"rubric":[{"text":"广播地址正确。","points":1}]},{"label":"（3）","prompt":"写出可分配给普通主机的地址范围及主机地址个数。","points":1,"answer":"192.168.16.65到192.168.16.126，共62个。","steps":["去掉网络地址64和广播地址127。","2^(32-26)-2=62。"],"alternatives":[],"rubric":[{"text":"范围与62个均正确。","points":1}]},{"label":"（4）","prompt":"服务器192.168.16.100是否同网段？说明判断依据。","points":1,"answer":"是；按相同/26掩码计算，服务器的网络地址也是192.168.16.64。","steps":["100处于64到127的同一地址块。","掩码相同时比较网络地址。"],"alternatives":["两个IP分别与掩码做AND，结果相同。"],"rubric":[{"text":"结论同网段并有正确依据。","points":1}]},{"label":"（5）","prompt":"执行ping 192.168.16.100并收到应答，主要说明什么？能否据此断定服务器所有应用服务都正常？","points":1,"answer":"说明当时存在ICMP应答所反映的网络可达性；不能据此断定网页、数据库等全部应用正常。","steps":["ping通过ICMP回显检查相关连通情况。","应用服务还需用相应协议或客户端检测。"],"alternatives":["指出网络层连通测试成功，但应用层仍需另测。"],"rubric":[{"text":"正确说明ping作用及不能证明所有应用正常。","points":1}]}],"answer_text":"网络192.168.16.64，广播192.168.16.127，可用65..126共62个；服务器同网段；ping成功不证明全部应用正常。","explanation":["掩码/26留下6个主机位，一个子网有64个地址。","70与100均在64..127块内。","主机地址排除首尾；应用服务故障需进一步检查。"],"pitfall":"ping无应答也可能是防火墙阻止ICMP，不能单凭它判断主机一定关机。","modern_extension":false,"topicIds":["m5-ip"]},{"number":45,"type":"application","module":"m6","topicId":"m6-select","points":5,"grading":"self","stem":"以下为Access数据库的“学生”和“成绩”两表。学生表主键为学号；成绩表规定每名学生每门课程至多一条记录。本题所有分数均非空。SQL采用Access语法。","tables":[{"title":"学生","headers":["学号","姓名","学院"],"rows":[[101,"林宁","计算机"],[102,"许禾","计算机"],[103,"程夕","管理"],[104,"苏川","计算机"]]},{"title":"成绩","headers":["学号","课程","分数"],"rows":[[101,"数据库",84],[101,"网络",58],[102,"数据库",90],[103,"数据库",88],[104,"数据库",80],[104,"网络",59]]}],"parts":[{"label":"（1）","prompt":"查询计算机学院学生的“数据库”课程成绩，分数在80到90之间且包含端点。显示学号、姓名、分数，先按分数降序，再按学号升序。写出SQL及结果。","points":2,"answer":"SELECT 学生.学号, 学生.姓名, 成绩.分数 FROM 学生 INNER JOIN 成绩 ON 学生.学号=成绩.学号 WHERE 学生.学院='计算机' AND 成绩.课程='数据库' AND 成绩.分数 BETWEEN 80 AND 90 ORDER BY 成绩.分数 DESC, 学生.学号 ASC; 结果依次为(102,许禾,90)、(101,林宁,84)、(104,苏川,80)。","steps":["用学号连接两表取得学院和成绩。","同时筛选学院、课程及含端点的分数区间。","按90、84、80排序；管理学院的88分不符合学院条件。"],"alternatives":["使用表别名并完整限定同名学号列。","把BETWEEN改成>=80 AND <=90。"],"rubric":[{"text":"连接与全部筛选条件正确。","points":1},{"text":"显示字段、排序及三行结果正确。","points":1}]},{"label":"（2）","prompt":"按要求删除成绩表中分数低于60的记录。写出SQL，并列出本题将删除的两条记录。","points":2,"answer":"DELETE FROM 成绩 WHERE 分数<60; 删除(101,网络,58)和(104,网络,59)。","steps":["删除对象是成绩表中的记录。","分数严格小于60，条件不含60。","本表58和59满足条件，其他行保留。"],"alternatives":["Access可采用DELETE 成绩.* FROM 成绩 WHERE 分数<60;"],"rubric":[{"text":"DELETE目标和严格小于60条件正确。","points":1},{"text":"准确列出两条待删除记录。","points":1}]},{"label":"（3）","prompt":"只把成绩表的学号设为主键是否适合题设？写出更合适的主键字段。","points":1,"answer":"不适合；同一学生有多门课程，学号会重复。可使用(学号,课程)组合主键。","steps":["学号101与104分别出现两次。","按每人每门课至多一条的规定，组合字段能唯一标识成绩记录。"],"alternatives":["新增唯一成绩流水号作为主键，并对(学号,课程)设置唯一约束，也 ric":[{"text":"准确给出下标4并输出1。","points":1}]}],"answer_text":"完整参考流程见图；仅检查1..N-2，严格双重比较成立计数。例中仅下标4为峰值，个数1。","explanation":["读左右邻项时必须保证下标有效。","严格峰值排除相邻等高值；两个7都不合格。","8的两侧为3和4，满足双重严格比较。","边界9即使很大也不参与统计。"],"pitfall":"统计的是峰值个数，不是最大元素；多个内部峰值可同时存在。","modern_extension":false,"topicIds":["m8-peaks"]}]},{"id":"B","title":"模拟卷B（2026结构）","structure_year":2026,"duration_minutes":120,"questions":[{"number":1,"type":"single","module":"m1","topicId":"m1-system","points":2,"stem":"在通常的计算机组成模型中，CPU的两个主要组成部分是（ ）。","options":["运算器和控制器","主存储器和外存储器","输入设备和输出设备","显示器和网卡"],"correct":0,"answer_text":"A. 运算器和控制器","option_explanations":["运算器负责算术、逻辑等运算，控制器协调取指令、译码和执行。","主存和外存属于存储系统，不是CPU的两个主要组成部分。","输入和输出设备承担人机交互或数据交换，位于CPU之外。","显示器和网卡分别是输出、通信设备，不能组成CPU。"],"explanation":["先区分CPU、存储器、输入设备和输出设备的职责。","运算器执行数据运算，控制器按照指令组织各部件工作。","CPU还含寄存器等部件，但题目问两个主要组成部分，应选运算器和控制器。"],"pitfall":"不要把CPU等同于整个主机；内存条属于存储器。","modern_extension":false,"topicIds":["m1-system"]},{"number":2,"type":"single","module":"m1","topicId":"m1-encoding","points":2,"stem":"某文本采用UTF-8编码，不计文件头和换行。已知汉字“中”的Unicode码点为U+4E2D，UTF-8对U+0800～U+FFFF中有效码点采用3字节编码。字符串“A中9”共占（ ）。","options":["3字节","4字节","5字节","6字节"],"correct":2,"answer_text":"C. 5字节","option_explanations":["3是字符数，UTF-8中的字符数与字节数不一定相同。","按每个汉字固定2字节得到4，混淆了UTF-8与其他编码。","ASCII范围的A、9各1字节，“中”3字节，共1+3+1=5。","并非所有字符都用2字节，6不是该编码的正确总量。"],"explanation":["A和9属于ASCII范围，在UTF-8中各占1字节。","U+4E2D落在题设的3字节范围内。","相加得到1+3+1=5字节。UTF-8为变长编码，不能用字符数直接代替字节数。"],"pitfall":"题目已排除BOM和换行；不能额外增加这些字节。","modern_extension":true,"topicIds":["m1-encoding"]},{"number":3,"type":"single","module":"m1","topicId":"m1-complement","points":2,"stem":"采用8位有符号补码表示整数，十进制数-37的补码是（ ）。","options":["10100101","11011010","11011011","00100101"],"correct":2,"answer_text":"C. 11011011","option_explanations":["10100101是-37的8位原码，不是补码。","这是+37逐位取反后的结果，尚未加1。","+37为00100101，取反为11011010，再加1为11011011。","00100101表示正37。"],"explanation":["37=32+4+1，8位二进制为00100101。","负数补码由对应正数的全部8位取反后加1得到。","11011010+1=11011011，也可用256-37=219核对位串。"],"pitfall":"取反时包含最高位； 、存储、网络等基础资源，用户通常仍需部署和管理应用。","显示器是硬件外设，不是在线软件服务模式。"],"explanation":["按用户直接获得的服务层次分类，而不是只看是否有浏览器。","本题直接获得办公应用，服务商维护软件及运行环境。","因此选择SaaS；浏览器可访问某台虚拟机本身不能使它自动成为SaaS。"],"pitfall":"通过浏览器使用与服务模式有关但不是唯一判据，关键是获得什么服务。","modern_extension":true,"topicIds":["m5-cloud"]},{"number":15,"type":"single","module":"m4","topicId":"m4-pivot","points":2,"stem":"Excel明细表有“部门”和数值型“报销金额”两列，每行是一笔报销。需汇总每个部门的报销总额，数据透视表设置应为（ ）。","options":["部门放值区域，报销金额放筛选区域","报销金额放列区域且不设置值字段","部门放行区域，报销金额按计数汇总","部门放行区域，报销金额放值区域并按求和汇总"],"correct":3,"answer_text":"D. 部门作行标签，报销金额按求和汇总","option_explanations":["不能按题设形成每部门金额总和，字段角色错误。","没有值字段就没有所需金额汇总。","计数得到记录笔数，不是金额总额。","行区域划分部门，值区域求和计算各部门总额。"],"explanation":["部门是分类字段，放入行区域。","金额是需要汇总的度量，放入值区域并选择求和。","核对源数据金额为数值而非文本；源数据更新后还需要刷新透视表。"],"pitfall":"求和与计数不同；金额为文本时默认汇总方式可能与预期不同。","modern_extension":false,"topicIds":["m4-pivot"]},{"number":16,"type":"single","module":"m5","topicId":"m5-ipv6","points":2,"stem":"IPv6地址的标准长度是（ ）。","options":["16位","32位","64位","128位"],"correct":3,"answer_text":"D. 128位","option_explanations":["16位通常是一组完整十六进制字段的长度，不是整个地址长度。","32位是IPv4地址长度。","64位常见于IPv6子网划分中的前缀长度，不是完整地址长度。","IPv6完整地址128位，未压缩时可写为8组16位字段。"],"explanation":["IPv6采用128位地址。","8组字段，每组4个十六进制数字，每个数字4位：8×4×4=128。","省略前导零或使用::压缩只是表示简写，不缩短地址的实际位数。"],"pitfall":"地址字符串字符数随压缩而变，不能用字符数判断地址位数。","modern_extension":false,"topicIds":["m5-ipv6"]},{"number":17,"type":"single","module":"m5","topicId":"m5-auth","points":2,"stem":"下列登录方式中，最明确使用两类不同认证因素的是（ ）。","options":["密码加另一个静态密码","密码加同类安全问题答案","密码加本人持有的硬件安全密钥","把同一个密码输入两次"],"correct":2,"answer_text":"C. 密码加硬件安全密钥","option_explanations":["两者都属于知道的秘密，不能仅因有两个密码就称为不同类别因素。","密码和安全问题答案均是知识因素。","密码是知识因素，硬件安全密钥是持有因素，跨两类。","重复同一因素不会增加因素种类。"],"explanation":["常见因素类别包括知道的、持有的、本人固有的特征。","数步骤不等于数因素，应判断各步骤属于哪一类别。","密码和本人持有的硬件密钥符合题设；多因素认证能降低部分风险，但不保证绝对安全。"],"pitfall":"两次验证、两次输入不一定是多因素认证。","modern_extension":true,"topicIds":["m5-auth"]},{"number":18,"type":"single","module":"m5","topicId":"m5-security","points":2,"stem":"收到“账号即将停用”的消息，要求立即通过陌生链接输入密码和验证码。最合适的处理是（ ）。","options":["看见网页有锁形图标就输入信息","通过已知官方入口独立核实，不在陌生链接中提交凭据","先提供验证码，再查看网址","把密码发给消息发送者，请其验证"],"correct":1,"answer_text":"B. 从已知官方入口独立核实","option_explanations":["HTTPS或锁形图标不证明站点运营者可信，钓鱼网站也可使用HTTPS。","独立打开可信入口核实，可避免被消息中的链接引导至仿冒站点。","验证码可能用于登录或交易，提交后核查为时已晚。","密码不应交给不明发送者，且对方无法据此证明身份。"],"explanation":["紧迫语气与索取密码、验证码是需要警惕的组合。","不点击消息中的登录链接，使用收藏或自行输入的已知官方地址。","在官方渠道核实通知，必要时按服务提供者的流程报告可疑消息。"],"pitfall":"安全传输不等于安全收件方，也不等于消息真实。","modern_extension":true,"topicIds":["m5-security"]},{"number":19,"type":"single","module":"m5","topicId":"m5-security","points":2,"stem":"制作班级学习时长统计图，只需比较各组的平均时长。以下最符合数据最小化原则的方案是（ ）。","options":["收集所有同学身份证号、家庭住址后公开明细","仅收集完成统计所需的组别与时长，发布分组汇总结果","默认上传全部聊天记录以增加数据量","把原始名单和私人联系电话一并放在公开网页"],"correct":1,"answer_text":"B. 仅收集必要字段并发布分组汇总","option_explanations":["身份与住址不服务于题设统计目的，且公开增加隐私风险。","收集范围与目的对应，发布内容采用汇总，减少不必要披露。","聊天记录与题设统计无关，数据量更大不表示更合理。","名单和私人电话不是分组均值统计的必要公开内容。"],"explanation":["从任务目的倒推必要字段，而不是先收集所有可能获得的数据。","计算组均值通常需要组别和时长，不需要身份证号或地址。","汇总发布可减少明细披露，但人数过少等条件仍可能影响隐私，应按具体情境管理访问。"],"pitfall":"汇总或去姓名不必然等于彻底匿名，不能作绝对隐私承诺。","modern_extension":true,"topicIds":["m5-security"]},{"number":20,"type":"single","module":"m5","topicId":"m5-protocol","points":2,"stem":"计算机接入局域网后，自动获取IPv4地址、子网掩码和默认网关等配置，通常使用（ ）。","options":["SMTP","FTP","HTML","DHCP"],"correct":3,"answer_text":"D. DHCP","option_explanations":["SMTP主要用于发送电子邮件。","FTP是文件传输协议，不承担题设地址配置。","HTML是网页标记语言，不是地址配置协议。","DHCP可按租约自动分配地址及相关配置。"],"explanation":["题目强调自动获取网络配置而不是手工设置。","DHCP服务器可提供地址、掩码、网关及DNS等参数。","租约可能续期或变化，不应把自动获取理解为永久固定地址。"],"pitfall":"DNS解析名称和DHCP配置地址用途不同。","modern_extension":false,"topicIds":["m5-protocol"]},{"number":21,"type":"single","module":"m6","topicId":"m6-select","points":2,"stem":"Access SQL中，字段Score为整数。条件Score BETWEEN 60 AND 80会选中（ ）。","options":["仅60<Score<80的记录","60≤Score≤80的记录","Score<60或Score>80的记录","只有Score=60的记录"],"correct":1,"answer_text":"B. 60≤Score≤80","option_explanations":["BETWEEN包含两个端点，不是严格开区间。","等价于Score>=60 AND Score<=80。","这是区间外的条件，与BETWEEN相反。","上限80之间的所有符合值均可能被选中，不只60。"],"explanation":["读取两个边界60和80。","BETWEEN ... AND ...包含端点，先检查60、80均符合。","再检查59、81均不符合；字段为NULL的记录不会因该条件被选中。"],"pitfall":"AND在BETWEEN语法中连接上下界，不能理解成两个相互独立的值。","modern_extension":false,"topicIds":["m6-select"]},{"number":22,"type":"single","module":"m7","topicId":"m7-genai","points":2,"stem":"生成式AI给出一道容量题的答案和一条看似正式的参考链接。准备将答案编入复习讲义时，应（ ）。","options":["只要措辞自信就直接采用","独立复算题目，并查验链接是否存在及是否支持结论","把同一句问题问三遍，以相同输出证明真实","删去参考链接，使答案无法被核查"],"correct":1,"answer_text":"B. 独立复算并查验来源及其支持关系","option_explanations":["流畅或自信的表述不能证明事实正确。","计算正确性与来源支持关系需要分别核验，可以识别算错和虚构引用。","重复生成可能重复同一个错误，不构成独立证据。","删来源降低可核查性，不能提高正确性。"],"explanation":["生成式AI可能输出看似合理但错误的内容或引用。","容量题应按采样率、位数、声道、时长等条件重新计算。","打开实际来源核对内容，只有网址存在仍不足以说明它支持该结论。"],"pitfall":"一致回答和正式语气都不能代替独立核验。","modern_extension":true,"topicIds":["m7-genai"]},{"number":23,"type":"single","module":"m7","topicId":"m7-genai","points":2,"stem":"希望用在线AI工具分析课程满意度，原始表包含姓名、身份证号和私人联系电话。尚不清楚该工具的数据保留规则。最合适的做法是（ ）。","options":["直接上传全表，分析后再删除本地文件","先公开共享全表，再把链接交给AI","要求AI承诺保密即可跳过数据检查","先明确授权及工具规则，只提供任务必需且经过适当处理的数据"],"correct":3,"answer_text":"D. 明确授权、规则并最小化输入数据","option_explanations":["删除本地文件不撤回已经上传的数据，也不说明在线保留情况。","公开链接会扩大访问范围，不解决工具授权和保留问题。","模型对话中的承诺不等于服务条款或可验证的技术措施。","先确认可使用范围和处理规则，再减少非必要字段，符合情境要求。"],"explanation":["先判断哪些字段对满意度分析必要。","核实使用授权、服务条款、访问范围和数据保留方式。","删除不必要标识或做合适处理后再评估是否可以输入；处理后也不应默认风险为零。"],"pitfall":"在提示词中写“保密”不能自动建立有效的数据保护安排。","modern_extension":true,"topicIds":["m7-genai"]},{"number":24,"type":"single","module":"m7","topicId":"m7-newtech","points":2,"stem":"温室使用联网温湿度传感器定期上传测量数据，并按规则控制灌溉设备。这个场景最直接体现（ ）。","options":["物联网中的感知、通信与控制","只有离线文字排版","仅把纸质记录扫描为图片","与现实设备无连接的单机游戏"],"correct":0,"answer_text":"A. 物联网中的感知、通信与控制","option_explanations":["传感器感知环境，网络传送数据，执行器控制现实设备，符合物联网场景。","排版不包含环境感知或设备联动。","扫描产生数字图像，但不体现题设的传感与控制闭环。","题设明确连接现实传感器和设备，不是纯单机虚拟活动。"],"explanation":["识别输入端的温湿度传感器。","识别数据上传的通信过程。","识别灌溉设备的控制输出；联网本身不保证控制规则正确，也不代表一定使用AI。"],"pitfall":"物联网可以采用固定规则，不能把所有物联网系统都说成AI系统。","modern_extension":true,"topicIds":["m7-newtech"]},{"number":25,"type":"single","module":"m7","topicId":"m7-media","points":2,"stem":"关于GIF图像格式，下列正确的是（ ）。","options":["GIF本质上是按数学曲线描述的矢量图格式","GIF图像任意放大都不会出现像素化","GIF使用索引颜色，每帧的调色板最多可有256种颜色","GIF文件只能保存一帧，不能形成动画"],"correct":2,"answer_text":"C. 每帧调色板最多256色","option_explanations":["GIF是位图格式，不是矢量曲线格式。","位图放大可能像素化，不能保证任意放大清晰。","GIF采用最多8位索引颜色，每帧调色板上限256色；不同帧可有不同局部调色板。","GIF可通过多帧和时序信息形成动画。"],"explanation":["先区分位图的像素阵列与矢量图的几何描述。","8位索引对应最多2⁸=256个调色板项。","GIF支持动画；整段动画不同帧合计出现的颜色不应简单说成绝对最多256种。"],"pitfall":"“每帧调色板最多256色”比“任何GIF文件总共最多256色”准确。","modern_extension":false,"topicIds":["m7-media"]},{"number":26,"type":"judge","module":"m5","topicId":"m5-security","points":2,"stem":"网页使用HTTPS，就能证明该网页的所有陈述真实可靠。","correct":false,"answer_text":"错误","correction":"HTTPS提供传输中的加密、完整性及证书相关的端点认证机制，不证明网页内容真实，也不保证运营者值得信任。","explanation":["HTTPS保护浏览器与服务器间的连接。","内容真伪是另一层问题，虚假内容也可以通过加密连接传输。","应结合来源、证据和具体内容独立核查。"],"pitfall":"安全连接标识不能当作内容事实核查结果。","modern_extension":false,"topicIds":["m5-security"]},{"number":27,"type":"judge","module":"m5","topicId":"m5-cloud","points":2,"stem":"云同步会把本地的修改和删除传播到其他端，所以仅开启同步就必然等同于拥有可独立恢复的完整备份。","correct":false,"answer_text":"错误","correction":"同步与备份的目的不同；删除也可能同步。能否恢复取决于独立副本、版本历史、回收站、保留期限及相应设置，不能只凭同步开启就保证。","explanation":["同步的目标是使多个位置反映同一状态。","误删或错误修改也可能传播。","备份强调可恢复的历史副本，是否具备这种能力需要核实保留、恢复和独立性安排。"],"pitfall":"某些云服务提供恢复能力，但它是具体服务和设置的能力，不是同步概念的必然结论。","modern_extension":true,"topicIds":["m5-cloud"]},{"number":28,"type":"judge","module":"m6","topicId":"m6-write","points":2,"stem":"对可正常删除且无外键阻止的Access数据表执行DELETE FROM Enroll;会删除该表全部记录，但保留表结构。","correct":true,"answer_text":"正确","correction":"没有WHERE条件的DELETE删除所有符合条件的行（本题为全部行），并不等同于DROP TABLE删除表结构。","explanation":["FROM指定要删除记录的数据表。","省略WHERE表示不设置行筛选条件。","DELETE作用于记录；题设已排除外键等阻止删除的条件。"],"pitfall":"把DELETE与DROP TABLE混淆，可能造成错误操作。","modern_extension":false,"topicIds":["m6-write"]},{"number":29,"type":"judge","module":"m7","topicId":"m7-genai","points":2,"stem":"用生成式AI辅助编写考试答案时，应保留由人核查题意、计算过程和引用依据的环节，不能仅因为输出流畅就省略审核。","correct":true,"answer_text":"正确","correction":"AI可 ion":["COUNTIF按给定条件统计符合的单元格数。","60、88、70满足>=60；59和空白不满足。","共有3个符合值，>=包含等于60的边界。"],"pitfall":"不要把COUNTIF的结果当作成绩总和，也不要漏掉等于60的项。","modern_extension":false,"topicIds":["m4-stat"]},{"number":35,"type":"blank","module":"m4","topicId":"m4-stat","points":2,"stem":"Excel的C2:C5依次为数值0、数值10、真正空白、数值20。=AVERAGE(C2:C5)的结果为________。","grading":"auto","accepted":["10","10.0"],"answer_text":"10","explanation":["AVERAGE对引用区域中的数值求平均，忽略真正空白。","0是数值，应计入分母；数值共有3个。","(0+10+20)/3=10，不是30/4或30/2。"],"pitfall":"数值0与空白单元格含义不同；本题不讨论公式返回空字符串。","modern_extension":false,"topicIds":["m4-stat"]},{"number":36,"type":"blank","module":"m4","topicId":"m4-stat","points":2,"stem":"Excel的B2:B5依次为82、90、82、70。=RANK(B2,$B$2:$B$5,0)的结果为________。（按兼容函数RANK的降序并列排名规则）","grading":"auto","accepted":["2","2.0"],"answer_text":"2","explanation":["第三参数0表示降序，分数越高名次越靠前。","比82大的值仅有90一个，因此82名次为1+1=2。","两个82并列第2，70排第4；新版的RANK.EQ使用同样的并列名次规则。"],"pitfall":"并列不按出现先后拆成不同名次，也不采用RANK.AVG的平均名次。","modern_extension":false,"topicIds":["m4-stat"]},{"number":37,"type":"blank","module":"m5","topicId":"m5-web","points":2,"stem":"URL为https://learn.example.org/course/view.html?unit=3，其中主机域名是________。","grading":"auto","accepted":["learn.example.org"],"answer_text":"learn.example.org","explanation":["https为方案，://之后至下一斜杠之前是主机部分。","本题没有端口号或用户信息，主机域名即learn.example.org。","/course/view.html为路径，?unit=3为查询部分，均不是域名。"],"pitfall":"不要把https://或路径、查询参数写入域名答案。","modern_extension":false,"topicIds":["m5-web"]},{"number":38,"type":"blank","module":"m5","topicId":"m5-ip","points":2,"stem":"IPv4地址192.168.20.37的子网掩码为255.255.255.0，对应网络地址为________。","grading":"auto","accepted":["192.168.20.0"],"answer_text":"192.168.20.0","explanation":["掩码前三个八位组全1，保留地址的前三段。","最后一段掩码0，37与0按位与得0。","网络地址为192.168.20.0；192.168.20.255是该/24子网广播地址。"],"pitfall":"不能把本机地址或广播地址写作网络地址。","modern_extension":false,"topicIds":["m5-ip"]},{"number":39,"type":"blank","module":"m6","topicId":"m6-select","points":2,"stem":"Access SQL中，按Score从大到小排序：ORDER BY Score ________。请填排序关键字。","grading":"auto","a ding":"self","stem":"下表位于同一Excel工作表，A1:F6是报名明细，H1:I3为项目与每课时单价。没有其他项目，金额均为数值。请使用通用桌面Excel函数；函数参数以逗号分隔。","tables":[{"title":"A1:F6：报名明细","headers":["A 学员","B 项目","C 实付/元","D 完成课时","E 应付/元","F 状态"],"rows":[["甲","基础班",720,12,"待计算","待计算"],["乙","提升班",1000,15,"待计算","待计算"],["丙","基础班",660,11,"待计算","待计算"],["丁","提升班",900,15,"待计算","待计算"],["戊","基础班",780,13,"待计算","待计算"]]},{"title":"H1:I3：单价表","headers":["H 项目","I 单价/元·课时⁻¹"],"rows":[["基础班",60],["提升班",80]]}],"parts":[{"label":"（1）","prompt":"在E2写出能向下填充至E6的公式，按项目精确查得单价并乘课时；写出E2:E6的结果。","points":2,"answer":"=D2*VLOOKUP(B2,$H$2:$I$3,2,FALSE)；E2:E6依次为720、1200、660、1200、780。","steps":["B2是要查询的项目，在H列精确查找，取对应第2列I列单价。","查找区域用绝对引用$H$2:$I$3，向下填充不滑动。","将单价乘D列课时，基础班60元/课时、提升班80元/课时。","逐行计算12×60=720，15×80=1200，11×60=660，15×80=1200，13×60=780。"],"alternatives":["=D2*IF(B2=$H$2,$I$2,$I$3)在题设仅两种项目下等价。","正确使用INDEX和MATCH精确匹配也可；不用依赖特定新版函数。"],"rubric":[{"text":"公式正确匹配项目、锁定单价区域并乘课时，可向下填充","points":1},{"text":"五个应付值720、1200、660、1200、780均正确","points":1}]},{"label":"（2）","prompt":"在F2写出向下填充的公式：实付大于或等于应付显示“已结清”，否则显示“待补缴”。写出F2:F6结果。","points":2,"answer":"=IF(C2>=E2,\"已结清\",\"待补缴\")；依次为已结清、待补缴、已结清、待补缴、已结清。","steps":["逐行比较实付C列与应付E列。","边界相等时属于已结清，所以用>=。","C2、E2采用相对行引用，向下填充对应每一行。","两位提升班学员分别还差200元、300元，其余实付等于应付。"],"alternatives":["=IF(C2<E2,\"待补缴\",\"已结清\")等价。"],"rubric":[{"text":"IF公式正确处理相等边界并可向下填充","points":1},{"text":"五行状态全部正确","points":1}]},{"label":"（3）","prompt":"用数据透视表按项目汇总实付金额，说明行字段、值字段和汇总方式，并写出两个项目及总计金额。","points":2,"answer":"行字段：项目；值字段：实付；汇总方式：求和。基础班2160元，提升班1900元，总计4060元。","steps":["分类字段项目放入行区域。","实付而不是应付放入值区域，选择求和而不是计数。","基础班720+660+780=2160；提升班1000+900=1900。","总计2160+1900=4060元；应付总计4560元不是本问要求。"],"alternatives":["把项目放列区域而得到等价的项目金额汇总也可，但需说明与题问行字段安排不同。"],"rubric":[{"text":"正确指定项目行字段、实付值字段和求和","points":1},{"text":"两项目2160、1900及总计4060均正确","points":1}]}],"answer_text":"精确查价并锁定区域；应付720、1200、660、1200、780；状态结清、补缴、结清、补缴、结清；实付汇总2160、1900、4060。","explanation":["先计算每行的应付，再用实付与应付比较得到状态。","引用锁定用于维持查找表，明细行号保持可变化。","最后的透视表汇总对象是实付，不是上一小问生成的应付。","核对总差额4560-4060=500元，等于两笔缺额200+300。"],"pitfall":"VLOOKUP末参数必须使用精确匹配FALSE或0；不能依赖未排序项目的近似匹配。","modern_extension":false,"topicIds":["m4-lookup"]},{"number":44,"type":"application","module":"m6","topicId":"m6-select","points":6,"grading":"self","stem":"数据库含Student、Course、Enroll三个表，结构及全部记录如下。Student.SID和Course.CID分别为主键，Enroll.SID关联Student，Enroll.CID关联Course。每名学生在本数据中只选一门课，Score为整数且不为NULL。请写Access SQL；不要求保存查询对象。","tables":[{"title":"Student","headers":["SID","SName"],"rows":[["S01","林青"],["S02","周雨"],["S03","何宁"],["S04","陈晓"],["S05","吴越"]]},{"title":"Course","headers":["CID","CName"],"rows":[["C01","计算机基础"],["C02","数据处理"],["C03","网络安全"]]},{"title":"Enroll","headers":["SID","CID","Score"],"rows":[["S01","C01",78],["S02","C02",92],["S03","C01",60],["S04","C03",85],["S05","C02",59]]}],"parts":[{"label":"（1）","prompt":"查询分数在60～85（含边界）的学生姓名、课程名和分数，先按分数降序、同分再按学号升序。写出SQL及有序结果。","points":4,"answer":"SELECT S.SName, C.CName, E.Score FROM (Student AS S INNER JOIN Enroll AS E ON S.SID=E.SID) INNER JOIN Course AS C ON E.CID=C.CID WHERE E.Score BETWEEN 60 AND 85 ORDER BY E.Score DESC, E.SID ASC;\n结果依次：陈晓、网络安全、85；林青、计算机基础、78；何宁、计算机基础、60。","steps":["学生表与选课表按SID连接，选课表与课程表按CID连接。","选取需要的三个输出字段，避免把课程号当作课程名。","BETWEEN 60 AND 85同时包含60和85。","ORDER BY按Score DESC，再按E.SID ASC。","92和59不符合筛选，其余记录按85、78、60排列。"],"alternatives":["WHERE E.Score>=60 AND E.Score<=85等价。","使用合法别名或等价的Access连接写法可；不必与参考别名相同。"],"rubric":[{"text":"两条连接条件SID、CID正确，输出姓名、课程名及分数","points":1},{"text":"筛选正确包含60和85","points":1},{"text":"按分数降序并同分学号升序","points":1},{"text":"三条有序结果正确","points":1}]},{"label":"（2）","prompt":"仅从Enroll表删除分数低于60的记录，写SQL并指出删除的记录；说明Student表中的对应学生记录是否也被这条语句直接删除。","points":2,"answer":"DELETE FROM Enroll WHERE Score<60; 删除(S05,C02,59)。该语句直接作用于Enroll，不直接删除Student表中的S05学生记录。","steps":["删除目标是Enroll，筛选条件为严格小于60。","只有S05的59满足，60不满足。","语句没有对Student执行删除；本题不设由子表删除触发父表删除的其他机制。"],"alternatives":["DELETE FROM Enroll WHERE Enroll.Score<60;等价。"],"rubric":[{"text":"DELETE FROM Enroll WHERE Score<60正确并指出仅删除S05的选课记录","points":1},{"text":"明确不直接删除Student中S05记录","points":1}]}],"answer_text":"三表连接查询60至85含边界，结果陈晓85、林青78、何宁60；删除Enroll中S05的59分记录，学生主表记录仍保留。","explanation":["连接产生姓名和课程名，筛选决定行，排序决定结果顺序。","BETWEEN边界与<60删除边界分别核对。","多表连接在Access中使用括号明确连接结构。","删除行与删除表结构不同，也不等于删除其他表的对应行。"],"pitfall":"漏连接条件会产生错误配对；漏WHERE会删除整表记录。","modern_extension":false,"topicIds":["m6-select"]},{"number":45,"type":"application","module":"m8","topicId":"m8-method","points":8,"grading":"self","stem":"仓库用容量为3单位和5单位的两种箱子恰好装下31单位物品。每箱装满，箱数x、y均为非负整数。下图按x从0到10枚举，设r为扣除3单位箱后的剩余量；mod表示取余。输出每个可行的(x,y)。请补全四处空缺，再按新条件修改流程。图中“是/否”表示条件成立/不成立。","flow_graph":{"caption":"B45学生图：双规格装箱枚举，四处空缺","width":680,"height":760,"fontSize":18,"maxHeight":480,"nodes":[{"id":"s","kind":"start","label":"开始","x":280,"y":35,"w":110,"h":38},{"id":"init","kind":"process","label":"x=0","x":280,"y":100,"w":160,"h":46},{"id":"loop","kind":"decision","label":"①","x":280,"y":195,"w":220,"h":86},{"id":"rem","kind":"process","label":"②","x":280,"y":295,"w":220,"h":48},{"id":"check","kind":"decision","label":"③","x":280,"y":395,"w":260,"h":100},{"id":"out","kind":"io","label":"输出 x, r/5","x":280,"y":515,"w":240,"h":50},{"id":"inc","kind":"process","label":"④","x":280,"y":630,"w":200,"h":48},{"id":"end","kind":"end","label":"结束","x":590,"y":700,"w":110,"h":38}],"edges":[{"from":"s","to":"init","points":[[280,54],[280,77]]},{"from":"init","to":"loop","points":[[280,123],[280,152]]},{"from":"loop","to":"rem","label":"是","points":[[280,238],[280,271]]},{"from":"loop","to":"end","label":"否","points":[[390,195],[590,195],[590,681]]},{"from":"rem","to":"check","points":[[280,319],[280,345]]},{"from":"check","to":"out","label":"是","points":[[280,445],[280,490]]},{"from":"check","to":"inc","label":"否","points":[[410,395],[465,395],[465,630],[380,630]]},{"from":"out","to":"inc","points":[[280,540],[280,606]]},{"from":"inc","to":"loop","points":[[280,654],[280,685],[80,685],[80,195],[170,195]]}]},"solution_flow_graph":{"caption":"B45参考图：全部非负整数装箱方案","width":680,"height":760,"fontSize":18,"maxHeight":480,"nodes":[{"id":"s","kind":"start","label":"开始","x":280,"y":35,"w":110,"h":38},{"id":"init","kind":"process","label":"x=0","x":280,"y":100,"w":160,"h":46},{"id":"loop","kind":"decision","label":"x<=10","x":280,"y":195,"w":220,"h":86},{"id":"rem","kind":"process","label":"r=31-3*x","x":280,"y":295,"w":220,"h":48},{"id":"check","kind":"decision","label":"r mod 5=0","x":280,"y":395,"w":260,"h":100},{"id":"out","kind":"io","label":"输出 x, r/5","x":280,"y":515,"w":240,"h":50},{"id":"inc","kind":"process","label":"x=x+1","x":280,"y":630,"w":200,"h":48},{"id":"end","kind":"end","label":"结束","x":590,"y":700,"w":110,"h":38}],"edges":[{"from":"s","to":"init","points":[[280,54],[280,77]]},{"from":"init","to":"loop","points":[[280,123],[280,152]]},{"from":"loop","to":"rem","label":"是","points":[[280,238],[280,271]]},{"from":"loop","to":"end","label":"否","points":[[390,195],[590,195],[590,681]]},{"from":"rem","to":"check","points":[[280,319],[280,345]]},{"from":"check","to":"out","label":"是","points":[[280,445],[280,490]]},{"from":"check","to":"inc","label":"否","points":[[410,395],[465,395],[465,630],[380,630]]},{"from":"out","to":"inc","points":[[280,540],[280,606]]},{"from":"inc","to":"loop","points":[[280,654],[280,685],[80,685],[80,195],[170,195]]}]},"parts":[{"label":"（1）","prompt":"分别填写①②③④，并按输出次序列出全部装箱方案。","points":4,"answer":"①x<=10；②r=31-3*x；③r mod 5=0；④x=x+1。输出依次为(2,5)、(7,2)。","steps":["x最大为floor(31/3)=10，必须包含x=10这一轮。","固定x后，剩余物品量r=31-3x。","r非负由x范围保证；r能被5整除时y=r/5为非负整数。","每轮结束x加1后回到范围判定，输出后也要继续枚举。","x=2时r=25，x=7时r=10，其他x的余数不为0。"],"alternatives":["①写x<11、3*x<=31等价，条件不能漏上界。","③写r%5==0或r/5为整数均可。"],"rubric":[{"text":"①范围条件正确并包含10","points":1},{"text":"②正确扣除3*x","points":1},{"text":"③判断整除且列出(2,5)、(7,2)","points":1},{"text":"④自增正确且理解回边继续枚举","points":1}]},{"label":"（2）","prompt":"新增要求：两类箱子都必须使用（x>0、y>0），只输出x最小的一组可行方案后立即结束。说明条件及连线修改，并写出本题输出；无需重画所有未改节点。","points":4,"answer":"③改为(r mod 5=0) AND (x>0) AND (r>0)。把输出节点原来指向④的边改为直接指向结束节点；不满足③时仍经④自增并回到①。输出(2,5)后立即结束。①否分支保留，若无解可结束且不输出。","steps":["y=r/5且要求整数，因此r>0与y>0等价。","同时增加x>0，不能只检查整除。","按x递增枚举时第一个可行解就是x最小的解。","找到后从输出直接结束，不能仍连到自增节点继续寻找。","本题首个正整数解为(2,5)；无解情形仍由范围否分支退出。"],"alternatives":["可把初值改为x=1并保留包含10的范围，同时要求r>0及整除，然后输出后直接结束。","可引入已找到标志并正确终止循环，但必须体现仅输出一次与无解出口。"],"rubric":[{"text":"正确要求x>0及y>0（或r>0），并保留整除判断","points":1},{"text":"找到后由输出直接到结束，不再走自增回边","points":1},{"text":"未找到时自增继续、越界退出的分支与回边正确","points":1},{"text":"指出首个解(2,5)且用递增枚举说明x最小","points":1}],"solution_flow_graph":{"caption":"B45修改参考图：首个正整数方案后提前结束","width":680,"height":760,"fontSize":18,"maxHeight":480,"nodes":[{"id":"s","kind":"start","label":"开始","x":280,"y":35,"w":110,"h":38},{"id":"init","kind":"process","label":"x=0","x":280,"y":100,"w":160,"h":46},{"id":"loop","kind":"decision","label":"x<=10","x":280,"y":195,"w":220,"h":86},{"id":"rem","kind":"process","label":"r=31-3*x","x":280,"y":295,"w":220,"h":48},{"id":"check","kind":"decision","label":"r mod 5=0\n且x>0且r>0","x":280,"y":410,"w":320,"h":118},{"id":"out","kind":"io","label":"输出 x, r/5","x":280,"y":525,"w":240,"h":50},{"id":"inc","kind":"process","label":"x=x+1","x":280,"y":645,"w":200,"h":48},{"id":"end","kind":"end","label":"结束","x":590,"y":700,"w":110,"h":38}],"edges":[{"from":"s","to":"init","points":[[280,54],[280,77]]},{"from":"init","to":"loop","points":[[280,123],[280,152]]},{"from":"loop","to":"rem","label":"是","points":[[280,238],[280,271]]},{"from":"loop","to":"end","label":"否","points":[[390,195],[590,195],[590,681]]},{"from":"rem","to":"check","points":[[280,319],[280,351]]},{"from":"check","to":"out","label":"是","points":[[280,469],[280,500]]},{"from":"check","to":"inc","label":"否","points":[[440,410],[475,410],[475,645],[380,645]]},{"from":"out","to":"end","points":[[400,525],[520,525],[520,700],[535,700]]},{"from":"inc","to":"loop","points":[[280,669],[280,700],[70,700],[70,195],[170,195]]}]},"solution_flow_graph_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 760\" role=\"img\" aria-label=\"B45修改参考图：首个正整数方案后提前结束\"><defs><marker id=\"B-45-2-sol es":["继续条件分别写V<=4.32和V<4.32，也正确。"],"rubric":[{"text":"严格超过判定>，天数4；边界相等不满足","points":1},{"text":"至少达到判定>=，天数3；边界相等满足","points":1}]}],"answer_text":"完整增长阈值流程：n=0、V=2.5；未严格超过则乘1.2并计日；第8天10.7495424 GB。阈值4.32时严格超过第4天，至少达到第3天。","explanation":["增长按前一天容量的20%，所以每天乘1.2而不是加固定0.5。","n记录实际发生的增长次数，初始状态是第0天。","阈值是否包含相等直接改变终止日，应在条件节点中写清楚。","所有量使用GB保持一致；不把GB和B直接比较。"],"pitfall":"把>写成>=、天数初始为1、循环先输出后检查、累计固定增量，均会改变题意。","modern_extension":false,"topicIds":["m8-loop"]}]},{"id":"C","title":"模拟卷C：条件变化与辨错（2026结构）","structure_year":2026,"duration_minutes":120,"questions":[{"number":1,"type":"single","module":"m1","topicId":"m1-radix","points":2,"stem":"二进制数 101101 转换为十六进制数是（ ）。","options":["2D","35","2B","45"],"correct":0,"answer_text":"A，2D。","explanation":["从右向左每四位一组，不足四位在左侧补0：0010 1101。","0010对应十六进制2，1101对应D，故为2D。","十进制复核：32+8+4+1=45，2×16+13=45。"],"option_explanations":["2D对应45，与原二进制一致。","35对应53，不能把四位分组按十进制字符拼接。","2B对应43，把1101误读成1011会得到此项。","45是十进制数值的写法，十六进制45对应69。"],"pitfall":"必须注明目标进制，数码45在不同进制中值不同。","modern_extension":false,"topicIds":["m1-radix"]},{"number":2,"type":"single","module":"m1","topicId":"m1-complement","points":2,"stem":"采用8位有符号整数补码，位串 11110110 表示的十进制数是（ ）。","options":["246","-9","-10","-118"],"correct":2,"answer_text":"C，-10。","explanation":["最高位为1，按有符号补码解释为负数。","位串按无符号值是246，8位补码值为246-256=-10。","也可将11110110按位取反得00001001，再加1得00001010，即绝对值10。"],"option_explanations":["246是无符号解释，忽略了题设的有符号补码。","-9只取反未加1。","-10符合8位补码规则。","-118对应把其余位直接当原码绝对值，不适用补码。"],"pitfall":"取反加1处理的是求负数绝对值，不能漏掉加1。","modern_extension":false,"topicIds":["m1-complement"]},{"number":3,"type":"single","module":"m1","topicId":"m1-encoding","points":2,"stem":"某文件仅保存字符串 Chongqing2024，所有字符均按ASCII各占1字节，文件没有BOM、换行和其他元数据。其字符数据长度为（ ）。","options":["12字节","13字节","26字节","104字节"],"correct":1,"answer_text":"B，13字节。","explanation":["Chongqing含9个英文字母，2024含4个数字。","题设每个字符各占1字节，长度为9+4=13字节。","13字节等于104位，位与字节不能混用。"],"option_explanations":["12漏数了一个字母。","13是实际字符数，也是题设下的字节数。","26是假定每字符2字节，与ASCII条件不符。","104是位数，单位不是字节。"],"pitfall":"题设长度
