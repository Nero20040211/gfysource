":"m2","title":"Windows与进程","sceneIds":["m2-process","m2-task","m2-files","m2-practice"]},{"id":"m3","title":"Word与PowerPoint","sceneIds":["m3-format","m3-ppt","m3-toc","m3-practice"]},{"id":"m4","title":"Excel公式与数据处理","sceneIds":["m4-text","m4-ref","m4-sort","m4-lookup","m4-if","m4-pmt","m4-pivot","m4-fill","m4-stat","m4-practice"]},{"id":"m5","title":"网络与安全","sceneIds":["m5-layers","m5-protocol","m5-web","m5-security","m5-media","m5-ip","m5-ipv6","m5-cloud","m5-auth","m5-practice"]},{"id":"m6","title":"数据库与SQL","sceneIds":["m6-model","m6-key","m6-select","m6-group","m6-write","m6-practice"]},{"id":"m7","title":"多媒体与新技术","sceneIds":["m7-media","m7-newtech","m7-genai","m7-practice"]},{"id":"m8","title":"算法与流程图","sceneIds":["m8-method","m8-recursion","m8-loop","m8-sentinel","m8-peaks","m8-piecewise","m8-practice"]},{"id":"exams","title":"模拟考试与复盘","sceneIds":["exam-A","exam-B","exam-C","wrong-review"]}],"scenes":[{"id":"welcome","stageId":"start","type":"orientation","title":"开始学习与使用说明","content":{"html":"<p>按真题考点学习，再用三套完整卷检验。知识先讲清原理、例题与边界；考试解析在交卷后开放。<\/p><div class=\"exam-home-grid\"><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-A\">模拟卷 A · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-B\">模拟卷 B · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"exam-C\">模拟卷 C · 120分 / 120分钟<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"source-index\">45题考点索引<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"errata\">原卷勘误<\/button><button data-exam-action=\"knowledge\" data-exam-scene=\"wrong-review\">错题复习<\/button><\/div><p>学习模式可逐题检查；考试模式提供限时与交卷。客观题自动评分，开放式公式、SQL与流程图按小问自评，待评部分明确标示。<\/p><p>断网可用；记录保存在本浏览器。移动或改名HTML、换浏览器或清理浏览器数据后，旧记录可能无法自动找到。五份PDF与本页位于同一文件夹。<\/p>"},"knowledge":{"prerequisites":["能分清题目要求、给定输入与输出。"],"mentalModel":"有效复盘不是重复答案，而是找出从条件到结论的哪一步出了问题。先分清对象，再统一单位与表示，最后用边界验证推理。","sections":[{"id":"review-1","title":"先辨认题目要求","body":"同一道题可以问软件操作、数据结果，也可以问流程图实际输出。首先圈出任务动词：统计要给汇总值，查询要确定符合条件的记录，补空要结合空位的形状和已有文字，作图要给完整的控制路径。计算机基础知识不能只背术语。比如文件长度与占用空间都以字节计量，但占用空间还受簇大小约束；“看到多少行”也不等于数据库真正保存多少行，筛选一般只是隐藏记录。明确被问的对象，是判断选项与公式之前的第一步。"},{"id":"review-2","title":"再确定条件与表示","body":"单位、下标与软件环境会改变答案。音频容量先根据采样率、时间、量化位数和声道数求总位数，再换字节；十进制KB与二进制KiB不能混用。数组从零开始时，第一个内部元素的下标是一，最后一个内部元素是倒数第二个；两端无法同时拥有左右邻居。Excel复制公式时，要先辨认每一段引用是随行移动、随列移动还是固定。SQL查询要区分逐行筛选和汇总后筛选，日期、通配符与函数语法还应服从题目注明的方言。"},{"id":"review-3","title":"把推理展开成可检查的步骤","body":"只写一个最终数字往往掩盖条件误读。先列输入和中间量，再检查最小值、最大值与恰好到达阈值的情况。分段价格的第一段费用应完整保留，而不是把全部数量都乘末段折扣。平均值算法要分别记录累计和与有效个数，结束哨兵不进入这两个量；没有有效数据时走单独分支，不能直接相除。枚举要证明候选范围包含全部可能情况；循环不仅要使条件变化，还要让每条路径都能完成必要的更新，否则遇到特定输入可能停滞。"},{"id":"review-4","title":"核对依据而不是只看结论","body":"所给参考答案是重要依据，但仍要与题图、题干和独立计算互相核对。若参考答案的位置写反、单位约定含混或图中数据相互冲突，应同时记录原答案和核验结果，不能把修正后的图当成原图。相同结果并不证明算法普遍正确，可以通过边界用例寻找反例。现代安全题也要注意适用范围：加密保护传输，不能证明网页内容真实；云同步便于协作，不能自动代替独立备份；人工智能生成的文字流畅，并不能保证事实与引用可靠。"}],"workedExamples":[{"title":"复盘例题","prompt":"平均气温算法把结束标记0也计入总天数，应该纠正哪一类错误？","steps":[{"text":"标记用于控制输入结束，不属于有效温度数据。"},{"text":"先判断是否结束，再执行累计与计数。"},{"text":"检查首个输入即结束和只有一条有效数据两个边界。"}],"result":"属于输入语义与更新次序错误；改正后还需防护空输入。"}],"pitfalls":["参考答案与独立核验必须分栏记录。","样例正确不等于所有输入均正确。"],"citations":[{"sourceId":"exam","locator":"2024原题29—37页与应用题边界"},{"sourceId":"answers","locator":"原答案21—24页；勘误对照"}],"title":"形成一条完整的解题链"}},{"id":"source-index","stageId":"start","type":"orientation","title":"45道真题考点索引","content":{"html":"<p>页码均指所给PDF物理页码。点击“回看知识”进入对应精讲。<\/p><section class=\"exam-source-entry\"><h3>真题 1 · PDF第29页<\/h3><p><strong>原题表述：<\/strong>打开test1文档并另存为test2后，当前编辑的文档是哪一个？<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>B<\/p><p><strong>核验结论：<\/strong>与原答案一致：当前文档为test2。<\/p><p>另存为成功后，当前文件身份转为新路径；原文件保留原来的已保存内容。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-format\">回看知识<\/button><p>练习：Word与PowerPoint三层练习；匹配模拟题：A卷40、A卷43、B卷9、C卷9<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 2 · PDF第29页<\/h3><p><strong>原题表述：<\/strong>Word页边距设置指哪些边界？<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>C<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>区分页边距（页面边缘至正文区）与段落左右缩进。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-format\">回看知识<\/button><p>练习：Word与PowerPoint三层练习；匹配模拟题：A卷40、A卷43、B卷9、C卷9<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 3 · PDF第29页<\/h3><p><strong>原题表述：<\/strong>PPT中集中修改幻灯片的通用版式，应使用什么视图？<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>C<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>母版管理继承的公共设计，具体版式用于标题页、内容页等；单页手工覆盖可能不随母版变化。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-ppt\">回看知识<\/button><p>练习：Word与PowerPoint三层练习；匹配模拟题：A卷5、B卷11、C卷12<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 4 · PDF第29页<\/h3><p><strong>原题表述：<\/strong>对不连续区域A1:B3与C3:C5求和。<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>D<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>冒号形成连续区域，逗号分隔函数参数；所选两区域没有重叠。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷19、A卷25、A卷26、A卷31、A卷34、B卷33、B卷34、B卷35、B卷36、B卷40、C卷27、C卷31、C卷34<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 5 · PDF第29—30页<\/h3><p><strong>原题表述：<\/strong>统计C3:C10中“优秀”的个数。<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>B<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>文本条件加英文双引号；COUNT统计数值，COUNTA统计非空，不能替代条件计数。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷19、A卷25、A卷26、A卷31、A卷34、B卷33、B卷34、B卷35、B卷36、B卷40、C卷27、C卷31、C卷34<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 6 · PDF第30页<\/h3><p><strong>原题表述：<\/strong>快速定位到Y888单元格。<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>A<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>名称框位于公式栏左侧，也可用定位命令；公式栏用于查看或编辑当前单元格内容。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-ref\">回看知识<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷7、A卷42、B卷12、C卷15、C卷43<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 7 · PDF第30页<\/h3><p><strong>原题表述：<\/strong>等额分期偿还贷款，计算每月本金与利息合计的函数。<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>C<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>PMT给每期总支付额，IPMT给某期利息，PPMT给某期本金；月利率=年利率/12，期数=年数×12。<\/p><p class=\"muted\">统一利率与期数的时间单位；支付通常为负，可用=-PMT或负的pv得到正数。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-pmt\">回看知识<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷9、B卷13、C卷13、C卷32<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 8 · PDF第30页<\/h3><p><strong>原题表述：<\/strong>按专业统计平均成绩，适合用什么工具？<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>D<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>专业放行区域，成绩放值区域，值字段由求和改为平均值；新增源数据后刷新。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-pivot\">回看知识<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷11、B卷15、C卷16<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 9 · PDF第30页<\/h3><p><strong>原题表述：<\/strong>在N个未排序元素中顺序查找，最坏需比较多少次？<\/p><p><strong>参考答案（答案PDF第21页）：<\/strong>A<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>目标在末尾或不存在时检查全部N项；题设N≥2，不能套用二分查找。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method "m8-loop\">回看知识<\/button><p>练习：算法与流程图三层练习；匹配模拟题：A卷39、A卷46、B卷46、C卷38<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 29 · PDF第33页<\/h3><p><strong>原题表述：<\/strong>依次读入35、62、43、75、31……，按给定流程图输出什么？<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>35<\/p><p><strong>核验结论：<\/strong>原图输出35；但该图不能正确承担一般素数判定。<\/p><p>原图判断方向及P更新缺失使其有逻辑缺陷；回答输出应沿实际分支，讲素数另用试除至平方根的完整算法。<\/p><p class=\"muted\">原图异常不可默认为可靠素数算法，不以输出35证明35是素数。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-loop\">回看知识<\/button><p>练习：算法与流程图三层练习；匹配模拟题：A卷39、A卷46、B卷46、C卷38<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 30 · PDF第33页<\/h3><p><strong>原题表述：<\/strong>依据用户数据进行商品推荐的相关技术。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>大数据<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>数据清洗、用户行为特征、推荐模型和效果评估；关联推荐不能推出因果关系。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识<\/button><p>练习：多媒体与新技术三层练习；匹配模拟题：A卷18、B卷24、C卷20<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 31 · PDF第33页<\/h3><p><strong>原题表述：<\/strong>HTTPS中的安全协议提供的主要保护。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>加密<\/p><p><strong>核验结论：<\/strong>原填空成立，现代HTTPS通常使用TLS，还提供完整性与服务器身份验证。<\/p><p>HTTP是应用协议；TLS保护传输；证书需正确验证。<\/p><p class=\"muted\">HTTPS不保证网站内容真实，也不阻止用户主动向钓鱼站点输入密码。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-protocol\">回看知识<\/button><p>练习：网络与安全三层练习；匹配模拟题：A卷32、B卷20、C卷19、C卷35<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 32 · PDF第33页<\/h3><p><strong>原题表述：<\/strong>查询商品单价大于等于20且小于80的记录。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>select*from 价格表 where（单价 between 20 and 80）and（单价&lt;&gt;80）<\/p><p><strong>核验结论：<\/strong>等价SQL：SELECT * FROM 价格表 WHERE 单价&gt;=20 AND 单价&lt;80；保留SELECT、表名与边界条件。<\/p><p>下边界包含20，上边界不含80；普通BETWEEN 20 AND 80会误含80。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-select\">回看知识<\/button><p>练习：数据库与SQL三层练习；匹配模拟题：A卷37、A卷45、B卷21、B卷39、B卷44、C卷39、C卷44<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m6-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 33 · PDF第34页<\/h3><p><strong>原题表述：<\/strong>能恢复全部原始数据的压缩方式。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>无损<\/p><p><strong>核验结论：<\/strong>与原答案一致。<\/p><p>区别无损与有损；对已压缩数据再压缩不保证容量继续下降。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-media\">回看知识<\/button><p>练习：多媒体与新技术三层练习；匹配模拟题：A卷13、A卷14、A卷36、B卷25、B卷32、C卷22、C卷37<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 34 · PDF第34页<\/h3><p><strong>原题表述：<\/strong>8位二进制补码10110100对应的十进制整数。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>-76<\/p><p><strong>核验结论：<\/strong>独立核验：无符号值180，180-256=-76。<\/p><p>最高位1表示负数，取反01001011再加1得01001100=76。<\/p><p class=\"muted\">必须明确8位带符号补码；同一位串作无符号数时是180。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-complement\">回看知识<\/button><p>练习：计算机系统与编码三层练习；匹配模拟题：A卷1、A卷33、B卷3、B卷31、C卷2<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 35 · PDF第34页<\/h3><p><strong>原题表述：<\/strong>1KB空间能存储多少个ASCII字符？<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>1024<\/p><p><strong>核验结论：<\/strong>按本题考试约定1KB=1024B、ASCII每字符1B，答案1024。<\/p><p>原卷第22题采用十进制容量选项，与本题传统KB用法不同，学习时分别明确单位。<\/p><p class=\"muted\">UTF-8的中文通常3B，不可把任意Unicode字符当成1B；现代单位宜写KiB。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-encoding\">回看知识<\/button><p>练习：计算机系统与编码三层练习；匹配模拟题：A卷2、A卷4、B卷2、B卷4、C卷3、C卷4<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m1-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 36 · PDF第34页<\/h3><p><strong>原题表述：<\/strong>Excel数值自动填充，A1为1、A2为3，选中两格向下拖动，含5个空。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>等差数列；等比数列；填充柄；2；7<\/p><p><strong>核验结论：<\/strong>答案成立；普通拖动与“序列”命令的等比设置应区分。<\/p><p>两格初始值给出公差，向下形成1、3、5、7。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识<\/button><p><strong>小问①：<\/strong>等差数列<\/p><p>相邻项差固定。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p><strong>小问②：<\/strong>等比数列<\/p><p>相邻项比固定；可在序列对话框设置等比。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p><strong>小问③：<\/strong>填充柄<\/p><p>拖动选区右下角的小方块。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p><strong>小问④：<\/strong>2<\/p><p>公差为3-1=2。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p><strong>小问⑤：<\/strong>7<\/p><p>A4是第4项：1+3×2=7。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷24、C卷40<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 37 · PDF第34页<\/h3><p><strong>原题表述：<\/strong>Word自动目录的层级、样式与分节，含5个空。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>标题2；标题3；标题；标题样式；分节<\/p><p><strong>核验结论：<\/strong>标题2、标题3、标题与分节的主线正确。第（4）原答案写“标题样式”，严格说自动目录提取的是具有指定样式/大纲级别的标题文字及页码，而不是样式定义本身。<\/p><p>给正文标题应用恰当级别，插入目录并在编辑后更新；分节允许不同页面设置。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-toc\">回看知识<\/button><p><strong>小问①：<\/strong>标题2<\/p><p>二级标题通常使用标题2。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-toc\">回看知识：Word另存、页边距、标题样式、目录与分节<\/button><p><strong>小问②：<\/strong>标题3<\/p><p>三级标题通常使用标题3。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-toc\">回看知识：Word另存、页边距、标题样式、目录与分节<\/button><p><strong>小问③：<\/strong>标题<\/p><p>目录按标题及指定级别提取。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-toc\">回看知识：Word另存、页边距、标题样式、目录与分节<\/button><p><strong>小问④：<\/strong>具有指定标题样式/大纲级别的标题文字及页码（原答案写“标题样式”）<\/p><p>先应用标题样式，目录再提取对应标题及页码；样式定义是提取依据而不是目录显示的正文内容。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-toc\">回看知识：Word另存、页边距、标题样式、目录与分节<\/button><p><strong>小问⑤：<\/strong>分节<\/p><p>插入分节符，再设置节的页面属性。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-format\">回看知识：字符格式、段落对齐、项目符号与页眉<\/button><p>练习：Word与PowerPoint三层练习；匹配模拟题：A卷6、A卷40、A卷43、B卷9、B卷10、C卷9、C卷11<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m3-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 38 · PDF第34—35页<\/h3><p><strong>原题表述：<\/strong>跨表平均成绩、差值、转置、升序排名与积分，含5小问。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>=ROUND(AVERAGE(B2:G2),0)；=ABS(成绩!B2-成绩!$H2)；转置；=RANK(I2,I$2:I$7,1)；=101-J2*2<\/p><p><strong>核验结论：<\/strong>原答案公式已正确锁定H列；原截图平均数与可见B:G成绩不一致，应另列独立演算，不直接把截图当计算结果。<\/p><p>先核对数据→计算整数平均→与本行平均作绝对差→按学生累计→由小到大排名→换算积分。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识<\/button><p><strong>小问（1）：<\/strong>=ROUND(AVERAGE(B2:G2),0)<\/p><p>在H2输入并向下填充。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识：AVERAGE、ROUND、ABS与RANK：评分表的完整计算<\/button><p><strong>小问（2）：<\/strong>=ABS(成绩!B2-成绩!$H2)<\/p><p>B列随横向填充变为C/D；H列不变，行随向下变化。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-ref\">回看知识：相对、绝对、混合引用与跨表引用<\/button><p><strong>小问（3）：<\/strong>复制第8行B:G汇总区，选择性粘贴→转置到I2:I7<\/p><p>原图I为差值和，J为排名，K为评分；不可转置到J覆盖排名。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-fill\">回看知识：Excel自动填充、名称框与选择性粘贴<\/button><p><strong>小问（4）：<\/strong>=RANK(I2,I$2:I$7,1)<\/p><p>升序1；并列名次相同，后续名次可能跳号。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识：AVERAGE、ROUND、ABS与RANK：评分表的完整计算<\/button><p><strong>小问（5）：<\/strong>=101-J2*2<\/p><p>先正确求排名，再按题设线性规则转换积分。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-stat\">回看知识：AVERAGE、ROUND、ABS与RANK：评分表的完整计算<\/button><h4>原题B:G成绩及重新计算的整数平均（不沿用截图H列）<\/h4><div class=\"exam-table-wrap\"><table><thead><tr><th>行<\/th><th>B<\/th><th>C<\/th><th>D<\/th><th>E<\/th><th>F<\/th><th>G<\/th><th>核验H<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>86<\/td><td>94<\/td><td>91<\/td><td>92<\/td><td>85<\/td><td>85<\/td><td>89<\/td><\/tr><tr><td>3<\/td><td>82<\/td><td>84<\/td><td>94<\/td><td>92<\/td><td>94<\/td><td>90<\/td><td>89<\/td><\/tr><tr><td>4<\/td><td>87<\/td><td>92<\/td><td>88<\/td><td>80<\/td><td>92<\/td><td>86<\/td><td>88<\/td><\/tr><tr><td>5<\/td><td>90<\/td><td>80<\/td><td>94<\/td><td>92<\/td><td>99<\/td><td>98<\/td><td>92<\/td><\/tr><tr><td>6<\/td><td>87<\/td><td>89<\/td><td>87<\/td><td>95<\/td><td>94<\/td><td>99<\/td><td>92<\/td><\/tr><tr><td>7<\/td><td>99<\/td><td>94<\/td><td>80<\/td><td>85<\/td><td>99<\/td><td>93<\/td><td>92<\/td><\/tr><\/tbody><\/table><\/div><p>练习：Excel公式与数据处理三层练习；匹配模拟题：A卷7、A卷19、A卷24、A卷25、A卷26、A卷31、A卷34、A卷42、B卷12、B卷33、B卷34、B卷35、B卷36、B卷40、C卷15、C卷27、C卷31、C卷34、C卷40、C卷43<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m4-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 39 · PDF第35页<\/h3><p><strong>原题表述：<\/strong>列举国产手机、操作系统、卫星导航系统、导航软件与支付服务。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>所给答案PDF未发现此题对应答案<\/p><p><strong>核验结论：<\/strong>下列仅为编者示例，不冒充官方唯一答案；合理且符合题意的其他实例可接受。<\/p><p>明确“举例题”的开放性；名称对应的产品类别要正确。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识<\/button><p><strong>小问（1）：<\/strong>华为手机（编者示例）<\/p><p>说明手机产品，而非任意家电品牌。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识：大数据、AI、云服务与RFID<\/button><p><strong>小问（2）：<\/strong>鸿蒙操作系统（编者示例）<\/p><p>操作系统不同于应用软件。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m2-process\">回看知识：程序、进程与就绪/运行/阻塞<\/button><p><strong>小问（3a）：<\/strong>北斗卫星导航系统（编者示例）<\/p><p>卫星导航系统不同于导航应用。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识：大数据、AI、云服务与RFID<\/button><p><strong>小问（3b）：<\/strong>高德地图（编者示例）<\/p><p>软件可利用定位服务规划路径。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识：大数据、AI、云服务与RFID<\/button><p><strong>小问（4）：<\/strong>支付宝（编者示例）<\/p><p>支付服务名称与支付工具作区分。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-newtech\">回看知识：大数据、AI、云服务与RFID<\/button><p>练习：多媒体与新技术三层练习；匹配模拟题：A卷18、B卷24、C卷20<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m7-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 40 · PDF第35—36页<\/h3><p><strong>原题表述：<\/strong>5层楼、120m范围、320个网络端口的校园网络设计，5个空。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>三层中间；交换机；IP地址；254；ping<\/p><p><strong>核验结论：<\/strong>按原考试意图可答；254限于传统IPv4 /24子网，无法容纳320台均需唯一地址的主机。<\/p><p>交换机接终端，DHCP分配地址，ping测试ICMP可达；综合布线按实际走线路径核查。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-ip\">回看知识<\/button><p><strong>小问①：<\/strong>三层中间位置（原参考方案）<\/p><p>布线中心性仅为起点；双绞线标准以链路实际长度约束，120m横跨不能无条件直连。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-layers\">回看知识：网络层次、路由器、交换机与网卡<\/button><p><strong>小问②：<\/strong>交换机<\/p><p>按端口数、上联能力和冗余选择。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-layers\">回看知识：网络层次、路由器、交换机与网卡<\/button><p><strong>小问③：<\/strong>IP地址<\/p><p>DHCP还可下发掩码、网关、DNS等。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-ip\">回看知识：IPv4、传统分类、子网掩码与网关<\/button><p><strong>小问④：<\/strong>254（假设/24）<\/p><p>2^8-2=254，320终端可拆为多个子网/VLAN或选更大合适网段。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-ip\">回看知识：IPv4、传统分类、子网掩码与网关<\/button><p><strong>小问⑤：<\/strong>ping<\/p><p>无响应可能是防火墙禁ICMP，不必然为线路故障。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-security\">回看知识：防火墙、恶意软件与安全能力边界<\/button><p>练习：网络与安全三层练习；匹配模拟题：A卷27、A卷44、B卷18、B卷19、B卷26、B卷38、C卷28、C卷33、C卷36<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 41 · PDF第36页<\/h3><p><strong>原题表述：<\/strong>手机与计算机安全建议，含4小问，第二问有两个空。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>（1）移动设备；（2）强度、更新；（3）程序或软件；（4）安装补丁<\/p><p><strong>核验结论：<\/strong>保留原题填空主线；“定期更新密码”属于原题表述，现代建议是疑似泄露时立即改密，日常优先唯一长密码及MFA。<\/p><p>控制权限、可信来源、修补漏洞、加密与备份；设备丢失和账号风险分开处理。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-security\">回看知识<\/button><p><strong>小问（1）：<\/strong>移动设备<\/p><p>定位功能可能泄露物理位置，谨慎授予权限。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-auth\">回看知识：认证因素、钓鱼识别、隐私与更新<\/button><p><strong>小问（2a）：<\/strong>强度（原题填空）<\/p><p>避免短密码与重复使用，优先唯一长密码并启用MFA。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-auth\">回看知识：认证因素、钓鱼识别、隐私与更新<\/button><p><strong>小问（2b）：<\/strong>更新（原题填空）<\/p><p>原题要求定期更新；现代防护不主张无条件形式轮换，疑似泄露时立即改密。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-auth\">回看知识：认证因素、钓鱼识别、隐私与更新<\/button><p><strong>小问（3）：<\/strong>程序或软件<\/p><p>减少下载未通过安全验证的软件。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-security\">回看知识：防火墙、恶意软件与安全能力边界<\/button><p><strong>小问（4）：<\/strong>安装补丁<\/p><p>修补已知漏洞，使用仍受支持的软件。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-security\">回看知识：防火墙、恶意软件与安全能力边界<\/button><p>练习：网络与安全三层练习；匹配模拟题：A卷10、A卷27、B卷17、B卷18、B卷19、B卷26、C卷17、C卷28、C卷33<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m5-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 42 · PDF第36页<\/h3><p><strong>原题表述：<\/strong>鸡兔同笼流程图补全4处，给出头数和脚数，枚举鸡数。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>①tu=head-ji；②jiao=foot；③2*ji+4*tu；④无解<\/p><p><strong>核验结论：<\/strong>原答案②③与原图位置不匹配。正确：②jiao=2*ji+4*tu，③foot。原图从ji=1起枚举还漏全兔解，改进应从0到head。<\/p><p>矩形②计算当前候选脚数；菱形已有jiao=，③只填目标foot。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method\">回看知识<\/button><p><strong>小问①：<\/strong>tu=head-ji<\/p><p>利用头数约束减少为一重枚举。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method\">回看知识：算法特征、三种结构与枚举建模<\/button><p><strong>小问②：<\/strong>jiao=2*ji+4*tu<\/p><p>矩形执行赋值计算当前脚数。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method\">回看知识：算法特征、三种结构与枚举建模<\/button><p><strong>小问③：<\/strong>foot<\/p><p>菱形比较jiao=foot；这里不能再填完整赋值语句。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method\">回看知识：算法特征、三种结构与枚举建模<\/button><p><strong>小问④：<\/strong>无解<\/p><p>候选穷尽后输出，不应每次不匹配都输出无解。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-method\">回看知识：算法特征、三种结构与枚举建模<\/button><p>练习：算法与流程图三层练习；匹配模拟题：B卷45、C卷25<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 43 · PDF第36—37页<\/h3><p><strong>原题表述：<\/strong>购买数量n：前10件5元、接着10件八折、超过20件七折。<\/p><p><strong>参考答案（答案PDF第23页）：<\/strong>①5*n；②50+4*(n-10)；③90+3.5*(n-20)<\/p><p><strong>核验结论：<\/strong>独立核验：n=10为50，n=20为90，两处分段边界连续。<\/p><p>n为非负整数，按各数量段分别计费；可用n&lt;=10、n&lt;=20、否则三路。<\/p><p class=\"muted\">注意题设条件，不把关联知识当成原题答案。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-piecewise\">回看知识<\/button><p><strong>小问①：<\/strong>sum=5*n<\/p><p>0≤n≤10。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-piecewise\">回看知识：分段计费、条件互斥与循环外提<\/button><p><strong>小问②：<\/strong>sum=50+4*(n-10)<\/p><p>10&lt;n≤20。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-piecewise\">回看知识：分段计费、条件互斥与循环外提<\/button><p><strong>小问③：<\/strong>sum=90+3.5*(n-20)<\/p><p>n&gt;20；前两段费用已经固定。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-piecewise\">回看知识：分段计费、条件互斥与循环外提<\/button><p>练习：算法与流程图三层练习；匹配模拟题：A卷22、C卷45<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 44 · PDF第37页<\/ \" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"380\" y=\"370.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">输出s/n（℃）<\/text><polygon points=\"547.0,265.0 720.0,265.0 703.0,305.0 530.0,305.0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"625\" y=\"290.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">输出无数据<\/text><rect x=\"320.0\" y=\"419.0\" width=\"120\" height=\"32\" rx=\"18\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"380\" y=\"440.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">结束<\/text><\/svg><\/div><p>练习：算法与流程图三层练习；匹配模拟题：A卷47<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section><section class=\"exam-source-entry\"><h3>真题 45 · PDF第37页<\/h3><p><strong>原题表述：<\/strong>N个离散正数存于curve数组，下标从0起，绘制输出非边界峰值个数的流程图。<\/p><p><strong>参考答案（答案PDF第24页）：<\/strong>答案PDF第24页给相邻比较、计数及循环图<\/p><p><strong>核验结论：<\/strong>峰值条件为严格大于左右邻居；应额外防护N&lt;3，端点不参与。<\/p><p>count初始化0，i从1到N-2；比较curve[i]&gt;curve[i-1]且curve[i]&gt;curve[i+1]；命中count加1，所有路径i递增，循环结束输出count。<\/p><p class=\"muted\">相等不是严格峰；单调数组无峰；空数组/长度1/2直接输出0，不能访问curve[-1]或curve[N]。<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-peaks\">回看知识<\/button><div class=\"exam-graph\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 400\" role=\"img\" aria-label=\"P(i)定义：curve[i]严格大于curve[i-1]且严格大于curve[i+1]。零基下标，只计内部峰值；N小于3时循环不进入、输出0。\"><defs><marker id=\"source-45-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#225B50\"/><\/marker><\/defs><polyline points=\"370,41 370,52\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><polyline points=\"370,88 370,102\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><polyline points=\"370,138 370,150\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><polyline points=\"370,210 370,230\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><text x=\"382.0\" y=\"220.0\" text-anchor=\"start\" font-size=\"14.4\" fill=\"#225B50\">是<\/text><polyline points=\"275,180 185,180\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><text x=\"230.0\" y=\"172.0\" text-anchor=\"middle\" font-size=\"14.4\" fill=\"#225B50\">否<\/text><polyline points=\"455,260 495,260\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><text x=\"475.0\" y=\"252.0\" text-anchor=\"middle\" font-size=\"14.4\" fill=\"#225B50\">是<\/text><polyline points=\"370,290 370,317\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><text x=\"382.0\" y=\"303.5\" text-anchor=\"start\" font-size=\"14.4\" fill=\"#225B50\">否<\/text><polyline points=\"580,278 580,335 455,335\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><polyline points=\"370,353 370,380 700,380 700,180 465,180\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><polyline points=\"110,198 110,224\" fill=\"none\" stroke=\"#225B50\" stroke-width=\"2.2\" marker-end=\"url(#source-45-arrow)\"/><rect x=\"310.0\" y=\"9.0\" width=\"120\" height=\"32\" rx=\"18\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"30.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">开始<\/text><polygon points=\"297.0,52.0 460.0,52.0 443.0,88.0 280.0,88.0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"75.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">输入N、curve<\/text><rect x=\"275.0\" y=\"102.0\" width=\"190\" height=\"36\" rx=\"0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"125.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">i=1；c=0<\/text><polygon points=\"370,150.0 465.0,180 370,210.0 275.0,180\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"185.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">i&lt;=N-2？<\/text><polygon points=\"370,230.0 455.0,260 370,290.0 285.0,260\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"265.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">P(i)？<\/text><rect x=\"495.0\" y=\"242.0\" width=\"170\" height=\"36\" rx=\"0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"580\" y=\"265.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">c=c+1<\/text><rect x=\"285.0\" y=\"317.0\" width=\"170\" height=\"36\" rx=\"0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"370\" y=\"340.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">i=i+1<\/text><polygon points=\"52.0,162.0 185.0,162.0 168.0,198.0 35.0,198.0\" fill=\"white\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"110\" y=\"185.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">输出c<\/text><rect x=\"60.0\" y=\"224.0\" width=\"100\" height=\"32\" rx=\"18\" fill=\"#EDF4F0\" stroke=\"#225B50\" stroke-width=\"2\"/><text x=\"110\" y=\"245.94\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#225B50\">结束<\/text><\/svg><\/div><p>练习：算法与流程图三层练习；匹配模拟题：A卷30、A卷48、C卷30、C卷46<\/p><button data-exam-action=\"knowledge\" data-exam-scene=\"m8-practice\">进入分层练习<\/button><\/section>"},"knowledge":{"prerequisites":["能分清题目要求、给定输入与输出。"],"mentalModel":"有效复盘不是重复答案，而是找出从条件到结论的哪一步出了问题。先分清对象，再统一单位与表示，最后用边界验证推理。","sections":[{"id":"review-1","title":"先辨认题目要求","body":"同一道题可以问软件操作、数据结果，也可以问流程图实际输出。首先圈出任务动词：统计要给汇总值，查询要确定符合条件的记录，补空要结合空位的形状和已有文字，作图要给完整的控制路径。计算机基础知识不能只背术语。比如文件长度与占用空间都以字节计量，但占用空间还受簇大小约束；“看到多少行”也不等于数据库真正保存多少行，筛选一般只是隐藏记录。明确被问的对象，是判断选项与公式之前的第一步。"},{"id":"review-2","title":"再确定条件与表示","body":"单位、下标与软件环境会改变答案。音频容量先根据采样率、时间、量化位数和声道数求总位数，再换字节；十进制KB与二进制KiB不能混用。数组从零开始时，第一个内部元素的下标是一，最后一个内部元素是倒数第二个；两端无法同时拥有左右邻居。Excel复制公式时，要先辨认每一段引用是随行移动、随列移动还是固定。SQL查询要区分逐行筛选和汇总后筛选，日期、通配符与函数语法还应服从题目注明的方言。"},{"id":"review-3","title":"把推理展开成可检查的步骤","body":"只写一个最终数字往往掩盖条件误读。先列输入和中间量，再检查最小值、最大值与恰好到达阈值的情况。分段价格的第一段费用应完整保留，而不是把全部数量都乘末段折扣。平均值算法要分别记录累计和与有效个数，结束哨兵不进入这两个量；没有有效数据时走单独分支，不能直接相除。枚举要证明候选范围包含全部可能情况；循环不仅要使条件变化，还要让每条路径都能完成必要的更新，否则遇到特定输入可能停滞。"},{"id":"review-4","title":"核对依据而不是只看结论","body":"所给参考答案是重要依据，但仍要与题图、题干和独立计算互相核对。若参考答案的位置写反、单位约定含混或图中数据相互冲突，应同时记录原答案和核验结果，不能把修正后的图当成原图。相同结果并不证明算法普遍正确，可以通过边界用例寻找反例。现代安全题也要注意适用范围：加密保护传输，不能证明网页内容真实；云同步便于协作，不能自动代替独立备份；人工智能生成的文字流畅，并不能保证事实与引用可靠。"}],"workedExamples":[{"title":"复盘例题","prompt":"平均气温算法把结束标记0也计入总天数，应该纠正哪一类错误？","steps":[{"text":"标记用于控制输入结束，不属于有效温度数据。"},{"text":"先判断是否结束，再执行累计与计数。"},{"text":"检查首个输入即结束和只有一条有效数据两个边界。"}],"result":"属于输入语义与更新次序错误；改正后还需防护空输入。"}],"pitfalls":["参考答案与独立核验必须分栏记录。","样例正确不等于所有输入均正确。"],"citations":[{"sourceId":"exam","locator":"2024原题29—37页与应用题边界"},{"sourceId":"answers","locator":"原答案21—24页；勘误对照"}],"title":"由题目定位知识与边界"}},{"id":"errata","stageId":"start","type":"orientation","title":"原卷勘误与版本说明","content":{"html":"<p>按原题、截图和独立演算核对，分别说明确定修正、术语边界和题干冲突。<\/p><section class=\"exam-source-entry\"><h3>音频容量的KB/KiB约定<\/h3><p class=\"muted\">单位边界 · 原PDF第32、34页<\/p><p>第22题5760KB选项按1000B；第35题1KB=1024字符按1024B。<\/p><p>分别保留原选项意图，解释两个单位体系；原创模拟题明确KB=1000B、KiB=1024B，不混用。<\/p><p class=\"muted\">真题22、35；原答案21—22页<\/p><\/section><section class=\"exam-source-entry\"><h3>横向填充时平均值列必须锁定<\/h3><p class=\"muted\">易错边界（原答案正确） · 原PDF第34—35页<\/p><p>原答案已写=ABS(成绩!B2-成绩!$H2)，正确锁定H列。<\/p><p>保留原答案；解释为何$H2适合横向及纵向填充，不能误改成H2或$H$2。<\/p><p class=\"muted\">真题38；原答案23页<\/p><\/section><section class=\"exam-source-entry\"><h3>原表整数平均与截图不一致<\/h3><p class=\"muted\">数据冲突 · 原PDF第34—35页<\/p><p>原图H列部分平均数与可见B:G成绩不一致。<\/p><p>保留图表冲突，按可见成绩重新算H=[89,89,88,92,92,92]，不推测隐含数据；讲义核验表另标为重新计算。<\/p><p class=\"muted\">真题38图表<\/p><\/section><section class=\"exam-source-entry\"><h3>奇数累计流程图停止更新<\/h3><p class=\"muted\">确定逻辑异常 · 原PDF第31页<\/p><p>i递增只在奇数分支，遇68后循环不前进。<\/p><p>原题选无输出；改进把递增放到两分支汇合之后。<\/p><p class=\"muted\">真题12<\/p><\/section><section class=\"exam-source-entry\"><h3>输出35的图不是可靠素数算法<\/h3><p class=\"muted\">流程图异常 · 原PDF第33页<\/p><p>判断方向及P状态更新未形成正确的一般素数检验。<\/p><p>原题按图答35；不把缺陷流程用于素数教学；正确试除要更新候选并处理n&lt;2。<\/p><p class=\"muted\">真题29<\/p><\/section><section class=\"exam-source-entry\"><h3>第39题缺失参考答案<\/h3><p class=\"muted\">缺失答案 · 原PDF第35页<\/p><p>未找到第39题对应原答案。<\/p><p>明确给编者示例并允许合理同类答案，不声称来自原考试标准答案。<\/p><p class=\"muted\">真题39；所给答案PDF<\/p><\/section><section class=\"exam-source-entry\"><h3>鸡兔同笼补空错位及算法边界<\/h3><p class=\"muted\">确定修正及边界 · 原PDF第36—37页<\/p><p>鸡兔同笼原参考答案②③位置写反；鸡数从1起漏全兔；峰值图未显式保护短数组。<\/p><p>②应jiao=2*ji+4*tu，③应foot；鸡数从0起且包括head；峰值先判N&lt;3，保证相邻访问合法，并最终输出峰值个数。<\/p><p class=\"muted\">真题42、45；原答案23—24页<\/p><\/section><section class=\"exam-source-entry\"><h3>安全表述及网络条件<\/h3><p class=\"muted\">适用范围 · 原PDF第31、35—36页<\/p><p>IPv6必然更安全更快；320端口配/24；无条件定期改密码。<\/p><p>安全及速度依部署；/24常规可用254，不能覆盖320个唯一地址终端；疑似泄露应立即改密，平时使用唯一长密码和MFA。<\/p><p class=\"muted\">真题14、40、41；NIST身份与认证指南<\/p><\/section><section class=\"exam-source-entry\"><h3>自动目录提取对象的措辞<\/h3><p class=\"muted\">术语边界 · 原PDF第34页<\/p><p>原参考答案将“自动提取”的对象填为标题样式。<\/p><p>保留原填空答案，讲解时区分依据与结果：标题样式/大纲级别是依据，目录提取并显示标题文字及对应页码。<\/p><p class=\"muted\">真题37（4）；原答案23页<\/p><\/section>"},"knowledge":{"prerequisites":["能分清题目要求、给定输入与输出。"],"mentalModel":"有效复盘不是重复答案，而是找出从条件到结论的哪一步出了问题。先分清对象，再统一单位与表示，最后用边界验证推理。","sections":[{"id":"review-1","title":"先辨认题目要求","body":"同一道题可以问软件操作、数据结果，也可以问流程图实际输出。首先圈出任务动词：统计要给汇总值，查询要确定符合条件的记录，补空要结合空位的形状和已有文字，作图要给完整的控制路径。计算机基础知识不能只背术语。比如文件长度与占用空间都以字节计量，但占用空间还受簇大小约束；“看到多少行”也不等于数据库真正保存多少行，筛选一般只是隐藏记录。明确被问的对象，是判断选项与公式之前的第一步。"},{"id":"review-2","title":"再确定条件与表示","body":"单位、下标与软件环境会改变答案。音频容量先根据采样率、时间、量化位数和声道数求总位数，再换字节；十进制KB与二进制KiB不能混用。数组从零开始时，第一个内部元素的下标是一，最后一个内部元素是倒数第二个；两端无法同时拥有左右邻居。Excel复制公式时，要先辨认每一段引用是随行移动、随列移动还是固定。SQL查询要区分逐行筛选和汇总后筛选，日期、通配符与函数语法还应服从题目注明的方言。"},{"id":"review-3","title":"把推理展开成可检查的步骤","body":"只写一个最终数字往往掩盖条件误读。先列输入和中间量，再检查最小值、最大值与恰好到达阈值的情况。分段价格的第一段费用应完整保留，而不是把全部数量都乘末段折扣。平均值算法要分别记录累计和与有效个数，结束哨兵不进入这两个量；没有有效数据时走单独分支，不能直接相除。枚举要证明候选范围包含全部可能情况；循环不仅要使条件变化，还要让每条路径都能完成必要的更新，否则遇到特定输入可能停滞。"},{"id":"review-4","title":"核对依据而不是只看结论","body":"所给参考答案是重要依据，但仍要与题图、题干和独立计算互相核对。若参考答案的位置写反、单位约定含混或图中数据相互冲突，应同时记录原答案和核验结果，不能把修正后的图当成原图。相同结果并不证明算法普遍正确，可以通过边界用例寻找反例。现代安全题也要注意适用范围：加密保护传输，不能证明网页内容真实；云同步便于协作，不能自动代替独立备份；人工智能生成的文字流畅，并不能保证事实与引用可靠。"}],"workedExamples":[{"title":"复盘例题","prompt":"平均气温算法把结束标记0也计入总天数，应该纠正哪一类错误？","steps":[{"text":"标记用于控制输入结束，不属于有效温度数据。"},{"text":"先判断是否结束，再执行累计与计数。"},{"text":"检查首个输入即结束和只有一条有效数据两个边界。"}],"result":"属于输入语义与更新次序错误；改正后还需防护空输入。"}],"pitfalls":["参考答案与独立核验必须分栏记录。","样例正确不等于所有输入均正确。"],"citations":[{"sourceId":"exam","locator":"2024原题29—37页与应用题边界"},{"sourceId":"answers","locator":"原答案21—24页；勘误对照"}],"title":"怎样核对原题与参考答案"}},{"id":"m1-system","stageId":"m1","type":"concept","title":"冯·诺依曼体系、硬件与软件分类","objectiveIds":["m1"],"knowledge":{"title":"冯·诺依曼体系、硬件与软件分类","summary":"对应真题：","prerequisites":["先按功能区分部件，再按用途区分软件。"],"mentalModel":"硬件说明计算机靠什么执行，软件说明让它执行什么。存储程序让执行过程可以自动持续，而不是每一步都由人重新接线。","sections":[{"id":"m1-system-s1","title":"五大部件与存储程序","body":"经典冯·诺依曼体系包括运算器、控制器、存储器、输入设备和输出设备。运算器做算术与逻辑运算；控制器取指令、译码并协调执行；存储器保存程序和数据；输入设备把外部信息送入，输出设备呈现结果。CPU通常由运算器和控制器等组成，不能把显示器或硬盘算进CPU。程序和数据都以二进制形式存储，程序在运行前进入可供CPU访问的存储器。"},{"id":"m1-system-s2","title":"哪些特征是答题依据","body":"判断体系特点抓住二进制、五大部件、存储程序与按指令执行。现代计算机可以流水线、并行或多核运行，但“运算器采用并行运算”不是经典体系的定义性特征。程序通常按顺序执行，分支和循环由控制转移实现，不能把“按顺序”理解成从不跳转。"},{"id":"m1-system-s3","title":"系统软件与应用软件","body":"操作系统管理硬件资源并向应用提供服务，是系统软件；常见例子包括Windows、UNIX、Linux。语言处理程序和服务于系统的工具也常列入系统软件。Word、浏览器、图像编辑和三维建模软件服务具体用户任务，属于应用软件。软件知名、预装或由大公司开发都不是系统软件的分类标准。"}],"workedExamples":[{"title":"标准例题","prompt":"键盘输入成绩，计算平均值后在屏幕显示，各部件承担什么任务？","steps":[{"text":"键盘完成输入；内存保存程序与正在处理的成绩。"},{"text":"CPU中的运算器参与求和与除法，控制器协调各步。"},{"text":"显示器完成输出。"}],"result":"输入、存储、运算/控制和输出构成完整处理链。","exampleType":"standard","variantType":"standard","id":"m1-system-example-1"},{"title":"易混对照","prompt":"Chrome和UNIX中，哪个属于系统软件？","steps":[{"text":"Chrome的主要任务是帮助用户访问网页。"},{"text":"UNIX管理进程、内存、文件与设备。"}],"result":"UNIX是系统软件；Chrome是应用软件。","exampleType":"contrast","variantType":"contrast","id":"m1-system-example-2"}],"pitfalls":["不要用是否收费区分软件类别。","经典体系的功能划分与现代硬件的实现方式不是同一问题。"],"takeaway":"输入、存储、运算/控制和输出构成完整处理链。","citations":[{"sourceId":"exam25","locator":"PDF第1页，第1、2题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第1—2、21—23页"}]},"content":{"text":""}},{"id":"m1-encoding","stageId":"m1","type":"concept","title":"ASCII、汉字编码与点阵字模","objectiveIds":["m1"],"knowledge":{"title":"ASCII、汉字编码与点阵字模","summary":"对应真题：35","prerequisites":["1字节=8位；字符、编码值、字形是三件事。"],"mentalModel":"编码回答“这是哪个字符”，字模回答“这个字符画成什么形状”。同一个汉字既有编码，也可以有不同大小的字模。","sections":[{"id":"m1-encoding-s1","title":"ASCII编码的对象","body":"标准ASCII用7位编码，共128种码位，表示英文字母、数字字符、标点和控制字符等。它不是汉字编码，也不是音频或图像格式。题目把ASCII称作西文字符编码，是为了与汉字编码区分；不能进一步误记为“只编码英文字母”。数字字符'7'的编码也不同于数值7的二进制表示。"},{"id":"m1-encoding-s2","title":"字符编码与字模容量","body":"字符编码建立字符与数值的对应；点阵字模以网格中的点表示字形。单色点阵通常每点1位，m×n字模占m×n位，除以8才得到字节。题目若说明每点多位，应再乘每点位数。编码存储空间和字模存储空间不能混算。"},{"id":"m1-encoding-s3","title":"汉字与版本条件","body":"传统GB2312/GBK常见汉字在对应双字节编码中占2字节，但Unicode是字符编码体系，UTF-8/UTF-16是具体编码方式，不能把“汉字永远2字节”当普遍规律。真题的16×16问的是单色字模，与其采用哪种文本编码无关。"},{"id":"m1-encoding-utf8","title":"现代扩展：UTF-8与字节计数","body":"ASCII字符在UTF-8中仍通常占1字节，Unicode码点可以用1—4字节表示。常见基本汉字常占3字节，但不能推出所有汉字或可见符号都固定为3字节；表情和组合序列更要区分码点、字节与看到的字符数。文本“AI中”在无BOM的UTF-8中占1+1+3=5字节。题目若讨论老式双字节汉字编码，应明确指定该编码，不能推广到Unicode全部编码。"}],"workedExamples":[{"title":"标准例题","prompt":"单色16×16点阵字模占多少字节？","steps":[{"text":"点数为16×16=256。"},{"text":"每点1位，共256位。"},{"text":"256÷8=32字节。"}],"result":"32 B。","exampleType":"standard","variantType":"standard","id":"m1-encoding-example-1"},{"title":"边界例题","prompt":"同样24×24点阵，若每点用2位表示，容量是多少？","steps":[{"text":"点数576，每点2位，共1152位。"},{"text":"1152÷8=144字节。"}],"result":"144 B；不能仍用72 B。","exampleType":"boundary","variantType":"boundary","id":"m1-encoding-example-2"}],"pitfalls":["ASCII有数字字符和控制字符，不只是英文单词。","字模题必须先明确单色与每点位数。"],"takeaway":"32 B。","citations":[{"sourceId":"exam","locator":"2024部分：题35，PDF第34页"},{"sourceId":"exam25","locator":"PDF第1页，第3、5题；考点题设依据。核心页支持字符编码；点阵容量按原题条件独立推导。"},{"sourceId":"core","locator":"PDF第13—14页"},{"sourceId":"500","locator":"PDF第8页（ASCII存储表示与码值比较）"},{"sourceId":"unicode","locator":"UTF-8 FAQ；编者原创字节计数例题"}]},"content":{"text":""}},{"id":"m1-radix","stageId":"m1","type":"concept","title":"进制转换与数值表示","objectiveIds":["m1"],"knowledge":{"title":"进制转换与数值表示","summary":"对应真题：","prerequisites":["理解位权：每位的权重由所在位置决定。"],"mentalModel":"先把数位乘位权求和，再反向检查。进制下标只是说明计数规则，不是数的一部分。","sections":[{"id":"m1-radix-s1","title":"二进制转十进制","body":"二进制从右到左的整数位权为1、2、4、8、16等。11011表示1×16+1×8+0×4+1×2+1=27。每位只能是0或1。不要把二进制数字串按十进制直接读成一万多。"},{"id":"m1-radix-s2","title":"十进制转二进制","body":"整数部分可不断除以2取余，最后把余数从后往前读；也可以按从大到小的2的幂拆分。27=16+8+2+1，对应11011。检验时重新按位权求和。如果题目要求8位，则写00011011，补零不改变非负数数值。"},{"id":"m1-radix-s3","title":"八/十六进制的快捷转换","body":"每3个二进制位对应1个八进制位，每4位对应1个十六进制位；从小数点两侧分别分组，整数部分向左补0。十六进制A—F分别代表10—15。无符号n位整数范围0到2^n-1；超出位宽不能直接截断后声称仍是原数。"},{"id":"m1-radix-transfer-check","title":"同类题的解题检查","body":"先在数的旁边写清原数制和目标数制，再选择位权展开、除基取余或二进制分组。位权展开从右端个位的零次幂开始；除基取余需要将余数倒序读出。二进制转八进制从小数点向两侧每三位一组，转十六进制每四位一组，位数不足只在外侧补零。最后用反向转换复核，尤其不能把十六进制字母当十进制数位。"}],"workedExamples":[{"title":"标准例题","prompt":"把45转换为二进制。","steps":[{"text":"45=32+8+4+1。"},{"text":"按32、16、8、4、2、1排列，得到1、0、1、1、0、1。"},{"text":"32+8+4+1=45复核。"}],"result":"101101。","exampleType":"standard","variantType":"standard","id":"m1-radix-example-1"},{"title":"边界例题","prompt":"十六进制2F对应多少十进制？","steps":[{"text":{"parts":[{"text":"2"},{"formula":{"tex":"F=2×16+15","spoken":"F=2×16+15","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>16<\/mn><mo>+<\/mo><mn>15<\/mn><\/mrow><\/math>"}},{"text":"。"}]}},{"text":"也可转二进制0010 1111。"}],"result":"47；F不是字母变量。","exampleType":"boundary","variantType":"boundary","id":"m1-radix-example-2"}],"pitfalls":["除2取余要倒序读。","先识别进制，再进行加减或比较。"],"takeaway":"101101。","citations":[{"sourceId":"exam25","locator":"PDF第1页，第4题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第9—12页"}]},"content":{"text":""}},{"id":"m1-logic","stageId":"m1","type":"concept","title":"按位与、或、非、异或","objectiveIds":["m1"],"knowledge":{"title":"按位与、或、非、异或","summary":"对应真题：","prerequisites":["二进制位只有0和1，运算前对齐位数。"],"mentalModel":"按位运算是一列一列独立判断。异或问“两个位是否不同”，不是普通加法，也不会向高位进位。","sections":[{"id":"m1-logic-s1","title":"四种运算规则","body":"与AND：两位都是1才得1；或OR：至少一位为1就得1；异或XOR：两位不相同得1，相同得0；非NOT：0变1，1变0。每列单独计算。按位非必须说明位宽，例如4位数0011取反是1100，不能无限向左补1而不交代范围。"},{"id":"m1-logic-s2","title":"标准操作顺序","body":"先把操作数按题目位宽补零对齐，再逐列写结果。1100 XOR 0101四列分别是1、0、0、1，因此为1001。用十进制辅助检查时，12 XOR 5为9，但XOR不是12+5，也不是按位OR。"},{"id":"m1-logic-s3","title":"条件逻辑与按位逻辑","body":"Excel中的AND判断多个条件是否同时为真；二进制按位AND对每一位处理。虽然都使用“与”，对象不同。算法中“a>=0 AND a<10”是区间判断；不能把布尔表达式与一串二进制混为同一种输入。"}],"workedExamples":[{"title":"标准例题","prompt":"1010与0110分别做AND、OR、XOR。","steps":[{"text":"只有从右数第二位两数都是1，AND结果0010。"},{"text":"OR凡有1保留，得1110。"},{"text":"XOR只保留不同位，得1100。"}],"result":{"parts":[{"code":"AND=0010"},{"text":"，"},{"code":"OR=1110"},{"text":"，"},{"formula":{"tex":"XOR=1100","spoken":"XOR=1100","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>XOR<\/mi><mo>=<\/mo><mn>1100<\/mn><\/mrow><\/math>"}},{"text":"。"}]},"exampleType":"standard","variantType":"standard","id":"m1-logic-example-1"},{"title":"勘误例题","prompt":"原第31题1100 XOR 0101为何不是参考答案1101？","steps":[{"text":"最右位0 XOR 1=1。"},{"text":"从右第二位0 XOR 0=0。"},{"text":"从右第三位1 XOR 1=0；参考答案把这一位写错。"},{"text":"最左位1 XOR 0=1。"}],"result":"正确结果1001。","exampleType":"misconception","variantType":"misconception","id":"m1-logic-example-2"}],"pitfalls":["异或没有进位；相同为0。","不能把逻辑OR当成算术相加。"],"takeaway":{"parts":[{"code":"AND=0010"},{"text":"，"},{"code":"OR=1110"},{"text":"，"},{"formula":{"tex":"XOR=1100","spoken":"XOR=1100","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>XOR<\/mi><mo>=<\/mo><mn>1100<\/mn><\/mrow><\/math>"}},{"text":"。"}]},"citations":[{"sourceId":"exam25","locator":"PDF第3页，第31题；考点题设依据。核心第12页仅支持与、或、非；异或规则、勘误与运算为编者补充及独立逐位复算。"},{"sourceId":"core","locator":"PDF第12页（仅与、或、非）"}]},"content":{"text":""}},{"id":"m1-storage","stageId":"m1","type":"concept","title":"位、字节、寻址空间与容量单位","objectiveIds":["m1"],"knowledge":{"title":"位、字节、寻址空间与容量单位","summary":"对应真题：24","prerequisites":["会计算2的幂；明确bit与Byte。"],"mentalModel":"地址线决定可以区分多少个地址；每个地址代表多少容量，还要看按字节还是按字寻址。","sections":[{"id":"m1-storage-s1","title":"单位统一","body":{"parts":[{"text":"1 "},{"formula":{"tex":"B=8 bit","spoken":"B=8 bit","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>=<\/mo><mn>8<\/mn><mi>bit<\/mi><\/mrow><\/math>"}},{"text":"。题目采用1024逐级换算时，1 "},{"formula":{"tex":"KiB=1024 B","spoken":"KiB=1024 B","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>KiB<\/mi><mo>=<\/mo><mn>1024<\/mn><mi>B<\/mi><\/mrow><\/math>"}},{"text":"，1 "},{"formula":{"tex":"MiB=1024 KiB","spoken":"MiB=1024 KiB","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>MiB<\/mi><mo>=<\/mo><mn>1024<\/mn><mi>KiB<\/mi><\/mrow><\/math>"}},{"text":"，1 "},{"formula":{"tex":"GiB=1024 MiB","spoken":"GiB=1024 MiB","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>GiB<\/mi><mo>=<\/mo><mn>1024<\/mn><mi>MiB<\/mi><\/mrow><\/math>"}},{"text":"。教材常把这些写成KB、MB、GB，本资料遇到这种习惯会明确换算约定。若题设用1000逐级换算，结果不同，应按题设。"}]}},{"id":"m1-storage-s2","title":"寻址空间的推导","body":{"parts":[{"text":"n位地址线能表示2^n种不同地址。按字节寻址时，每地址对应1字节，寻址空间为2^n B；按16位字寻址时每地址2字节，空间为2^n×2 B。真题32位地址总线通常隐含按字节寻址，2^32 "},{"formula":{"tex":"B=4 GiB","spoken":"B=4 GiB","mathml":"<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>=<\/mo><mn>4<\/mn><mi>GiB<\/mi><\/mrow><\/math>"}},{"text":"。"}]}},{"id":"m1-storage-s3","title":"容量、字长和速度的区分","body":"CPU字长描述一次典型处理的二进制位数；地址宽度描述地址数量；存储容量描述可保存的数据量。三者有关但不等价。RAM通常易失，外存通常非易失；“有32位CPU”本身不能直接推出某个硬盘只能4GB。"}],"workedExamples":[{"title":"标准例题","prompt":"30位地址线、按字节寻址，空间多大？","steps":[{"text":"共有2^30个地址。"},{"text":"每地址1 B，因此2^30 B。"},{"text":"按1024换算为1 GiB。"}],"result":"1 GiB。","exampleType":"standard","variantType":"standard","id":"m1-storage-example-1"},{"title":"边界例题","prompt":"同样30位地址线，按32位字寻址呢？","steps":[{"text":"每个地址对应32÷8=4 B。"},{"text":"2^30×4=2^32 B。"}],"result":"4 GiB；必须考虑寻址单位。","exampleType":"boundary","variantType":"boundary","id":"m1-storage-example-2"}],"pitfalls":["32位地址总线不等于32字节。","没有寻址单位时须说明采用常见按字节假设。"],"takeaway":"1 GiB。","citations":[{"sourceId":"exam","locator":"2024部分：题24，PDF第32页；题35，PDF第34页"},{"sourceId":"exam25","locator":"PDF第3页，第32题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第14—16、21—23页（位/字节、1024容量换算、寻址与存储部件）"}]},"content":{"text":""}},{"id":"m1-complement","stageId":"m1","type":"concept","title":"有符号整数与补码的双向转换","objectiveIds":["m1"],"knowledge":{"title":"有符号整数与补码的双向转换","summary":"对应真题：34","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"同一串二进制位既可作为无符号数，也可按补码解释为带符号数。最高位为1时，不应只把它擦掉再读余下的位。必须先锁定总位数和编码类型。","sections":[{"id":"m1-complement-s1","title":"先确定范围","body":"n位无符号整数的范围是0到2^n-1；n位补码整数的范围是-2^(n-1)到2^(n-1)-1。8位补码为-128到127。最高位权重为负，其他位权重仍为正，因此全零表示0，全一表示-1。补码只有一个零，最小负数没有对应的同宽正数。"},{"id":"m1-complement-s2","title":"读一个补码","body":"先把整串按无符号数求值U。最高位为0时，结果就是U；最高位为1时，补码值为U-2^n。2024题34的10110100按无符号数为180，8位补码则为180-256=-76。这种方法不需要把最高位和数值部分误当作符号-绝对值形式。"},{"id":"m1-complement-s3","title":"写一个负数","body":"求8位-76：先写+76为01001100，逐位取反得到10110011，再加1得到10110100。也可以计算256-76=180再转成8位二进制。要保留8位长度，不能写成任意长的二进制串后再使用最高位规则。"},{"id":"m1-complement-s4","title":"溢出与数据解释","body":"若计算的数学结果超出表示范围，固定长度存储会发生溢出。例如8位有符号127加1的存储位型是10000000，解释为-128；这不等于数学意义上的128。考试若未规定溢出模型，应指出范围问题。图片色值和文件字节通常按无符号量读取，不能一见最高位为1就称负数。"}],"workedExamples":[{"title":"标准例题","prompt":"8位补码11101100表示多少？","steps":[{"text":"无符号值为236。"},{"text":"最高位为1，计算236-256。"}],"result":"-20。","variantType":"standard","id":"m1-complement-example-1"},{"title":"边界对照","prompt":"8位补码10000000与无符号10000000有何区别？","steps":[{"text":"位型相同，解释方式不同。"},{"text":"补码最小值是-128；无符号值是128。"}],"result":"补码为-128，无符号为128。","variantType":"boundary","id":"m1-complement-example-2"}],"pitfalls":["把最高位直接删除是原码式思路，不能用于负数补码。","位数改变时需讨论符号扩展，不能随意补零。"],"takeaway":"-20。","citations":[{"sourceId":"exam","locator":"PDF第34页题34"},{"sourceId":"core","locator":"计算机中数值表示与编码章节"}]},"content":{"text":""}},{"id":"m1-practice","stageId":"m1","type":"quiz","title":"计算机系统与编码 · 分层练习","objectiveIds":["m1"],"content":{"items":[{"id":"m1-guided","module":"m1","kind":"single","practiceLevel":"guided","topicId":"m1-complement","objectiveIds":["m1"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"8位补码11111100表示什么整数？","options":[{"id":"A","text":"252"},{"id":"B","text":"-4"},{"id":"C","text":"-3"},{"id":"D","text":"4"}],"answer":["B"],"explanation":"无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。","feedback":{"correct":"判断正确。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。","incorrect":"先检查关键条件。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。"},"optionFeedback":{"A":"该项不满足题设。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。","B":"正确。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。","C":"该项不满足题设。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。","D":"该项不满足题设。无符号值252，带符号补码为252-256=-4。 252是无符号解释，不符合“8位补码”；负三对应不同位串，正四的最高位应为零。先确认位宽，再根据最高位选择解释方式。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m1-independent","module":"m1","kind":"single","practiceLevel":"independen ,"y":95,"w":220,"h":70},{"id":"waiting","kind":"process","label":"阻塞：等待事件","x":505,"y":320,"w":220,"h":70}],"edges":[{"from":"ready","to":"running","label":"调度","points":[[265,75],[395,75]]},{"from":"running","to":"ready","label":"时间片结束","points":[[395,125],[265,125]]},{"from":"running","to":"waiting","label":"请求I/O并等待","points":[[505,130],[505,285]]},{"from":"waiting","to":"ready","label":"事件完成","points":[[395,320],[155,320],[155,130]]}],"caption":"经典教学三态示意；阻塞完成事件后进入就绪，仍需等待调度。挂起另作区分。"},"assetId":"m2-process-asset","sourceRef":"exam","sourceLocator":"相关原题与本节原理的教学重绘"}]},"content":{"text":""}},{"id":"m2-task","stageId":"m2","type":"concept","title":"任务管理器：打开、读表与结束任务","objectiveIds":["m2"],"knowledge":{"title":"任务管理器：打开、读表与结束任务","summary":"对应真题：","prerequisites":["先明确要比较CPU、内存还是磁盘。"],"mentalModel":"任务管理器的读图题先看列名和单位，再看数值；“占用资源最多”必须对应一个明确指标。","sections":[{"id":"m2-task-s1","title":"两种常用入口","body":"Ctrl+Shift+Esc通常直接打开任务管理器；Ctrl+Alt+Delete打开安全选项界面，再选择任务管理器。原第41题先展示安全选项页，所以该小问应填后者。不能看到“任务管理器”几个字就忽略题目问的是哪一步。"},{"id":"m2-task-s2","title":"界面与指标","body":"进程页显示应用和后台进程的CPU、内存、磁盘或网络等情况；性能页查看CPU、内存、磁盘、网络的总体使用趋势。CPU使用率是百分比，内存可用MB表示。内存最多与CPU最多未必是同一个进程；模拟题将明确指标。"},{"id":"m2-task-s3","title":"结束任务的步骤","body":"在进程列表找到并选中目标应用，再选择“结束任务”。对无响应的用户应用可用于结束其进程，但可能丢失尚未保存的编辑内容。它不能保证解决所有卡顿原因，也不能用“某次占用高”证明软件一定有病毒。Windows版本可能改变布局，读图以题给界面为准。"}],"workedExamples":[{"title":"标准例题","prompt":"甲应用CPU为5%、内存900MB；乙CPU为40%、内存200MB。哪一个内存占用更大？","steps":[{"text":"问题明确比较内存。"},{"text":"900>200，忽略CPU列的大小。"}],"result":"甲应用。","exampleType":"standard","variantType":"standard","id":"m2-task-example-1"},{"title":"入口辨认","prompt":"题图为包含锁定、切换用户、任务管理器的安全选项页，应填什么快捷键？","steps":[{"text":"先识别是安全选项页。"},{"text":"Ctrl+Alt+Delete进入该页；Ctrl+Shift+Esc直接开任务管理器。"}],"result":"Ctrl+Alt+Delete。","exampleType":"contrast","variantType":"contrast","id":"m2-task-example-2"}],"pitfalls":["比较数值前必须核对列名、单位和排序方向。","结束任务是操作步骤，不是修复所有故障的保证。"],"takeaway":"甲应用。","citations":[{"sourceId":"exam25","locator":"PDF第4—5页，第41(1)—(4)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第26页"}]},"content":{"text":""}},{"id":"m2-files","stageId":"m2","type":"concept","title":"Windows目录、文件名、路径与文件系统","objectiveIds":["m2"],"knowledge":{"title":"Windows目录、文件名、路径与文件系统","summary":"对应真题：","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"路径像从入口到房间的路线。文件名回答找谁，目录回答在哪；绝对路径从盘符或根开始，相对路径从当前目录开始。名字、内容和所在位置是三个不同属性。","sections":[{"id":"m2-files-s1","title":"目录树与两种路径","body":"Windows常见卷内目录按树形层次组织。D:\\Study\\Data\\scores.csv是绝对路径；当前目录若为D:\\Study\\Reports，..\\Data\\scores.csv先回到Study，再进入Data。一个..表示父目录，不表示盘符根，也不是删除文件的操作。盘符名称可变，题目应给定当前目录。"},{"id":"m2-files-s2","title":"文件名和扩展名","body":"扩展名帮助操作系统选择打开程序，不会因为重命名就自动转换文件内部格式。Windows普通文件名不可含有< > : \" / \\ | ? *等保留字符。路径中的反斜线是目录分隔符，不能混入单个文件名作为普通字符。文件扩展名被隐藏时应先显示它，防止把可执行文件误认成文档。"},{"id":"m2-files-s3","title":"卷与文件系统","body":"NTFS、FAT32、exFAT都是常见文件系统，用来组织卷上的文件和元数据。NTFS支持访问权限等机制；exFAT常用于大文件与可移动存储；FAT32的单文件大小上限不能被理解成整个分区只能放同样多的数据。选择题若仅问举例，给出两个合法名称即可，不能用ZIP或PDF代替文件系统。"},{"id":"m2-files-s4","title":"文件操作与安全","body":"复制创建另一份文件；移动通常改变位置；删除可能经过回收站，也可能直接删除，受位置和操作方式影响。同步服务可传播编辑与删除，因此同步不是独立备份的同义词。操作重要资料前应核对当前目录、目标路径及权限，避免误把同名文件视为同一文件。"}],"workedExamples":[{"title":"标准例题","prompt":"当前目录D:\\Campus\\Reports，访问D:\\Campus\\Data\\exam.csv的相对路径？","steps":[{"text":"先上一级到Campus。"},{"text":"再进入Data并指定exam.csv。"}],"result":"..\\Data\\exam.csv。","variantType":"standard","id":"m2-files-example-1"},{"title":"边界对照","prompt":"把photo.jpg改为photo.png就转成PNG了吗？","steps":[{"text":"扩展名改变不重写图像内容。"},{"text":"应使用支持PNG的工具执行另存或导出。"}],"result":"没有自动完成格式转换。","variantType":"boundary","id":"m2-files-example-2"}],"pitfalls":["文件系统、文件格式、目录结构属于不同层次。","相对路径必须带有明确的当前目录。"],"takeaway":"..\\Data\\exam.csv。","citations":[{"sourceId":"exam26","locator":"目录、文件系统与路径应用题41"},{"sourceId":"500","locator":"Windows基础章节"}]},"content":{"text":""}},{"id":"m2-practice","stageId":"m2","type":"quiz","title":"Windows与进程 · 分层练习","objectiveIds":["m2"],"content":{"items":[{"id":"m2-guided","module":"m2","kind":"single","practiceLevel":"guided","topicId":"m2-process","objectiveIds":["m2"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"等待磁盘I/O完成的进程处于哪种经典状态？","options":[{"id":"A","text":"运行"},{"id":"B","text":"就绪"},{"id":"C","text":"阻塞"},{"id":"D","text":"终止"}],"answer":["C"],"explanation":"等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。","feedback":{"correct":"判断正确。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。","incorrect":"先检查关键条件。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。"},"optionFeedback":{"A":"该项不满足题设。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。","B":"该项不满足题设。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。","C":"正确。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。","D":"该项不满足题设。等待外部事件为阻塞；就绪只等待CPU。 运行表示当前获得CPU，就绪表示只等CPU；阻塞中的进程即使得到CPU，也还缺少I/O完成事件，不等于已经终止。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m2-independent","module":"m2","kind":"single","practiceLevel":"independent","topicId":"m2-files","objectiveIds":["m2"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"Windows路径D:\\资料\\结果.xlsx中扩展名是什么？","options":[{"id":"A","text":"D:"},{"id":"B","text":"资料"},{"id":"C","text":"结果"},{"id":"D","text":"xlsx"}],"answer":["D"],"explanation":"最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。","feedback":{"correct":"判断正确。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。","incorrect":"先检查关键条件。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。"},"optionFeedback":{"A":"该项不满足题设。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。","B":"该项不满足题设。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。","C":"该项不满足题设。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。","D":"正确。最后的点分隔主名与扩展名；扩展名不是格式真实性保证。 盘符表示卷，目录表示路径的一层，结果是文件主名；扩展名用于关联打开方式，但改扩展名不会转换内部文件格式。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m2-transfer","module":"m2","kind":"single","practiceLevel":"transfer","topicId":"m2-files","objectiveIds":["m2"],"novelTransfer":true,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"误删云同步文件且已同步到其他设备，优先采取什么操作？","options":[{"id":"A","text":"继续同步即能恢复"},{"id":"B","text":"检查回收站或版本历史并独立备份"},{"id":"C","text":"只更改文件后缀"},{"id":"D","text":"清空所有回收站"}],"answer":["B"],"explanation":"同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。","feedback":{"correct":"判断正确。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。","incorrect":"先检查关键条件。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。"},"optionFeedback":{"A":"该项不满足题设。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。","B":"正确。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。","C":"该项不满足题设。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。","D":"该项不满足题设。同步传播删除，独立备份/回收站/版本历史才能提供恢复来源。 同步并非只把好的修改传播，它也传播误删。恢复来源必须早于误删或保存独立副本；改后缀与继续同步都不产生旧内容。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"}]}},{"id":"m3-format","stageId":"m3","type":"concept","title":"字符格式、段落对齐、项目符号与页眉","objectiveIds":["m3"],"knowledge":{"title":"字符格式、段落对齐、项目符号与页眉","summary":"对应真题：1、2、37","prerequisites":["区别文字内容与文字格式；段落由段落标记界定。"],"mentalModel":"先确认格式作用于字符、段落还是页面，再选择命令。对齐、编号和页眉分别属于不同层次的设置。","sections":[{"id":"m3-format-s1","title":"格式刷的完整过程","body":"先选择已经具有目标格式的源文本，再单击格式刷，最后拖选需要应用格式的目标文本。单击格式刷常用于一次应用，双击可连续多次应用，结束可按Esc。真题问复制格式后怎样应用，应选择目标文本，而不是只把鼠标悬停在上面。"},{"id":"m3-format-s2","title":"对齐与列表","body":"左对齐、居中、右对齐、两端对齐、分散对齐各有不同作用。观察选中文字的位置要结合左右边界和工具栏，居中不是只看文字短。项目符号列表用圆点等符号开头，编号列表用1、2、3等连续编号，多级列表还有层级；三者不能混称“排序”。"},{"id":"m3-format-s3","title":"页眉与正文标题","body":"页眉位于页面上方页眉区，正文标题位于正文。原图大字“专家系统的一般结构”是正文标题，而页眉是“专家系统”。不同节可以设置不同页眉，需要结合分节及链接到前一节等机制；本卷直接考查从界面辨认内容。"}],"workedExamples":[{"title":"标准例题","prompt":"复制某标题的格式到另一标题，正确顺序是什么？","steps":[{"text":"选中源标题。"},{"text":"单击格式刷。"},{"text":"拖选目标标题；内容保留，格式改变。"}],"result":"源文本→格式刷→目标文本。","exampleType":"standard","variantType":"standard","id":"m3-format-example-1"},{"title":"对照例题","prompt":"一段前面都是黑色圆点，另一段是1、2、3，哪段是项目符号？","steps":[{"text":"看列表标记，而不是文本长短。"},{"text":"黑色圆点表示项目符号；连续数字表示编号。"}],"result":"黑色圆点列表。","exampleType":"contrast","variantType":"contrast","id":"m3-format-example-2"}],"pitfalls":["格式刷复制格式不等于复制正文内容。","页眉不是正文里最上面的所有文字。"],"takeaway":"源文本→格式刷→目标文本。","citations":[{"sourceId":"exam","locator":"2024部分：题1，PDF第29页；题2，PDF第29页；题37，PDF第34页"},{"sourceId":"exam25","locator":"PDF第1、6页，第6、43(1)—(3)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第41—47页"},{"sourceId":"500","locator":"PDF第11—14页"}]},"content":{"text":""}},{"id":"m3-ppt","stageId":"m3","type":"concept","title":"PowerPoint视图、放映与超链接","objectiveIds":["m3"],"knowledge":{"title":"PowerPoint视图、放映与超链接","summary":"对应真题：3、27","prerequisites":["演示文稿由多张幻灯片组成；编辑和放映是不同状态。"],"mentalModel":"视图帮助编辑组织，放映面向观众展示，超链接建立跳转目标。根据任务目的辨认按钮和命令。","sections":[{"id":"m3-ppt-s1","title":"视图与放映","body":"普通视图便于编辑单页内容；幻灯片浏览视图便于观察顺序并移动多张幻灯片；放映视图全屏展示。常见F5从头放映、Shift+F5从当前页放映，Esc退出。真题图标表示幻灯片放映，不能凭“有三角形”就认作某个对象动画。"},{"id":"m3-ppt-s2","title":"超链接能链接什么","body":"对选中文字或图形设置超链接，可跳到网址、另一张幻灯片或文件等目标。应先选对象，再指定目标并在放映环境测试；文本本身不会因输入一个文件名就一定产生正确链接。链接外部文件时，移动文件路径可能导致失效。"},{"id":"m3-ppt-s3","title":"动画、切换与链接","body":"动画作用于页内对象，切换作用于从一张幻灯片到另一张的过渡，超链接决定用户点击后的目标。三者可同时存在，但用途不同。做题先看是“让对象运动”“换页效果”还是“点击后打开指定文件”。"},{"id":"m3-ppt-master","title":"母版与自定义放映","body":"母版视图用于设置一组幻灯片的共同主题、背景、版式占位符等规则，通常不替代单张内容编辑。自定义幻灯片放映可以选定所需幻灯片并安排特定放映序列，而不必删除其他幻灯片。动画控制页内对象，切换控制页面之间的效果，两者都不是母版编辑本身。2024题3对应母版视图，题27参考为自定义幻灯片放映。"}],"workedExamples":[{"title":"标准例题","prompt":"点击“实验数据”四个字后打开本机数据文件，应使用什么功能？","steps":[{"text":"选中文字。"},{"text":"设置超链接到目标文件。"},{"text":"进入放映测试可否打开。"}],"result":"超链接。","exampleType":"standard","variantType":"standard","id":"m3-ppt-example-1"},{"title":"对照例题","prompt":"让一张幻灯片淡出到下一张，与让标题飞入分别属于什么？","steps":[{"text":"前者发生在页与页之间。"},{"text":"后者发生在同一页内的对象上。"}],"result":"前者为切换，后者为动画。","exampleType":"contrast","variantType":"contrast","id":"m3-ppt-example-2"}],"pitfalls":["不要把编辑视图与放映视图混淆。","Office 2000菜单名和固定版式数量不能直接推广到现代版本。"],"takeaway":"超链接。","citations":[{"sourceId":"exam","locator":"2024部分：题3，PDF第29页；题27，PDF第32页"},{"sourceId":"exam25","locator":"PDF第1、3页，第8、25题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第63—71页"},{"sourceId":"500","locator":"PDF第26—30页"}]},"content":{"text":""}},{"id":"m3-toc","stageId":"m3","type":"concept","title":"Word另存、页边距、标题样式、目录与分节","objectiveIds":["m3"],"knowledge":{"title":"Word另存、页边距、标题样式、目录与分节","summary":"对应真题：37","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"文档目录来自正文的结构标记，不是把字号调大后自动猜出来。页眉页脚和页码属于版式规则，分节让不同区域拥有不同规则，分页只负责另起一页。","sections":[{"id":"m3-toc-s1","title":"保存与另存为","body":"打开test1.docx后另存为test2.docx，在常见桌面Word流程中当前编辑文档转为test2.docx，原文件仍保留另存前的版本。要区分当前窗口正在编辑的副本与磁盘上存在的多个文件；保存更新当前文件，另存为提供新名称、位置或格式。"},{"id":"m3-toc-s2","title":"页面与段落两层设置","body":"页边距控制页面边缘到正文区域的距离，段落缩进控制段落相对正文边界的位置。上、下、左、右页边距可以分别设置。若要求一页内排版，应分析字号、段间距、行距和页边距，不应改动页眉来假装改变正文的行数。不同节可设置不同版式。"},{"id":"m3-toc-s3","title":"标题样式与自动目录","body":"给章、节、小节分别应用标题1、标题2、标题3，再通过引用中的目录命令插入自动目录。常见默认目录展示前三层标题，具体可在目录设置中修改。自动目录读取标题样式或大纲级别，单纯加粗、换字号不保证进入目录。正文标题或页码变化后需要更新目录。"},{"id":"m3-toc-s4","title":"分页与分节的选择","body":"正文从新页开始可使用分页符；目录与正文页码需不同格式或重新编号时，应插入合适的分节符，在新节页眉页脚中取消与前节链接，再设置页码格式和起始值。仅插入分页符并不会建立新的页码规则。操作时应先显示编辑标记以确认边界。"}],"workedExamples":[{"title":"标准例题","prompt":"目录用罗马数字、正文从阿拉伯数字1开始，应如何设置？","steps":[{"text":"目录结束插入下一页分节符。"},{"text":"正文节取消页眉页脚与前节链接，设置页码格式并从1开始。"},{"text":"分别更新目录和正文页码。"}],"result":"关键是分节与页码规则，不是反复敲回车。","variantType":"standard","id":"m3-toc-example-1"},{"title":"边界对照","prompt":"把三行标题设为黑体三号后，自动目录仍未显示它们，原因是什么？","steps":[{"text":"字号属于外观，标题样式属于结构。"},{"text":"对正文标题应用对应级别的标题样式，再更新目录。"}],"result":"需补上标题样式或合适的大纲级别。","variantType":"boundary","id":"m3-toc-example-2"}],"pitfalls":["分页符不等于分节符。","目录中直接改字会在更新时被覆盖，应先改正文标题。"],"takeaway":"关键是分节与页码规则，不是反复敲回车。","citations":[{"sourceId":"exam","locator":"PDF第29页题1、2；第34页题37"},{"sourceId":"core","locator":"Word页面设置与目录章节"}]},"content":{"text":""}},{"id":"m3-practice","stageId":"m3","type":"quiz","title":"Word与PowerPoint · 分层练习","objectiveIds":["m3"],"content":{"items":[{"id":"m3-guided","module":"m3","kind":"single","practiceLevel":"guided","topicId":"m3-toc","objectiveIds":["m3"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"想把某标题列入自动目录的二级，一般使用什么？","options":[{"id":"A","text":"仅加粗"},{"id":"B","text":"标题2样式"},{"id":"C","text":"手工空格"},{"id":"D","text":"插入图片"}],"answer":["B"],"explanation":"目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。","feedback":{"correct":"判断正确。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。","incorrect":"先检查关键条件。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。"},"optionFeedback":{"A":"该项不满足题设。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。","B":"正确。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。","C":"该项不满足题设。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。","D":"该项不满足题设。目录按配置的标题样式/大纲级别提取，视觉格式本身不充分。 加粗只改变外观，空格只调整文字位置，图片也不能提供正文标题的大纲级别。自动目录是基于结构信息生成的。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m3-independent","module":"m3","kind":"single","practiceLevel":"independent","topicId":"m3-ppt","objectiveIds":["m3"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"统一多页公共页脚和字体的首选位置是什么？","options":[{"id":"A","text":"普通视图任意一页"},{"id":"B","text":"备注页"},{"id":"C","text":"幻灯片母版"},{"id":"D","text":"仅最后一页"}],"answer":["C"],"explanation":"母版管理公共设计，单页覆盖或不同母版要另外检查。 修改普通视图单页只影响那一页，备注页针对讲稿。母版与所属版式之间有继承关系，但具体单页覆盖仍要检查。","feedback":{"correct":"判断正确。母版管理公共设计，单页覆盖或不同母版要另外检查。 修改普通视图单页只影响那一页，备注页针对讲稿。母版与所属版式之间有继承关系，但具体单页覆盖仍要检查。","incorrect":"先检查关键条件。母版管理公共设计，单页覆盖或不同母版要另外检查。 修改普通视图单页只影响那一页，备注页针对讲稿。母版与所属版式之间有继承关系，但具体单页覆盖仍要检查。"},"optionFe 2、考3、试4、时5、间6。因此从第3个字符取2个字符得到“考试”。不能把第3个字符理解成从0开始计数的第4个字符，也不能把第三参数当作结束位置。"},{"id":"m4-text-s3","title":"LEFT、RIGHT与前导零","body":"LEFT从最左侧取指定字符数，RIGHT从最右侧取指定字符数，结果属于文本。例如=RIGHT(\"批次03\",2)得到文本“03”，并非数值3。若要保留编号的前导零，应保留这个文本结果，避免不必要地转成数值。若目标为“第03批”，可以把“第”、提取结果、“批”按顺序用&连接；每段的来源都要与题目要求的单元格对应。"},{"id":"m4-text-s4","title":"组合与检查","body":"写文本公式时把目标拆成“年份”“年”“月份”“考试”四段，再分别选引用或常量。检查输出应比较完整字符串，包括是否多出空格、缺字、重复单位。公式中的函数名大小写通常不影响结果，但引号必须成对；从文档复制来的弯引号可能需要替换为适合公式输入的英文直引号。"}],"workedExamples":[{"title":"标准例题","prompt":"A1为2025，B1为12月，C1为参加考试时间，生成2025年12月考试。","steps":[{"text":"年份来自A1，“年”是常量。"},{"text":"月份来自B1，考试由MID(C1,3,2)取得。"}],"result":"=A1&\"年\"&B1&MID(C1,3,2)。","exampleType":"standard","variantType":"standard","id":"m4-text-example-1"},{"title":"易错对照","prompt":"MID(\"参加考试时间\",3,4)会得到什么？","steps":[{"text":"起点是“考”，连续取4个字符。"},{"text":"第三参数是数量，不是截止下标。"}],"result":"考试时间。","exampleType":"contrast","variantType":"contrast","id":"m4-text-example-2"}],"pitfalls":["&用于连接；加号主要用于算术，不能把任意文本直接相加。","文本提取的位置从1开始。"],"takeaway":"=A1&\"年\"&B1&MID(C1,3,2)。","citations":[{"sourceId":"exam25","locator":"PDF第1、4页，第9、34题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第54—55页"}]},"content":{"text":""}},{"id":"m4-ref","stageId":"m4","type":"concept","title":"相对、绝对、混合引用与跨表引用","objectiveIds":["m4"],"knowledge":{"title":"相对、绝对、混合引用与跨表引用","summary":"对应真题：6、38","prerequisites":["会用列字母和行号定位单元格；公式通常以等号开头。"],"mentalModel":"复制公式像搬运一张带相对方位的路线图：没有锁定的坐标随位置改变，带美元符号的部分固定。","sections":[{"id":"m4-ref-s1","title":"四种引用","body":"A1是相对引用，行列都可在复制时改变；$A$1是绝对引用，行列均固定；$A1只固定列；A$1只固定行。美元符号写在要锁定的坐标前。判断复制结果时先算公式移动了几行几列，再只改变未锁定的部分。不要因出现一个美元符号就认为整个引用均固定。"},{"id":"m4-ref-s2","title":"跨表引用","body":"引用其他工作表一般用工作表名、感叹号、单元格地址组合。例如在Sheet1中把Sheet2的C6与本表A2相加，公式写为=Sheet2!C6+A2。工作表名含空格或特殊字符时，通常用单引号包住表名，例如='年度 业绩'!B2。感叹号用于工作表与地址之间，不应换成冒号。冒号常用于连续区域，例如B3:E3。"},{"id":"m4-ref-s3","title":"自动填充","body":"同时选中1、3两个数值单元格再拖动，Excel通常识别等差序列，后续为5、7、9；仅选中一个普通数字拖动，常默认复制，该行为还可能受填充选项影响。公式填充改变的是引用位置。先判断题目给的是数值序列还是公式，再决定使用数列规律还是引用平移规则。"}],"workedExamples":[{"title":"标准例题","prompt":"C2中的公式=A2*$F$1向下复制到C3。","steps":[{"text":"下移一行，A2变A3。"},{"text":"$F$1的列行都固定。"}],"result":"=A3*$F$1。","exampleType":"standard","variantType":"standard","id":"m4-ref-example-1"},{"title":"边界例题","prompt":"=A$1+$B2从C2复制到D3。","steps":[{"text":"右移一列、下移一行。"},{"text":"A$1列变为B，行1固定；$B2列B固定，行变3。"}],"result":"=B$1+$B3。","exampleType":"boundary","variantType":"boundary","id":"m4-ref-example-2"}],"pitfalls":["冒号表示区域，感叹号表示跨工作表引用。","数据填充与公式填充分别处理。"],"takeaway":"=A3*$F$1。","citations":[{"sourceId":"exam","locator":"2024部分：题38，PDF第34页"},{"sourceId":"exam25","locator":"PDF第2页，第10题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第54—55页"}]},"content":{"text":""}},{"id":"m4-sort","stageId":"m4","type":"concept","title":"数据清单与多关键字排序","objectiveIds":["m4"],"knowledge":{"title":"数据清单与多关键字排序","summary":"对应真题：26","prerequisites":["一条记录的各字段必须同步移动。"],"mentalModel":"排序先比较主要关键字；只有主要关键字相同时，才比较次要关键字。排序对象是整条记录。","sections":[{"id":"m4-sort-s1","title":"升序、降序与表头","body":"数值升序从小到大，降序从大到小；文本按所用排序规则比较。勾选“数据包含标题”时，标题行不参与普通记录排序。不能只对姓名列排序而把其他字段留在原地，否则姓名与成绩的对应关系会被破坏。"},{"id":"m4-sort-s2","title":"多关键字的实际执行","body":"例如先按班级升序，再按成绩降序：先把同班记录放在一起，各班内部才按成绩排列。如果成绩仍相同且题目需要确定首行，可增加学号等第三关键字。完全相同关键字时，不应无依据保证某种先后顺序。"},{"id":"m4-sort-s3","title":"真题的读图方法","body":"先读排序对话框的列名、依据和次序，再看“数据包含标题”的选项，然后对完整表格重排。原第33题图按teacher列升序，Boy排在Jade、Sky、Tom之前，因此对应student为Amy，A2显示Amy。不是直接对A列student排序。"}],"workedExamples":[{"title":"标准例题","prompt":"记录为(1班,80,甲)、(2班,95,乙)、(1班,90,丙)，按班级升序再成绩降序，第一条是谁？","steps":[{"text":"先选1班记录。"},{"text":"1班中90高于80，因此丙在甲前。"}],"result":"丙。","exampleType":"standard","variantType":"standard","id":"m4-sort-example-1"},{"title":"易错例题","prompt":"主要关键字是部门，次要是工资，能否把全体记录直接按工资降序？","steps":[{"text":"不同部门的记录仍先由主要关键字决定顺序。"},{"text":"工资只在相同部门内部比较。"}],"result":"不能忽略主要关键字。","exampleType":"misconception","variantType":"misconception","id":"m4-sort-example-2"}],"pitfalls":["先后关键字不是两个互不相关的全表排序。","选区应覆盖整条记录并正确处理表头。"],"takeaway":"丙。","citations":[{"sourceId":"exam","locator":"2024部分：题26，PDF第32页"},{"sourceId":"exam25","locator":"PDF第3—4页，第33题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第51—53、58—59页"}]},"content":{"text":""}},{"id":"m4-lookup","stageId":"m4","type":"concept","title":"SUM、跨表引用与VLOOKUP精确查找","objectiveIds":["m4"],"knowledge":{"title":"SUM、跨表引用与VLOOKUP精确查找","summary":"对应真题：","prerequisites":["掌握单元格地址和$固定区域。"],"mentalModel":"先把表中列的位置与字段名称对应，再选取求和或查找方法。查找不能依赖“名字看起来在第三列”的记忆。","sections":[{"id":"m4-lookup-s1","title":"求和与字段对齐","body":"=SUM(D2:E2)对当前行D、E两格数值求和。原月工资表D列为基本工资、E列为岗位工资、F列为总工资，因此该式适用。先画出列字母—字段名称的对应表，可以避免把表头所在列或其他工资列误加。"},{"id":"m4-lookup-s2","title":"跨表直接引用的前提","body":"=员工信息表!B2直接取该表B2。只有记录顺序确定一致时，拖动该式才始终取到相同工号的姓名。原员工信息表B列是姓名，C列是部门，参考答案写C2会取错字段。若两表顺序可能不同，应按唯一工号查找。"},{"id":"m4-lookup-s3","title":"VLOOKUP的四个参数","body":"=VLOOKUP(A2,员工信息表!$A$2:$D$4,2,FALSE)在区域首列找A2的工号，返回该区域第2列，即姓名。FALSE表示精确匹配；固定区域可防止向下填充时整体偏移。返回列号相对于查找区域，从1开始数，并非工作表的绝对列号。工号为文本时要避免数字/文本类型不一致。"}],"workedExamples":[{"title":"标准例题","prompt":"信息表A列工号、B列姓名、C列部门，按本表A2工号取姓名应怎样写？","steps":[{"text":"查找区域必须从工号列开始。"},{"text":"返回区域第2列。"},{"text":"使用FALSE精确匹配，并锁定区域。"}],"result":"=VLOOKUP(A2,员工信息表!$A$2:$C$20,2,FALSE)。","exampleType":"standard","variantType":"standard","id":"m4-lookup-example-1"},{"title":"边界例题","prompt":"查找区域改为B:D，还能按A列工号查找吗？","steps":[{"text":"VLOOKUP在指定区域第一列找值。"},{"text":"B:D首列是姓名，不是工号。"}],"result":"不能；应把工号列包含在首列位置。","exampleType":"boundary","variantType":"boundary","id":"m4-lookup-example-2"}],"pitfalls":["直接跨表引用不会自动匹配工号。","省略第四参数可能进入近似匹配，不能随意省略。"],"takeaway":"=VLOOKUP(A2,员工信息表!$A$2:$C$20,2,FALSE)。","citations":[{"sourceId":"exam","locator":"2024部分：题4，PDF第29页；题5，PDF第29页；题38，PDF第34页"},{"sourceId":"exam25","locator":"PDF第5页，第42(1)—(2)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第54—55页"},{"sourceId":"ms-vlookup","locator":"Syntax与参数说明"}]},"content":{"text":""}},{"id":"m4-if","stageId":"m4","type":"concept","title":"IF嵌套、绩效档位与公式核对","objectiveIds":["m4"],"knowledge":{"title":"IF嵌套、绩效档位与公式核对","summary":"对应真题：","prerequisites":["会读条件真假和引用位置。"],"mentalModel":"条件公式先列完整规则，再将每个分支翻译为表达式，最后用每一档及临界值验证。","sections":[{"id":"m4-if-s1","title":"IF的三部分","body":{"parts":[{"text":"IF(条件,真值,假值)在条件成立时返回真值，否则返回假值。文本常量用英文双引号，如"},{"code":"G2=\"A\""},{"text":"。嵌套IF把下一层条件放入上一层的假值位置，形成互斥的分类。"}]}},{"id":"m4-if-s2","title":"原奖金表的公式","body":{"parts":[{"text":"G2为绩效级别，A/B/C分别对应50000/30000/20000，E2为工龄、F2为总工资。完整奖金公式为="},{"code":"IF(G2=\"A\""},{"text":",50000,"},{"code":"IF(G2=\"B\""},{"text":",30000,20000))+E2*F2。只有题目已限定级别为A/B/C，最后else才能直接代表C档。"}]}},{"id":"m4-if-s3","title":"空缺部分与整式要区分","body":{"parts":[{"text":"原题已有="},{"code":"IF(G2=\"A\""},{"text":",____)+E2*F2的外框，因此横线应填50000,"},{"code":"IF(G2=\"B\""},{"text":",30000,20000)，不是再次填入完整公式。检查括号是否配对、运算乘法是否先做、各列是否正确。若要求向下复制，行号应相对变化，固定奖金额也可放到绝对引用表中。"}]}}],"workedExamples":[{"title":"标准例题","prompt":"级别B、工龄3、总工资4500，按上述规则奖金多少？","steps":[{"text":"B档绩效工资30000。"},{"text":"工龄部分3×4500=13500。"},{"text":"两部分相加。"}],"result":"43500。","exampleType":"standard","variantType":"standard","id":"m4-if-example-1"},{"title":"边界例题","prompt":"级别可能为空时，最后else直接写20000是否充分？","steps":[{"text":"此时所有非A且非B都会得到20000。"},{"text":"空值并不等于C，应按题设补充错误提示或默认规则。"}],"result":"不充分；必须明确可用级别及空值处理。","exampleType":"boundary","variantType":"boundary","id":"m4-if-example-2"}],"pitfalls":["填空问的是公式片段时不要重复外框。","模拟题会给完整档位条件，避免隐含业务规则。"],"takeaway":"43500。","citations":[{"sourceId":"exam","locator":"2024部分：题38，PDF第35页"},{"sourceId":"exam25","locator":"PDF第5—6页，第42(5)题；考点题设依据。讲解例题、条件辨析与边界说明含编者补充，不将题设当作完整知识证明。"},{"sourceId":"core","locator":"PDF第54—55页"}]},"content":{"text":""}},{"id":"m4-pmt","stageId":"m4","type":"concept","title":"PMT等额付款函数：周期、现金流与参数","objectiveIds":["m4"],"knowledge":{"title":"PMT等额付款函数：周期、现金流与参数","summary":"对应真题：7","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"PMT把同一利率下的等额付款问题写成函数。考试先识别要的是每期付款总额、利息部分还是本金部分，再让利率的周期与付款次数一致；不要把年利率直接当月利率。","sections":[{"id":"m4-pmt-s1","title":"识别函数任务","body":"PMT计算固定利率和等额付款条件下每期应支付的金额，包含本金和利息。IPMT关注某一期的利息部分，PPMT关注某一期的本金部分。2024题7问每月还款总额，因此选PMT。函数名相似不代表结果相同，题目中的“总额”“利息”“本金”是关键限定。"},{"id":"m4-pmt-s2","title":"参数和默认值","body":"通用语法为PMT(rate,nper,pv,[fv],[type])。rate为每期利率，nper为总期数，pv为现值。fv缺省为0，表示贷款到期结清；type为0或省略时按期末付款，1表示期初付款。函数不自动把年转换成月，也不自动包含税费与手续费。"},{"id":"m4-pmt-s3","title":"把周期统一","body":"若年利率12%、一年按12个月等额付款，月利率写12%/12；若期限为2年，总期数写2*12。利率用百分数或对应小数，不能把12%写成数值12。题目给出月利率时无需再除12。期间长短和现金流方向必须在列式前核对。"},{"id":"m4-pmt-s4","title":"符号与零利率","body":"收到贷款本金记作流入，未来偿还记作流出，因此正的pv常得到负的PMT。若题目要求每月付出金额为正数，可在函数前加负号或把pv设成负数，但必须说明口径。零利率、到期结清时付款额的绝对值是本金除以期数，这一边界可以检验函数结果。"}],"workedExamples":[{"title":"标准例题","prompt":"本金12000元，年利率12%，12个月期末等额偿还，求月付款额。","steps":[{"text":"月利率为0.01，期数为12。"},{"text":"可输入=-PMT(12%/12,12,12000)。"},{"text":"用等额现值关系复算，付款额约1066.19元。"}],"result":"每月付出约1066.19元；不含题目未说明的费用。","variantType":"standard","id":"m4-pmt-example-1"},{"title":"边界对照","prompt":"本金6000元，零利率，分12个月结清，PMT返回什么？","steps":[{"text":"每期本金分摊6000/12=500。"},{"text":"正本金按流入约定时，付款是流出。"}],"result":"PMT(0,12,6000)返回-500；月支出金额为500元。","variantType":"boundary","id":"m4-pmt-example-2"}],"pitfalls":["PMT不是仅利息，IPMT才针对某期利息。","先统一周期，再考虑正负号和四舍五入。"],"takeaway":"每月付出约1066.19元；不含题目未说明的费用。","citations":[{"sourceId":"exam","locator":"PDF第30页题7"},{"sourceId":"ms-pmt","locator":"Syntax、Remarks与Examples"}]},"content":{"text":""}},{"id":"m4-pivot","stageId":"m4","type":"concept","title":"数据清单、筛选与数据透视表","objectiveIds":["m4"],"knowledge":{"title":"数据清单、筛选与数据透视表","summary":"对应真题：8","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"筛选像暂时遮住不符合条件的记录，排序改变显示次序，数据透视表则按类别重新汇总。要按专业同时求几门课程平均分，应先有规范的记录表，再选择分组与汇总方式。","sections":[{"id":"m4-pivot-s1","title":"先整理数据清单","body":"一行表头、一行一条记录、一列一个字段。不要把同一专业的所有姓名塞进一个单元格，也不要在明细数据中穿插空白标题行或人工小计。数值字段应是真正的数值，文本形式的成绩可能被当成计数对象。学号等标识字段则宜保留为文本。"},{"id":"m4-pivot-s2","title":"筛选与排序","body":"自动筛选根据条件显示记录，隐藏的记录通常仍在工作表中，不是删除。再次切换筛选功能可取消筛选状态。排序应选定完整关联数据区域，避免只移动姓名列而使姓名与成绩错配。多关键字排序按先后层级比较，第二关键字只在第一关键字相同时起作用。"},{"id":"m4-pivot-s3","title":"透视表的字段布局","body":"原题8按专业计算大学语文、高数和英语的平均成绩，可将专业放到行区域，三门课程放到值区域，并逐个把值字段的汇总方式设为平均值。专业是分组变量，课程成绩是被汇总变量；若要求班级作为列分组，则再把班级放到列区域。"},{"id":"m4-pivot-s4","title":"结果与刷新","body":"原始数据新增或修正后，透视表通常需要刷新；新增行是否纳入源区域也要核对。若平均分被显示成“计数”，先检查源数据类型，再设置汇总方法。平均值要按有效数值记录计算，不能把某组人数多这一事实误读为分数高。"}],"workedExamples":[{"title":"标准例题","prompt":"计算机专业两人成绩80、90，电子商务两人成绩70、90，按专业求均分。","steps":[{"text":"把专业放行区域，成绩放值区域。"},{"text":"选择平均值汇总。"},{"text":"计算机专业(80+90)/2=85；电子商务(70+90)/2=80。"}],"result":"得到两个专业各自的均分85和80。","variantType":"standard","id":"m4-pivot-example-1"},{"title":"边界对照","prompt":"取消筛选后，多出来的记录是新生成的吗？","steps":[{"text":"筛选原先隐藏部分记录。"},{"text":"取消筛选恢复其可见性，记录未因筛选而被删除。"}],"result":"不是新生成记录。","variantType":"boundary","id":"m4-pivot-example-2"}],"pitfalls":["数据透视表默认汇总方法不一定就是题目要求的方法。","刷新与源区域范围是两个检查点。"],"takeaway":"得到两个专业各自的均分85和80。","citations":[{"sourceId":"exam","locator":"PDF第30页题8；第32页题26"},{"sourceId":"ms-pivot","locator":"Summary functions in value fields"}]},"content":{"text":""}},{"id":"m4-fill","stageId":"m4","type":"concept","title":"Excel自动填充、名称框与选择性粘贴","objectiveIds":["m4"],"knowledge":{"title":"Excel自动填充、名称框与选择性粘贴","summary":"对应真题：36、38","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"填充柄延续一个明确的规律，名称框直接定位地址，选择性粘贴控制复制的是值、公式、格式还是位置布局。三种操作处理的是不同目标，不应仅按鼠标动作混在一起记忆。","sections":[{"id":"m4-fill-s1","title":"单元格定位","body":"需要直接跳到Y888时，在名称框输入Y888并按Enter。编辑栏用来查看或编辑当前单元格内容，不是一般的地址跳转输入框；查找针对内容，不应把单元格地址和内容混淆。定位后要核对列Y、行888确实被选中。"},{"id":"m4-fill-s2","title":"建立填充规则","body":{"parts":[{"text":"选中"},{"code":"A1=1与A2=3后拖动填充柄"},{"text":"，常见自动填充延续差为2的等差序列，"},{"code":"A3=5、A4=7"},{"text":"。仅选择一个数值单元格拖动可能是复制该数，受选项和操作键影响；题目应明确选择范围。等比序列可通过序列对话框指定，不能声称随便选两个数拖动必然自动识别等比规则。"}]}},{"id":"m4-fill-s3","title":"公式复制与引用","body":"填充公式会根据位移调整相对引用，绝对引用的固定部分不变。要从C2向下复制到C3，A2变A3；$A$2保持；$A2行变化但列不变；A$2列可变而行不变。公式在向右复制时应重新分析列的变化，不套用向下规则。"},{"id":"m4-fill-s4","title":"转置和只粘贴值","body":"把一行复制成一列选转置。若只要结果不保留公式，可粘贴值；如果结果还要继续联动计算，就应保留公式并核对引用。原题38把第8行放到J列是空间布局改变，关键是转置。转置之后仍需检查公式是否因新位置而改变语义。"}],"workedExamples":[{"title":"标准例题","prompt":{"parts":[{"text":"选中"},{"code":"A1=2、A2=5"},{"text":"，向下填充到A5，结果是什么？"}]},"steps":[{"text":"相邻差为3。"},{"text":"依次为2、5、8、11、14。"}],"result":{"parts":[{"code":"A5=14"},{"text":"，条件是延续等差序列。"}]},"variantType":"standard","id":"m4-fill-example-1"},{"title":"边界对照","prompt":"一行六个差值和要放入一列，且结果固定不再联动，应如何操作？","steps":[{"text":"复制六个单元格。"},{"text":"采用转置布局，并选择只粘贴值的口径。"}],"result":"转置决定行列，粘贴值决定保留结果而不是公式。","variantType":"boundary","id":"m4-fill-example-2"}],"pitfalls":["等差规律与等比序列对话框要区分。","转置不等于排序或数据筛选。"],"takeaway":{"parts":[{"code":"A5=14"},{"text":"，条件是延续等差序列。"}]},"citations":[{"sourceId":"exam","locator":"PDF第30页题6；第34页题36；第35页题38(3)"},{"sourceId":"core","locator":"Excel自动填充和选择性粘贴章节"}]},"content":{"text":""}},{"id":"m4-stat","stageId":"m4","type":"concept","title":"AVERAGE、ROUND、ABS与RANK：评分表的完整计算","objectiveIds":["m4"],"knowledge":{"title":"AVERAGE、ROUND、ABS与RANK：评分表的完整计算","summary":"对应真题：4、5、38","prerequisites":["先读清题目给定的输入、单位、软件版本和目标结果。"],"mentalModel":"先明确一个公式代表哪一步，再固定应共享的参照。均分是行内统计，差值是单项减去该行基准，排序是整列比较，最终给分是把排名映射为分数。这些步骤需要不同的引用规则。","sections":[{"id":"m4-stat-s1","title":"平均与四舍五入","body":"AVERAGE对引用区域内的数值求算术平均，文本和空单元格通常不作为数值参加计算，数值0会参加。ROUND(x,0)四舍五入到整数；INT是向下取整，不能代替ROUND。为避免二进制浮点边界的困扰，模拟题选用可清晰检验的数据，并说明所需保留位数。"},{"id":"m4-stat-s2","title":"差值与混合引用","body":"原题38差值表B2可用=ABS(成绩表!B2-成绩表!$H2)。复制向右时B列应随动到C列，而均分基准必须仍在H列；复制向下时行号应随动。因此使用$H2固定均分所在列，而不是$H$2固定到第一位同学。ABS取差的绝对值，不判断谁给分高。"},{"id":"m4-stat-s3","title":"排名与共同区域","body":"RANK(I2,I$2:I$7,1)按从小到大排名，1表示升序，0或省略表示降序。查找值I2随行变化，比较区域I$2:I$7需要保持所有同学。如果向右也会复制，可把比较区域写为$I$2:$I$7。现代Excel也可使用RANK.EQ。并列会占相同名次并使后续名次跳号，题目要给出并列处理要求。"},{"id":"m4-stat-s4","title":"从名次映射分数","body":"原题第一名99、第二名97、第三名95，可以写=101-J2*2，复制后J2按行改变。该规则只有在题目明确每降一名减2分时成立。原扫描图中均分和差值存在不一致，应以题设和正确公式复算，不能把截图展示结果当成已计算正确的证据。"}],"workedExamples":[{"title":"标准例题","prompt":"评分86、94、91、92、85、86，求四舍五入到整数的均分。","steps":[{"text":"总和534，共6个数。"},{"text":"AVERAGE得到89，ROUND(89,0)仍为89。"},{"text":"=ROUND(AVERAGE(B2:G2),0)。"}],"result":"均分89。","variantType":"standard","id":"m4-stat-example-1"},{"title":"边界对照","prompt":"差值和21、35、36、41、23、19，升序排名并按99起每名减2分。","steps":[{"text":"从小到大为19、21、23、35、36、41。"},{"text":"原序排名2、4、5、6、3、1。"},{"text":"给分97、93、91、89、95、99。"}],"result":"区域必须固定，升序参数为1。","variantType":"boundary","id":"m4-stat-example-2"}],"pitfalls":["AVERAGE包含数值0，但不把空白自动当0。","绝对值、平均值和四舍五入是不同运算。","出现并列时不能擅自编造唯一排名。"],"takeaway":"均分89。","citations":[{"sourceId":"exam","locator":"PDF第34—35页题38；答案第23页"},{"sourceId":"core","locator":"Excel统计函数与引用章节"}]},"content":{"text":""}},{"id":"m4-practice","stageId":"m4","type":"quiz","title":"Excel公式与数据处理 · 分层练习","objectiveIds":["m4"],"content":{"items":[{"id":"m4-guided","module":"m4","kind":"single","practiceLevel":"guided","topicId":"m4-ref","objectiveIds":["m4"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"公式=B2-$H2从B2对应差值位置向右一列复制后是什么？","options":[{"id":"A","text":"=C2-$H2"},{"id":"B","text":"=C2-$I2"},{"id":"C","text":"=B3-$H3"},{"id":"D","text":"=B2-H2"}],"answer":["A"],"explanation":"相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。","feedback":{"correct":"判断正确。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。","incorrect":"先检查关键条件。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。"},"optionFeedback":{"A":"正确。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。","B":"该项不满足题设。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。","C":"该项不满足题设。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。","D":"该项不满足题设。相对列B变C，绝对列H不变；只向右移动不改变行号。 把H改成I是忘记列锁定，把行2改成3是误把横向复制当成纵向复制。分别检查列位移和行位移，可避免凭直觉整体替换。"},"retryHint":"回看对应知识中的标准例题和易错边界，再尝试一次。"},{"id":"m4-independent","module":"m4","kind":"single","practiceLevel":"independent","topicId":"m4-pmt","objectiveIds":["m4"],"novelTransfer":false,"hintLadder":["先辨认题目要求的目标与约束，再检查各选项。"],"prompt":"年利率6%，3年按月等额支付，PMT的rate与nper是什么？","options":[{"id":"A","text":"6%,3"},{"id":"B","text":"6%/12,36"},{"id":"C","text":"6%,36"},{"id":"D","text":"6%/3,12"}
